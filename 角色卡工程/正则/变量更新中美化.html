<div style="width: 80%; margin: 16px auto;">
  <details class="loading-details" style="
    background: #fffdfb;
    border: 1px solid #f3d9de;
    border-left: 3px solid #f6b8c1;
    border-radius: 10px;
    box-shadow: 0 1px 6px rgba(232, 122, 144, 0.10);
    transition:
      height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
      box-shadow 0.25s ease;
    overflow: hidden;
    will-change: height;
  ">
    <summary style="
      padding: 10px 16px;
      color: #a5737f;
      cursor: pointer;
      list-style: none;
      transition:
        background 0.15s ease,
        border-radius 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.5px;
      position: relative;
      background: #fdf4f5;
      overflow: hidden;
    ">
      🌸 变量更新 - <small>正在更新...</small>
      <span class="shimmer-effect" style="
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(232, 122, 144, 0.04),
          rgba(232, 122, 144, 0.10),
          rgba(232, 122, 144, 0.14),
          rgba(232, 122, 144, 0.10),
          rgba(232, 122, 144, 0.04),
          transparent
        );
        animation: shimmer 2s linear infinite;
        transform: translateX(-100%);
      "></span>
    </summary>
    <div style="
      max-height: 300px;
      overflow-y: auto;
      padding: 12px 16px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.7;
      transition:
        opacity 0.2s ease,
        transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      transform: translateY(-8px);
      opacity: 0;
      white-space: pre-wrap; /* 保留换行符和空格 */
    ">
    $2
    </div>
  </details>
</div>

<style>
  /* 滚动条美化，仅限于 .loading-details 内部 */
  .loading-details::-webkit-scrollbar {
    width: 6px;
  }
  .loading-details::-webkit-scrollbar-track {
    background: #fdf4f5;
  }
  .loading-details::-webkit-scrollbar-thumb {
    background: #f0c6cf;
    border-radius: 3px;
  }

  /* 展开状态样式 */
  .loading-details[open] {
    box-shadow: 0 4px 14px rgba(232, 122, 144, 0.16) !important;
  }
  .loading-details[open] > div {
    transform: translateY(0) !important;
    opacity: 1 !important;
  }
  .loading-details[open] > summary > .shimmer-effect {
    animation: none !important;
    background: transparent !important;
  }
  .loading-details[open] > summary {
    background: #fdf4f5 !important;
  }

  /* 交互状态 */
  .loading-details summary:hover {
    background: #fdf4f5 !important;
  }
  .loading-details[open] summary {
    border-radius: 10px 10px 0 0 !important;
  }
  .loading-details summary::marker {
    display: none;
  }

  /* 流光动画 Keyframes */
  @keyframes shimmer {
    100% {
      transform: translateX(100%);
    }
  }
</style>
