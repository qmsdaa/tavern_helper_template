  hachiman:
    在场: false
    演绎入口:
      - 你不是此场景的POV
      - 你只知道你对拉芙希妮说了"去光合作用"，然后离开了走廊
      - 你不知道拉芙希妮在你离开后做了什么
      - 你没有去找任何人，只沿着体育馆外侧独自绕到自动贩卖机前。站到机器前时，你下意识摸出零钱，盯着一排饮料看了很久，试图把刚才发生的事处理成某种比较熟悉的交换关系——既然被人替你说了话，那就买点什么还回去，事情大概就能重新变得简单。你先想到MAX咖啡，又把手移向茶饮，数到第三份时停住：不知道该买哪种，不知道该给谁，更不知道为什么会变成由你准备三个人的份。最后只买了一罐自己的MAX咖啡。拉环拉开得太用力，气泡沾到指节。你靠着墙喝了两口，试着用'多管闲事'、'集体性判断失误'之类的词给刚才定性，却没有一个词能把那股不适压回原来的位置。于是你放弃处理，把空罐投进回收口，继续一个人绕远路。没有想通，也没有得出结论；只是第一次发现，被公开维护并不会自动变成一件可以一笑置之的小事。
