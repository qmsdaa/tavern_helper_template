POV平行动向:
  hachiman: "散场后的走廊——他抓了抓凌乱的短发，说要去外面'光合作用'，然后驼着背溜走了；他不知道在他走后，有人站在空无一人的走廊里，对着手机备忘录敲了很久的字。"
  yukino: "散场后——她已前往主席台处理后续；她不知道有人在走廊里写下了一份关于她的评估。"
  yui: "散场后——她追向叶山离开的方向，试图做最低限度的圆场；她不知道有人在走廊里把她的名字写进了备忘录。"
  laff: "主场轨道，见可用节拍，不变。"

玩家控制边界:
  - 拉芙希妮：由玩家决定评估的具体措辞和深度；决定是否保存/删除；决定写完后再去哪里
  - 其他三人：不可参与此场景

可用节拍:
  - 八幡发出干瘪叹息，说"去光合作用"，驼着背溜走
  - 拉芙希妮确认周围无人，拿出旧手机
  - 拉芙希妮开始敲字——逐条评估三人
  - 评估比企谷八幡：过度理性的自我惩罚者
  - 评估由比滨结衣：行动驱动的共情实体
  - 评估雪之下雪乃：用规则包装的防御性庇护者
  - 写下最后总结：一个脆弱互相刺痛的矛盾体系
  - "我大概，已经被这个体系捕获了"
  - 按保存而非发送
  - 隔着口袋碰了碰粉色发卡，手腕上的旧丝带没有传来灼烧感
  - 拉芙希妮顺着雪乃离开的方向迈开脚步

偏离处理:
  - 如果拉芙希妮选择立刻跟在八幡后面追出去：评估不会发生，这个角色定义时刻被跳过——影响后续所有拉芙希妮的自我认知驱动
  - 如果拉芙希妮写的评估被发现或偷看：会触发完全不同方向的剧情线

推进边界:
  保持当前场景:
    - 拉芙希妮独自在走廊完成评估
  可以推进:
    - →场景36：拉芙希妮跟雪乃回公寓（文化祭第一天傍晚）
    - →拉芙希妮前往主席台与雪乃汇合
  永久失效:
    - 拉芙希妮完成评估后，她对这个团体的"局外人"身份已终结

完成后事实:
  - 拉芙希妮完成了对奉仕部三人的正式评估，确认自己已被这个体系捕获
  - 评估设定了后续所有互动的基础框架
  - 拉芙希妮持有结衣的粉色发卡和雪乃没有要求归还的黑伞
  - 旧丝带的灼烧感暂时消退
  - 八幡离开后曾独自在自动贩卖机前尝试把"被多人公开维护"处理成可以偿还的普通人情，但这一尝试失败；他没有因此接受这种关系，也没有想通该如何面对它，此状态保留至场景37继续复发

氛围锚点:
  - 高跟鞋踩踏地砖的声音在通道尽头彻底消失后的空寂
  - 走廊里冷风的干瘪呼啸
  - 手机屏幕的冷光打在拉芙希妮略显苍白的脸上
  - 键盘敲击声在空荡走廊里显得空灵

