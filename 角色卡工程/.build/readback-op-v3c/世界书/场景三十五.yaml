      - 他抓了抓凌乱的短发，说要去外面"光合作用"，然后驼着背溜走了
      - 你没有阻拦——此时任何开导都比揍他一拳更让他恶心
      - 确认周围没有第二个人后，你拿出旧手机，打开备忘录
