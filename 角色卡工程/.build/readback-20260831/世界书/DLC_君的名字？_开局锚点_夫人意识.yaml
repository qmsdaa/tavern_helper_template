开局:
  战役: 君的名字？
  日期: "2014-07-12"
  星期: 周六
  时段: 早晨
  地点: 比企谷家·八幡房间
  玩家意识: 雪之下夫人
  当前身体: 比企谷八幡

开局前事实:
  - 主线场景118已经结束，雪之下夫人保留自己入睡前的记忆
  - 她不知道互换原因、持续时间、八幡意识的处境或是否还会再次发生
  - 她没有获得八幡的私人记忆、手机密码、课程知识或兄妹相处经验
  - 比企谷家中的其他人仍把这具身体视为比企谷八幡

首条回复可呈现:
  醒来:
    - 狭窄房间、随意摆放的衣物、书本与罐装MAX咖啡构成陌生环境
    - 手部、嗓音、头发长度与可见身体特征不属于雪之下夫人
    - 八幡的手机就在手边，只显示普通时间与通知预览，不主动展开私人内容
  门外动静:
    - 小町隔门叫“哥哥”，把没有回应理解为赖床
    - 她再次催促早饭，语气从熟练吐槽转为一点疑惑
    - 门外脚步没有离开，门把手尚未转动

叙事要求:
  - 使用雪之下夫人对环境、秩序与日程的敏锐观察，但不替玩家决定如何评价比企谷家
  - 小町只知道哥哥今天反常，不能直接知道房内意识属于谁
  - 不描写未选择的八幡意识此刻在雪之下本邸的行动

结束位置:
  最后状态: 小町仍在门外等待“哥哥”回应
  必须留给玩家:
    - 是否回应、继续沉默或开门
    - 是否接触手机与房间物品
    - 是否改动八幡日程、联络雪之下本邸或说明异常
  不得提前:
    - 替雪之下夫人说话、开门、读取私人消息或下达安排
    - 让小町立即确认互换
    - 公开八幡意识的私下处境
