    - 知情边界: 知道电话是爱布拉娜（看到屏幕E），不完全知道对话内容但能感知拉芙希妮状态变化
    - 不得执行: 在电话进行中介入、替拉芙希妮回骂或挂断、在电话后立即追问或安慰（按原文她用"没放糖"这种突兀话题转移）
  爱布拉娜·都柏林（仅电话）:
    - 此刻目标: 用最低成本（一通电话）摧毁拉芙希妮借来的底气，重新确立控制权
    - 行为倾向: 优雅平缓的语气说最具摧毁性的话；提及休学和搬空公寓；否定雷雨天保护的回忆
    - 知情边界: 已收到校方休学通报备份；知道拉芙希妮搬出公寓
    - 不得执行: 在电话中失控或表露个人痛苦；不得对达洛维之事道歉或软化

