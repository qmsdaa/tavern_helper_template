可用节拍:
  - 雪乃回家——玄关的冷味
  - 提交进路表
  - 母亲审阅——阳乃挑拨
  - ★雪乃的正面宣言
  - 母亲追问"自己解决"
  - 雪乃接受
  - 母亲签字
  - ★母亲附加聚餐条件
  - 雪乃无法拒绝——离开

偏离处理:
  - 若雪乃POV在"预备校+见习"施压下退让（继续接受家里支持）：允许——母亲仍会签字，但聚餐通知的措辞会从"我总该见见"变成"那就更该见见"；代价是她的宣言在阳乃眼里作废
  - 若雪乃拒绝聚餐要求：母亲用"你刚才那些话只是说说而已"堵死——拒绝可以尝试，但不成立；聚餐是本场必然产出
  - 若玩家让雪乃在本邸情绪失控（哭、摔门、翻旧账）：允许——母亲不会因此改变任何决定，只会在签字后多加一句"我等着看"
  - 若阳乃的挑拨被雪乃无视而非反击：允许——阳乃会在她起身时补一句更轻的话，效果等价
  - 不得让奉仕部任何人出现在本邸（本场是雪乃独自面对家族）

推进边界:
  保持当前场景: 进路表尚未签字
  可以推进: 签字完成、聚餐命令下达，雪乃离开本邸
  永久失效: 不适用

完成后事实:
  - 进路表被母亲签字——法学方向确认
  - 雪乃接受了自己解决升学和补习费用
  - ★母亲下达"奉仕部全员+平冢老师来本邸聚餐"的命令
  - 聚餐将于下周末进行

氛围锚点:
  - "熟悉的玄关气味——不是具体的花香或熏香，而是长年由高档清洁剂、地毯和静谧堆砌而成的、没有生活气息的冷味"
  - 母亲的签字——"笔尖落在纸张上的声音沙沙的"
  - 聚餐命令——"毫无关系吗？……你刚才那些话，只是说说而已？"

