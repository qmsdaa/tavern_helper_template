地点: "雪之下家本邸 · 起居室"
人物: "雪之下雪乃、雪之下母、雪之下阳乃（+ 提及：奉仕部全员、平冢静）"
事件焦点:
  类型: 角色
  角色:
    - "雪之下雪乃"

场景功能:
  - 雪乃回到本邸——向母亲提交进路调查表
  - ★雪乃的正面宣言："我选择的是法学方向。不是家里替我安排的见习，也不是毕业后的任职去向。请不要把它们当成一份不可拆分的东西"
  - 阳乃挑拨："最后还不是回到妈妈替你画好的格子里"——雪乃反击："这和她们没有任何关系"
  - ★母亲的反击："预备校、推荐人与见习机会——你是否做好了不再用未来的服从交换家里支持的准备"
  - 雪乃接受："除了现在公寓的基本生活费用之外，关于升学和补习的事项，我会自己解决"
  - ★母亲签字——但附加条件："下个周末，让平冢老师和奉仕部全员来家里吃顿饭"
  - 雪乃试图拒绝——母亲："你刚才那些话，只是说说而已？"——无法反驳

进入状态:
  已发生:
    - 场景81：雪乃独处确认法学
    - 场景80：PTA会议+走廊拦截
  当前局面:
    - 雪乃回到本邸客厅
    - 母亲在主位，阳乃在侧
  未发生:
    - 进路表尚未被提交
    - 聚餐通知尚未下达

世界推动: 本邸内的权力场域

NPC动机:
  雪之下母:
    - 此刻目标: 测试雪乃的"独立"是否经得起现实代价的拷问
    - 行为倾向: 审阅进路表→用"预备校+见习"施压→雪乃接受自己解决→签字→附加聚餐条件→"既然你坚持这是独立决策……我总该见见那个让你相信自己的环境"
    - 表达意图: "即使我在这里签了字，也不代表我认可了你对责任的解释。我会看着你能在这种拒绝安排的清高里坚持多久。"
  雪之下雪乃:
    - 此刻目标: 在母亲面前确认法学是自己的选择——不是服从也不是逃开
    - 行为倾向: 提交进路表→被阳乃挑拨→正面回应→接受"自己解决"→被聚餐要求击中——无法拒绝
  雪之下阳乃:
    - 此刻目标: 挑拨雪乃的自我怀疑——但发现雪乃变了
    - 行为倾向: 用"还是回到格子里"施压→提到奉仕部三人→被雪乃冷硬切割→看到母亲签字时意外

信息边界:
  公开: 进路表内容和签字
  局部: 聚餐要求（将传导给奉仕部全员）
  隐藏: 母亲对奉仕部的真实评估意图

