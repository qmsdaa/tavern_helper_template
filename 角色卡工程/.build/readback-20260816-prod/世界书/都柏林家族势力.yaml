都柏林家族:
  性质: 爱尔兰旧财阀·跨英爱两岛的贵族家族
  历史: 维多利亚时代黑工起家→世界大战军功获封→推动爱尔兰独立积累政治资本
  权力结构:
    - 家族议会设于伦敦克拉伦登街十七号
    - 现任家主科尔马克（拉芙之父）已隐退·保留一票否决权
    - 实权由长女爱布拉娜掌控·任翡翠资本执行董事
    - 玛格丽特·都柏林（姑婆·"苇草"昵称赋予者）·内部温和派
  内部裂缝:
    - 长辈派系 vs 爱布拉娜权力控制
    - 温斯顿（在日教育合作方）有良心·属于拉芙阵营潜在资源
    - 科尔马克虽隐退但保留否决权·爱布拉娜有操作权无决策权
  对日监视体系:
    - 家政太太: 日本本地女性·公寓日常监视·爱布拉娜体系终端
    - 温斯顿: 教育合作方·转学经手人；是否转型为拉芙自主选择的代理人取决于实际剧情
    - 家族专机: 拉芙的手机·冰冷金属烙铁·反抗程度的量化载体
    - 定期汇报与续期权: 拉芙每年需续期·爱布拉娜可随时召回
