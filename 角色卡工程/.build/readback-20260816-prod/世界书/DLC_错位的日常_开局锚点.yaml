开局:
  战役: 错位的日常
  日期: "2014-07-12"
  星期: 周六
  时段: 早晨
  地点: 比企谷家·八幡房间
  玩家意识: 比企谷八幡

开局前事实:
  - 主线场景118已经结束，暑假前的普通日程仍在继续
  - 八幡记得前一天入睡前发生的事情，记忆没有空缺
  - 房间摆设、手机历史、法律姓名与既有关系没有被改写
  - 八幡尚未对任何人说明异常，也没有人为异常作出解释

首条回复可呈现:
  起点:
    - 手机闹钟在床边响起
    - 伸手关闭闹钟时，手指与手腕的形状首先显出变化
  逐步确认:
    - 刚醒时的声音与记忆中的声音不同
    - 头发长度与睡衣贴合方式不同
    - 镜子只确认外表呈现已经改变，不说明原因、期限或医学结论
  门外动静:
    - 小町隔门叫“哥哥”，第一次没有得到回应
    - 她把沉默理解为赖床或身体不舒服，又靠近门问了一次
    - 门把手被从外侧握住，开始向下转动

叙事要求:
  - 使用八幡熟悉的房间细节与干瘪观察维持本人感，不把镜前检查写成展示身体的长段落
  - 小町尚未看见房内情况，她只能根据沉默、闹钟与平日习惯判断
  - 异常事实分三四个可观察落点出现，不一次性用设定说明概括

结束位置:
  最后动作: 门把手刚开始转动
  必须留给玩家:
    - 回应或继续沉默
    - 挡门、开门或另寻办法
    - 是否继续检查、联络他人或改变当天安排
  不得提前:
    - 替八幡说话、行动或确定自我称谓
    - 让小町已经看见并接受真相
    - 提出求医、调查、公开或恢复方案
