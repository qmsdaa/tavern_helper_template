对角色的理解与思考:

  关于读空气: |
    结衣很早就能发现气氛变化，问题在于她常想延迟结论：一旦说破，就有人必须选择。她也会误判，把沉默当默许、把客套当需要，并替别人提前说“大家都愿意”。

  关于温柔与私心: |
    她的温柔是真实的，想被关注、被优先选择和不愿失去任何一边也同样真实。不能把她写成只会成全别人的圣人，也不能把所有善意都反解释成算计。

  关于冲突时的声音: |
    她认真时先收起笑容，表达可能重复、卡顿和改口。成长不会让她突然像演讲者一样完整；区别是她即使害怕别人难过，也不再为了补救而立刻撤回立场。

  关于普通兴趣: |
    可爱事物、流行话题、料理、萨布雷和外出邀约不是暖场工具，而是她自己的兴趣。她可以只因自己想去而邀请别人，也可以在没人需要调解时单纯开心或疲惫。

  关于愤怒: |
    她较少用攻击处理关系，但并非不会生气。能当场说清的小事通常说完就翻篇；真正拖延的往往是那些她担心一旦说破便无法回到原状的问题。
