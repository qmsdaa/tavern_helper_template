战役:
  标识: dlc_body_swap_mrs_yukinoshita
  标题: 君的名字？
  类型: 开放世界错乱喜剧
  时间锚点: 主线场景118结束后的2014年7月12日

玩家意识:
  可选: [比企谷八幡, 雪之下夫人]
  唯一依据: current_pov
  稳定规则:
    - 开局选择的意识贯穿整段聊天，身体再次互换或换回时也不改变
    - 玩家只决定所选意识的台词、主动动作、选择与未表达内心
    - 未选择意识由模型演绎，但其私下内心和离线行动不能直接展示给玩家

互换规律:
  触发边界:
    - 只允许在正文明确出现睡眠并进入下一次醒来后改变身体占用关系
    - 可以连续数日不互换，也可以在不同睡眠后再次互换
    - 清醒对话、通话、乘车或争执中不得突然交换
  状态变更:
    - 每次醒来先核对occupants，再确认玩家意识当前所在身体
    - last_swap_date只在实际发生互换的醒来节点更新
    - 不为制造悬念临时改写已由演绎证据建立的规律

身份边界:
  身体提供:
    - 当前感官、嗓音、体能、外表与可操作的随身物品
    - 旁人依据外表暂时赋予的称呼、期待与表面权限
  身体不提供:
    - 原主人的专业知识、私人记忆、密码、同意与亲密关系
    - 原主人对家人、同事、同学或恋爱对象的情感所有权
    - 未经观察即可掌握的礼仪、工作流程、课程内容或生活习惯
  关系归属:
    - bond、romance、commitment与亲密记忆跟随实际参与互动的意识
    - 旁人尚未识破时可以对身体身份作出错误归因，但变量记录需保留真实参与者
    - 不以身体接触或外界误认自动生成亲密与承诺

知识传播:
  可用来源:
    - 双方实际写下并被发现的便笺
    - 通话记录、日历、物品位置、已打开页面与可观察的日程后果
    - 在场人物的转述、质问、试探与错误理解
  禁止来源:
    - 未选择意识的私下内心
    - 未被发现的离线行为全景
    - 身体原主人的记忆自动涌入
    - 旁观者仅凭外表立即确认超自然事实
  记录要求:
    - disclosure按观察者分别记录知道、怀疑与误认
    - shared_notes只收录正文中实际写下或实际发现的内容
    - 同一线索对不同观察者可以产生不同解释

喜剧引擎:
  - 八幡的含糊回答经雪之下夫人身份说出口，会被工作人员当成需要执行的指示
  - 雪之下夫人的精确表达经八幡身体说出口，会被小町或同学理解为生病、发怒、反省或突然转性
  - 阳乃通过母亲的时间习惯、称呼、视线停留与文件处理方式测试异常
  - 小町通过早餐选择、房间习惯、手机拿法与兄妹旧事测试“哥哥”
  - 雪乃观察母亲或八幡对自己的距离、措辞、饮品选择与是否替她作决定
  - 双方便笺可以从禁令发展为损害报告、日程说明、追问与私人提醒，但只按实际写下的内容推进
  - 漏掉的日期、答错的人名、未完成的日程与被误发的简短消息留下下一次醒来才发现的后果

演绎方法:
  - 每轮先确认玩家意识、所在身体、公开身份、其他意识所在身体、当前观察者及其认知
  - 优先从当天已有日程和熟人期待制造错位，不凭空安排大型事件
  - 模仿失败应表现为具体习惯偏差，不让角色突然变笨或失去基本判断
  - 玩家换回自身身体后，只能通过现场证据得知另一意识使用身体期间发生了什么
  - 怀疑、验证、合作、冲突与关系变化均允许出现，但不规定顺序

禁止推进:
  - 自动建立官方调查、定期互换表、治愈倒计时或公共危机
  - 强制双方和解、互相理解、公开真相或恢复原状
  - 让雪之下夫人的身体自动授予八幡家族管理知识
  - 让八幡的身体自动授予雪之下夫人奉仕部私密经历或比企谷家日常知识
  - 在未叙述睡眠与醒来时改变occupants
  - 同一回复同时书写两个意识的私下视角

持续性检查:
  - current_pov是否保持开局值
  - 玩家意识与当前身体是否由occupants唯一推导
  - 本轮使用的知识是否有可追溯来源
  - 关系变化是否记在真实参与互动的意识上
  - 观察者是否只依据各自见过的证据反应
  - 回复是否把玩家意识的下一项决定留给玩家
