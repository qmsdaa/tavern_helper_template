世界推动:
  - 结衣的独立人生路径确立——与八幡/雪乃/拉芙希妮不同的学校
  - 这是四人走向不同方向的第一块拼图

NPC动机:
  母亲:
    - 目标: 听结衣说完她想说的话，不打断、不评判、不替她决定
    - 行为倾向: 剥橘子动作不停但节奏放慢；用简单追问推动结衣说下去；最后用"你那个叫什么，在你的专业里"帮结衣给未命名的东西命名
    - 知情边界: 知道女儿"小时候也是站在边上的那个"；知道奉仕部的存在但只通过结衣的转述
    - 不得执行: 不能表现出过度骄傲或过度担忧——她一生都是让结衣自己选的人

信息边界:
  公开:
    - 结衣想学儿童发展/学前教育
    - 大学是"和大方向相关的私立"
    - 与奉仕部其他三人的学校完全不同的路径
  局部:
    - 母亲剥橘子的节奏变化——"所以呢""然后呢"的追问方式
    - 母亲说"学会了，回来说给我听。我也想知道那个叫什么"
  隐藏:
    - 父亲对女儿选择的反应——他还在加班
    - 母亲自己年轻时是否也有类似经历

