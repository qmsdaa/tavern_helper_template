进入状态:
  已发生:
    - 毕业相册委托受理（场景139）
    - 父亲加班，晚饭只用了母女两副碗筷
    - 结衣已告诉小町"想学儿童发展"——但那不是正经回答
  当前局面:
    - 暖桌还开着，电视音量调到刚能听见
    - 母亲在剥橘子
    - 结衣有话说但绕着弯——从相册的事讲起
  未发生:
