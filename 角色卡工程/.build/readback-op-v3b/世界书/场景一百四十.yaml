  - 玩家不能通过任何角色在此时联系结衣——这是她的私人时刻

可用节拍:
  - 暖桌开着，两副碗筷 / 结衣把腿收进暖桌被子
  - 结衣起话头——先说相册的事，不是直接说志愿
  - 描述委员会照片裁人的问题 / 母亲剥橘子慢下来
  - 结衣说"不能替别人决定谁值得被记住。让每个人自己选。"
  - 母亲问"很大的工作量"——结衣说接下时没想过工作量
  - 关键句：结衣说"委员会选照片的人和被裁出照片的人，是同一种人——都是高中生。只是有人习惯了站在中间，有人习惯了站在边上。"
  - 母亲说"你小时候也是站在边上的那个" / 结衣说"现在有时候还是。但站在边上的人，看得到中间的人看不到的东西"
  - 母亲把话题拉回"所以儿童发展"——她在等结衣自己说
  - 结衣坐直——"我不想替任何人决定什么是好的……但我想学会怎么让每个人有办法替自己说出来。不是替他们说，是把他们够不到的说话的东西递过去。"
  - 母亲问"你这些朋友今天也在吗"——结衣复述三人的反应
  - 关键句：结衣说"不是因为喜欢的人才选这个方向的。我是因为我自己。"
  - 结衣描述"气氛负责人"的自我认知转变——从"只是比较会看人脸色"到"不让任何人被漏掉"
  - 母亲问"你告诉了那些人了吗"——结衣说"明天，今天只想先跟你说"
  - 问"为什么"——结衣说"因为你是第一个教会我不替别人决定的人"
  - 母亲问"那个叫什么，在你的专业里"——结衣说可能叫"观察"也可能叫"陪伴"
  - 母亲说"那就去学。学会了，回来说给我听。我也想知道那个叫什么。"
  - 结尾：多做一个布丁带去活动室 / 母亲加一颗草莓——"因为今天你替全班做了决定。那个决定本身，值得一颗草莓。"

