场景: 73
幕: "第四幕·冬假→三学期"
时间: "2014年1月11日 · 周六 · 三学期第一周"
地点: "总武高中 · 特别栋 · 奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、由比滨结衣、比企谷八幡、一色彩羽"
正文: |
  折叠好的牛皮纸袋被放在桌子中央，由比滨结衣像是变魔术一样从里面拿出五颜六色的独立包装点心。

  "这个是草莓味的，那个是抹茶的。虽然是我妈妈买的，但我昨天晚上可是亲自帮忙包装了哦！"

  结衣的声音让原本冷清的活动室升起了几分温度。塑料包装纸摩擦的清脆声响在长桌上散开。

  "能把现成的东西重新包装出自制失败的错觉，由比滨，意义上你也算是个人才了。"比企谷八幡盯着手里那个用粉色胶带绑得歪歪扭扭的小袋子，发出干瘪的评价。

  "小企好烦！不吃就还给我！"

  "既然送出去了，哪有收回的道理。卡路里这种东西，吃进肚子里才算安全。"八幡利落地撕开包装，将饼干塞进嘴里。

  "好甜……"一色彩羽坐在离热水壶最远的椅子上，双手捧着抹茶饼干，一边咬一边眯起眼睛，"学姐，其实我来这里不是为了偷懒，是因为学生会的烟雾报警器昨天坏了，我现在是作为难民来寻求奉仕部的人道主义救援的。"

  一色今天连假装搬文件过来的步骤都省略了，直接空着手，裹着那件没有扣好扣子的校服外套，光明正大地坐在了活动室里。

  雪乃坐在长桌靠热水壶的一端，看着一色将饼干渣掉在地板上。

  "如果你真的是难民，我会建议你立刻向平冢老师提交救助申请，而不是坐在这里消耗我们有限的茶点和氧气。"雪乃的声音依旧清冷，听不出任何波澜。

  "学姐好严格——"一色毫不介意地拉长了声音，顺便把手伸向了结衣面前的草莓饼干，"不过，雪之下学姐今天看起来心情不太好呢，是昨晚没睡好吗？"

  雪乃端着茶杯的手指微停顿了一瞬。

  她没有回答一色的问题，而是将视线越过长桌，落在了坐在稍远处的拉芙希妮身上。

  拉芙希妮今天穿得很规矩。外套已经脱下搭在椅背上，纯色的内搭勾勒出单薄的肩膀。左手腕上那条红色的绸带缠绕在深青色针织衫的袖口外，随着她端茶杯的动作微微晃动。右手腕隐藏在袖口里，看不见那截烧焦的旧丝带。

  桌角放着她的单肩书包。

  那就是雪乃从走进这间活动室开始，就一直试图忽略，却又被吸引注意力的源头。

  昨天傍晚的交锋历历在目。那份初版调查报告像一颗随时会引爆的定时炸弹，此刻就藏在那个普通的黑色书包里。她记得里面的每一行字：踩到脚时的重心偏移数据。受试者在被注视时会下意识摩挲茶杯边缘。还有那条旁注——实验者自身心率在特定条件下出现异常波动。

  这种悬而不发的等待，反而让雪乃的耐心被一点点磨薄。

  "一色同学，"雪乃放下茶杯，声音略微提高了一点，打断了结衣和八幡的争论，"如果你吃完了，请把桌面的残渣清理干净。我们这里还有正经的工作需要处理。"

  一色鼓起脸颊，不情愿地扯过一张纸巾开始擦桌子。

  雪乃将目光重新锁定在拉芙希妮身上。她的脊背挺直。

  "都柏林同学。关于昨天提到的餐饮业调查进展，"雪乃的手指搭在面前的笔记本边缘，"你说过今天下午会提交一份详细的排查报告。"

  原本喧闹的部室安静了一秒。结衣茫然地左右看了看，八幡则是连眼皮都没抬，默默把手里的文库本往下挪了半寸，完全没有要参与的意思。

  拉芙希妮放下茶杯。杯底碰到桌面，发出一声轻响。

  "确实如此。"拉芙希妮的声音很平稳，翡翠色的眼睛迎上雪乃的视线，"报告已经整理完毕了。"

  她微微侧过身，拉开书包的拉链，从中取出一叠用长尾夹固定好的A4纸。

  雪乃紧紧地盯着那一叠纸。厚度大概有七八页。里面会有什么？那些关于踩脚的记录？还是那些关于心率异常的旁注？

  拉芙希妮站起身，走到雪乃身边。因为距离的拉近，衣服布料摩擦的微小声音和干燥的、类似于旧纸张的气息包围了雪乃。

  "这是您要的报告，部长。"

  拉芙希妮将纸张放在雪乃面前。没有多余的动作，也没有意料之中的言语挑衅。

  雪乃的心脏在胸腔里沉重地跳动着。她不敢看拉芙希妮的眼睛，只能将视线死死地钉在那份报告的封面上。

  普通的标题，标准的格式。

  雪乃伸出手，指尖碰到纸张的边缘。即使隔着空气，她也能感觉到八幡和一色偶尔投来的好奇目光。

  她翻开第一页。

  餐饮业问卷的数据回收统计。饼状图，柱状图。没有任何逾矩的文字。

  雪乃暗自松了一口气，翻开第二页。顾客满意度分析。

  第三页，第四页……

  她翻页的速度越来越快。那些预想中的、让她难堪的"客观记录"，全都不存在。整份报告专业、详实，挑不出毛病。

  只是虚惊一场？或者说，这只是对方恶劣的恐吓？

  雪乃的肩膀开始放松，她甚至已经在脑海里组织好了几句用来评价排版格式的挑剔言辞，准备以此作为重树威严的结尾。

  她翻到了最后一页。

  这是一张空白的附录页。除了页码之外，什么都没有。

  然而，在纸张的正中央，贴着一张淡黄色的方形便利贴。

  便利贴上没有文字。只有用黑色中性笔画的一个简笔画小人。

  那是一只圆滚滚的熊猫。虽然画风潦草，但那件标志性的风衣，和那顶猎鹿帽，被勾勒得清清楚楚。更要命的是，在简笔画熊猫的脖子位置，画了一个比潘先生本身还大一圈的蝴蝶结。

  在这间教室里，只有两个人知道这个图案代表着什么。

  那是她昨晚试图用来寻求理智支撑，却最终成为彻底内耗源头的——福尔摩斯潘先生。

  雪乃的手指瞬间僵住了。

  刚要脱口而出的评价被硬生生地卡在喉咙里。那张便利贴上的简笔画，是一个无声的嘲笑。它没有抄进昨天的任何一行笔记——因为根本不需要。这张小小的便利贴，远比任何长篇大论的"客观记录"都要致命。它直接跳过了那份初版报告的每一行文字，戳中了她昨晚那场试图用逻辑解释情感、最终却溃败在红绸带上的全部心思。

  拉芙希妮知道。她不仅知道雪乃昨晚对着那只玩偶想了什么，她连雪乃翻到最后一页之前会经历怎样的放松都算到了。然后精准地、安静地，把所有东西压进一只简笔画熊猫里。

  "雪之下学姐？报告有问题吗？"一色的声音从旁边飘过来。

  "没什么大问题。"雪乃听见自己用不属于自己的紧绷声音回答，"只是……最后一页的附录，排版过于随意。作为一个要求严谨的社团，我不允许出现这种没有意义的……附着物。"

  她迅速地将最后一页盖住，用手掌死死地压在纸面上。手指因为用力而微微发白。

  "欸？排版这么严格的吗？"结衣探过头来想要看。

  "由比滨同学，吃完点心请去洗手，不要弄脏文件。"雪乃立刻抬高了下巴，视线从那张便利贴移开，直视前方，试图用最严厉的部长姿态来掩盖脸上正在攀升的热度。

  八幡发出了一声意味不明的轻咳。

  拉芙希妮站在雪乃身边，没有退开。

  "原来如此。我会注意规范这些'没有意义的附着物'。"拉芙希妮的声音里带了一点难以察觉的柔软，"或者，部长更希望我把那些实质性的问题，以文字的形式补在上面？"

  "不需要重写。"雪乃打断了她，咬着牙说道，"把它带回去，把没用的东西撕掉。另外，下不为例。"

  拉芙希妮看着雪乃泛红的耳尖和试图用茶杯挡住大半个脸的动作。她的手指悬在茶杯边缘，停了半秒。

  "好的，部长。"
