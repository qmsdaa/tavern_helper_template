场景: 117
幕: "第七幕·重新为奉仕部命名"
时间: "2014年7月5日 · 周六傍晚—夜"
地点: "千叶市内·河岸神社的夏季游园会"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林、比企谷小町、川崎大志"
POV: "共享场景／零POV"
正文: |
  梅雨还没有正式过去，但今天的雨云刚好在傍晚前散开了。

  河岸的参道两边，红白相间的灯笼一盏接一盏亮起来，把湿漉漉的柏油路照出温暖的光。章鱼烧的酱汁味、烤玉米的焦香、刨冰糖浆的甜气，混着远处太鼓的闷响，在七月的夜风里一层一层地叠上来。

  六个人在参道入口的石鸟居下碰头的时候，天刚擦黑。

  "哇——拉芙希妮姐！转一圈转一圈！"小町第一个冲过去。

  拉芙希妮依言转了半圈。水色的浴衣下摆旋开一个克制的弧度，上面印着的朝颜花在灯笼光里一明一灭。头发盘了起来，露出平时藏在发丝里的耳廓。

  "好看！超好看！"结衣绕着她看了两圈，像是在验收自己的工作成果，"腰带系得很正吧？下午可是我亲自系的！"

  "你自己那件都快系到背后去了。"八幡穿着皱巴巴的甚平，站在三步开外，一只手插在口袋里。

  "小企你闭嘴啦！"

  雪乃站在稍远一点的地方，深色的浴衣上落着几朵紫阳花。她的视线在拉芙希妮身上停了一拍，点了点头，只给出两个字："合身。"

  "……嗯。"拉芙希妮低头看了看自己的袖口，"这件，是我自己选的。"

  没有人追问这句话。小町已经拽着大志的袖子往人堆里冲了。

  捞金鱼的摊子前，大志蹲得比谁都稳。

  纸网入水，角度压得极低，手腕纹丝不动。旁边的小町已经弄破了三张网，气得直跺脚，他那边却连水花都很少溅起来。第四条金鱼终于进网的时候，纸面刚好破开一个洞——他两只手跟着一合，把鱼连同水一起捧了起来。

  "给。"他把金鱼倒进小町举着的塑料袋里，耳尖通红，"运气好。"

  "大志同学，你刚刚那下超帅的。"结衣在旁边看得眼睛发亮。

  射击摊前，八幡以和他那副死鱼眼毫不相称的命中率，一连打下了三个奖品。

  摊主大叔的脸色越来越微妙。八幡把第三个奖品——一个做工粗糙的熊猫摆件——随手塞进小町怀里，自己只留了一瓶汽水。

  "哥哥，你什么时候练的？"

  "没练。只是对'把东西从高处弄下来'这种事比较有心得。"

  小町抱着熊猫摆件，盯着哥哥看了两秒："……加五分。就五分哦。"

  面具摊的木架上，一排狐狸、天狗和歌舞伎的脸谱中间，夹着一张圆耳朵的熊猫面具。

  雪乃的脚步在那里慢了半拍。

  只有半拍。她很快跟上了前面的人，什么都没有说，也什么都没有买。拉芙希妮走在她斜后方，视线在那个熊猫面具上轻轻掠过，随即移开，端起手里的苹果糖咬了一小口。

  糖衣碎裂的声音，混在太鼓声里。

  "雪乃同学，过来一下。"

  走到两座屋台之间的人流间隙，拉芙希妮忽然停住，低声唤了一句。

  雪乃回过头。拉芙希妮侧过身，把腰带的方向让出来——也不知道是刚才被人潮挤的，还是转身时挂到了哪里，腰带上打的结松了一线，蝴蝶结的一边微微塌了下去。

  雪乃看了她两秒，伸出手，把那截松开的带子抽紧、重新理平，一气呵成。

  "歪了。"

  "……嗯。"拉芙希妮站直了些，"谢谢。"

  结衣在前面回过头，刚要问怎么了，被小町拉了一把："结衣姐，那边那边，章鱼烧要没了！"

  烟火是九点整开始的。

  六个人在河堤的草地上找了块空地。大志帮小町拎着那袋金鱼，八幡盘腿坐在最边上，汽水瓶插在草里。

  第一发烟火升上去的时候，所有人都抬起了头。

  金色的光在夜空里撑开，又簌簌地落进河面。结衣的欢呼声和爆炸声叠在一起。小町拿出手机连拍，拍糊了七八张也不在乎。大志怀里的金鱼袋被火光映得透亮，那条金鱼在袋子里安静地转了个身。

  第二发，第三发。

  拉芙希妮仰着脸，水色的衣袖在夜风里轻轻动着。烟火的光一朵一朵落在她的侧脸上，又熄下去。她很久没有眨眼睛，手指拢在袖口里，把那个小摊买来的朝颜簪子从发间取下来，握在掌心看了看，又抬手重新插了回去。

  最后一发大轮在头顶炸开的时候，整片河岸亮如白昼。

  "呐，"结衣在渐暗下来的天光里突然开口，声音还带着烟火的热气，"明年，大家再一起来吧！"

  没有人立刻接话。河面上还漂着最后几粒没有熄尽的光。

  "……嗯。"

  拉芙希妮的声音很轻，但在这片安静里，谁都听见了。

  回去的路上，屋台的灯笼一盏一盏熄下去。六个人的影子在参道上被剩下的灯光拉得时长时短，金鱼缸里的水声、木屐的咔哒声、小町断断续续的哼歌声，一路没有停过。

  风从河面上吹过来，带着水汽的凉意。拉芙希妮抬手按住被风吹乱的头发，指尖碰到了那枚朝颜簪子。

  簪子还在。她就没有再多按，把手放回了袖子里。
