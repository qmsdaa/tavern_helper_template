场景: 12
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月上旬 · 场景十一当晚"
地点: "单轨电车 → 拉芙希妮的公寓（美滨区）"
人物: "拉芙希妮·都柏林、爱布拉娜·都柏林（视频通话）"
正文: |
  城市的灯光一块接一块地亮起，单轨电车的车厢里只有寥寥几人。

  拉芙希妮坐在靠窗的位置。玻璃上倒映着她白净的面容，以及玻璃外快速向后飞掠的霓虹光带。她的双手规整地叠放在膝盖上，没有去触碰口袋里的手机。

  那部家族专用的通讯设备像是一块冰冷的金属烙铁，时刻准备着宣告某人的意志。不去碰它，不去看它，这种延迟接收指令的空白时间，是她目前能争取的、最微小的一种抵抗。

  电车到站。

  走过熟悉的高级公寓大厅，穿过静谧的走廊，直到站在自己的房门前，手机才发出了轻微的震动。

  不是那部专机。是家政太太发来的短信：

  "拉芙希妮小姐，今晚要熬高汤吗？"

  她看了一会儿屏幕。手指在键盘上敲击。

  "今晚不用了，我自己解决。谢谢。"

  发送完毕，她推开门。玄关处的灯光感应亮起。鞋柜上方摆着一个相框，里面装着一张从塔拉庄园寄来的、代表着家族某种荣誉或纪念的照片。以往每次回家，她总会在这里停顿半秒，像是在进行某种无声的汇报或确认。

  但今天没有。

  她径直走过了那个相框，甚至没有让目光在上面停留任何一个瞬间。皮鞋踩在地板上，发出沉闷而规律的脚步声，直到浴室的门被关上。

  热水从花洒里倾泻而下。

  温度调得比平时高了一点。水流冲刷着她的浅金色长发，顺着脊背流下。这和下午在走道屋檐下被滴落的冷水打湿不同，这是她主动的、有意识的浸泡。

  水声掩盖了呼吸的节奏。

  拉芙希妮关掉花洒，随手扯过一条浴巾。浴室镜子上蒙着一层厚厚的水汽。她抬起手，用手背在镜面上擦出一块清晰的区域。

  镜子里的那个人，湿漉漉的金发贴在苍白的脸颊旁。视线下移，她看到自己的锁骨旁边，因为刚才水温偏高而泛起了一点极浅的红色。

  那点浅红，让她突然想起了走道上的那个画面。

  雪之下雪乃手指绕着发辫，肩膀紧绷，语气生硬得像是在背诵某项校规。

  "明天感冒了也没人去看你。"

  四个字，像是某种包裹着碎玻璃的糖果。尖锐，直白，却又在最深处藏着某种本人拼命想要掩饰的焦虑。

  镜子里的拉芙希妮看着那点浅红，嘴角不受控制地往上牵扯。她又笑了一下。在这个只有水滴声的密闭空间里，这个笑容比下午那个显得更加真实，也更加疲惫。

  她推开浴室的门，走进卧室。

  毛巾依然搭在肩膀上，她没有去拿抽屉里的吹风机。水珠顺着发梢一滴滴地掉落在地板上、睡衣的领口上。任由头发自然风干，这是在塔拉庄园绝对不被允许的"不合规行为"。

  她走到书桌前，从校服外套的口袋里取出了那颗不知名植物的种子。

  这是一颗很小的、外壳有些干瘪的种子。原本，她打算把它夹进那本英日对照的诗集里，作为某种短暂的纪念。但手指触碰到诗集边缘时，她停住了。

  诗集是她带到学校去的东西，也是随时可能被家政太太在打扫时翻动的"公开物件"。在这里面，没有任何秘密是安全的。

  她收回手，拉开了书架最下层的一个抽屉，从最里面抽出一本几乎从未翻阅过的、厚重的《圣经》。

  她翻到中间的某一页，将种子小心地放了进去，然后合上书本。厚重的纸页瞬间吞没了那颗微小的种子，就像它从未存在过一样。

  最后，她从另一个口袋里拿出了那包面巾纸。

  包装袋有些皱了。透明的塑料膜上印着一只憨态可掬的卡通熊猫。这是雪之下雪乃用近乎粗暴的方式塞进她手里的东西。

  拉芙希妮坐在床沿，看着这包纸巾，看了很久。

  手指抚摸过熊猫圆滚滚的耳朵。她没有将其拆开。在这个房间里，她不需要任何用来拭去水迹的工具，她需要的，或许仅仅是留住这种粗暴传递过来的某种温度。

  拉芙希妮拉开床头柜最底层的抽屉。

  那里静静地躺着一支绿墨水的钢笔。那是达洛维小姐（Outcast）生前留给她的东西。

  她将那包印着熊猫的面巾纸，轻轻地、平平整整地放在了钢笔的旁边。然后，慢慢推上了抽屉。

  就在抽屉合拢的那一秒。

  书桌上那部黑色的家族专机，亮了起来。

  屏幕上没有显示来电号码。只有那个意味着强制接通的视频通讯请求。

  拉芙希妮看了一眼自己还在滴水的头发，然后接通了视频。

  屏幕里，爱布拉娜坐在一张红木办公桌后。她穿着裁剪锋利的白衬衫，领口的紫水晶胸针在灯光下折射出冰冷的暗光。她的面容姣好，语调温柔得没有一丝起伏：

  "晚安，拉芙希妮。"她的视线越过屏幕，落在了拉芙希妮的肩膀上，"你看起来，刚洗完澡。但似乎，并没有遵循良好的习惯将头发吹干。"

  "姐姐，偶尔体验一下这种感觉也不错。"拉芙希妮侧过身子，让自己用一个舒服的姿势看向爱布拉娜。"而且今天已经很晚了。"

  "原来是这样，偶尔放松一下确实是不错的选择..."爱布拉娜在最后一句顿了一下，"但愿你不是因为你新交的几个'朋友'就沾染上的这种放松方式"

  没等拉芙希妮回答，"晚安，拉芙希妮。"爱布拉娜单方面切断了电话。
