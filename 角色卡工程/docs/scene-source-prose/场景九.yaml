场景: 9
幕: "第一幕·入部磨合"
时间: "2013年7月上旬 放学后 · 梅雨季初期一场雷暴雨"
地点: "奉仕部活动室"
人物: "雪之下雪乃、拉芙希妮·都柏林、比企谷八幡、由比滨结衣"
正文: |
  窗外的天色以一种不自然的速度暗下来，云层压得极低，呈现出一种铅灰色的、几乎令人窒息的质感。然后是零星几滴雨点敲在玻璃上，发出不祥的、干燥的声响。

  活动室里，四个人各自占据着自己的领地。

  雪之下雪乃坐在长桌的里侧，手里是一本硬皮精装的文库本，翻页的动作规律而从容。比企谷八幡趴在桌上，脸埋在臂弯里，维持着他那招牌式的"节能模式"。由比滨结衣缩在对面的椅子上，拇指飞快地在手机屏幕上滑动，偶尔发出几声意义不明的轻笑。拉芙希妮·都柏林坐在雪乃的邻座，膝盖上摊着那本英日对照的诗集，目光在字母之间缓慢游移。

  然后，暴雨来了。

  不是渐进式的，而是毫无预警地倾泻而下，像是有人在天上直接打翻了一整片海。雨幕瞬间将窗外的操场和教学楼吞没，视线所及之处只剩下一片模糊的灰白。

  "哇下大了！"结衣惊呼一声，几乎是弹射起步冲向窗边。她手忙脚乱地抓住窗框，用力把窗户往里拉。雨水溅进来，打湿了她袖口的一小片布料。

  八幡从臂弯里抬起半张脸，声音含糊不清："这天气……总武高的排水系统又要遭殃了。"

  雪乃把书合上，抬头看向窗外。她的表情没有什么变化，只是眉心微微蹙起，似乎在估算这场雨会持续多久。

  窗户被结衣用力拉上的那一瞬间，拉芙希妮抬起了头。

  她的视线穿过玻璃，落在窗外那片混沌的雨幕上。翡翠色的眼睛倒映着灰白的光，像是被稀释过的蜂蜜。

  然后，雷声落了下来。

  不是远处的闷响，而是在头顶正上方炸开的那种。白光先一步撕裂了活动室里原本就昏暗的光线，紧接着是几乎能震碎玻璃的轰鸣。整栋特别栋都像是被一只无形的大手猛地攥紧了一下。

  "呀——！"结衣本能地缩起肩膀，双手抱住自己的胳膊，然后有些不好意思地笑了起来，"吓死我了……"

  八幡把脸从臂弯里完全抬起来，带着那种惯常的、半死不活的语调吐槽："打雷居然还能吓到高中生，由比滨同学你的胆量和你的数学成绩成正比吗。"

  "什么嘛！那是正常的生理反应！"结衣鼓起脸颊抗议。

  雪乃没有参与他们的对话。她平静地翻开下一页，像是在用沉默维持着某种秩序。

  但她的余光，一直停留在邻座。

  拉芙希妮没有任何外在的反应。

  她没有像结衣那样惊叫，没有像八幡那样抬头，甚至没有像任何一个正常人那样，在雷声炸响的瞬间做出本能的缩颈动作。她就那样坐在那里，脊背挺直，诗集依旧摊开在膝盖上，姿态完美得像是一尊被打磨过的瓷偶。

  唯一的变化，是她翻页的动作停了半秒。

  只有半秒。

  然后，她的眼睛失焦了。

  那些英文字母在她眼前变成了一团毫无意义的墨迹，诗集上的文字开始溶解、重组，变成了另一个画面——

  黑暗的走廊。

  赤脚踩在地毯上，没有声音。

  门缝下面透出的那一线光。

  她推开门，钻进那个带着淡紫色香气的被窝里。

  "姐姐……"

  柔软的手臂环住她的肩膀。

  "拉芙希妮，你怕了？"

  那个声音是温柔的，是抚慰的，是完美的。

  "没关系。姐姐在这里。姐姐永远在这里。"

  然后那只手收紧了。

  收紧，再收紧，直到她无法呼吸。

  "只要你需要我，我就会一直在。你永远不需要长大，永远不需要离开。对不对，拉芙希妮？"

  她想要点头。她不点头的话，那只手会收得更紧。

  但她点头了，那只手也没有松开。


  拉芙希妮的右手拇指开始无意识地摩挲左手腕上那截尾端烧焦的旧丝带。动作很轻，轻到几乎看不出来，但那是一个被刻进肌肉记忆里的、安抚性的仪式。

  她的呼吸频率没有变化。她的表情没有变化。

  但雪乃看到了。

  她看到那双翡翠色的眼睛里，有什么东西碎了，又被人匆忙地、熟练地拼回原状。那个过程快得惊人，快到如果不是雪乃恰好在这个瞬间看向她，就绝对不会注意到。

  那不是恐惧。

  那是一种比恐惧更深的东西。那是一个人在恐惧面前已经学会了如何不动声色、如何把自己拆解成零件再重新组装的、带着钝痛的熟练。

  雪乃的手指在书页的边缘停住了。

  她没有开口。没有问"你还好吗"，没有说"要不要喝点热的"，没有做任何可能会惊动那只正在拼凑自己的手的事情。

  她只是站起身，走向活动室角落的热水壶。

  水壶发出咕嘟咕嘟的声响，在雷声的间隙里显得格外清晰。雪乃从柜子里取出两个茶杯，往里面放入茶叶，然后注水。她的动作从容不迫，像是在进行某种精确的仪式。

  热水的蒸汽升腾起来，在昏暗的光线里拉出一道柔软的白雾。

  她端着两个茶杯回到长桌边。一个放在自己面前，另一个放在了拉芙希妮的诗集旁边——这次不是一次性纸杯。

  "泡多了。"她只说了这两个字，语气平淡得像是在陈述一个再普通不过的事实。

  拉芙希妮的视线从失焦的状态中慢慢回来。她低下头，看着面前那杯还在冒着热气的茶，然后抬起头，对上雪乃那双深蓝色的眼睛。

  雪乃已经重新坐下了，翻开自己的书，目光落在书页上，仿佛什么都没有发生过。

  拉芙希妮沉默了几秒。

  "……谢谢。"

  她的声音很轻，几乎被窗外的雨声吞没。但她伸出手，捧起了那个茶杯。热度透过陶瓷传入掌心，顺着血管一路攀升，像是一只无形的手，轻轻地、不带任何条件地握住了她正在发冷的指尖。

  八幡趴在桌上，脸埋在臂弯里，看似在装死。

  但他的眼睛是睁着的。

  他看到了拉芙希妮停顿的翻页动作，看到了她失焦的眼神，看到了她拇指在丝带上反复摩挲的微小轨迹。他见过那种表情——那种把"自己"从"此刻"抽离出去的、近乎自动保护机制的表情。

  他也见过雪乃的反应。

  他见过很多次。雪之下雪乃从来不会直说"我担心你"，不会问"你怎么了"，不会做任何会让对方觉得自己被看穿了的事情。她只会泡多余的茶、调整空调的温度、把窗帘拉得更严实一些，然后用一句轻描淡写的话把所有这些都掩埋过去。

  那是她笨拙的、几乎是蹩脚的温柔。

  但八幡知道，对于某些人来说，那种笨拙的温柔，比任何一句"你还好吗"都要来得安全。

  因为"你还好吗"是一个问题，而问题需要回答。

  而雪之下雪乃给的，不是问题。是一个不需要回应的存在。

  窗外的雷声渐渐远去，雨势开始减弱。结衣和八幡的吐槽战也进入了休战阶段。活动室里重新恢复了那种安静的低气压，只有翻书声和偶尔的雨打玻璃声在空气中交错。

  拉芙希妮捧着茶杯，没有喝，只是感受着掌心的温度。

  她的视线重新落回诗集上。

  那些英文字母重新变回了它们原本的形状，安分地待在纸面上。那扇被雷声推开的门，被她一个人，默默地，重新关上了。

  但门并没有锁。

  因为门的另一边，有人放了一杯热茶。
