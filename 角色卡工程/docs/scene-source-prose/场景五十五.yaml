场景: 55
幕: "第三幕·二学期"
时间: "2013年12月中下旬 · 周末 · 场景54之后的阳乃\"周末聚会\"邀请日"
地点: "雪乃公寓客厅 / 海滨区某大型咖啡厅（双线并行）"
人物: |-
  A线（公寓）：拉芙希妮·都柏林、雪之下雪乃
  B线（咖啡厅）：比企谷八幡、雪之下阳乃、折本香织、叶山隼人
正文: |
  冷风顺着公寓走廊的通风口灌进来，拉芙希妮·都柏林将深色的冬季呢子大衣裹得紧了一些。

  她双手交叉在胸前的书本上，左手拽住右侧袖口，右手拽住左侧袖口。烧焦的旧丝带和雪乃的红绸带，此刻都被厚实的呢子布料完全遮挡住。厚重的期末复习参考书被她抱在胸前，封面坚硬的棱角硌着她的手臂，却也是她此刻唯一能用来掩饰真实意图的盾牌。

  自周一晚上收到那封邮件后，那种如影随形的监控感就再也没有从她身上移开过。她不敢待在那个安静得连水滴声都能被无限放大的公寓里，更不敢去想跨洋网络那一端可能存在的任何审视。

  拉芙希妮伸出冻得有些发白的手指，按下了那个带有金属质感的门铃。

  等待的时间被拉得很长。就在她怀疑自己这种不合时宜的打扰是否越界时，门锁发出了一声沉闷的咬合声。

  "进来。"

  雪之下雪乃穿着一件素净的居家服，黑色长发随意地披散着。她没有问"你怎么来了"，也没有问"为什么没有提前打招呼"，目光只是在拉芙希妮冻得有些发僵的肩膀上停留了半秒，便转身让出了玄关的通道。

  "鞋柜第二层有备用的拖鞋。"雪乃的声音依旧是那种不带多余温度的陈述句，"既然带着那么厚的参考书，我假设你不是来借用我的客厅发呆的。"

  拉芙希妮站在玄关，听着门在身后咔哒一声关上。那种隔绝了外界寒冬和潜在视线的沉闷声响，让她的脊背瞬间松弛了下来。

  "……如果不麻烦的话。"拉芙希妮低下头换鞋，声音很轻，"期末的数学范围，我还有些地方没有头绪。"

  "把大衣挂好。我去把暖气调高一点。"雪乃走向开放式厨房，"另外，红茶可以吗？"

  "……嗯。"拉芙希妮把书放在沙发前的茶几上。看着雪乃熟练地操作热水壶的背影，那种久违的、不用计算空气流向的安全感，终于又重新回到了她的呼吸里。

  几乎在同一时间，几十公里外的海滨区某大型咖啡厅内。

  比企谷八幡将身体深深地陷在卡座的沙发里，下颌线绷成了一条僵硬的直线。他的双手交叉插在休闲外套的口袋里，视线钉在面前那杯已经停止冒热气的黑咖啡上，拒绝与长桌上的任何一个人产生哪怕一毫米的眼神交汇。

  "欸——真的假的？小企你现在居然还在那个什么奉仕部里帮忙？"折本香织坐在八幡的斜对面，手里晃着一杯加了厚厚一层奶油的星冰乐，笑得毫无阴霾，"这个可以有！不过听起来真的很像是在做免费杂工啊。"

  那句熟悉得令人作呕的口头禅，像是一把生锈的锯子，精准地在这场被称为"四人约会"的刑场上反复拉扯。

  叶山隼人坐在折本的旁边，脸上的温和笑容明显带着几分勉强。他试图将话题从八幡的黑历史边缘拉回来："折本同学，其实奉仕部的工作还是很有意义的。比企谷他……"

  "哎呀，隼人君还是这么喜欢替别人操心呢。"

  坐在八幡正对面的雪之下阳乃单手托着腮，深酒红色的风衣将她那张精致的脸衬托得越发明艳。她用那根搅拌棒在杯子里慢慢地画着圈，笑容甜美得几乎要溢出毒液："不过，我也很好奇呢。小八幡平时在那个只有雪乃酱和由比滨同学的房间里，到底都在做些什么？难道说，也是像现在这样，一句话都不敢说吗？"

  阳乃的视线直勾勾地越过桌子，像是一根根无形的针，准确无误地扎在八幡竖起的那道脆弱防线上。

  八幡的呼吸沉了几分，他将放在腿上的重心微微调整，用一种干瘪、像是从牙缝里挤出来的声音回答：

  "社团活动的内容属于学校机密，无可奉告。还有，这种毫无意义的社交聚会，到底什么时候才能结束。"

  "别这么冷淡嘛，小企！"折本香织完全没有察觉到桌面上那种令人窒息的气压，反而兴致勃勃地拿出了手机，"难得周末大家聚在一起，等下我们去前面的商场拍大头贴吧！阳乃学姐觉得呢？"

  "呵呵，听起来不错哦。"阳乃嘴角的弧度越拉越大，目光依旧锁死在八幡那张几乎要扭曲的脸上，"只要'某些人'不要半路逃跑就好。"

  "说起来，以前初中的时候啊，小企也做过很厉害的事情呢。"

  折本香织吸了一口星冰乐的奶油，眼睛弯成了月牙状，用一种分享周末趣闻般轻松、甚至带着几分怀念的语气抛出了那个话题："那个时候，小企不知道抽了什么风，突然把我叫出去说要跟我交往。欸——真的超突然的，这个真的可以有！不过我当然是拒绝了啦，毕竟大家还是做朋友比较好嘛。"

  咖啡厅里的背景音乐正好切换到一首轻快的流行乐。但在比企谷八幡的听觉里，整个世界的声道都已经被这几句轻飘飘的话锯断了。

  他将插在口袋里的双手攥成拳头，指甲几乎要陷入掌心，下颌线因为过度咬合而发出轻微的酸痛。他没有反驳，没有抬头，只是像一尊风化得快要碎裂的石像般，将视线钉在早已冷掉的黑咖啡表面。反驳会带来更多的追问，逃跑会让这种尴尬变成实锤，他只能选择最极端的物理屏蔽。

  "折本同学，"叶山隼人脸上的笑容终于维持不住了，他前倾身体试图打断，"那种过去的事情，就不要在这里……"

  "哎呀，隼人君不要这么扫兴嘛。"雪之下阳乃轻描淡写地用手指敲了敲桌面，阻断了叶山的圆场。她单手托着腮，那双深蓝色的眼眸里闪烁着猎手看到猎物剧烈挣扎时的愉悦光芒，"听起来很有趣呢。然后呢？雪乃酱的同伴，当时被拒绝之后是怎么做的？"

  "他啊，好像很受打击的样子。"折本完全没有察觉到叶山的紧绷和八幡的死寂，继续兴致勃勃地往下说，"不过我觉得这也不是什么见不得人的事啦，第二天我就当笑话讲给班里的女生听了。结果全班都知道了，小企那阵子看人的眼神可奇怪了。哈哈，真的超搞笑的！"

  "原来如此……"阳乃拉长了尾音，视线像是手术刀一样在八幡绷直的脊背上寸寸划过，"所以，这就是小八幡现在的眼神这么'可怕'的原因吗？真是个有些……残忍的喜剧呢。"

  与其同时，几十公里外的公寓客厅内。

  暖气的温度正好，红茶的香气在空气中缓慢挥发。茶几上摊开着几本厚厚的期末复习参考书。

  "不对。"

  雪之下雪乃将手中的自动铅笔笔尖点在拉芙希妮草稿纸的第三行算式上。她的声音一如既往的清冷，但在这种只关乎正确与否的语境下，反而剔除了那种拒人于千里之外的锐利。

  "这道题的已知条件并未说明函数在该区间内连续可导。"雪乃在那个等号上画了一个小小的叉，"在未经证明的前提下直接使用近似公式，虽然结果碰巧一致，但逻辑链条是断裂的。如果在正式考试中，阅卷老师有充足的理由扣除一半的分数。"

  拉芙希妮微微偏过头，看着雪乃在旁边重新列出的传统解法步骤。

  "这道题的核心考察点是极限的夹逼定理。"雪乃的语速平缓，笔尖在纸上发出沙沙的声响，"像这样，先构造两个辅助函数……"

  "……如果先证明其在小区间内的单调性呢？"拉芙希妮并没有被雪乃的权威打断，她拿起自己的笔，在雪乃的算式旁补充了另外一行，"这样就可以补全连续可导的证明前提。比起构造辅助函数，这种切入点的步骤更少，在时间有限的考试中容错率也更低。"

  雪乃敲击笔尖的动作停顿了半秒。

  她看着拉芙希妮补上的那行公式，深蓝色的眼眸里闪过一丝极度微弱的思索。她没有立刻反驳，而是顺着那个新逻辑在脑海中快速推演。

  公寓里的空气安静得只能听到笔尖划过纸面的声音。没有隐藏的试探，没有试图操控气氛的恶意，仅仅只是关于数学逻辑的纯粹交锋。在这间被暖气包裹的客厅里，拉芙希妮的手腕没有发烫。

  "真是个有些……残忍的喜剧呢。"

  雪之下阳乃那带着笑意的尾音还未在空气中完全消散，一声沉闷的声响突然震动了整张桌面。

  "够了。"

  叶山隼人猛地将手中把玩的搅拌棒拍在杯垫旁，一直以来维持在脸上的那种温和、圆滑、试图兼顾所有人的现充笑容，在这一刻彻底碎裂。他没有看阳乃，而是直直地盯着对面那个还在无忧无虑吸着星冰乐的短发女生。

  "折本同学。"叶山的声音压得很低，却带着一股少见的、几乎是咬牙切齿的生硬，"不要光看表面来评价八幡啊！"

  空气瞬间凝固了。

  折本香织咬着吸管的动作僵在半空。她那双弯成月牙的眼睛一点点睁大，原本轻松惬意的神情被一种真实的错愕所取代。她看了看脸色铁青的叶山，又看了一旁仿佛事不关己的阳乃，最后视线落在那块依旧一动不动的"石头"八幡身上。

  "欸？"折本发出了一个单音节，语气里充满了迷茫和委屈，"我……我说错什么了吗？"

  她甚至没有生气，只是单纯的不解。在她的认知体系里，这不过是一个无伤大雅的初中八卦，是用来活跃气氛的谈资。为什么这个人要用这种严厉的语气凶她？

  "只是随便聊聊以前的事情而已，隼人君干嘛这么认真啊。"折本放下杯子，脸上的笑容完全收了起来，抓起放在一旁的包站起身，"觉得没意思就直说嘛。我还有事，先走了。"

  没有等任何人回应，她直接转身快步走向了咖啡厅的大门。

  比企谷八幡依旧维持着那个僵硬的姿势，视线钉在桌面上。而雪之下阳乃只是静静地坐在那里，单手托着腮，视线在叶山微微发颤的肩膀和八幡绷紧的脊背之间来回流转，从头到尾没有施舍一句挽留，眼底的愉悦感却更深了。

  差不多在同一时间，雪乃公寓内的辩论也按下了暂停键。

  雪之下雪乃将那张写满公式的草稿纸推到茶几中央，示意这段逻辑推演告一段落。她端起自己那杯温度刚好的红茶，抿了一小口。

  "休息十分钟。"雪乃的声音依旧平缓，"你刚才的切入点虽然有效，但考试时必须将中值定理的适用条件写完整，否则还是会丢分。"

  "……我记住了。"拉芙希妮放下笔，揉了揉有些发酸的手腕，另一只手端起纸杯。

  温热的液体滑过喉咙，冲淡了脑海中盘旋的公式。拉芙希妮的视线落在茶几边缘的空隙处，脑海里不自觉地浮现出周一会议室里的那个画面。

  "那位折本同学……"拉芙希妮看着杯中微晃的水面，声音很轻，像是在陈述一个客观现象，"在某种程度上，大概是比企谷同学的'天敌'吧。"

  雪乃放下茶杯的手微不可察地顿了一下。

  "从生物学的角度来说，天敌之间往往存在着单向的捕食关系。"雪乃并没有否认这个比喻，而是顺着逻辑分析了下去，"比企谷同学平时虽然总是把'一个人也能活下去'当成真理，但他的防御机制通常是建立在刺猬般的反击上。但在遇到那个女生时，他的防御体系几乎是在瞬间就宣告了崩溃。"

  "她甚至不需要用恶意去攻击。"拉芙希妮补充了一句，脑海中回忆起折本那毫无阴霾的笑脸，"那种因为极度迟钝而产生的'无视'，可能比直接的伤害更让人觉得沉重。"

  "能够让比企谷同学放弃自爆式反击，连一句多余的歪理都说不出来……"雪乃的视线落在窗外灰蒙蒙的天空上，语气中带着一丝罕见的沉思，"看来，那不只是普通的初中同学那么简单。"
