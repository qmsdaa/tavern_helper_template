场景: 137
幕: "第十幕·冬去春来"
时间: "2015年2月6日 · 周五"
地点: "总武高走廊（一年级鞋箱区）→ 中庭 → 特别栋奉仕部活动室"
人物: "比企谷小町、川崎大志、铃木（一年级委托人）、铃木的朋友（未命名一年级女生）、比企谷八幡、雪之下雪乃、由比滨结衣、拉芙希妮·都柏林"
POV: "共享场景／零POV"
正文: |
  二月六日，下午四点十五分，小町把伞从活动室带了出来。

  大志已经在走廊转角等了。他靠在窗台上，手里没拿东西。小町走到他旁边，把伞递过去。

  "你不跟我去？"

  "鞋箱那边我去过了。"大志说，"她朋友今天有值日。教室值日，四点结束。现在差不多在换鞋。"

  "你什么时候查的。"

  "午休。"

  小町看了他一眼，把伞拿回来。"那走吧。铃木呢？"

  "在楼梯那边等。我跟她说了，先看着，想出去的时候再出去。"

  小町跟着大志走到一年级楼层的楼梯口。铃木站在半层的平台上，背贴着墙，呼吸很浅。她看见小町手里的伞，嘴角动了一下。

  "她在换鞋。"大志压低声音，"靠窗那一列，最下面那格。"

  小町从楼梯口探出半个头。走廊尽头，鞋箱区空荡荡的，只有一个女生蹲在地上，正在系运动鞋的鞋带。旁边放着一只书包，拉链没拉，露出半边便当盒。

  "那把伞，她认识吗。"小町问铃木。

  "认识。她借给我的时候说，这把伞是她小学五年级用到现在的东西。"

  "那就是认识。"

  小町把伞塞回铃木手里。

  "不是我拿去还。是你。"

  铃木的手指在伞面上收紧。

  "我不知道说什么。"

  "那就什么都不说。"大志说。

  "什么都不说，她会以为——"

  "她会以为你是来还伞的。"小町说，"因为你确实是来还伞的。其他的，不是现在还。"

  铃木看着伞，又看看走廊尽头那个蹲在地上系鞋带的人。那个人系完了左边，开始系右边。动作不快——值日刚结束的人做什么都慢。

  "她快走了。"大志说。

  铃木吸了一口气，从楼梯平台跨了出去。

  走廊不长。她的步子前三步是慌的，后面稳了下来。走到鞋箱前三米左右，那个系鞋带的女生抬起头来。

  两个人都愣住了。

  铃木把伞往前一递。

  "你的伞。上个月借的。"

  对方站起来，手在制服裙上擦了擦。没有立刻接。

  "你拿着就行。不用还。"

  "是你的。"

  沉默了几秒。然后那个女生伸出手，接过伞。她看着铃木，嘴张开又合上。最后说的是——

  "这把伞，有一根骨是弯的。你还记得吗。"

  "记得。"铃木说，"下雨天撑出去，总是往左边斜。"

  "对。"

  小町在楼梯口收回了探出的头，靠在墙上。大志站在她旁边，手里不知什么时候多了一本笔记本，翻到空白页，又合上。

  "不看了？"小町问。

  "够了。"大志说。

  走廊那边没有更多对话。脚步声分开——一个往校门方向，一个往回走。铃木回到楼梯平台的时候，眼睛是红的，但嘴角在往上跑。

  "她说什么了？"小町问。

  "她说，那把伞有一根骨是弯的。"

  "就这一句？"

  "嗯。"铃木说，"她接过去了。那把伞她接过去了。"

  大志把笔记本收进口袋。"那就可以了。"

  铃木看着他们两个，想道谢，又觉得说谢谢不太对。最后她只是点了一下头，朝走廊另一个方向跑了。

  小町和大志回到活动室的时候，长桌边四个人正在各做各的事——雪乃做习题，八幡翻文库本，结衣在便签上画饼干改良方案，拉芙希妮在写毕业文集的草稿。没有人问结果。

  小町把委托记录簿翻到昨天那一页。基本事项那栏还空着。

  "委托人没有提出明确事项。"她说，"伞还了。对方接了。骨是弯的——她朋友记得这把伞每一根骨的状态。"

  "那受理中呢。"雪乃问。

  "撤回。"小町说，"委托人不需要我们替她决定见面。她只需要那把伞不在自己手里。"

  雪乃拿起水笔，在基本事项栏画了一条横线，旁边写：委托人自行完成。撤回受理。

  八幡从文库本上方瞥了一眼。什么都没说，翻了一页。

  结衣趴在桌上看小町。"小町，你们刚才做了什么？"

  "什么都没做。"小町说。

  大志在窗边开口纠正。

  "做了一件。让她自己走出去。"

  "那剩下的呢？"

  "剩下的，"小町看了一眼大志，"是她们自己的事。"

  拉芙希妮从毕业文集草稿上抬起头。小町和大志之间的那杯麦茶已经凉了，两个人都没有去续。

  她把视线收回去，在草稿纸上继续往下写。下一行不是文集的内容——她在页边空白处写了几个字，又划掉了。
