场景: 105
幕: "第七幕·重新为奉仕部命名"
时间: "2014年4月16日 · 周三 · 放学后"
地点: "总武高特别栋奉仕部活动室／门外走廊"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林、一色彩羽"
POV: "共享场景／零POV"
正文: |
  “我准备撤回奉仕部的继续设置申请。”

  雪乃把深蓝色文件夹放在长桌中央。里面的委托目录已经整理完毕，现况确认表压在最上面，“奉仕部的继续设置”后面仍然没有新的文字。

  结衣刚把水壶放到底座上，开关还没有按下去。八幡靠着椅背，手里的MAX咖啡也停在半空。拉芙希妮合上了正在核对的学生会记录。

  活动室的门没有关严。走廊里的风偶尔把门推开一点，又慢慢放回来。

  “撤回以后，我会向高坂老师提交过去一年的活动记录。物品与教室移交也由我配合学校完成。”雪乃继续说，“在校方正式确认以前，我们不再接受新的委托。”

  “等一下。”结衣说，“小雪乃，你昨天还说要修改意见。”

  “修改的结果就是这份决定。”

  “这算哪门子的修改。”八幡把咖啡放到桌上，“别人问你为什么继续，你回答不继续。考试时在论述题下面写我放弃作答，至少还能得到字迹清楚的评价。”

  “如果题目本身无法成立，停止浪费时间也是合理选择。”

  “你母亲说了什么？”

  “这与她无关。”

  “昨天那份追加意见正是她推动的。你今天带着撤回申请进来，却说和她无关。以你的逻辑能力，应该知道这段证明缺少最重要的一步。”

  雪乃拉开椅子，没有坐下。

  “校方需要能够承担责任的顾问，需要明确且不可替代的活动目的。我们目前两项都没有。继续拖延只会让学校投入更多时间，也会让你们继续被卷入雪之下家的私人问题。”

  “所以你替我们决定不被卷入？”八幡问。

  “我是部长，也是现况确认的对外负责人。”

  “成员栏里写了四个名字。”

  “这正是我需要负责的理由。”

  结衣把水壶从底座上拿起来，又放了回去。

  “小雪乃，那个……也不用一下子就结束吧？我们可以再想想。大家应该也……”

  她停下来，看了看桌边的三个人。

  “我不想结束。”

  活动室里没有人接话。结衣把水壶开关按下去，随后坐回自己的位置。

  “我不知道学校最后会不会同意，也想不出那一栏该怎么写。”她说，“可是我不想结束。这是我自己的想法。”

  “愿望无法消除制度上的缺口。”雪乃说。

  “我知道。”

  结衣没有像平常那样急着补充。她把手机放到桌角，挂在手机壳上的吊饰碰出一声轻响。

  “可是你刚才说，这是为了不让我们被卷进来。那你应该先问我愿不愿意。”

  雪乃没有回答她。

  拉芙希妮把学生会记录推回文件夹旁边。

  “昨天你母亲提到了我的休学吗？”

  “她只说，你留在这里的理由已经发生变化。”

  “这部分没有说错。”

  “拉芙希妮。”

  “我最初进入奉仕部，是因为平冢老师要求，也是因为我没有其他地方可以去。现在的理由已经不同。”拉芙希妮说，“所以更应该由我自己回答。”

  “你的在校状态刚刚稳定。奉仕部继续受到PTA审查，对你没有任何好处。”

  “即使最后必须离开，也应该由我本人决定。”

  她说完整句以后便停下，没有把自己留下的理由解释给任何人。

  雪乃把手放在椅背上。

  “我没有替你决定未来。我只是在结束一项缺少制度基础的学校活动。”

  “爱布拉娜抵达以前，你问我为什么不多麻烦你一点。”拉芙希妮说，“现在轮到我问了。你为什么不多麻烦我们一点？”

  “两件事的性质不同。”

  “听起来很像。”

  八幡靠回椅背，抬头看着雪乃。

  “你们两个继续这样说下去，奉仕部即使没被学校撤销，也会先改组成互相追究隐瞒责任委员会。”

  “比企谷同学，如果你只准备说无关的俏皮话，可以保持安静。”

  “我倒是很想。可惜有人准备把保持安静理解成全票通过。”

  “那么你反对的理由呢？”

  “你在替所有人决定。”

  “由你指责这种做法，缺少说服力。”

  “是啊。”八幡说，“所以我知道有多糟。”

  他没有继续靠着椅背。那句承认说完以后，平常用来拖延的歪理也没有立刻跟上来。

  “你每次都这样。”八幡说，“先算出谁承担代价最合适，再把自己填进去。现在你换了个位置，决定把整个奉仕部填进去。最后再告诉我们这样最省事。”

  “只要我们仍然保持私人来往，奉仕部是否存在不会改变关系。”

  “这句话是你母亲说的？”

  “正确与否不取决于由谁提出。”

  “没错。可你以前不会拿这种话安慰自己。”

  雪乃终于在椅子上坐下。她把撤回申请转向八幡，纸上已经填写了活动名称和移交事项，签名栏仍然空着。

  “那么，你到底想保留什么？”

  八幡看着那张纸。

  “活动室只是一间教室。奉仕部这块牌子也不能保证任何人留下。”

  “你既然明白，为什么还要反对？”

  “因为你又准备在别人开口以前，先判断我们不需要。”

  水壶里的水开始发出声响。结衣坐在一旁，没有替八幡把后面的话接过去。拉芙希妮也没有动那份撤回申请。

  “我想要那种不用每件事都解释，多少也能明白对方在想什么的关系。”八幡说，“说起来很方便，也很适合我这种不愿意开口的家伙。”

  “那只是一厢情愿。”

  “大概吧。可真的有人说了不愿意，或者说了想留下，那句话就应该算数。不能因为你觉得自己已经理解，就把说出口的东西删掉。”

  雪乃看着他，没说话。

  “我不想每次都证明自己有用，才有资格坐在这里。”八幡继续说，“也不想哪天被谁划进‘已经不需要’的那一边，等事情结束以后才收到一份措辞周到的通知。”

  “那种关系并不存在。”

  “所以才麻烦。”

  八幡把手边的MAX咖啡推远了一些。

  “可我还是想要。”

  他停了一下，手指仍压在罐身上。最后还是继续说了下去。

  “我想要真物。”

  门外的脚步停住了。

  一色彩羽抱着一只牛皮纸文件袋，站在没有关严的门旁。袋子里装着学生会保管的旧委托记录复印件，封面已经写好了奉仕部的名字。

  她原本抬起的手没有敲下去。

  活动室里，雪乃把撤回申请翻回正面。

  “真物不能填进学校的现况确认表。”

  “那就不要填。”八幡说，“学校的问题另外回答。现在是我们在回答你。”

  “如果最后无法取得顾问和活动许可呢？”

  “到时候再决定。”

  “你仍然没有提供任何可执行方案。”

  “今天先阻止部长擅自宣布项目终止。作为临时方案，已经足够了。”

  “毫无计划性。”

  “承蒙夸奖。”

  水壶停止加热。结衣站起来，给四只杯子分别倒水。轮到雪乃那只茶杯时，她没有询问要不要，只把杯子推到文件夹旁边。

  “小雪乃，明天也可以继续想。”

  拉芙希妮把撤回申请从桌子中央推回雪乃面前。

  “这次请多麻烦我们一点。”

  雪乃没有在签名栏落笔。她把撤回申请放回文件夹，却也没有拿出现况确认表。

  “今天先到这里。”她说。

  “这是结束讨论，还是结束奉仕部？”八幡问。

  “如果你无法理解这两句话的区别，我可以建议你重新参加国语基础测试。”

  八幡拿回自己的咖啡。

  “看来暂时还没结束。”

  雪乃没有纠正。

  门外，一色慢慢放下了手。她抱着没有送进去的文件袋往楼梯口走，途中低头看了一次封面上的“奉仕部”。

  最上面的复印件已经被她压出一道折痕。

  她没有把它抚平。
