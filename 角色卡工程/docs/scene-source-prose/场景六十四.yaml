场景: 64
幕: "第四幕·冬假→三学期"
时间: "2013年12月26日 · 周四 · 学期末结业式当日 · 清晨到傍晚"
地点: "千叶站广场 -> 奉仕部活动室 -> 总武高校门外街道"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
正文: |
  清晨的千叶站广场，冬风刮得像带了冰碴子。雪乃把下巴深深埋进深蓝色的制服大衣领口，双手插在口袋里，指甲用力掐着掌心。

  "雪乃同学。"

  轻柔的、带着点鼻音的呼唤在身后响起。雪乃的肩膀不易察觉地一僵，随后，她用一种几乎可以把空气冻结的速度转过身。

  拉芙希妮正站在离她不到一米的地方，穿着那件深色的呢子大衣，鼻尖被冻得微微发红，左手腕上那根红色的绸带在风中轻轻晃动。那张脸上挂着一种小心翼翼的无辜神情。

  "如果你是来展示如何在零度以下的冷风中扮演一尊愚蠢的雕像的话，"雪乃的声音冷得像淬了冰，她用挑剔的目光从拉芙希妮的头顶扫到鞋尖，"那么恭喜你，你的目的已经达到了。"

  "我就知道，只要我足够'愚蠢'，部长大人就一定不会真的忍心不管我。"拉芙希妮没有因为这句冷嘲热讽而后退，反而自然地往前迈了一步，彻底突破了雪乃好不容易建立起来的安全距离。

  她伸出手，没有半点犹豫。

  "你……！"

  雪乃条件反射般想要往后躲，但拉芙希妮的手已经越过了防线，指尖轻轻蹭过雪乃冰凉的耳垂，然后落在了大衣领口。那双手带着不容拒绝的温度，仔细地将雪乃因为刚才的转身而有些歪斜的领子理平，顺势将那一截深红色的围巾向上提了提。

  距离太近，拉芙希妮呼吸间那股淡淡的松香气味直接钻进了雪乃的鼻腔，那气味瞬间勾起了昨晚某些泥泞不堪的记忆片段。雪乃只觉得脸颊上的血液轰地一下全都涌了上来，她猛地抬手，用力拍开了拉芙希妮还在自己领口流连的手指。

  "啪"的一声轻响在嘈杂的站前广场并不算明显。

  "别碰我！"雪乃的声音罕见地拔高了半个音调，紧接着又慌乱地压了下去。

  绝不能被她牵着鼻子走。

  雪乃深深地吸了一口冷空气，强行用一层冰冷的部长面具将所有动摇封死。她挺直了脊背，用一种俯视的、带点宣判意味的语气开了口：

  "今天下午，期末结业考试的成绩就会公布。"雪乃盯着拉芙希妮那双翡翠色的眼睛，一字一顿地说道，"如果你那惨不忍睹的国语成绩依然维持在C判定的水平，那么为了奉仕部乃至总武高中的平均声誉着想--在这个寒假，我会亲自对你进行强制性的学业修正。"

  抛出这个条件时，雪乃的心里有什么东西松了一下，随即被她压了回去。用学业和部长的责任作为掩护，这是她目前能想到的，最完美的、将两人这段时间可能产生的交集彻底"正当化"的借口。对常人来说，"整个寒假都跟着补习"这无疑是一种极度痛苦的惩罚。

  她等待着拉芙希妮露出苦恼或者抗拒的表情。

  然而，拉芙希妮只是微微歪了歪头。那双浅金色的睫毛眨动了两下，似乎在认真地咀嚼这句话。随后，一丝根本无法掩饰的笑意顺着她的眼角一点点晕染开来。

  "一整个寒假。"拉芙希妮重复了一遍这个词，语气轻快得仿佛刚才挨打的不是她，"每天都要跟着雪乃同学，坐在同一个房间里，只能听你一个人的声音……"

  她突然向前凑近了半寸，用一种近乎呢喃的声音说："这种事情，怎么听……都不像是在受罚吧？"

  拉芙希妮扬起嘴角，看着雪乃已经彻底僵住的脸，轻声补充了一句："这不是奖励吗？"

  冷风从两人之间穿过。

  雪乃张了张嘴，却发现那些准备好的关于教育、责任和纪律的庞大词汇库在这一刻彻底宣告瘫痪。她无法反驳这句荒唐的发言，因为拉芙希妮眼底那种因为"可以被强制留下"而产生的、近乎愉悦感，真诚得毫无遮掩。

  那种感觉，就像是一拳打在了棉花上，不仅没能立威，反而把自己整个人都陷了进去。

  "……随便你！"

  雪乃最终只能用一句干瘪的粗暴台词结束了这场交锋。她猛地转过身，大步流星地朝着检票闸机走去，背影僵硬得像是一块被风干的木板。在那一刻，她只觉得周围那些嘈杂的脚步声，都没有自己此刻震耳欲聋的心跳声来得让人难以忍受。

  午后的阳光穿过活动室的百叶窗，在长桌上切出几道明暗交错的线条。热水壶发出轻微的沸腾声，红茶的香气却没能压住房间里那股诡异的紧绷感。

  "所以……"雪乃盯着面前那张被推过来的成绩单，指尖在纸张边缘用力压了一下，声音听起来比平时还要冷上几分，"以J班的学业标准来看，现代文B级，这就是你交出的答卷？"

  拉芙希妮坐在她旁边，单手撑着下巴，那根系着红绸带的手腕有意无意地压过了长桌中线，几乎要碰到雪乃的茶杯边缘。

  "看来，我确实需要'强制性的学业修正'了呢。"拉芙希妮的声音很轻，带着点干燥的笑意，翡翠色的眼睛直勾勾地盯着雪乃，"部长早上说的那个……一整个寒假的惩罚，还作数吧？"

  雪乃觉得耳根的温度正在不可控地上升。她猛地端起红茶杯，避开了那只危险的手腕，然后用极具压迫感的视线扫向长桌对面。

  "这并不是惩罚，而是身为奉仕部部长，对部员学业短板的合理干预。"雪乃的语速很快，像是在宣读某份免责声明，"既然你主动承认了不足，那么从明天开始……"

  "那个！"

  一只颤巍巍的手从靠窗的位置举了起来。由比滨结衣把一张揉得皱巴巴的纸页按在桌面上，整个人像只做错了事的狗一样缩在椅子里，声音委屈得快要哭出来。

  "小雪乃……我的数学……只有D……"

  雪乃那套严密的补习逻辑被结衣的哀鸣直接打断。她深吸了一口气，将视线从拉芙希妮那张透着无辜的脸上移开，转向了结衣。

  "D级？"雪乃揉了揉有些发胀的太阳穴，"如果我没记错的话，这份试卷的基础题占了百分之四十。你是在闭着眼睛答题吗，由比滨同学？"

  "因为那些数字长得太像了嘛……"结衣抓着团子头，拼命往雪乃的方向凑了凑，"既然小雪乃要给拉芙希妮酱补习，那、那能不能也带上我？拜托了！如果拿不到C，我就要去补考了！"

  坐在对面的比企谷八幡在这时终于停下了转笔的动作。他瞥了一眼自己的国语A和数学C成绩单，然后用那种缺乏干劲的死鱼眼看了看拉芙希妮，又看了看雪乃。

  "这不就是很普通的'笨蛋收容所'吗。"八幡干巴巴地吐槽了一句，"虽然我也经常在这个等级徘徊就是了。"

  "如果你觉得这种程度的自嘲能掩饰你同样惨不忍睹的数学成绩，那比企谷同学，你的认知还需要重新构建。"雪乃毫不留情地把矛头转了过去，试图用毒舌来转移那股越来越失控的焦躁感。

  拉芙希妮就在这时轻轻叹了口气。她并没有表现出对结衣加入的排斥，反而在桌面上用指尖轻轻点了两下。

  结衣忽然提议："对了！大家寒假要不要一起去初诣？千叶神社每年元旦都很热闹的！"

  "为什么要在大冬天专门去人挤人……"比企谷八幡的抱怨声从长桌对面干巴巴地飘了过来，"为了在零度以下的冷风里求神拜佛？我宁愿在被炉里度过没有神明保佑的一生。"

  "小企你总是这样！"由比滨不满地鼓起脸颊，立刻把求援的目光投向了坐在中间的人，"拉芙希妮酱还没去过日本的初诣吧？很有意思的哦！不仅有神社，还有很多祭典的小摊！"

  拉芙希妮那停留在杯沿的手指微微动了一下。她似乎深吸了一口气，正准备转过头，挂上那个完美的、令人挑不出毛病的礼貌笑容。

  但在她开口之前，瓷杯碰撞托盘的清脆声响先一步在长桌端头炸开。

  "我拒绝这种缺乏效率和理智的提案。"

  雪乃将茶杯放下，双手交叠放在桌面，视线越过拉芙希妮，直直地盯住了由比滨。

  "千叶神社在元旦期间的人流量，足以瘫痪整个站前交通。而且，如果是为了祈求学业进步，这种寄希望于虚无缥缈的神明保佑的行为，本身就是一种逃避。"

  由比滨被这长串的斥责砸得缩了缩脖子："可是，只是去看看……"

  "没有可是。"雪乃毫不留情地打断了她，随后，那股冷硬的锋芒不可逆转地扫向了身侧的拉芙希妮，"更何况，这位刚刚用现代文B级成绩向我发出挑衅的转学生，似乎已经完全忘记了她现在的处境。"

  雪乃微微侧过头，深蓝色的眼眸在拉芙希妮那张略显苍白的脸上钉死。

  "元旦期间，我要求你待在一个安静、可控且随时能够检验复习进度的地方。那并不包括任何会让你分心的小摊或者人流密集的广场。如果你觉得那张B级的成绩单赋予了你随意安排假期的权利，那我不介意现在就重新评估补习的强度。"

  活动室里陷入了一阵绝对的安静。

  比企谷在那一刻停止了转笔，目光在两个女生之间扫了一个来回，明智地选择了闭嘴。

  由比滨张了张嘴，似乎想说什么，但被这种堪称专制的"部长宣言"压得发不出声音。

  拉芙希妮维持着那个有些僵直的坐姿。她转过头，看着雪乃那张冷得不近人情的脸。过了好几秒，她那微微发紧的肩膀才以一种极缓的频率放松下来。

  冬日的傍晚总是冷得很快。刚走出总武高中的校门，沿着通往车站的街道没走多远，路灯就已经接连亮了起来，将四个人的影子在人行道上拖得很长。

  "拉芙希妮酱！寒假的时候我带你去吃好吃的摊位吧！"由比滨结衣走在最前面，紧紧挽着拉芙希妮的手臂，声音里透着完全不设防的兴奋，"我知道稻毛海岸那边有一家新开的可丽饼，还有神社前面的章鱼烧也超级棒！大家一起去的话绝对会很开心的！"

  拉芙希妮被由比滨拉着走，侧过头看着那张在路灯下活力四射的笑脸。她弯了弯眼角，那双翡翠色的眼睛里倒映着路灯的微光。

  但走在后面的雪乃能看出来，那只是一层勉强糊起来的、脆薄的糖霜。在活动室里被她用"补习"锁死假期后，拉芙希妮根本不知道该如何拒绝由比滨这种不知内情的期待。

  "寒假作业的量，简直是犯罪。"比企谷八幡缩着脖子，双手插在校服裤兜里，干瘪的抱怨声随着呼出的白气一起飘散在冷风里，"学校是把学生的假期当成了某种需要被填埋的巨型垃圾场吗？"

  "如果连那种只配被称为基础常识的纸张数量都能将你压垮，那你的人生……"

  雪乃那套准备好的、足以将比企谷钉死在耻辱柱上的逻辑刚刚开了个头，声音却戛然而止。

  因为前面的拉芙希妮停了下来。或者更准确地说，她的肩膀猛地收了一下，整个人僵在那里半秒。

  "嗡--"

  那是一声极短促、沉闷的震动声。隔着厚重的深色大衣布料，在下班高峰期嘈杂的街道背景音中，这声音本来应该被忽略不计。但雪乃的视线一直没有离开过那个方向，她清楚地看到，由比滨挽着的那条手臂，在震动响起的瞬间，绷紧了。

  拉芙希妮脸上的笑容甚至都没有淡去，只是翡翠色的眼睛里那些原本还有些温度的微光，一下就灭了。

  "拉芙希妮酱？怎么啦？"由比滨拉了拉那条突然僵住的手臂，疑惑地偏过头，"是不是太冷了？"

  "没、没什么……"拉芙希妮的声音有轻微的颤抖，那只空着的手捏着大衣口袋的边缘，像是在极力压抑着把它拿出来的冲动。她深吸了一口气，试图把那个完美的、让人挑不出毛病的笑容重新戴好，"只是……"

  "刚才在活动室里，看来我是完全对牛弹琴了。"

  雪乃的声音从身后切进来，拦断了由比滨的询问和拉芙希妮正在拼凑的谎言。

  雪乃越过比企谷，快走两步拉近了距离。她没有去看由比滨那张因为突如其来的斥责而显得委屈的脸，而是将视线直直地锁在了拉芙希妮那只紧攥着口袋边缘的手上。

  "由比滨同学，我不介意再重复一遍。"雪乃的语调平稳、冷酷，却又透着一种不容反驳的确信，"在假期补习期间，所有的出行和时间分配，必须优先服从提升学业的最终目的。那些除了增加多余卡路里和肠胃负担之外毫无用处的街边摊位，不在允许的日程表上。"

  "诶--？小雪乃也太严格了吧……"由比滨小声嘟囔着，但还是下意识地松开了挽着拉芙希妮的手臂。

  雪乃没有理会由比滨的抱怨，她盯着拉芙希妮那双因为错愕而微微放大的眼睛。

  "另外，既然已经确认了糟糕的国语成绩。"雪乃扬起下巴，深蓝色的眼眸里没有一丝退让，"作为指导者，我有权随时随地监督你的状态。希望你在假期处理某些'私人事务'的时候，不要忘了你还欠我一整个假期的专注。"
