场景: 92
幕: "第五幕·PTA→舞会"
时间: "2014年3月26日 · 周三 · 晨（春假 · 雨后晴）"
地点: "千叶中央邮局 → 总武高 · 特别栋 · 生活指导准备室"
人物: "拉芙希妮·都柏林、平冢静"
POV: "拉芙希妮"
正文: |
  拉芙希妮推开邮局厚重的玻璃门时，千叶中央车站传来的列车轰鸣声被短暂地隔绝在身后。

  外面的风依旧带着雨后的湿冷。她将深蓝色的羊绒围巾往上拉了拉，遮住小半张脸，深灰色的长款防风风衣衣摆随着走动微微拂过膝盖。这身足够保暖的便装，将她严实地包裹起来，隔绝了外界那股试图钻进骨头里的寒意。

  她径直走向大厅最边缘的国际加急件窗口。

  早晨的邮局人并不多，四周只有零星的脚步声和纸张翻动的微响。拉芙希妮站在柜台前，从单肩包里取出了那个深米色的信封。一百二十克的信纸拿在手里有着超出普通函件的重量感。那些用深蓝色墨水写下的词句——直白到挑衅的、不容驳回的——安静地封在里面。

  "寄往英国。加急。"

  拉芙希妮的声音很轻，却带着一种以往在她身上罕见的、不容驳回的清晰度。

  工作人员接过信封，熟练地放在电子秤上，目光在收件人那一栏稍微停留了一下。爱布拉娜·都柏林，以及那个位于伦敦、即使在金融区也显得格外森严的地址。

  拉芙希妮安静地注视着那张深米色的纸面。右下角的落款处，是昨晚在雪乃沉默的目光支撑下，她一笔一划稳稳写上去的全名。

  在这个到处充斥着无形监控、连公寓的摆设都能被轻易篡改的世界里，那些通过网络发送的邮件随时可能被助理拦截，或者被当作无意义的消遣处理掉。只有这种跨越洋流的实体纸件，才能避开那些高高在上的筛选机制，带着不容忽视的沉重感，直接落在爱布拉娜那个永远整洁的办公桌上。

  工作人员敲击键盘的声音打断了她的思绪。

  "单号在这里。预计最快后天抵达。"

  "谢谢。"

  拉芙希妮礼貌地点了点头，接过了那张打印出来的白色回执单。

  她隔着柜台的玻璃，看着工作人员将那个深米色的信封转身投进身后的航空件分类筐里。这是一个不可逆的动作。在这之前，她其实还可以选择退缩，可以选择把那张盖着红章的退学担保文件交上去，然后乖乖坐上飞往伦敦的航班，继续回去当那个精致且听话的"影子"。

  但现在，那条路被她自己彻底切断了。

  拉芙希妮转身走向门口，右手下意识地抬起，隔着袖口的针织布料按了按右手腕。那截烧焦丝带的粗糙质感透过织物传回来。还在。

  她推开玻璃门，重新走入千叶早晨的冷风中。空气有些刺骨，但她却没有像往常那样急着去寻找避风的地方。因为在昨晚那间公寓里，曾经有一个人即使自己快要陷入无望的困局，也固执地在这场雨中抱紧了她。

  既然雪乃已经带着那份微薄的温度去迎战本邸了，那么她也要完成自己这边的战场清理。她看了一眼灰白色的天空，将双手插回风衣口袋，向着平冢静老师所在的方向走去。

  街道上只有零星去补习的学生和早起的行人。她刻意放慢了脚步，试图在脑海中整理一会见到平冢静时的说辞。爱布拉娜来日本前的这几天，她的公寓显然并不安全。而平冢静，是这座城市里极少数知道那截丝带真正来历、且能接住她这个大麻烦的成年人。

  该用什么样的开场白才足够得体呢？

  拉芙希妮在心里默拟着腹稿。她可以搬出之前谈好的条件，告诉对方"只要提供暂时的庇护，都柏林就不会提前干涉总武高的毕业事务"——但这听起来太像爱布拉娜那种充满上位者施舍感的交易；或者，她可以坦白自己已经用纸质信件发出了战书——但这似乎又带上了一点急于向大人索求认同的软弱。

  春假中的总武高比平时冷清得多。校门没有完全关严，只有几支运动社团在操场那边发出微弱的训练声。

  拉芙希妮避开了主教学楼，径直走向特别栋的生活指导准备室。走廊里安静得只能听见她平底皮鞋踩在亚麻油地板上的轻响。空气里浮动着旧纸张的干燥味道，而在靠近那扇挂着名牌的木门时，一丝极淡的、只有嗅觉敏锐的人才能察觉到的烟叶燃烧过后的苦涩味，顺着门缝钻了出来。

  她在门前停下脚步。

  提前准备好的一套套说辞，在这个味道面前显得有些多余。她将手从风衣口袋里抽出来，指尖微微蜷缩了一下，整理好呼吸后，抬手敲响了那扇门。

  "进。"门里传来那个女人略带沙哑的、被春假加班折磨得有些随意的声音。

  拉芙希妮按下门把手，推开了一道刚好能容纳半边身体的缝隙。

  办公室内，平冢静正穿着那件万年不变的白大褂，靠在转椅上，手里拿着一罐黑咖啡，另一只手把玩着银色的Zippo打火机。看到出现在门口的高挑身影，平冢静停下了转动打火机的动作，视线在她脸上停了一瞬——那张脸比上次在部室见面时更安静，也更瘦了一点。然后扫过她身后空荡荡的走廊。一个人来的。

  "平冢老师。"拉芙希妮保持着那个推门的姿态，没有立刻走进去，而是用比平时更加清晰平静的声音抛出了第一句话，"我把信寄出去了。"

  平冢静把靴子后跟从桌上放下来，让转椅稍稍向后退开半步，随后下巴朝旁边那张靠墙的待客折叠椅扬了扬。

  "坐吧。"

  拉芙希妮顺从地走过去，拉开那把带着一点铁锈味的折叠椅坐下。她没有解开深蓝色的羊绒围巾，只是将原本插在风衣口袋里的双手抽出来，规矩地交叠在膝盖上。右手的拇指无意识地收拢，隔着袖口按在右手腕那截粗糙的轮廓上，停了一秒，才慢慢松开。

  办公室里一时间只剩下那台旧电脑主机轻微的运行声。

  "她总是喜欢用那种带着旧纸张味道的信封。"平冢静率先打破了沉默。她收起了银色的Zippo，转而拿起桌上那罐已经没了热气的黑咖啡，视线越过拉芙希妮的肩膀，看向窗外略显阴沉的早晨，"不管是当年写给我的私人信件，还是后来……处理那些麻烦的公文。"

  拉芙希妮安静地听着。当那个不再是秘密的称呼终于可以在两人之间落地时，她发现自己并没有想象中那样发抖。

  "在伦敦的那栋庄园里，她是唯一一个不按清单行事的人。"拉芙希妮的声音很平稳，像是从很远的地方捞起那些画面，"所有人都按照爱布拉娜的要求，教我怎么更像一个完美的倒影。只有她会在课桌下面，塞给我一本印着乱七八糟漫画插图的绘本。"

  她停顿了一下，视线垂向自己的膝盖。

  "她教我的第一件事，不是都柏林家族的族谱，而是让我用最普通的铅笔，在白纸上写下我自己的名字。不是'次女'，也不是'影子'……就只是拉芙希妮。"

  平冢静转动着手里的咖啡罐，金属外壳在冷空气里发出极轻的摩擦声。

  "这确实像她的作风。"平冢静扯了一下嘴角，那个笑容里没什么温度，更多的是某种带着无奈的释然，"那种表面上看起来温文尔雅，骨子里却比谁都讨厌规矩的女人。"

  平冢静将咖啡罐放回桌面上，发出一声不轻不重的闷响。

  "我和她认识的时候，她还不会像后来那样字斟句酌。她习惯买最廉价的香烟，在需要集中精神的时候，一根接一根地抽。但她从来不在别人面前抱怨那些烟有多难抽。"平冢静看着拉芙希妮那张苍白而平静的脸，"她被聘用的时候，曾经给我寄过一封信。信里说，她找到了一项真正值得她把剩下的时间全部砸进去的工作。"

  拉芙希妮交叠在膝盖上的手指微微攥紧了。

  "她没有告诉我那份工作到底有多危险。"平冢静的语气低沉下来，那是大人们在谈论无法挽回的后果时特有的腔调，"直到后来，我收到了她那份就跟遗嘱一样的邮件，告诉在世界的另一端，有一个需要她无论如何也要拯救的学生。"

  拉芙希妮的呼吸稍微停乱了一拍。

  "她……从来没有在我面前抽过烟。"拉芙希妮终于抬起头，迎着平冢静的视线，目光里多了一点执拗的探寻，"那份邮件里，还写了什么？"

  平冢静的眼神没有躲闪。她重新摸出打火机，没有点燃，只是用拇指拨开金属盖，"叮"的一声脆响在办公室里荡开。

  "她说，如果有一天那个小女孩能学会自己说'不'，要为她撑起翅膀。"平冢静合上打火机。
