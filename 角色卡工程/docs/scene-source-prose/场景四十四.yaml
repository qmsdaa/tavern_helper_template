场景: 44
幕: "第三幕·二学期"
时间: "2013年11月16日 · 修学旅行第3天 · 深夜"
地点: "洛东旅馆 · 女生和室"
人物: "拉芙希妮·都柏林、雪之下雪乃、由比滨结衣"
正文: |
  障子门滑开的轻响在安静的走廊里带着木材特有的钝重感。拉芙希妮和结衣脱下鞋子踏入房间时，那股伴随着煎茶清苦香气的暖意，瞬间便将洛东街道上沾染的凉夜湿气隔绝在了门外。

  雪之下雪乃端坐在和室中央的矮桌旁。

  她常看的那本文库本已经被书签夹好，平整地放在了手边一侧。而在木质矮桌的中心位置，三个款式相同的陶瓷茶杯正成品字形摆放着，其中两杯的水面正安静地飘散出细细的白雾。

  拉芙希妮的目光不可避免地落在了雪乃的背脊上。那是一个板得过于严丝合缝的正坐姿态，双手交叠放在膝盖上，连校服裙摆的褶皱都被压得挑不出一丝毛病。但正是这种毫无破绽，暴露了它是在雪乃确认走廊传来熟悉的脚步声后，才在极短时间内生硬调整出来的防御性戒备。

  雪乃没有抬头看向门口。她的视线越过桌面，仿佛在盯着茶壶提手上方那片并不存在的灰尘。

  "入夜后的京都气温下降得很明显，以这套单薄校服的御寒能力，长时间的户外闲逛显然不是一个合乎逻辑的选择。"她的声音仍然冷淡，但在寂静的榻榻米房间里，这句本该带有指责意味的开场白，却显得意外地柔软，"如果不想明天因为呼吸道感染而成为随队医生的麻烦，最好在水分彻底冷却前进行补充。"

  结衣原本在进门前还微微绷紧的肩膀，在听到这句话的瞬间彻底松懈了下来。她先看了拉芙希妮一眼，才发出一声比往常更轻的"欸嘿嘿"，脱掉外套快步走到桌边，像一只闻到热饭香味的小动物般跪坐了下去："外面的风确实好冷呢。不过小雪乃泡的茶还是一样香。"

  拉芙希妮没有结衣那种能立刻把气氛变软的本能。她脱下制服外套，走到那个预留给自己的位置——正对着茶壶的一端——安静地屈膝坐下。

  她的视线落在被推到自己面前的那杯热茶上。

  精致的日式陶瓷杯壁上，勾勒着淡青色的釉纹。茶汤澄澈，一片细小的茶叶在水底静静地打着旋，散发着恰到好处的温度。

  拉芙希妮的指尖碰到了杯壁，掌心传来的微烫触感让她有一瞬间的恍惚。她想起了五个月前的那个下午，在特别栋那间老旧的闲置教室里，面前这个人也是用着这样冷淡的声音，推过一个粗糙、单薄、没有丝毫人情味的一次性纸杯，仿佛拉芙希妮的存在是一种麻烦。

  而今天，在这间狭小的日式旅馆里，这第三个陶瓷杯不仅装满了同样温度的茶水，更是在这个原本封闭的几何关系里，以一种不可辩驳的物理存在，为她确立了一个理所当然的归属位。

  "……如果不麻烦的话，我也想补充一点温度。"

  拉芙希妮没有去拆穿那份刻意端出来的冷硬，她只是用双手捧起那个陶瓷杯，将杯子在手里微微转了半圈，然后低头抿了一小口。

  听到拉芙希妮那句轻巧的回应，雪乃刚才还紧绷着的肩膀出现了极为轻微的松动。她迅速地转开视线，伸出右手食指，略显慌乱地将垂在脸颊侧边的一缕黑发重新绕到耳后。

  夜晚，灯绳被拉下的瞬间，和室里的空间被黑暗迅速填满。

  拉芙希妮平躺在被褥上，睁着眼睛，盯着天花板上那道微弱的亮线。她能感觉到身侧不远处，雪之下雪乃正保持着同样的仰卧姿势。两人之间隔着大约一个拳头的距离，在这个静谧的京都之夜，连布料摩擦的细微声响都显得格外清晰。

  "……拉芙希妮同学。"

  黑暗中，雪乃的声音突然响起。音量被刻意压得很低，像是为了不吵醒结衣，又给这句话本身覆上了一层可以随时收回的遮掩。

  "嗯？"拉芙希妮轻声应答，没有转头。

  "今天在二年宁坂，以及回程的路上。"雪乃的语速比平时慢了许多，字与字之间的停顿被拉长了半拍，"你对叶山同学那种伪善的拆解，对户部同学即将崩溃的预判……那种感觉，不像是单纯依靠观察就能得出的结论。"

  她停顿了一下，被褥发出极轻的摩擦声，似乎是雪乃握紧了又松开了手。

  "那更像是一种……一种......训练出来的生存直觉。"

  "雪之下同学。"拉芙希妮的声音在黑暗中显得有些飘忽，很轻，像是一句不完全属于这个房间的独白，"如果一个人，长期生活在一个只要说错一句话、做错一个表情，就会被严厉惩罚的房间里……她会变成什么样？"

  雪乃没有立刻回答，但拉芙希妮能感觉到身旁那道注视的视线变得更加专注。

  "她会变成一面镜子。"拉芙希妮继续说着，手指在被子下不自觉地摩挲着右手腕上那根烧焦的丝带，"为了让别人满意，她必须学会在别人开口之前，就猜到他想听什么；在他皱眉之前，就调整好自己的表情。"

  "但是，镜子是没有自己的脸的。"

  拉芙希妮的语调沉了下去。她没有再继续往下说，只是把那句独白留在黑暗里，让它顺着被褥间隙的气流沉到榻榻米的缝隙下面。

  身侧那道视线依然停留着，没有移开，也没有靠近。

  过了很久，久到拉芙希妮几乎以为对方已经把这个话头放弃了的时候——

  "……那面镜子。"雪乃的声音褪去了最后一点冷硬的伪装，只剩下一种近乎执拗的认真，"曾经有人试过要把它敲碎吗？"

  拉芙希妮的呼吸微微顿了一下。

  在过去的五个月里，雪乃从未这样直白地、不带任何"协助者"或"侍奉部"标签地，靠近她一直不愿承认存在的那处角落。

  "……有过。"拉芙希妮轻声回答。她在黑暗里轻轻吐出一口气，那口气比想象中稳，"曾经有一个人，试图从那面镜子里把我敲出来。"

  她没有继续往下说。那个人的名字、结局、留下过什么，全都留在了那句话的后面，成为拉芙希妮此刻不打算递出的东西。

  雪乃也没有追问。

  "那……"她的声音很轻，"她敲出来的那个东西，现在还在吗？"

  拉芙希妮怔住了。

  雪乃问的不是那个人。是被敲出来的那个东西——是拉芙希妮她自己。

  "还在。"她轻声回答，"虽然还是会习惯性地想反射别人的影子……但还在。"

  "是吗。"

  雪乃轻轻吐出一口气，那口呼吸拂过拉芙希妮脸颊侧边的发丝。

  "那就足够了。"雪乃重新躺平，看着天花板。

  就在这时，旁边的被褥发出了一阵明显的摩擦声。

  "手臂伸过来。"

  拉芙希妮愣了一下，那种刚卸下防备的松弛感还没来得及完全铺开，就被这句突如其来的命令稍微打断了。

  "雪之下同学？"她用带着一点微微沙哑的声音发出了疑问。

  "……安静。"雪乃的声音很快，带着一种刻意维持的冷硬，像是在掩饰某种不自在，"既然是为了遮住疤痕，这根烧焦的丝带也太惹眼了一点……"

  说到这里雪乃停了一下。

  "……不。"她的话说到一半停下了，语气里那点刻意维持的冷硬松动了半分，"那截烧焦的，不用替它遮什么。另一只手。"

  拉芙希妮在黑暗中眨了眨眼睛。她迟疑了半秒，然后慢慢地，将一直藏在被子下面、没有任何印记的左手，越过那一个拳头的安全距离，伸向了雪乃所在的方位。

  一只微凉的手指碰到了她的手腕。

  那是一个克制的触碰。雪乃的手指贴着拉芙希妮的皮肤，带着一种不容置疑的精确感，稳稳地绕在她的左手腕上。

  紧接着，拉芙希妮感觉到有什么柔软而微凉的布料绕上了自己的手腕。那是丝绸的触感，和右手腕上那根粗糙的旧丝带完全不同。雪乃的动作很快，手指在黑暗中熟练地打着结，一圈又一圈。

  借着微弱的月光，拉芙希妮看清了那个东西——那是雪乃平时用来绑头发的红色缎带中的一根。现在，它正牢牢地缠在她的左手腕上，在黑暗里显出一种不闪光的红。

  雪乃的手指在系完最后一个结之后，没有立刻收回。它在拉芙希妮的左手腕上极短地停留了半秒——短到几乎无法确认那是不是刻意的动作——然后才干净地退了回去。

  拉芙希妮的另一只手腕，那截焦黑的旧丝带原封不动地留在原处。雪乃的手指从头到尾没有向那一侧伸过。

  "这是……"拉芙希妮的声音里带上了一丝连她自己都未曾察觉的颤音。

  "睡觉——"

  那个刚刚完成系结动作的人，在一声轻微的布料摩擦后，翻过身去，将单薄的脊背留给了拉芙希妮——那是一个拒绝继续交流、也拒绝接受道谢的姿态。

  房间里再次恢复了之前的寂静。除了墙角由比滨结衣均匀的呼吸声，似乎什么都没有改变。

  拉芙希妮慢慢收回了两只手。

  她把它们并排放在了胸口。

  左手腕上是丝绸红缎带那种微凉、丝滑、稳稳压住脉搏跳动的触感；右手腕上是那截焦黑旧丝带被时间磨得粗粝、边缘微微起毛的触感。

  两只手腕，两种截然不同的重量。

  一只是过去必须背负的痕迹，另一只是现在被允许存在的证明。它们没有彼此覆盖，也没有相互抵消，只是各自安静地压在她胸口两侧，随着她的呼吸微微起伏。

  在这间并不宽敞的京都旅馆和室里，她静静地看着黑暗里那抹并不明显的红色，脸上露出了连她自己都没有察觉到的笑容。
