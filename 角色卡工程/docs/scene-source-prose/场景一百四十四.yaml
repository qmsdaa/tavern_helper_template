场景: 144
幕: "第十幕·冬去春来"
时间: "2015年3月11日 · 周三"
地点: "总武高·中庭长椅 → 特别栋走廊"
人物: "雪之下雪乃、雪之下阳乃"
POV: "共享场景／零POV"
正文: |
  三月十一日。下午四点，阳光从西边斜过来，把中庭的樱花树照成一半亮一半暗。树上还没有花苞。三月中旬的千叶，樱花还要再等两周。

  阳乃站在鞋箱区外面的走廊上。她穿着灰色的大衣，手里没拿包。雪乃从楼梯下来的时候，隔着三排鞋箱就看见了她。

  "你怎么进来的。"

  "访客登记。你学校的门卫记得我。"阳乃说。"我说来找妹妹。他让我登记了。"

  "什么事。"

  "没有事。经过千叶。"

  雪乃拨了一下肩上的头发。她刚从活动室出来，手里抱着两本习题册。习题册最上面贴了一张便签，笔迹是结衣的：小雪乃，你家那边最近有便利店吗？——以上是拉芙希妮酱让我帮忙写的。

  "中庭。"阳乃说。"坐一会儿。不耽误你太久。"

  中庭的长椅是木条钉的，经过一个冬天，椅面上有几道新的裂纹。姐妹两个坐下来，中间隔了一个人的距离。以前隔得更宽。现在这个距离，是两年多缩成这样的。

  "听说你考上一桥了。"

  "是。"

  "法学院。"

  "法学部。"

  "不是建筑。也不是政治。"

  "不是。"雪乃说。"是我自己选的。"

  阳乃把手插进大衣口袋。风吹过来，把她前额的头发吹散了一缕，她没有理。

  "以前你说'自己选的'——我会觉得你在证明什么。证明你不需要妈妈。证明你不需要我。"

  "现在呢。"

  "现在觉得——"她看着那棵还没开花的樱花树。"你可能真的只是在选。"

  雪乃没有说话。

  "奉仕部。"阳乃说。"这个名字。你们用了两年多。帮人填志愿，解决场地冲突，修业旅行丢了东西也找你们。一个人有烦恼，你们受理。一个人想不通，你们听。"

  "是。"

  "我到现在也不理解。为什么一群高中生要免费做这些。为什么不用这个时间准备考试、经营人脉、做对将来有实际利益的事。"

  "你不理解。"雪乃说。"这是事实。我不需要你理解。"

  "我知道。"

  阳乃把手从口袋里拿出来，放在膝盖上。

  "以前我用'不理解'当武器。我判断不了的东西，就判定为伪物。你的奉仕部，你选的人，你做的事——因为我不理解，所以它们是伪物。这个逻辑，我用过很多次。对你。对八幡。对很多人。"

  "嗯。"

  "现在不用了。不是因为我理解了。是因为——"她把手翻过来，看着自己的手心。"用'不理解'来判定，太懒了。不理解是我的问题，不一定是对方的问题。"

  雪乃转过头看她。阳乃在看她自己的手。

  "姐姐。"

  "嗯。"

  "你不是经过千叶。你是专门来的。你开了一个半小时的车。"

  阳乃没有否认。

  "这种话你以前不会说。"她说。"你会顺着我的说法——'经过千叶，顺便看看'——给自己留体面。"

  "体面。"雪乃说。"我以前以为那是体面。后来发现有比体面更需要留住的东西。"

  "比如。"

  "他们三个不需要我体面。"

  风停了。中庭很安静。远处操场上有人在跑步，鞋底踩在跑道上的声音，很有规律。

  "那个转学生。"阳乃说。"拉芙希妮。"

  "她怎么了。"

  "你叫她什么。"

  "苇草。"

  "她允许你这么叫。"

  "她主动给我的。"

  阳乃点了点头。过了一会儿。

  "她第一次和我说话的时候——已经是一年多以前了。那时候我就发现，她在看我。不是看雪之下阳乃。是看——某个她认识的人。她在用看另一个人的方式看我。"

  "她姐姐。"

  "对。我后来才知道。她姐姐。"阳乃把大衣的领子拢了拢。"不是不能问。是问不了——'那个人的轮廓'比'那个人'本身更不好处理。她自己知道吗。"

  "知道。"雪乃说。"但知道和改变是两件事。"

  "她和你说过。"

  "没有。不是每件知道的事都拿来讨论。"

  "所以你也在观察她。像她观察你一样。"

  雪乃没有否认。她把习题册放在膝盖上。便签的角被风吹起来了，她用手指压住。

  "这份东西。不是建筑。不是政治。不是妈妈。不是你。"她一个个数过来。"但是也不是为了对抗这些才选的。是我觉得——用规则保护人，这是我想做的事。不是因为谁期望。不是因为谁反对。是因为我看着这三个人，做了两年多的委托。发现这个世界上确实有人需要被认真对待。"

  阳乃看着她。看了很久。

  "雪乃。"

  "嗯。"

  "'我看着这三个人做了两年多的委托'——这句话比你过去的任何一句话，都更像你自己的。"

  雪乃把便签按平。指腹在纸面上轻轻走了一圈。

  "我还在找。"

  "找什么。"

  "你以前问过我——'真正的自己'。那时候我觉得这个词很空。现在不觉得了。"

  "找到多少了。"

  "法学部。一桥。不听妈妈的。不听你的。说'高兴'、说'不'、说'我需要时间'。接住别人的担心、不去分析。允许自己选错。"她说得很慢。"这些。加在一起，是现在的进度。"

  阳乃站起来，拍了大衣上不存在的灰。

  "听起来不少了。"

  "但还没找完。可能永远不会找完。"

  "嗯。"阳乃说。"找不完，但还在找。这个就是不伪。"

  雪乃也站起来。习题册收进书包，便签还在原来那一页。她拉上拉链。

  "姐姐。回去开车小心。"

  "嗯。"

  阳乃转身朝校门方向走了两步。又停住。

  "雪乃。"

  "嗯。"

  "毕业典礼。我会来。"

  雪乃看着她。

  "你想来。"

  "不是'想来'。是——你毕业这件事。我不想从别人嘴里听到。"

  雪乃把肩上的头发撩到后面。

  "好。"她说。

  阳乃走了。她的灰色大衣在走廊的尽头缩成很小的一个点，然后拐过弯，不见了。

  雪乃在中庭又站了一会儿。樱花树上还是没有花苞。但是树枝的末端比冬天的时候粗了一点。她把围巾解开，又系上。往活动室走回去。
