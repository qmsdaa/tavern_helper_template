场景: 100
幕: "第七幕·重新为奉仕部命名"
时间: "2014年4月6日 · 周日傍晚 · 春假"
地点: "总武高中 · 特别栋二楼 · 奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、爱布拉娜·都柏林（艾米丽在走廊等候）"
POV: "拉芙希妮"
正文: |
  “最后走的人记得锁门。”

  结衣把信封里的便笺念完，又翻过来确认背面。那里没有第二句话，只有平冢静潦草的签名和门卫室盖下的临时领用章。

  “真的只有这个？”八幡问。

  “还有钥匙呀。”结衣晃了晃手里的钥匙圈，“平冢老师说访客登记已经办好了，离校前把钥匙送回门卫室就行。”

  “也就是说，她把一个跨国家庭纠纷塞进活动室以后，决定用准时还钥匙来衡量我们是否具备基本社会责任。”

  “如果连钥匙都无法按时归还，我认为她的判断没有问题。”雪乃推开活动室的门，“比企谷君，请去隔壁空教室搬一把椅子。这里没有让客人站着接受委托的传统。”

  “什么时候变成我们接受委托了。”

  八幡嘴上抱怨，仍旧沿着走廊往隔壁教室去了。

  房间里残留着春假前最后一次打扫后的气味。长桌已经擦净，书架上的文库本也排得整齐，窗台边却积了一层很薄的灰。雪乃打开电热水壶，把带来的矿泉水倒进去。结衣站在窗边给新大谷幕张酒店打电话，反复说了几次抱歉。

  拉芙希妮没有加入任何一边。她脱下风衣，搭在椅背上。装着锡盒的内袋碰到木制靠背，发出一声轻响。

  “是……我明白。取消费用会照常支付。”

  结衣挂断电话，把手机放下。

  “因为已经过了免费取消的日期，对方会收一部分费用。不过他们说包间还没有准备餐点，所以没有想象中那么多。”

  “由我承担。”拉芙希妮说。

  “不用全部啦，我也同意改来学校的。”

  “地点是我临时更改的。”

  “那就之后再算。”结衣把手机塞回包里，拿起抹布擦窗台，“现在先别讨论钱。小企听见费用两个字，等会儿又要写一篇关于机场和酒店如何联合掠夺高中生的论文了。”

  门外传来椅脚擦过地面的声音。八幡抱着一把折叠椅回来，正好听见最后一句。

  “放心，我不会写。揭露行业黑幕之后还要负责提出解决方案，那已经属于无偿劳动的范畴。”

  他把折叠椅放在长桌另一侧。椅子比活动室原有的几把矮一些，坐垫也是教室里常见的深蓝色塑料板。结衣看了一会儿，伸手把它往桌边挪近。

  “会不会太随便了？”

  “学校里没有紫水晶和真皮座椅。”拉芙希妮说。

  “我不是那个意思……”

  “没关系。姐姐不会在意椅子。”

  她在意的是谁安排了椅子，又是谁默认坐下。

  水壶里的加热声停了。雪乃取出第五只纸杯，放在折叠椅前。活动室原有的茶杯只有四只，她没有从别处借一只看起来更合适的瓷杯。

  特别栋外传来汽车熄火的声音。

  几人都没有再说话。拉芙希妮重新穿上风衣，把锡盒留在内袋里。盒角贴在肋骨附近，随着她站起来的动作往下沉了一点。

  脚步声沿着走廊接近。艾米丽先出现在门口，手里没有行李，只拿着平板与一份访客证。她确认过门牌，把身体让向一旁。

  爱布拉娜停在门外。

  她没有立即进来。活动室里的旧桌、书架、热水壶和那把临时搬来的折叠椅都落进她的观察里。随后，她抬手摘下访客证，交给艾米丽。

  “你在外面等我。”

  “好的，大小姐。”

  艾米丽退到走廊另一侧。爱布拉娜走进活动室，顺手把门留了一道缝。

  “所以，这就是奉仕部。”

  “是。”拉芙希妮说。

  “比我从学校资料里看到的更小。”

  爱布拉娜走到折叠椅旁，没有马上坐。结衣端起纸杯，想把热水倒进去，雪乃抬手拦了一下。

  “需要红茶吗？”雪乃问。

  “谢谢，不必。”

  爱布拉娜坐下。折叠椅的高度让她比平时低了一些，但她只是把风衣下摆收好，双手交叠放在桌边。纸杯仍然空着。

  拉芙希妮坐在她对面。雪乃回到靠窗的位置，结衣坐在长桌侧面，八幡则把自己的椅子往后拉了一点。没有人坐在拉芙希妮与爱布拉娜之间。

  “你希望我亲自看的地方，我已经看到了。”爱布拉娜说，“现在可以告诉我，它能够解决什么问题了吗？”

  “它不能替我解决。”

  “很好。至少你们对这一点还有正确认识。”

  爱布拉娜取出家族专用手机，放在桌面上。屏幕亮着一份英文文件，标题是总武高向监护与留学事务联系人发送的学籍状态通知。

  “指导教师的调任已经生效。这个社团没有完成正式注册，活动室的使用许可也将在新学期重新审核。你提交了休学申请，原来的留学担保关系随之中止。你现在借住在一名已经调离学校的教师家里，没有长期登记的住址。”

  她说完，把手机转向拉芙希妮。

  “这些并非我的判断。每一项都写在学校的正式记录里。”

  屏幕上的日文条目排列得很整齐。休学、担保失效、住址待确认。拉芙希妮认得其中几行，那是她亲手填写的申请表被教务处重新整理后的版本。

  “你从伦敦寄来一封信，要求我在高三开学前到千叶。”爱布拉娜继续说，“我来了。你又把我带到一个下周可能已经不存在的社团。”

  她看着拉芙希妮。

  “亲爱的拉芙希妮，你准备把自己的未来交给它吗？”

  活动室里的水壶发出保温状态的轻响。窗外有运动社团结束训练，哨声隔着主教学楼传过来，已经变得很远。

  “她没有交给我们。”八幡说。

  爱布拉娜转向他。

  “比企谷同学，我没有询问你的愿望。”

  “我知道。只是提前排除一个错误选项。”八幡靠在椅背上，“高中生连这个社团下周还在不在都保证不了，更不用说谁毕业以后还会坐在这里。”

  “那么你已经替我证明了它并不可靠。”

  “大概吧。可她也没有把人生交给一群连社团登记表都填不完整的高中生。”

  八幡把桌上的空纸杯转了一下。

  “她只是让我们坐在这里，听她自己说完。”

  爱布拉娜没有评价。八幡也没有继续。他把纸杯推回原处，重新靠进椅背。

  “我也不知道以后会怎么样。”结衣忽然说。

  她说得比八幡轻，句子开头还有些发涩。爱布拉娜看过来以后，她没有转向雪乃。

  “我们可能会吵架，毕业以后也会去不同的地方。我没办法保证那些。”结衣把手机放在膝盖上，取消预约的确认页面还没有退出，“但今天是我自己要来的。拉芙希妮酱没有逼我。”

  “由比滨小姐，你的好意很真诚。”爱布拉娜说，“真诚无法替她恢复学籍，也无法承担医疗和居住责任。”

  “担保人可以承担程序责任。”雪乃接过话，“他的名字决定文件能否生效，却不能替都柏林同学决定文件上应该写什么。”

  “雪之下小姐，你似乎很擅长把形式与结果分开。”

  “至少比把它们全部归入家族所有更准确。”

  雪乃说完便拿起自己的茶杯。她没有喝，只把杯子放在手边。

  三个人都停了下来。

  爱布拉娜再次看向拉芙希妮。

  “你选择的人很聪明。他们知道怎样避免许下无法兑现的承诺，也知道怎样把责任限制在各自能够承受的范围里。”

  “这没有错。”

  “当然没有。可当这些范围结束以后呢？”

  爱布拉娜的语调依旧平稳。她甚至伸手替拉芙希妮把手机旁边那份文件往外推了一点，免得屏幕自动熄灭。

  “你学会了借用别人的语言，学会在他们在场时说一些过去不会说的话。等他们离开，学校收回这间教室，你仍然需要住处、医疗安排和能够对你的未来负责的人。”

  “我没有请他们替代你。”拉芙希妮说。

  爱布拉娜的手停在手机旁。

  “我也没有请他们替我决定。”拉芙希妮继续说，“一直替我决定的人，是你。”

  “我替你处理的是你当时无法处理的事情。”

  “然后它们就再也没有被还给我。”

  “你认为一张休学申请和一次临时搬离，已经足以证明你能够承担全部后果？”

  “不能。”

  这个回答让爱布拉娜安静下来。

  拉芙希妮没有去看其他人。她把手伸进风衣内袋，取出那只锡盒。

  盒子放到长桌上时，雪乃的茶杯轻轻碰了一下杯托。结衣认出了自己的发卡，却没有说话。粉色塑料边缘和红绸带的一角还留在盒内，拉芙希妮没有去动它们。

  她先拿出绿色钢笔。

  金属笔身在活动室的灯光下泛着旧光。拉芙希妮把刻字朝向爱布拉娜。

  “L, To Fly。”

  爱布拉娜看着那支笔。

  “她把它给了你。”

  “嗯。”

  “什么时候？”

  “在还火以前。”

  爱布拉娜没有再问。她把双手收回桌边，拇指在紫水晶胸针上擦过一下。

  第二件是那张残破的信纸。纸张被水泡过，边缘已经起毛。拉芙希妮没有把它推过去，只在自己面前展开。

  “她写了什么？”爱布拉娜问。

  “如果你能学会说不。”

  “只有这一句？”

  “后面的字被水泡掉了。”

  爱布拉娜低头看着那道中断的墨迹。

  “很像她会留下的话。”她说，“听起来温柔，也足够让一个孩子记很多年。至于说出拒绝以后要怎样生活，需要由谁处理，她从来不必写。”

  拉芙希妮把手伸回锡盒。

  烧焦的丝带比信纸更轻。边缘碳化后变得很脆，她只能托着中间还算完整的部分，把它放在绿色钢笔与信纸之间。

  布料落在桌面上，没有发出声音。

  可活动室里的空气突然变热了。烧焦纺织物的气味从记忆里翻出来，盖过电热水壶残留的水汽。顶层阁楼的木板正在裂开，有人伏在她背上，把落下来的热浪全部挡在外面。那份重量一直留到周围只剩下火声。

  拉芙希妮把手留在丝带旁边。

  “她承担了。”

  爱布拉娜没有动。

  走廊外传来艾米丽翻动文件的声音。纸页翻过以后，活动室里仍然没人开口。

  “那场事故中，Outcast作出了她自己的选择。”爱布拉娜终于说。

  “她叫达洛维。”

  “她放弃了这个名字所承担的职责。”

  “她没有放弃我。”

  爱布拉娜的声音低了一些。

  “你把她的死亡留在手腕上，带着它过了这么久。你认为这就是她希望看到的结果吗？”

  “我不知道。”拉芙希妮说，“她没能把后面的字写完。”

  她把烧焦丝带旁边的信纸压平。

  “姐姐，你把那一天叫作还火。”

  爱布拉娜没有否认。

  “我只知道达洛维小姐死了，我活了下来。”拉芙希妮说，“那不是仪式。”

  活动室的墙上挂着旧时钟。秒针走动的声音以前从未这么清楚。她背后的皮肤还残留着记忆里的热度，右腕那圈浅色勒痕却暴露在空气里，没有任何布料遮住。

  “她让我学会说不。”

  拉芙希妮抬起头。

  “所以，我不会回去。”

  “说不并不会让后果消失。”爱布拉娜说。

  “我知道。”

  “你现在拥有的学籍、住处与医疗记录，每一项都需要有人重新承担。这里的人可以陪你坐在一间借来的教室里，却没有人能够签署那些文件。”

  “那就找能够签的人。”

  爱布拉娜看着她。

  “你把问题说得很简单。”

  “你以前教过我，把复杂的问题拆开处理。”

  这句话让爱布拉娜停了一下。她转开手机，把学籍通知收回自己面前。

  “还火以后，是我签署了治疗和转院文件。”她说，“医生要求你离开原来的环境，也是我替你联系学校、确定住所、安排温斯顿留在日本。没有这些，你以为一句‘有海的远方’能把你带到哪里？”

  拉芙希妮记得医院的灯。

  她醒来时无法翻身，右腕裹着纱布，背后的药味混着烧伤病房里持续不断的消毒水气味。爱布拉娜坐在床边，手掌包住她没有扎针的那只手。那句“我在这里”很轻，也很真。

  “我记得。”拉芙希妮说。

  爱布拉娜准备好的下一句话没有立刻接上。

  “我醒来的时候，你握着我的手。”拉芙希妮继续说，“正因为记得，我才一直不知道该怎么拒绝你。”

  窗外最后一轮训练结束了。操场方向传来收拾器材的动静，有人在远处喊着明天见。

  “我没有否定你做过的那些事。”拉芙希妮说，“有海的远方，是我说的。来千叶，是我的请求。”

  她看着爱布拉娜。

  “你批准了它，但它不是你替我创造的人生。”

  爱布拉娜把家族手机锁屏。黑下去的屏幕映着活动室的顶灯，也映着桌面那三件旧物。

  “如果我现在拒绝呢？”

  “我会继续找别的办法。”

  “以休学状态留在教师家里，等一个没有顾问的社团替你提供办法？”

  “温斯顿先生可以签。”拉芙希妮说。

  爱布拉娜没有回答。

  “他已经是我在日本的教育协调人。”拉芙希妮继续说，“他知道总武高的程序，也能完成住址备案。姐姐，你不需要替长老会证明我已经回到你的安排里。你只需要不阻止他。”

  “你和温斯顿谈过？”

  “没有谈条件。他给我留了一个可以提前联系的窗口。”

  爱布拉娜听懂了。她没有追问温斯顿在邮件里用了什么句子，只把手机重新解锁，调出一页空白的备忘录。

  “他可以提出申请。”

  拉芙希妮等着后面的话。

  “是否适合承担新的责任，要由学校、温斯顿本人和我重新确认。”爱布拉娜说，“一封措辞有所偏移的邮件，并不等于他已经接受了你替他选择的位置。”

  “只要你不阻止他。”

  “你仍然把‘不阻止’理解成‘同意’。”

  “至少它们不再是同一个词。”

  爱布拉娜把手机放回桌面。她没有确认，也没有否认。

  雪乃放下茶杯。瓷器与杯托碰在一起，声音很轻。她没有替拉芙希妮追问结果。

  她站起身。折叠椅因为失去重量，椅脚在地面上挪了一下。桌边那只纸杯仍然空着。

  “明早，温斯顿会把文件带到学校。”

  她整理好风衣，走到门口。

  “你可以在正式文件面前，把今天的话再说一遍。”

  “我会。”

  “别空腹。”

  门外的艾米丽收起平板。两个人的脚步沿着特别栋走廊远去，直到楼梯间的防火门合上。

  活动室里没有人说话。

  拉芙希妮先把烧焦丝带托起来，放回锡盒底部。残破信纸沿着原来的折痕合拢，压在丝带上方。绿色钢笔最后放进去，与留在盒内的红绸带和粉色发卡靠在一起。

  她扣上盒盖。

  八幡从椅子上站起来，抱起那把临时搬来的折叠椅。

  “最后走的人记得锁门。”他说。

  椅脚擦过走廊地面，声音慢慢远了。
