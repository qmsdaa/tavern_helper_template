场景: 40
幕: "第三幕·二学期"
时间: "2013年11月中旬 · 修学旅行出发日清晨"
地点: "千叶站 → 东京站 → 新干线（开往京都）"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
正文: |
  深秋的清晨，千叶站检票口前的空气被修学旅行引发的嘈杂声填满。各种拉杆箱碾过地砖的钝响、带队老师被扩音喇叭放大的喊声交织在一起，形成了一道密不透风的噪音网。

  拉芙希妮·都柏林站在中央大厅一侧的方形立柱旁。她的制服穿得严丝合缝，与周围那些已经开始兴奋到有些松懈的二年级学生格格不入。她是最先抵达这里的，早于集合时间将近二十分钟。这个时间差完全不符合她平时那种被动且倾向于保持社交距离的作风。不断涌入的人群让她感到一种失去控制的压迫感，她翡翠色的眼睛在人群中漫无目的地扫过，指尖无意识地搭在右手腕那截烧焦的旧丝带上，反复摩挲。

  由比滨结衣和比企谷八幡几乎是同时从下层电梯走上来的。

  "拉芙希妮酱！这边这边！"

  结衣的声音极具穿透力地越过了那层噪音网。她快步穿过人群，目标明确地走到立柱旁，很自然地站在了拉芙希妮和涌动的人流之间。她没有去问对方为什么早到，也没有对那略显苍白的脸色发表评价，而是从口袋里掏出一个还带着自动贩卖机余温的易拉罐，直接塞进了拉芙希妮另一只空着的手里。

  慢悠悠跟在后面的八幡将双手插在外套口袋里。他顶着那双缺乏生气的死鱼眼，视线扫过拉芙希妮微微绷紧的肩膀，仅仅抛出一个干瘪的早安，便将目光移向了检票口上方的电子屏。

  距离集合时间还剩三分钟的时候，雪之下雪乃拉着一个款式极简的黑色旅行包走了过来。

  对于一个追求秩序和掌控感的人来说，这是一个计算误差。在雪乃的逻辑预判中，这个曾经因为林间学校委托而表现出明显抵触、对长途离家极度敏感的转学生，理应是最后一个踩着底线出现的人。

  但那阵微小的动摇并没有突破她面部表情的管理防线。雪乃收回视线，抬头看了一眼电子屏上的数字。

  "比预定时间还剩两分钟。"她用一贯冷淡且边界分明的声音切断了这种微妙的气氛，"既然人齐了，就准备进站。"

  从千叶前往东京的电车上，拉芙希妮坐在靠窗的位置。

  随着列车驶出站台，车厢内的平稳震动逐渐取代了候车室的嘈杂。窗外的街景开始以均匀的速度向后退去，熟悉的灰色建筑群被轨道下方交错的道路网切割。她的眼睛一眨不眨地盯着那条远去的海岸线，易拉罐残留的温度还贴在她的掌心。每一次站点的掠过，都意味着她在物理层面上离那个作为观察锚点的奉仕部日常更远了一步，同时也将不可避免地面临家族监控网络在长途移动中可能引发的震荡。

  在东京站换乘新干线的过程拥挤而急促。

  当他们最终挤过通道，在开往京都的指定席车厢里按照排数坐下时，车门发出了一声沉闷的闭合音。

  列车开始滑出东京站。窗外密集的高楼大厦被剥离，车厢内响起了乘务员关于抵达京都站预估时间的广播。
