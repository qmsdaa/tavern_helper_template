场景: 121
幕: "第八幕·归国与失语"
时间: "2014年8月2日 · 周六"
地点: "拉芙希妮公寓→成田机场→伦敦（A线）／总武高特别栋奉仕部活动室（B线）"
人物: |-
  A线（出发）：拉芙希妮·都柏林、温斯顿
  B线（千叶）：雪之下雪乃、比企谷八幡、由比滨结衣、比企谷小町、川崎大志
POV: "双线（A线拉芙希妮／B线零POV）"
正文: |
  清晨五点半，千叶的天空刚亮。

  拉芙希妮跪坐在卧室的矮柜前，打开了珍藏抽屉的最底层。

  绿墨水的钢笔躺在绒布里，笔帽上的刻字迎着窗外的光——To L-Fly。她把它取出来，放在桌上。然后，她把昨晚打印好的那张纸也放在旁边。

  往返机票的行程单。去程：八月二日，成田—希思罗。返程：八月二十八日，希思罗—成田，八月二十九日抵达成田。

  钢笔和返程票并排躺在桌面上，谁也不需要向谁解释。一个是"你可以走"，一个是"我会回来"。

  她看了两秒，把钢笔收回绒布、放回抽屉，把行程单对折，夹进护照。

  楼下传来碗碟轻碰的声响。家政太太已经在了。

  "拉芙希妮小姐，这么早。"厨房里，家政太太把早餐摆上餐桌，视线在她脚边的行李箱上停了一瞬，"伦敦那边，都安排好了吗？"

  "嗯。宅子里会有人来机场接。"拉芙希妮拉开椅子坐下，"只是回去过暑假。开学前就回来。"

  "一路平安。"家政太太微笑着说，又补了一句，"家里会想你的。"

  拉芙希妮低头喝麦茶，没有接话。

  ——

  上午九点，总武高特别栋。

  活动室的门开着，风扇摇头摆尾。结衣把六杯麦茶端上长桌，一杯一杯摆过去，摆到最后，手在第六个位置前停了一下，把多出来的那杯放回了自己面前。

  "拉芙希妮姐现在，应该在天上啦。"小町趴在自己的位置上，捧着手机。

  "九点半的飞机。"大志看了一眼墙上的钟，"还有半个小时才起飞。"

  "是十点二十分。"雪乃翻着面前的文化祭企划资料，头也不抬地纠正，"昨天送行的时候，她把行程单给大家看过。"

  八幡瘫在老位置，文库本摊在膝盖上："反正现在人在机场就行了。到伦敦要十二个小时，到了就是那边的下午。"

  "那，"结衣把杯子往中间推了推，"今天我们做什么呀？"

  "文化祭。"雪乃把企划资料转过来，面向大家，"三年级最后一次文化祭。执行委员会的说明会在八月末，但正式部门的企划要提前交。今天把方向定下来。"

  ——

  成田机场第二航站楼，值机柜台前排着不长的队。

  温斯顿站在队伍外侧，替她拿着一个牛皮纸文件袋。他今天没有穿平日里那身学校担保人式的深色西装，而是普通的旅行装束，但站姿仍然像一把收进鞘里的尺。

  "在留卡和护照都确认过了。"他把文件袋递还给她，"返程的值机，开放之后我会把提醒发到您手机上。伦敦那边的住处，宅邸的管家已经收到您的到达时间。"

  "谢谢你，温斯顿先生。"

  "分内之事。"温斯顿顿了顿，声音放低了半度，"在伦敦的期间，如果有什么手续上的事，请联系我。任何事都可以。"

  拉芙希妮抬起眼睛看了他一秒。

  "……好。"

  广播里响起登机通知。温斯顿退后一步，微微欠身，目送她走进安检通道。整个过程里，他没有问一句为什么。

  ——

  中午的活动室，文化祭的企划方向在白板上列了三行。

  "鬼屋不行，去年已经有三个班做了。"小町趴在桌上，笔帽咬在嘴里，"小町投咖啡店一票！穿围裙的那种！"

  "驳回。"八幡说，"穿围裙被同班同学看到的话，我的校园生活就彻底结束了。"

  "反正哥哥你穿什么都不想被看到吧。"

  "那，戏剧之类呢？"大志小声提议，"去年文化祭的时候，有班级自己写了剧本……我听姐姐说，反响很好。"

  雪乃的水笔在指节上敲了一下，没有立刻开口。

  手机在结衣的手边亮了起来。她瞥了一眼，整个人坐直了："来了来了！"

  群聊的界面里，是一张照片——舷窗外的云，机翼的尖端，阳光很白。下面跟着一行字：

  "起飞了。十二个小时后到。今天的第一条。——拉芙希妮"

  结衣的手指飞快地打字："一路平安！！到了记得吃东西！"小町凑过去补了一串熊猫表情。八幡摸出手机，打了一个字："哦。"想了想，又删掉，改成："落地记得报平安。"

  雪乃最后一个回复。她只打了两个字："收到。"

  然后她把手机扣回桌面，视线回到白板上："戏剧。方向可以留。下午把历年的企划书翻出来，看看别人是怎么失败的。"

  ——

  飞机穿过云层之后，就只剩下平稳的轰鸣。

  拉芙希妮靠窗坐着，膝盖上摊着那本英日对照的诗集，很久没有翻页。

  护照和行程单收在前座的口袋里。返程的那一程，八月二十九日，希思罗—成田。她自己订票的时候，温斯顿在电话里问过一次：单程还是往返。她回答往返，只用了两秒。

  去查明一件事，然后回来。这两件事，从买票的那一刻起，就被钉在了同一张纸上。

  她把诗集合上，望着窗外白得发亮的云海。

  十二个小时之后，她会站在那栋房子里。有些问题，只有那里才有档案；有些答案，只有她自己去拿。

  ——

  傍晚的部活散场前，雪乃在予定表的八月页上，把那张便签上的三行约定又描粗了一遍。

  八月二十九日那一格，她添了一行：拉芙希妮，归。

  锁门的时候，结衣把第六只杯子洗好、擦干，放回茶柜的上层，杯柄和另外三只旧杯子转向同一个方向。

  "走吧走吧！"小町在门口招手，"明天还要来呢！"

  五个人走进走廊。活动室的门在身后合上，风扇被关掉，值日表在门背后的阴影里待着。

  六张便签。五个名字。一个空格。

  没有人觉得它会一直空着。

  ——

  伦敦时间下午两点，希思罗机场的雨刚停。

  接她的车穿过湿漉漉的市区，停在一栋熟悉的、砖石颜色的宅邸门前。门厅的灯亮着，管家替她开门，接过行李，用多年不变的语调说"欢迎回来"。

  她的房间在三楼，床单是新的，书桌擦得一尘不染。窗户外面的伦敦，灯光比千叶密得多，也冷得多。

  拉芙希妮把护照和行程单放进书桌的抽屉里，又改变了主意，把它拿出来，立在台灯旁边。

  返程那一行写着：八月二十九日，成田。

  她坐在床沿，听着楼下老宅的钟敲了九下，没有开行李箱。

  明天，先去书库。
