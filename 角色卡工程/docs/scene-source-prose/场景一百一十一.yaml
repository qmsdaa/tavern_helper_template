场景: 111
幕: "第七幕·重新为奉仕部命名"
时间: "2014年5月13日 · 周二放学后"
地点: "总武高特别栋奉仕部活动室 → 特别栋一层楼梯间 → 中庭自动贩卖机前"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林、比企谷小町、川崎大志、一色彩羽、折本香织、高坂理津子"
POV: "共享场景／零POV"
正文: |
  委托记录在长桌上摊开时，窗外的天色还亮着。放学后的活动室里，只有翻纸和撕胶带的声音。

  公开流程表一共七页。拉芙希妮把它们按日期排进记录簿，边角对齐之后才涂胶固定。小町和大志负责清点借来的物资：夹板四块、胶带两卷、剩下的号码牌按号排成一列，等学生会来人验收。

  “号码牌少了三张。”大志把排好的纸又数了一遍。

  “在样品袋里。”小町从抽屉里拿出一只透明袋，“小町留了‘还没登记’‘已经登记’各一张，还有一张箭头画得最好的。都是拿空白号码牌改的，正好三张。”

  “留下来做什么？”

  “下次再办活动，照着做就不用从头想了。”

  大志看着那三张纸，认真地点头，在清单上把它们登记成“留档样品”。

  结衣把麦茶一杯杯放到各人手边。茶壶落回桌上时，她顺手把八幡那罐没开的MAX咖啡往他座位里侧推了推，免得被清单压住。

  雪乃把一色上次送来的整改确认单钉进记录，声音不高，每个环节都点得到人。

  “再确认一次归档范围。奉仕部经手的只有到场确认、候场动线、入口标识和公开流程记录。”

  “装材料的封套呢？”大志问。

  “封套由两校负责教师当场交接，我们只核对数量和交接时间。”雪乃把那张交接单翻过来给他看，“内容物不经过奉仕部，记录上也不会出现。”

  “也就是说，我们连里面有没有装错都不知道。”八幡说。

  “我们只需要知道，那不该由我们知道。”雪乃把交接单放平，“那些部分写在流程里，比写在保证书里有效。”

  高坂是这时候进来的。她接过记录簿从头翻到尾，在顾问确认栏签了字。

  “PTA的复核还没有结束，原始记录继续保留。”她把记录簿还给雪乃，“不过按流程，这件委托到今天就闭环了。”

  “辛苦了。”雪乃说。

  高坂走到门口，又停下来。

  “公开流程表做得不错。下次别的部门办跨校活动，会来借这份样板。”

  门在她身后关上。小町立刻挺直了背。

  “被表扬了！是顾问老师的表扬哦，哥哥。”

  “被表扬的是表格。你可以不用替它挺背。”

  “小町挺的是自己的背。”

  一色抱着文件袋进来，先把一只信封放到桌上。

  “京王联络教师的确认回执。对方学校对动线和标识没有异议，对‘只叫号码’那一条特别满意。”

  “最后那句不用转达也可以。”八幡说。

  “要转达的，那是前辈唯一的正面评价。”一色把回执推给雪乃，又从文件袋里抽出验收单，“夹板四块、胶带两卷、粗记号笔——”她抬头清点桌面，“一支不少。很好，通缉令暂缓执行。”

  “用委员会经费印刷的通缉令，本来就该暂缓。”

  “前辈对经费的关心，总是出现在最不该出现的时刻。”

  雪乃把回执夹进记录，核对清单。

  “还差海滨综合的观察反馈表。”

  “折本学姐说今天放学后顺路送来。”一色在验收单上签字，“应该快到了。”

  话音落下没多久，敲门声响了。

  折本香织站在门口，海滨综合的制服上别着访客证，透明文件夹举在胸前。

  “打扰了——啊，一色会长也在，正好。”

  她把文件夹递过去。

  “我们学校的观察反馈表。老师检查过了，说都是公开内容，可以直接交给学生会。”

  一色当场翻开核对。小町踮着脚从旁边看。

  “字好大。”

  “写大了，后面的人才看得清嘛。”折本说。

  反馈表里夹着一张手绘示意图，画的是那块写着“还没登记／已经登记”的夹板，箭头被描得很粗。

  “我们老师说，这个要带回去做样板。”折本指着那张图，“我就说是总武高一年级画的。”

  小町的背又挺直了。八幡看了她一眼，把到嘴边的话咽了回去。

  一色签完接收单，把复写页交给折本。

  “收到了。这样，联合体检的全部公开材料就齐了。”

  “欸，顺利结束，太好了太好了。”

  一色抱起文件袋告辞。门关上之后，折本却没有走。她站定了一秒，侧耳听了一会儿头顶的动静，才开口。

  “小企。现在有空吗？”

  活动室里的翻页声停了半拍，又继续下去。

  八幡把椅子推回桌下。

  “……有。”

  雪乃没有抬头，把需要八幡签字的那一页往桌沿挪了半寸。

  “回来后签字。只签流程确认，别写感想。”

  “我的感想就那么不值得存档吗。”

  “小企，麦茶给你留一杯哦。”结衣说。

  小町挥了挥手，什么都没问。拉芙希妮把流程表的下一条压平，指尖在右手腕的焦黑旧丝带上停了一停，随即继续涂胶。

  八幡和折本走出活动室。门在身后合上前，里面传来大志继续数号码牌的声音。

  特别栋一层的楼梯间比走廊暗一些。折本下到一半，忽然停下。

  “去哪儿好呢。中庭可以吗？自动贩卖机那边。”

  “有话要说的人是你，地方也归你挑。”

  “那就中庭。”

  中庭的长椅空着。折本在贩卖机前站了一会儿，投币买了一罐乌龙茶，问八幡要不要。八幡摇头。她在长椅一端坐下，拉开拉环，先喝了一大口。

  “啊——活过来了。三年级真的好累。”

  “……你要说的就是这个？”

  “不是不是。”

  她把罐子放在膝盖上，双手捧着，转了两圈。

  “五月八号那天，体检。你们在入口旁边改表格的时候，我就在对面。”

  八幡靠着长椅的扶手，没有坐。

  “你拿尺子，把一张纸划成两栏。到场归到场，装信封的归装信封。后来我们老师说，想出这个分法的人，‘很有边界意识’。我听她说了名字，想了半天。”

  折本抬起头。

  “小企？那个小企？对不上。”

  “人过了两三年，总会变一点。”

  “嗯。所以我重新想起来了。”

  她把乌龙茶转了半圈，易拉罐在膝头轻轻响了一声。

  “初二的时候，你跟我告白过吧。”

  “……嗯。”

  “我拒绝了你。”

  “然后第二天，我在班里跟女生们讲了。”折本说，“当笑话讲的。‘欸你们知道吗，小企跟我告白了哦’——就那样。全班都知道了。”

  中庭另一头有学生在扫地，竹扫帚的声音一下一下，隔得很远。

  八幡插在口袋里的手指停住了。他看着贩卖机侧面那排白天也亮着的指示灯。

  “对不起。”折本说，“那种事不该拿去讲的。我那时候不知道。等我觉得‘啊，是不是不该讲’的时候，已经全班都知道了。”

  八幡没有说话。

  “被拒绝已经够丢脸了，还弄得人尽皆知。你后来再也不跟我说话了。我就想，他肯定觉得超丢脸的。”

  她捏着罐子的手用了点力，铝罐咔地凹下去一小块。

  “后来我想道歉，又觉得过了那么久还专门提，也很奇怪。就一直没提。……你肯定很恨我吧？换了我，我也恨。”

  “别。”

  八幡开口了。声音跟平时一样干。

  “道那么多歉，搞得好像我这辈子都砸在你手里了似的。你没那个功劳。”

  “……欸？”

  “你拒绝的是一次告白。”八幡说，“告白这种事，开口就有被拒绝的可能。你拒绝了，到那里为止，事情是完整的。”

  折本眨了眨眼。

  “后面还有一条。‘这家伙连真心都是个笑话’——那条是判决。”

  八幡的视线从指示灯上收回来，落在自己的鞋尖。

  “判决不是你下的。你那天只说了一个‘不’。后面的罪名，是我后来自己加上去的。”

  他停了一拍。

  “加错了。所以现在撤诉。”

  竹扫帚的声音还在远处一下一下地响。折本捧着乌龙茶，眉头慢慢皱起来，是那种解数学题时的皱法。

  “……小企，你说话还是这么难懂。”

  “经常有人这么说。”

  “不过，‘撤诉’就是‘没事了’的意思吧？”

  “嗯。没事了。”

  “那就好。”

  她长长吐出一口气，整个人往椅背上一靠。

  “真的，我一直惦记着。上次在你们活动室见到你就想说了，结果那天有老师在。八号那天叫住你，又被广播盖掉了。今天再说不上，我可就要毕业了哦。”

  “海滨综合的校历，不会因为我的私事推迟。”

  “是说我自己会憋到毕业啦。”

  折本笑了一声，把乌龙茶喝完，起身投进旁边的回收桶。罐子落进去，响得很干脆。

  “对了，体检那天我就想说。小企，你变可靠了呢。”

  “被拿去和初中生比，可靠也高兴不起来。”

  “那就当我没说。”

  她一点也不介意，拎起书包甩到肩上。

  “替我跟你们部长问好，还有那个画夹板的一年级。那块牌子，谁看了都懂，真是好东西。”

  “自己当面说。又不是再也见不到。”

  “也是哦。”

  折本朝校门方向走了几步，又回头挥了一次手。八幡抬了抬手，算是回应。她的背影混进放学的学生里，很快就分不出来了。

  八幡在原地站了一会儿，把手从口袋里拿出来，往特别栋走回去。

  活动室里的麦茶续过一轮。大志把号码牌的清单交给雪乃，小町正往样品页上贴那三张留档的号码牌，胶带撕得很小心。

  八幡推门进来。

  “哥哥，回来啦。”小町举着手里的胶带，“正好，样品页还差一个角。”

  “欢迎回来。”结衣把留着的麦茶放到他座位旁边。

  大志朝他点了点头，继续核对清单。拉芙希妮把最后一页流程表压平，没有抬头。

  八幡在自己的位置坐下，拿起桌上的圆珠笔，在“动线与标识”一栏后面签下名字和日期。字迹和前面几页一样，没有多出一笔。

  “谈完了？”雪乃问。

  “谈完了。”

  雪乃应了一声，收回记录簿，从头核对一遍签名，在最后一页写下“归档完成”。水笔的笔尖离开纸面，封面合上。

  “委托结束。”

  “辛苦了——”小町拖长了声音。

  大志把码齐的夹板推到桌角，说明天一早还回学生会。结衣开始收杯子，收到八幡手边时，把那罐MAX咖啡往他面前又推近了一寸。拉芙希妮盖好胶水，放回茶柜旁的收纳盒。

  八幡拿起那罐咖啡。拉环被拉开的声音，在活动室里轻轻响了一下。
