场景: 136
幕: "第十幕·冬去春来"
时间: "2015年2月5日 · 周四"
地点: "总武高特别栋奉仕部活动室"
人物: "比企谷小町、川崎大志、比企谷八幡、雪之下雪乃、由比滨结衣、拉芙希妮·都柏林、铃木（一年级委托人）"
POV: "共享场景／零POV"
正文: |
  二月第一个周四，下午四点刚过，活动室的门被推开了一条缝。

  不是小町的推法——她推门从来不用犹豫。也不是大志的推法——他会先敲两下。这条缝只开了十厘米，停在那里。

  "请进。"雪乃合上习题册。

  门缝又宽了一点，露出一张脸。一年级，短发，不认识。她手里抱着一把折叠伞，水蓝色的，伞面收得很整齐，系带系成了蝴蝶结——不是原配的那种系法，是仔细重系过的。

  "那个……"她的声音卡在喉咙口，"请问，比企谷前辈……的妹妹，在吗。"

  八幡从文库本上方抬起眼睛。小町正在茶柜前给自己倒麦茶，闻言转过身来。

  "在哦。什么事？"

  女生把伞往前递了半寸，又收回去。"我……在走廊上碰见川崎前辈，他说可以来这里找。"

  大志跟在她后面进来，朝长桌点了点头，去茶柜拿杯子。两杯麦茶。一杯放在小町手边，一杯端在手里，靠窗边坐下。他没有解释为什么把一年级女生指到奉仕部来。

  "伞。"女生说，总算把最关键的字吐了出来。

  小町接过伞，翻了一面。"很干净。不是来还的？"

  "是要还。但不是还给我。"

  活动室里安静了几秒。不是那种戏剧性的安静——是四个人同时选择不插嘴。

  "是朋友的伞。"女生低下头，"上个月借的。现在想还。但是不想直接还。"

  "闹翻了？"小町问。声音放得很平。

  女生点了一下头，没出声。

  "多久了。"

  "两周。"

  "还伞的话，放学后放到对方的鞋箱里就可以了。"雪乃说。她的语气不是否定，是提供选项。

  "试过。"女生说，"走到鞋箱前面，碰到她同班的两个人。她们看见我手里的伞，什么都没说。我把伞又拿回来了。"

  "怕被看见？"结衣问。

  "怕被看见偷偷放回去。也怕被本人看见。"

  结衣没有追问。怕的是什么——怕对方以为这把伞是求和的道具，也怕对方以为这把伞什么都不是。

  "你希望我做什么？"小町把伞放在桌上。

  "我不知道。"女生说，"我只是……不想拿着别人的东西。"

  八幡的视线在文库本上停了很久，翻过一页。什么都没说。

  拉芙希妮把深蓝色的杯子放回碟子里。动作很轻，没有声音。

  大志在窗边开口了。

  "对方知道你借过这把伞吗。"

  "知道。那天是她主动借给我的。"

  "那就不是误会。"大志说，"她把伞给你的时候，和现在不想见你，是两件同时存在的事。"

  女生抬起头看他，好像没想到这句话会从一年级的嘴里出来。

  小町把伞拿起来，又看了一遍。伞骨有一根微弯，伞柄的标签已经磨掉了——不是什么贵东西，但用了一段时间。

  "这样。"小町说，"这把伞先放在这里。明天下午你再来一次。不要带东西，不要准备话。"

  "然后呢？"

  "然后的事情，然后再说。"

  女生看着她，又看看大志。大志点了一下头，没有追加任何保证。

  "谢谢。"她朝门口退了半步，又停下来，"我叫铃木。"

  "嗯。"小町说，"明天见。"

  门合上。走廊里的脚步声轻了下去。

  八幡把文库本放低了一点。"小町。"

  "嗯？"

  "你刚才那个'然后的事情然后再说'，是现编的还是事先想好的。"

  "现编的。"小町把伞靠在自己椅子旁边，"哥哥有意见吗。"

  "没有。"他又把书举回去，"编得不错。扣分豁免一次。"

  "才豁免一次？！"

  结衣趴在桌边，看了看那把水蓝色的伞。"那个孩子，肯定很喜欢她的朋友。"

  "嗯。"拉芙希妮说，"所以才在鞋箱前面转身了。"

  雪乃翻开委托记录簿，在新的一页上写了日期和委托人姓名，然后在基本事项那栏空着——委托人本人还没有提出明确事项，不能替她填。

  "受理中。"她写完最后三个字，笔帽按回去。

  大志把那杯麦茶喝完了。杯底剩了一点，他没有续。

  "明天下午。"他说，"我去鞋箱那边看看。"

  小町看着他，笑了。"大志，你刚才那句话，适合做奉仕部的人。"

  "已经是了。"他说。
