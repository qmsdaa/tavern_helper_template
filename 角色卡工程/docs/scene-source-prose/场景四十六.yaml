场景: 46
幕: "第三幕·二学期"
时间: "2013年11月18日 · 修学旅行归后第一日 · 清晨"
地点: "拉芙希妮公寓玄关 → 总武高校门口 → F班前门 → 通往J班的楼道口"
人物: "拉芙希妮·都柏林、比企谷八幡、雪之下雪乃（+背景人物：家政太太·仅提及）"
正文: |
  公寓玄关处还残留着昨晚家政太太那略带审视的目光。当那个负责维持日常并充当远洋眼线的中年女人，用看似不经意的语气询问手腕上为何多出红色时，拉芙希妮只用一句干燥的"在京都购买的普通纪念品"便将对话彻底锁死。只要她的语气足够平稳，那条越洋的视线就无法轻易将这根缎带定义为某种体系外的异常。

  第二天，清晨的总武高校门口。

  冷空气让三三两两结伴入校的学生纷纷缩起脖子。比企谷八幡像往常一样，佝偻着背，试图贴着校门的边缘将自己强行混入路人的背景板中。

  但在视线掠过前方的瞬间，他的脚步停住了。

  几步远的地方，拉芙希妮·都柏林正站在那里。她的深蓝色校服一如既往穿得没有任何褶皱，但真正让八幡的死鱼眼卡壳的，是她没有像往常那样紧紧拽着袖口，而是大方地将双手垂在身侧。

  她的左手腕上，赫然系着一条鲜艳的红绸带——无论是那带着微弱光泽的材质，还是绑系的弧度，八幡怎么看都觉得异常眼熟。而在她的右手腕上，那根尾端烧焦的旧丝带依然顽固地待在原处。

  一红一黑，一新一旧，分布在左右手腕上，形成了一种近乎对峙又奇异平衡的对称感。

  在这个人来人往的校门口，这种明晃晃将某种"专属标记"展示出来的做法，让八幡那原本就习惯性防备的神经直接被绷到了极限。昨天在新干线上，这个留学生刚用"空气恶心"的理由把他堵得毫无退路，今天就毫不避讳地把那个冰块女的私人物品挂在左手上招摇过市。这是嫌昨天车厢里的沉默还不够沉重吗？八幡默默为自己的死鱼眼被卷入这场早晨修罗场的社交责任表示哀悼。

  拉芙希妮敏锐地捕捉到了身后的视线停顿。她转过身，翡翠色的眼睛在八幡身上扫过，随后顺着他的目光，坦然地垂眼看了一下自己那截红色的左手腕。

  "早安，比企谷同学。"她的声音在晨风里显得很通透，没有任何企图遮掩的局促，甚至还带着一点明显的审视，"看你今天的状态，你的心情好像没有你身上气息表现的那么差。"

  八幡硬生生把视线从那两条扎眼的丝带上挪开，偏过头看着校门旁的石柱，干巴巴地呼出一口白气。

  "啊，早。承蒙你昨天那番大张旗鼓的'空气净化'演说，我现在感觉自己的精神状态好了不少。"八幡把双手插进大衣口袋里，语气里的嫌弃与无奈混杂在一起。

  通往教学楼的步道在早晨的阳光下泛着清冷的白光。这句刻薄的吐槽并没有让拉芙希妮停下脚步，她只是顺理成章地和比企谷八幡维持着半步远的横向距离，一同汇入入校的人流中。

  走到二楼F班的前门时，周围属于班级小团体的喧闹声明显大了起来。八幡停住脚步，盯着门框上掉了一半漆的班级牌，双手在大衣口袋里用力地掖了又掖，肩膀绷得很紧。

  "……那个，"他没有转头，声音干瘪得像是要从喉咙深处硬生生刮掉一层皮才挤出来，"昨天在那条街上，还有在车上……虽然你多管闲事的时机抓得很烂，但，总之就算我欠你一次。"

  拉芙希妮稍微偏过头。这个男生明明已经被彻底堵死了自爆的退路，却还要用这种最不讨喜的嘴硬方式，把"谢谢"这两个字包装成一笔带过的糊涂账。她看着对方那躲闪的视线，忍不住轻轻笑了一下。

  那个笑容很短，收起了面对都柏林家族眼线时那种完美的疏离，带上了一点真切的愉悦与放松。

  "比起计算欠了多少次，你更应该学会的，是如何不在第一时间把自己放到危险的处境里。"拉芙希妮看着他那瞬间僵住的侧背影，声音放得很轻，"比企谷同学，下次再做那种恶劣的街头排练，我可能就没有那么好的演技来配合你圆场了。"

  没给八幡反应或反唇相讥的时间，她便干净利落地转身，向着楼层另一端通往J班的楼道口走去。

  然而，就在她刚刚拐过走廊的转角，准备踏上向上的台阶时，呼吸却不由自主地停滞了一拍。

  雪之下雪乃正站在上一级台阶的缓步台上。

  她今天没有像往常那样将黑色长发规整地披散，更没有用任何发饰在两侧固定，而是罕见地将那一头长发全部束起，扎成了一个利落的高马尾。光洁的后颈线条毫无保留地暴露在空气中，搭配上一副反着微冷亮光的细黑框防辐射平面眼镜，让她整个人在这个稍显灰暗的楼道口显得异常锋利，甚至耀眼得有些让人不敢直视。

  这种大张旗鼓的风格改变，在极度追求正确与惯性的雪乃身上，绝不可能是心血来潮。拉芙希妮悬在半空的脚缓缓踩实，手指无意识地收紧。

  雪乃站在高处，那副平光镜镜片反射着楼道窗户投进来的冷光。深蓝色的眼眸透过镜框的上缘，越过那十几级台阶的距离，准确无误地落在了拉芙希妮此刻并没有隐藏在袖口里、而是明晃晃系在左手腕的那抹鲜艳红色上。

  冷空气在楼道口凝滞了一瞬。高马尾的改变，与那条宣告主权般的红绸带，在两人的视线交汇中完成了精准的碰撞。
