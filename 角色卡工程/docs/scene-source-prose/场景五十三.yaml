场景: 53
幕: "第三幕·二学期"
时间: "2013年12月中旬 · 一色选举结束后一周（推定2013/12/13周五）"
地点: "奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、一色彩羽、平冢静（+ 隐性提及：雪之下阳乃、折本香织）"
正文: |
  指针式时钟的秒针跳过了三点半的刻度。

  雪之下雪乃照例坐在靠近热水壶的位置，正往陶瓷杯里注水。蒸气沿着杯壁升起，在她垂落的额发边缘镀上了一层模糊的白。拉芙希妮坐在她身旁，左手按着那本黑色笔记本的封面，右手翻动着一册文库本，书脊上印着某个听都没听过的法国人的名字。

  由比滨结衣把一个用圣诞色保鲜膜裹着的搪瓷盒墩在了长桌正中央。

  "锵锵——！妈妈牌芝士蛋糕！因为冰箱里奶油快过期了所以赶着用掉的版本！"

  "……把'因为快过期了'这个前缀去掉再说会比较好。"八幡从摊开的文综参考书后面抬起眼皮，用筷子戳了戳保鲜膜的边缘，"而且为什么是圣诞色，现在才十二月中旬。"

  "提前准备是一种美德嘛！雪之下酱也会这么说的吧？"

  雪乃将泡好的红茶依次推到各人面前，动作精准且不需要抬头确认位置。听到结衣的追问，她只顿了一拍。

  "提前准备确实是必要的。"雪乃端起自己的杯子，视线没有从茶汤的液面上移开，"但前提是准备的东西本身没有问题。你刚才那个前缀，确实存在减分的余地。"

  "小雪乃也这样说吗！明明味道很好的！"

  结衣鼓起腮帮子抗议，但手已经开始利落地撕开保鲜膜。蛋糕的切面并不规整，奶油层厚薄不均，有几颗蓝莓滚到了盒底。这丝毫没有影响她将它切成四份的热情。

  拉芙希妮在文库本的页角折了一个小三角，将书合上，推到笔记本旁边。她接过结衣递来的盘子，用叉子切下一小块送入口中。

  "味道很好。"她放下叉子，用一种陈述天气的平淡口吻补充道，"奶油的过期风险被芝士的浓郁度完全遮盖了。"

  "……这种夸法反而让人在意起那个遮盖的部分了。"结衣的嘴角抽了一下。

  八幡闷声笑了一下，随即被蛋糕噎住，咳了两声。雪乃将一杯红茶无声地推到了他手边，动作自然得像是顺手整理桌面的一部分。

  "那个——"结衣在椅子上换了个坐姿，两条腿晃了晃，"话说回来，圣诞节你们有什么安排吗？"

  活动室里响起了叉子碰到瓷盘的轻响。

  拉芙希妮端着茶杯的手指微微收紧，但表情没有变化。雪乃的视线从茶汤表面移开，落在窗外灰白色的天空上。

  "没有特别的安排。"雪乃的回答比平时慢了大约半秒。

  "我也——"八幡刚开口。

  话还没说完，活动室的拉门被人从外面猛地拉开。

  "啊——！果然在这里偷懒呢，前辈们！"

  一色彩羽站在门口，两只手背在身后，歪着头露出一个无懈可击的笑容。她身上披着学生会长专用的绶带，位置端正得像是焊上去的。

  她走进门时的脚步比平时轻，像是在验证这间房间对她是否仍然安全。

  "新学生会正在统计各社团的圣诞活动预算申报哦？奉仕部的呢，虽然有老师担保不用提交正式申请，但作为负责任的会长，人家还是特意来口头确认一下的。"

  "……你只是想找个理由过来吧。"八幡的死鱼眼精准地锁定了目标。

  一色完全没有被戳穿的自觉，迈着轻快的步子走进活动室，在长桌边停下来，视线依次扫过蛋糕盒、红茶杯和那本黑色笔记本。

  "哇，好温馨。要不要把我也算一份？"她说着，已经自然而然地从盒子里拿走了八幡盘子里剩下的半块蛋糕。

  "那是我的——"

  "学生会长慰问部员的营养补给，前辈不会介意的吧？"

  一色咬着叉子，眯起眼睛笑了。那个笑容确实由砂糖、香辛料和某种美好物质构成。

  雪乃安静地看着这一幕，将茶杯放回桌面。她没有发表评论，只是将热水壶的开关重新按下，多拿出了一个干净的杯子。

  "……既然来了就坐下。站着吃对消化不好。"

  一色愣了一瞬，随即笑容里多了几分真实。

  "谢谢雪之下前辈~"

  结衣看着突然多出来的第五个人，愣了半秒后笑了起来，从书包里翻出了另一个搪瓷盒。

  "太好了！正好还有另一款。"

  "你家的冰箱到底是什么构造。"

  八幡的吐槽声刚落，背后的拉门便发出一声不堪重负的刺耳摩擦音。

  还没等众人转头，带有凛冽冷空气的白大褂衣角已经划破了室内因红茶和暖气堆积起来的慵懒。平冢静大步跨入活动室，手里抓着一叠略显凌乱的打印纸。

  "既然连学生会的新任会长都在，那正好省得我两头跑了。"

  平冢静没有理会桌上的半成品芝士蛋糕，径直走到长桌的前端，将那叠打印纸"啪"地一声拍在了桌面正中央。力道之大，让装蛋糕的搪瓷盒都跟着震了一下，几颗蓝莓从边缘彻底滚落到了桌面上。

  结衣吓得缩回了刚准备去拿第二盒蛋糕的手，一色咬着叉子的动作也僵在了半空。

  "京王高中那边发来了联合圣诞企划的合作邀请。"平冢静的语速很快，带着不容反驳的强硬，"校方已经初步同意。作为总武高的代表，学生会必须主导这次联合活动的筹备。"

  听到"京王高中"这个词的瞬间，八幡本打算将椅子往后挪的动作猛地顿住了。他的脊背比刚才瘫坐时挺直了一些，死鱼眼里那点残存的放松消失得干干净净，取而代之的是一种充满防备的僵硬。

  拉芙希妮敏锐地捕捉到了八幡身体重心的微小偏移，她的视线在八幡和那份文件之间停留了半秒，又安静地收了回来。

  一色彩羽咽下嘴里的蛋糕，迅速调整了表情。她放下叉子，将双手交握放在胸前，原本随意搭在椅背上的绶带被她刻意地拉正了一些。

  "那个……静老师。人家才刚刚上任，连本校的预算都没理清楚呢。这种跨校的大型联合企划，交给毫无经验的一年级新生来主导，是不是太草率了点呀？万一搞砸了总武高的名声就不好了。"

  她的声音软糯，尾音在"搞砸"两个字上刻意拖了半拍。

  "收起你那套多余的表演，一色。"平冢静毫不客气地打断了她，"你既然戴着这条绶带，拿着那份'华丽'的竞选承诺坐在这个位置上，这就是你躲不掉的责任。我不是来征求你意见的，我是来下达通知的。"

  一色的假笑卡在了嘴角，她用眼角余光恶狠狠地扫了八幡一眼，显然将自己被架在火上烤的现状全算在了当初帮她炮制竞选方案的人头上。

  压制完一色后，平冢静的视线转向了长桌另一端。

  "雪之下。虽然名义上是学生会主导，但光靠这群新生肯定会捅出篓子。奉仕部作为协助方，一同参与前期的筹备会议。"

  雪之下雪乃并没有马上去看桌上的文件。她慢慢地伸手，端起刚才给一色倒好的那杯红茶，将其精准地推到了离一色手边二十厘米远的位置。

  "如果这是来自校方的正式指派，奉仕部自然会予以协助。"雪乃的声音和刚才端茶时一样平稳，"但平冢老师，协助的前提是明确责任划分。我不接受为了配合对方学校的社交辞令，而导致本校筹备进度产生逻辑上的混乱与低效。"

  "那是你们在会议桌上该去解决的问题。"平冢静从口袋里摸出一个打火机在手里转了两圈，又烦躁地塞了回去，"第一次碰头会安排在下周一放学后，在我们的第三会议室。资料一人拿一份，周末给我好好看熟。"

  平冢静说完最后的要求，没有再给任何人讨价还价的余地。她伸手把桌上那叠资料往前推了推，没有再抬头看任何人一眼，转身便大步走出了活动室。

  平冢静已经拉开了门，冷风裹挟着走廊的寒意灌了进来。她停在门槛处，像想起了什么无关紧要的琐事一样，微微偏过头。

  "顺便提一句，这次联合活动的对接人，是京王方面的雪之下阳乃——她说想借这个机会，顺便介绍一位海滨综合的朋友给你们认识。"

  拉门被重重合上，将平冢静的背影和走廊的冷空气彻底隔绝在外。但活动室内的温度并没有因此回升。

  "阳乃学姐？"一色彩羽眨了眨眼睛，原本还在为担责任而懊恼的表情被一丝好奇取代，"听起来是个很难应付的大人物呢。而且还要介绍新朋友……海滨综合也是千叶市的学校吧？"

  没有人回答她。

  雪之下雪乃的背脊在这个名字出现的那一刻，便不可遏制地挺直了。她交叠在膝上的双手缓慢地收紧，原本摩挲着茶杯的手指停在半空，随后又生硬地放回了桌面。她的目光直直地盯着桌子正中间的那叠资料。

  但让这间活动室真正陷入死寂的，并不是雪乃的敌意。

  如果说刚听到"京王高中"时他还在试图掩饰，那么当"海滨综合的朋友"这几个字砸下来后，他的伪装彻底宣告失效。他撑在膝盖上的双手不知何时已经攥成了拳头，手背上绷紧的线条隔着薄薄的校服布料也清晰可见。他将头埋得很低，长长的刘海遮住了死鱼眼里的神色，但那沉重的呼吸声，在这间只有暖气杂音的活动室里，清晰得像用秒表能数出节拍。

  由比滨结衣有些不知所措地看看雪乃，又看看八幡。她大概是这间屋子里唯一一个对那个"海滨综合的朋友"毫无概念的人，但这并不妨碍她察觉到这种比之前更甚的、几乎要让人窒息的恐慌感。

  "小企……"她小声试探着，手指无意识地搅动着自己的裙摆，"你……身体不舒服吗？"

  八幡没有立刻回答。他的喉结上下滚了一次，又一次，花了几秒钟才从那种极度抗拒的状态中找回自己的声音。

  "……我没事。"这句话在他的喉咙里停了一秒才出来。他胡乱地抓了一把头发，重新直起腰，勉强摆出平时那副嫌麻烦的死鱼眼嘴脸，"只是觉得这种联合活动麻烦得要死，还要搞什么'介绍朋友'的无聊戏码。"

  雪乃侧过脸，没有去看八幡拙劣的掩饰。她看着窗外的冷白光线，声音比玻璃上的霜花还要冷上几分。

  "比企谷同学，如果你认为这只是一场'无聊戏码'，那你显然还不够了解那个女人的恶趣味。"雪乃的语速很慢，"她带来的'变量'，通常都带有极强的破坏性。不要指望在周一的谈判桌上能得到任何常理中的善意。"

  她没有点破那个"朋友"是谁，因为八幡此刻的反应已经给出了最清晰的答案。这是她能给出的、符合逻辑的最低限度的提醒。

  拉芙希妮·都柏林合上了手里的文库本。

  书页碰撞发出的轻微"啪"声。

  "雪乃同学。"拉芙希妮将书放进口袋，抬头看向长桌尽头的人，语气里听不出一丝对即将到来的风暴的担忧，"刚才平冢老师放在这里的那叠资料，能不能先看一眼分工架构，让我知道奉仕部这次的具体职责边界在哪里？"

  雪乃的视线从窗外收了回来。她看了拉芙希妮一眼，极短的一秒，然后转向那叠资料，伸手拿起最上面一份文件。

  "……可以。"
