场景: 85
幕: "第五幕·PTA→舞会"
时间: "2014年3月9日 · 周日 · 傍晚"
地点: "雪之下家本邸 · 餐厅"
人物: "雪之下雪乃、雪之下母、雪之下阳乃、拉芙希妮·都柏林、比企谷八幡、由比滨结衣、平冢静（+ 背景：管家、侍者）"
正文: |
  长桌两侧没有人说话。空气被冷气机抽干了温度一样，又冷又重。

  雪乃盯着自己面前的盘子。那几块蟹肉在水晶吊灯的冷光下泛着光。她认得这种摆盘方式，也认得最外侧那把用来吃海鲜冷盘的银色小叉子。从小到大，这套餐具的顺序和用法已经被刻进了她的肌肉记忆里。

  只要长桌顶端的那个人不开口，没有人可以发出咀嚼的声音。

  雪乃的视线越过多头烛台，看向斜对面。

  由比滨结衣坐得笔直。她的大腿紧紧并拢着，双手放在膝盖的餐巾上，整个人像一只被按在解剖台上的兔子。她不敢看面前的那堆刀叉，视线只能绝望地在水杯和盐罐之间来回移动。

  而坐在由比滨旁边的比企谷八幡，正用看似漫不经心、实则僵硬的眼神打量着那摊淡绿色的酱汁。他没有去碰餐巾，手甚至还插在西装长裤的口袋里。他那张总是带着死鱼眼的脸此刻绷得很紧。如果是平时，他早就应该开始在心里疯狂地吐槽这盘连塞牙缝都不够的草和肉了。

  平冢静的警告还在生效。比企谷在极力克制着那种想要用自嘲或者说怪话来破坏气氛的冲动。

  雪乃握紧了放在膝盖上的手。

  这种把他们强行拉入自己最厌恶的权力审视中、看着他们因为阶层差距而感到局促不安的感觉，比被当面羞辱还要让她难以忍受。她想清清嗓子，告诉由比滨"最外面那把叉子是用来吃冷盘的"，或者是直接对着长桌尽头说一句"我们可以开始了吗"。

  但她发不出声音。

  长桌的最顶端，雪之下夫人终于拿起了餐巾，缓慢而优雅地铺在了腿上。她那深蓝色的眼睛扫过长桌的两侧，目光在由比滨的脸上停留了半秒，然后越过比企谷，最后落在了那碟帝王蟹肉上。

  "新鲜的食材，总是需要一点时间和耐心去适应它的温度。希望各位今晚的胃口能像外面的风一样好。"

  雪之下夫人的声音不高，语速也不快。但每一个字都像用硬塑料敲击在玻璃上，带着理所当然的掌控感。

  她拿起刀叉，发出了一声细微的银器摩擦声。

  这是开动的信号。

  "哎呀，母亲大人总是这么严格。"坐在雪乃另一侧的阳乃轻笑了一声。她拿起酒杯晃了晃里面的香槟，然后看向斜对面，"不过，这种场合对于由比滨同学和比企谷君来说，确实有点勉强了吧？"

  阳乃的语气听起来温柔，就像在关心刚到家做客的邻居小孩。

  "比企谷君一直盯着那份酱汁看，是觉得颜色有点奇怪吗？那是用罗勒和法国进口的香草打碎做成的哦。是不是和你平时在便利店买到的那些咖喱便当的味道……不太一样？"

  阳乃的视线像一条吐着信子的蛇，绕开了平冢静，缠在了比企谷的脖子上。

  雪乃的脊背猛地绷紧了。她抓住了桌沿。

  "姐姐。"

  她叫了一声，语气冷硬得没有起伏。她不能让这种单方面的心理碾压继续下去，必须切断阳乃的话题。

  "嗯？雪乃酱有什么问题吗？"阳乃笑眯眯地转过头，手里的刀子轻轻划开了一小块蟹肉，"我只是怕客人们不知道怎么用那些麻烦的刀叉而已。毕竟，有些东西，是很难在短短几个星期里学会的。"

  比企谷把手从口袋里抽了出来。他的肩膀动了一下。雪乃知道那个动作——那是他准备开始说一些自贬的话来强行结束这个话题的前兆。

  就在比企谷要开口的前一秒，一声清脆的、金属与瓷器碰撞的声音突然在长桌上响起。

  "叮。"

  声音不大，但在这个落针可闻的餐厅里，每一下都清晰得刺耳。

  拉芙希妮·都柏林拿起了最外侧的那把银制海鲜叉，并在下一秒拿起了旁边的小刀。她的动作流畅、自然，没有任何多余的停顿，手腕翻转的弧度标准得像一场教科书级别的餐桌礼仪示范。

  被烧焦丝带包裹的右手腕在灯光下闪过一抹颜色。

  "那是叫做'龙蒿'的香草变种，原产地其实是在东欧的某些温室里。"

  拉芙希妮没有看阳乃，也没有看长桌尽头的夫人。她低着头，视线专注在面前的盘子上，刀尖轻轻地将那块蟹肉切出了一个完美的切口。

  "如果是法国南部的罗勒，在打碎之后通常会呈现出更偏黄色的色泽，而不是这种翠绿。而且，这种酱汁为了保证口感，里面应该还加了少量的白葡萄酒醋。对吗？"

  她抬起头，那双翡翠色的眼睛平静地看着斜对面的阳乃。那张漂亮、苍白、一直带着淡淡距离感的脸上，没有一点因为这种"豪门审视"而产生的恐慌。

  "我个人觉得，这种味道和便当里的咖喱并没有什么高下之分。只是用来掩盖食物本身可能存在的腥味罢了。"

  拉芙希妮用叉子将那小块沾了绿色酱汁的蟹肉送进嘴里。她的咀嚼很安静，喉咙滚动了一下。然后，她放下了刀叉。

  "由比滨同学，比企谷同学，"她转过头，用那种平日里在活动室讨论哪家自动贩卖机的咖啡更好喝的干燥语气说道，"最外面的那把小叉子，刚好适合把那些黑色的鱼子酱拨开。我建议你们可以不吃那个，味道确实有些咸了。"

  由比滨像是突然得到了特赦一样，赶紧抓起了最外面那把叉子，脸红得像个熟透的苹果，"啊、嗯……谢、谢谢拉芙希妮酱……"

  比企谷也跟着拿起了叉子。他看了一眼盘子，又看了看拉芙希妮，最后用比平时更低沉、也更干瘪的声音嘟囔了一句。

  "难怪颜色绿得像有毒植物的胆汁一样。那些有钱人的口味还真是让人无法理解。"

  他笨拙地用叉子戳起了一块蟹肉，然后像吃白水煮白菜一样塞进了嘴里。完全没有品尝的意思。

  雪乃紧绷的肩膀慢慢放松了下来。

  她看着拉芙希妮重新拿起刀叉，就像什么都没发生过一样继续切割着盘子里的食物。在那些看似随意的切肉动作里，藏着只有长期被规矩和高压浸泡过的人才懂的"工艺品"般的从容。那种从容比阳乃的温柔挑衅更加无懈可击。

  雪乃低头拿起了自己的餐具。冰冷的银器贴在掌心里，这一次，她没有觉得发僵。

  长桌的最顶端。

  雪之下夫人停下了手里的动作。她将刀叉整齐地放在盘子的右侧，那是表示这道菜已经用完的信号。

  深蓝色的眼睛越过了一排燃烧的蜡烛，第一次正视了坐在平冢静旁边的那位金发少女。

  "你的香料知识很丰富，都柏林同学。"

  夫人的语气依然平稳，但那种漫不经心的审视感已经被剥离了一半。

  拉芙希妮放下餐具，用餐巾轻轻按了按嘴角。

  "只是恰好记得一些料理知识而已。并没有什么值得夸耀的，夫人。"

  高脚杯的玻璃底座轻轻碰在亚麻桌布上，发出一声闷响。

  在第一道冷盘的残局刚刚被几名侍者悄无声息地撤走，而主菜还未端上来的这段空白时间里，这声闷响成了餐厅里唯一的声源。

  "那么。"

  雪之下夫人拿起餐巾印了印唇角，深蓝色的眼睛越过长桌中央那簇低矮的白百合，直接锁定在雪乃身上。

  "前几天交上来的进路表，法学方向本身没有问题。"夫人的声音平稳得近乎温和，"你现在仍然认为，家里为这条路准备的后续安排，可以被单独排除吗？"

  空气里的温度又降了几度。由比滨结衣本来正因为冷盘被撤走而偷偷松了口气，听到这句话，她刚拿起水杯的手僵在了半空。

  雪乃的胃里像是被塞进了一块冰块。

  她知道这个问题迟早会来。从她在那张纸上写下"文科·法学方向"，却把志愿校的栏目留空时，她就知道，母亲不会反对那个结果。母亲只会把它重新收进家族的轨道里，连同预备校、推荐人、见习单位和毕业后的去向一起，包装成一份无法拆开的正确答案。

  "那不是一份空白承诺。"

  雪乃听到自己的声音在这间空旷的餐厅里响起，干涩得像在砂纸上摩擦。

  "法学方向是经过评估后的正式决定。除此之外的安排，不在那张表格里。"

  她把背挺得极直。这是她在面对母亲时唯一能做出的防御姿态。不能低头，不能移开视线，哪怕掌心已经在桌布下被指甲掐出了红印。

  "正式决定？"雪之下夫人微微笑了一下。那不是一个表示愉悦的表情，而是看到不成熟的孩子在玩泥巴时的宽容与荒谬感。

  "你所使用的判断方式、接受的教育，以及让你足以选择法学的成绩，全部建立在家里提供的条件上。现在你保留这些结果，却要把它们应当承担的责任排除在外。雪乃，不要把取用包装成独立。"

  夫人的视线从雪乃紧绷的脸上滑过，然后扫了一眼坐在左侧的那些人。

  "你以为只要周围有几个人附和，只要把专业方向和毕业后的责任拆成两句话，就能证明前者只属于你个人？你还是不够成熟。你只是把家里已经替你准备好的道路重新命名了一次。"

  每一个字都像用手术刀切在她的软肋上。

  那是她自己也在无数个深夜里怀疑过的事情——我是真的选择了法学，还是只把早已学会的服从换成了更漂亮的说法？

  "哎呀，"阳乃用手托着下巴，笑眯眯地看着雪乃，"雪乃酱还真是贪心呢。最擅长的方向和妈妈替你选的一样，却又希望那条路从今天开始只算作自己的东西。还是说，只要把终点暂时留白，就能假装前面的轨道都不存在了？"

  阳乃的话像一把温柔的软刀子，把那种名为"家族责任"的巨石又往雪乃的胸口推了一把。

  雪乃咬住了下唇。她的喉咙像是被什么东西堵住了。那些准备好的、关于方向与用途应当分开的论证，在这间代表着家族权威的餐厅里，全部变成了哑炮。

  对面的比企谷八幡正死死盯着面前那把还没用过的牛排刀。他的手背上绷起了一根青筋。雪乃太熟悉他那个表情了，那是他遇到不合理的局面时，准备用自己去撞翻整个局面的前兆。

  但是他不能说话。平冢老师就坐在他旁边，这也不是他能用"自爆"来解决的委托。

  这必须是她自己跨过去的高墙。

  可是……该怎么反驳？

  如果连她自己都无法证明那个愿望究竟从何而来，如果她只是学会了用母亲熟悉的语言宣告独立……

  就在雪乃的呼吸变得越来越急促，周围那种令人窒息的安静压下来，再过一秒就会将她彻底淹没。

  桌布下面，忽然传来了一点微弱的震动。

  由比滨的腿因为太紧张了，在那边小幅度地发着抖。她的膝盖不小心撞到了桌腿，然后又磕在了雪乃的小腿上。这种带着体温的、冒失的、完全不符合这间餐厅规矩的碰撞，突然让雪乃从那种被冰冻的状态中脱离出来了一秒。

  紧接着，右侧传来了一声轻微的瓷器摩擦声。

  拉芙希妮端起了面前的水杯，然后又平稳地放下。杯底和桌面碰撞的声音很小，但足以在母女对峙的僵局中撕开一道口子。她左手腕上那根鲜亮的红绸带，和右手腕暗红色的烧焦丝带，在灯光下同时晃了一下。

  雪乃在余光里看到，拉芙希妮右手腕上那根暗红色的丝带在灯光下轻轻晃动。

  那根丝带下面，藏着那些无法用橡皮擦掉的焦黑伤痕。

  如果连那个必须要在长夜里把自己蜷缩起来、拼命抹除原来面貌的人，都能在那间部室里试着露出一点本来的样子……

  如果她能用红绸带去包容那种伤痛，那她自己呢？

  她为什么要在这张桌子上，为了一个并没有做错的决定而感到心虚？

  雪乃松开了紧攥着桌布的手。

  "那不是逃避。"

  她看着母亲，这一次，她的声音不再发飘。

  "如果我只是因为您希望我学习法学，就刻意选择另一个方向，那才是在把决定权交给您。"雪乃的掌心依然发凉，但每一个字都落得很稳，"顺从和反向逃开没有区别。无论哪一种，我的人生都还在围绕您的答案旋转。"

  雪之下夫人的眉头动了一下。

  "我想学习法学。"雪乃的语速不快，但很清晰，"因为我擅长它，也因为我想知道，规则究竟应该怎样保护那些没有资格制定规则的人。这些理由不会因为您也认可法学，就变成家里的所有物。至于毕业以后把它用在哪里——"

  她扬起下巴，那是她在活动室里最常做的那个动作。

  "……我会自己决定，也会为那个决定承担后果。这就是我的进路。"

  餐厅里彻底安静了下来。

  由比滨甚至忘了把那只举在半空的手放下来，她呆呆地看着雪乃，琥珀色的眼睛里亮闪闪的。比企谷把视线从牛排刀上移开，那种紧绷的防备感减弱了一点。

  阳乃脸上的笑容僵了一下，随后又变得更深了。

  雪之下夫人看着雪乃。她没有立刻开口反驳。那双深蓝色的眼睛里，冰面下有什么东西在移动。那不是愤怒，也不是被顶撞后的不悦，更像是在审视一道出现在不该出现位置的裂纹。

  她把目光从雪乃的脸上移开。

  然后，那双令人畏惧的眼睛，慢慢地、一寸一寸地，越过了桌子中央的白百合，落在了坐在雪乃对面的那个男生身上。

  "为自己的选择承担后果。"夫人看着比企谷八幡，语气平静得像在谈论明天的天气，"这句话听起来很漂亮。不过，比企谷君。"

  比企谷的肩膀瞬间僵硬了。

  "你也是这么认为的吗？"

  "比企谷君只是提供客观的数据参考。"

  在那个名字被点出来的瞬间，雪乃的声音几乎是直接撞碎了空气。

  她甚至没有等比企谷八幡的肩膀完全紧绷起来，就已经把身子往前倾了半寸。深蓝色的眼睛死死盯住坐在长桌顶端的母亲，试图用视线把那股正在转移的压力强行拽回自己身上。

  "我的进路选择，是在评估了当前的各科成绩、长期阅读倾向，以及总武高历年的升学模型后得出的结论。这与奉仕部的任何干预都没有因果关系，他只是作为一个样本——"

  话一出口，雪乃的舌尖就抵住了上颚。

  胃部那种像被塞了冰块一样的紧缩感又回来了，而且正在迅速蔓延。她的语速太快了，快得失去了平时那种节奏。那些诸如"评估"、"模型"的词汇，在平时用来斥责部员时显得无懈可击，但此刻在这个餐厅里，在这双和她相似却深邃得多的眼睛注视下，听起来就像一层一戳就破的薄纸。

  "是吗。"雪之下夫人没有去看她，视线依旧停留在对面的男生身上，声音轻得像叹息，"连替自己回答问题，都需要部长来代劳了吗。"

  阳乃端起面前的柠檬水，杯壁掩盖了她嘴角越来越深的弧度。

  雪乃咬住了嘴唇侧面的肉。

  不对。这不是她想要的防守。她急于撇清比企谷在这件事里的责任，反而坐实了母亲那句"不够成熟"的评价——一个必须要把同伴护在身后、害怕同伴被伤害的人，怎么可能是一个理智的决策者。

  她用来武装自己的那些正确，在这几秒钟的时间里漏风了。她想停下来重新组织语言，但喉咙里像卡了一块生锈的齿轮。桌布底下的手心里全都是汗。

  就在这令人窒息的停顿中。

  "如果只是为了逃离您，这个选择的效率未免太低了。"

  一个带着轻微鼻音的、属于异国留学生特有的语调，轻飘飘地落在了长桌上。

  拉芙希妮把手里那只透明的水杯放回了杯垫上。放得很轻，没有发出声音。她甚至连坐姿都没有改变，双手交叠着放在膝盖那件深色的校服大衣上，浅金色的头发在餐厅柔和的灯光下泛着一点冷光。

