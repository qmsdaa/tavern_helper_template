  夫人的声音很平缓，那种一贯的、带有审视意味的语调在餐厅里回荡开来。

  "凝固剂的用量也没有掌握好，导致整体的口感缺乏应有的顺滑。至于底部的焦糖……"她淡淡地看了一眼盘子里那层深色的液体，"火候过了至少两分钟，已经完全超出了正常甜味的范畴，产生了明显的苦涩感。"

  结衣的头重重地低了下去，刘海遮住了她的眼睛，但能看到她的肩膀在发抖。

  雪乃的呼吸停滞了。她猛地松开了桌子底下交握的双手，指甲甚至在掌心掐出了印子。她想站起来，她想告诉母亲这根本就不是用那些高级餐厅的标准来衡量的事情。

  她张开嘴，刚刚发出一个音节——

  "不过。"

  夫人的声音没有拔高，却截断了雪乃即将出口的话。

  结衣的肩膀停止了抖动，她慢慢地抬起头。

  雪之下夫人将餐巾放在一旁。她的目光从面前那个满是瑕疵的布丁上移开，越过长桌，落在了由比滨结衣那张因为紧张和委屈而泛红的脸上。

  "在这层苦涩之后，"夫人的语气里没有嘲讽，也没有任何高高在上的施舍，"笨拙的……属于糖分本身的温暖，确实被保留下来了。"

  雪乃愣住了。

  "雪乃是一个很难缠的孩子，从小就是。"夫人将视线转向雪乃，眼神深邃得让人看不透，"她总是喜欢把所有的东西都放在天平上去称量，不管是知识、效率，还是所谓的正确性。"

  她重新看向结衣。

  "这种充满了常识性错误、甚至连外表都称不上及格的食物……如果是在以前，她连看都不会看一眼。因为那不符合她的'标准'。"

  夫人的双手交叠放在桌面上，这是罕见的、非防御性的姿态。

  "但我不得不承认，你们用这种毫无逻辑可言的……多余的关心，在她的那个天平上，加上了一块足够重的砝码。"

  餐厅里彻底安静了。

  那是一句没有任何华丽辞藻、也没有任何赞美之词的评价。甚至可以说是把结衣的手艺批评得体无完肤。

  但在座的所有人都听懂了那句话背后的重量。

  这是雪之下家现在的掌权者，对雪之下雪乃身边的这群朋友，做出的第一次、也是唯一一次的定性。

  阳乃撑着下巴的手猛地滑了一下，差点撞到桌子。她愣愣地看着自己的母亲，又看了看对面那个同样呆住的粉色头发女孩，最后，那张总是挂着完美笑容的脸上，罕见地露出了连她自己都没察觉到的茫然。

  平冢静在长桌底下长长地舒了一口气，她拿起水杯喝了一大口，像刚才经历了一场剧烈的长跑。

  八幡依然看着面前的水杯，但他那只放在桌布边缘的手，慢慢地、彻底地放松开来。那声微弱的叹息声，只有坐在他旁边的雪乃听见了。

  结衣呆呆地坐在椅子上。

  她花了很长时间才处理完夫人那段冗长且充满威压的话语。当她终于意识到那句评价到底意味着什么的时候，她的眼眶再一次红了。

  但这次，她没有低头，也没有去抹眼泪。

  "……谢谢伯母。"结衣的声音沙哑，但那种从骨子里透出来的坚韧再次回到了她的身上，"下次……下次我一定会把火候控制好的。"

  "不必了。"夫人端起一旁的红茶，语气恢复了惯常的平淡，"这种东西，吃一次就足够了。雪乃这周的糖分摄入量已经超标了。"

  虽然是一句拒绝，但那种如同冰墙一般的隔离感，已经消失不见了。

  雪乃低头看着自己面前那个盘子里的布丁。

  卖相真的很糟糕。气泡、深色的焦糖、一点也不规整的边缘。这和她以前在高级餐厅里吃过的任何一道甜点都无法相提并论。

  但那是结衣在烘焙室里，一边被烫到手指一边还在努力搅拌的证明。

  是这间冰冷的餐厅里，唯一真实的东西。

  雪乃拿起面前的银勺，挖了一小块布丁。

  确实有点苦。焦糖的味道因为过火而带上了一点焦涩感。

  她慢慢地咽了下去。

  随后，在铺着厚重亚麻桌布的桌底下，在没有任何人能看到的死角里。

  雪乃那只一直因为紧张而发凉的左手，缓慢地伸了过去。

  她的指尖越过衣服的布料，轻轻地、非常克制地，碰了一下结衣放在膝盖上的手背。

  那个触碰太轻，轻得察觉不到，短暂得像幻觉。

  结衣的身体僵了一下。随后，她没有转过头，而是悄悄地翻过手掌，用温热的掌心，回握了一下雪乃那冰凉的指尖。
