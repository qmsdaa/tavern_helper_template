场景: 87
幕: "第五幕·PTA→舞会"
时间: "2014年3月22日 · 周六 · 傍晚"
地点: "总武高 · 大礼堂门厅 → 特别栋道具室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
正文: |
  黄昏的余光被大礼堂玻璃门上的遮光帘挡在外面。门厅里，廉价香水、发胶的化学香精和布料摩擦的静电，把检票口前那一小片空间挤压得令人窒息。

  比企谷八幡站在队伍边缘，把外套拉链往上拉了一寸。

  他把外套拉链又往上拽了半寸。站在那两个毫无自知之明的人左后方，他就是高级礼盒里用来填塞空隙的废纸团——周围原本就拥挤的空气正被她们抽成真空。

  拉芙希妮今天没穿那种把脖子捂得严严实实的深色风衣。她穿了一件香槟色的露肩礼服，锁骨的线条完全暴露在冷光下。昨晚那片皮肤上被粗暴擦拭过的痕迹已被高光散粉巧妙覆盖，但她微侧过头时，左手腕上那条红绸带依然紧紧贴在腕骨上，和华丽的裙摆形成极具破坏感的反差。她安静地站在那儿，睫毛低垂，不像来参加舞会的学生，更像一件易碎工艺品。

  但真正让周围视线发生滞留的，是站在她另一侧的人。

  雪乃穿了一套藏青色的中性西装。不是女生制服改款，而是剪裁冷硬、线条锋利的男装样式。长发被干净利落地绾在脑后，露出苍白的后颈。白衬衫的领口系着一条质地偏硬的深灰色领带。腰线收得很紧，把她原本就单薄的身形衬得更加挺拔，带着生人勿近的冷酷感。

  "比企谷同学。"

  雪乃没有转头，视线盯着前面的检票桌，左手却准确地朝八幡伸了过来。

  "你的入场券已经皱得连条形码都看不清了。如果不想被执委会当成可疑人员拦在门外，就把它给我。"

  八幡干巴巴地叹了口气，从口袋里掏出那张揉成一团的纸片拍进她手里。

  "我本来就是个可疑人员。"他小声嘟囔，"这辈子还是第一次作为'两位男伴'的二分之一出席这种场合。"

  "这是你作为劳动力应尽的义务。"

  队伍向前移动。负责检票的两个一年级女生在接过票时明显愣住了——视线在雪乃的领带和拉芙希妮的锁骨之间来回扫动，完全忘了迎宾台词。

  雪乃对这种探究的视线敏感。她把三张票放在桌面上，指尖抵着纸片边缘，发出一声轻微的敲击。

  "二年J班的名单在你们左手边第二个文件夹里。麻烦快一点，后面还有人。"

  检票女生如梦初醒，慌乱地翻了文件夹，盖了入场章把票底推回来。

  雪乃转过身。在这个瞬间，她对这身紧绷的西装仍有生理性的不适应，右手下意识地抬起，想要去扯领带结——就像她平时整理披散的长发那样。但手停在了半空，带着被束缚的僵硬。

  拉芙希妮没有说话。她只是微微侧过身，戴着半透明蕾丝手套的手指伸过去，在雪乃的动作彻底变成局促的遮掩之前，帮她抚平了西装翻领上的一道细小褶皱。

  那个动作很轻，不到两秒。蕾丝布料擦过藏青色的精纺羊毛，发出一声摩擦音。

  雪乃的身体僵了一下。但她没有躲开，也没有用那套标准的逻辑去驳斥这种在公共场合略显亲昵的越界。她只是板着脸，任由那条没整理好的领带结歪了半毫米。

  "走吧。"雪乃低下头，把其中一张票塞进拉芙希妮手里。

  八幡跟在她们斜后方。他看着前面那一灰一白两个截然不同的背影——拉芙希妮的裙摆偶会擦过雪乃笔挺的西装裤腿——鼻腔里那些廉价香水和发胶的化学味忽然淡了下去——被隔绝在了一个看不见的透明罩子之外。

  雪乃伸出手，没有丝毫迟疑地推开了大礼堂那扇沉重的双开包木大门。暖色灯光从门缝里倾泻出来，混合着管弦乐团调音的杂乱声响，像海浪一样砸在他们身上。拉芙希妮在光影交界处停顿了半拍，随后跟在雪乃身侧，一起迈过了那条铺着暗红色地毯的门槛。

  ---

  铁门发出令人牙酸的摩擦声。

  走廊里带着苍白冷感的荧光灯，像钝刀般切开了道具室里沉积了整个晚上的黑暗和灰尘。外面大礼堂里管弦乐队正在演奏最后一首收尾曲，鼓点顺着墙壁传导过来，震得门框微微发麻。

  八幡推着门，呼吸因在楼层间奔跑而粗重。结衣从他手臂底下钻了过去。雪乃直接越过他，大步走进这间堆满旧跳箱和残破排球网的屋子。

  在这个连窗户都没有的杂物间最深处，拉芙希妮坐在两个叠起来的体操垫上。

  她那件香槟色的露肩礼服裙摆随意地铺在布满灰尘的水泥地上。原本精心挽起的金发散落了几缕，贴在苍白的侧颈。浅色高跟鞋被踢到了跳箱旁边，双脚只穿着薄薄的肉色丝袜，蜷缩在冰冷的垫子边缘。

  她并没有躲闪门口照进来的光。只是安静地坐在那里，右手拇指无意识地来回摩挲着手腕上那根焦黑的旧丝带。

  "……这里灰尘很大哦。"

  平缓。得体。甚至还带着点温和的距离感。这种语气在当下近乎沸腾的寻找和对峙中，扭曲得刺耳。

  没有人接这句寒暄。

  雪乃站在距离拉芙希妮两步远的地方，深蓝色的眼睛死死盯着垫子上的少女。那身笔挺的中性西装在奔跑中多出了折痕，发丝在耳畔散落了几缕。胸口剧烈起伏着——只要一开口，就会用最严厉的词汇把那个不告而别的人撕成碎片。

  但拉芙希妮先开了口。她的视线没有对上任何人，而是落在了雪乃西装的纽扣上。

  "雪乃同学，上周五你留在桌洞里的那份文科进路表——那个关于志愿校的栏目，最后顺利交到平冢老师手里了吗？"她顿了顿，转向门边的八幡。声音压得很平，像在核对清单，但语速比平时慢了半拍。"比企谷同学也是。小町的第二轮模拟考成绩应该在这几天就要公布了。不要用那种死鱼眼去否定她的努力。她虽然不会当面反驳，但会把你的每一句评价都在心里放大。"

  她又看向结衣。结衣的眼眶从看到那双被踢掉的高跟鞋时就已经红了。

  "结衣。你总是能第一时间感知到房间里的气压，想让每个人都舒服。但如果真的觉得难过，觉得不想让某个人离开——就算那种话说出来会让气氛变糟，也不要压抑自己去让步。你的感情不是用来填补别人尴尬的。"

  结衣的眼泪砸了下来。

  "别说了……"她向前跨了一大步，声音哽咽，"拉芙希妮酱，别用这种好像以后都见不到面的语气说话……"

  "因为这确实是最后需要确认的事了。"

  拉芙希妮平静地打断了她。像是在陈述一个既定的物理常识。右手拇指在那根焦黑丝带的边缘用力掐了一下。

  雪乃没有去理会裙摆上的灰尘。她大步走上前，直接在体操垫前单膝半蹲下来，从西装内侧口袋拽出一份折叠了两次的A4纸。纸张边缘起皱，被长时间紧紧捏在口袋里。

  啪。

  她把文件拍在拉芙希妮大腿旁边的垫子上。

  "平冢老师作为生活指导老师的最后一次签字，加上总武高教务处的红章。只要这份担保还在，那些关于退学的传言就不可能绕过行政程序直接生效。这份文件从昨天开始就已经生效了。"

  拉芙希妮的视线顺着雪乃的动作下移。

  垫子上那张带着红色印泥的白纸在昏暗中只剩灰白的轮廓，印章的红褪成了暗褐色。纸张背面透出密密麻麻的文字排版，以及那些代表着抗争和程序的印章轮廓。

  但她没有伸手去拿。连一根手指都没有动。

  "如果只是学校的手续问题，这份文件确实很完美。"拉芙希妮的声音变得干涩，"但是，我已经决定了。春假的时候……我要回英国。"

  "英国"两个字落入空气中。道具室里只剩跳箱的霉味和灰尘。没有人吸气。

  雪乃按在垫子上的手指攥紧了，指节硌在水泥地上。

  "不是回千叶的公寓。"拉芙希妮摇了摇头，金色的发丝扫过苍白的锁骨，"是回英国。从成田起飞，直达希思罗。那边会有专人来接我。这不是因为某份文件没有盖章，也不是学分或出勤率出了问题——"

  她终于抬起头。那双翡翠色的眼睛里没有眼泪，没有决绝，只有让人感到绝望的疲惫。

  "她说过。只要我回去，这里的'日常'就不会被打扰。"

  八幡在门边猛地咬住了后槽牙。这不是撤退。这是一场以自己为筹码的、为了保全所谓"朋友"的单方面投降。

  结衣的眼泪掉在礼服的亮片上，她转头去看雪乃："小雪乃……一定还有别的办法对吧……"

  没有人回答。

  门边传来刺耳的摩擦音——橡胶鞋底碾过布满灰尘的水泥地面。八幡松开了握了很久的金属门把手。把手回弹，"喀哒"一声闷响。

  他往前走。一步，两步。死鱼眼里那种漫不经心的浑浊感完全消失了，取而代之的是干瘪而阴沉的光。

  "真恶心。"

  声音在道具室的空隙里砸下来。结衣吓得往后退了半步。

  "自以为把自己放在交易的天平上，就能换来全世界的平安无事。"八幡站在距离垫子不到一米的地方停下，从上往下看着拉芙希妮，"你姐姐是用小町的升学考试来吓唬你吧。还是说，顺便也提到了这家伙的蛋糕店，或者那个马上要调走的暴躁女教师？"

  拉芙希妮的肩膀缩了一下。

  "她根本连动手的打算都没有。只是扔出几个你最不敢去碰的名字，你就迫不及待地缴械投降了。"

  "不是的。"拉芙希妮的声音冲破了喉咙的干涩，"那是——你不知道她能做到什么地步。"

  "我不需要知道她能做到什么地步。"八幡盯着那双翡翠色的眼睛，没有移开视线，"我只知道，那种连问都不问当事人一句，就擅自把别人的'安全'揽在自己身上，然后自顾自跑去牺牲的做法——"

  他停了一下。

  "比直接被伤害还要让人火大一百倍。"

  道具室里再次陷入安静。结衣用手背胡乱地抹着脸，拼命咬着嘴唇不让自己哭出声。雪乃按在那份文件上的手指因用力而泛白——不是要收回它，而是像按住一块随时会被风吹走的石头。

  拉芙希妮低下头。安静了片刻。

  当她再次开口时，声音里没有任何发颤的哭腔，甚至没有丝毫起伏。干燥得像一截在通风口放了很久的枯树枝。

  "刚才那些话，并不是廉价剧本里那种为了满足个人牺牲欲的自我感动。"她把视线从八幡脸上移开，平移到雪乃身上，"总武高的行政规则也好，平冢老师的签字也好，在英国那边看来，都只是随时可以被撕毁的纸片。"

  然后她抬起右手。拇指擦过手腕上那根焦黑的旧丝带。

  "另外——在这个部室里，我学到了很多东西。其中最重要的那条：奉仕部的原则，是提供帮助，而不是代替当事人解决问题。更不是替别人做决定。"

  结衣抓着拉芙希妮袖口的手指僵住了，眼泪还挂在睫毛上。

  八幡感觉到后槽牙传来一阵酸痛。被自己曾经抛出去的飞镖、用最标准的姿势原封不动地扎回胸口——这家伙在奉仕部待了几个月，把那些用来推卸责任的"歪理"学了个十成十。现在她把盾牌竖在这里。严丝合缝。

  既然口口声声说不替别人做决定，那现在凭什么来干涉我的决定？

  "所以。"拉芙希妮轻轻动了一下手臂，试图从结衣的指缝里把袖口抽出来，"请不要因为那种没必要的同情心，来替我的人生下结论。这个决定，是我自己——"

  "你撒谎。"

  一个冰冷、没有任何妥协余地的声音切断了拉芙希妮的宣判。

  雪乃依然单膝半蹲在垫子前。但那种因震惊而产生的散乱感已完全从她身上消失了。她按着文件的手指收了回来，腰背挺得笔直。

  "你刚才说，这是为了不逃避，是为了解决问题。"雪乃直视着拉芙希妮，深蓝色的瞳孔里只剩下纯粹得可怕的逻辑审视，"如果是真正准备好去'面对'的人——"

  她的视线顺着拉芙希妮的肩膀滑下去，停在右手腕上。

  "在说出'自己决定'这几个字的时候，大拇指是不会拼命去抠那条烧焦的丝带的。"

  拉芙希妮的手指猛地一颤，像被烫到一样从手腕处弹开。

  "收起你那套现学现卖的原则。"雪乃没有给她重新组织防线的机会，语速加快，每个音节都像在敲击冰面，"奉仕部确实有'不替别人做决定'的规矩。但这条规矩的前提是——当事人确实是在做'决定'，而不是在'屈服'。"

  八幡在旁边撇了撇嘴。这家伙抓漏洞的本事简直像本能。

  雪乃双手撑在垫子边缘，缓慢地站了起来。藏青色的西装外套随着她的动作重新找回了挺拔的线条。她居高临下地看着还坐在垫子上的拉芙希妮。

  "而且，你搞错了一件事，都柏林同学。"

  雪乃的下巴微微扬起。

  "既然奉仕部的原则是'提供帮助'，并且你已经承认自己在逃避问题上失败了——那么，作为奉仕部的一员，在你回英国去面对那个所谓的'问题'时，我们提供必要的'协助'，也是理所当然的社团活动。"

  拉芙希妮的眼睛微微睁大了。那张一直维持着平淡的脸上，出现了真实的空白。

  "等、等一下……"结衣眨了眨眼睛，眼泪掉了下来，"小雪乃的意思是……？"

  "既然春假期间你要回英国'解决问题'，那这就是奉仕部下周必须要执行的委托。"雪乃侧过头看了八幡一眼，然后重新把视线锁定在拉芙希妮身上，"作为部长，我会向校方提交校外活动申请。而比企谷同学和由比滨同学，作为部员，没有拒绝同行的理由。"

  八幡叹了口气，把手从兜里抽出来，用力搓了一把脸。这女人的逻辑简直比强盗还无理取闹。偏偏在这个狭窄的道具室里，听起来该死的顺耳。

  "既然是协助当事人'面对'家族问题，"他用那种干瘪的、欠揍的声音补充道，"那这跟学校的学籍、平冢老师的调职都没有半点关系。这是跨国社会实践。懂吗？"

  拉芙希妮彻底呆住了。

  她看着面前站着的雪乃，看着旁边一脸不情愿却满嘴帮腔的八幡，又低下头，看着那个已经破涕为笑、把她的袖口抓得死紧的结衣。

  "你们……都疯了吗。"拉芙希妮的声音终于开始发抖，"爱布拉娜在那边拥有的东西，不是你们这种在学校里玩社团游戏的——不是你们能应付的——"

  雪乃弯下腰，一把将那份没用的盖章文件从垫子上抓起来，揉成一团。

  "既然是协助，奉仕部就不接受这种连试都没试过的评估。"她把纸团扔进了角落的旧跳箱里，然后重新看向拉芙希妮。眼神里那种冷硬的、不讲道理的光芒，和刚才在门厅里推开大礼堂那扇双开木门时一模一样。

  "现在。汇报你机票的具体航班号。这是社团任务的起点。"
