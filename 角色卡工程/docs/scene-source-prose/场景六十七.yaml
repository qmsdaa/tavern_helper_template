场景: 67
幕: "第四幕·冬假→三学期"
时间: "2014年1月1日 · 周三 · 元旦 · 正午前后"
地点: "千叶神社 · 参道→正殿→抽签处→神社后方石椅"
人物: "拉芙希妮·都柏林、雪之下雪乃、由比滨结衣、比企谷八幡、比企谷小町（+视频通话：爱布拉娜·都柏林）"
正文: |
  正月一日的千叶神社参道，人流密度达到了能够让人产生厌烦的程度。

  雪之下雪乃站在赤红色的鸟居下方边缘，将冰冷的双手缩进深青色振袖和服的袖口里。呼吸间呼出的白气很快消散在凛冽的寒风中。即使她已经尽量站在不阻碍通行的地方，周围依然不断有陌生人的肩膀和视线擦过。她微不可察地皱了皱眉，那种想要立刻转身回公寓喝热红茶的冲动，在过去十分钟里已经出现了至少五次。

  如果不是由比滨在电话里那种几乎要哭出来的恳求，加上某个令人头疼的、自称"小町"的妹妹强行发送的集合坐标，她根本不可能在这个时间点出现在这里。

  "雪乃同学。"

  带着微喘的声音穿过喧闹的祈福声传了过来。

  雪乃转过视线。拉芙希妮正穿过人流朝她走来。她没有穿和服，而是一件剪裁极好的浅米色羊绒大衣，浅金色的长发被整齐地束在脑后——那条红色的绸带依然顽固地编在发尾，随着她的步伐轻轻晃动。这件大衣的质感和她过于苍白的肤色，让她在周围那些穿着廉价羽绒服的参拜人群中显得格格不入。

  "你迟到了七分钟。"雪乃的声音冷硬得像今天早上的气温，视线扫过拉芙希妮因为奔跑而泛起微红的脸颊，"我记得，作为一个长期处在某种'规矩'下的人，迟到应该是不被允许的失误。"

  "抱歉。"拉芙希妮在她面前停下，气温低，她的翡翠色眼眸看起来比平时更亮一些。她微微弯了弯嘴角，语气中带着一种毫不掩饰的、近乎笃定的狡黠，"因为需要花一点时间来说服酒店里的那位女士。"

  雪乃维持着抱臂藏在袖子里的姿态，等待下文。

  "我告诉她，"拉芙希妮稍稍压低了声音，向前倾了半步，"今天上午的初诣，是那位拥有极度控制欲的部长下达的'强制社会常识补习'。如果我不参加并提交一份不少于两千字的关于日本新年文化的调研报告，你就会将我的现代文平时成绩直接扣至不合格。"

  这几句话里的每一个词，都精准地踩在了一个荒谬却又逻辑自洽的平衡点上。

  "我并没有下达过这种毫无效率且无意义的指令。"雪乃的声音低沉了几分，眼神冷了下来，立刻进行切割，"而且，你的现代文等级已经是事实上的不合格了。不需要用这种虚构的危机来包装你的出逃行为。"

  "但是她相信了。"拉芙希妮对雪乃的毒舌毫不介意，甚至那双眼睛里的笑意更明显了，"只要是'雪之下部长'的强制要求，在她看来，就属于可以被允许的'合规麻烦'。所以，作为这套说辞的始作俑者，雪乃同学，这七分钟的迟到，你应该承担一半的责任。"

  这种强行绑定的逻辑让雪乃的呼吸停顿了一瞬。她看着对方发尾的那抹红色，那种被当成挡箭牌却又无法真正生气的无力感再次涌了上来。她张了张嘴，正准备用更严密的逻辑去驳斥这种强盗理论。

  "小雪乃——！拉芙希妮酱——！"

  一声充满元气的呼喊硬生生切断了雪乃即将出口的反击。

  由比滨结衣穿着一件粉色的羽绒服，头上戴着白色的毛线帽，像一颗红彤彤的炮弹一样从人群里挤了出来。速度太快，她差点撞上拉芙希妮，好在最后半步稳住了身形。

  在她的身后，比企谷八幡正以一种明显驼背且抗拒的姿态拖着脚步走来，深色的外套领子高高竖起，试图挡住周围的寒风。在他旁边，比企谷小町则活力四射地挥着手，脸上挂着一种满意的、"计划通"的笑容。

  "抱歉抱歉！因为电车实在太挤了，小企又一直走得那么慢！"由比滨一边喘气，一边自然地伸手挽住了拉芙希妮的手臂。

  突然被抓住手臂的拉芙希妮身体微微僵硬了半秒，但很快，她看了看由比滨冻得发红的鼻尖，没有抽回手，只是轻声问了一句："没关系。不要紧吧？"

  "完全没问题！"由比滨笑得见牙不见眼，随后看向雪乃，"小雪乃的和服超好看！对吧小企？"

  "……啊，嗯。如果能忽略掉那种冷冰冰的杀气的话，确实。"比企谷在距离她们两米远的安全距离外停下，用一贯的死鱼眼扫视了一圈拥挤的参道，"比起这个，如果你们还要在这里站下去，我不保证等会儿还能活着挤到赛钱箱前面。"

  "虽然哥哥的话很难听，但确实应该快点进去了呢。"小町从比企谷身后探出头，"那么，新年第一次的初诣，出发！"

  人群又一次涌动起来，一股推力从侧面袭来。拉芙希妮被由比滨拉着向前走去，而雪乃则因为和服下摆的限制，步伐略显迟缓。在被人群夹杂着迈出第一步的瞬间，雪乃看到拉芙希妮微微回过头。

  "那么，今天的'补习'。"拉芙希妮用一种只有两人能听见的音量轻声说道，"请多关照，雪乃同学。"

  通往正殿的队伍移动速度堪比深冬的蜗牛。

  赛钱箱前铜铃摇晃的沉闷声响、硬币落入木箱的撞击声，以及周围混杂着祈福与抱怨的人声，被冷风裹挟着不断撞击着雪之下雪乃的耳膜。她不喜欢这种连呼吸空间都被剥夺的环境。每次有人试图从侧面强行挤过时，她都不得不微微侧开身体，同时用藏在振袖里的手攥紧了随身的小包。

  比企谷八幡在队伍的最前方，虽然用他那因为长期驼背而显得有些佝偻的肩膀勉强撑开了一点空间，但那些试图插队的参拜客显然不会对一双毫无生气的死鱼眼产生任何退让的敬畏。

  "小雪乃，小心右边！"由比滨结衣的声音从前方传来。

  雪乃还没来得及转头，就感觉到一个背着巨大双肩包的人影正朝这边倒退。在即将撞上来的瞬间，一只手先一步横在了她和那个背包之间。拉芙希妮的手肘微曲，借着羊绒大衣的厚度，硬生生顶开了那股冲力。

  "这种时候，其实可以不用那么在意和服的下摆。"拉芙希妮收回手，声音压得很低，但呼吸明显有些急促。

  雪乃看向拉芙希妮。对方的另一只手正攥着装在口袋里的手机。那种即便在人群中也要不断确认设备存在的僵硬感，证明她远没有表面上看起来那么从容。

  距离十二点越来越近了。

  随着五元硬币被抛入赛钱箱，参拜的流程在一阵木然的鞠躬和击掌中迅速走完。

  "接下来就是今天的重头戏了！"比企谷小町举着刚买来的神札，像个导游一样指向一旁的抽签处，"新年第一天的运势，将决定小町今年的分数上限！"

  抽签处的木制签筒被摇晃得哗啦作响。

  "啊……是'小吉'。"由比滨结衣有些失望地看着手里的纸条，"上面说'交友需谨慎，勿轻信甜言蜜语'……小企，这算是在暗示什么吗？"

  "它显然是在暗示你以后少吃点加了三倍糖浆的可丽饼。"比企谷看着自己手里的签文，语气毫无波澜，"至于我，是'凶'。很好，符合一贯的统计学分布。"

  拉芙希妮展开那张折叠的纸条，视线在上面停留了两秒，然后平静地念了出来："'中吉。旧有之物不宜轻弃，南方有贵人相助，改变已在途中'。"

  "诶？感觉是很好的签呢！"由比滨凑了过去，"特别是那个'改变已在途中'，听起来就像是要发生什么好事一样！"

  拉芙希妮没有接话，而是转头看向了站在稍远处的雪乃。"雪乃同学呢？"

  雪乃看了一眼手中那张印着"末吉"的纸条，语气冷淡得就像在读某份不及格的期末答卷："'学业停滞，需警惕固步自封；不宜出行，谨防口舌之争'。毫无参考价值的随机概率产物。"她将纸条对折，干脆利落地走向一旁的结签架，将其系在了枯树枝上。

  他们最终在神社后方一处相对空旷的石椅旁停了下来。由比滨和比企谷兄妹去附近的摊位排队买苹果糖。

  十二点整。

  拉芙希妮口袋里的手机发出了沉闷的震动。

  仅仅是那一声震动，拉芙希妮原本还算放松的脊背瞬间绷紧。她的手指在口袋边缘停顿了一秒，然后拿出了手机。屏幕上闪烁着的名字。

  "是视频通话。"拉芙希妮看着屏幕，声音干涩。

  雪乃看着她。这里虽然相对空旷，但仍然能听见不远处的喧哗声，背景里还有神社特有的红灯笼和树影。这绝对不是一个能够解释为"安静可控的补习环境"的地方。

  就在震动即将进入第三轮时，雪乃突然走近了一步。她没有看拉芙希妮的眼睛，而是直接伸手，用振袖宽大的袖摆挡住了拉芙希妮身体右侧的半个画面，同时用一种极度冰冷的、带有明显命令意味的语气开口。

  "接通。"

  拉芙希妮的手指按下了接听键。

  屏幕亮起。爱布拉娜那张端庄而不可挑剔的面容出现在画面中。她似乎正坐在新大谷酒店的某间高层套房里，背后的落地窗透出东京冷冽的阳光。

  "中午好，拉芙希妮。"爱布拉娜的声音从扬声器里传出，平稳而带着一种天然的上位者审视，"希望我没有打断你那份……繁重的学业？"

  拉芙希妮将手机举在胸前，努力让自己的呼吸保持平稳："没有。我们正在进行实地考察。"

  "实地考察？"爱布拉娜微微挑眉，似乎对背景里的杂音感到了一丝意外，"在神社里？我以为那位雪之下部长，更偏好安静的室内。"

  "这是她的判断标准。"拉芙希妮按照预先的构想，机械地吐出字句，"她认为缺乏对本土文化的直观了解，是我现代文成绩不合格的根本原因。所以她不仅强迫我来这里，还要求我观察并记录至少一百个参拜客的行为逻辑。"

  "这听起来，真是一套别出心裁的教育方式。"爱布拉娜的视线穿过屏幕，似乎想看透镜头外的环境，"那么，那位严厉的部长现在在哪里？既然是她强制要求的补习，我作为姐姐，理应向她表达一下……感谢？"

  拉芙希妮的手指猛地收紧。她知道姐姐这不是在致谢，而是在要求验证。

  她刚想开口找个借口搪塞，一只有些冰凉的手突然从侧面伸过来，没有触碰她，而是直接握住了手机的边缘，将镜头强行偏转了三十度。

  雪之下雪乃那张没有任何表情波动的脸，冷冷地进入了画面。

  她甚至没有对镜头点头致意，视线微微下垂，用那种平时在活动室里训斥比企谷时的、充满鄙夷与极度缺乏耐心的语气开了口：

  "如果您的这通电话只是为了进行所谓的家属慰问，那么请您在十秒内结束。因为她刚刚因为注意力不集中，漏记了三个人文学习样本。她的现代文成绩已经没有多余的容错率可以浪费在毫无意义的远程社交上了。"

  画面里的爱布拉娜似乎停顿了半秒。那种属于都柏林家族长女的优雅笑容在嘴角凝固了极为短暂的一瞬，随后又恢复了原样。

  "看来，"爱布拉娜的声音依然轻柔，但多了一层无法名状的重量，"您确实是一位非常负责任的监督者，雪之下同学。那么，我就不打扰你们的'实地考察'了，祝你们玩的愉快。"

  "嘟。"

  通话被爱布拉娜单方面切断。

  手机屏幕暗了下去。

  雪乃立刻松开了手，往后退了半步，那种冷硬的杀气瞬间收敛，转而代之的是一种因为演戏而产生的极度别扭感。她转开视线，看向别处。

  拉芙希妮盯着暗掉的屏幕看了足足五秒，然后将手机放回口袋。她转过头，看着雪乃微微泛红的耳侧，轻声说道：

  "……谢谢你。如果刚才你没有接话，我可能就没法圆过去了。"

  "这只是为了弥补你那拙劣的谎言所造成的连锁反应。"雪乃整理了一下因为动作而有些凌乱的领口，语气干巴巴的，"而且，既然我已经被你单方面按上了'控制狂部长'的标签，那么维持这种人设，也是为了防止麻烦进一步扩大。"

  比企谷和由比滨离开后，石椅旁只剩下两人。雪之下雪乃拢了拢和服的袖口，冰冷的空气透过布料的缝隙渗入肌肤，但她没有试图寻找挡风的地方。

  拉芙希妮站在距离她半步的地方，浅米色的羊绒大衣在冷风中微微翻动。那条编在发尾的红绸带，在灰暗的冬日背景下显得异常刺眼。

  "虽然刚才已经念过了，但我觉得，还是让你亲自确认一下比较好。"

  拉芙希妮的声音很轻，却准确地穿透了周遭的杂音。她从大衣口袋里拿出那张折叠得四方四正的白色纸片，动作平稳地递向雪乃。

  雪乃视线下垂，落在对方伸过来的手上。那只手因为长时间暴露在冷空气中，指尖泛着淡淡的青白，唯有捏着纸片的地方显出一点血色。她并不喜欢这种基于概率学的迷信产物，更何况这与她刚才抽到的那张"末吉"形成了鲜明的反差。

  但她没有拒绝。理智告诉她，这只是一张印着铅字的普通纸片，而拒绝的动作可能会显得过度防御。

  她抬起手，用两根手指隔着袖摆的边缘，从拉芙希妮手中抽走了那张签文。

  纸张的触感干燥而冰冷。雪乃将其展开，视线迅速扫过上面印着的几行黑体字。

  '中吉。旧有之物不宜轻弃，南方有贵人相助，改变已在途中'。

  她的目光在"贵人相助"和"改变已在途中"这两句话上短暂地停滞了不足一秒。她知道拉芙希妮为什么要给她看这个。这种充斥着心理暗示和模糊指向的文字，总是能轻易地被解读为某种预言或者契合当下境遇的巧合。

  "这种由神社印刷厂批量生产的文本，其核心在于利用模棱两可的修辞，迫使阅读者将其与自身的现状进行强行关联。"雪乃将纸片对折，语气恢复了惯常的冷硬，甚至带上了一点教条主义的刻板，"如果你的智力还能维持在正常高中生水平，就应该明白，这种缺乏实证基础的所谓'改变'，毫无逻辑可言。"

  "确实没有逻辑。"拉芙希妮并没有因为被反驳而退缩。她注视着雪乃，翡翠色的瞳孔在黯淡的光线下显得尤为清澈，声音里带着某种不易察觉的、近乎笃定的重量，"但它也说，'旧有之物不宜轻弃'。"

  拉芙希妮的视线微微下移，落在雪乃那被和服袖口半遮半掩的手腕上，随后又收了回来。

  "所以，即使是没有逻辑的东西，有时候也会让人想要稍微……相信一下。"

  雪乃的呼吸在这一瞬间出现了微小的紊乱，随即被她强行压了下去。她强迫自己迎上拉芙希妮的视线，试图在对方的眼中找到戏弄或者算计的成分。

  但她什么也没找到。除了那种安静的、带着微小试探的注视。

  雪乃感到耳垂有些发烫。她迅速移开视线，将那张折叠好的签文强行塞回拉芙希妮的手里，动作甚至有些粗鲁。

  "如果这就是你认为的'相信'，那我建议你立刻去修改你的期末复习计划。"她的声音压得很低，每一个字都像是从牙缝里挤出来的，带着一种气急败坏的紧绷感，"因为你的现代文成绩，显然还不足以支撑你对这种复杂修辞进行准确的阅读理解。"

  "小企！你走快点啦！苹果糖都要化了！"

  由比滨结衣元气满满的抱怨声适时地从不远处传来，像是一把钝刀，粗暴地劈开了两人之间那种近乎凝固的空气。

  雪乃立刻转身，背对着拉芙希妮的方向，假装在整理和服的下摆。她听到身后的呼吸声似乎也跟着放松了下来。

  "抱歉抱歉！排队的人实在太多了。"由比滨一手举着一根红彤彤的苹果糖，另一只手还拽着一个满脸写着"想回家"的比企谷八幡，快步跑了过来，"拉芙希妮酱，给！这是你的份！"

  "麻烦死了……这简直是对我钱包和体力的双重压榨。"比企谷一边抱怨着，一边将手里另外两根苹果糖递了过来，在看到雪乃的瞬间，他原本就没什么精神的死鱼眼本能地瑟缩了一下，"那个……我什么都没看见，你们继续？"
