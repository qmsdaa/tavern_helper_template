场景: 66
幕: "第四幕·冬假→三学期"
时间: "2013年12月31日 · 周二 · 大晦日 · 爱布拉娜抵日后次日"
地点: "新大谷酒店 · 行政会议厅"
人物: "拉芙希妮·都柏林、爱布拉娜·都柏林、村上理事（东亚部）、随员若干"
正文: |
  新大谷酒店行政会议厅内的羊绒地毯厚重得能够吸走所有多余的声响，冷气与加湿器维持着一种近乎无菌的沉闷温度。

  长条会议桌另一端的东亚部理事们已经暂时离场去准备下一份简报。拉芙希妮坐在爱布拉娜斜后方半步的黑色皮质靠椅上。她的双膝并拢，脊背与椅背保持着精准的三厘米距离，双手交叠着放在大腿上，没有任何多余的动作。她正在用最完美的"都柏林家族次女"的躯壳，小心翼翼地缝合着所有可能泄露的缝隙。

  在这里，她不能因为暖气过足而拉扯领口，不能在漫长的无意义陈词中走神，更不能露出那种在雨后的家庭餐厅里、因为一盘廉价意面而产生的轻快鲜活的表情。那种带着烟火气、属于"千叶的拉芙希妮"的姿态，只要在这个房间里暴露出一秒钟，就会被立刻打碎。

  她微微垂着视线，颈后那一点细微的拉扯感成为了她此刻唯一的重量。

  那根原本缠绕在左手腕上的红绸带，今天早上被她花了几十分钟的时间，极为隐秘地编进了浅金色的长发里，最终在发辫的最下端，收拢成一个不起眼的小蝴蝶结。那抹红色藏在金发与制服的阴影之间，不再像昨天那样明晃晃地暴露在视线里，却依然实打实地贴着她的头发。只要这个结还在，昨晚街头那个关于"不会让你生气"的约定就依然生效，她就还能从这个窒息的空间里找到呼吸的缝隙。

  "亲爱的拉芙希妮。"

  爱布拉娜的声音在空旷的会议厅里响起。那语调轻柔、平缓，仿佛只是在谈论窗外的冬景。她甚至没有偏头，只是用那双修长白皙的手指，漫不经心地将面前那支印着家族纹章的定制钢笔推正了半寸。

  "刚才那位村上理事汇报季度财报的时候，你看着他那份错漏百出的幻灯片，并没有像以前那样下意识地去摸手腕。"

  爱布拉娜的手指停在钢笔笔帽上，翡翠色的眼眸这才慢慢转了过来，视线精准地掠过拉芙希妮的颈侧，最终停留在那个隐秘的红色蝴蝶结上。那目光不再是看着一个活物，而是在评估一件被擅自篡改了图纸的工艺品。

  "而且，我记得你以前只用暗色的发圈。"爱布拉娜的嘴角微微弯起，但那种笑意仅仅停留在皮肤表面。

  拉芙希妮的呼吸在肋骨间轻微地停滞了半拍，但她那交叠在腿上的双手连指尖都没有颤动。

  她知道这个时候任何关于"喜欢"或者"送的礼物"的辩解，都会立刻让这条绸带变成被褫夺的目标。她必须维持住昨天在车厢里抛出的那套叙事——一个被规则和正确性卡住的倒霉学生。

  "因为她不循常规。"拉芙希妮没有躲避那道视线，而是用一种近乎机械的平静语调作答，"她在发现我之前用来遮盖伤痕的旧物后，认为那种东西不仅在视觉上毫无秩序，还会对学校的'风纪'产生不必要的干扰。所以她单方面下达了'必须用符合学生身份的方式进行遮盖'的指令。"

  "很幼稚，也很不讲理……"

  沉闷的休息时间随着红木对开门的再次推开而结束。东亚部的村上理事带着几名随员重新入座，额头上还挂着一层细密的冷汗。他翻开了一份新的简报，清了清嗓子，试图用一种更加委婉的语调来解释上一季度的亏损。

  "关于在关东地区渠道拓展的额外支出，这主要是因为本地商业文化中长期存在的'交际成本'。这是一种默认的行业惯例，我们需要时间去润滑……"村上的声音在安静的会议室里回荡，带着一种圆滑的推诿。

  "所以，村上理事的意思是，都柏林家族的注资，应该被用来支付这种无法被审计追溯、仅凭您口中所谓'默认惯例'来定义的灰色支出？"

  拉芙希妮的声音突然插了进来。没有以往作为家族次女在长辈发言时的那种"得体"与"克制"，她的语调清冷、平直，每一个字都像敲击在玻璃上的冰块，清晰得不容忽视。

  村上愣了一下，似乎没料到这个一向只在旁听的少女会突然发难。他下意识地看向爱布拉娜，却发现那位家族长女正侧着头，用手指轻轻摩挲着钢笔的笔夹，一副饶有兴致的旁观姿态。

  "拉芙希妮小姐，您可能不太了解这边的国情……"村上试图挤出一个长辈宽容的笑。

  "我确实不需要了解那些为了掩盖低效而编造出来的借口。"拉芙希妮的视线依然平直地锁定在村上脸上，语气不仅没有软化，反而带着一种甚至称得上刻薄的精确，"这种名为'润滑'、实则转嫁自身决策失误的做法，我不认为它符合任何意义上的'最优解'。如果您的团队只能依靠这种缺乏理智与逻辑的手段来维持运营，那么我们完全有理由重新评估这份合同的继续执行性。"

  这几句话，无论从句式的结构，还是那种不近人情的直接感，都带着一种强烈的、属于另一个人的印记。

  村上的脸色变得很难看，他张了张嘴，却发现自己带来的那些圆滑的外交辞令，在这个少女冰冷且单刀直入的逻辑面前，竟然找不到任何着力点。

  长达一个多小时的问询终于在村上的狼狈退让中结束。会议室里只剩下纸页翻动的沙沙声。

  爱布拉娜将那支定制钢笔轻轻放在了桌面上，发出一声清脆的喀哒声。

  "刚才那一套……"爱布拉娜的身体微微向后靠，看着拉芙希妮的侧脸，紫色的眼眸里闪烁着一种近乎解剖学般的审视，"剥离所有的人情世故，用一种不容置疑的'正确性'去进行单边压制。这可不像是我教给你的东西。"

  拉芙希妮停下整理面前文件的动作。她知道，这才是今天真正的测试。

  "这当然不是都柏林家族的手腕。它甚至有些粗暴，缺乏真正的商业斡旋艺术。"拉芙希妮回过头，用一种平静的、甚至带着一点嘲弄的语气迎上了姐姐的目光，"那位雪之下部长，总是习惯用这套东西去衡量一切。她不允许任何不符合她'正确标准'的模糊地带存在。和她相处久了，难免会沾染上这种……相对幼稚且极端的切割方式。"

  "幼稚的切割。"爱布拉娜轻笑了一声。她修长的手指越过桌面，看似不经意地将拉芙希妮面前那份被捏得有些变形的简报抚平。

  "但这套幼稚的把戏，刚刚却让你把村上逼到了死角。"爱布拉娜的语气依然柔和，但那些字眼却像刀片一样精准地切了过来，"亲爱的拉芙希妮，你是在向我证明，那位部长教给你的东西很好用；还是在掩饰，你其实很享受这种……躲在别人构建的'正确'外壳下，借此来向我进行反抗的安全感？"

  空调的送风声在这一刻显得格外清晰。

  拉芙希妮将那份被姐姐抚平的简报重新拿了起来，没有看爱布拉娜的眼睛。

  "如果这种廉价的借口能帮我推开那些麻烦的应酬，"拉芙希妮的声音听不出一丝起伏，她将简报整齐地放入文件袋中，"那么偶尔利用一下这种毫无温度的'正确'，我认为是一笔划算的交易。"

  爱布拉娜略微停顿了一下，用温柔地语气说。

  "既然是交易，就应该分清楚筹码，亲爱的拉芙希妮，希望你没有被表象迷惑。"
