场景: 150
幕: "第十幕·冬去春来"
时间: "2015年3月24日 · 周二"
地点: "拉芙希妮公寓 → 温斯顿办公室（轻触） → 群聊"
人物: "拉芙希妮·都柏林、家政太太、温斯顿（轻触）、雪之下雪乃、比企谷八幡、由比滨结衣（群聊）"
POV: "共享场景／零POV（拉芙侧重）"
正文: |
  三月二十四日。千叶的樱花开了三成。拉芙希妮的公寓，窗帘洗过了，重新挂上去的时候，布面上有一道不明显的折痕。

  家政太太站在厨房里。她系着那条蓝色的围裙——两年前第一天来的时候就是这条。冰箱上贴着一张周菜单。星期三的格子里，以前写着"爱尔兰炖肉"。现在那一格空着。旁边另一个格子写着"自己做饭"，墨水很新。

  "菜单需要更新。"拉芙希妮把一张纸放在桌上。"这个月的。"

  家政太太接过去。菜单上每道菜旁边都标了分量和做法。只有星期三那格不一样——不是菜名，是一行字：菜谱在柜子里。自己做。

  "爱尔兰炖肉——"

  "不做了。"拉芙希妮说。"不是不好吃。是星期三想自己做饭。"

  家政太太看着她。"您以前从来不进厨房。"

  "以前不需要。现在想学。炖肉我自己会做——爱布拉娜教过。其他的——慢慢学。"

  家政太太把菜单折好，放进口袋。然后从包里拿出一份文件。牛皮纸封面，左上角：雇用契约更新确认书。两年了，这份文件每年三月更新一次。以前的版本，右下角有另一行格式。

  "今年的契约——"家政太太开口。

  "我知道。"拉芙希妮说。她从抽屉里拿出一个透明文件夹。里面是新的契约书。格式和旧的一样，但右下角只有一行签字栏：雇用主 拉芙希妮·都柏林。

  "汇报义务已经删除了。"她说。"两个星期前办的。手续上——你只对我汇报。不向家族。不向姐姐。"

  家政太太看着那行签字栏。她的手在围裙上擦了擦。然后她拿起笔，在"被雇用者"那栏签了名字。

  "这两年。"拉芙希妮说。"谢谢。"

  家政太太把笔放下。这是她第一次听到这个公寓的住人说这两个字。她站起来，把围裙解下来，搭在椅背上。然后从冰箱里拿出了两颗鸡蛋。

  "晚上做玉子烧。"她说。"甜的。"

  "好。"

  "星期三呢。"

  "星期三。"拉芙希妮说。"我自己做。"

  家政太太点了点头。她洗了手，开始打鸡蛋。厨房的窗开着一条缝，千叶三月的风从那里进来。窗帘洗过了。洗衣液的味道还是以前那一种。

  ——

  同一天下午。千叶站旁边的一栋办公楼。五楼，门牌上写着"Winston & Associates"。温斯顿坐在办公桌前，面前摊着一份英文文件。封面：Service Agreement — Renewal。续聘契约。

  拉芙希妮坐在对面。她把那份两页纸从头看到尾。第一页是温斯顿的权限范围——在留手续、住所租赁、法律文书翻译、大学在学证明办理。和两年前一样。第二页，签字栏。以前这页最下面有一行小字：委托方 都柏林家。

  现在那一栏写着：委托方 拉芙希妮·都柏林。

  "和家政太太一样。"她说。

  "我的续聘比她晚两周。"温斯顿说。"都柏林家那边的手续——上周处理完了。从四月一日起，我的聘书不再经过都柏林家族，也不向爱布拉娜汇报。"

  "你原来的聘书是爱布拉娜签的。"

  "是。但她上个月主动撤回了对我汇报线的要求。没说原因。只说——批准他转型单独成立机构的申请。"

  拉芙希妮拿起笔。在"委托方"那一栏签了名。没有犹豫。签完，她把文件推回去。

  "费用呢。"

  "信托支付。"温斯顿翻到附件那一页。"按以前的费率。加了大学的在学证明翻译——早稻田的日文文件翻成英文，英国那边的遗产接收方会需要。达洛维小姐的遗产接收方，已经确认了。是一个在苏格兰的表亲。不姓都柏林。"

  "谢谢。"

  "这是我的工作。"

  "不是。"她说。"你两年前给我私人邮箱。那个不在任何一份聘书里。"

  温斯顿把文件收进档案柜。关上抽屉。

  "那件事不在任何记录里。"他说。"也不需要在里面。"

  拉芙希妮站起来。走到门口。

  "温斯顿先生。"

  "嗯。"

  "你从来没有问过我——为什么留在日本。"

  "不需要问。"他说。"你留了。"

  她走出办公室。电梯门开了，三楼上来一个抱着一沓文件的人，往六楼去了。电梯里有一面镜子，她把右手腕的袖口往上推了推，看了一眼那条焦黑的丝带。

  然后松开袖子。

  ——

  傍晚六点四十分。千叶的天空从西边开始暗下去。拉芙希妮坐在公寓的书桌前，手机在右手边。屏幕上，群聊的最近一条消息是结衣发的：今天千叶的樱花开了三成！照片——车站前那棵染井吉野，枝头星星点点的粉。

  她点开输入框。打了字，删了。打了字，又删了。

  上一次这么犹豫是在伦敦。飞回来的前一天。她在手机前反复删改，最后只发了三个字："明天见。"

  今天她想了更久。窗外，千叶的街道亮起路灯，一盏接一盏，沿着总武线的方向。

  她看着屏幕。右手腕的袖口被桌面磨得起了毛。袖口底下，焦黑的丝带已经洗得发白。白天在温斯顿办公室，她在电梯镜子里看了它一眼。那条丝带是"还火"那天系上的。两年了。明年，它还会在她手腕上。只是不再藏着了。

  她重新点开输入框。

  "星期三有空吗。公寓。自己做饭。"

  发送。

  三分钟后。

  结衣：有空！！！要帮忙吗。我带了饼干！
  八幡：有空。别做太难的东西。你不会想看到我把失败品变成吐槽素材。
  雪乃：有空。几点。需要我带什么。

  拉芙希妮看着屏幕。手指在键盘上停了停，开始打字。窗外的樱花树，枝头比昨天又多开了几朵。
