场景: 10
幕: "第一幕·入部磨合"
时间: "2013年7月上旬 放学后 · 场景九之后不久（雨停、彩虹）"
地点: "奉仕部活动室 → 特别栋与主楼之间的开放式走道"
人物: "雪之下雪乃、拉芙希妮·都柏林、比企谷八幡、由比滨结衣"
正文: |
  雨势收得很急。

  刚刚还仿佛要将整栋建筑吞没的暴雨，此刻只剩下顺着屋檐滴落的残水。云层裂开一道缝隙，傍晚的阳光斜斜地漏了下来。

  "哇！彩虹！"

  由比滨结衣整个人几乎贴在了玻璃上，声音里带着毫不掩饰的雀跃。她猛地转过身，眼睛亮晶晶的："我们出去看吧！就看一小会儿！"

  "我拒绝。"雪乃看着手中还没翻完的一页，头也没抬。

  "这种天气出去，除了踩一脚泥水之外没有任何意义。"比企谷八幡趴在桌上，发出干瘪的抗议。

  结衣显然早就习惯了这两种回答，她没有气馁，而是直接走向了拉芙希妮，一把拉住她的手："拉芙希妮酱陪我出去！就一小会儿嘛！"

  拉芙希妮的身体僵了一下。她没有立刻抽回手，而是下意识地将视线投向了长桌另一端的雪乃。

  雪乃合上书本。她没有说话，只是伸手拿起了桌角的一把黑色折叠伞，顺着桌面，精准地滑到了拉芙希妮的手边。

  伞柄发出轻微的摩擦声，停稳。这是一种无需言语的许可，或者说，是一种界限的分明——你可以去，但带上伞。

  特别栋与主楼之间有一段没有遮蔽的开放式走道。地势微凹，一场暴雨过后，这里积起了一片不小的水洼。

  结衣第一个冲了出去。她没有绕开水洼，而是直接踩了进去。"啪"的一声，水花溅起，打湿了她的白色堆堆袜，但她毫不在意，笑得像个刚捡到糖的孩子。她做这件事没有任何逻辑上的理由，仅仅是因为她现在想这么做。

  比企谷八幡走在最后面。他双手插在校服裤子的口袋里，用那双死鱼眼看着前面又叫又跳的结衣。他没有踩水，甚至刻意避开了积水较深的地方。但他也没有开口吐槽"很脏"或者"快回去"。在这个人际关系极度别扭的团体里，他不阻止，就是他最高级别的"允许"。

  雪乃站在走道的边缘，皱着眉看着那片倒映着彩虹的水洼。她原本绝对不会参与这种毫无意义且极不卫生的行为。

  "小雪乃也来嘛！"结衣转过身，朝她伸出手。

  雪乃叹了口气。她没有牵结衣的手，而是往前迈了半步。她低头，视线锁定在水洼的边缘，然后以一种精确、几乎像是用尺子量过的动作，伸出右脚。

  制服皮鞋的鞋尖，轻轻地点了一下水面。

  只有最边缘的一小圈涟漪荡开。鞋尖沾上了一点水渍。这就是雪之下雪乃版的"踩水"——克制，注意分寸，但她确实做了。

  做完这个动作后，雪乃收回脚，视线自然地落在了身侧。

  拉芙希妮站在离她半米远的地方。

  她手里握着那把雪乃推给她的折叠伞。伞没有撑开。她安静地站在那里，看着结衣踩水，看着比企谷插着口袋，看着雪乃用鞋尖点水。

  屋檐上的残水滴落下来，有一滴砸在了拉芙希妮的肩膀上，深蓝色的校服布料立刻洇开了一小块深色的水迹。

  雪乃微微眯起眼睛。以拉芙希妮那种总是将校服穿得一丝不苟、连丝带都系得毫无偏差的习惯，她第一反应应该是立刻撑开伞，或者退回有遮蔽的走廊里。

  在雪乃的注视下，拉芙希妮慢慢地抬起手。

  但她没有撑伞。

  她将折叠伞的绑带扣紧，彻底断绝了打开它的可能。然后，她往前走了一步，站到了那片还在滴答作响的雨滴正下方。

  水珠落在她的金发上，落在她白皙的脖颈处，落在她那件绝对不能弄脏的校服上。

  她没有踩水。她甚至没有笑。

  她只是静静地站在那里，允许自己不打伞，允许自己被这无意义的雨水弄湿。这对于一个习惯了精确控制的人来说，是一种笨拙、却又极度危险的偏离。

  雪乃看着拉芙希妮肩膀上越来越大的水迹，眉头再次蹙起。她没有出声询问"你为什么不打伞"，也没有去抢夺那把折叠伞。

  她只是从口袋里摸出一包尚未拆封的面巾纸。

  拉芙希妮点头接过面巾纸，虽然拉芙希妮的头发被雨水打湿，她没有擦。她伸手接住了空中飘着的一朵扇形的、被风吹散的蒲公英种子。

  她把那颗种子放进衣袋。塔拉庄园没有蒲公英。伦敦的春天太冷。这颗种子什么都不知道——它不知道它现在属于一个16岁的、正在学着淋一点雨的女孩。
