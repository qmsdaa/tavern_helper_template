场景: 89
幕: "第五幕·PTA→舞会"
时间: "2014年3月24日 · 周一 · 修業式"
地点: "总武高 · 体育馆 → 2年J班教室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣（+ 背景：全校学生、教职员）"
正文: |
  体育馆里没有开暖气。

  三月的风从高窗那排半开着的换气扇缝隙里灌进来，把悬挂在舞台上方那条「平成二十五年度修業式」的横幅吹得微微鼓起又塌下。全校学生按班级列队站在打磨得反光的木地板上，彼此的体温在这片宽阔的空间里无法聚拢，离开皮肤就被冷风带走。偶尔有人压低了嗓子咳嗽，声音在天花板的钢架结构间弹跳了两下才消失。

  二年F班的队列排在靠窗那一侧的中段。由比滨结衣站在女生列的前排，制服裙摆被从窗缝灌进来的冷风吹得轻轻晃动。她把重心从左脚换到右脚，又从右脚换回来。从她站的位置，能看见坐在舞台左侧的教职员席——平冢静穿着一套深色西服，端坐在那排折叠椅的最边缘。没穿白大褂的平冢老师整个人小了一圈，被那身深色西服的硬直线条压扁了轮廓。

  结衣盯着那个方向看了几秒，用力眨了眨眼睛，把视线收回到前排同学的后脑勺上。

  比企谷八幡站在男生列的最末尾。他选择的位置和平时上课时一样——离后门最近的那一格。背微微佝着，双手插在裤兜里，校服外套的领口没有扣到最上面那颗。舞台上的校长正在用那种专门为典礼调试过的、既洪亮又毫无情绪波动的声调宣读学年总评。八幡听着那些关于「本年度の成果」和「次年度への課題」的冗长套话，在心里数着高窗换气扇的转速。一圈、两圈、三圈。

  隔着一条过道，二年J班的雪之下雪乃站在女生列前端。她那张线条端正的侧脸在体育馆冷白色的灯光下看不出任何情绪起伏。双手交叠在身前，脊背挺直，视线不偏不倚地落在舞台上正在发言的校长身上。她身边站着的几个女生偶尔会侧过头偷瞄她一眼，然后迅速转回去——这套西装她已经穿了一整年，但每次出现在正式场合，依然能让周围的人产生一种「她走错了楼层」的错位感。

  拉芙希妮·都柏林站在女生列的中段，和雪乃之间隔了七个半人的距离。她把浅金色的长发在脑后束成一个低马尾，校服外套的袖口遮住了右手腕上的旧丝带。从侧面看过去，她和身边那些因为站了太久而开始偷偷垫脚换重心的女生没有区别——安静、得体，注视着舞台方向。

  但她的视线没有停在校长身上。

  她在看教职员席最边缘那把折叠椅上，那个从入场到现在没有换过一次姿势的身影。两天前的道具室里，雪乃说「平冢老师下周就要正式调职」的时候，用的是『下周』——那个时候的『下周』还隔着一个周末的距离。现在她就坐在那里，在二十几个教员的最旁边，深色西装的肩线在荧光灯下绷成一条僵直的线。

  拉芙希妮把视线收回。右手拇指在袖口的布料下，沿着旧丝带的纹路来回摩挲了一次。

  校长开始颁发修了证书。各班代表按照学年顺序依次上台，接过那张深蓝色封面的厚纸，鞠躬，转身，下台。鞋底踩在舞台木地板上发出空洞的闷响，一个接一个，节奏精确得像是某种经过彩排的仪式性舞蹈。

  轮到二年J班的时候，雪乃从队列里走了出来。

  她走上舞台侧面的那三级台阶，在校长面前停下，双手接过修了证书，鞠了一个角度精确的躬。整个过程没有任何多余的动作。台下有几个一年级的男生发出了很轻的「哇」声，被旁边的老师扫了一眼就立刻消了音。

  拉芙希妮看着雪乃转身走下台阶。那张修了证书被她用双手端在身前，深蓝色的封面和制服的深色面料重叠在一起。

  「接下来，是教职员异动通报。」

  校长把麦克风的音量调低了一点，从旁边的助手手中接过一张打印纸。体育馆里的咳嗽声在这一瞬间全部消失了。

  八幡插在裤兜里的手指慢慢攥紧。

  校长开始念名单。这是一份按学科分类、以五十音顺序排列的人名清单。数学科。国語科。理科。社会科。英语科。每个名字后面跟着一个地名或者校名，代表这个人下一站被系统分配的坐标。台下偶尔响起零星的掌声，是那些被念到名字的老师所负责的班级传出来的。

  「生活指导部——平冢静。千叶县立総武高等学校より、千叶市教育委员会事务局へ。」

  八幡没有鼓掌。二年F班与J班的队列间传来了几声稀稀落落的掌声，和其他班级送别自己老师时的动静相比，单薄得像一阵心虚的风。站在F班前排的结衣把两只手合在一起拍了两下，手心撞在手心上，发出一声孤零零的脆响。她的睫毛上挂着一层薄薄的湿气。

  雪乃端在身前的修了证书纹丝不动。她的脸朝向舞台，眼睑低垂，嘴唇抿成了一条很细的线。

  拉芙希妮没有鼓掌。她看着教职员席边缘那把折叠椅上的身影微微前倾了一下——平冢静对台下鞠了一个很浅的躬，角度像是某种自嘲，很快又直起身来。

  八幡的视线钉在天花板的钢架上。他没有看教职员席。掌声结束后，他把右手从裤兜里抽了出来，拇指和食指用力捏了一下鼻梁，然后重新把手插回去。

  典礼在十点四十分结束。各班按顺序退场，体育老师站在门边用口哨指挥队列的分流。鞋底摩擦木地板的声响混着陡然升高的交谈声，把刚才那层覆盖在所有人身上的仪式性沉默撕开了。

  二年J班的教室在三楼走廊的尽头。

  学生们陆续走进来，坐到各自的座位上。黑板上用粉笔写着「修業式」三个大字，旁边贴着一张打印出来的春假注意事项通知。班主任站在讲台上，分发成绩单，交代春假期间的安全须知，补考安排，下学期开学日期。有人在桌洞底下偷偷翻手机。有人把成绩单折成纸飞机塞进书包。

  拉芙希妮坐在靠窗那一列的倒数第三排。她把修了证书放进书包，拉上拉链，然后抬起视线看向窗外。中庭里那棵樱树的枝头还是光秃秃的，花苞紧紧裹在灰色的鳞片里。两天前在那个堆满灰尘的道具室里说出的每一句话，此刻都被这间明亮到发白的教室和班主任那条事无巨细的安全须知清单推到了一个不合逻辑的远方。

  雪乃坐在最前排靠窗的位置，把成绩单平整地夹进笔记本的第一页，合上封面，动作和她在体育馆里接过修了证书时一样——精确、克制、没有多余。

  班主任终于合上讲台上的文件夹，拍了拍手上不存在的粉笔灰。

  「以上。春假期间注意安全。四月九号开学。解散。」

  椅子腿刮过地板的声响淹没了她后半句话。

  拉芙希妮把书包挂在椅背上，正在整理抽屉里最后几本笔记。雪乃已经收好成绩单，站在座位旁等她。

  走廊上传来急促的脚步声。结衣从F班方向赶到J班门口，手里的成绩单卷成一个圆筒；八幡跟在后面，刚把对折两次的成绩单塞进外套内袋。

  雪乃把笔记本放进书包，站起来，转向身后的三人。她张了张嘴，想说什么——要么是关于部室的最后归档，要么是昨天约好的整理时间——但还没有发出第一个音节，结衣就已经从侧面伸手拽了拽她的袖口。

  雪乃停住。

  结衣没有解释为什么拉她袖子。她只是看着雪乃，又扭头看了一眼拉芙希妮和八幡。眼睛里的湿气还没全干，但嘴角拉出了一个很用力、很不讲理的弧度。那个表情把刚才在体育馆里憋了太久的沉默，从队列的缝隙间一起拽了出来。

  八幡抓了抓后脑勺。

  「部室。还要打扫。」

  他说这四个字的时候用的是那种干瘪到极点的陈述句语气，像是在宣布今天午饭打算去食堂买咖喱面包。

  「我去拿扫把。」结衣把手里的成绩单塞进书包，拽着那条还没拉紧的拉链就往外跑。

  雪乃看着她冲出教室的背影，睫毛往下压了一瞬。然后拿起书包，跟在结衣身后走向门口。经过拉芙希妮的座位时，脚步慢了半拍。

  「你的抽屉，还没清完。」

  拉芙希妮把手里那本笔记本放进书包，站起来。「我知道。你先过去。」

  雪乃看了她一眼——没有任何多余的追问——转身走向门口。

  八幡从靠走廊的座位走出来。经过拉芙希妮身边时，他的步速没有变化，视线也没有偏移。只是用刚好能让她听见的音量，丢下了一句话。

  「体育馆里，最该鼓掌的人是你。」

  然后他双手插兜，跟着雪乃走了出去。

  教室里的人越来越少。走廊上的人声和脚步声逐渐稀薄，像退潮一样朝楼梯口的方向流去。拉芙希妮站在窗边，手里攥着书包带。中庭里那棵樱树还在风里站着，枝条上的花苞被逆光剪成一排细密的暗色轮廓。广播里开始播放结课音乐——一首管弦乐改编的、每年修業式都会放的曲子。她听着那段旋律穿过教室门上方的扬声器，穿过走廊上剩余的那些模模糊糊的人声和鞋底摩擦的余音。

  她把书包背好。

  迈出教室门的时候，那支曲子刚好放到第一段副歌，弦乐部分的音量在空荡荡的走廊里被拉得很长。她没有往楼梯口走。鞋尖转向了相反的方向——特别栋。

  水磨石地板上拖着一道很长的影子。
