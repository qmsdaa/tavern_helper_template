场景: 71
幕: "第四幕·冬假→三学期"
时间: "2014年1月7日 · 周二 · 三学期开学日 · 早晨"
地点: "千叶站检票口 → 总武高中玄关 → 走廊"
人物: "拉芙希妮·都柏林、雪之下雪乃、由比滨结衣、比企谷八幡"
正文: |
  寒假在一片干冷的北风声中画上了句号。一月七日的清晨，千叶站检票口外人头攒动，穿着各色制服的学生汇成一股股灰蓝色的洪流，向着各自学校的方向奔涌。

  雪乃站在检票口外侧的一根水泥柱旁，避开了主干道上熙攘的人流。她将书包带子往肩上提了提，目光越过攒动的人头，落向车站那个挂着巨大广告屏的入口处。屏幕上正播放着新一季的护肤品广告，明媚得不合时宜。

  这里是她们往常约定好的汇合点。虽然说是约定，最初其实不过是在深夜里 LINE 上拉芙希妮发来的一条简短的"明天车站见"而已。

  在那块广告屏切换画面的瞬间，一个熟悉的身影出现在了入口的光影交界处。

  拉芙希妮穿着总武高的校服，身形在厚重的冬装大衣里更单薄了。她没有像其他学生那样步履匆匆，而是以一种扫雷般的步调，缓慢地穿过人群。那头浅金色的长发被风吹得有些乱，左手腕上那条红色的绸带明晃晃地缠绕在深青色针织衫的袖口外。右手腕处，那截烧焦的旧丝带从袖口边缘露出一小截，没有被任何东西遮盖。而在她右侧耳边，那枚由比滨结衣赠送的粉色塑料发卡，在早晨惨白的阳光下折射出廉价却亮眼的光。

  看到那个身影的瞬间，雪乃一直微微紧绷的肩膀线条松了半寸。

  她在心里松了口气。假期结束意味着要回归日常，但也意味着那个人终于从那个被家政太太的视线填满的公寓里走出来了。虽然那条关于"明天见"的回复来得极晚，晚到让雪乃又失眠了半个多小时，但至少，她现在确实站在那里，没有缺胳膊少腿，也没有变成任何一个别人的影子。

  雪乃迅速收回视线，低头看了一眼手腕上的表，然后又抬起头，视线若无其事地投向了车站大厅那块并不怎么准时的电子钟。

  "比预定时间晚了三分钟。"

  当拉芙希妮走到面前时，雪乃没有去看她的脸，而是盯着对方大衣领口那枚扣歪了的扣子开口。声音清冷，像是刚从冰箱里拿出来的苏打水。

  "抱歉，雪乃同学。"拉芙希妮停下脚步，微微喘了口气。她的脸色比放假前更加苍白，眼底有一层淡淡的青色，那是长期睡眠不足留下的痕迹。"早上电车门故障，在稻毛海岸站停了五分钟。"

  "这种低级的公共交通故障，并不能成为破坏时间契约的合理理由。"雪乃从鼻子里哼出一声，视线终于移到了拉芙希妮的脸上，"如果你能把每天晚上熬夜盯着手机屏幕的时间分出一半用来预习明天的课业，或许你的效率会提升不少。"

  拉芙希妮没有反驳，只是垂下眼帘，嘴角动了动，没有真的笑出来。

  "您的建议非常中肯。我会尝试调整作息的。"她停了半秒，声音压低了一些，"昨晚……回复得有些晚了。"

  "我不在意你什么时候回复。"雪乃立刻打断了她，语速比平时快了半拍，"只是作为一个负责任的部长，我有义务提醒部员保持良好的作息习惯。这纯粹是出于对社团运作效率的考量，并不包含任何私人情绪。"

  "当然，我明白。"拉芙希妮抬起头，那双翡翠色的眼睛平静地看着雪乃，"部长大人的考量总是很周全。"

  "走吧。如果再在这里浪费时间，我们就要成为本学期第一批迟到的反面教材了。"

  雪乃率先转过身，迈开步子向着通往总武高的方向走去。她没有回头看拉芙希妮有没有跟上，但脚步放得比平时慢了一些，只慢了那么半拍。

  身后传来拉芙希妮跟上的脚步声，不紧不慢，踩在融化的雪水里，发出轻微的声响。

  ——

  总武高中的玄关在早晨八点总是充斥着皮革摩擦地面的声响和学生们毫无顾忌的谈笑声。一月份的冷气顺着自动门灌进来，在贴着姓名牌的木质鞋柜前盘旋。

  比企谷八幡正以一种要将身体嵌进鞋柜角落的姿势蹲在那里，慢吞吞地解着系得太死的鞋带。由比滨结衣站在他旁边，一只脚踩在长凳边缘系着堆堆袜，手里还举着手机似乎在回复什么消息。

  "啊，小雪乃！拉芙希妮酱！早上好！"结衣第一个发现了走进玄关的两人，立刻收起手机挥手，堆堆袜还没拉上去就被她这么踩着。

  "啧。"八幡发出了一声短促的咋舌声，终于把那根顽固的鞋带扯开，"看来不幸果然是会传染的。刚开学就能在玄关遇到自带低气压的人偶组合。"

  "比企谷同学。"雪乃停在鞋柜前，没有立刻换鞋，而是垂下视线看着八幡那副快要融进地板的姿态，"如果人体工学没有发生重大变革的话，人类的脊椎并不适合以那种角度折叠。在开学第一天就展现出对重力的过度依赖，并不值得提倡。"

  她伸手拉开自己的鞋柜门，动作依然精准而克制，只是在指尖触碰到那双室内鞋时，指节比平时多停留了半秒。

  "比企谷同学大概是在进行某种反向的新年参拜。"拉芙希妮在一旁脱下厚重的大衣，动作比平时慢了一拍。她把大衣挂在校服臂弯里，语气平稳，"毕竟比起面对新学期，假装自己是一袋没开封的垃圾要轻松得多。"

  "喂，留学生，不要用那种一本正经的语气说出这么失礼的比喻。"八幡从鞋柜前站起来，那双死鱼眼扫过拉芙希妮苍白的脸色，最后落在她耳边的粉色发卡上，"而且那个发卡是怎么回事……新年新气象？"

  "那是我送给拉芙希妮酱的哦！"结衣终于把袜子拉好了，跳下长凳凑过来，"怎么样？很可爱吧？我觉得和拉芙希妮酱的头超级配！"

  "由比滨同学。"雪乃已经换好了室内鞋，正在整理裙摆，"在公共场合大声宣扬自己的审美主张，虽然不算违反校规，但多少有些缺乏对周遭环境的感知能力。"

  "知道了知道了，小雪乃还是这么严格。"结衣吐了吐舌头，背起书包率先往走廊走去。

  八幡慢吞吞地跟在后面，拉芙希妮和雪乃走在最后。走廊里的暖气并不充足，冷风还是能从没关严的窗户缝里钻进来。
