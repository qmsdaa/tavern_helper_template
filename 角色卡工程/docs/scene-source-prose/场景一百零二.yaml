场景: 102
幕: "第七幕·重新为奉仕部命名"
时间: "2014年4月8日 · 周二傍晚 · 春假末"
地点: "平冢静的公寓 → 公寓楼下"
人物: "平冢静、雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林"
POV: "雪之下雪乃"
正文: |
  “先声明，这不是送别会。”

  平冢静站在餐桌旁，手里的长筷正夹着一叠还没放进锅里的牛肉。她身后的客厅堆着几个封好的纸箱，箱盖上分别写着书、衣物和厨房，最后一个“杂物”被改成了“总有一天会用到”。

  “老师，通常只有送别会的主角才会在开场强调这不是送别会。”雪乃把装着蔬菜的盘子放到桌边，“而且您连搬家用的纸箱都没有藏起来。”

  “这是清空冰箱。”平冢把牛肉放进锅里，“新住处的冰箱更小，带过去也塞不下。你们只是碰巧在我处理冷冻库存时过来吃饭。”

  八幡脱下外套，盯着锅里迅速变色的肉片。

  “用这么贵的库存招待碰巧上门的学生，教育委员会的离职补偿比想象中丰厚。”

  “我是调职。”

  “真遗憾。我还以为终于有一个公共机构愿意为总武高这些年遭受的损失支付赔偿。”

  平冢把筷子抬起来。八幡已经在她开口前坐到离锅最远的位置。

  “小企，不可以一来就惹老师生气啦。”结衣抱着一摞小碗从厨房出来，围裙系得有些歪，“今天明明是大家好好吃饭的日子。”

  “由比滨，你也接受了清空冰箱这个正确名称。”

  “我才没有！我只是觉得，那个……说成送别，好像真的就结束了。”

  结衣把最后一只碗放下，碗底在桌面上磕出轻响。她赶紧扶住，低头检查有没有缺口。

  平冢往锅里添了些汤。

  “调职又不是流放。手机号码没换，千叶也没有因为我离开学校就沉进海里。”

  “那么，教育委员会里有合适的未婚男性吗？”结衣问。

  平冢手里的汤勺停在锅沿。

  “由比滨，今天可以多吃肉。”

  “这是封口费吧。”八幡说。

  “以这盘牛肉的价格来说，封口对象的要求未免太低廉了。”雪乃接过汤勺，把浮到锅边的泡沫撇掉，“老师应该庆幸由比滨同学没有要求您提交职员名单。”

  “小雪乃也不要跟着小企欺负老师呀！”

  拉芙希妮坐在雪乃旁边，把几只饮料杯按照座位摆好。她今天没带行李，平冢客房门口那只深蓝色旅行箱已经不见了。

  “住址备案完成了吗？”平冢问。

  “下午收到了学校和管理公司的确认。”拉芙希妮说，“温斯顿先生把补充文件送到了原来的公寓。今晚开始，我会住回去。”

  “药和换洗衣服都拿走了？”

  “拿走了。客房的床单也已经洗过。”

  “我问的是你的东西。”

  拉芙希妮安静了一会儿。

  “都拿走了。”

  平冢点点头，把煮熟的肉夹进她碗里。

  “那就行。床单留给搬家公司头疼。”

  “平冢老师，床单也属于您的私人物品。”雪乃说。

  “雪之下，人活着总得学会把一部分问题交给专业人士。”

  “您所谓的专业人士，主要工作恐怕不包括替客户清洗床单。”

  “所以才叫考验职业素养。”

  锅里的汤重新沸起来。结衣忙着把快要煮散的豆腐捞进每个人碗里，八幡趁平冢转身拿调味料时夹走了剩下的牛肉。平冢回来后看了一眼空盘，没有揭穿他，只把一把青菜全部倒到八幡面前。

  雪乃低头喝汤。外套挂在玄关旁，右边口袋里装着那把黄铜钥匙。她进门时确认过一次，帮结衣找围裙时又碰到过一次。钥匙圈上的塑料牌已经褪成浅蓝，上面仍写着“特别栋·闲置教室”。

  她没有把它拿到餐桌上。

  “老师以后还会来总武高吗？”结衣问。

  “办手续的时候也许会。”

  “我是说，来看我们之类的。”

  “你们要是认真上课，我回去也没有理由专门看你们。要是闯了祸，新的生活指导老师自然会处理。”

  “听起来毫无留恋。”八幡说。

  平冢给自己倒了杯啤酒。

  “教师每年都会送走学生。总不能每送走一届就趴在校门口哭。”

  “平冢老师这次明明是先走的那个。”结衣小声说。

  啤酒沫越过杯沿，落在平冢手背上。她用纸巾擦掉，顺手把结衣碗里剩下的香菇夹走。

  “所以今天由我负责做饭。”

  “明明说是清空冰箱……”

  “再说就把豆腐也交出来。”

  结衣立刻护住自己的碗。八幡低头笑了一声，很快用喝汤的动作遮了过去。

  饭后，平冢把空酒罐和饮料瓶装进回收袋，结衣坚持要把桌子擦完。拉芙希妮把洗好的碗放上沥水架。八幡站在客厅中央，被平冢指挥着把装书的纸箱搬到墙边。

  “为什么只有我在做体力劳动。”

  “因为这屋里只有你吃肉时表现出了足够的行动力。”

  “我开始怀疑那盘牛肉从一开始就是劳动报酬。”

  “现在才发现，说明你还需要继续接受社会教育。”

  最后的纸箱挪开以后，墙边露出一小块颜色较深的地板。拉芙希妮把客房里剩下的衣架放进纸箱，没有带走平冢借给她的那件旧运动外套。

  “留着吧。”平冢说，“我到新单位总不能穿这个上班。”

  拉芙希妮把外套重新叠好，放在纸箱最上方。

  “我已经有自己的外套了。”

  “那就等我哪天去你那边喝酒时再拿。”

  “我不会准备酒。”

  “可以提前通知。我自己带。”

  拉芙希妮没有再把外套拿出来。

  结衣提起回收袋，八幡接过较重的那一袋。平冢把捆好的旧报纸塞给拉芙希妮，嘴上说着既然来吃了饭就不能白吃。

  雪乃站在玄关旁，没有穿外套。

  “你不走？”八幡问。

  “还有一件学校公物需要处理。”

  八幡看了一眼她挂在衣架上的外套。

  “那我们先把这些拿下去。”

  结衣像是想问什么，最后只把雪乃的鞋往玄关内侧推了推，免得回收袋经过时碰到。

  “我们在楼下等你。”

  门关上以后，客厅里只剩锅底尚未散去的酱油味。平冢没有回到餐桌旁，她拆开一个空纸箱，重新压平翘起的箱盖。

  雪乃从外套口袋里取出黄铜钥匙。

  她把钥匙放在玄关柜上。金属碰到木板，发出的声音和修业式那天下午并不相同。这里没有活动记录本，也没有那张用了许多年的长桌。

  “这把钥匙应该还给您。”

  平冢继续折纸箱。

  “这不是我的东西。我也没有资格替学校收。”

  “当时是您把它交给我的。”

  “所以现在轮到你处理。”

  平冢把纸箱靠到墙边，终于转过身。

  “明天亲自交给后勤处。”

  雪乃看着玄关柜上的钥匙。

  “我会同时递交新的活动室使用申请。顾问人选尚未确定，我会先向教务处确认可以接任的教师，再补充上一年度的活动记录和新学期计划。”

  “那是手续，不是答案。”

  雪乃停了下来。

  “学校处理活动室申请，需要的就是这些材料。”

  “材料齐全，最多证明你很会填表。”平冢说，“没有我的名字以后，会有人问你为什么还要把那间教室交给奉仕部。你准备怎么回答？”

  “奉仕部会继续接受校内学生的委托。过去的记录可以证明，我们处理过学生会选举、文化祭和校际活动，也为个别学生提供过帮助。”

  “那是你们做什么。”

  平冢走到玄关柜旁，却没有碰那把钥匙。

  “我问的是，为什么必须由你们继续做。”

  “因为仍然有人需要这种帮助。”

  “学校有生活指导室，有保健室，也有学生会。其他社团同样可以帮助别人。”

  “它们处理问题的方式不同。”

  “奉仕部的方式是什么？”

  雪乃没有回答。

  平冢也没有催促。楼下传来空瓶投入回收箱的响声，随后是结衣隔着一段距离喊八幡慢一点。

  “我以前把那个房间留给你，是因为你当时需要一个可以坐下来的地方。”平冢说，“后来比企谷和由比滨进去了。拉芙希妮也进去了。现在你们已经会自己开门和泡茶，也会接下委托。那些不该由别人替你们说的话，你们同样说得出口。”

  “所以，奉仕部已经没有继续存在的必要了吗？”

  “这个问题又交给我了。”

  平冢拿起钥匙，将它放回雪乃手中。

  “别拿我、规则，或者他们三个当答案。他们想要什么，让他们自己说。你想要什么，也得由你说。”

  黄铜钥匙被她握得有些发热。

  “如果我还没有答案呢？”

  “那就带着没有答案的样子去后勤处。”平冢说，“总比交上一份写得很漂亮的假话强。”

  雪乃把钥匙收回外套口袋。

  “那把钥匙下一次回到你手里，必须是因为你自己知道为什么要接住它。”

  平冢说完便拉开门，从鞋柜上拿起雪乃的鞋，放到她面前。

  “好了。再不下去，由比滨大概会以为我把你留下来补课了。”

  “您的国语课已经结束了。”

  “所以这次不收作业。”

  雪乃穿好鞋，走出玄关。平冢没有送她下楼，只站在门内，提醒她明天别忘了拿后勤处的收据。

  自动贩卖机的灯亮在公寓入口旁。结衣坐在矮墙边，手里捧着一杯热奶茶。拉芙希妮站在回收箱旁，正在替她拧紧没有喝完的瓶盖。八幡靠着栏杆，MAX咖啡的拉环已经被打开。

  “小雪乃！”结衣站起来，“说完了吗？”

  “嗯。”

  三个人都等着她继续。雪乃把手放进外套口袋，钥匙齿碰到手机外壳。

  “明天先去后勤处。”

  “好。”结衣回答得很快，“那我们在校门口等你。”

  “我可以自己去。”

  “我们只是去上学。”八幡喝了口咖啡，“碰巧要经过同一个后勤处而已。”

  “总武高的校门到后勤处只有一条路。我很难理解这种碰巧成立的条件。”

  “那就当成集体迷路。进入高三以后方向感突然退化，也属于升学压力的一部分。”

  拉芙希妮把空回收袋折好，递给雪乃。

  “走吧。”她说，“末班前的车会更挤。”

  四个人沿着公寓外的小路往车站走。经过路口时，结衣在前面回头叫了雪乃一声。

  雪乃跟上去。黄铜钥匙留在她的口袋里，随着脚步碰了一下手机。
