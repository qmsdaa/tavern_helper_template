场景: 20
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月下旬 · 林间学校第二天夜晚 · 试胆大会"
地点: "千叶村青少年中心外森林 · 试胆大会终点"
人物: "拉芙希妮·都柏林、比企谷八幡、鹤见留美、留美的同伴们"
POV: "拉芙"
正文: |
  平冢老师的声音即便是隔着半片树林，也能清晰地穿过夏夜的虫鸣传过来。

  她不知道和那个带队的小学老师达成了什么共识，硬生生地在这片没有路灯的林地边缘策划出了一场试胆大会。高中生指导员们被要求穿上主办方不知道从哪里翻出来的廉价白袍，戴上毫无惊悚感可言的面具，分布在森林的不同点位充当所谓的"鬼怪"。

  这种粗糙得堪称敷衍的吓人手段，对小学生来说似乎已经足够了。

  拉芙希妮被分配到了整个流程中最不需要情绪劳动的位置——终点的出口处。

  只需要坐在一把有些摇晃的折叠木椅上，手里拿着一份按小组打印的名单，旁边放着一盏亮度只能照亮膝盖的露营灯。这就够了。不用去扮演任何角色，也不需要回应那些孩子们的期待。

  前方的树影里开始传来动静。最初只是踩断枯枝的碎响，随后便演变成了毫无保留的尖叫。

  一批又一组的小学生从黑暗中冲出来。手电筒的光柱在他们手里像无头苍蝇一样乱晃，毫无章法地扫过远处的树冠和拉芙希妮的脚边。

  有被吓得直接哭出声的，眼泪和汗水糊在脸上，攥着同伴的手腕；有还在强装镇定，其实声线已经开始发抖的男孩，用干涩的笑声试图掩饰刚才的狼狈；还有几个出来后互相埋怨谁跑得太快的。

  这种夹杂着恐惧、兴奋和过度消耗后释放的喧闹，让终点这片空地变得异常吵闹。

  拉芙希妮坐在阴影里，一只手压着那张被夜风吹得有些起皱的名单，另一只手握着圆珠笔。那只并不属于总武高、而是从美滨区公寓带出来的黑色圆珠笔，在她指尖机械地移动着。

  "五年级……长谷川，到了。"

  "六年级……三桥，到了。"

  不用打招呼，不用多余的安抚。她只是在那些光斑扫过她，那些急促的呼吸声靠近又远离时，准确地找到他们胸前名牌上的假名，在表格上划下一个平直、没有任何感情色彩的勾。

  又一阵急促的脚步声从林地里传出。

  光束晃了几下后，四五个女孩互相推搡着跑出了那片黑暗的树皮分界线。借着地上的露营灯，拉芙希妮认出了她们是白天和那个叫留美的孩子分在同一组的几个女生。为首的那个好像叫优香。

  她们跑得气喘吁吁，但在离开森林、确认安全的那一秒钟里，原本紧绷着的恐惧几乎是瞬间消散了。取而代之的，是迅速恢复的那种属于小团体的排外氛围。

  优香拍了拍胸口，回头往黑漆漆的林间小路看了一眼，压低了声音，但依然确保周围几个同伴都能听见。

  "……真的不管她吗？"其中一个女孩语气里带着点试探。

  "是她自己走得那么慢的，谁要在那种黑漆漆的地方等她啊。"优香的语气里没有多少愧疚，只有那种理所当然的抱怨，"明明什么都不会做，还总是摆出一副不想理人的样子。"

  "就是啊，肯定又是一个人躲在哪里了吧。"

  她们一边说着，一边毫无负担地笑了几声，朝着大部队聚集的篝火方向走去。那些带着微小恶意的字句，轻飘飘地散在了闷热的夜风里，连一点回音都没留下。

  拉芙希妮的笔尖悬停在了"鹤见留美"那个名字的上方。

  按照正常的流程，指导员在这个时候如果发现有学生掉队，应该立刻拿起对讲机，或者直接打着手电筒进去找人。但她的背脊依然靠在木椅上，连起身的倾向都没有。

  她把笔重新放下，目光越过那几个女孩渐渐远去的背影，直直地投向了那条依然没有动静的林间小路。

  她不去，也不去提醒其他人。

  因为在这个充斥着尖叫、规则、敷衍和微小恶意的幼稚游戏里，那个角落里的孩子现在并不孤单。

  她清楚地记得白天的分组安排。

  在这个时间点，在那条因为手电筒光线太暗而看不清落脚点的森林深处——那个拥有死鱼眼、走起路来总是微微驼背、身上仿佛带着一股发霉防腐剂味道的男生，此时正走在留美的旁边。

  在上一组小学生的尖叫声完全远去，而下一组的动静还未响起的间隙，终点这片空地迎来了一段短暂的死寂。

  就在这阵死寂里，森林深处传来了一阵笑声。

  那笑声距离很远，被繁密的树干和枝叶过滤了一遍，传到出口处时已经有些失真。但那确实是笑声。没有伴随任何说话声，没有惊叫，也没有试胆大会上那种为了掩饰恐惧而发出的干涩叫喊。

  只有笑声。

  拉芙希妮压着名单的左手稍微松了力道，原本正准备寻找下一个名字的黑色圆珠笔悬停在了半空。

  她越过那盏亮度可怜的露营灯，看向前方那片仿佛能吞噬一切的黑色树皮分界线。她不知道这阵笑声是从谁的喉咙里发出来的，也不知道在这条到处都是布置劣质陷阱的土路上，究竟发生了什么值得发笑的事情。

  那阵笑声仅仅持续了很短的时间。

  笑声停了，森林重新变回了那种仿佛什么都没发生过的安静。

  过了一会儿，有脚步声慢慢踩着枯枝靠近。

  一高一矮两个影子终于从黑暗里走了出来，进入了露营灯微弱的光晕范围内。

  是比企谷同学和留美。

  拉芙希妮坐在折叠椅上，几乎是在他们跨出森林的第一秒，就看清了他们现在的状态。

  比企谷同学看起来比白天更糟了。那件本来就劣质的宽大白袍下摆沾满了泥土，甚至有些地方还挂着几根荆棘的碎枝。他那双死鱼眼里的光彩比平时更加暗淡，肩膀以一种耗尽了某种情绪额度的弧度垮着，整个人透着一股刚经历过一场车祸般的疲惫和难堪。

  而跟在他身边的留美——她看起来更好了。

  她依然没有说话，步子也迈得很小，但那个白天在杉树下竖起来的、用书本挡住下半张脸的无形防御，消失了。那种拒绝所有视线、把全身都紧紧蜷缩起来的防备感，在这个因为某些不明原因而在森林里耽搁了这么久的女孩身上，奇迹般地卸下去了大半。

  她没有了那堵墙。

  比企谷同学没有解释他们在里面遭遇了什么，也没有提到那阵突兀的笑声。他只是保持着那种发霉防腐剂般的干瘪神态，带着留美走到了点名桌前。

  就算是一种无声的移交。

  拉芙希妮低下头，在名单的末尾找到了"鹤见留美"这四个字，用圆珠笔平稳地划下了一道横线。

  "到了。"她轻声说。

  比企谷同学没有接话。他连看都没看那张名单一眼，只是在把人带到安全地带后，直接转过身，顺着来时的反方向，朝着男生这边的宿营区走去。

  那个沾着泥土的白袍背影，在夜色里显得异常狼狈。

  拉芙希妮看着他越走越远的背影，右手腕那截尾端烧焦的旧丝带贴着手腕的皮肤，非常安静。

  他用牺牲自己形象、把自己弄得一团糟的方式，换取了那个女孩放下防备的墙。

  这种把燃烧自己去照亮他人，给别人带来的是温暖还是烧伤，到底是对是错，是高尚还是愚蠢。在这盏微弱的露营灯下，在这个充斥着潮湿泥土味的夏夜里，拉芙希妮发现自己还没有办法，给出一个确切的判断。
