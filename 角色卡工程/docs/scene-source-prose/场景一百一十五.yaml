场景: 115
幕: "第七幕·重新为奉仕部命名"
时间: "2014年6月11日 · 周三放学后"
地点: "总武高特别栋奉仕部活动室"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林、比企谷小町、川崎大志、一色彩羽"
POV: "共享场景／零POV"
正文: |
  梅雨前线的雨，从早上起就没有停过。

  特别栋的屋顶被雨脚敲出连绵不断的低鸣，老旧拉门的木框吸饱了湿气，开合时比平时沉了一截。窗外的操场泡在灰蒙蒙的水光里，白线被雨水泡得发胀，看不到半个人影。今天，所有的户外社团都收了队旗，躲进了屋檐和体育馆的阴影里。

  活动室里弥漫着纸张受潮之后特有的、软塌塌的气味。

  大志面前的桌上摊着一座小小的纸山。那是他这几天裁的抓阄用纸条，每一条都要裁成同样的宽度。他捏着剪刀的手指今天格外小心：吸了湿气的纸，比平时更容易裁歪。

  小町趴在旁边的桌沿上，用一支粉色荧光笔给裁好的纸条画记号，嘴里小声数着数，数到二十七忘了数，只好从头再数。

  结衣把今天的茶泡得格外烫。六只杯子在茶盘里冒着白汽，她用手背去试杯壁的温度，被烫得缩回手，过了一会儿，又忍不住再试一次。

  八幡的文库本摊开在膝盖上，二十分钟没有翻页。他的视线穿过雨幕，落在操场角落里那几张被淋得蔫下去的网球网上。

  拉芙希妮坐在窗边的老位置，捧着她的深蓝杯。今天的杯壁上没有水珠。她只是安静地听着屋顶的雨，左手的手指在杯壁上敲着极轻的、不成曲子的节拍。

  长桌的正中央，摊着一张B4大小的方格纸。

  雪乃坐在纸的正前方。黑色水笔搁在右手边，笔帽已经合上。

  那张纸先用直尺和铅笔打了底，再用水笔誊清，被分割成整整齐齐的三十六个格子。每一格里写着场地、时段和使用社团，右下角逐条标注着依据——登记在册的场地所属、双方的大会日程、部员人数、器材动线。最小的一行注释，字小到要凑近了才看得清。

  《体育祭筹备期间场地分配协调案》。

  这是过去七天里，这间屋子全部工作的总和。

  结衣从叶山那里问来的足球部真实训练日程，八幡"路过"网球场六次记下的实际占用时段，小町和大志整理的三年对照表，还有执行委员会那份写着"自行协调"的原始通知——所有的材料被拆开、称重、重新排列，最后变成了这三十六个格子。

  "完成了。"雪乃说。

  小町第一个凑过去，脸几乎贴到纸面上："哇……这个真的是手写的吗？"

  大志从纸条山后面探出头，看着那三十六个格子，捏着剪刀的手慢慢放回了桌上。表格最右边那一列"历年调整参照"，是他一张一张从废纸堆里找出来的东西。

  "数据没有问题。"雪乃的食指在纸的边缘轻轻点了一下，"逻辑上也不存在被拒绝的余地。足球部让出的时段，全部换算成体育馆和主操场的等价补偿；网球部的损失，精确到分钟。"

  "但是。"

  结衣捧着茶杯，声音很小。

  "叶山君看完这个以后……沉默了很久。然后他说，'让我再想想'。"她抬起眼睛，"叶山君的'让我再想想'，小雪乃知道是什么意思吧？足球部的三年级前辈们，不会签的。他们倒不是觉得吃亏——是没办法'第一个'点头。先点头的人，以后在部里就抬不起头了。"

  "网球部也一样。"八幡的视线还停在窗外的球网上，"这六天，他们就在剩下的半边场地上练习，所有的球都打在半场里，没有一个人去跟足球部吵。他们已经学会了。"他收回视线，落在膝盖上的文库本上，"学会在半场里打球的人，不会拿着一张纸去要回整个球场。因为递纸的那个人，以后就是'挑事的人'。"

  活动室里安静了几秒，只有雨声。

  "还有这个。"大志忽然开口。他把三张复印件推过来——去年、前年、还有执行委员会今年的通知，"我重新对了一遍签字栏。过去三年的调整表，让路一方的签字，每一张都有。但是占用一方的签字……"他的手指停在那几个空白的位置，"一张都没有。"

  三年的纸，第二次躺在同一张桌面上。

  "也就是说，"八幡瘫在椅子里，发出一声干瘪的笑声，"这张表没有恶人。所以它也找不到那个该挨骂的人。没有人挨骂，就没有人愿意第一个签字。"

  拉门被拉开的声音混着雨气灌了进来。

  一色彩羽站在门口，一只手收着滴水的雨伞，另一只手抱着熟悉的牛皮纸文件夹。她的刘海湿漉漉地打着绺，小腿袜的脚尖部分洇着深色的水迹，整个人像一封被雨水泡皱了的投诉信。

  "借过，借过一下。"她把雨伞靠在门边的墙上，水滴在地板上积成一小摊，"真是的，为什么每次有麻烦事，都非要走到这栋又远又漏风的特别栋来啊。这间房间的存在本身就很扭曲。"

  "你脚下的水迹，擦干再走。"雪乃头也不抬。

  "好好好——"一色拖长了声音，接过结衣慌忙递来的抹布，胡乱擦了两下，然后把文件夹往长桌上一放，正色道，"说正事。你们提交给执行委员会的那份《场地分配协调案》，今天的例会看过了。"

  她顿了顿。

  "答复是，'内容非常完善，但牵涉到各社团的历史情况，建议再作慎重研究'。"一色一字一顿地复述完，自己先摊了摊手，"翻译一下：'这么正确的表，请拿回去，我们不想成为签字的那个人'。"

  "换言之，这张表连被执行委员会拒绝的资格都没有。"雪乃的声音很平，"因为拒绝本身，也是一种决定。"

  "对啦对啦，学姐理解得很快嘛。"一色拉过一把椅子反着坐下，下巴搁在椅背上，"那人家就直说了。这张表是对的。——也正因为是对的，所以没有人签。"

  她掰下第一根手指。

  "足球部不会签。签了，就等于白纸黑字承认自己占了别人的场地。三年级的人马上就要引退了，谁愿意在最后一个月留下'我们输了'的证据？"

  第二根手指。

  "网球部不敢先签。先签的人，就是之后所有抱怨的收件箱。'都是你们去告状，关系才变僵的'——这种话，小社团的人最害怕听到了。"

  第三根手指。

  "执行委员会最不可能签。他们比谁都清楚这张表是对的。可是只要签了，明年、后年，每年都会有人拿着这张纸说'去年就是这么定的'。——人家跟你说，学校这种地方啊，大家拼命躲的不是错误的决定，是'明年还会被引用的决定'。"

  三根手指，摆在桌面那张完美的表格旁边。

  "学生啊，不会执行'正确'。"一色的声音难得没有一点甜味，"只会执行'能接受'。正确让人点头，台阶才让人签字。学姐的表负责让人点头，剩下的部分，要不要听听人家负责的这一半？"

  雪乃抬起眼睛。

  "说。"

  "第一，换名字。"一色随手从桌上的纸山里抽出一根大志裁好的抓阄纸条，翻过来，抓过大志手边的铅笔写下一行字，推过去，"不叫《场地分配协调案》，叫《体育祭特别协力时间表》。让渡这种东西，换个名字就叫协力。内容一个字都不用改，但'协力'两个字，让签字的人从'认输'变成'帮忙'。"

  拉芙希妮的手指在杯壁上停住了。

  "第二，"一色又抽出一根纸条，"给足球部的补偿时段，不要写成'等价交换'，写成'县大会应援枠'。再加上一条——雨天的时候，体育馆优先给他们用。六月的雨天值多少钱，打室外球的人最清楚。他们不是输给了网球部，是应援了学校的大会出场，还顺便拿了雨天保障。面子、里子、台阶，一次给齐。"

  "第三，网球部什么都不用做。"第三根纸条翻过来，"整张表由学生会以体育祭整体调度的名义发布，他们只需要'遵守公告'。没有人是告状者，也没有人需要第一个点头。"

  "第四——"她捏着第四根纸条，没有立刻写，"在执行委员会那头，标题下面加一行小字：'平成二十六年度体育祭筹备期间限定'。写成今年特例，不构成先例。他们要的就是这个：不是正确的答案，是'只此一次'的护身符。"

  四根裁得整整齐齐的纸条，并排摆在三十六个格子的表格旁边。

  "特例？"雪乃的眉梢动了一下，"那么明年，同一批人还要再打一次同一场仗。"

  "明年有明年的学生会呀。"一色满不在乎地说，"规则那种又大又重的东西，等出现了愿意为它负责的人，再立就好了。今年的我们，只要让今年的体育祭不要出事就可以了。"

  活动室里安静了很久。雨声从屋顶渗进来，把沉默泡得发沉。

  "把'让步'换成'贡献'，把'认输'换成'帮忙'。"拉芙希妮忽然轻声开口，像自言自语，"名字换了，里面的人就不用输了。"

  一色瞥了她一眼，难得地没有接话。

  雪乃低着头，看着自己的表格。三十六个格子，每一个都正确，每一个都没有用。

  "……执行意愿。"她开口，声音不高，"我把场地、时间、人数、依据全部换算成了变量。只有'人愿不愿意'这一项，我把它当成了只要答案正确就会自动成立的东西。"

  她顿了顿。

  "是我漏算的变量。"

  没有人接话。小町罕见地没有计分，结衣把已经凉掉的茶抱在两手之间，八幡把视线从文库本上抬了起来。

  雪乃伸出手，把那四根写满字的纸条一根一根理齐，叠在自己誊清的表格上，然后拉开抽屉，取出一枚回形针。

  "修正。"她说，"正案不动。追加施行案，以这四条为准。"

  回形针扣上去的声音很轻。

  但整间屋子都听见了。

  一色从椅子上站起来，拎起门边还在滴水的伞，拉开门，又回过头。

  "雪之下学姐。"她脸上挂着那种刚进门时的营业笑容，"表格本身，写得真的很好哦。好到让人有点生气。"

  拉门合上。走廊里的脚步声很快被雨声吃掉。

  结衣起身，开始收拾凉掉的茶杯。大志把被抽走四根的纸条山重新码齐。小町趴在桌沿上，看着那张别着回形针的表格，没有说话。

  雪乃坐在原处，隔着窗户，望着操场方向的雨。

  雨还在下。被白线分割的球场上积着水，倒映着灰色的天。今天，操场的方向没有任何哨声。
