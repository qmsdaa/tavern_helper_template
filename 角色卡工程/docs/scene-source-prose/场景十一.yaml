场景: 11
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月上旬 · 场景十的直接延续（雨停 · 蒲公英之后）"
地点: "总武高特别栋与主楼之间的开放式走道"
人物: "雪之下雪乃、拉芙希妮·都柏林（结衣与八幡在场景边缘）"
正文: |
  雪乃的手停在半空中，指节微微收紧，包装袋发出细碎的塑料摩擦声。

  拉芙希妮转过头来，目光从水洼的倒影移向身侧的人。这是一个正常的、日常的、在任何两个人之间都会发生的转向动作。

  但然后她笑了。

  不是社交场合里那种精确到毫米的弧度，不是课堂上被点名回答问题时那种礼貌而空洞的弯唇。那个笑容极淡，淡到几乎只存在于嘴角肌肉的微小位移里，淡到如果光线再暗一点就绝对不会被肉眼捕捉到。

  可它确确实实地存在了。

  那是一种从内部被什么东西轻轻推动的、不设防的笑。像是某个一直紧闭的房间里，有人不经意地推开了一扇窗。

  翡翠色的眼睛里映着彩虹残余的光，以及雪乃的倒影。

  雪之下雪乃的大脑在那一瞬间经历了一次短暂的、彻底的宕机。

  不是心跳加速这种俗套的形容可以概括的。那更像是一整片原本被理性严密管控的领地，在几秒内被某种不明力量完整地攻陷了。她的胸腔里有什么东西猛地收缩了一下，然后以一种她完全无法控制的频率开始震颤。

  那个笑容。

  她见过拉芙希妮·都柏林的很多种表情。得体的、疏离的、专注的、克制的。她见过她用完美的方式说完美的话，见过她把自己折叠成恰好能嵌进任何空间的形状。

  但她从来没有见过她笑。

  不是作为"都柏林家次女"的笑，不是作为"奉仕部成员"的笑，不是作为"交换生"的笑。

  只是——拉芙希妮的笑。

  雪乃意识到自己的手指还停在半空中，捏着那包面巾纸。她的大脑重新启动了，但启动之后的第一个指令不是"把纸巾递过去"，而是一种近乎本能的、慌乱的防御机制。

  她的右手放下面巾纸，绕到了身侧，抓住了自己垂在肩前的发辫。

  指尖沿着编好的发辫快速滑动，从发根到发梢，再从发梢回到发根。速度比平时快了一倍。

  "……你在做什么。"

  她的声音出口时带着一种不自然的僵硬，像是被砂纸打磨过的瓷器表面。

  拉芙希妮没有回答。她只是看着雪乃，那个淡到几乎不存在的笑容还停留在嘴角，像是晨雾中迟迟不散的最后一缕水汽。

  雪乃的手指在发辫上绕得更紧了。

  "这种做法一点都不成熟。"

  话语从嘴里滚出来的速度比她预想的快。她没有办法让它们停下来，就像她没有办法让刚才那个笑容从她的视网膜上消失。

  "故意淋雨，不打伞，站在屋檐下面——这不是什么浪漫的行为，这只是一种……一种非常幼稚的、缺乏判断力的、完全没有考虑后果的——"

  她的声音在某个音节上卡了一下。

  "……像个小孩一样。"

  她终于让自己的目光与拉芙希妮对上了。翡翠色的眼睛平静地、不带任何审判地看着她，像是一面过于清澈的镜子，把雪乃此刻所有的狼狈都照了个一干二净。

  雪乃的手指从发辫上松开，又重新绕上去。

  "明天感冒了也没人去看你。"

  这句话出口的瞬间，空气像是被什么东西击穿了。

  雪乃听到了自己的声音在走道里回荡。"没人去看你"——这四个字从她的喉咙里挤出来的时候，携带着一种她自己都没有预料到的重量。

  她不是在说"没有人照顾你"。

  而这句话之所以脱口而出，是因为她——

  雪之下雪乃意识到了自己在说什么。

  她的手指猛地从发辫上松开，像是被烫到了一样。编好的发辫失去束缚，轻轻弹了一下，搭回肩膀上。

  "……不是，我并不是在说——"

  "那个，总之。"

  她的视线从拉芙希妮的脸上移开，落在走道尽头那片正在消散的水汽上。彩虹已经褪色了大半，只剩下最上端的红色还勉强挂在天边。

  "我的意思是，感冒会影响复习效率，仅此而已。不要做多余的联想。"

  她的声音恢复了那种刻意的平稳，但语速比平时快了几拍。

  那包面巾纸被她重新握在手里，然后用一种近乎粗暴的动作塞进了拉芙希妮的手中。

  "擦干。"

  她转过身，发辫在空中划出一道弧线。她没有看拉芙希妮的反应，也没有等她的回答。她只是迈开步子，朝车站的方向走去，脊背挺直，步伐规律，像是在用行走的节奏来重新建立某种被打乱的秩序。

  但她没有真正迈出几步。

  她在走道中段停了下来，背对着所有人，面朝着一堵被雨水冲刷过的、正在缓缓风干的水泥墙。

  她的右手又绕上了发辫。

  这一次，她的指尖在发梢处停留了很久，久到结衣在远处喊了一声"小雪乃？"，她也没有回应。

  她只是在想。

  刚才那个笑容。
