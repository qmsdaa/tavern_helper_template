场景: 59
幕: "第三幕·二学期"
时间: "2013年12月24日 · 平安夜晚上 · 舞台剧公演结束后"
地点: "总武高体育馆外 → 前往家庭餐厅的步道 → 萨莉亚家庭餐厅"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
正文: |
  前往附近那家连锁的萨莉亚家庭餐厅的步道上，由比滨结衣正走在最前面，借着刚结束了繁重舞台剧的兴奋劲，叽叽喳喳地向比企谷八幡推销着举办圣诞派对的提议。

  雪之下雪乃走在稍后一点的位置，肩旁并排着拉芙希妮。冬日傍晚的冷风吹过，雪乃将藏在制服大衣里的手向深处缩了缩。她微微偏过头，看着身旁这个刚刚在后台用极度冒犯的糖分和犀利的言辞把局面搅得天翻地覆的转校生，那种试图用逻辑去厘清对方行为模式的习惯又一次占了上风。

  "可以问你一个问题吗？"雪乃压低了声音，用一种试图剥离掉刚才那点尴尬的平稳语调开口。

  拉芙希妮转过头，翡翠色的眼睛在路灯的微光下显得尤为平静。她点了点头，那干燥的嗓音里听不出一丝起伏："可以哦。"

  她停顿了半拍，接着补上了下半句："但是，你已经问完了。"

  雪乃的脚步微不可察地慢了半拍。她那颗已经习惯了在复杂句型和严密论证中寻找破绽的大脑，在那一瞬间显然没能适应这种堪称无赖的极简反击。

  为了维持谈话的主导权，雪乃决定用增加筹码的方式来打破这种诡异的封锁。"那么，我可以问你两个问题吗？"

  "可以哦。"拉芙希妮依然保持着那种得体的、甚至可以说是顺从的态度，回答道，"现在是两个问题了。"

  一种略微不妙的预感开始在雪乃那引以为傲的逻辑防线上蔓延，但对于"正确"的追求让她拒绝在这个连议题都还没抛出的交锋中退让。

  "我可以问你四个问题吗？"她微微蹙起眉，语气中带上了一丝警告的意味。

  这一次，拉芙希妮的嘴角终于泛起了非常微小、但绝对不容错认的弧度。

  "可以哦。"她看着雪乃，声音轻柔得像是在陈述一个既定的自然规律，"但是，你已经问完了。"

  "哈？"

  雪乃这声疑问几乎是脱口而出，甚至比刚才在后台被比企谷反击时还要来得错愕。她停下了脚步，那双深蓝色的眼眸因为荒谬感而微微放大。

  "我什么时候问完的？"她试图用质问来拆解对方的诡辩，但话刚出口，她就意识到了不对劲。

  拉芙希妮停下脚步，转过身面对着她，那抹微小的弧度扩散成了一个带着隐秘腹黑感的平静笑容。

  "就在现在。"

  推开那家家庭餐厅厚重的玻璃门，充足的暖气瞬间将十二月底傍晚的寒意阻挡在外。空气里混杂着廉价芝士、番茄酱和现磨咖啡豆的气味。

  由比滨结衣熟门熟路地挑了一个靠里的四人卡座，刚一落座就把菜单摊开，兴致勃勃地开始对比各款披萨和焗饭的热量。

  雪之下雪乃脱下深蓝色的制服大衣，将其整齐地叠好放在身侧，随后在结衣对面坐下。就在拉芙希妮·都柏林在她身旁落座的第二秒，桌布下发生了一场极为隐秘的权力交接。

  没有任何预警，甚至连肩膀晃动的幅度都没有，雪乃一只套着黑色过膝袜的制式皮鞋，非常自然地跨过了中线，准确无误地压在了拉芙希妮的脚面上。

  与其说是"踩"，那力道更像是一种别扭的停放。雪乃甚至没有施加太多重量，只是让皮鞋的边缘抵着对方的鞋面，然后端庄地拿起了自己面前的饮品单。她微垂着眼睑，那张精致清冷的侧脸在餐厅暖黄的灯光下看不出一丝破绽，仿佛正在认真思索该点大吉岭还是伯爵红茶。

  但桌底下的那只脚，就像是带着某种气结的执念，固执地长在了那里。既然在语义逻辑上被那套无赖的话术逼到了死角，这位习惯了掌控全局的冰之女王，最终选择了退化到用最原始的物理占领来进行报复。

  拉芙希妮甚至连眉头都没有皱一下。

  她清晰地感受到了脚背上传来的那一点微小的压迫感。按照都柏林家族那套关于距离与防备的严苛礼仪，这无疑是一种对私人领域的严重侵犯。但此刻，翡翠色的眼睛里却慢慢浮起了一层连她自己都没察觉到的温度。

  她没有将脚抽走，甚至连腿部肌肉的抗拒都没有。相反，她配合着雪乃的动作，将那杯免费提供的白水拉到自己面前，目光看似落在水杯的倒影上，实则是在用余光欣赏身旁某人那还在试图掩盖耳根余红的紧绷侧脸。

  隔着一张窄小的餐桌，比企谷八幡的死鱼眼在对面两人之间无声地扫了一个来回。

  从在路上那个没头没脑的"问题额度消耗战"开始，一直到现在落座，这两人之间那种噼里啪啦、带着静电感的诡异张力，简直要把周围的空气都给抽干了。特别是那个平时张口闭口"正确逻辑"的雪之下，现在虽然端着架子看菜单，但那副好像在跟什么看不见的敌人较劲的模样，实在太过于缺乏掩饰。

  八幡放弃了研究菜单上那些打折的意面，将手里的塑料水杯有些重地放在了桌上。

  "我说，"他用那种干瘪得像是一张揉皱的废纸般的嗓音开口，"你们还要把刚才在路上那种连小学生都骗不过去的、极度弱智的文字游戏遗留情绪带到餐桌上多久？这边的空气已经黏稠到连芝士糊都拌不开了。"

  八幡那句干瘪的吐槽刚一落地，原本还在这张小方桌上勉强维持的平静表象瞬间出现了一丝裂痕。

  雪之下雪乃原本垂在菜单上的视线缓缓抬起。那双深蓝色的眼眸里，平时总是结着的那层冰霜此刻仿佛被某人用粗暴的方式敲碎了，取而代之的是一种被戳穿后急于掩盖的冷厉。

  与她冰冷眼神同步进行的，是桌布下方那极为隐秘的动作。穿着制式皮鞋的脚不再仅仅是"停放"，鞋缘微微下压，力道比刚才重了几分——一半是对那个在一旁看戏的死鱼眼的惩罚，一半是借此平复自己被看穿的慌乱。

  "比企谷同学，"雪乃的声音像是由碎冰重新凝结而成，听不出一丝温度，"如果你那堪忧的沟通能力已经退化到只能用'弱智'这种词汇来形容你无法理解的对话逻辑，那我建议你把那张本来就不讨喜的嘴闭上。毕竟，没有人指望你能从这种单细胞生物的视角里看出什么有价值的东西。"

  她用连珠炮般刻薄的话语轻而易举地将八幡试图夺取的话语权碾成了粉末。在确认那个长着死鱼眼的家伙只能重新拿起水杯掩饰语塞后，雪乃才微微转过头，将视线重新投向了坐在身旁的拉芙希妮。

  那只压在对方脚背上的脚依然没有挪开，反而成了某种维持气势的实体锚点。

  "既然那个总是喜欢制造噪音的变量已经被排除了，那么，我们可以回到十分钟前那个被打断的话题了。"

  雪乃微微扬起下巴，语调恢复了平时那种具有压迫感的平稳，但如果仔细分辨，还是能听出里面藏着一丝不甘示弱的防备。

  "都柏林同学，你最近变化很大，这是好事。"她的目光锁定着拉芙希妮那双翡翠色的眼睛，不再绕圈子，"但是可不可以请你解释一下，你最近似乎对我产生了一种完全超出必要限度的……观察兴趣。甚至可以说是某种带有恶作剧性质的试探。这种明显违背你平时那套'生存法则'的行为，是出于什么缺乏逻辑的动机吗？"

  面对雪乃这种试图用冰冷的社交界限重新夺回主动权的生硬质问，拉芙希妮并没有像以前那样，因为被触及"生存法则"或"动机"这种敏感词汇而显露出防御姿态。

  相反，她迎着雪乃那看似冷厉实则透着色厉内荏的目光，非常无辜地眨了眨那双翡翠色的眼睛。

  "……逻辑？"

  拉芙希妮微微歪了一下头，那原本因为长期压抑而总是显得苍白的脸颊上，此刻带着一种恰到好处的困惑感。她的声音依然干燥，但语速放慢了一些，像是在认真咀嚼这个词汇的含义。

  "我想，雪乃同学可能是误会了什么。我并没有在进行什么带有恶作剧性质的试探。"她顿了顿，将搭在水杯边缘的指尖轻轻收回，语气平坦得像是在讨论今天的天气，"我只是觉得，既然是在这种充满着番茄酱和现烤芝士味道的地方……那些过于高深的理论和逻辑，理解起来实在是有些困难呢。"

  这个软钉子递得可谓是滴水不漏。她不仅全盘否定了雪乃预设的前提，甚至还借用了周围的环境，以一种温和的方式暗示了雪乃那些长篇大论的"不合时宜"。

  雪乃搭在菜单边缘的手指微不可察地僵硬了一下。

  她看着拉芙希妮正用一种"我是无辜的"眼神看着她，而她自己，还维持着在桌子底下用脚踩着人家的缺乏风度的姿势。

  那种被憋在胸口的挫败感，让雪乃下意识地咬住了下唇，想要别开视线却又觉得这样等于示弱，只能强撑着那层正在逐渐剥落的冰冷外壳与拉芙希妮对视。

  "啊！决定了！"

  就在这股即将演变成单方面生闷气的诡异张力即将达到顶峰时，由比滨结衣那清脆且元气满满的声音像一把毫无滞涩感的剪刀，直接将这团黏稠的空气剪得粉碎。

  她将那本印满了高饱和度食物图片的菜单"啪"地一声拍在了四人中间的小方桌上，眼睛里闪烁着某种对高热量食物的狂热。

  "既然是圣诞前夕的慰劳会！那就点这个吧——限定版超级芝士熔岩双拼披萨！还有这个超大份的明太子烤焗饭！小雪乃觉得呢？"

  被突然从菜单后探出头的结衣锁定，雪乃甚至还没来得及将桌子底下的脚收回来。
