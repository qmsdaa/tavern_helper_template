场景: 140
幕: "第十幕·冬去春来"
时间: "2015年2月13日 · 周五"
地点: "由比滨家（客厅·晚饭后）"
人物: "由比滨结衣、由比滨母亲"
POV: "共享场景／零POV（结衣侧重）"
正文: |
  二月十三日，晚上七点半。结衣家客厅的暖桌还开着。

  碗已经收了。母亲把围裙解下来搭在椅背上，在暖桌另一侧坐下。父亲今晚加班，桌上三副碗筷只用了两副。电视开着，音量调到刚能听见的程度。

  "妈。"

  "嗯？"

  "你还记得我说想学儿童发展吗。"

  母亲把手里的橘子放下来。"记得。你说小孩子怎么吃怎么睡怎么教怎么陪——差不多这些。"

  "那是小町问的时候说的。不是正经回答。"

  "那正经回答呢。"

  结衣把腿收进暖桌被子里，下巴搁在桌面上。

  "今天有人找我帮忙做毕业相册。F班的。"

  "相册怎么了？"

  "委员会选的照片，把很多人裁出去了。"

  母亲剥橘子的动作慢了下来。"所以呢。"

  "所以我说，不能替别人决定谁值得被记住。让每个人自己选。"

  "然后呢。"

  "然后就接下了。全班三十七个人，每个人交一张——照片、一句话，什么都好。我负责把它们放进二十页纸里。"

  "很大的工作量。"

  "小雪乃也这么说。"结衣翻了个身，"但是接下的时候，我没想过工作量。就是觉得——这件事必须有人做。委员会选照片的人和被裁出照片的人，是同一种人——都是高中生。只是有人习惯了站在中间，有人习惯了站在边上。"

  母亲把橘子掰成两半，一半递给结衣。

  "你小时候也是站在边上的那个。"

  "嗯。"结衣接过橘子，"现在有时候还是。但站在边上的人，看得到中间的人看不到的东西。"

  母亲等了一会儿。

  "所以儿童发展。"

  "嗯。今天的事，让我想通了一件事。"结衣坐直了一点，"我不想替任何人决定什么是好的。小孩子也好，朋友也好。但我想学会——怎么让每个人有办法替自己说出来。不是替他们说，是把他们够不到的说话的东西递过去。"

  "你这些朋友，今天也在吗？"

  "放学后我在活动室一个人整理到六点。小企说'先别把自己累死'——他的关心永远用这种句子——小雪乃说需要系统化的收件方法，拉芙希妮说每个人交上来的东西格式不一样才正常。"

  "你这些朋友，说话都好有风格。"

  "对吧。"结衣笑了，然后又收住。"妈。我不是因为喜欢的人才选这个方向的。"

  "我知道。"母亲说。

  "我是因为我自己。在奉仕部这两年多，我一直是负责'气氛'的那个人——谁的杯子空了，谁的话被盖过去了，谁在笑底下是难过的。这些别人可能注意不到，但我就是会注意到。以前我以为这是没用的东西，只是'比较会看人脸色'。现在不这么想了。"

  母亲把另一瓣橘子放进嘴里。

  "你觉得这是有用的。"

  "嗯。不是拿来讨好人的那种。是拿来让每个人没有被漏掉的那种。"

  母亲看着她。电视里在播天气预报——明天千叶晴，北风转弱，适合晒被子。

  "你爸昨天问我，结衣以后要做什么。我说不知道，她还在想。"

  "现在可以说了。"结衣说，"儿童发展。或者学前教育。还没有完全决定哪一个，但方向是那里。"

  "大学呢。"

  "和大方向相关的私立。和大家的学校不一样——没有一个人和我的升学路径完全重叠。这个是事实，我今天接受了。"

  母亲把最后一瓣橘子递过来。结衣接住。

  "那你告诉了那些人了吗。"

  "明天。"她说，"明天活动室说。今天只想先跟你说。"

  "为什么。"

  "因为你是第一个教会我'不要替别人决定'的人。"结衣说，"虽然你用的不是这句话。你教我的方式是——从来没有替我决定过。"

  母亲放下橘子皮，抽了一张纸巾擦手。动作不快。

  "结衣。"

  "嗯？"

  "你刚才说的那个——把每个人够不到的说话的东西递过去。那个叫什么，在你的专业里。"

  结衣想了很久。

  "可能叫'观察'。也可能叫'陪伴'。具体名词要进了大学才知道。"

  "那就去学。"母亲说，"学会了，回来说给我听。我也想知道那个叫什么。"

  电视里天气预报结束了。画面变成明天的花粉情报。结衣把暖桌的被子拉上来一点，盖住膝盖。

  "妈。明天的便当，可以多做一个布丁吗。我带去活动室。"

  "几个人的。"

  "六个人的。小町和大志也有。"

  母亲站起来，朝厨房走了两步，又回头。

  "布丁，一人一个。你自己那份，多加一颗草莓。"

  "为什么。"

  "因为今天你替全班做了决定。那个决定本身，值得一颗草莓。"
