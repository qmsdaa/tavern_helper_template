场景: 18
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月下旬 · 林间学校第一天傍晚至夜晚"
地点: "千叶村青少年中心 · 拉芙与雪乃的和室"
人物: "拉芙希妮·都柏林、雪之下雪乃"
POV: "拉芙（自由间接引语）"
正文: |
  领到钥匙，拉开纸门的那一刻，木质的滑轨发出一声稍微干涩的钝响。

  这是千叶村青少年中心最普通不过的一间和室。榻榻米散发着一种陈旧但干燥的灯心草气味，天花板上是款式最老旧的吸顶灯。

  拉芙希妮站在玄关处，在那几秒钟里，她的视线本能地、像是一台冰冷的扫描仪一样，扫过了房间的四个顶角，以及窗前可能存在死角的区域。

  什么也没有。

  当确认了这个事实的时候，拉芙希妮听见自己长长地、近乎贪婪地呼出了一口气。那原本因为长途颠簸，也因为习惯性的防备而紧紧绷着的肩膀，非常缓慢地，一点点松了下来。

  "先整理一下吧。"

  雪之下雪乃的声音在旁边响起，依然是那种公事公办的冷淡语调，但奇妙地没有让拉芙希妮感到压迫。她把那个看起来过于专业的黑色旅行袋放在靠窗的那侧，拉开拉链，有条不紊地将换洗衣物和洗漱用品拿出来。

  拉芙希妮点了点头，走到靠墙的那一侧，打开了自己的包。房间里只有衣物摩擦的声音和拉链的轻响。没有交谈，不需要汇报行程，甚至不需要去猜测对方此刻的心情。

  这种毫无意义、却又只属于她们自己的整理动作，竟然让拉芙希妮觉得比任何一首诗歌都让人安心。

  夜晚降临，熄灯的时间到了。

  在这个彻底断绝了外部信号的深山里，黑暗来得比城市里更加浓稠。窗外的树影被夜风吹动，像是在玻璃上摩挲的巨大笔触。

  拉芙希妮平躺在榻榻米上，盖着并不算柔软的被子。右手腕上的旧丝带触碰着被单，这本来是她在每个无法安眠的夜晚唯一的锚点。

  但她并没有立刻睡着。

  在离她不到一米远的另一张铺位上，传来了轻微、却又十分规律的声音。

  那是雪之下雪乃的呼吸声。

  平稳，绵长，没有任何多余的起伏，就像她平时整理那些资料时一样精准。但在这片纯粹的黑暗里，这种带有属于人类体温的规律声响，一点点在这个略显空旷的和室里蔓延开来。

  拉芙希妮没有动。她甚至放轻了自己的呼吸，怕打扰到那份规律。

  这种感觉并不是第一次出现。在她还很小，还在那个会因为打雷而钻进别人被窝的年纪里，也许她也曾体会过。但那真的、真的是太久太久以前的事情了。但那也许是不久以前，某人还会在宴会上不惜弄脏裙子也要为她偷藏甜点。拉芙希妮已经分辨不出火的温度了。她已经忘记了那到底是真实发生过的，还是她在无数个失眠的夜晚里，从那些干瘪的文字里幻想出来的。

  但现在，它确确实实就在她耳边。

  拉芙希妮已经厌倦了那种每走一步都要剖析利弊、每说一句话都要衡量后果的疲惫。在这个没有信号的夜晚，在这个只有呼吸声的房间里，她决定允许自己彻底放弃思考。

  她闭上眼睛，不再去抚摸那条旧丝带。
