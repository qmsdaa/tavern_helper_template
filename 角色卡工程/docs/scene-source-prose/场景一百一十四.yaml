场景: 114
幕: "第七幕·重新为奉仕部命名"
时间: "2014年6月4日 · 周三放学后"
地点: "总武高特别栋奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、比企谷小町、川崎大志、一色彩羽、户冢彩加"
POV: "共享场景／零POV"
正文: |
  窗外的蝉鸣声已经开始有了初夏的焦躁感。

  特别栋的空气里浮动着一股闷热的尘土味，被活动室那扇老旧拉门隔绝在外面。自从五月底那两张代表新部员身份的入部申请书盖上印章后，长桌边的生态就发生了偏移。

  大志正襟危坐在靠近门边的角落里，手里攥着一沓从旧学生会档案里翻出来的废弃表格，正试图用剪刀把上面还能用的订书钉一个个拆下来。小町则趴在结衣的椅子靠背上，两个人凑在一起对着手机屏幕上某家新开的薄饼店照片指指点点。

  拉芙希妮坐在雪乃旁边，手里端着一杯已经不再冒热气的冷泡麦茶，视线安静地停留在杯壁凝结的细密水珠上。雪乃正在翻阅一本封面素净的文库本，纸页翻动的声音在这片混杂着女生笑闹和拆钉子的背景音里，显得异常清晰。

  只有瘫在斜对角的八幡，正以随时准备圆寂的姿态，盯着天花板发呆。

  "哗啦——"

  木质拉门被一股不属于这间屋子的急躁力量猛地拽开，滑轨发出一声刺耳的摩擦音。

  "前——辈——"

  伴随着这声拖着长长尾音、甜腻到几乎能在空气里拉出丝来的呼唤，一个亚麻色短发的身影跌跌撞撞地扑了进来。一色彩羽手里抱着几乎要挡住她视线的厚重牛皮纸文件夹，脚下的黑色小腿袜在木地板上蹭出急促的响声，直奔八幡所在的角落。

  "嘭"的一声闷响，那一大摞文件被毫不客气地砸在了八幡面前的桌面上。一色双手撑着桌沿，上身大幅度前倾，原本就短的校服裙摆往上缩了一截，她抬起眼睛，视线自下而上地捕捉住八幡的瞳孔。

  "不行了，人家真的要死掉了。体育祭的人事调度根本就推行不下去嘛，前辈你如果不帮忙的话，总武高的历史就要在这一届学生会手里断绝了哦？"她的声音里恰到好处地带上了三分委屈和七分依赖，眼角甚至还努力挤出了一点不知真假的湿润。

  八幡的死鱼眼连转都没转一下，只是把身体往椅背深处缩了缩，试图拉开物理距离。

  没等八幡开口抛出那套烂熟于心的拒绝说辞，趴在结衣背上的小町突然直起了身子。

  "哇哦。"小町眨了眨那双和八幡如出一辙但灵动得多的眼睛，嘴角咧开一个灿烂的弧度，"这就是传说中的一色学姐吗？这种打击单身阴沉男的撒娇方式，简直是教科书级别的。哥哥，你现在心跳加速了吗？"

  一色前倾的身体微微一僵。她转过头，视线在小町那张写满"看戏"的脸上停顿了半秒。那种属于狐狸的雷达瞬间捕捉到了同类的气息。

  "啊呀，这位就是比企谷前辈的妹妹吧？早就听说了呢，真是个可爱的好孩子。"一色的脸上立刻重新挂上毫无破绽的甜美笑容，甚至还附赠了一个轻微的歪头杀。

  "谢谢学姐夸奖。"小町笑眯眯地接下了这句话，然后立刻转过头看向八幡，"但是哥哥，就算被可爱的学姐这样拜托，直接把麻烦的脏活接下来的话，小町分数不仅会扣光，还会变成负两百分哦。这是会对家庭地位产生毁灭性打击的数字呢。"

  八幡的喉咙里发出了一声类似漏气风箱的叹息："我什么时候说过要接了？再说了，你的分数体系到底满分是多少我都不知道。"

  "而且，"小町完全没理会八幡的反抗，直接看向桌上那堆文件，"如果小町没看错的话，最上面那张红色的表格，是三年级和二年级现场执行组的排班申请吧？"

  一色的笑容终于出现了细微的裂痕。她原本撑在桌子上的手指不自觉地蜷缩了一下。

  一直坐在门边像个隐形人一样的大志，这时候十分不合时宜地举起了手里的一张旧纸。

  "那个……"大志的声音因为紧张而有些发飘，"如果说的是现场执行组排班的话，根据去年的记录，二年级F班因为……因为某些之前遗留的人际关系问题，是重灾区。很容易因为场地分配得罪人。"他谨慎地略过了相模和自己姐姐曾经的那点摩擦，"一色学姐是怕强制排班会被高年级记恨，所以才想把这张表塞过来吗？"

  活动室里的空气瞬间凝固了两秒。

  结衣尴尬地笑了两声："啊哈哈……大志同学，有时候太直接也是会出问题的哦……"

  一色的脸色迅速变幻了几次，深吸了一口气，再次转回八幡那边："所以说嘛！人家只是二年级，怎么可能去指挥那些三年级的前辈和二年级里脾气不好的家伙啊！而且之前的相模学姐她们那一群人……关系乱七八糟的。前辈，你一定有那种既不会得罪人又能把他们安排得服服帖帖的阴暗算计吧？"

  "别把'阴暗算计'这种词当成夸奖说出来。"八幡揉了揉眉心，"我确实有办法。只要把那些最累、最容易挨骂、最需要跑腿的活儿，全都打乱了分派，然后告诉他们这是系统随机摇号的结果就行了。至于得罪人……"

  "比企谷同学。"

  雪乃的声音打断了八幡即将出口的自毁式预案。她轻轻合上文库本，动作优雅得没有发出噪音。

  "虽然我一直对你那套充斥着妥协和自我牺牲的逻辑抱有不认同。"雪乃的目光冷冷地越过长桌，落在一色身上，"但这不代表，我允许有人把自己的社交危机，包装成求助的糖衣炮弹，扔进这个房间里。"

  一色的身体彻底站直了。她收起了那种黏糊糊的学妹声线，眼神变得锐利起来。

  "这算不上糖衣炮弹吧，雪之下学姐。"一色整理了一下领口，"我只是在作为学生会长，合理利用社团资源而已。"

  "把怕被高年级孤立的恐惧感，转嫁给本来就在社交圈边缘的奉仕部，这种行为在这个房间里，被定义为'逃避'。"雪乃端起茶杯，不再看她。

  就在一色准备进行下一轮反击的时候，一阵玻璃杯和木桌面碰撞的清脆声响了起来。

  拉芙希妮放下了手里的冷泡麦茶。

  "那个。"她轻声开口，带着那种永远不会显得失礼的温和语调，"如果一色同学只是担心被高年级的前辈讨厌的话，其实不必把整份排班表都推给比企谷同学去'随机摇号'。"

  她从桌上那堆小山一样的文件里，抽出了一张附带着去年场地规划图的表格。

  "我刚才听大志同学说，最大的冲突在于场地分配的'好坏'。那么，如果在排班表发布之前，"拉芙希妮把那张图表推到了一色面前，浅金色的发丝在阳光下闪着微光，"由学生会出面，以'为了避免偏袒'的名义，邀请各班的体育委员或者代表，在大会议室进行公开的抓阄呢？并且在抓阄纸条上提前印好需要负责的杂务种类。"

  一色愣住了。

  "这样一来，"拉芙希妮的语气依然不疾不徐，"所有的'坏签'和'脏活'，都是各班代表自己抽中的。一色同学作为会长，只是提供了一个公平的平台。不仅不需要得罪任何人，还能获得一个'公正且尊重前辈'的好名声。"

  整个活动室再次安静下来。

  小町的眼睛亮晶晶的，看着拉芙希妮的眼神里充满了"学到了"的兴奋。

  大志在角落里默默地点了点头，表示这个操作在逻辑上完全可行。

  八幡看了看那张被推回去的表格，又看了看拉芙希妮那张平静的侧脸，后颈甚至感觉到了一点久违的凉意。把责任彻底打散，用程序的"公平"去堵住所有的抱怨，让那些想要抱怨的人连发泄的对象都找不到。这比他那种把自己填进去当沙包的做法，不知道要恶毒……不对，是高明多少倍。

  最关键的是，这个方案里，一色什么都不用做，但她也休想把任何实质性的工作推给奉仕部。奉仕部只提供了一个"点子"。

  一色盯着那张纸看了好一会儿。

  然后，她抬起头，脸上再次绽放出那种毫无破绽的、甚至比刚进门时还要灿烂的笑容。

  "拉芙希妮学姐。"一色双手合十，放在胸前，"难道说，你刚才那是在试图用非常温柔的方式拒绝我，并且让我自己去收拾烂摊子吗？对不起，虽然你的提议非常完美，而且也保全了人家的面子，但仔细想想，我们果然还是不可能！"

  "……这发卡的触发条件是不是越来越宽泛了？"八幡忍不住吐槽。

  拉芙希妮眨了眨眼睛，似乎对这种突然的被"拒绝"有些不知所措。

  "没关系的。"她轻声说，然后把目光移回了自己的茶杯，"如果不麻烦的话，抓阄用的纸条，大志同学可以帮忙裁一下。"

  大志在角落里立刻应声："好的，交给我吧！"

  一色气呼呼地重新抱起那堆文件，一边转身一边小声嘟囔："这里的配置真是越来越扭曲了……"

  拉门在滑轨上摩擦的声音还残留在空气里，一色彩羽那种带着甜腻香精味的气息刚刚散去。

  八幡瘫在椅子上，长长地呼出一口气，像一滩失去水分的烂泥。小町正准备开口用刚才的"小町分数"继续刺他两句，门外走廊的木地板上又传来了一阵轻巧规律的脚步声。

  "哗啦——"

  刚被合上的门又一次被拉开。

  下午的阳光斜斜地切进室内，把穿着蓝白色网球部运动服的身影在原木地板上拉得修长。灰色的短发被汗水微微濡湿，贴在白皙的额头上。户冢彩加站在门边，胸口轻微起伏着，手里还虚握着一个用旧的毛巾。

  刚才还像是一具尸体般的八幡，背脊突然绷得笔直，整个人以违背人体力学的速度从椅子上弹了起来。那双平时总是半耷拉着的死鱼眼里，此刻竟迸射出了堪称神圣的光芒。

  结衣正在拆一包新的薯片，手指停在半空。

  "那个……"户冢的声音很轻，带着点跑动后的微喘，"打扰了。八幡……在不在这里。"

  "在。"

  八幡的回答快得连他自己都没来得及踩刹车。等回过神来，他已经站在长桌旁边，腰背挺直得可以直接拉去参加开学典礼。

  "看到了吗结衣姐。"小町用手肘捅了捅结衣的侧腹，音量控制在刚好全屋都能听见的程度，"医学奇迹。"

  "吵死了。"

  户冢抱着毛巾走进活动室，脚步放得极轻。

  "打扰了……由比滨同学也在。啊，雪之下同学，还有……"他的视线在那几张后辈的面孔上停顿了一下，最后落回八幡身上，终于找到了落脚点，"其实，是网球部的事。本来想明天在班里再跟你说的，但是部长说，还是尽快比较好。"

  结衣放下薯片，起身从茶柜旁拿出一个一次性纸杯，倒了麦茶递过去。户冢双手接过，指尖在杯壁上收紧了一圈。

  "谢谢。"他捧着杯子，没有喝，"那个……我说得可能不太清楚。网球部的场地，快要没有了。"

  活动室里安静了一瞬。

  "网球场应该一直登记在网球部名下。"雪乃把文库本放到了一边。

  "嗯。但是从上星期开始，足球部把体能训练搬到了我们旁边的空地上，后来渐渐地……就直接占用半边球场做折返跑了。我们去问，对方说第一操场被体育祭的年级练习征用，他们没有地方去。"户冢的声音一点点低下去，"然后前天，体育祭执行委员会发了这个。"

  他从运动服口袋里掏出一张对折了两次的复印纸，小心地摊平在桌面上。纸的边角已经被捏出了毛边。

  《体育祭筹备期间校内场地使用临时调整》。

  "网球场从下周起要划出三分之一，作为器材堆放和帐篷搭建的预留地，一直到体育祭结束。"户冢的拇指按在纸面最下面一行小字上，"这里写着——'涉及场地变更的各部，请自行协调'。"

  "自行协调。"八幡盯着那行字，死鱼眼里刚燃起的那点神圣光芒正在以肉眼可见的速度熄灭，"翻译过来就是'我们不想得罪足球部，你们自己看着办'。"

  "足球部那边，叶山君在吧？"结衣小心翼翼地插话，"好好跟他说的话，他说不定能……"

  "叶山君帮我们说过了。"户冢摇了摇头，第一次露出一点近乎苦笑的表情，"但这不是叶山君一个人能决定的事。足球部的三年级生说，地区大会就在眼前，主操场被占，借用网球场是无奈之举。而我们网球部的县大会，就在同一个周末。对三年级的我们来说，那是最后一次了。"

  活动室里再次安静下来。

  谁都听得出来，这不是哪一方在作恶。两边都站在自己的道理上，两边的道理都货真价实。

  "小町有一个问题。"小町趴在椅背上举起手，"为什么足球部说要用，就能用呀？网球场不是网球部的吗？"

  没有人立刻回答。

  门边的角落里传来一阵翻动纸张的窸窣声。大志从那堆等着拆钉子的旧表格里抽出两张边缘发黄的复印件，两只手捧着送了过来。

  "这是去年和前年的。"大志的声音依旧发飘，指尖却落得很稳，"《体育祭场地临时调整》。去年是棒球部让出了半场，前年是田径部的投掷练习区被划走，理由栏写的都是'年级练习征用'。然后这里，"他指着去年的协调结果栏，"'由让出场地的社团优先使用器材室'。签字的人，每年都不一样。"

  三年的纸，并排躺在同一张桌面上。

  让出场地的社团每年都在换名字。但从来轮不到足球部这样的大社团，出现在"让出"那一栏里。

  "也就是说。"拉芙希妮的视线在那三张纸上缓缓移动，声音很轻，"这所学校每一年都在解决同一个问题，只是从来没有把答案写下来过。"

  她抬起眼睛。

  "权利没有写进任何一张表格的地方，义务就会自动落到最不会拒绝的人身上。网球部今年遇到的不是冲突，是惯例。"

  雪乃伸手把那张执行委员会的通知拉到自己面前，从头到尾又读了一遍。然后她起身，从文件柜里取出委托记录簿，翻开了新的一页。

  "比企谷同学，你刚才说，执行委员会不想得罪足球部。"她拿起水笔，"不对。他们不是不想得罪谁，是不想'决定'。一旦做出决定，就必须回答一个问题——这所学校里，到底谁的优先级更高。这个问题从没有人回答过，所以每一届都把它推给'自行协调'四个字。"

  笔尖落纸。

  "奉仕部受理这项委托。"她一字一句地写，"委托内容：不是替网球部把场地抢回来，而是做出一份执行委员会无法再用'自行协调'推开的、可以写进正式调整表的场地分配方案。"

  "诶……？"户冢抬起头。

  "抢回来的场地，明年还会被同样的方式拿走。"雪乃合上笔帽，"把分配的依据写成白纸黑字，从今以后，任何一个社团都不需要靠嗓门大小决定自己能不能练习。"

  "好帅……"小町的眼睛亮了起来，随即捂住嘴，"不对，这种时候是不是应该鼓掌？"

  户冢怔了几秒，忽然想起了什么似的，把手里那杯一直没动的麦茶一口气喝完，然后对着长桌深深鞠了一躬。

  "拜托大家了。"

  八幡挥手的弧度大得超过必要限度，被小町在身后记了一笔"负三百分，理由：挥手太用力"。

  拉门合上之后，雪乃的目光扫过长桌。

  "由比滨同学，叶山同学那边能拜托你吗？不需要他表态，只要足球部真实的训练安排。"

  "嗯！包在我身上！"

  "比企谷同学。"

  "知道。放学后我正好路过网球场，确认实际占用情况。"八幡瘫回椅子上，顿了顿又补了一句，"只是路过。"

  "小町和大志同学，把这三年的调整记录整理成对照表——每一次让路的社团、理由、补偿、签字人。"雪乃依次分派完，视线落在拉芙希妮身上，停了一瞬。

  拉芙希妮没有要领任务的意思。她只是伸出手，把桌上那三张不同年份的纸对齐，叠成了整齐的一摞。

  雪乃收回了视线，没有说什么。

  窗外的蝉鸣还在一阵一阵地涨。操场的方向隐约传来哨声和球鞋摩擦地面的声响，隔着半个校园，听不出属于哪个社团。

  水笔的笔尖重新落在记录簿上。

  在"委托内容"那一栏的末尾，雪乃画下了第一条横线。
