场景: 81
幕: "第五幕·PTA→舞会"
时间: "2014年2月24日 · 周一 · 晚"
地点: "千叶市美滨区 · 雪之下雪乃公寓"
人物: "雪之下雪乃（独角戏 · + 潘先生 + 提及：拉芙希妮、比企谷八幡、由比滨结衣、雪之下母、雪之下阳乃）"
正文: |
  "沙。"

  笔尖在A4纸上划过最后一道横线，雪乃停下了动作。

  她把那几张重新梳理过执行步骤的草稿纸，和那份带有红色批注的预算表叠在一起。指尖沿着纸张的边缘仔仔细细地对齐、磕平，然后将它们平整地塞进透明的文件袋里。

  她站起身，拎起书包，把文件袋放进了书包最里层的夹层中，拉上拉链。

  金属拉链咬合的声音在空旷的房间里回荡了一声，宣告着今天属于"奉仕部部长"的时间彻底结束。

  雪乃站在书桌前，长长地吸了一口气，肺部被公寓里发闷的空气填满。她闭上眼睛，视野里一片漆黑。

  距离周末，还有四天。

  在这片人为制造的黑暗里，那张属于本邸的、宽大且冰冷的餐桌，浮现了出来。

  她睁开眼睛，视线穿过客厅，落在了沙发角落里的那个身影上。

  穿着粗花呢风衣、戴着猎鹿帽的福尔摩斯版潘先生，正安静地靠在抱枕旁边。在它毛茸茸的双臂之间，牢牢地卡着一个深色的方形盒子。盒子上那根暗红色的丝带，在顶灯的照射下泛着微弱的光。

  那是情人节那天清晨，拉芙希妮在千叶站检票口外硬塞给她的东西。

  直到现在，她都没有舍得拆开那个结。

  雪乃走了过去，在沙发上坐下，把潘先生抱进了怀里。

  风衣布料的触感粗糙，但隔着衣服传来的棉花的柔软度却刚刚好。雪乃把下巴搁在潘先生的头顶，手臂无意识地收紧了一些，刚好能让指尖碰触到那个方形盒子的边缘。

  "又要回去了呢，潘先生。"她轻声开口。

  声音很轻，像是一说出来就会被这间公寓吞噬掉。

  "……还没有决定好吗？"

  她刻意压低了嗓音，放慢了语速，试图模仿出那种没有任何起伏、却带着压迫感的声线。

  这是母亲一定会问的第一句话。

  雪乃看着前方没有打开的电视机屏幕，在脑子里搜寻着词汇。

  "文科。法学方向。"她用最严谨的逻辑组织着语言，"这是根据现阶段的成绩、适性，以及我对未来方向的评估后得出的结论。"

  "既然如此，就没有继续犹豫的必要。"

  她立刻又切换回那种低沉的语调，替那个假想的对手接了下去。"预备校、推荐人和大学期间的见习安排，家里会替你处理。毕业以后先进入合作事务所，再决定是留在那里，还是回来接触家里的事务。"

  不够。这样的反驳立刻就会被切断。

  雪乃咬了咬下唇，手臂上的力道加重了几分。

  如果在旁边的话，那个人一定会端着红茶插嘴。

  "雪乃酱，还是这么喜欢绕远路啊。结果明明和妈妈替你选的一模一样，却偏偏要把它说成自己的决定。那到底哪里不一样呢？"

  她甚至能想象得出那张带着完美笑容的脸，以及那种甜得发腻却字字诛心的语调。

  "专业方向和毕业后的安排是两件事。"雪乃对着空气反击，"我选择法学，不代表我同意把之后的人生也一并交给家里处理。而且，这与你毫无关系。"

  "哎呀，生气了？可是从小到大，你读的书、接受的教育、最擅长的表达方式，不都是家里给你的吗？一边使用这些东西，一边说它们和家里无关，不觉得太方便了吗？"

  逻辑在这一刻出现了死结。

  雪乃闭上嘴，脊背贴着沙发靠背，慢慢地向下滑了一点。

  太蠢了。

  她一个人坐在这里，抱着一个玩偶，分饰三角地进行着这种毫无意义的模拟演练。甚至每一次模拟的结果，都是自己的逻辑防线被那种居高临下的态度单方面碾压。

  这是在开战前就已经承认了败北。

  雪乃叹了口气。她把下巴从潘先生的头顶移开，视线垂向了自己怀里的那个深色方盒。

  暗红色的丝带打着一个规整的蝴蝶结，丝带的尾端因为之前的触碰卷起了一点边。

  她伸出食指，轻轻拨弄了一下那个卷起的边缘。

  如果是在活动室里，面对这种情况，那几个人会怎么做？

  那个死鱼眼会发出几声惹人厌的咋舌，然后用那种自暴自弃的口吻说出一些看似烂泥扶不上墙、实则把所有人包括他自己都绕进死胡同的歪理。

  那个团子头肯定会一脸慌乱地在中间打圆场，一边说着"那个那个"，一边用那种毫无逻辑可言的温度强行把这种冷冰冰的对话搅成一团糊涂的温水。

  至于送这份巧克力的人……

  雪乃的指尖在丝带的表面摩擦着。那个人会端坐在那里，用那种带着英国口音的、听不出任何波动的语调，直接抛出一个刻薄却让人无法反驳的陈述句。

  "原来在这个房间里，判断一个人是否成熟的标准，仅仅是看她有没有按照别人划定的表格去填鸭而已吗。"

  雪乃不自觉地在脑海里补全了那句虚构的台词，随后轻轻笑了一声。

  真是的，这算什么啊。

  那三个人，没有一个具备应对大家族施压的常识和礼仪，也没有一个能在母亲的那种逻辑里存活下来。

  但不知道为什么，只要一想到他们可能会做出的那些毫无教养和效率的反应，胸口那种被水泥封住一样的窒息感，就会莫名其妙地松动一点。

  他们不会帮她填那份进路表。

  按照奉仕部的原则，那个人也不会允许任何"代替完成"的行为。

  如果只是因为母亲希望她选择法学，就刻意在表格上写下另一个方向，那也不算是她自己的决定。无论顺从还是反向逃开，那支笔依然握在母亲手里。

  她确实喜欢把混乱的事实整理成可以辨认的结构，也确实无法对那些被强者随意改写的规则视而不见。法学并不会因为母亲也认可它，就突然变成一个虚假的答案。

  这一切，只能她自己去选，自己去说，自己去承担那些可能刺痛她的目光和语言。

  周末的那张餐桌，依然是一场躲不掉的战争。

  可是，现在的她，书包里装着那份被几个人一起熬出来的预算表，指尖碰着那盒从冷风里递过来的巧克力，胃里还残留着刚才那块发硬的甜食的温度。

  这些东西很笨拙，也很没有效率，在母亲的逻辑里甚至可以说是毫无价值的副产品。

  但它们是客观存在的。就像拉芙希妮说过的那样，这是"用橡皮擦不掉的东西"。

  雪乃松开了拨弄丝带的手指。

  她把潘先生举起来，和那对没有焦距的黑色塑料眼珠平视着。

  "没关系的，潘先生。"她的声音恢复了平稳，不再有刚才那种刻意压低的紧绷感。"我会选择法学。即便它最后是错误的答案，我也会清楚地告诉她们，那是我的错误。"

  她把潘先生重新放回了沙发的角落，理了理它的那件粗花呢大衣的衣摆，确保那个装着巧克力的盒子依然稳稳地卡在它的怀里。

  这种把私人情绪寄托在死物上的行为，如果被那个死鱼眼看到，一定会遭来长篇大论的心理吐槽吧。或者被拉芙希妮看到，又会被她用那种干燥的语调写进那本"排查报告"里。

  想到这里，雪乃轻轻哼了一声。
