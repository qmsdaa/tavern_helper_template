场景: 7
幕: "第一幕·入部磨合"
时间: "2013年6月上旬 放学后"
地点: "奉仕部活动室"
人物: "雪之下雪乃、拉芙希妮·都柏林、比企谷八幡、由比滨结衣、户冢彩加"
正文: |
  进入六月，千叶的空气里开始积攒起黏腻的潮湿感。

  奉仕部活动室里，那台老旧的空调还在苟延残喘，勉强维持着室内那种一贯的低气压。拉芙希妮坐在她惯常的位置上，手里翻着那本英日对照的诗集。这半个月来，她似乎已经习惯了这里时而死寂、时而剑拔弩张的氛围。只要不主动把话题往她身上引，她就能像一个完美的幽灵一样，安静地在自己的角落里待着。

  打破这份宁静的，是活动室拉门被小心翼翼拉开的声音，以及随之而来的、充满元气的招呼声。

  "那个……打扰了，八幡在吗？"

  雪乃停下手里正在翻阅的文库本，抬起头。站在门口的是一个穿着网球社运动服的男生，有着一头柔软的灰发和比女生还要精致的五官。户冢彩加。

  比企谷八幡原本正趴在长桌对面装死，听到这个声音，整个人像装了弹簧一样弹了起来，连带椅子都发出了不堪重负的吱呀声。

  "彩加！你、你怎么来了？"八幡的声音里透着一种罕见的慌乱和……诡异的兴奋。

  "小彩！"结衣也跟着跳了起来，热情地迎了上去，"你是来找小企玩的吗？"

  "啊，由比滨同学也在啊。"户冢露出一个毫无防备的纯真笑容，"其实……我是带着委托来的。马上就要期末考试了，我的成绩有点……那个，所以想问问，能不能和大家一起复习？"

  "没问题！当然没问题！就算改变日本的教育制度，我也一定会让你及格的！"八幡几乎是脱口而出，语气里满是不加掩饰的积极。

  雪乃发出一声干瘪的叹息，把文库本合上。

  "比企谷同学，你的大脑是已经被潮湿的空气泡发了吗？改变教育制度这种事，可不是你这种只会说废话的家伙能做到的。"雪乃冷冷地打断了他的妄想，然后将视线转向站在门口的男生，"户冢同学，奉仕部接受你的委托。不过，既然要复习，我就会按照最高标准来要求，你最好做好心理准备。"

  "嗯！我会努力的！谢谢你，雪之下同学！"户冢用力地点了点头，脸上的笑容显得更加灿烂了。

  "那、那我也要一起！"结衣赶紧举手，脸上带着几分心虚，"我的数学也快完蛋了……"

  雪乃揉了揉眉心，感觉接下来的工作量正在呈指数级上升。她的目光越过兴奋的结衣和还在不自然地整理衣领的八幡，落在了长桌中央的拉芙希妮身上。

  浅金发少女正安静地看着这场突如其来的热闹，翡翠色的眼睛里带着一丝不易察觉的困惑，似乎在努力理解为什么一个男生的出现会让比企谷产生如此巨大的情绪波动。

  "都柏林同学，"雪乃的声音放缓了一些，"J班的进度和其他班不太一样，期末考试对你来说有困难吗？如果不介意的话，接下来的复习，你也可以一起。"

  拉芙希妮微微一怔。她看了一眼正期待地望着她的结衣，又看了看似乎完全不介意多一个人的户冢，最后对上了雪乃那双平静的深蓝色眼眸。

  她低下头，右手下意识地摩挲了一下手腕上那截烧焦的旧丝带。

  "……如果不麻烦的话。"她的声音很轻，但在这个略显嘈杂的活动室里，却异常清晰。
