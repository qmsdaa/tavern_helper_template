场景: 141
幕: "第十幕·冬去春来"
时间: "2015年2月14日 · 周六"
地点: "总武高特别栋奉仕部活动室"
人物: "比企谷八幡、雪之下雪乃、由比滨结衣、拉芙希妮·都柏林、比企谷小町、川崎大志"
POV: "共享场景／零POV"
正文: |
  二月十四日。星期六。活动室的暖气片咔嗒响了一声，又安静下去。

  小町进门的时候抱着一个纸袋。大志跟在后面，手里拎着两瓶麦茶。纸袋放到长桌中间，小町从里面掏出五个小纸盒，四个深棕色，一个浅粉色。

  "情人节。"她把盒子排成一排，"巧克力。不是买的。小町自己做的。"

  八幡从文库本上方看了一眼。"你什么时候学会做巧克力了。"

  "上个月。失败品全部被大志吃掉了。"

  "一共七批。"大志说。

  "大志，不用报数字。"

  小町把四个深棕色盒子推给前辈，粉色那只留给大志。结衣拆开自己那盒，里面是六颗圆的，大小不太一样，表面撒了可可粉。

  "好可爱！小町你手好巧——"

  "还没吃到嘴里，不要先夸。"八幡说。

  结衣咬了一颗。"——好吃！"

  "哥哥，轮到你了。"

  八幡拿起一颗，嚼了。"嗯。能吃。"

  "小町分数扣五分。"

  雪乃把盒子放在习题册旁边。她先看了一会儿，像在评估什么，然后拿了一颗。"甘さが控えめで、大人向け。高中生做这个甜度，是有意识的控制。"

  "雪乃姐的夸奖像食品检验报告。"小町说。

  "是夸奖。"

  拉芙希妮拿起一颗。她咬了一半，把剩下的一半放回盒盖里。

  "可可粉的量刚好。没有盖住巧克力的味道。"

  "拉芙希妮姐——"小町双手合十，"你每次吃完都会认真说。小町觉得这个特别珍贵。"

  "因为是真的。"

  吃完一轮，小町把椅子往前拖了半寸。

  "那么。巧克力也吃了，小町有个问题想问各位前辈。"

  八幡把文库本合上。"我就知道。"

  "不是小町的问题。是大志的朋友的问题。"

  "大志的朋友。"八幡重复了一遍。

  "真的。"大志说。他从麦茶杯上抬起头。"隔壁班的松田。昨天在走廊上问我，怎么判断一个人是喜欢你，还是只是对你好。"

  活动室安静了几秒。暖气片又咔嗒了一下。

  "你们把奉仕部当什么了。"八幡说。

  "奉仕部。"小町说，"正式部门，有公章，有记录簿。雪乃姐，记录委托。"

  雪乃翻开记录簿，写了日期。"委托人。"

  "松田——"

  "大志的朋友。"大志说。"他叫松田隼人。一年五班。"

  "委托事项呢。"

  "'怎么判断一个人是喜欢你，还是只是对你好'。"小町说。

  雪乃的笔停了一下，然后写完。她把记录簿推到桌子中间。

  "受理中。"她说，"那么，各位。怎么判断。"

  结衣托着腮。"嗯……对你好的人，不会只在你需要的时候出现。喜欢你的人——"

  "结衣姐还没说完就开始脸红了。"小町说。

  "我没有！是暖气！"

  八幡把MAX咖啡的拉环拉开。"判断不了。一个人对你好还是喜欢你，本人不说，你永远不知道。能做的只有——"

  "只有什么？"小町问。

  "只有决定自己要不要说。"

  雪乃把习题册翻过一页。"我的意见是，不要用'好'和'喜欢'这对词。边界不清晰。把你想确认的具体行为列出来——对方做了什么，你在意的是什么。然后直接问。"

  "雪乃姐的方案每次都像在写调查报告。"小町说。

  "有效率。"

  大志看着拉芙希妮。"拉芙前辈呢。"

  拉芙希妮把杯子放回碟子上。杯底磕在瓷碟上，很轻的一声。

  "如果一个人只在你好的时候出现——那是对你好。如果你不好的时候，对方还在。那是别的。"

  小町趴在桌上。"四个前辈，四个不一样的答案。这个人来奉仕部委托真是来错地方了。"

  "不是来错。"大志说。

  "嗯？"

  "他本来就没打算要一个答案。他只是想知道，这个问题本身是可以被认真回答的。"

  八幡看了大志一眼。大志在看自己那杯麦茶。

  "大志。"

  "嗯。"

  "你刚才那句话，适合做奉仕部的人。"

  "已经是了。"

  暖气片不响了。窗外有人在笑，远远的，操场方向。

  结衣把最后一颗巧克力塞进嘴里。"所以松田同学——他喜欢谁？"

  "隔壁班的班长。"小町说。"女生是弓道部的。平时对他特别照顾。练习赛给他留饭团。文化祭帮他搬器材。受伤给他贴创可贴。"

  "什么伤。"

  "手指。切文化祭展板的时候。"

  "那是对你好。"八幡说。

  "不对。"结衣说。"对一个人好不会特意留饭团。饭团是那种——多出来的东西。不是应该做的事。"

  "由比滨同学这次说得有道理。"雪乃说。

  "对吧！"

  "但也不一定。"雪乃翻过一页习题册，"弓道部的人经常互相照顾。文化祭期间搬器材也是正常行为。创可贴——任何经过保健室的人都会顺手拿一张。"

  "雪乃姐在帮大志的朋友分析，还是在帮大志的朋友拆散自己。"

  "在排除干扰变量。"

  拉芙希妮把剩下那半颗巧克力放进嘴里。

  "你们记得上周那把伞吗。"

  "铃木的伞？"结衣说。

  "嗯。伞骨有一根是弯的。对方说'这把伞，有一根骨是弯的。你还记得吗。'记得这些的人——"

  她停了一下。

  "不是在对她好。"

  活动室里又安静了几秒。这一回，暖气片没有响。

  小町站起来收纸盒。大志帮她把盒子叠好放回纸袋。粉色的那只已经空了，盒盖上粘着一小片可可粉。

  "所以松田应该怎么办。"小町说。

  "告诉他。"八幡说。

  "告诉他——什么。"

  "告诉他'有人问我怎么判断。我决定不了。所以我来问你。'"

  "那不是就直接表白了吗。"

  "对。"

  小町眨了眨眼。"小町还以为哥哥会建议他先观察半年到一年再决定。"

  "那是以前的我。"八幡把空罐子丢进垃圾桶。"观察不能代替回答。这是我花了两年多才学会的事。"

  雪乃合上记录簿。"委托归档。答案——"

  她看了桌边一圈。

  "没有统一答案。建议委托人自己问。"

  "基本事项这样写？"

  "基本事项这样写。"

  小町把纸袋抱起来。"谢谢各位前辈。小町会把答案转告松田同学的。顺便说一句——"

  "什么。"

  "今天是情人节。前辈们没有带巧克力来吗？"

  结衣从书包里摸出一个小布袋。"有。"

  三颗心形巧克力。一颗给八幡，一颗给雪乃，一颗给拉芙希妮。

  "今年没有大志的份？"小町问。

  "有。"结衣又摸出一颗，圆形的，锡纸包着。"这个。比心形的甜一点。"

  大志接过去。"谢谢。"

  小町看着结衣。

  "结衣姐，你决定不偏心之后，每次都给所有人带一样的东西。"

  "不是一样。"结衣说。"大志的是圆的。小町你那份——"

  她在布袋里找了找，掏出一颗星形的。

  "小町的是星星。"

  "因为小町的名字有星星？"

  "因为你刚才问那个问题的时候，眼睛亮亮的。"

  小町接过去，没有马上拆。她把星形巧克力翻了一面，看了看背面。然后放进外套口袋。

  "小町回去再吃。"

  活动室的门被推开。冷风灌进来，小町和大志走了。走廊里的脚步声轻下去。

  雪乃把习题册收进书包。"比企谷同学。"

  "嗯。"

  "'观察不能代替回答'——你刚才自己说的。"

  "所以。"

  "所以。"雪乃拉上书包拉链，"你自己做到了。"

  八幡没有回答。他把椅子推进桌底。

  结衣把巧克力盒子留给雪乃。"小雪乃，那个，明天之前要吃完——好吧你一定会在赏味期限之前吃完的。"

  "当然。"

  拉芙希妮站起来，把围巾绕了一圈。走到门口的时候，她回过头。

  "雪乃。"

  "嗯。"

  "刚才你替松田排除干扰变量的时候——"

  "嗯。"

  "很像你自己。"

  雪乃的手指在习题册的角上停了一下。

  "我知道。"她说。

  四个人走出活动室。走廊里暗着，只有楼梯口的安全灯亮着绿光。二月十四日。明天还有一场考试。下周一，合格通知开始发放。
