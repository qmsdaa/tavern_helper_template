场景: 145
幕: "第十幕·冬去春来"
时间: "2015年3月12日 · 周四"
地点: "总武高特别栋奉仕部活动室"
人物: "由比滨结衣、雪之下雪乃"
POV: "共享场景／零POV"
正文: |
  三月十二日。放学后，活动室只有她们两个人。

  八幡今天陪户冢去了网球部的送别会，拉芙希妮去早稻田办手续。结衣说留下来收拾茶杯。

  茶柜的门开着。里面的杯子按使用频率排了一排——深蓝的、白的、米色的、碎花的、马克杯、两个纸杯倒扣着没用过。结衣把杯子一个一个拿出来，放在长桌上。雪乃在旁边打热水，水壶发出很细的嘶嘶声。

  "小雪乃。以前杯子只有四只。"

  "嗯。蓝色的、你的、我的、热水壶配套的。"

  "后来多了小町的和大志的。"结衣把碎花杯举起来对着光看了看里面。"小町的杯口有一圈茶垢。明天洗。"

  "今天做不完的事可以留到明天。"雪乃说。"这是你教的。"

  "我教过这么了不起的话吗。"

  "教过。"

  水烧开了。蒸气从壶嘴往上冒。雪乃把热水倒进盆里，兑了冷水，试了水温。

  "先洗哪只。"

  "从最旧的开始。"结衣拿起雪乃那只白色的。"这只。一年级就有了。第一次泡茶给我喝，用的就是它。"

  雪乃接过杯子。杯壁内侧有一圈很细的茶渍，她用海绵沿着杯壁转了一圈，茶渍褪了。她把杯子放进清水里过了一遍，拿出来用干布擦。

  "结衣。"

  "嗯？"

  "你有话想说。"

  结衣拿着碎花杯子的手顿了顿。她把杯子放在桌上，没有直接回答。

  "杯子的顺序。"她说。"深蓝色那只是拉芙希妮酱的。她每次放杯子都是放最左边。喝了多少，剩多少。从来不续。小企用马克杯，喝什么都是MAX咖啡。喝完丢在桌角。从来不放回原位。小雪乃的杯子，永远洗得最干净。"

  "这是观察。"

  "嗯。是观察。你知道我还观察到什么。小雪乃，你给每个人选最适合的东西。给了我果茶。给了拉芙希妮酱甜的。给了小企无糖的。甚至有时候给他MAX咖啡——限量一罐。"

  "嗯。"

  "我观察到你给每个人最适合的东西。然后我发现——我自己。一直在给所有人最适合的东西。温度。气氛。不要偏心。维持平衡。让大家都能舒服。但那个'最适合'——是小雪乃的。也是我的。"

  她把碎花杯子放进热水里。海绵擦过杯壁，一圈一圈。

  "去年冬天。有一次我回家。妈问我——你那个朋友，雪之下同学，你们还在奉仕部吗。我说在。她说——你喜欢的人，也在吗。"

  "你怎么回答。"

  "我说在。都在。我用的词是'都在'。"

  雪乃把擦干的杯子放在桌上。盆里的水还冒着热气。

  "在奉仕部这么久，我学会了给别人的情绪留空间。所以我自己的情绪——我学会了把它和'大家的情绪'装在一起。'因为大家会开心，所以我也开心。'这种话我说过很多次。"

  "对。"

  "但我今天不想说。"结衣说。她的手还在杯子上，但手指没有动。"我今天只想说——如果不替别人说，只说我自己。如果只说我自己——"

  她吸了一口气。

  "我喜欢小企。从一年级到现在。不是'大家的'。就是我自己。我不会说'只要他幸福就好'。我想要他选我。我想要他——选我。"她把杯子放回桌上，杯底和桌面碰了一下，没有立稳，她用指尖按住杯口。"我没有退让。以前在别人面前，我会先笑，先说'当然是小雪乃啦'。我今天不说了。不是不选小雪乃。是我自己——不退让。说出来。这个人是我想选的。"

  活动室里只剩水壶的余热在金属底座上嘶嘶响。

  雪乃把海绵放进盆里。她把手在围裙上擦干，然后看着结衣。

  "听到最后。"

  "嗯。"

  "我今天的立场——不回应自己的。不是不承认。不是没想清楚。是——想清楚了。但不想用'我也喜欢同一个人，我们比一比'来回答你刚才说的话。那不是回答。那是把感情变成比赛。"

  "小雪乃——"

  "但是。"雪乃说。她的手指在杯沿上停着。"我不回应我的立场。这句话本身，已经是一个立场。你能听出来吗。"

  结衣看着她。过了一会儿。

  "能。"

  "好。"

  "小雪乃不退让。但是不说——不退让。"

  "对。"雪乃说。"因为有些事情还没有到该说的时机。对方还没有准备好。我自己也没有。在他说之前——我不想替他决定。这是这两年学到的东西。"

  "奉仕部学到的。"

  "嗯。不要替别人决定。包括不替他决定'他应该喜欢谁'。包括不替你决定'你应该退让'。包括不替我自己决定'装作没有立场'。"

  结衣把碎花杯子拿起来，对着光看了一圈。茶垢洗掉了。

  "你知道我今天为什么选洗杯子的时候说。"

  "因为杯子是证据。"雪乃说。"每只杯子都证明某个人在这里存在过。"

  "对。"结衣把杯子倒扣在干布上。"而且洗杯子可以低着头。小雪乃看不到我的眼睛。我也看不到小雪乃的。"

  雪乃没有说话。她把最后一只杯子——拉芙希妮的深蓝色杯子——拿起来。杯底有很淡一圈茶渍，几乎看不出来。她换了新水，只用清水，沿着内侧转了一圈。

  "结衣。"

  "嗯。"

  "'不退让'。这三个字——是你今天第一次用自己的名字说的。"

  "以前——"

  "以前你用所有人的名字说。用奉仕部的名字。用维持温度做理由。"雪乃把深蓝色杯子倒扣在干布上，和另外五只杯子排成一排。"今天没有。今天你说的是——我想要他选我。这是你的第一人称。"

  "是我的第一人称。"

  "收下。"雪乃说。

  结衣把擦干的杯子一只一只放回茶柜。最左边，拉芙希妮的深蓝。往右，八幡的马克杯。雪乃的白杯。结衣自己的米色杯。小町的米色杯。大志的碎花杯。六只杯子，杯口朝里，排成一行。

  "明天还有一场。"

  "什么。"

  "毕业相册。我还没看完所有人的投稿。有七个人写了同一句话——光是和这个人同一班就已经是赚到了。"

  "那个人是谁。"

  "不是一个人。是七个不同的人。被七个不同的人写。"

  "那就不是同一个人了。那是——"

  "是一个班。"结衣说。她把茶柜门关上，门合上的时候轻轻响了一声。"毕业之前要排版完。"

  雪乃把盆里的水倒进水槽。水沿着排水口旋下去，发出很短的一声吸力。她把围裙解下来，折好，放回柜子里。

  两人收拾完，站在门口。活动室的长桌上只有一盏台灯，照着六只倒扣的杯子。

  "小雪乃。明天见。"

  "明天见。"

  结衣走了。雪乃在门口站了一会儿，伸手关了台灯。活动室暗下来，走廊的光从门上的玻璃小窗透进来，落在长桌的正中。
