场景: 74
幕: "第四幕·冬假→三学期"
时间: "2014年1月18日 · 周六 · 三学期第二周"
地点: "总武高中 · 2年J班教室 → 特别栋走廊"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡"
正文: |
  "一桥大学，法学部。"

  雪乃盯着这几个字。碳素铅笔的笔触在总武高统一印发的"进路调查表"上留下了清晰的凹痕。字迹写得端正，就像是她每天早晨熨烫得没有褶皱的百褶裙。

  但在不到两分钟的时间里，这是她第三次拿起那块由某个文具商附赠的方形橡皮。

  拇指和食指施加的力度让橡皮的边缘微微变形。随着摩擦声，那些端正的字符渐渐变得模糊，最终变成一片黑灰色的污迹，然后在更用力的擦拭下彻底消失。

  取而代之的，是纸张表面被破坏的纤维。

  那块区域起毛了。薄薄的纸页变得脆弱不堪，再施加一点压力，名为"未来志愿"的表格就会被直接戳出一个无法修补的破洞。

  母亲坐在沙发主位上，用那种看似温和实则语气说出"还不够成熟"、"文科不适合你现在的状态"时的表情，像影子一样覆在那些被擦掉的凹痕上。

  雪乃闭上眼睛，深吸了一口气。教室里渐渐开始有了喧哗声，其他同学正陆续走进教室，拉动椅子的声音此起彼伏。

  她睁开眼，用手指将桌面上那些灰白色的橡皮碎屑扫到掌心。

  "早安，雪乃同学。"

  这句带着一点点微凉晨风气息的问候，和拉开旁边那张椅子的木质摩擦声同时响起。

  雪乃的手指条件反射地蜷缩了一下。她将掌心的橡皮碎屑倒进桌边的便携垃圾袋里，然后顺手将旁边那本《数学》参考书拉过来，压在了进路调查表的下半部分。

  "早安，都柏林同学。"雪乃的声音保持着一贯的平稳，视线落在拉芙希妮那件还没来得及脱下的大衣领口上，"今天的特快列车没有再次因为天气原因限速避让吗？"

  "托你的福，今天非常准时。"拉芙希妮将单肩包挂在书桌侧面的挂钩上，动作慢条斯理。

  她脱下大衣，叠好放进抽屉。做完这些后，她并没有立刻转过身去拿课本，而是将视线越过了那本作为掩护的《高等数学》，轻飘飘地落在了雪乃面前的桌面上。

  那里还残留着几丝没扫干净的橡皮碎屑，以及参考书边缘露出来的，被擦得起毛的表格一角。

  拉芙希妮的目光在那块起毛的区域停留了两秒。

  虽然大半个志愿栏被遮住了，但那几个哪怕被擦掉也依然顽固地留在纸面上的凹陷笔画——尤其是"早稻田"和"桥"字的深邃压痕——在晨光的侧照下显得一清二楚。

  雪乃能感觉到那股视线的重量。

  昨天的红茶杯、熊猫便利贴、还有那种被彻底看穿的羞窘感瞬间在脑海里复苏。她把《高等数学》又往旁边推了半寸，试图将那个角落完全盖住。

  "你如果对这张纸的排版有意见，可以向学生会或者教务处提出书面申请。盯着别人的桌面看，并不符合总武高对国际课程班学生的礼仪要求。"雪乃迅速搬出了她最擅长的防御性说教。

  拉芙希妮并没有因为这句略带刺的话而移开视线。

  她反而伸出右手，指尖轻轻在那几丝残留的橡皮碎屑上点了一下。

  "我只是在评估总武高教务处的采购标准。"拉芙希妮的声音很轻，带着干燥的、讨论办公用品质量的语气。

  雪乃愣了一下。"什么？"

  "这种克重的再生纸，纤维太短。"拉芙希妮收回手，用指腹捻了捻那些碎屑，"不管是多昂贵的橡皮，只要在同一个地方重复擦拭超过三次，纸面就一定会破损。"

  雪乃的喉咙像是被什么东西哽住了一秒。

  她看着拉芙希妮那双翡翠色的眼睛。那里面没有昨天在部室里那种带有攻击性的恶趣味调侃，也没有让人作呕的、名为"同情"的悲悯。

  那只是平静的、甚至是带着一点冷酷的陈述。

  就像是在说"我看到了那个破洞"。

  "这与纸张的克重无关。"雪乃的指甲在桌子底下悄悄掐住了制服裙的边缘，"如果在书写之前能做好精确的规划，就不会产生需要反复修改的错误。归根结底，是操作者的失误。"

  "错误？"拉芙希妮微微偏了一下头，"写下自己觉得正确的字，然后因为……'母亲'的摩擦力而不得不把它擦掉。这也是操作者的失误吗？"

  雪乃的呼吸停顿了。

  那个关于"母亲"的咬字，却像是一根细小的针，挑破了她用层层逻辑包裹起来的那份名为"母亲"的沉重。

  她有一瞬间以为拉芙希妮听到了她昨晚在公寓里和那个女人的通话。但理智告诉她这不可能。都柏林家的这位二小姐，只是单纯凭借着纸上那惨烈的擦痕，就闻到了同样属于"被控制者"的味道。

  雪乃下意识地挺直了背脊。

  "那只是我经过二次评估后，对效率最大化的重新考量。"雪乃转过视线，盯着黑板上方那个还没擦干净的值日生名字，"文科专业的产出回报率，在现阶段的经济模型下，并不符合我的……"

  "这借口真的很难听，部长大人。"

  拉芙希妮打断了她。没有用那种抑扬顿挫的外交辞令，只是一句直白的、带着点无奈的叹息。

  雪乃猛地转过头，正准备用更严厉的词汇进行反击，却发现拉芙希妮不知道什么时候已经把上半身凑近了过来。

  因为课桌的距离很近，拉芙希妮的肩膀已经贴到了她的肩膀边缘。那股带着点清晨冷空气和微弱茶香的气息，毫无预兆地侵入了雪乃的防线。

  拉芙希妮低下头，看着那个被参考书压住一半的表格。

  "如果是自己想写的字，就算把纸擦破了，甚至戳出一个洞，那个洞的形状也是属于你自己的。"拉芙希妮的声音压得很低，低到只有她们两个人能听见。

  她伸出一根手指，隔着那层空气，在那本《数学》上方的空白处轻轻划了两下。

  划出的轨迹，是"法律"两个字。

  "但如果你只是为了让某块更大的、名为'正确'的橡皮满意，而不得不把自己的字擦掉……"拉芙希妮停顿了一下，翡翠色的眼睛抬起来，直视着雪乃的眼睛，"那种起毛的质感，摸起来真的很恶心。"

  恶心。

  这个词从拉芙希妮嘴里吐出来，带着近似于自毁的冷漠。

  雪乃的心脏猛地收缩了一下。她在那双眼睛里看到了熟悉的影子。不是她自己，而是拉芙希妮身上那些看不见的、被烧焦的丝带。

  那是属于另一个每天都在试图擦掉自己本来面目的人发出的，同类的共鸣。

  雪乃准备好的那些反驳、那些关于"评估"、"效率"、"为了未来"的严密逻辑，在这一瞬间突然失去了所有的支撑点。

  她没有推开拉芙希妮。她甚至连平时那种下意识的回避动作都忘记了。

  她只是紧紧地盯着那块起毛的纸页。

  良久，雪乃的手指慢慢松开了裙子边缘，移到了那本《数学》上。

  "这里的纸张确实很差。"雪乃的声音小得几乎像是在自言自语，"下巴抬那么高，是等着我把它也擦掉吗？"

  拉芙希妮嘴角那点微小的、紧绷的弧度终于散开了一点。她重新坐直了身体，把自己的包拉到面前。

  "我只是觉得，如果真的不喜欢，换书写工具也许会更好。或者干脆……"拉芙希妮从包里拿出一支蓝黑色的墨水笔，放在了自己的桌面上，"用橡皮擦不掉的东西写。"

  蓝黑色的金属笔身在木质桌面上发出碰撞声。

  雪乃的视线随着这声细微的动静移动。那支笔静静地躺在两张课桌相接的缝隙边缘，笔帽上的金属雕花在清晨冷白的光线下折射出一道短促的光斑。

  "用橡皮擦不掉的东西写。"

  拉芙希妮留下的这句话，像是一颗没有完全化开的硬糖，哽在喉咙深处，散发着一股有些涩口的余味。

  教室里的喧哗声正在几何级数般地增加。前排的男生在抱怨假期结束得太快，靠窗的几个女生在传阅包装花哨的伴手礼。但在这一方逼仄的双人座位里，那些声音都被那支墨水笔划出了一条无形的真空带。

  雪乃的呼吸慢慢平复下来。

  她没有去碰那支笔，而是转过头，看着已经坐直身体、正在把《世界经济史》从单肩包里拿出来的拉芙希妮。

  金色的长发随着主人的动作顺着肩膀滑落，遮住了那条隐藏在袖口里的红绸带。

  "如果使用这种水性墨水……"雪乃听见自己用干涩的、于条件反射般的逻辑语气开了口，试图重新拼凑起那些零落的防御，"一旦在这种教务处下发的正式文件上涂改，整张表格都会作废。"

  拉芙希妮翻开书页的手顿了一下。

  "而且，"雪乃看着拉芙希妮在侧光下显得有些苍白的轮廓，"我想知道，如果是你，打算用这支一旦落笔就无法修改的笔，写下什么样的未来？"

  这是一个超过了日常交流界限的问题。

  如果在十天前，雪乃不会问出这种近似于探究别人私人领地的话。但在这个清晨，那些关于"被控制"和"恶心感"的共鸣，让这个问题在她们之间变得出奇地顺理成章。

  她想知道，这个敢于在这个总武高的教室里，向她展示出这种带有反抗意味的"墨水笔"的转学生，在那个名叫爱布拉娜的巨大阴影下，到底拥有多少写下自己名字的勇气。

  拉芙希妮没有立刻回答。

  她把《世界经济史》翻到第一章，然后将双手交叠放在大腿上。右手的大拇指习惯性地、非常隐蔽地在左手的袖口边缘摩挲了两下。

  在那一瞬间，雪乃从拉芙希妮那翡翠色的眼睛里，捕捉到了微小的闪烁。那是并不比她自己刚才面对那张起毛的进路调查表时，轻松多少的挣扎。

  "未来。"

  拉芙希妮终于重复了一遍这个词。她的声音还是那种习惯性的平稳，只是尾音稍微轻了一点，像是刚刚冲泡出来的、最顶层的红茶泡沫。

  她伸出右手，将那支蓝黑色的墨水笔拿了起来。

  "如果是在伦敦的那张桌子上，我用这种笔写下的，大概只会是诸如'收益评估'、'股权架构'或者'资金流向'这种就算我不假思索也能填写的词汇。"拉芙希妮拔下笔帽，笔尖在空气中悬停着，"因为那里，有很多人随时拿着各种各样的标准橡皮，等着把我写错的字擦掉，然后再重新印上他们认为正确的铅字。"

  雪乃听懂了那个"他们"指的是谁。

  那场傍晚公寓玄关外的对峙，以及拉芙希妮手腕上那道被烧毁的痕迹，都是这种擦除与重写留下的伤疤。

  "那么现在呢？"雪乃的视线落在那个锋利的笔尖上。

  "现在……"拉芙希妮将拿着笔的手挪到了雪乃这边。

  她没有去碰那张起毛的进路调查表，而是翻开了雪乃垫在手肘下方的一本草稿本。那是一本雪乃平时用来演算数学步骤或是记录杂事的空白本子。

  笔尖接触到纸面，发出细微的、沙沙的摩擦声。

  雪乃的手指在草稿本边缘顿了一下。她下意识地想要收回草稿本，但在看清拉芙希妮落笔的字迹时，她的手停住了。

  那是三个写得很慢，但端正的平假名。

  "ほうじちゃ（焙茶）"。

  拉芙希妮写完，将笔帽重新扣上。

  "在还没有想清楚那些宏大叙事里的'未来'之前，我大概只能用这种擦不掉的笔，写下诸如'今天下午的社团活动里，可能会喝到的热饮种类'这种毫无用处的事情。"拉芙希妮将草稿本推回给雪乃。

  雪乃看着那几个字。

  墨水已经渗透进了纸张的纤维里。那个"茶"字的收尾处，因为停顿而留下了一个稍深的墨点。它不再是那种用橡皮可以轻易抹去的碳痕，而是切切实实地、无法逆转地留在了这页白纸上。

  "这和所谓的'未来'根本没有任何逻辑上的关联。"雪乃觉得喉咙里的那种干涩感终于消失了，取而代之的是奇怪的心跳频率，"你只是把你对下午茶的擅自预判，强行落实在我的草稿本上罢了。"

  拉芙希妮轻声笑了一下。那是今天早上，她露出的第一个真正放松下来的表情。

  "但这也是选择，不是吗？"拉芙希妮偏过头，侧脸的轮廓在阳光下显得柔和了一些，"至少，在写下这个词的时候，我不需要考虑它是否符合任何人的利益最大化模型。也不需要担心，等我把这本本子合上之后，它会不会被哪只突然伸出来的手擦掉。"

  雪乃没有说话。

  她盯着那个略深的墨点。对于一个习惯了把一切都规划在正确轨道上的优等生来说，这种只关注"今天下午的茶"的短视行为，简直是对所谓人生规划的嘲弄。

  但她不得不承认，在这个充斥着铅灰色压痕和橡皮碎屑的早晨，这三个渗入纸张的黑色平假名，就像是粗暴但又有效的精神缓冲剂。

  没有那只名为"母亲"或者"姐姐"的手，能伸进这间2年J班的教室，把这个关于焙茶的词语强行擦除。

  因为它是用擦不掉的墨水写下的。

  ——

  特别栋二楼的走廊里，风的走向总是和其他地方不太一样。

  那些从半开的玻璃窗缝隙里挤进来的冷空气，带着一点属于东京湾的潮湿腥味，毫不客气地卷起了雪乃校服裙摆的一角。

  她站在连廊的避风处，怀里抱着二十几本2年J班的国语作业薄。牛皮纸封面的重量隔着布料压在胸口，呼吸比平时沉了一分。

  在这个本该直接前往一楼教员室去见平冢静的空档里，雪乃却在自动贩卖机旁停了下来。

  视线里并没有这些花花绿绿的饮料包装，她的脑子里依然是那张被她压在《高等数学》厚重封皮底下的进路调查表。那是一张只需要在框内打勾或者填上几个字的纸，却重得像是一块铅。

  文理分科、志愿大学、学部意向。

  如果是在普通的家庭里，这大概只需要一个周末的家庭会议就能解决。但对于雪之下家来说，任何不符合"预期"的填涂，都会演变成一场全方位的审视。

  "还不够成熟。"

  母亲那平静到没有起伏的声音，隔着几公里的距离和几周的时间，依然能在这种寒冷的走廊里准确地刺中她的耳膜。

  如果顺着拉芙希妮早上的那个隐喻，用那支擦不掉的墨水笔，在第一志愿的栏目里填上"早稻田大学法学部"……

  那张总是挂着完美笑容的脸立刻就会浮现出来。阳乃大概会一边用最温柔的语气叫着"雪乃酱"，一边把那张表轻飘飘地扔回桌面上，顺便附赠一句足够摧毁她三天睡眠的话。

  她不敢在那个小小的矩形框里落笔。那个叫作"正确"的模具，就像一件尺码不对的紧身衣，把她勒得甚至连伸手去拿一支笔的力气都没有。

  "如果你打算在那里站到那些热饮全都变成常温的话，能不能先稍微往旁边挪一下？"

  干瘪、缺乏起伏、带着一点因为睡眠不足而产生的混响。

  这个声音在身后响起的时候，雪乃甚至没有因为惊吓而肩膀一抖。她只是条件反射地转过身，将怀里的作业簿抱得更紧了一些。

  比企谷八幡站在距离她大约两步远的地方，双手插在校服裤兜里，由于没扣扣子而敞开的外套在风里显得格外单薄。他用那种标志性的死鱼眼看着自动贩卖机，或者更准确地说，看着挡在硬币投入口前面的雪乃。

  "这台机器属于公共设施，并没有标明必须在特定时段才能使用。"雪乃看着他那头乱糟糟的短发，"如果你急需补充那种完全由糖浆和植脂末组成的工业废料的话，旁边那台冷饮机也许更适合你这种毫无品味的舌头。"

  话说出口她自己都听出来了——缺了平时的冰冷，干巴巴的。

  八幡看了她一眼，没有像往常那样直接怼回来，而是把视线往下移了几寸，落在了她抱着的那些作业本上。

  "J班的收作业标准也是按重量计算的吗？你现在的表情，就好像这些本子里夹着炸弹一样。"他一边说着，一边从口袋里掏出几枚硬币。

  "这只是一些常规的文学文本分析。"雪乃稍稍站直了身体，"倒是你，第二节课才刚刚结束，就已经需要靠那种可疑的甜味饮料来维持身体运转了吗？还是说F班的课程强度已经高到了让你连基本的生物钟都无法维持的地步？"

  "比起连作业本都抱得像是抱着什么需要引爆的东西的人，我这种只是因为熬夜打游戏而需要摄入糖分的理由，显然健康多了。"

  八幡走到贩卖机前，硬币发出一连串清脆的金属撞击声，滚进机器内部。

  他按下那个黄黑相间的"MAX咖啡"按钮。

  "哐当"一声，热气腾腾的铁罐滚进了取物口。

  雪乃看着他弯腰把咖啡拿出来，视线停留在那个罐子上一秒。她突然觉得，比起自己脑子里那些关于"家族期望"、"未来"和"法律界线"的复杂逻辑，这种只要投进一百三十日元就能立刻得到确定结果的等价交换——她盯着那个罐子，手指无意识地收紧了作业本的边缘。

  "……那个调查表，如果填错了的话，会被立刻退回来吗？"

  这句话脱口而出的时候，雪乃自己都愣住了。那声音很轻，被走廊上的风声削薄了一半。

  她迅速咬了一下下嘴唇，试图把这句话重新咽回去。

  八幡的手在半空中停顿了大约零点五秒。他没有转过头，而是继续盯着贩卖机面板上那些还在闪烁的按钮。

  "你是指那个烦死人的进路调查？"八幡拉开易拉罐的拉环，白色的水汽混合着甜腻的咖啡味飘散开来，"那个只要填了就能交差的东西，有什么好纠结的。就算你填你要去当宇宙海盗，平冢老师大概也只会一拳把你打飞，然后再塞给你一张新的让你重填。"

  "那是只有你们这种把人生当成搞笑漫画的人才会有的选项。"雪乃将作业本的边缘压紧，声音恢复了一点冷感。

  "那就填一个现在不会让你胃疼的选项。"

  八幡喝了一口咖啡，那种甜度让他忍不住皱了一下眉毛。

  "不会胃疼的选项？"雪乃看着走廊的地面，那里的瓷砖在阳光下泛着冷光。

  "啊。反正不管填什么，以后大概率都会后悔的吧。既然早晚都要后悔，那就选一个起码现在能让你睡个好觉、不至于站在这里像个雕像一样发呆的答案。"

  彻头彻尾的诡辩。消极、反进取、充满败犬气息。

  但在这个吹着冷风的走廊里，这种充满放弃感的话语，像一把钝锤，砸在了那件快要让她窒息的"正确"外衣上。

  反正不管选什么都会被挑剔。

  反正不管填什么，那只名叫"雪之下"的橡皮都会试图擦掉它。

  既然如此，为什么不一开始就用那种连她自己都觉得麻烦的墨水笔写下去。

  "你这种从一开始就预设了失败的悲观主义理论，如果作为论文提交的话，会被当场撕毁。"雪乃的声音终于有了些许往日的锋利感。

  "谢天谢地，我还没打算把它作为人生信条出版。"八幡又喝了一口，然后把那个空了三分之一的易拉罐捏在手里。

  他转过身准备离开，但在迈出步子之前，他突然折返了半步，把手伸进外套口袋里，掏出了一枚硬币，迅速塞进了退币口旁边的投币缝里。

  没有任何停留，他按下了一个橘色的按钮。

  "哐当。"

  又是一个罐子滚落的声音。

  "刚才买的时候多掉出来一个。"八幡从取物口里把那个罐子拿出来，也没有递给她，而是直接放在了那叠作业本最上面的牛皮纸封面上。

  那是一罐无糖的热红茶。

  "虽然没有你要的焙茶，但总比站在这里喝西北风强。"他甚至没有看她的眼睛，只是甩下这句干巴巴的话，就转过身，拖着那种稍微有些驼背的步子，晃晃悠悠地顺着楼梯走下去了。

  雪乃站在原地。

  那罐热红茶的温度隔着厚厚的作业本，依然能清晰地传导到她的指尖上。

  "多掉出来一个"。这台机器根本没有能同时掉出两种饮料的故障机制。

  但她没有出声戳穿。

  早晨那三个用墨水笔写下的平假名，和现在这罐被粗暴地放在作业本上的热红茶。

  这两个人，总是在用他们各自那种笨拙、甚至有些滑稽的方式，在那些坚硬的"正确"和"未来"面前，强行塞给她一点不需要被审视的、毫无意义的日常。

  雪乃收紧了抱着作业本的手臂，让那罐热红茶稳稳地靠在自己的锁骨下方。

  那种冰冷走廊里的窒息感，终于彻底消散了。

  她微微扬起下巴，转过身，踩着那略显急促的脚步声，朝着一楼教员室的方向走去。

  反正，那是用橡皮擦不掉的。
