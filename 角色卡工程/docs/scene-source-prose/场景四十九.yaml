场景: 49
幕: "第三幕·二学期"
时间: "2013年11月下旬 · 一色首次登场当日 · 放学后"
地点: "奉仕部活动室 → 教员室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、平冢静"
正文: |
  随着那扇有些年头的滑门被并不算轻柔的力道"砰"地一声关上，由比滨结衣终于夸张地吐出了一大口气。

  "呼——"她用手轻轻拍着胸口，刚才那种不自觉绷紧的肩膀也跟着垮了下来，"气氛好可怕啊……刚才一瞬间，我还以为拉芙希妮酱和小雪乃要联合起来把学妹给生吞了呢。"

  结衣一边说着，一边转过头去看坐在对面的比企谷八幡，试图在这个满是刺的房间里找一点同感："不过，小企刚才也很不客气呢。那么直白地说出来，一色学妹大概已经被吓得不敢再来了吧？"

  "啊，那可未必。"

  八幡连姿势都没换，依旧是那副后背靠着椅子的懒散模样。他微微掀起那双死鱼眼，目光越过半个桌子，投向了坐在最远端的雪之下雪乃。

  "你那种'这就是最终答案'的说法，对那些多少还在乎体面或者知道羞耻这两个字怎么写的人确实管用。"八幡的声音里带着一种因为嫌麻烦而产生的烦躁，干瘪得像放了好几天的隔夜面包，"但很遗憾，刚才走出去的那位，显然不在这两类人的范围内。她需要的根本不是别人告诉她什么是正确的，她只是需要一个替罪羊。一旦她发现自己在平冢老师那边下不来台，又不愿意自己去沾拒绝别人的脏水，你觉得她会怎么做？"

  他停顿了一下，似乎是觉得这件事已经麻烦得让人脑壳痛。

  "既然她已经打定主意要绕开正规途径，那在想到能够全身而退的完美计划之前，她一定会像甩不掉的鼻涕虫一样再贴回来。用更无辜的表情、更可怜的借口，然后继续纠缠。你的'最终答案'，恐怕连半天都撑不过去。"

  这句话像是一块粗糙的磨刀石，硬生生地刮在了一直保持着冷硬姿态的雪乃身上。

  原本正准备端起茶杯润润嗓子的雪乃，动作停滞在了半空中。她那双深蓝色的眼瞳微微放大。

  她缓缓将茶杯放回桌垫上，两道原本平整的眉毛不由自主地向中间聚拢，蹙成了一个不好看的、带着清晰挫败感与抵触情绪的结。

  那道皱起的眉心只维持了极短的几秒钟。

  雪之下雪乃并没有像普通人被戳穿盲区那样，产生恼羞成怒的反驳欲，或者用无意义的沉默来掩饰尴尬。她那张端丽的脸上，那抹因为预判失误而产生的不甘心迅速褪去，取而代之的是一种更为冷峻的、剥丝抽茧般的审视。

  "你是说……这里面还有别的委托方？"

  雪乃的声音在活动室里重新响起。这一次，语气中那股强行定调的冷硬感消失了，变成了一种带着压迫感的追问。她没有去看那杯已经不再冒着明显热气的红茶，而是直接迎上了比企谷八幡那双半垂着的死鱼眼。

  "如果她仅仅是为了逃避责任，大可以自己去找执行委员会哭诉，或者找任何一个能被她那套说辞打动的人。可是她却特意跑来了这里，并且在被拆穿后，依然固执地要求我们去'制造流言'。"雪乃的声音依旧平稳，但语速比刚才稍微快了半拍，"这不符合一个只想息事宁人的逃避者的行为逻辑。除非……这份名为'退选'的委托，其实并不完全出自她本人的意志。有人在背后迫使她必须采取这种绕远路的方式。"

  八幡原本还撑在椅子扶手上的手指微微僵了一下。

  他本来都已经准备好迎接那句诸如"不要把你那阴暗的下水道路人逻辑套用在所有人身上"的惯用毒舌了。结果，对方不仅完全没有顺着他的挑衅生气，反而像一台精密运转的计算机，在拿到新的变量后，立刻推导出了一个更加棘手的结论。

  "哈……"八幡有些脱力地叹了口气，刚才那股烦躁感反而变轻了一点，"还不算太迟钝。"

  他稍微坐直了身体，既然雪乃已经把话题切到了这个深度，他也就没必要再继续兜圈子。

  "那家伙刚拉开门的时候，可是把两个名字顶在前面的。"八幡用手指不耐烦地敲了两下桌面，"学生会长城廻学姐，还有那位总是喜欢把麻烦事强塞给我们的平冢老师。"

  他看着雪乃因为听到这两个名字而再度变得有些锐利的眼神，干巴巴地继续说道："如果是正常的恶作剧，作为生活指导老师的平冢静不可能不管；如果是有人恶意提名，城廻学姐也不会眼睁睁看着这种破坏学生会风气的事情发生。可是，她们两个却偏偏把这件需要'走正规程序'的事情，推给了我们这个专门处理见不得光麻烦的奉仕部。"

  "也就是说……"由比滨结衣的手指还僵在半空中，她看看八幡，又看看雪乃，终于后知后觉地反应过来，"一色学妹刚才说的那些不想当会长的理由是真的……可是，平冢老师和城廻学姐，其实是希望她当的？所以她们才不接受她那些退选的借口，硬生生把她推到我们这里来？"

  "恐怕不止如此。"

  这次接话的是一直保持安静的拉芙希妮。她那双翡翠色的眼睛在八幡和雪乃之间转了一圈，用一种像是在陈述某种家族晚宴上常见勾心斗角的平稳语气补充道：

  "如果老师和会长希望她上任，就不可能允许她利用奉仕部来制造'意外落选'。一色同学大概是被那两位大人逼到了死角，既不敢当面违抗她们的期望，又实在不想接手那个麻烦的位置。所以，她才想利用奉仕部，在这个看似正规的推介流程里，偷偷加入她自己设定的错误答案。"

  活动室里再次陷入了短暂的安静。

  只是这一次，不再是因为某一方单方面定论产生的高压，而是一种因为触及到了整个委托核心泥沼而产生的凝重。

  那个有着可爱的亚麻色短发、在进门时还显得有些局促的学妹，在她那副无辜的伪装之下，竟然藏着一套能够同时应付老师、前辈，并试图将奉仕部一起拉下水的精密算计。

  这根本不是一场可以用"拒绝"这两个字就能轻易打发走的闹剧。

  那份因为看透了深层算计而产生的凝重，在活动室里仅仅维持了十几秒。

  一直没有接话的拉芙希妮·都柏林，在这十几秒里始终保持着那种安静的观察状态。她那双翡翠色的眼睛在比企谷八幡和雪之下雪乃之间来回扫过，看着这两个试图将责任和阴谋彻底剥离出来的人，手指在膝盖上无意识地摩挲了一下那条烧焦的旧丝带。

  接着，她突兀地开口了。

  "比企谷同学。"

  她的声音依然平稳得像是在陈述这杯红茶的温度，与刚才那种充满了攻击性和防御性的逻辑推演格格不入。

  "平冢老师似乎有话要对你说。今天早晨她提到，让你去一趟教员室，把上周国语小测的错题集拿回来。"

  这句话像是一把钝刀，生硬地在刚才那张拉满的弓弦上砍了一记。

  原本正准备继续顺着城廻巡和平冢静的施压向下分析的八幡，被这句话硬生生地卡住了思路。他那双死鱼眼因为错愕而微微放大，视线从雪乃那边转了回来，落在了这个金发转学生身上。

  "……哈？"八幡从喉咙里挤出一个充满不解的音节。他敏锐地抓住了这句话里的时间漏洞。

  "今天早晨的事，为什么非要拖到现在才说？而且，如果是拿错题集这种事，那个喜欢用拳头讲道理的生活指导老师，怎么看都不像是会好心拜托别人传话的类型吧？她完全可以亲自冲到F班来把我拎过去。"

  面对八幡那充满了挑剔和审视的连串追问，拉芙希妮的表情没有出现任何诸如心虚或慌乱的裂痕。

  "因为我今天早晨刚好有些个人事务需要去教员室见平冢老师。既然碰到了，她就顺便将传信的任务交给了我。"

  她稍微停顿了半拍，给出了一句彻底堵死八幡退路的补充："至于为什么当时没有去F班找你……我想，比起在早读时间面对整个班级的围观，你应该更愿意在放学后的社团活动时间，接受这个可以合理离开这里的理由。"

  这句话说得坦然且无可挑剔，甚至还非常贴心地考虑到了八幡想要避开人群的社交习惯。

  八幡张了张嘴，试图找出反驳的切入点，但最终还是挫败地抓了抓头发。因为无论拉芙希妮这番话究竟是真的顺便，还是有意在打断刚才那场让人胃疼的权谋分析，摆在面前的事实是：平冢静确实在教员室等他，而他现在也确实有了一个完美的借口，可以暂时逃离这间空气已经变得有些稀薄的活动室。

  "……真麻烦。那我去一趟。"

  八幡站起身，拉动椅子发出的摩擦声。他随手把书包甩到肩上，视线不受控制地在长桌尽头那位金发转学生的身上扫过——只停留了不到一秒——落点是她那只被大方地垂在椅子侧边、左手腕上系着一抹沉稳红色的手。

  他没有说话。

  那道视线转开，八幡驼着背拉开了门，把那个关于一色彩羽背后推手的沉重话题连同自己一起，甩在了滑门发出的钝响之外。

  活动室里再次只剩下了三个人。由比滨结衣看着八幡离开的背影，似乎还没从这种强行切换的话题中缓过神来，愣愣地坐在那里。

  而雪之下雪乃，从始至终都没有对拉芙希妮刚才的发言插过一句话。

  她的身体维持着刚才坐直的姿态，视线却没有跟着离开的八幡移动。相反，她微微侧过头，那双如同深海般清冷的深蓝色眼瞳，就那样安静地、一错不错地停留在拉芙希妮的侧脸上。

  她没有出声质问为什么在这个时候掐断线索，也没有用那套严苛的正论去评判这通传话的真伪。她只是看着，用那种仿佛能看穿一切伪装的锐利，注视着这个试图用最生硬的方式把麻烦挡开的转学生。

  ——八幡视角——

  教员室里特有的那股混合着打印机墨粉和发黄纸张的味道，在深秋的下午显得格外沉闷。

  比企谷八幡推开门走进去的时候，平冢静并没有像拉芙希妮借口里说的那样，正在准备什么上周的国语错题集。她只是靠在那张堆满文件和马克杯的办公桌后，手里转着一根红色的圆珠笔，目光从一叠志愿调查表上抬起来，落在这个带着一身抗拒感走进来的学生身上。

  在这个充满成年人工作压力的房间里，她白大褂下摆的轻微晃动，是唯一显得稍微有些活力的东西。

  "比我想象中来得要快一点。"她停下了转笔的动作，笔尖在桌面上轻轻敲了一下，"看来都柏林同学找了一个不错的理由。我还以为你要在那个活动室里多憋一会儿。"

  八幡走到桌前，习惯性地塌下肩膀，让那双死鱼眼显得更加生无可恋。"随便找个人当借口这种事，以后还是免了吧。而且，"他抓了抓后脑勺那些凌乱的头发，"在那几个家伙面前耍这种低级的障眼法，迟早会出问题的。"

  平冢静不可置否地将手里的圆珠笔扔到一旁，身体稍微坐正了一些。她并没有在这件微不足道的借口上纠缠，也没有打算去深究奉仕部里刚才到底发生了怎样的权力博弈。那本来就不是她把麻烦丢过去的重点。

  她看着八幡，单刀直入地抛出了那个问题："那么，撇开那些掩饰和借口不谈。你觉得那个学妹……怎么样？"

  这是一个宽泛的问法，没有明确的定语，也没有限定讨论的方向。但站在这张办公桌前的两个人，都非常清楚这个"怎么样"指的是什么。

  八幡再次发出一声充满疲惫的叹息。他把视线从平冢静那件略显宽松的白大褂上移开，停留在桌角那叠整齐的调查表上，声音里带着一种看透了底牌后的干瘪与不耐烦。

  "她根本不想落选。"

  他几乎没有经过任何停顿，就把那个一年级学妹精心包装了好几层的可怜外壳一把扯了下来。

  "那种因为不想连累别人、所以才拜托我们帮忙制造'意外'的说辞，不过是她为了给自己的虚荣心找的遮羞布罢了。如果真的想逃避，她有无数种可以直接脱身的方法，而不是跑来找一个名声不太好的边缘社团。"

  八幡的视线重新回到平冢静的脸上，那双平时总是显得缺乏干劲的眼睛里，此刻透着一种精准得有些可怕的锐利。

  "那个家伙……她只是在畏惧'承担责任'这件事。而城廻学姐，"他停顿了一下，把那个始终没有真正露面的前任会长的名字搬了出来，"城廻学姐把她推过来，实际上是想让她当选。"

  教员室里安静了几秒。

  平冢静看着这个总是习惯把所有事情往最坏、但也最真实的方面去想的学生。她的嘴角逐渐扬起一个不带嘲讽、反而带有几分赞赏的弧度。她没有反驳，也没有拿出什么大人的说教去纠正这套听起来有些悲观的逻辑。

  "眼光还是一样毒辣啊，比企谷。"

  她拉开抽屉，似乎在寻找什么，同时用那种不紧不慢的语调继续说道："城廻那个孩子，确实不擅长应付那种会把'不想做'写在脸上的人。但她看人的眼光，有时候准得连我都会觉得头疼。"

  平冢静的手停在抽屉里，但并没有把里面的东西拿出来。她隔着桌子，用一种带有压迫感却并不严厉的目光锁定了八幡。

  "既然看穿了这一层，你打算怎么做？继续坐在那个活动室里，看着她们把这种毫无意义的推诿游戏玩下去吗？"
