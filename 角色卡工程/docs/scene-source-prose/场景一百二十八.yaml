场景: 128
幕: "第九幕·以自己的名字委托"
时间: "2014年11月7日 · 周五放学后"
地点: "总武高特别栋奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、比企谷小町、川崎大志"
POV: "共享场景／零POV"
正文: |
  立冬那天，千叶的风从早晨起就明显变了温度。中午时分特别栋背后的银杏叶被吹落大半，窗台上压着一片完整的黄色，叶柄还在轻轻动。

  放学后部活刚开始，小町把今天的活动日志收进文件柜，回头看见桌面上摊着一张A4白纸。她没有问，跑去茶柜倒了两杯麦茶——一杯自己，一杯推给大志。

  "前辈们有正事要做了。"她对大志说，"我们今天先回去吧。锁门的事昨天轮到我，今天该你了。"

  "……有这么明显的味道吗。"大志把麦茶两口喝完，"那告辞了。"

  两个人在门口停了半秒——小町把一句话吞回去了，又吞回去一次，最后只说了"明天见"。门关上以后，活动室里只剩四个人。

  那张白纸的中线已经被雪乃用水笔提前画好。一整页分成四列，顶端写着：留日期间生活与个人选择之可承担方案。日期：二零一四年十一月七日。这一行写得很工整，写完以后雪乃把笔盖了回去，没有填下一栏。

  "上次说好你先开价。"八幡把在前面设下的那张委托记录翻开放在桌面另一边作为参照，"受理中那一栏现在还挂着。"

  "我知道。"拉芙希妮把白纸推到四个人中间，"今天我带来的是草稿。三个分工栏我让出来给你们各自填。最右一栏我自己。"

  "怎么用，先说。"八幡问。

  "左边起。"拉芙希妮沿着白纸的三道竖线指过去，"一栏给雪之下同学，处理我留日期间在升学、在留、住所上的可承担方案，以及信托支出与家族权利之间的边界。第二栏给比企谷同学，列失败条件，舆论上最坏的结果，备用路径，以及"——她停了一下——"一个人如果把自己牺牲掉了，怎么被我或你们拦下来。"

  "反自我牺牲条款。"八幡接，"那栏是我的。"他打开圆珠笔的盖。

  "第三栏给由比滨同学。"

  结衣抬眼。

  "朋友、节日、日常联络，以及我真正想保留的生活内容。"拉芙希妮把话读到一半，自己也接了下去，"可承担的方案里，这类东西该有，不想被排到备注。"

  结衣的手指在桌面上轻轻按了一下。

  "知道了。"

  雪乃的水笔已经在左栏写了几行。她写得很整齐，写完两行以后把笔帽再盖回去，向拉芙希妮那边问："信托支付房租时需要由谁出具证明？"

  "温斯顿先生代办，他的署名加受托银行的账户备案。"拉芙希妮说，"额度按二〇一四年的生活费标准，每年续一次。大学的报名与考试费由信托划付，走教育费用一栏。"

  "在留资格呢。"

  "续在留期间仍然由温斯顿先生做联络人。变更内容只在我把十八岁以上的身份证明文件交上去那一刻才会发生。他也只是替我跑手续，不再向家族那边汇总。"

  雪乃听完没有反驳。她把"温斯顿代办"四个字写在边上，又用括号注了一句"必要时由奉仕部复核与委托相关的部分"。

  八幡的栏上写得比较满。前两栏——"大学落榜"和"舆论风评滑坡（沿用去年相模南事件的样本）"——他用干瘪注释堆叠，第三栏"备用路径：四年制大学之外，考虑专门学校与插入编考试"。第四栏反自我牺牲条款，他写了三行：①本人不因任何长辈的压力话改写退出申请的内容；②未经本人书面同意，任何人都不得替本人签字放弃权益；③一旦本人出现自我牺牲性的让步，记录立即由奉仕部提交高坂理津子。

  窗台上那片完整的银杏叶被一阵风顶到窗缝里，又落了下去。雪乃抬起头看了一眼，没动。

  结衣的栏空了比刚才久。

  她拿起水笔，反复把笔帽拔下来又盖回去，最后落在纸上的东西出人意料地短：

  · 一年里要见到朋友的几天：拉芙希妮酱的生日、圣诞、新年、初诣、七夕，还有小企和小雪乃的生日——生日是两套。
  · 每周一次群聊、见面至少两次，不见面时回信不过夜。
  · 留在千叶要保留的一件事（这一格留给拉芙希妮酱自己填）。

  写完，结衣把笔放下，朝拉芙希妮那一边转过去。

  "我看了一下整张表——雪乃的、八幡的、我的。"她说，"全都是替你想好的事，替你列好的事。没有一行是你真正想做的事。"

  拉芙希妮看着自己的最右栏，那里还空着。

  "我写了……"她说，"升学方向已经想清楚。大学以下可承担的住所，最坏情况下的备用路径，家族权利边界的整套说法。这些就是我想保住的事情。"

  "那是条款。"结衣声音不高，"不是愿望。"

  窗外的风又压了一下，玻璃上的银杏叶从窗缝被吹走了。

  "我想填的是愿望。"结衣说，"一年以后、五年以后——你买第一本书给我的时候，我希望上面写着的是你真正想要的那种句子。现在用公文填的那一栏，我读了三遍读不出你想要什么。"

  雪乃的水笔停在纸上。

  八幡没说话。他把自己那栏的反自我牺牲第三款又描了一眼。

  拉芙希妮把水笔接过来。

  她的最右栏还只有顶端那个"综合方案·最终签名"的题头，没有内容。她坐直一点，手腕压在桌沿，写下第一行字，比结衣的笔速慢：

  "我想成为作家。"

  四个字一个字一个字写完，最后那个句号很轻地按下去。

  八幡把MAX咖啡罐从嘴边拿开一公分。

  结衣没有惊呼。她看了一眼那行字，把笔盖按回去。

  "……找到了。"她说。

  "升学方向在这一行下面再写一行。"雪乃把纸轻轻往拉芙希妮那边推，"早稻田大学文学方向相关专业。"

  "嗯。"拉芙希妮写下第二行。

  那一行字写得比上一行快，因为那是她早想过很久的事——不是今天才想出来的，只是今天才被写下来。

  写完以后，她把笔放回桌面，没有递给谁。

  "整体方案和最后的签名在我手上。"她说，"明天之前我整理完成。今天到这里，可以吗。"

  "可以。"雪乃说——她的水笔帽还没合上，把笔尖朝里收了一下，又抬头，"我们各自只读自己登记的那一栏。是否公开，由你下次部活日告诉我们要公开哪几栏。"

  "嗯。"

  八幡把自己那栏的反自我牺牲条款第三款又点了一下。

  "我没动你的栏。"他说，"所以万一你下笔写的是'牺牲我可以',那就是三年不见一个有效举报的志向。我把这一栏留给告发口用。"

  "我明白。"拉芙希妮说。

  茶柜里的六只杯子今天只用了四只。另外两只一直是给小町和大志留的，一只新米色杯、一只碎花杯，今天没下桌——小町走前往大志那边推过一杯麦茶，又给自己留一杯，没把整套茶具流程拿出来。

  拉芙希妮把那张A4纸对折两次，收进口袋。右边袖口理平的时候，左手腕的红绸带从袖缝里露出半厘米，被另一阵风顶回去。今天立冬，但银杏只是少了，还没有全掉。
