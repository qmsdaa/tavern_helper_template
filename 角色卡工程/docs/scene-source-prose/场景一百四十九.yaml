场景: 149
幕: "第十幕·冬去春来"
时间: "2015年3月17日 · 周二"
地点: "总武高特别栋奉仕部活动室"
人物: "比企谷小町、川崎大志、比企谷八幡、雪之下雪乃、由比滨结衣、拉芙希妮·都柏林、高坂理津子、一色彩羽"
POV: "共享场景／零POV"
正文: |
  三月十七日。毕业典礼之后两天。三年生已经不用来学校了。四个人今天是专程回来的——为了交钥匙。

  活动室的门开着。小町和大志站在长桌前。桌上放着一本新的记录簿，黑色封面，还没有翻开过。旁边是一份文件夹——"奉仕部·正式社团·引继文件"。

  高坂理津子坐在靠窗的椅子上。她把新奉仕部的成员名单摊在膝盖上，用红笔逐行核对。部员两名——比企谷小町、川崎大志。原中学部部员两名。顾问，高坂理津子。她核对了三遍，在签名栏写下名字。

  "字很轻。"小町凑过来看。

  "正式部门的顾问，不替正式部门做决定。"高坂说。"我的签字，只证明你们满足章程条件。剩下的判断，由你们自己。"

  "这个方针——"

  "是你们的前辈用了两年多教会我的。"她合上笔帽。"他们从最初的五人——四个人，一路做到现在。我没有帮过什么实质性的忙。除了最后这件事。"

  "签字就是实质性的。"

  高坂看了小町一眼，没有回答。她把文件夹交给雪乃。

  "雪之下同学。这是正式部门的最终确认书。作为前奉仕部实质运行负责人，请你签收。"

  雪乃接过笔。她翻到文件夹最后一页。确认栏——"引继人"那行，已经有四个名字了。比企谷八幡、由比滨结衣、拉芙希妮·都柏林、雪之下雪乃。笔迹不同，墨水不同。八幡用的是圆珠笔，下笔很重。结衣用了铅笔——她的水笔写到一半没水了。拉芙希妮用了黑色水笔，字迹细而清楚。雪乃在最后一行签了自己的名字，把笔还给高坂。

  "引继完成。"高坂说。

  一色站在门口。她今天穿了学生会的正式会服，手里拿着一份盖过章的文件。她走到长桌前，把文件放在新记录簿旁边。

  "学生会编号二〇一五——〇〇一。新奉仕部第一份正式委托。"她说。"盖章。委托人是学生会。委托事项——协助学生会筹备本年度入学式与部活动说明会。"

  她的语气没有什么特别的。和两年前第一次给奉仕部发委托邮件时一样的淡。

  八幡拿起那份文件。"第一份委托——以前是短信。"

  "那时候的短信也是委托。只是没有盖章。"一色说。"现在不一样了。新奉仕部是正式部门。委托人需要盖受理章。受理部需要按章程回复。"

  "你学会盖章了。"

  "章是前辈们留的。"她说。顿了一下。"我不是那根接力棒。接力棒是学生会长传给下一任的。我不是。我是——这份委托。新奉仕部的第一份盖章委托。"

  雪乃把新记录簿翻开到第一页。她把一色的委托文件按日期登记——基本事项、委托人、受理期限。登记完，笔帽按回去。

  "受理中。"她说。

  小町接过记录簿。她翻开封面，在扉页上写了几个字：奉仕部。正式社团。部员——她停了一下，抬头看了看大志。大志点了一下头。她把两人的名字写在同一行。

  "还有四名中学部部员。"大志说。"下周开部会，让每个人自己写。"

  八幡从口袋里摸出那把黄铜钥匙。磨得发亮的那把。活动室的门、书架上的锁柜、窗台的防风扣——一把钥匙开所有的锁。他把钥匙放在桌上。前天毕业典礼之前它躺在这里，今天再放一次。

  小町接过去。钥匙还是温的，在八幡的口袋里揣了两年多，沾了体温。她把钥匙环套进食指，转了一圈。

  "这间活动室——"她说。"你们搬进来的时候，是什么样。"

  "很旧。"雪乃说。"书架上有灰。茶柜是空的。窗台上有上一批人留下的便签——黄色的，写了一半。"

  "那现在呢。"

  "书架有灰。茶柜空了。窗台上——"她看了看那片银杏叶的位置。叶子和姓名签一起带走了。"窗台现在也是空的。"

  "那不是一样吗。"

  "不一样。"八幡说。"书架知道该放什么。茶柜知道杯子怎么排。窗台知道叶子和便签的区别。"

  小町没有接话。她把钥匙扣进自己的钥匙圈里。和家里的钥匙、自行车的钥匙碰在一起。

  "那就从这个开始。"她说。"今天下午——先把杯子摆回去。新杯子。不是前辈们的。是我们的。"

  四个人把自己那格茶柜里的杯子拿出来。用报纸包好的，一人一只。八幡的马克杯——杯壁上还有最后一次喝MAX咖啡留下的很淡的咖啡渍。雪乃的白色瓷杯。结衣的米色杯子。拉芙希妮的深蓝色杯子。小町和大志的杯子已经在家里的碗架上——下周带来。这四只杯子，今天带走。

  结衣把杯子抱在手里。"好轻。"

  "因为是空的。"拉芙希妮说。

  "不是。是因为——杯子里面装过的茶，已经不在里面了。那些茶在这里。在别的地方。"

  她把脸埋进报纸包的褶皱里。没有出声。米色杯子的杯口沾了她的一点睫毛水，亮亮的。

  拉芙希妮把深蓝色杯子收进自己的手提袋。八幡的马克杯进了书包侧袋。雪乃把白色杯子用围巾多包了一层。她从水笔筒里抽出自己那支水笔，放在空的笔筒里。不是留给小町和大志。是留给这间活动室。

  高坂站起来。"我先告辞。一年级那边有入学式的筹备会。奉仕部——新的，这是你们第一次部会。明天的日程，你们自己决定。"

  她走了。出门的时候在门口停了一步，但没有回头。

  一色把学生会文件夹夹在腋下。"前辈们。再见不是在校门口说的。再见是——在下一次我自己盖章的时候。"

  她走了。

  走廊里安静下来。下午四点。透过活动室的窗户，能看见操场上有足球部的成员在跑步。白线刚画过，很新的白。

  小町站在长桌前。桌上放着新记录簿、新文件夹、高坂签过字的那份名单。大志在旁边站着，两人的肩距和昨天一样。

  "前辈们。"小町说。"奉仕部——新的。什么都不会变。"

  "不是不会变。"八幡说。"是变的东西——你们自己决定。"

  小町把新记录簿翻开。第一页，一色的委托，雪乃的字。第二页空着——空着是给未来。

  她把笔放在记录簿旁边。那支笔是新的，还没写过字。

  "下周一。"她说。"第一份自己受理的委托。委托人不知道是谁。小町希望——是个和今天的我们一样不知道怎么办的人。"

  "然后呢。"结衣说。

  "然后告诉他——这里的人也不知道怎么办。但是这里的人会听。你讲多少，我们听多少。你不讲——"她看了看大志。"我们就等。"

  大志点了点头。"等是受理的一部分。"

  四个人走出活动室。小町和大志关上了门。钥匙在小町的钥匙圈上，碰着那几把旧的钥匙。冷风从走廊里穿过来。三年级教室的灯都灭了，特别栋剩下这一间还亮着的房间。这间房间不会灭。下周，换人开灯。
