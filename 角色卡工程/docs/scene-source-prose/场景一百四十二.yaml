场景: 142
幕: "第十幕·冬去春来"
时间: "2015年2月25日 · 周三"
地点: "比企谷家（客厅·八幡房间）"
人物: "比企谷八幡、比企谷小町、比企谷母亲（背景）"
POV: "共享场景／零POV"
正文: |
  二月二十五日。国立大学二次试验的前一天。

  傍晚六点，比企谷家的客厅亮着暖黄色的灯。电视开着，音量很低，在播千叶本地的天气预报。明天晴，最低气温一度，北风转弱。

  八幡坐在暖桌里。面前摊着一本参考书的最后一章。书页的角被翻得发毛，封面贴了三条胶带。小町趴在暖桌另一侧，下巴搁在桌面上，手机横着拿，游戏画面停在结算界面。

  "哥哥。"

  "嗯。"

  "明天几点的考试。"

  "上午九点半。下午还有一科。"

  "考场在千叶大学。"

  "你知道还问。"

  小町把手机翻了一面。"小町在想——去年这个时候，哥哥还说自己要当家庭主夫。"

  "那是开玩笑。"

  "真的吗。小町觉得那个时候的哥哥，有一半是认真的。"

  八幡翻过一页。参考书的纸很薄，翻页的时候能透出背面的字。

  "那时候不知道除了开玩笑还能怎么面对。说'我要去好大学'——听起来不像我。说'我无所谓'——那是假的。"

  "那现在呢。"

  "现在知道假的和无所谓的中间，还有别的说法。"

  小町撑起上半身。"什么说法。"

  "千叶大学法政经学部。社会科学方向。"

  "那不就是正常的志愿吗。"

  "嗯。"

  "哥哥说了正常的志愿。用正常的语气。"

  "然后呢。"

  "然后——"小町把手机放进睡衣口袋。"没有然后。就是这个然后本身，小町觉得很重要。"

  八幡合上参考书。封面的胶带有一截翘起来了，他用拇指按下去，胶带又弹回来。

  "妈呢。"

  "超市。说今晚吃寿喜烧。明天考试要吃肉——妈妈的原话。"

  "她又信这种迷信。"

  "她说你去年考共通テスト的时候也吃了肉。那次考过了。"

  八幡没有接话。他把参考书放进书包，拉链拉了一半。书包是三年级的，底部磨出一个洞的轮廓，还没有破。

  小町从暖桌底下伸出一条腿，踢了踢他的椅子。

  "哥哥。"

  "又怎么了。"

  "你是什么时候开始认真想未来的。"

  八幡站起来，走到厨房倒了杯水。水壶在炉子上，还是中午烧的，已经凉了。他端着杯子站了一会儿。

  "千叶村合宿的时候，奉仕部接了一个委托。一个叫鹤见留美的小学生。大概是小町现在的年纪。她被全班孤立了。"

  "嗯。你以前提过。"

  "那时候我的解决方式是——破坏全班的人际关系。让每个人都被迫站在同一条线上。谁都不特殊，谁也伤害不了谁。"

  小町没有说话。

  "后来被雪之下和由比滨骂了一顿。被拉芙问了一个问题——'比企谷同学，你把自己也算进牺牲品里了。'"

  "然后呢。"

  "然后就发现——用自爆解决问题，这个东西在我身上。不是偶尔出现一两次，是习惯。遇到事情先想怎么牺牲自己。这样就不用想'自己想要什么'了。"

  "因为想'想要什么'比牺牲自己更难。"

  "对。"

  小町把暖桌被子拉上来，盖住膝盖。

  "所以哥哥开始'认真想未来'——是因为不想再自爆了。"

  "是因为被人指出来了。"八幡说。"被人指出来之后，不能假装不知道。"

  "那大学——"

  "不是逃避。也不想拿来证明什么。就是——"他喝了口水。"这两年在奉仕部做的事——听人说、帮人想办法、查规则、写方案——做的时候不觉得有什么。做到后来发现，不是因为'我擅长帮人'。是'我确实在意别人怎么被对待'。"

  "那就是适合的。"

  "可能吧。"

  小町把腿收进暖桌被子里，抱起膝盖。

  "哥哥变成这样了，小町有点不习惯。"

  "哪样。"

  "以前说'家庭主夫'的哥哥，是用玩笑回避所有认真的事。现在的哥哥——不回避了。虽然语气还是那种'我就是随便努力一下'的语气——但是不回避了。"

  八幡把杯子放在桌上。杯底磕在木桌上，轻轻的一声。

  "小町。"

  "嗯。"

  "你也认真。数学再不及格，川崎就白给你吃那七批巧克力了。"

  "为什么突然跳到这里！而且那七批是他自己愿意吃的！"

  "是。是他自己愿意的。"

  八幡的语气没有变化。但后半句的停顿，比前半句多了一拍。

  小町从他手里抽走杯子，去厨房重新倒了杯水。这次是热的。她把杯子放回八幡面前。

  "哥哥。明天的考试，小町帮不了什么。但是——明天早上，小町会起来做饭团。梅干的。你以前说过，考试前吃梅干，脑子会清醒。"

  "那个也是迷信。"

  "妈妈有迷信，小町也有迷信。你不要双重标准。"

  厨房那边传来塑料袋的声音。母亲回来了，门口一声"冷死了"，环保袋放到台面上，开始往冰箱里塞东西。

  "对了！妈买了牛肉吗？"

  "买了！"母亲的声音隔着半间屋子传过来。"还有你爱吃的豆腐！"

  "不是给哥哥考试的慰问吗为什么买我爱吃的！"

  "吃了豆腐你也考好期末考试！"

  "小町的期末已经考完了！"

  八幡站起来，帮母亲把蔬菜往冰箱里搬。母亲看了他一眼。

  "明天考试？"

  "嗯。"

  "几点出门。"

  "七点四十。"

  "那六点半叫你。考完了想吃什么。"

  "随便。"

  "妈妈煮什么都说随便。考完了至少想想。"

  八幡接过一把葱，放进冰箱的蔬菜格。母亲把牛肉放进冰柜，关上冰箱门。厨房里剩了塑料袋的窸窣声和灶台边洗菜的水声。八幡回到暖桌前，参考书的最上面放着一支削好的铅笔。不知道什么时候削的。

  小町趴在暖桌上，游戏画面又开了，结算界面亮着。

  "哥哥。"

  "嗯。"

  "'不回避认真的事'——这句话是小町今年给哥哥的情人节回礼。没有买巧克力，因为小町自己做了。这句话是另外做的。"

  八幡拿起那支铅笔，在参考书封面的胶带旁边写了两个字。字很丑。

  "什么——"小町凑过去看。"......'收了'？"

  "嗯。"

  小町笑了。她在被子里翻了个身，拿起手机，继续下一局。

  第二天早上六点二十。厨房亮着灯。小町站在炉子前面，围裙系在睡衣外面。砧板上放着两个不成形但捏紧了的饭团。梅干的味道从海苔的缝隙里漏出来。
