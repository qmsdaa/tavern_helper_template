场景: 63
幕: "第四幕·冬假→三学期"
时间: "2013年12月25日 · 圣诞节 · 20:30 · 爱布拉娜视频通话结束后"
地点: "拉芙希妮的公寓"
人物: "拉芙希妮·都柏林（POV 独占·+隐性提及：爱布拉娜、雪之下雪乃、由比滨结衣）"
正文: |
  视频通话切断的提示音，在空旷的客厅里短促地响了一声，随后被厚重的羊毛地毯迅速吸干了余音。

  拉芙希妮的身体维持着刚才端坐的姿态，手指从屏幕上移开，将那部旧款智能手机轻轻放在了冰冷的玻璃茶几上。她刻意将屏幕朝下扣放，动作很轻，没有发出碰撞的声响。但那只白皙的手却没有立刻从机身上收回，指尖依然虚搭在冰冷的边缘。

  深绿色的地毯上，高地风景画的阴影被壁灯拉长。拉芙希妮的视线顺着自己的手背，长久地停留在手机背面那个属于都柏林家族特制的暗纹徽记上。

  那就是一张网的中心。

  刚才那十几分钟的通话里，那个遥远而温柔的声音并没有对这间公寓里"不合规"的粉色发卡提出任何质问，也没有表现出任何对她越界行为的察觉。但那张网，却以一种更令人窒息的方式，直接罩了下来。

  "十二月三十日左右，我会抵达成田机场。"

  "新年第一天，东亚部那边安排了几次必要的会面。拉芙希妮，你来陪我一起。"

  没有商量，没有询问，甚至不需要她确认档期。那只是一个通知。姐姐的声音一如既往的从容优雅，就像在讨论明天早餐该配什么果酱一样。

  拉芙希妮将手从茶几上收了回来，交叠着放在膝盖上。指尖的温度有些偏低。

  还有五天。

  那道属于塔拉庄园的长姐阴影，即将跨越半个地球，真实地降临在这个她好不容易才寻找到一点点呼吸空间的地方。那意味着什么，她比任何人都清楚。那意味着刚才在站台上的约定、那张写满纠错公式的草稿纸、那句略带冒失的"我们一对哦"。

  她慢慢地从沙发上站了起来。即使是在没有监控的独处时间里，她起身的动作依然符合最严苛的社交礼仪，脊背挺得笔直。只是在那一瞬间，有那么轻微的晃动。

  拉芙希妮穿过那片被松香填满的走廊，再一次走进了盥洗室。

  水槽上方的冷色调壁灯依然亮着。她站在宽大的半身镜前，目光没有去看那苍白的脸色，也没有去看那双因为长期维持完美表情而有些空洞的翡翠色眼瞳。

  她的视线，直直地落在了右侧耳畔。

  那里，别着一枚廉价的、带有工业毛刺的粉色塑料发卡。

  在这个属于都柏林家族的、冷酷且严丝合缝的体系里，这抹粉色是如此的刺眼。在刚才长达十几分钟的视频通话中，在面对着那个能主宰她命运的掌控者时，她始终戴着它。

  她没有摘下来。

  手指缓缓抬起，但并没有去触碰那个发卡，而是隔着一点距离，虚虚地护在了旁边。

  "还有五天……"

  拉芙希妮的声音很轻，轻得只有她自己能听见。在这个充斥着高级香氛和冷硬规矩的空间里，她看着那一点突兀的粉色，原本空洞的眼底，慢慢积聚起了一丝微弱却未曾熄灭的亮光。

  盥洗室的冷光被拉芙希妮关在门后。当她重新踏入铺着深绿色羊毛地毯的客厅时，那种由琥珀松香和高地油画构成的压迫感再次迎面扑来。

  这间公寓太大了，也太静了，静得只能听见中央空调轻微的运转声。

  拉芙希妮慢慢走到沙发前。茶几上，那部倒扣着的旧款智能手机依然扣在原位。屏幕朝下，背面的暗纹徽记正对着壁灯。

  但在手机的另一侧，放着一本薄薄的、边缘有些起毛的线圈笔记本。

  那是今天从雪乃公寓里带回来的，用来记录错题的本子。

  相比起在这个充斥着高级定制家具和冰冷规矩的空间里，这本随处可见的文具显得过于普通。但拉芙希妮的视线却久久地停留在那上面。

  她微微低下头，目光落在了自己的左手腕上。

  深蓝色的冬季校服大衣在之前被换下，此刻她身上穿着一件单薄的居家针织衫。袖口微微有些滑落，刚好将那根缠绕在手腕上的红绸带完全遮住。

  那是那晚在京都的旅馆里，那个总是用逻辑包裹自己的少女，在黑暗中强硬地系在她手腕上的。

  拉芙希妮的右手指尖虚虚地悬停在左腕上方。平时，如果是衣服褶皱哪怕只偏移了半毫米，她也会下意识地将其整理到绝对完美的刻度。但此刻，看着那被柔软毛线掩盖住的红色，她并没有去拉扯袖口让它重新露出来。

  她慢慢弯下腰，避开了那部倒扣的手机，将那本线圈笔记本拿了起来。

  纸张的触感干燥而粗糙。

  拉芙希妮绕开茶几，走到沙发最深处的阴影里。她没有像平时那样端正地坐下，而是脱掉了脚上的室内软底鞋，将两条修长笔直的腿收拢到沙发上，然后双臂交叠，将那本薄薄的笔记本紧紧地抱在了胸前。

  下巴轻轻抵在笔记本硬质的封面上。虽然只隔了半天的时间，但当鼻尖凑近纸页的边缘时，她仿佛还能闻到一点属于雪乃公寓里那种带着涩味的红茶香气。

  拉芙希妮将脸偏过去，一半埋进膝盖与手臂形成的缝隙里，闭上了眼睛。
