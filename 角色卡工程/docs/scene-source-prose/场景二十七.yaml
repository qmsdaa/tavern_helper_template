场景: 27
幕: "第三幕·二学期"
时间: "2013年9月中旬 · 二学期开学后不久"
地点: "奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、平冢静"
正文: |
  活动室里的那股微妙默契还没来得及完全沉淀，拉门就被粗暴地拉开了。
  金属滑轨发出一声刺耳的摩擦声。平冢静穿着标志性的白大褂，大步迈进教室。她手里拿着一卷厚厚的文件，夹带进来的除了走廊里闷热的空气，还有一丝极淡的烟草味。

  "看来你们的假期过得都太安逸了，"平冢静将那卷文件直接拍在长桌的正中央，发出一声闷响，"闲聊到此为止。有新委托了。"

  比企谷八幡的眼角抽动了一下，身体本能地往椅背深处缩了缩："……如果是寻找丢失的宠物或者指导小学生写作文，请允许我拒绝。我的开学综合征正在发作。"

  "很遗憾，比企谷，这次你们逃不掉。"平冢静拉过一张空椅子坐下，双手交叉垫在下巴下面，目光扫过在场的四个人，"学校即将举办文化祭。但今年各社团和班级的申报项目激增，文化祭执行委员会的人手出现了严重短缺。部分环节的筹备进度已经陷入停滞。"

  雪之下雪乃停下了正准备端起红茶杯的动作。她深蓝色的眼眸里闪过一丝极快的审视，随后声音冷淡地响起："执行委员会人手不足，说明学生会前期的统划能力与人员配置存在根本性缺陷。这属于行政管理失职，而非单纯的劳动力短缺。"

  "说得没错，雪之下。"平冢静没有否认，反而露出了一个有些复杂的笑容，"但现状是，如果没人去填补这个漏洞，今年的文化祭可能会变成一场灾难。奉仕部作为'协助学生解决困难'的社团，理应在这个时候参与进去。"

  由比滨结衣立刻坐直了身体，琥珀色的眼睛里亮起了光："文化祭！也就是说，我们可以去帮忙布置会场，或者参与什么特别的企划吗？"
  "主要工作是协助执委会处理后勤、进度督促以及解决各班级之间的纠纷。"平冢静补充道。

  "纠纷调解……"八幡干瘪的声音再次响起，带着毫不掩饰的厌恶，"这种听起来就会被当成炮灰和出气筒的差事，也就是所谓的'参与'吗？"

  在这短暂的交锋中，雪乃的余光捕捉到了旁边的微小变化。
  拉芙希妮依然维持着端正的坐姿，但她原本平放在桌面上、正准备翻开那本英日对照诗集的手指，却在半空中停住了。那是一个微不可察的收缩动作。浅金色的长发微微垂下，遮住了她侧脸的表情。
  文化祭。
  雪乃的大脑在一瞬间调取了这个词汇背后所代表的高强度集体曝光、混乱的社交网络以及不可控的人际边界。这对于任何一个试图将自己藏在"观察者"位置上的人来说，都是最糟糕的处境。

  "平冢老师，"雪乃的视线从拉芙希妮身上收回，笔直地迎上平冢静的目光，语气变得更加清晰且不留余地，"奉仕部的原则是'提供帮助'，而非'代替完成'或'充当免费劳动力'。如果我们介入，必须拥有对所接手事务的干预权，并且我不接受无组织的低效指挥。"

  "当然。我不会干涉你们如何完成委托。"平冢静站起身，伸手在白大褂的口袋里摸索了一下，像是在找烟，但很快又把手抽了出来。她的目光在离开前，有意无意地在拉芙希妮手腕的丝带上停留了半秒，"那么，明天放学后，去第三会议室报到吧。那里是执行委员会的大本营。"

  拉门再次被合上，震得窗玻璃微微发颤。

  活动室里陷入了短暂的安静。
  八幡烦躁地扒拉了一下头发，结衣则有些担忧地看着雪乃。
  雪乃端起那杯稍微有些变温的红茶，抿了一口。苦涩的单宁味道在舌尖散开。

  活动室拉门被震得微微颤动的余波还未完全平息。
  由比滨结衣有些不安地抓住了自己书包的背带，身体微微前倾，打破了这份有些沉重的安静。
  "那个……小雪乃，"结衣的声音里带着明显的迟疑，"其实，今天班会上，相模同学自荐当了文化祭执行委员长。就是那个……相模南同学。"

  "相模南？"雪之下雪乃将刚刚端起的茶杯又放回了杯垫上，瓷器碰撞发出一声轻微的脆响。她的大脑里并没有立刻调取出关于这个名字的具体面部特征，对于缺乏实际交集的人，她通常只保留最低限度的识别信息。

  "一条蛇。"
  比企谷八幡干瘪的声音从长桌对面飘了过来。他甚至没有抬头，只是用食指有一下没一下地敲击着桌面，"或者说，是一个极度渴望站在聚光灯下，却又随时准备把烂摊子甩给别人的空壳。为了速成就戴上头衔，这就是那家伙的生存方式。如果是由她来主导执委会，人手短缺和管理混乱完全是必然结果。"

  雪乃侧过脸看了八幡一眼。虽然她经常反驳他那些充满自我厌恶的生存哲学，但在评估人际关系的虚伪与劣根性这一点上，她很少怀疑八幡的精准度。
  如果这个相模南真如他所言，是一个虚荣且习惯逃避责任的个体，那么明天第三会议室的状况，只会比平冢静描述的更糟。更重要的是，这种人必然会试图利用任何可以抓取的外部劳动力——比如被派去"协助"的奉仕部。

  雪乃的余光扫过坐在身边的拉芙希妮。
  从结衣提到执委会开始，拉芙希妮的左手就一直搭在右边的手腕上，虽然没有用力摩挲那条旧丝带，但手指的关节呈现出一种蓄势待发的收紧状态。那是一个习惯了在不可控环境中随时准备防卫的姿态。让这样一个还在进行"融入练习"的转学生，直接暴露在充满推诿和权力试探的混乱群体中，显然违背了奉仕部（也是雪乃自己）追求效率与秩序的原则。

  "如果是这样，那我们就更有必要确立不可逾越的边界。"雪乃收回视线，声音恢复了那种不带任何商量余地的冷淡，仿佛在下达一项最终判决，"明天的会议上，不论对方提出什么要求，奉仕部的职责仅限于'辅助处理积压事务'。我们不接受临时的行政指派，也不负责填补他们自身无能而产生的职位空缺。"

  她顿了一下，目光依次扫过长桌边的三人。
  "由比滨同学负责外围的人员协调，尽量避免直接冲突。比企谷同学，你的任务是利用你那异于常人的恶意雷达，甄别哪些是合理诉求，哪些是纯粹的推诿。"
  最后，雪乃的视线落在了拉芙希妮叠放得整整齐齐的诗集上。
  "至于都柏林同学，考虑到文件处理的精确度和信息的整合效率——你和我在后方负责处理积压的文书和统筹进度。没有我的允许，不需要对任何人的直接差遣做出回应。"

  拉芙希妮搭在手腕上的手指微微松开。
  她没有立刻答话，翡翠色的眼眸安静地看着雪乃。几秒钟后，她将双手平放在桌面上，用同样平稳干燥的语气回应道："我明白了。如果不麻烦的话。"

  结衣在一旁长长地松了一口气，原本紧绷的肩膀垮了下来："太好了，有小雪乃在这句话，总觉得就算去那个第三会议室也没那么可怕了。那个，拉芙希妮酱，明天我们一起过去吧！"

  "……嗯。"拉芙希妮轻轻点了点头。

  "那就这么定了。今天的社团活动到此为止。记得复习，由比滨同学。"雪乃站起身，开始整理桌上的茶具。虽然麻烦才刚刚开始，但只要将变量限制在规则的框架内，就没有什么不可控的。
  她这么认定着。
