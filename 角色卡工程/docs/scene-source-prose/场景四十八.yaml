场景: 48
幕: "第三幕·二学期"
时间: "2013年11月下旬 · 修学旅行归后不久 · 放学后"
地点: "奉仕部活动室"
人物: "雪之下雪乃、拉芙希妮·都柏林、比企谷八幡、由比滨结衣、一色彩羽"
正文: |
  在那场关于告白与粉饰太平的荒诞余波退散几天之后，奉仕部活动室里的某种微小违和感，被不动声色地抚平了。

  雪之下雪乃摘掉了那副防辐射用的细黑框眼镜。那个将颈部线条完全暴露在外、显得过于锋利的高马尾也被解开，黑色的长直发重新顺滑地披散在肩背上。她耳侧垂下的发辫，被一根崭新的发带重新固定住。

  虽然不是原来那根红绸带，但那严丝合缝的扎发方式，昭示着这个角落里的日常秩序正在被重新建立。

  时间在平稳的复习与零星的委托中滑入了十一月下旬。

  某天下午的放学后，活动室的拉门被一种并不算特别拘谨、却又带着几分试探的力度拉开了。拉门滑动的声音打破了屋内的安静。

  一个留着亚麻色齐肩梨花头短发的女生探进了小半个身子。她的手搭在门框上，一双黄色的眼瞳在活动室里灵活地快速扫视了一圈。她的视线在比企谷八幡的身上极短地停顿了半秒，随后，整张脸立刻换上了一副完美无瑕的天然笑容。

  "打扰了——请问，这里是奉仕部吗？"

  她推开门走了进来。总武高的蓝黑西装校服穿在她身上，裙摆被整理得比规定略短，却又不会显得过分轻浮。

  "那个，我是足球部的一年级经理，一色彩羽。"她微微歪了歪头，声音软糯，尾音微微上扬，带着撒娇的语调，"不好意思突然跑过来。其实是学生会长城廻学姐，还有生活指导的平冢老师推荐我来的，说是可以在这里寻求帮助。"

  她用最无辜、最缺乏攻击性的表情，轻飘飘地将这两个重量级的名字抛了出来。

  比企谷八幡原本半瘫在椅子上的身体微微坐直了些，死鱼眼里立刻升起了明显的防备和警惕——同时搬出前学生会长和平冢静，这绝对不是什么可以简单打发走的差事。由比滨结衣发出了半声惊讶的轻呼，目光好奇地打量着这个户部前几天顺口提过一次的学妹。

  拉芙希妮安静地坐在原本的位置上，视线不动声色地在这个女孩身上过了一遍——她扫视屋子的路径太齐整，落点太有规律。

  一色彩羽乖巧地站在门与窗之间那片被设定为委托人站立的区域，脸上的笑容没有丝毫松懈。她的目光越过长桌，最终落在了长桌尽头、那个负责主导接待的座位上。

  雪之下雪乃将摊开在桌面的文库本合上，平放在手边。她并没有因为那两个分量极重的名字而改变端正的坐姿，只是用一种公事公办、听不出温度起伏的声音开了口。

  "无论推荐人是谁，奉仕部接待委托的流程都不会改变。请先说明你的具体困难。"

  一色彩羽似乎没料到自己精心准备的开场白会被如此轻易地挡回来，她脸上的笑容极短地凝滞了半秒，但很快又调整回那种软糯的天然感。她站在门与窗之间的委托人区域，声音清脆地抛出了她的诉求。

  "是这样的，我不小心被朋友恶作剧，擅自填了学生会长的竞选表。"她微微低下头，肩膀垮下去，做出一副苦恼的样子，"但我完全没有那个能力。所以，能不能请大家帮帮忙，让我……稍微'意外'一点，自然地落选呢？"

  长桌两旁陷入了短暂的安静。在这个没有立刻得到回应的空当里，一色那双黄色的瞳孔开始不安分地扫视着屋内的几个人。

  当她的目光掠过比企谷八幡那副散漫的坐姿和满是防备的死鱼眼时，她的鼻尖几不可察地皱了一下，嘴角向下撇开一个极小的弧度。

  紧接着，她的视线滑向了对侧的拉芙希妮。

  拉芙希妮依然保持着观察的姿势，翡翠色的眼睛安静地迎接着这道带着试探意味的打量。就在视线交汇的那一瞬，一色彩羽脸上的笑容出现了一丝不自然的收缩——她似乎撞上了什么，从那副天然面具下短暂地失了半秒。

  一色迅速将目光从拉芙希妮身上移开，肩膀微不可察地绷紧了些，身体不自觉地往靠近门的方向偏了半寸，那是本能的戒备。

  她重新将视线投向长桌尽头，而那里的回应也刚好在这个时候送达。

  雪之下雪乃并没有去深究学妹那些细碎的眼神交换。她看着一色，平稳地指出了这个诉求里的逻辑断层。

  "奉仕部的原则是接受委托并提供帮助，协助委托人克服困难。"雪乃的声音干净利落，带着清晰的条理，"但'落选'仅仅是你用来逃避当选后果的一种消极结果，并不是解决被推举这件事本身的正面途径。如果你需要的只是代替你完成'失败'这个动作的临时工，这里恐怕无法满足你的期待。"

  将这番过于清晰且不留情面的结论抛出后，雪之下雪乃并没有继续维持那种具有压迫感的诘问姿态。

  她看了一眼站在原地、因为被直接驳回而显得有些僵硬的一色彩羽。雪乃微微垂下视线，重新将目光落在那本合起的文库本上，原本挺直的脊背细微地放松了些许。当她再次开口时，那股冷硬的质问感消退了不少，语速也随之放缓，带上了一种更为平和的陈述感。

  "当然，如果你刚才所说的情况属实，确实是因为朋友的恶作剧而在不知情的情况下被登记为候选人，那么想要退出也是一种合理的诉求。"雪乃的声音依然平稳，但已经剔除了刚才的尖锐，"只是，你不必选择'意外落选'这种曲折的方式。最直接有效的方法，是立刻去找负责本次选举的执行委员会说明原委，或者直接向推荐你过来的平冢老师提交撤销候选人资格的申请。这才是处理恶作剧的正常途径。"

  这个合情合理、堪称最优解的建议落在活动室里，并没有让委托人的表情变得轻松起来。

  一色彩羽下意识地咬了一下嘴唇内侧。那双黄色的瞳孔快速转动了半圈。仅仅一秒钟后，她的眉头舒开，嘴角向下抿了一点，脸上浮起一层完美的委屈。

  她将双手交握在胸前，两根食指不安地互相摩挲着，原本就软糯的声音被压得更低，带着一点微微发抖的哽咽。

  "可是……如果我直接跑去找老师或者委员会说这是恶作剧要求退选，事情一定会闹得很大吧？那样的话，把我名字填上去的朋友肯定会被老师批评的。"一色微微抬起眼睛，用一种无辜且充满恳求的目光看向长桌，"我不想因为自己的事情让朋友惹上麻烦，也不想让大家觉得我是个不顾及集体气氛的人。所以……我才会想，如果能顺其自然地、在不伤害任何人的情况下落选，那就是最好的结果了……"

  长桌靠窗的那一侧，一直瘫坐在椅子上的比企谷八幡动了动肩膀。他从喉咙深处挤出了一声短促的、只有离他最近的由比滨结衣才能勉强听清的气音。那是一个对这种被包装在"顾全大局"与"为了朋友"之下的虚假说辞感到极度排斥时，所产生的反应。

  比企谷八幡那声短促而带着嘲弄意味的气音在安静的活动室里显得尤为清晰，但雪之下雪乃并没有转头去确认那个声音的来源。

  她依然端坐在长桌尽头，没有顺着一色的话头给出哪怕半句安抚，也没有像之前那样立刻用冰冷的逻辑去拆解这番明显的伪装。她只是维持着那份审视的安静，平稳地注视着站在不远处的一色彩羽。在这份缺乏回音的沉默里，那种被包装在"顾全大局"与"朋友友谊"之下的委屈，渐渐失去了它原本应该发酵的温床，干瘪地悬滞在空气中。

  没有被反驳，却也没有被接纳。

  一色彩羽显然没有预料到这种完全空白的回应。

  她微微低着头，试图用余光确认长桌尽头的态度。那双用来装点无辜的黄色眼瞳快速眨动了几下，交握在胸前的手指不自觉地攥紧，将骨节压得微微发白。当她意识到眼前的这位学姐并不打算提供任何台阶时，那层软糯的外壳终于出现了一丝微小的裂隙。

  一色深吸了一口气，再次抬起头，努力将声音里的发虚包装成一种善解人意的体贴。

  "那个……如果直接退选不方便的话，其实大家也不用做得很复杂。只要在学校里稍微……稍微制造一点我不适合当会长的印象就可以了。比如，放出一点我不负责任的传闻，或者在演讲的时候让我显得很不成熟……只要不牵扯到具体的恶作剧者，怎么做都没关系。"

  长桌靠窗的一侧，比企谷八幡换了个姿势。他从那种瘫坐的防御状态中稍稍抽离，脊背往椅背上靠了靠，发出一声极不耐烦的、干瘪的叹息。

  "'稍微制造一点负面传闻'？"八幡那双没有生气的死鱼眼半垂着，目光越过活动室的空气，不偏不倚地落在了一色彩羽那张极力装作无辜的脸上，语气听起来像是在嚼一块索然无味的硬纸板，"你以为流言这种东西，是带有刻度盘可以精准调控火候的家用电器吗？"

  他没有给一色留下思考辩解借口的时间，那种习惯性将人际关系拆解得一地鸡毛的逻辑，顺着他干涩的嗓音倒了出来。

  "一旦为了某个目的捏造了负面形象，那种标签就会像沾了油污的口香糖一样黏在你身上。'不负责任'、'轻浮'……这些评价可不会在选举结束后就乖乖按你的意愿自动消失。"八幡停顿了半秒，视线微微冷了下来，"说到底，你并不在乎散布流言的后果。你只是在畏惧'拒绝推荐人'这个需要自己承担责任的动作。所以才想出了这个看起来不会弄脏自己双手的蠢主意——把破坏班级或者社团气氛的恶名，直接转包给我们这种边缘社团。我没说错吧？"

  在这个被彻底剥去了"顾全大局"与"体贴朋友"这层漂亮外包装的赤裸事实面前，一色彩羽脸上的表演卡壳了。

  她原本交握在胸前、试图营造出柔弱感的手指僵硬地松开了半寸。那双之前还在快速眨动、试图博取同情的眼瞳里，那股楚楚可怜的水汽瞬间蒸发得干干净净。取而代之的，是一种带着明显防备与审视的尖锐目光。她盯着长桌那边那个头发凌乱、眼神颓丧的学长。

  因为被直击了痛处，她的嘴唇抿成了一条并不怎么友好的直线。一色没有立刻反驳，那张原本准备好随时撒娇的可爱面孔，裂开了一条真实的、带着冷意的缝隙。

  就在空气即将凝固的前一秒，长桌中央传来了一个平稳的声音。

  "刚才那些不切实际的要求，其实是一色同学对奉仕部的试探，对吗？"

  拉芙希妮·都柏林微微侧过头，那双翡翠色的眼睛安静地注视着站在委托人位置的学妹。她的语调没有任何起伏，依旧带着那种英国留学生特有的、挑不出任何毛病的正式与礼貌，甚至在句尾留下了一丝恰到好处的停顿。但这种停顿，没有留给对方拒绝的空间。

  "为了确认这个社团是否真的具备解决问题的底线，所以才特意用'制造负面流言'这种显然会带来严重后遗症的荒谬借口来测试我们。"拉芙希妮没有给对方多余的思考时间，顺着自己抛出的前提继续往下铺设，"我想，一位能被学生会长看重的学妹，应该不会真的天真到认为那种把责任推给别人的做法行得通。如果不麻烦的话，这个误会可以到此为止了吗？"

  这是一个台阶。
  但这也是一把锁。

  一色彩羽站在原地。她那双原本盯着八幡、充满戒备的眼睛猛地转向了拉芙希妮。这位学姐的话听起来像是在帮她解围，帮她把刚才那个粗劣的、自私的算计包装成了一场"精明的试探"，可是那双翡翠色眼睛里的光芒，却让一色有一种被人从头到尾彻底看透的冷汗感。比起那个死鱼眼学长直白刺耳的嘲讽，这种用礼貌的言语强行把人按回谈判桌上的手段，显然更加棘手。

  一色的喉咙微微动了一下，那句原本可能因为下不来台而爆发的尖锐反讽，被硬生生地咽了回去。她只能僵硬地扯扯嘴角，顺着这个唯一的台阶往下走。

  "……是啊。毕竟是平冢老师推荐的社团，我当然要稍微确认一下学长学姐们是不是真的值得信赖。"她的语气勉强恢复了一点点原本的甜腻，但那只紧紧攥住裙摆的手却没有松开——那是被盯上的感觉。

  啪的一声轻响。

  雪之下雪乃合上了手中的文库本。这声音并不大，却干净利落地在活动室里划出了一道终止线。她将手从封面上拿开，目光终于重新落在了一色的身上——那道视线本身就足够冷。

  "既然测试结束，那么我想，我们可以回到正常的问题处理逻辑上了。"雪乃的声音冷硬得像一块被敲击的冰，"正如我刚才所说。如果你不想担任候选人，唯一的正确做法就是堂堂正正地拒绝，或者走正规程序撤销申请。无论是'意外'还是'造谣'，奉仕部都不会接手这种名为帮助、实为逃避的劣质委托。这就是最终答案。"

  这就等于宣判了这场试探的死亡。

  一色彩羽沉默了两秒。然后深吸了一口气，松开了攥着裙摆的手指。原本总是微微前倾、显得娇小惹人怜爱的站姿，在这一刻稍微挺直了一些。

  "这样啊……"一色的声音变得有些冷，尾音里的甜腻已经消失得一干二净。

  在转身离开之前，她的视线最后一次扫过这间简陋的活动室。从那个把问题剖开的死鱼眼学长，到那个用礼貌把她钳住的外国学姐，最后停留在那个冷硬得像把刀的部长身上。这是一个对局面的重新评估。这间活动室里的空气被这三个人以一种互相咬合的方式扣紧了，让她找不到任何一个可以再插话的缝隙。

  "我知道了。打扰各位了。"

  一色彩羽礼貌地点了点头，留下一个毫不拖泥带水的背影，拉开门，走进了走廊的冷空气里。
