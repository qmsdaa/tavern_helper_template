场景: 57
幕: "第三幕·二学期"
时间: "2013年12月24日 · 平安夜 · 圣诞联合舞台剧公演当日"
地点: "总武高室内体育馆 · 后台连接外部通道区域"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、雪之下阳乃（+背景：海滨综合和京王高中执行委员、一色彩羽·未直接出场）"
正文: |
  室内体育馆后台连接外部通道的区域，此刻被大大小小的硬纸箱和背景道具挤得只剩下一条狭窄的过道。距离联合舞台剧正式开场还有一个小时，海滨综合和京王高中的执行委员们正在确认最后的走位。

  拉芙希妮站在靠近承重柱的边缘。她双手抱着那本黑色的英文圣经，指腹有些用力地贴着皮质封皮。里面夹着的那颗不知名的植物种子，现在似乎正隔着纸页向她传递着某种微弱的温度。她的视线越过搬运器材的人群，从搭建到一半的舞台背景一直扫到另一侧的音响控制台，眼神里少见地没有那种习惯性的冷淡警惕。这是她第一次在塔拉庄园那套严密规矩之外度过圣诞前夕，尽管周围全是刺耳的指令声和纸箱摩擦声，她却并未试图去寻找安静的角落。

  几米外的一张临时拼凑的折叠桌旁，雪之下雪乃正低头看着手中的流程核对表。她的指尖捏着一支红色的水性笔，笔尖在几项物资分配的条目旁悬停了片刻。她抬起头，似乎是打算确认音响组的进度，视线却在越过承重柱时，在拉芙希妮那头浅金色的头发上停留了不到半秒。雪乃很快收回了目光，将耳侧掉落的一缕头发拨回耳后，随后用指节轻轻压平了流程表有些卷曲的边角，视线重新落回了密密麻麻的文字上。

  而在由几个废弃泡沫板堆成的临时防线后，比企谷八幡正以一种极度不符合人体工学的姿态缩在一张没有靠背的塑料凳上。他半弓着背，下巴几乎要藏进外套的领子里，死鱼眼盯着地板上一块不知是谁掉落的黑色胶带。四人约会那种被强行拽进修罗场的滞重感显然还没有从他身上褪去，任何可能引来注意的声响都会让他的肩膀下意识地绷紧。

  "借过一下！抱歉，麻烦借过一下！"

  由比滨结衣的声音从过道另一头传来。她抱着一个几乎挡住她大半个视线的道具纸盒，正试图挤开挡路的几个男生。粉色的双团子头随着她急促的步伐有些散乱地摇晃着，额前的刘海已经被汗水打湿，贴在皮肤上。

  她跑到承重柱附近时，脚下的防滑垫稍微绊了她一下，怀里那个装满小道具的纸盒向一侧猛地倾斜，眼看就要撞上旁边的铁质支架。

  拉芙希妮向前迈了半步，空出右手，用手掌稳稳地托住了纸盒倾斜的底角。

  纸盒在离支架两厘米的地方停住了。

  "啊……得救了！"由比滨结衣急促地喘了口气，赶紧重新调整了抱盒子的姿势，"谢谢你，拉芙希妮酱。这边的现充组一直在要东西，我都快跑晕了。"

  "你流了很多汗。"拉芙希妮的声音很轻，她的手指从纸盒底部收回，垂在身侧，"如果里面是不易碎的布景道具，你可以先放在这里，我去帮你交接。"

  "不行不行，这些是临时追加的彩带，马上就要用到了。"由比滨结衣摇了摇头，虽然累，但脸上的笑容却很明亮，"那我先过去啦！"

  她重新迈开脚步，向着舞台方向跑去。

  拉芙希妮收回视线，目光不经意间与角落里抬起头的比企谷八幡短暂交汇了一瞬。八幡立刻像是被烫到一样，迅速移开了视线，重新盯回了地板上的那块胶带。

  几乎是同一时间，拉芙希妮听到身侧传来了清晰的脚步声。

  雪之下雪乃拿着那份压平的流程表，停在了拉芙希妮两步远的位置。她的视线越过拉芙希妮，看了一眼角落里依然试图缩减存在感的八幡，随后将目光落回了拉芙希妮手中的圣经上。

  "既然你现在没有被具体的工作绊住，"雪乃的语气平静得像是在陈述某种无可辩驳的定理，"那么，请你和比企谷同学一起，去最终确认一次外部通道的安全出口。开场前，我不希望有任何非工作人员滞留在那些区域。"

  拉芙希妮的视线刚刚从由比滨结衣跑远的背影上收回，正准备回应这句带着熟悉秩序感的话语。就在她微微偏过头的瞬间，目光穿过了舞台侧边未拉严的幕布缝隙，直直落在了尚未开放的观众席前排。

  那里坐着一个人。

  灯光还没有完全打在观众席上，但那件深酒红色的风衣在昏暗中依然足够显眼。雪之下阳乃靠在椅背上，没有像往常那样挂着那副令人脊背发凉的完美笑容。她只留给这边一个极度冰冷的侧脸，深蓝色的眼眸在捕捉到拉芙希妮视线的瞬间，给出了一个没有任何情绪波动的极端一瞥。

  那不是试探，更像是某种上位者在评估一件死物的重量。

  不到半秒，阳乃转开了头，重新看向空荡荡的舞台中央。

  拉芙希妮的呼吸稍微停顿了一拍。指腹在黑色圣经的皮质封皮上压出了一点浅浅的凹陷。那短暂的一瞥，带着一种强烈的、让人感到窒息的"被设定感"，如同在塔拉庄园里无数次从监控探头后传来的无声注视。

  "都柏林同学。"雪乃的声音在不到一米的地方响起，比刚才稍微提高了一点点音量。

  拉芙希妮把视线从幕布缝隙收了回来。

  雪乃没有顺着她的目光看向观众席，只是用指节轻轻敲了一下手中的流程表。"现在距离正式开场还有五十分钟。如果你们能在十分钟内完成确认，也许还能赶上做最后的物资清点。"

  这句听起来像是指责效率的话，实际上却像是一道精准切断了那股冰冷视线的物理屏障。

  拉芙希妮松开了紧抓着圣经的手指，微微点了点头。"我明白了。如果不麻烦的话，我现在就去。"

  "喂，别擅自把我也搭进去啊。"角落里那个半弓着背的人影终于发出了声音。比企谷八幡慢吞吞地从那张没有靠背的塑料凳上站了起来。他拍了拍校服外套上的灰尘，死鱼眼向这边瞥了一眼，又迅速移开。

  "如果你打算继续在那里扮演一棵发霉的蘑菇，"雪乃看着他，语气恢复了惯常的冷硬，"我不介意在执行委员会的总结报告上，为你单独立项。"

  "……我可不想在这种无聊的报告上出名。"八幡嘟囔了一句，把手插进口袋里，绕过了地上那块胶带，"走吧。早点弄完早点回来待着。"

  拉芙希妮抱着圣经，跟在八幡身后，朝着连接外部通道的侧门走去。在踏出后台区域的前一秒，她没有再回头看那道幕布缝隙。

  前台的配乐声透过厚重的幕布传到后台，被削弱成了沉闷的低频震动。执行委员们还在压低声音核对着下一个节目的道具进场顺序。

  拉芙希妮避开了几条横在地上的电缆，手里端着一个小巧的托盘，上面放着四杯刚倒好的红茶。原本属于长桌上那个旧热水壶的职责，这一次被她接手了。

  她停在由比滨结衣身侧。结衣正蹲在一个道具箱旁，费力地解着一团缠在一起的彩带，鼻尖上甚至能看到细细的汗珠。

  "结衣同学。"

  听到声音，结衣从一团彩带中抬起头，手指还保持着拉拽的动作，略微喘着气。

  拉芙希妮弯下腰，将其中一杯红茶递到了结衣面前。

  "你今天从早上开始就一直在跑来跑去。"拉芙希妮的声音淹没在后台嘈杂的环境音里，却听得很清晰，"这个是……甜的。如果可以，请先喝一口。"

  在几步之外的昏暗角落，那盏临时拉过来的白炽灯下，雪之下雪乃正拿着那份快被翻旧的物资清单。

  听到动静，她从密密麻麻的表格里抬起头。

  雪乃的视线越过蹲在地上的结衣，落在了拉芙希妮手里那个还在往上冒着热气的保温杯上。原本，关于茶叶的克数和水温的控制，在这间活动室里一直是属于她的绝对领域。

  但雪乃并没有对这种"越权"行为表示阻止。

  "结衣同学，"雪乃的声音带着一贯的冷清，但在前台隐约的掌声中显得并不严厉，"你的运动量已经超出了常规负荷。从生物学角度来说，你确实需要及时补充糖分。"

  这句听起来像是生理学建议的话刚落音，雪乃停顿了半秒。

  她的目光从结衣身上移开，重新定格在拉芙希妮的脸上。

  "那么，"雪乃微微扬起下巴，语气里带上了一点评估的意味，"这次的红茶泡得如何？"

  结衣双手捧着那个纸杯，小心翼翼地凑到嘴边吹了吹，然后试探着喝了一小口。

  温热的液体刚刚触碰到舌尖，由比滨结衣喝水的动作就出现了明显的停滞。

  她的眼睛微微睁大，那股几乎能将喉咙黏住的强烈甜度在口腔里瞬间炸开，冲击力大得让她差点被呛到。这哪里是红茶，简直就像是把糖罐直接倒进了热水里。

  但这种停滞只持续了不到一秒。

  结衣迅速咽下那口甜得发齁的红茶，脸上的错愕被一个灿烂的笑容迅速取代。她用双手捧着纸杯，有些开心地凑近拉芙希妮，压低了声音却掩饰不住语气里的元气：

  "哇……好甜！但是真的好好喝！感觉刚才跑掉的力气一下子全补回来了。谢谢你，拉芙希妮酱！"

  白炽灯昏黄的光线打在折叠桌上。雪之下雪乃垂下视线，看着那杯被拉芙希妮·都柏林轻轻放置在物资清单旁的纸杯。

  茶水表面还漂浮着极浅的热气。

  雪乃没有立刻去拿那个杯子，也没有看站在面前的拉芙希妮。她的手指在清单的边缘停留了两秒钟，随后才不紧不慢地伸出手，端起了那杯温度恰到好处的红茶。

  她低头，试探性地抿了一小口。

  极高的糖分在舌尖上立刻蔓延开来。那是一股完全不符合正规英式红茶冲泡比例、甚至有些粗暴的甜度，和那天在千叶村合宿时她凭直觉加进去的方糖有着惊人的相似。

  雪乃将纸杯重新放回桌面。她的表情没有任何明显的变化，既没有因为这过度的甜味而皱眉，也没有附和刚才由比滨结衣那夸张的称赞。

  "看来你对热量补充的理解，仅仅停留在了'增加糖分'这一个单一维度上。"雪乃的声音依旧清冷，但在嘈杂的后台背景音中，听起来并没有真的带上指责的意味，"不过，考虑到现在的环境温度和后续的体力消耗，这种极端的配比……姑且算作一种权宜之计。"

  不远处的废弃泡沫板旁，比企谷八幡稍微换了个靠墙的姿势。

  他刚刚把那个甜得让人喉咙发干的纸杯拿远了一点，本打算继续当个不用开口的隐形人，但听到那句一本正经的"权宜之计"，他最终还是没忍住。

  "啊，是吗。"

  八幡用他那特有的、干瘪且缺乏起伏的嗓音开口了。他那双标志性的死鱼眼越过杂物堆，半耷拉着看向折叠桌这边的两人。

  "把致死量的糖分强行解释成权宜之计，这还真是有够包容的。我刚才还以为自己喝的是从医务室顺出来的葡萄糖口服液。"八幡抬起手，用指节轻轻敲了一下自己手里的纸杯，"如果接下来有人因为血糖飙升而兴奋得从舞台上摔下去，我建议执行委员会提前把那个归类为医疗事故，而不是舞台效果。"

  这句带着典型比企谷式自损与毒舌的吐槽，立刻在后台这片狭小的空间里荡开。

  由比滨结衣原本还在捧着杯子回味甜味，听到这话，有些不满地鼓起了脸颊，想替拉芙希妮反驳两句。

  后台那一点因为台词而产生的背景音，似乎在比企谷八幡那句干瘪的吐槽落地后，变得更加空旷了。

  拉芙希妮·都柏林依然保持着站在折叠桌旁的姿势。她左手腕上的红绸带因为手臂微微垂下的动作而隐没在深色的袖口里。面对那句关于"葡萄糖口服液"和"医疗事故"的抱怨，她并没有像以往那样用沉默来回避，或者用礼貌的歉意来拉开距离。

  那丝极快的、不易察觉的干燥笑意在翡翠色的眼睛里化开。

  "如果你那么担心医疗事故的发生，比企谷同学，"拉芙希妮的声音很轻，语调和平时探讨期末数学题时一样平稳，甚至带上了一点评估的意味，"我现在可以去医务室跑一趟。"

  八幡靠在墙上的动作顿了半秒。

  拉芙希妮看着他，依然用那副毫无波澜的语气继续说道：

  "不过，考虑到你平时摄入MAX咖啡的频率，单纯的胰岛素可能已经无法挽救你的代谢系统了。或许，我应该直接向校医申请一支镇定剂，以便在你因为摄入一点点额外的糖分就陷入被害妄想时，帮你维持最基本的理智。"

  这句话像是一块被精准投掷的冰块，直接砸碎了八幡刚才辛辛苦苦建立起来的吐槽防线。

  八幡原本还在用指节轻轻敲击纸杯边缘，现在那个动作彻底僵住了。他那双死鱼眼因为一瞬间的错愕而微微放大，似乎完全没料到，这根平时连风吹过都会下意识躲闪的"芦苇"，竟然会突然用这种几乎可以说是"恶毒"的修辞手法，一本正经地把刀子捅了回来。

  角落里陷入了诡异的寂静。

  最先做出反应的是由比滨结衣。她原本还捧着那杯热茶，因为不满八幡破坏气氛而鼓着脸颊。但在听完拉芙希妮的话后，结衣的嘴唇微微张开，捧着纸杯的手不自觉地收紧，琥珀色的眼睛睁得圆圆的。

  那是她第一次在拉芙希妮身上，看到如此直白、腹黑、甚至带着一点点鲜活"恶意"的反击。

  而在白炽灯的光晕下，雪之下雪乃的反应则要隐蔽得多。

  她那只原本已经准备松开纸杯的手，在听到"被害妄想"和"镇定剂"这两个词时，硬生生地停在了半空。深蓝色的眼眸里闪过一丝极度罕见的空白，视线像是不受控制一般，从物资清单上笔直地滑向了身旁的拉芙希妮。
