场景: 58
幕: "第三幕·二学期"
时间: "2013年12月24日 · 平安夜 · 圣诞联合舞台剧公演前 · 紧接场景57"
地点: "总武高室内体育馆 · 后台连接外部通道区域"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
正文: |
  由比滨结衣原本微微张开的嘴唇，在反应过来拉芙希妮话里的意思后，迅速向上弯起。紧接着，一阵清亮、毫无芥蒂的笑声从她喉咙里跑了出来，直接驱散了角落里残存的拘谨。

  "啊哈哈哈……拉、拉芙希妮酱，你太厉害了！"

  结衣一边笑着，一边将手里的纸杯随手搁在折叠桌的边缘，然后快步走上前，一把挽住了拉芙希妮的手臂。她的动作自然而亲昵，带着那种独属于"现充"女孩的、毫无防备的贴近感。

  隔着布料，柔软的体温立刻传递了过来。

  拉芙希妮的身体在被挽住的那一瞬间，出现了非常轻微的僵硬。常年被都柏林家族训练出的防备本能，让她下意识地想要抽回手臂，拉开这种超出"安全距离"的物理接触。但随着结衣带着笑意的声音在耳边响起，她垂在身侧的手指动了动，最终没有躲开。

  "小企刚才那个表情，简直就像是突然被猫咬了一口一样！"结衣靠在拉芙希妮肩膀旁，转过头去看着还在靠墙装死的八幡，笑得团子头都在跟着晃动，"我还以为你会一直那么安静呢，没想到居然这么会接话！"

  被点名的八幡终于从刚才的连击中找回了自己的声音。

  "喂喂，被猫咬了一口是什么奇怪的比喻。而且，你靠得也太近了吧，由比滨。"八幡将视线从拉芙希妮身上移开，落在结衣身上，用那种干瘪的语气试图挽回一点颜面，"我只是觉得，在医务室那种地方接受所谓的治疗，风险实在太大，不符合我的生存哲学而已。"

  "小企你就是在狡辩啦！"结衣毫不留情地戳穿了他，然后转头看向拉芙希妮，眼睛亮晶晶的，"呐，拉芙希妮酱，我们以后是不是可以经常这样聊天？还有还有，能不能教我泡红茶，小雪乃总是凶我呢。"

  拉芙希妮看着结衣近在咫尺的、毫无杂质的笑脸，鼻尖似乎还能闻到她身上淡淡的、属于正常高中女生的香气。她右手腕被紧紧挽着，那截藏在袖口里的烧焦丝带被外套布料紧紧压在皮肤上，粗糙的触感反而带来一种令人安心的重量。

  "如果……这不会给你带来麻烦的话。"拉芙希妮的声音低了一些，不再是刚才那种冷硬的腔调，而是带上了一丝有些不确定的柔软。

  站在折叠桌旁的雪乃，此刻终于将视线从拉芙希妮身上收了回来。

  她敛去了眼底那转瞬即逝的空白，端起手里那杯温度已经降下来的高糖红茶，又抿了一口。

  "这并不是一件坏事。"雪乃的声音依旧清冷，但听起来却比刚才少了几分锐利，"都柏林同学能够进行正常的反驳，总比某人永远只会用自毁的方式来解决问题要健康得多。"

  雪乃那句带着别扭肯定的评价，像是一锤定音，彻底将刚才剑拔弩张的气氛拉回了奉仕部特有的日常轨道里。

  听到那句"这并不是一件坏事"，拉芙希妮被结衣挽着的手臂终于完全放松了下来。她侧过头，看着结衣那张近在咫尺的笑脸，翡翠色的眼睛里不再是最初那种小心翼翼的评估，而是多了一层真实的明亮。

  "嗯。"拉芙希妮轻轻应了一声，声音比刚才还要轻柔一些，"只要雪乃同学的考勤记录里还能容忍这种程度的闲聊，我当然没问题。"

  她这句话前半句是对着结衣说的，后半句却将视线平移，越过结衣毛茸茸的团子头，直直落在了折叠桌旁的雪乃身上。

  那种刚刚被激活的、带着一点腹黑意味的生动感，并没有因为八幡的退场而消失。拉芙希妮看着雪乃端着纸杯的侧脸，语气里带上了一丝干燥且笃定的笑意。

  "毕竟，雪乃同学刚才之所以肯定我的'偏激'，其实也是为了替比企谷同学找个台阶下，顺便用一种不那么直接的方式，让他知道大家并没有真的在针对他吧？"

  角落里的空气似乎在这一瞬间停滞了一拍。

  靠在墙边的八幡猛地咳嗽了一声，似乎是被自己的口水呛到了，死鱼眼惊恐地看向拉芙希妮，像是在看一个刚刚拉开手榴弹引线的疯子。

  而处于视线中心的雪乃，端着纸杯的动作只发生了一瞬间的停顿。

  她没有像八幡那样狼狈，也没有像结衣那样惊讶。深蓝色的眼眸缓慢地、精准地锁定了拉芙希妮的眼睛。那是一种带着绝对理性和微小不悦的审视。

  "都柏林同学。"

  雪乃的声音比刚才还要低沉几分，每一个字都像是从冰水里捞出来的，带着不容反驳的冷硬。

  "你是不是在千叶村待得太久，导致对奉仕部的生态链产生了某种严重的误判？"她将纸杯重新放回桌面，杯底与桌面碰撞，发出一声轻微的"叩"响，"还是说，你已经彻底分不清大小王了？"

  这句平时只有在极度火大或者想要强行掩饰动摇时才会说出的台词，带着惯有的锋利砸了过来。

  但拉芙希妮没有躲。她甚至没有像刚认识时那样习惯性地垂下眼睛。她依然被结衣挽着，看着雪乃那张冷若冰霜的脸，嘴角的笑意反而变得更加清晰了。

  那句"分不清大小王"在冰冷的空气里还没有完全坠地，由比滨结衣已经凭着那份在现充圈子里磨出来的野性直觉，率先拉响了警报。

  她原本还紧紧挽着拉芙希妮的手臂，在那股冷硬的压迫感袭来时，几乎是触电般地松开了手。紧接着，她像一只急于扑火的动物，三两步便挪到了折叠桌旁，一把抱住了雪乃那条刚放下纸杯的手臂。

  "小雪乃！"

  结衣半个身子都贴了上去，用那副带着点慌乱和撒娇的嗓音急匆匆地打着圆场，试图把那层正要结冰的壳给捂化。

  "别生气别生气嘛！拉芙希妮酱肯定是在开玩笑啦！在这间活动室……啊不对，在这个后台，当然是小雪乃你说了算呀！"她一边说，一边还用力地晃了晃雪乃的手臂，团子头几乎要蹭到雪乃的下巴。

  被这股不可抗力突然袭击，雪乃原本因为微怒而绷直的肩背出现了一瞬间明显的僵硬。

  那只搁在桌面上的纸杯被震得发出轻微的摩擦声，杯底的红茶险些因为桌子的晃动而溢出来。她下意识地想要抽回手臂，但结衣那股带着体温的柔软力量却像是一层怎么也推不开的棉花，硬生生地把她刚竖起来的冰棱给包裹了进去。

  就在雪乃深吸了一口气，准备用最严厉的措辞让结衣立刻纠正这种不得体的物理接触时，站在几步开外的拉芙希妮开口了。

  她微微欠了欠身，做了一个相当标准、几乎挑不出任何礼仪毛病的致歉动作。然而，当她重新抬起头时，翡翠色的眼睛里却找不到多少诚惶诚恐，反倒盛着一种游刃有余的笃定。

  "非常抱歉，雪乃同学。刚才确实是我僭越了。"

  拉芙希妮的声音很轻盈，像是一阵恰好吹过后台的穿堂风，带着一点让人无法拒绝的干燥与妥协。

  "正如结衣同学所说，奉仕部的生态链是不可动摇的。关于用三块还是五块方糖来评估同伴的健康状况……这种决定权，显然只属于站在金字塔顶端的人。"她看着雪乃那张在结衣的纠缠下变得更加别扭的侧脸，嘴角的弧度依然没有散去，"我会牢牢记住这个次序的。"

  靠在墙角的比企谷八幡在这句话里听到了某种堪比大型车祸现场的回音。他看着那个一边假装低头认错，一边还在用言语疯狂暗示那个"高糖红茶"黑历史的留学生，在心里默默给这个组合打上了一个鲜红的危险标签。

  而在折叠桌旁，那股原本试图维持绝对权威的冷空气，在这两人一左一右的物理夹击与言语化解下，彻底失去了它该有的压迫感。

  那股被柔软体温强行包裹的窒息感，终于让雪乃的理智发出了最高级别的警告。

  她略显仓促地、几乎是用一种不容拒绝的力道，将手臂从结衣的怀抱中抽离了出来。这个动作幅度不小，甚至让折叠桌又发出了一声闷响。

  紧接着，仿佛是为了抵御前方持续传来的那种带有促狭意味的视线，她迅速抓起桌上那份早就核对过无数次的A4流程清单，像举起一面纸质盾牌般，径直挡在了自己的脸前。

  白色的打印纸阻断了目光的交汇，却无法遮掩那股迅速攀升的体温。

  那抹罕见的、甚至可以用鲜艳来形容的绯红色，以一种势不可挡的速度越过了纸张的边缘，不但烧透了她的耳根，甚至顺着白皙的脖颈一路蔓延了下去。

  在这层薄薄的物理屏障之后，传来了一声细微到几乎要溶进空气里的气音。

  "……一个两个的，就知道说些让人无法反驳的话来捉弄我。"

  那声音很轻，尾音甚至还在发颤，完全失去了平日里那种冷硬的、宣读规则般的质感，只剩下一份因为无力反驳而被迫漏出的气结与不甘。

  这句失去了所有逻辑武装的微弱念叨，在原本就相对安静的后台角落里，产生了一种堪比生化武器泄漏的效果。

  靠在几步开外墙角的比企谷八幡，那双死鱼眼里的光芒停滞了整整两秒。

  他用那副见惯了各种尴尬场面的滤镜，冷酷地评估着眼前的景象。常年被冰冷正确包裹的冰之女王，一旦那层用来防身的坚冰被人用一种不讲理的方式敲碎，里面暴露出来的，居然就只剩下这种毫无还手之力的属性。

  这杀伤力未免也太恐怖了一点。

  在这个原本应该让人感到窒息的权力漩涡里，空气突然变得黏稠且甜得发腻。八幡被这种强烈的反差感震得头皮发麻。他几乎是本能地放弃了装死的策略，一把抓起手边那个印着廉价商标的纸杯，仰起头就是两大口。

  原本足以让人喉咙黏连、甚至引发血糖警报的"致死量"红茶，此刻带着滚烫的热度滑进胃里，竟然成了他确认自己还活在现实世界、而不是某种超现实恐怖片里的唯一真实感。

  隔着那层薄薄的打印纸，雪乃进行了两次缓慢且刻意的深呼吸。

  随着这细微的胸膛起伏，那股几乎要将理智烧沸的羞恼感，终于被她以强悍的意志力强行按压在了冰冷外壳之下。紧接着，她手腕发力，"啪"地一声将那份核对清单直接扣回了桌面。动作干脆、利落，带着一种不容置疑的断绝感。

  当视线再度越过折叠桌时，那张刚刚还红透了的脸庞已经明显绷紧。深蓝色的眼眸里重新浮起了一层熟悉的、名为"规则"的冷硬武装。

  "现有的流程核对已经偏离了预定轨道，这是一种低效的消耗。"她的语调恢复了那种平缓却带着压迫感的节奏，"接下来，我需要对剩余的巡查区域进行二次分配。由比滨同学，你负责——"

  然而，她试图用干练言辞重新堆砌起来的绝对权威，连完整的一句话都没能存活下来。

  就在那句带着命令意味的"你负责"刚刚出口的瞬间，由比滨结衣的手指，以一种完全无视了现存社交距离和活动室等级制度的刁钻角度，越过桌沿，精准无比地戳在了雪乃那半边刚刚绷紧的脸颊上。

  那一刻，空气似乎都跟着那根手指陷进了一小块柔软的凹陷里。

  "哇……软软的，而且真的还在发烫耶！"结衣不仅没有收手，反而发出了类似发现了新大陆般的惊奇喟叹，甚至还用指尖轻轻按压了两下。

  雪乃那刚刚找回几秒钟的理智和冷硬，在这突如其来的越界物理攻击下，瞬间碎成了粉末。她整个身体僵在原地，深蓝色的眼瞳极度的错愕而微微放大，原本准备宣读任务的薄唇半张着，却发不出一丝声音。

  就在她即将从僵硬中苏醒、准备降下雷霆惩罚的间隙，站在稍后方的拉芙希妮，也跟着微微向前倾了倾上半身。

  她手中那杯高糖红茶还冒着袅袅的热气，翡翠色的眼睛里流转着一种明目张胆的、甚至带点恶劣的兴味。她没有去拦结衣，而是用那种特有的干燥语气，非常自然地补了一刀：

  "结衣同学，戳的时候请务必注意力度。根据目前的体表温度和色素沉淀程度来判断，雪乃同学现在的防御可能正处于最脆弱的阶段，很容易造成不可逆的精神损伤哦。"

  那层原本就摇摇欲坠的冰冷外壳，在这毫不留情的联合夹击下，终于迎来了彻底的崩塌。

  雪乃的肩膀猛地一抽，以一种几乎称得上是仓促的姿态别开了脸，强行让自己的脸颊脱离了那根还在试探温度的手指。她那原本一直试图维持平稳的呼吸节奏，此刻全乱了套，胸口出现了明显的起伏。

  "……够了！"

  从那半张的薄唇间，终于挤出了一声抗议。

  她明明是想用平时那种宣布规则般冷硬且不容置疑的口吻来震慑全场的，但在极度的羞恼与局促催化下，那声音出口时却紧绷得离谱，尾音更是难以自控地发着颤。配上她那红透了的耳根，以及因为急于寻找视线落点而微微睁大的深蓝眼瞳，这声抗议不仅没能挽回半点属于部长的威严，反而透出一股无力的、类似于猫咪被踩到尾巴后竖起全身毛发的别扭与窘迫。

  由比滨结衣在那属于食草动物的求生直觉疯狂报警的瞬间，发挥出了惊人的敏捷度。

  就在那声变了调的"够了"落入空气的前零点一秒，结衣如同触电般将手背到了身后。她脸上的惊奇迅速转换成了一种心虚的干笑，脚步极快地往后滑了两下，半个身子直接缩到了拉芙希妮的大衣侧后方。

  "啊哈哈哈……那个、那个！我突然想起来幕布那边还得再去确认一下缝隙！我先去那边啦！"她连珠炮似的抛下一个根本经不起推敲的借口，企图利用物理距离来逃避即将到来的风暴。

  相比于结衣的慌乱，拉芙希妮则显得游刃有余得多。

  看着那张因为被戳破了掩饰而只能强撑炸毛姿态的脸孔，拉芙希妮非常识趣地选择了见好就收。她没有再继续用那种干燥的医学名词进行补刀，而是端着手里的红茶纸杯，脚步轻盈地向后退了半步，将那块因为过度紧逼而变得稀薄的呼吸空间，重新还给了对方。

  后台的这个角落，突然陷入了一种因为主导权彻底丧失而产生的诡异死寂里。

  "咳——咳咳咳咳！"

  就在这凝滞的空气里，角落处突然爆发出一阵惨烈、甚至带着点撕心裂肺味道的剧烈咳嗽声。

  试图依靠灌下两口高糖红茶来确认现实、并在角落里完美扮演小透明的比企谷八幡，终究还是没能抵御住那过分甜腻的糖分在喉管处引发的剧烈刺激。他弯下腰，死鱼眼被呛得微微翻白，一手捂着胸口，一手还在拼命拿稳那个廉价的纸杯，硬生生地用这种极不体面的方式，把所有人刚刚无处安放的注意力全盘接了过去。

  那阵近乎肺部痉挛的咳嗽声，在这个陷入死寂的后台角落里显得分外突兀，却也意外地递给了一只陷入绝境的猫一个完美的毛线球。

  雪乃几乎是瞬间就将视线锁定了那个还在角落里咳得直不起腰的身影。她猛地沉下脸，那双深蓝色的眼眸里重新聚起了冷冽的光，仿佛找到了能够让她重新站回逻辑高地的绝佳宣泄口。

  "比企谷同学，如果你连最基本的吞咽功能都无法自主控制，从而在公共筹备区域制造这种堪比生化危机的噪音，我建议你立刻去医务室检查一下你的声带和大脑中枢。而不是在这里用这种拙劣的方式，试图引起别人的注意。"

  她用一种挑剔且刻薄的语调连珠炮般地输出了这串批判。然而，她因为急促而略显不稳的呼吸，以及那仍未褪去绯红的耳廓，让这番原本应该极具杀伤力的言辞，听起来倒更像是在强行掩饰自己刚刚的狼狈。

  然而，比企谷八幡这种常年游走在自嘲与吐槽边缘的孤狼，显然并没有打算在这个时候惯着那只试图靠转移矛盾来重塑威严的猫。

  他一手捂着胸口，一手还紧紧捏着那个纸杯，好不容易把气倒匀了。他抬起那双毫无生气的死鱼眼，直勾勾地看了回去，语气干瘪得像块风干的橘子皮：

  "不好意思，我的吞咽功能非常正常。如果你真想追究责任，不如先去化验一下这杯被你们称为'权宜之计'的红茶。它现在的含糖量已经足够拿去给重度低血糖患者做静脉注射了。"

  他顿了半秒，视线扫过雪乃那张绷紧的脸，毫不留情地补上了最后一击：

  "还有，别因为你自己下不来台，就随便抓个倒霉的无辜路人当出气筒。这种转移尴尬的手法，比这杯茶还要拙劣。"

  这几句完全不按常理出牌的干燥吐槽，就像是一盆凉水，精准地浇在了雪乃刚刚勉强支起的防线上。

  雪乃的肩膀猛地一滞。她张开嘴，那个熟悉的"不对"已经滑到了舌尖。她本能地想要调取大脑里的词汇库，用一篇逻辑严密的驳论文将这个满嘴歪理的家伙彻底压制。可在这个充斥着红茶甜香的狭窄后台，在结衣和拉芙希妮两道毫无恶意的目光注视下，那些平时信手拈来的刻薄言辞，突然变得无比生涩。

  她尝试了两次，却发现自己连一个完整的句式都拼凑不出来。那层锋利得可以割伤人的冰冷外壳，在这一刻像是彻底融化在了那声没底气的"够了"和这杯致死量的甜茶里。

  最终，她只能咬住下唇，带着几分不知所措与气结，冷冷地瞪了那个角落里的死鱼眼一眼，然后生硬地把脸转了过去，将那些到了嘴边的话，连同残存的红晕一起，硬生生地咽回了肚子里。
