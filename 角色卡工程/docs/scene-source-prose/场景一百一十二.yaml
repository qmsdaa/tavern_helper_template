场景: 112
幕: "第七幕·重新为奉仕部命名"
时间: "2014年5月21日 · 周三放学后"
地点: "总武高特别栋奉仕部活动室"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林、比企谷小町、川崎大志"
POV: "共享场景／零POV"
正文: |
  活动室的门没有关严。

  八幡推门的时候，门背后有一张纸被风带起来，啪地贴回门板上。A4横版，手画的表格线，四角用透明胶带固定——上面两角已经很牢固，左下角只粘了一半，纸边往外翘。

  “值日表。”雪乃没有抬头，“今天开始。名字和日期已经写好了，具体任务自己填。”

  她面前摊着记录簿，右手边放着一杯没冒热气的水。桌上还摆着六张便签，每张上面用铅笔写了不同的任务：扫地／擦窗／整理桌面／洗茶杯／核对委托记录／倒垃圾。便签被一把钢尺压住，免得被窗外的风吹跑。

  “什么时候写的？”八幡把书包放到椅子上。

  “午休。”

  小町和大志已经在桌边了。小町趴在桌角，用铅笔在样品页的边角上画着不认识是什么的小动物；大志把物资清单竖着叠成三折，在折痕上压了一遍指甲，又打开来看了一眼，重新叠。

  “周三的值日已经排了。”大志指着表格第二列。

  周三一栏写着五个字，是雪乃的笔迹：雪之下·扫地。

  “雪乃学姐今天已经做过了。”小町凑过去看，“那剩下的人呢？小町也想今天做，明天放学有社团说明会的帮忙。”

  “先到先得。”八幡走到桌边坐下，“不过奉仕部的扫地不需要抢。”

  “因为只有四张桌子和一个柜子。”拉芙希妮说。

  “和一把很占地方的折叠椅。”八幡补充。

  结衣抱着热水壶从走廊进来，手肘把门推开——门背后的纸又响了一声。她把壶放上底座，摁下开关，伸手按住门上的值日表，看了一眼。

  “啊，小企的名字在周四。”

  “周五。”八幡说。

  “欸？周四那栏明明——”

  结衣又看了一眼。周四栏里有两个字：大志（倒垃圾）。墨水还没干透，应该是大志刚才自己填的。周五那栏空着，旁边的便签还剩两张没人领：洗茶杯和倒垃圾。

  “我的任务呢？”八幡问。

  “自己写。”雪乃把一支水笔顺着桌面推过去。

  笔滑到记录簿边上停下来。八幡看了一会儿那两张便签，最终没有拿任何一张。他把笔拨到一边，往后靠进椅子里。

  热水烧开了。结衣从茶柜里往外拿杯子。

  茶柜一共两层。上层是四只旧杯子——白瓷、浅绿、深蓝、米色，口径和杯身高度都不一样，但并排放着，看不出哪只比哪只矮一截。下层多了两只：一只杯身印着小朵碎花，一只素白，比上面那排的杯子明显更新。

  “这周的扫除已经有人做了，”雪乃把便签收拢，按到记录簿最后一页下面，“周三的值日不是今天的重点。先把这周排完就好。”

  “那周五到底谁倒垃圾。”八幡说。

  “你。”小町接得很快。

  “你倒。”

  “小町已经在周四帮学生会做说明会了，是大志的帮手。倒垃圾这种事，当然要留给还没有任务的人。”

  “奉仕部的倒垃圾不算学生会帮忙。你只是把同一栋楼的活儿拼在同一天。”

  “那前辈把洗茶杯和倒垃圾一起写了不就好了。”

  结衣把六只杯子放到桌上。四只旧杯子排在下排两只新杯子的正上方，间距一模一样。她在每只杯子里放了茶包，提起水壶的时候，突然停住了。

  “拉芙希妮同学……今天还是不放糖？”

  “不放。”拉芙希妮把流程表收进记录簿的最后几页，没有抬头。“谢谢。”

  结衣应了一声，往那只深蓝色杯子里注了热水。

  大志的白杯里放的是麦茶。小町的花杯也是。结衣给自己泡了果茶，雪乃的杯子里浮着一片柠檬，八幡那罐MAX咖啡还搁在桌角。

  茶包在热水里慢慢渗出颜色。一时间没有人说话。

  小町把样品页翻过来，在背面继续画。她的铅笔很短，握笔的姿势像是蜡笔，画出来的线条却意外地细。大志翻开一本从图书室借来的社团运营手册，翻到表格附页，把自己的名字悄悄描上去——不是真写，只是沿着印刷的字迹描了一遍。结衣双手捧着果茶，喝一口，看窗外，再喝一口。

  雪乃翻过记录簿的下一页。拉芙希妮已经涂完了胶，现在只是把流程表从上到下一张一张地翻，像是在等纸上的字自己排得更整齐。八幡靠着椅背，易拉罐在手里转了两圈，没有开。

  “好安静哦。”

  小町说这句话的时候铅笔还在动，像是声音自己从纸上弹出来的。

  “安静才正常。”八幡说。

  “上班族才会这么说。”

  “你哥离上班族还差一个大学和四十年房贷。”

  大志把手册合上，抬起头。

  “值日表上要不要加一栏‘浇水’？”

  “活动室里没有植物。”雪乃说。

  “窗台外面那盆。”

  所有人转头看向窗户。窗台外侧放着一只陶土花盆，里面的土已经干裂了，插着一根歪掉的标签，字迹模糊得只看得出一个“三”。

  “那是三浦同学去年文化祭的展示品。”结衣把杯子放下，“她后来忘了搬走。”

  “活了快一年了。”八幡说，“不浇水还能活到现在，已经不归奉仕部管了。”

  “它没活。”拉芙希妮看了一眼，“标签是湿的。”

  “……什么时候？”

  “来的时候。”

  八幡站起来，走过去推开窗。花盆里的土是干的。标签也是干的——但标签杆子最下面两厘米有一圈颜色比其他部分深，像是曾经被水没过。他关上窗。

  “那是上一场雨。跟值日无关。”

  雪乃把便签发完，在值日表上写完最后一行。周五那栏留着一格空白。

  “比企谷同学。你那格自己填，期限到周五放学。”

  “期限是值日，又不是交作业。”

  “性质一样。”

  八幡拿起桌上的圆珠笔，走到门边。周五的格子里，他写了两个字：扫除。没有勾，没有圈，没有日期。

  “写完了。”他把笔插回笔筒，“不过声明一下——这不是任务认领，只是先把格子占住。”

  “就是任务认领。”小町说。

  “不是。”

  “你这个年纪的男生对任务认领的定义还真严格。”

  “你哪个年纪。”

  热水壶的保温灯灭了。结衣把剩下的热水倒进保温瓶，拧紧盖子。大志把花盆从窗台拿进来，用湿纸巾擦了一圈陶土边缘，又放回原处。擦掉的土末落在外窗台上，被风吹散了。

  拉芙希妮把最后一页流程表翻过去，合上记录簿。她的右手在封面上停了一下，指尖在右手腕的焦黑旧丝带上轻轻一勒，随即松手。

  小町画完了。她把样品页翻到正面，给大志看下午画的动物。

  “这是什么。”

  “熊猫。”

  “那是耳朵还是角。”

  “耳朵。熊猫的耳朵是圆的。”

  大志认真地点头，把样品页收进档案袋。结衣开始收杯子，上排四只放进茶柜上层，下排两只放进下层。花杯和白杯并排放在一起，杯口朝向同一个方向。门背后的值日表左下角又被风吹得翘起来，纸边轻轻拍了一下门板。八幡伸手把它按回去。这次透明胶带也粘不住了，他松开手，纸角又翘了起来。
