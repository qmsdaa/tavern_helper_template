场景: 95
幕: "第六幕·春假战备"
时间: "2014年3月30日 · 周日夜晚 · 春假"
地点: "平冢静的公寓"
人物: "拉芙希妮·都柏林、平冢静（玛格丽特姑婆 · 电话）"
正文: |
  拉芙希妮把最后一个洗干净的玻璃杯倒扣在沥水架上，用厨房纸将流理台边缘的水渍一点点吸干。

  放在微波炉旁的日常手机屏幕闪烁了一下——家政太太的例行短信。每周日晚上的固定节目：下周食谱、营养补充剂提醒、未完成的家政服务项目清单。格式和措辞和过去九个月的每一个周日一样，精确得像一份政府公报。

  拉芙希妮擦干手指，拿起手机准备像往常一样划掉通知。然后她的拇指停在了屏幕上方。

  食谱的第三行：爱尔兰炖羊肉。旁边标注着「已为您备好羊肩肉与根芹，冷藏保存」。

  这道菜不在拉芙希妮过去九个月里任何一周的菜单上。她在千叶从不吃这个。但爱布拉娜知道——爱布拉娜当然知道——这是拉芙十四岁之前在都柏林每周三被迫咽下去的东西。不是喜欢。是「必须」。

  菜单最下方附了一行字：「待您返回公寓后恢复完整晚餐服务。如需调整返回日期，请提前告知。」

  拉芙希妮看完了这行字。她用了三秒。

  然后她把日常手机屏幕朝下扣在微波炉旁边，继续将流理台上的最后一摊水渍吸干净。动作没有加快，也没有放慢。

  家政太太只是在做她的工作。她甚至可能不知道这道菜意味着什么。她只是按照都柏林那边传来的「建议」更新了菜单。这甚至算不上威胁。只是一个通知。你在哪里、你什么时候回去、你的生活什么时候回到正轨——家族已经替你安排好了。不需要商量。

  拉芙希妮将抹布叠成整齐的长方形，挂在沥水架横杆上。

  平冢静那堆积如山的外卖盒和空啤酒罐，经过她接近一个小时的清理，终于被全部分类压实，装进了三个黑色的超大号垃圾袋里。宽敞的客厅重新露出了原木色地板本来的样子，空气里那股有些发酵的焦苦烟酒味，也被洗洁精淡淡的柠檬香盖了过去。

  "差不多行了。"平冢静穿着一件宽松的男款灰色T恤，盘腿坐在沙发上，手里还拎着半罐没喝完的啤酒，"我叫你来是避难的，不是让你来当免费钟点工的。再擦下去，那流理台的皮都要被你扒掉一层了。"

  拉芙希妮转过身，将毛巾整齐地挂在挂钩上。

  "只是基本的家政清理而已，平冢老师。"她用温水冲洗了一下手，声音在宽敞的屋子里显得很安静，"如果您觉得有必要，明天我可以顺便把那些过期的速食品也处理一下。"

  "少来这套，赶紧过来坐下。"平冢静拍了拍身旁的空位，把茶几上的几份教案往旁边推了推，"去洗个澡早点休息。四月开始你可就要办休学手续了，要怎么在这座城市里待下去，得自己想清楚。"

  拉芙希妮走到沙发旁，刚准备坐下。

  就在这时，放在茶几角落的那部银色手机亮了起来。那是家族专机——比日常手机略重，背面有极细的暗纹，屏幕亮起时没有任何应用图标，只有一封新邮件的简洁提示。

  发件人：温斯顿。

  在都柏林家族，这个名字通常只代表一个意思——爱布拉娜的直接意志。拉芙希妮的呼吸本能地放轻，她的右手大拇指下意识地移向右腕那条烧焦的旧丝带，隔着焦脆的织物能感到其下那层因长期系紧而留下的浅色勒痕。

  她没有立刻去拿手机。多年的训练让她在面对这类邮件时，养成了一套固定的反应程序：先观察周围的环境，确认物理距离，然后再触碰信息源。

  "怎么了？"平冢静敏锐地察觉到了她动作的停顿，拿着啤酒罐的手悬在半空，视线顺着拉芙希妮的目光落在了那部亮起的手机上，"债主追上门了？"

  拉芙希妮没有回答。她伸出手指，在屏幕上滑动了一下。

  邮件是英文写的。遣词造句维持着温斯顿一贯的正式与精确，但读到最后几句时，拉芙希妮辨认出了一样东西——不是威胁，比威胁更难对付。

  Dear Miss Dublin,

  Following the recent updates to your academic registration status, I have been asked to confirm your current residence arrangements for the guardianship file. As you are aware, the trustees require a verified address for any period during which you are not in residence at your registered apartment.

  Miss Aibrana has requested that I meet with you in person to discuss your plans for the remaining term. I have taken the liberty of reserving a private room at the New Otani's top-floor Chinese restaurant for tomorrow at noon.

  I was also instructed to extend this invitation to Ms. Hiratsuka Shizuka, whose name appears on the temporary residence declaration you filed last week.

  Please do not feel compelled to arrive at the stroke of noon. I will be at the restaurant from half past eleven, should you prefer to speak beforehand.

  Respectfully,
  Winston

  拉芙希妮读了两遍。

  第一遍读内容。温斯顿要见她。爱布拉娜要确认她的去向。平冢静的名字已经被家族档案收录——她从邮局寄出那封信时就知道这会发生，只是没想到只用了四天。

  第二遍读措辞。

  "I have been asked"——不是"我要求"。被要求。

  "I was also instructed"——不是"我也希望"。被指示。

  "Should you prefer to speak beforehand"——在爱布拉娜的包围脚本里，这一句是温斯顿自己加上去的。不属于任何人的授意。他在告诉她：如果你需要在正式午餐之前先跟我说话，我会在。

  拉芙希妮认识这个表述方式。在都柏林的旧宅里，达洛维小姐每次替爱布拉娜转交通知时，也会用同样微小的措辞偏移：在被迫执行的指令末端，缀上一枚属于自己的标点。

  她的手指微微收紧。这封邮件依然是包围的一部分。温斯顿无法拒绝爱布拉娜的指令，他只能在一个句号前面的位置，替她留一道看不见的缝。但这道缝毕竟存在。

  这间公寓原本建立起来的一点点温度和安全感，在这封邮件面前瞬间变得像纸一样薄。但至少纸还没有破。

  平冢静的视线在拉芙希妮的侧脸和手机屏幕之间扫了两个来回。她没有出声催促，只是将手里的啤酒罐重重地顿在玻璃茶几上，发出一声沉闷的撞击响。

  "如果不方便说，就把手机关机。反正你现在是休学状态，没人能用校规要求你半夜回邮件。"平冢静从烟盒里抽出一根烟，咬在嘴里，并没有点燃。

  "平冢老师。"拉芙希妮的声音很轻，但平稳。她将手机屏幕翻转，推到了茶几中央，"我在日本这边留学的……法定协调人。邀请您明天中午一起吃饭。"

  她说"法定协调人"时，尾音在喉咙里轻绊了一下。温斯顿当然不只是协调人。但此时此刻，她能找到的最接近真相又不至于把平冢卷得太深的词，只有这个。

  "我去倒杯水。"

  在平冢静还没有对那封邮件做出进一步反应之前，拉芙希妮先一步站了起来。她维持着平稳的语调，但在转身离开茶几时，右手的指尖无声地掠过桌面，将那部银色手机抄进了掌心。

  平冢静看到了这个动作。她没有说话。

  拉芙希妮走向开放式厨房，然后在经过转角时，自然地拐进了旁边的洗手间。

  门被轻轻磕上，隔绝了客厅的灯光。

  洗手间里只有一盏偏冷的顶灯。拉芙希妮把家族专机放在白瓷洗手台的边缘，拧开水龙头，没有调温，任由微凉的自来水哗哗地冲刷着不锈钢下水口。水流的噪音填满了这个狭小的空间，也勉强盖住了她耳边隐约的嗡鸣。

  她低下头，右手的大拇指反复揉压着右腕上那截烧焦的旧丝带。触感干燥、粗糙，在潮湿的浴室空气里依然脆硬——像某种不肯软化的东西。还火那晚之后，她再也没换过这条丝带。

  就在她试图用冷水拍一拍脸颊时，洗手台边缘的那部银色手机猛地剧烈震动起来。

  屏幕在稍暗的光线里亮起。没有来电姓名，只有一串来自爱尔兰的越洋号码。

  拉芙希妮看着那串数字，连呼吸都停了半拍。她盯着水流看了一秒——确认自己的声带不至于发颤——然后滑开了接听键，将手机贴到耳边。

  "苇草？是小苇草吧？"

  电话那头立刻传来了一阵急促的女声。那是一种带着浓重利默里克口音的英语，语调上扬，每个卷舌音都带着爱尔兰乡间那种特有的粗粝感，在这个距离千叶半个地球的深夜里响起。

  玛格丽特姑婆。

  "是我，姑婆。晚上好。"拉芙希妮将声音压得很低，语速放缓，用最标准的英式口音回应。

  "还晚上好？你那边都半夜了吧！"玛格丽特的声音在听筒里显得有些失真，"小芒草刚给家里打过电话——她说你在日本病得厉害，连学籍都要办休学了？这种事你怎么能瞒着家里！"

  小芒草。

  玛格丽特姑婆对爱布拉娜的专属昵称——一如她叫拉芙希妮"苇草"。一根苇草，一株芒草，同一个祖母辈的女人用同样的植物语法包裹着两姐妹，好像她们还像童年那样对称地站在庄园书房的两侧。但苇草的根扎在水边，芒草的刺长在旱地。拉芙希妮在十四岁之后逐渐明白，这两个昵称从一开始就不是对称的。玛格丽特只是用了同一种爱的语言，来覆盖两种截然不同的东西。

  她的视线落在洗手池的下水口，看着水流打着旋儿消失。

  果然。温斯顿的邮件只是第一层。而这通电话——让最爱操心的长辈用充满关切的口吻，把"休学"加上"生病"的包装砸进这个狭小的洗手间——是爱布拉娜早就准备好的第二层。她甚至不需要自己发火。她只需要拿起电话，对玛格丽特说一句"苇草在日本好像不太好"，然后挂断。

  玛格丽特姑婆毫不知情。她的担心是真的，她的爱是真的，她拨出这个越洋电话时可能刚从花园里剪完最后一枝玫瑰。而正是这种真实——这种不掺杂任何算计的、纯粹的关心——让拉芙希妮无法用任何伪装抵挡。

  都柏林的包围机制里，这一层永远是最狠的。

  "我并没有生重病，姑婆。"拉芙希妮看着镜子里的自己。额前的金发有些散乱，但表情平静，"办理休学只是一些行政手续上的调整。姐姐她……可能在转述时有些误会。"

  "行政调整能调整到连课都不上？"玛格丽特的语调拔高了一点，显然不接受这种敷衍，"小苇草，你从小就不爱给人添麻烦。但如果真的是在外面受了委屈，一定要告诉我们这边。小芒草说明天派温斯顿去看看你——你可别再躲着不见人了。"

  拉芙希妮的手指紧紧扣在洗手台的瓷缘上。

  "派温斯顿去看看你"。

  温斯顿在邮件里写的是"I have been asked"。是被要求。不是主动。而现在玛格丽特用"派"这个词——她不知道这个词的重量，她只是无意识地复述了爱布拉娜在电话里用的原句。

  水流声很大，但这句"派温斯顿去看看你"就像一枚被精确制导的炸弹，炸碎了她原本想避开午餐邀约的所有借口。玛格丽特已经知道了明天的会面。如果她不去，下一个接到越洋电话的人就是姑婆——而拉芙希妮绝不会让这个七十三岁、利默里克口音、给她起名"苇草"的女人替自己承担爱布拉娜的失望。

  "我知道了。谢谢您关心。"拉芙希妮的声音里甚至带上了一点温和的笑意，那种在庄园里训练了无数次的乖巧语气，"明天我会准时去赴约的。让您操心了。"

  "这就对了。好好吃顿饭，早点回来。外面再好，哪有家里安稳。"玛格丽特姑婆在那头长叹了一口气，语调突然软了下来，"行了，你赶紧休息吧。手腕还疼不疼？"

  拉芙希妮的动作停住了。

  她的大拇指正压在右腕那条烧焦的旧丝带上。玛格丽特问的是还火那晚的烧伤——快两年了，她每次通话都会问这一句。她不知道这条丝带还缠在原处，不知道那场火在拉芙希妮的记忆里被压缩成了什么形状，不知道她口中的"小芒草"就是让那场火发生的人背后默许的人。

  她只是单纯地记得侄孙女的右手腕受过伤。

  "不疼了。"拉芙希妮说，"晚安，姑婆。"

  "晚安，我的小苇草。上帝保佑你。"

  通话切断。

  屏幕暗了下去。洗手间里只剩下哗哗的水流声。

  拉芙希妮慢慢地把手机放回台面。她的右手仍握着右腕，大拇指深深嵌在烧焦丝带与勒痕之间，指节发白。她没有哭，也没有发抖。她只是保持着这个姿势站了很久，让水流的噪音填满所有需要被填满的空隙。

  家政太太的菜单上多了一道她从不吃的菜。温斯顿的邮件里藏了一句不属于指令的话。玛格丽特姑婆用一声"手腕还疼不疼"完成了今晚最后一批包围。

  三种不构成威胁的关心。三重方向同时收紧。而爱布拉娜在伦敦没有拿起电话。

  然后拉芙希妮抬起头，关掉水龙头，扯下旁边的纸巾把手擦干。她对着镜子整理了一下散落的金发，将右腕上的旧丝带重新拉平整。

  她需要深吸一口气，然后拉开这扇门，去面对外面那个正在等她的平冢老师。
