场景: 116
幕: "第七幕·重新为奉仕部命名"
时间: "2014年6月21日 · 周六 · 体育祭当日"
地点: "总武高操场＋会议室＋特别栋奉仕部活动室"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林、比企谷小町、川崎大志、一色彩羽、户部翔、雪之下夫人、高坂理津子"
POV: "共享场景／零POV"
正文: |
  下了一整周的雨，在周五夜里停了。

  六月二十一日，体育祭当日。天空被洗成一种不太真实的蓝色，操场的白线是昨天傍晚重新描过的，边缘还带着石灰粉的潮气。只有背阴的西北角，三、四号跑道的位置，泥土仍然软得能踩出完整的脚印。

  广播里的进行曲从早上八点开始循环，彩色帐篷沿着操场西侧排开，每顶帐篷前面都插着用抓阄纸条换来的、写着杂务分工的木牌。

  奉仕部的六个人，散落在体育祭的各个岗位上。

  八幡分到了器材席。一张长桌、一本器材出纳簿、一片谁也懒得走近的阴影——他逢人便宣称这是抓阄制度的最高杰作，然后从早上八点起就把出纳簿上的每一个字都登记得一丝不苟。毕竟，要想心安理得地偷懒，首先得弄清楚到底有哪些东西存在。

  结衣和拉芙希妮在记分席。结衣的嗓子从第一项比赛开始就没停过，不管是哪个年级的选手冲线，她都挥着记分牌喊得全心全意。拉芙希妮坐在她旁边，安静地誊写着成绩单，字迹清秀得让来取结果的裁判老师多看了两眼。

  小町和大志以一年级部员的身份去了检录处当传令。两个人抱着一沓出场顺序表，在操场和检录帐篷之间来回跑，大志的哨子挂在脖子上，一次也没吹过——他只是把每一次变更都用工整的字迹写在白板的最下面一行。

  雪乃不在任何一个帐篷里。

  她拿着一张场地动线图，站在本部帐篷和跑道之间的空地上，从早上到现在，已经陆续被裁判老师、执行委员和各年级的代表叫住过十几次。十天前那张别着回形针的时间表，让整所学校都知道了"场地的事，去问奉仕部的雪之下"。

  来宾席在最靠近终点线的位置。家长们挤在遮阳棚下面，只有靠边的位置站着一个没有坐下的女人。

  雪之下夫人手里拿着一张折叠起来的赛程表，没有为任何一队鼓掌，但也没有错过任何一项比赛。

  第一项变故出现在上午九点。

  "三、四道不能用了。"体育科的裁判老师踩着西北角的泥地走过来，鞋底带着一圈黄褐色，"百米预选再过四十分钟就要检录，十二组，全塞到一、二道的话，间隔拉不开。"

  "不需要全塞。"

  雪乃把动线图翻到背面。那张纸的下半页，用铅笔画着另一套时间——她今早七点沿着操场走完一整圈之后写下的东西。

  "百米预选改为一、二道交替发令，每组间隔从三分钟延到四分钟，总时长增加十六分钟。把原定九点四十的玉入れ挪到十点整，位置向东平移十五米，那里地势高，昨夜没有积水。"她指着图上的标注，"障碍竞走的第一检查点从西北角改到南侧沙坑边，沙坑今天用不成，正好空出来。"

  裁判老师盯着那张纸看了几秒钟，又抬头看了看天。

  "……就按这个走。"

  第二项变故出现在午休前。

  足球部的三年级找到本部帐篷，为首的户部翔挠着头，语气难得的低声下气："那个，雪之下同学。按那张时间表，今天下午的器材撤收轮到我们……但是县大会就在明天，教练临时叫了赛前最后一次集合，三点钟，真的走不开。"

  按纸面上的东西，他们今天下午确实轮值。白纸黑字，签名齐全。

  雪乃低头看了一眼手里的动线图，然后从胸前的口袋里取出水笔，在撤收轮值那一栏上画了一条横线。

  "撤收改由轮转池承担，足球部的时段记为'大会前调整'，补做义务转为体育祭后第一个周五的器材点检。"她把修改后的那行字连同时间一起写进空白栏，"去吧。明天的比赛，请不要输给昨天的雨。"

  户部愣了两秒，鞠了个躬，转身跑了。

  第三项变故出现在下午一点半。

  "少了两块名次旗，一个扩音喇叭。"八幡把出纳簿摊到雪乃面前，指尖点着其中一行，"十二点二十分有人还了午休广播的器材，归还栏是空的。经手人签名有，二年级执行委员。"

  东西很快被找到了——那位执行委员图省事，把旗子和喇叭一并搬进了教师帐篷，既没有登记，也没有告诉任何人。

  雪乃没有提高音量。她只是让那位委员站在器材席前，看着他亲手在出纳簿上补写归还记录。

  "更正时间，经手人，写清楚。"她说，"出错不是问题。让下一班的人找不到东西，才是。"

  第四项变故出现在两点。

  广播里即将播报百米预选的变更通知，原稿是雪乃写的，按照新安排重新编了跑道号。

  大志从检录处跑过来，白板上密密麻麻写满了字。他指着最下面一行，声音发飘，但还是说完了："学姐，一年级生不会听新号码的。他们手里只有印好的出场表，一定会按原来的号码去排队。与其改号码，不如让他们'按原号码牌集合'，由检录处在这里把人重新分进一、二道。"

  雪乃看着那块白板，沉默了两秒。

  "修正。"

  她抽走广播稿，用一条横线划掉重新编号的那一段，在空白处重新写了一句。广播在两分钟后响起，用的正是"按原号码牌集合"。

  小町站在检录处旁边，看着这一切，罕见地什么都没有评价，只是把手里的出场顺序表又抱紧了一些。

  拉芙希妮是在记分席的间隙里注意到那位夫人的。

  来宾席的边缘，那个女人把赛程表折成了细细的一条，用一枚银色的笔在纸边上记录着什么。她站的位置，正好能同时看见本部帐篷、器材席和检录处。

  整整一天，她的目光跟随着那个拿着动线图的人，从西北角的泥地，到广播帐篷，再到器材席。

  没有走近过一次。

  放学后的会议室，窗帘半拉着，把操场方向收拾残局的声响隔在外面。

  长桌一端坐着高坂理津子，旁边是PTA的几位评议员，雪之下夫人坐在其中。另一端是雪乃，以及作为学生会代表出席的一色彩羽。

  "奉仕部年度预算与活动责任审查，现在开始。"高坂把两份文件推到桌子中央，"预算明细与委托记录，先前已由顾问复核。今天需要确认的，是体育祭期间的活动责任。"

  预算小得近乎寒酸：印刷费、纸张、茶叶。PTA的评议员翻着那几页纸，没有人先开口。

  "我有一个问题。"夫人说，"今天操场上的安排，多次与事先公布的不同。临时变更，是由谁批准的？"

  "现场判断由我作出。"雪乃说，"变更内容与时间，在发生后半小时内以更正记录的形式提交执行委员会与顾问。责任由记录指向。"

  高坂点了点头："更正记录共四份，全部收到，格式完整。"

  "如果记录与事实不符呢？"

  "那么记录就失去了意义。"雪乃回答，"奉仕部的全部工作，都建立在'记录必须能被核对'之上。"

  夫人没有继续追问。她从随身的文件夹里取出一份复印件，平铺在桌面上。

  《体育祭特别协力时间表》。正案与施行案，由一枚回形针别在一起，四根裁得整整齐齐的纸条叠在施行案的位置上。落款处，足球部与网球部的签名并排排列。

  "过去三年，同类调整表上只有让路一方的签字。"高坂的声音很平稳，"今年第一次，两方都有。"

  会议室里安静了一会儿。窗外的操场上，撤收的哨声远远地响了两下。

  "关于PTA方面提出的'奉仕部继续设置之再检讨'请求。"夫人把那张纸重新折好，收回文件夹，"提出问题的人，在得到回答之后，有义务停止提问。本学期，此项请求予以撤回。"

  她的语气和宣读一项日程没有区别。

  "这不是评价。是手续。"

  一色在旁边悄悄松了口气，立刻又坐直。

  高坂取出顾问确认页，在签字栏写下名字："那么，审查到此结束。由校方判断——奉仕部本年度的活动，学校可以负责。"

  评议员们陆续起身。夫人走在最前面，拉开门的时候，停了一下。

  "雪乃。"

  "……什么事。"

  "复印件，我保留了。"

  门合上了。脚步声在走廊里远去，没有一丝停顿。

  雪乃回到活动室的时候，夕阳正从西窗斜切进来，把长桌切成明暗两半。

  其他人都已经回去了。桌上留着结衣贴的便签："辛苦了！明天见！"，旁边压着小町画的一只熊猫，大志把白板擦得干干净净，靠在墙角。

  她从文件柜里取出蓝色硬抄文件夹，把那张别着回形针的时间表放进了"存档"那一格。

  文件夹合上的声音，在空无一人的活动室里格外清楚。

  她锁上文件柜，指尖在柜门上停了一秒。

  窗外，最后一顶帐篷也被抬走了。
