场景: 130
幕: "第九幕·以自己的名字委托"
时间: "2014年12月19日 · 周五"
地点: "成田机场第二航站楼出发层咖啡区→登机口方向"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
POV: "拉芙希妮（开场送行段零POV共享）"
正文: |
  十二月十九日，成田机场第二航站楼出发层。上午十点。

  这是日本年度出行接近顶峰的一天——导航板上滚动着各色目的地，伦敦与首尔交替。机场底光打在人群帽檐上，咖啡区的椅子是冷白色的塑料面。三个人把六张椅子围成不规则的四边形，留出拉芙希妮那一边对着登机口方向。

  桌面上摊着一张返程机票打印件，底色是阿联酋航空的橘红。起飞栏印着：伦敦希思罗，十二月二十七日。

  去程票压在返程票下面，比返程票窄一截。

  其余的物件在拉芙希妮的肩包里：一册委托记录副件、一份退出申请书副本、一份加盖家族事务所行政组收发章的回执副联、一只贴着"受益人本人·支付记录"标签的空文件夹、一只绒布袋——那只袋子按她自己的习惯也不出抽屉以外的场合。

  她把绒布袋压在肩包深层，没有再动它。

  桌面另一边是雪乃的水杯、八幡一罐从成田便利店新买的MAX咖啡、结衣倒的可尔必思加一片柠檬。咖啡区暖光落在四只手上。

  八幡把MAX咖啡罐摆在桌沿，没有立刻打开。"出发层的咖啡本来就要比校内贵百分之三十，比便利店再贵百分之二十就属于一个高二的真心。"

  "先做两轮。"雪乃先开口，"第一轮我们坐在你的位置这边。你坐对面提问。"

  拉芙希妮点头。

  八幡挪到雪乃左边。结衣挪到八幡左边。三人换位以后，咖啡区的另一侧临时成了一组——这一组的分工是"长老会临时议事小组"，没有议事地图，没有红章，仍然成立：因为真正的问题从来不在长老的桌面上。

  第一轮的三个长老身份由三人自己挑：八幡选了"托马斯，中立一票"（低声自语"太残片中立了"）；雪乃选了"布丽吉特，主持程序"；结衣选了"凯瑟琳，列席无表决"，小声又补一句"这是一种惯例"。

  拉芙希妮坐到对面这张椅子。第三轮以前，她先提一个问题。

  "如果长老对某一项放弃权问'代价'，我们怎么回答。"

  雪乃："你放弃的东西确实属于家族。按程序返回家族公共信托，或由长老会重新分配。你不是把它扔了——是交出去。"

  八幡："你已经不再用条件换东西。换还是交换；不换是不再交换。这句话听上去啰嗦，但必须说一遍。"

  结衣的回应没有扮演腔，她说的是结衣自己的话："他们要是问'谁来照顾你这一段的姐妹关系'，你不用回答财产的事，回答关系的事。他们可能听不懂，没关系，听不懂是他们的诉求，不是你的。"

  拉芙希妮把三人的回应各自一行记在委托记录副件的背面。她写完的时候抬头，咖啡区另一边的电视屏正在播一段国际新闻，没有人抬头看。

  八幡："这种训练其实挺怪。我们三个普通人坐在这里替一桌跨国长老说话。"

  "替他们说的不是观点。"雪乃说，"是这套程序的几道题，他们几乎只能那几种答法。"

  结衣："所以你做的不是看长老们，是看那几道题。"

  "嗯。"拉芙希妮说。

  第二轮的位置换回来。三人代表自己，一个一个提问。

  雪乃："温斯顿作为程序证人，可以在家族议事过程中出现吗。"

  拉芙希妮："出席半天所需的程序时间窗口可以提供。我做自我代表。他不为我主张。"

  八幡："你做自我代表的代价，是没有任何人替你说一句'对不起'。"

  "接受。"

  "你也不会替自己说。"八幡补一句。

  "不会。"

  结衣："你回来以后第一顿想吃什么。"

  拉芙希妮看着结衣。

  "这一点我不练习。"她说，"这是事实判断，不是演练习题。"

  结衣收下，没追。

  八幡那次才真正开了罐，喝了一口。铝罐上外面结了一圈极细的水珠。

  第二轮末尾，八幡看着结衣那边的中间那张空椅子。今天那张椅子没人坐——本来三个人就只坐了三张。

  "她没法在这张桌子上出现。"八幡说，"我们谁也没准备演爱布拉娜。"

  雪乃："这一场你必须自己演。"

  拉芙希妮："是。"

  结衣："因为只有你见过她愿意说真话时的样子，也只有你知道她什么时候不会说。"

  拉芙希妮把这个空位认下。

  从她这边看过去，咖啡区中间那一张空椅子被光线切过，留下一道斜长的影子。

  雪乃看时间。

  "航班是中午十二点四十。十一点四十之前你要过安检。"

  "嗯。"

  雪乃把返程机票推回拉芙希妮那一边。

  "票你自己收。返程在希思罗，二十七号起飞，二十八日抵达成田。"

  拉芙希妮把返程票推入肩包侧袋。

  八幡清了一下喉咙："如果出现你认为'坚持原方案'会带来自我牺牲的一瞬——用反自我牺牲第三款。你知道条款。"

  "我记了。"

  结衣推过来一杯温的可尔必思。

  "刚才那一片柠檬。"她说，"下一段路中间别喝着苦的。"

  拉芙希妮端起来，喝了半口。

  四个人都站起来。

  三个送行的人起身把椅子推回原位——这是雪乃的习惯。八幡顺手把新买的MAX咖啡空罐压扁，丢进最近的回收口。结衣把那只柠檬薄片留在杯里没捞走。

  三个送行的人送她到安检线。这一次没有像前几次机场那样在拐角口挥手——他们走到第一条黄线，过了线只有她一个人。

  拉芙希妮回头看的时候，雪乃站在中间，八幡站雪乃左手一，结衣站雪乃右手二。结衣手里还端着拉芙希妮喝剩下的半杯可尔必思，那一片柠檬漂在杯口。

  拉芙希妮想说一句不用等飞机起飞，又没说。

  小推车她自己推过关，排队的时候她隔着布料捻了捻肩包侧袋里那张返程票。一张来回机票的厚度，就是她能透过布料感到的那一片橘红色边角。

  十一点四十前，她的证件从出发层滑入扫描台。和上次一样过线那一段她没有回头。这一次三人留在咖啡区的位置还没动，要等她过完才走——这一点她知道。
