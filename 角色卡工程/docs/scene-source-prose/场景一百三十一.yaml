场景: 131
幕: "第九幕·以自己的名字委托"
时间: "2015年1月20日 · 周二"
地点: "伦敦·都柏林家族宅邸（长老会议事厅→三楼客房）"
人物: "拉芙希妮·都柏林、爱布拉娜·都柏林、布丽吉特·都柏林（中立长老·主持）、托马斯（长老）、凯瑟琳（长老·依例列席无表决）、玛格丽特·都柏林（在场不主持）、外部律师（程序顾问·只旁听）"
POV: "拉芙希妮"
正文: |
  一月二十日，上午八点五十分，议事厅的壁炉已经烧起来了。

  长桌铺着深绿绒面，杯碟沿桌沿摆开，每一副后面立着一块乌木名牌。拉芙希妮在"申请人"那一席坐下，把文件夹放在桌垫正中。

  昨夜抵达伦敦。今早系袖口的时候，她把右手腕的结扣转到内侧，左手腕的红绸带压平在袖口底下。在这座宅子里，两条丝带都不示人。

  律师在她侧后方的旁听席落座。公文包放在脚边。按事先的约定，今天他只听，不说。

  "人到齐了。"

  布丽吉特姨婆在主持位坐下。左手边是托马斯，右手边隔一个空位，是玛格丽特姑婆。凯瑟琳的席位在桌尾，名牌后面另立一块小牌：列席，无表决。

  八点五十九分，爱布拉娜进来。

  深色套装，紫水晶胸针别在原处。她在执行层席位坐下，把文件分成三摞摆齐，动作不快。她的面前放着一支笔。

  九点整，布丽吉特开口。

  "议事录现在开始记录。本次全体审查，应申请人本人请求召开。议程两项：第一项，今日审议拉芙希妮·都柏林之退出申请及配套协议。第二项，档案更正与责任认定，由执行层主动提交，排期一月二十三日。"

  她环视一周。

  "有异议的，现在提。"

  没有人说话。

  "第一项议程开始。"布丽吉特看向执行层席位，"执行层先作风险说明。"

  爱布拉娜站起来。

  "风险说明分三节。"她说，"先例。外部。人事。"

  "先例。都柏林家上一次有主家成员退出继承体系，在一九六二年。那一次没有协议，没有程序，后续争执延续了十一年。本次若通过，是第一次以书面协议完成退出。"

  "外部。申请人定居海外。合作方与银行方面会有人问。口径由事务所统一准备，此处不展开。"

  "人事。协议通过后，执行层不再保留对申请人的任何知悉与介入权限。相关汇报线、观察安排、在日联络，全部关闭。关闭会产生一段信息真空，家族需要适应。说明完了。"

  她坐回去。

  三节风险，从头到尾没有一句"我个人"。第三节说的是她自己手里的线。

  "退出协议文本。"布丽吉特说，"宣读。"

  爱布拉娜抽出中间那摞文件，逐条读。

  申请人放弃：继承等级、长老候选资格、家族津贴、资本权益。

  家族放弃：对申请人教育、居住、婚姻、职业之全部审查权，自协议生效日起，不附任何条件。

  日内瓦信托：独立存在，不列入本协议，不作为任何条款之交换物。

  她读到最后一条，语速没有变。

  "申请人放弃之全部权益，回归家族公共信托，或由长老会重新分配。本条明文：上述权益不得以任何形式，转入执行层任何成员名下。包括本人。"

  宣读完毕，文本放回原位。

  "在交付审议之前，"爱布拉娜说，"执行层有一份文件要先签。"

  最上面那摞里，她抽出单独一页。布丽吉特接过去，从头看到尾，点头，推回来。

  "利益回避与权限放弃声明。"爱布拉娜说，"本人与本议程存在直接利益关联。自签字之时起，回避本议程全部表决；放弃对拉芙希妮·都柏林之教育、居住、通讯、医疗与日程的一切知悉与介入权限。本声明不可撤销，不以任何后续事项为生效条件。"

  她拔开笔帽。

  拉芙希妮看着那支笔。

  笔尖落进签名栏，没有停。姓名，日期，一笔到底。她签字的速度和宣读时一样，不快，不慢。

  签完，她把笔横放在桌垫上，笔尖朝里，然后把声明推向主持位。

  "请长老会验收。"

  文件沿长桌走了一圈。托马斯看过，玛格丽特姑婆看过，列席席上的凯瑟琳也看过，回到布丽吉特手里。

  "声明记录在案。"布丽吉特说，"执行层回避。"

  爱布拉娜站起来。椅脚在地毯上没有出声。她朝主持位颔首，走向门口。

  从头到尾，她没有朝申请人席看一眼。

  门合上。壁炉里一根柴塌下去，火星短促地亮了一下。

  拉芙希妮的视线落回那张空椅子。三摞文件，被带走了一摞，另外两摞留在桌垫上。

  "申请人。"布丽吉特说，"你的陈述。"

  拉芙希妮站起来，翻开文件夹。第一页是她手写的提纲，四行字。

  "我先讲方案，再回答代价。"她说，"方案是我自己做的。做错的部分，也由我自己改。"

  "升学。早稻田大学，文学方向。报名已经完成，共通测试一月十七、十八两日，我在日本考完了。"

  "住所。千叶的公寓续租，租金由信托按年度划付，手续由温斯顿先生代办。他的权限止于代办，不做主。"

  "生计。信托覆盖教育、医疗和基本生活，覆盖不到的部分，我自己挣。它不够我一辈子不工作。这一点我知道，也不需要它够。"

  "失败条件。如果今年落榜，备用路径是明年再考，或者专门学校。两条路都在日本，不走回这座宅子。"

  她翻过一页提纲。

  "方案里还有一栏，是朋友和节日。每周的联络，每年的生日，我要保留的生活内容。这一栏写不进协议，我也不请求各位批准。只是告知：它不出让。"

  "最后一行。我留在日本要做什么。"她说，"读文学，写东西。我要成为作家。"

  议事厅里静着。壁炉烧得很稳。

  "讲完了。请提问。"

  托马斯把面前的协议文本翻过一页。

  "代价。"他说，"你放弃的东西是实实在在的。继承等级，席位候选，津贴，资本权益。换回来的是几项审查权的放弃。账目上看，你出的多。"

  "账目上看，是。"拉芙希妮说，"我放弃的东西属于家族，按协议回归家族公共信托，或由各位重新分配。我不是把它扔了，是交还。交还的东西作价多少，不由我衡量。"

  "你用什么保证，三年以后不后悔。"

  "没有保证。"她说，"后悔的可能写在我的失败条件里，由我本人承担，不转让，不追索。协议上'不附任何条件'那一句，对双方一样。"

  托马斯靠回椅背。过了一会儿。

  "去年八月，"他说，"保险会社出过一份调查报告。我听说，认证謄本在你手上。"

  长桌四周静了下来。玛格丽特姑婆垂着眼睛。旁听席上，律师翻页的手停在半空。

  "在我手上。"拉芙希妮说。

  "你今天没有提交它。"

  "它不在今天的议程里。"她说，"今天我请求通过的每一条，都不需要它才成立。它不是抵押品。我不用任何人的错误，给自己换东西。"

  托马斯看了她很久。

  "问完了。"他说。

  凯瑟琳在桌尾翻开列席用的薄本子。

  "程序问题，两个。"她说，"第一，协议生效后，申请人的姓氏与私人亲属关系如何处置。第二，协议有没有解除条款。"

  "姓氏保留，私人亲属关系不变。"拉芙希妮说，"我退出的是继承与控制这套体系，不是退出血缘。"

  "解除条款，没有。"布丽吉特替她答了，"协议生效即永久，与声明一致。"

  凯瑟琳记下，合上本子。

  布丽吉特看了看长桌两端。

  "表决。"

  今天的议事录由凯瑟琳兼记。她提笔，逐栏填写。

  "执行层，回避，不计入。凯瑟琳，列席，无表决。"布丽吉特念着，"埃德蒙·都柏林长老，书面委托本人代为声明：弃权。托马斯长老。"

  "赞成。"

  "玛格丽特长老。"

  玛格丽特姑婆伸手，把面前那块乌木表决牌推过绒面上的中线，推进"赞成"那一格。

  推过去的时候，她的目光越过桌面，在拉芙希妮右袖口那一寸上停了一瞬，随即收回。

  "布丽吉特长老，主持，依例不投票。"布丽吉特自己念完最后一句，"表决结果：赞成两票，弃权一票，回避一员，无反对。退出协议，通过。"

  凯瑟琳的笔尖走完最后一行。

  "第一项议程结束。"布丽吉特合上卷宗，"第二项，一月二十三日，上午九点。执行层提交，关系人到场。散会。"

  人们起身，椅脚在地毯上陆续响。托马斯经过申请人席时朝她点了一下头，什么也没说。

  拉芙希妮收拾文件夹。执行层的席位空着，那支笔横在原处，没有人来收。

  走廊里，律师跟上来。

  "我的部分到此为止。"他说，"周五上午我还在。旁听席。"

  "谢谢。"拉芙希妮说，"周五见。"

  回到三楼客房，她在书桌前坐下，拿出手机。

  "第一项通过了。周五还有一场。"

  群聊里只发这一行。发完她把手机扣在桌上，没有等回复。

  房间里没有任何事等着她做。协议通过了，声明签了，下一次敲门声在三天以后。

  今天做完了。
