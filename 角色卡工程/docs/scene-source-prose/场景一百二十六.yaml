场景: 126
幕: "第八幕·归国与失语"
时间: "2014年10月16日 · 周四"
地点: "拉芙希妮公寓→总武高（三年J班→奉仕部活动室）→拉芙希妮公寓"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、比企谷小町、川崎大志、家政太太、爱布拉娜·都柏林（家族专机短信）"
POV: "拉芙希妮"
正文: |
  十月十六日的早晨，千叶的天空高得发蓝。

  拉芙希妮站在卧室的镜子前系袖扣。将左手腕的红绸带理平，贴进袖口边缘；右手腕，焦黑旧丝带的结扣转到内侧，藏进右边的袖口里。两条丝带，一条向着学校，一条不向任何人。

  今天她十八岁。

  餐桌上的早餐和平日一样，只有一处不一样：盘子旁边多了一只很小的纸盒，里面是一块草莓蛋糕，下面压着一张便签——"生日快乐。今天请早点回来，晚餐会做您喜欢的炖牛肉。"

  是家政太太的字。不是"那边"的字。

  "蛋糕是我的一点心意。"家政太太在厨房里说，没有抬头，"和任何人都没有关系。"

  "谢谢。"拉芙希妮说，"我会早点回来的。"

  门口的信箱里，躺着一封国际挂号。

  牛皮纸信封，很厚，日内瓦的邮戳。寄件人是一家瑞士的私人银行，收件人写着她的全名。家政太太递给她的时候补充了一句："早上刚到，需要本人签收的那种。"

  她在餐桌前拆开。

  信很正式，英文，三页。受托银行通知：由科尔马克·都柏林设立的日内瓦信托，于受益人年满十八周岁之日，进入可启动状态。受托银行确认其独立启动资格——教育、医疗与基本生活的支出通道，自即日起对受益人本人开放。信里写明：都柏林家族与其任何成员，均非本信托的授权方，无权冻结、撤回、支配，或附加任何条件。

  规模一栏没有写数字，只写了适用范围：用作完成大学教育、覆盖医疗与基本生活。

  设立人一栏，是父亲的名字。

  拉芙希妮坐在晨光里，把三页纸从头到尾读了两遍。第二遍读得很慢，慢到咖啡凉了半杯。

  她把信折好，放回信封，拿到卧室，拉开珍藏抽屉，放了进去。抽屉合上的时候，没有声音。

  今天不做任何决定。信可以等。它只是"可以"——而"可以"今天只需要躺在那里。

  玄关换鞋的时候，她的视线在家族专机上停了一秒。

  它躺在托盘里，屏幕是暗的。

  八月十二日之后，它就没有再亮过。没有日程表，没有礼物清单，没有监督指令，没有强制视频通话的请求——那种不允许拒接的请求，从前一个月总有一两次。

  温斯顿先生的邮件只有学校的事务。家政太太不再有"那边"的话要转达——九月的第三个星期，她第一次问自己："下周的菜单，您想吃什么？"以前，菜单是"那边"定的。

  这不像是放手。放手是有形状的，而这片沉默没有。它更像一句话停在半路上，找不到下半句。

  她也没有主动发过任何消息。她每周给家族专机充电，放在托盘里。仅此而已。

  ——

  三年J班的这一天和平常没有任何区别。没有人起哄，没有人声张——她的生日不在任何班级档案的公开视野里，这让她得以安安静静地听完了一天的课。

  放学后的活动室，门一拉开，情况就不一样了。

  "生日快乐——！！"

  彩带从门楣上垂下来（一看就是小町的手笔），长桌中央摆着结衣早上烤好的蛋糕，六只杯子已经摆好，连八幡的位置上都放了一小枝从窗台花盆里掐下来的新叶。

  "部员名册上有生日！"小町得意地宣布情报来源，"小町早就盯上了！"

  "拉芙希妮酱，快许愿吹蜡烛！"

  礼物堆在她面前。结衣的是一盒手作饼干，每一块的形状都不一样；小町的是一个熊猫挂件，圆耳朵，"和小町画的是同款"；大志的是一枚书签——用手工一层一层压出来的，边缘打磨得很平，"不值钱，但是能用"；八幡把一罐MAX咖啡推到她面前，眼睛看着别处："拿着，提神用。别误会，只是顺便多买了一罐。"

  "谢谢。"拉芙希妮把咖啡罐接过来，"我会好好喝的。"

  雪乃的礼物最后才给。一本深蓝色封面的文库本，没有包装，只在扉页夹了一张素色的纸签。

  "……姑且。"她说，"读过之后，把感想告诉我。"

  "好。"拉芙希妮双手接过来，"一定。"

  蛋糕是小町切的，这一次六块一样大——她切之前用尺子比着量了，被八幡吐槽"你对哥哥的那份怎么就凭感觉"，小町理直气壮："今天是拉芙希妮姐的生日，当然要公平！"

  许愿的时候，结衣非要关灯。蜡烛的光在暗下来的活动室里晃，六个人围着长桌。

  拉芙希妮看着那一点火。

  愿望这种东西，她想，今年的好像已经有很多了。多到不需要再向蜡烛申请。

  她吹灭了它。

  ——

  回到公寓，已经过了九点。

  家政太太八点钟就下班了。炖牛肉温在锅里，灶台上压着一张"请慢用"的便签。她吃完了，把碗碟洗好放回橱柜。房间静下来的时候，还不到十点。

  拉芙希妮洗完澡，换上睡衣，坐在书桌前。深蓝色封面的文库本摊在台灯下，她读了十几页，又合上。今天读不进字。

  十一点过了一点。

  家族专机亮了。

  不是强制视频通话，不是通话请求。只是屏幕亮了，在黑暗的房间里发出一小片冷白的光。没有来电号码，只有一行字，安静地躺在那里：

  "生日快乐，拉芙希妮。"

  四个字，加一个名字。没有"永远"，没有"只要你需要"，没有日程，没有礼物单，没有"姐姐"这个落款。

  她盯着那片冷白的光，看了很久。

  六十五天。第一句。

  它甚至称不上一句话——它没有要求她回复，没有要求她回家，没有要求她成为什么。它只是在这一天结束之前，从那句没有说完的"永远——"的残骸里，被艰难地、一个字一个字地拼了出来。

  拼它的人，比她大十一分钟。

  拉芙希妮拿起手机。

  她的拇指在屏幕上悬了一会儿，然后落下去，打了三个字。

  "你也是。"

  发送。

  屏幕安静了几秒，跳出"已读"两个字。然后它暗了下去，没有再亮起第二条。

  没有第二条了。今晚不会再有了。两个共享同一天的人，隔着九千多公里，把这一天的最后一点东西，一人拿走了一半。

  她把手机放回桌上。

  屏幕朝上，放在台灯旁边。

  台灯的光落在那部暗下去的机器上，落在深蓝色封面的文库本上，落在抽屉的方向。十月十六日的夜很深，千叶的秋虫在窗外叫得断断续续。

  明天还有部活。

  她关了灯。
