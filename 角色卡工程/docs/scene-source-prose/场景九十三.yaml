场景: 93
幕: "第六幕·春假战备"
时间: "2014年3月26日 · 周三 · 11:05—12:20（春假）"
地点: "千叶站西口 · Café Lento"
人物: "拉芙希妮·都柏林、由比滨结衣、比企谷八幡（雪之下雪乃缺席）"
POV: "零 POV 共享场景"
正文: |
  门拉开的时候，暖气迎面涌出来，混着磨豆机的噪音和樱花糖浆的甜味。

  拉芙希妮在门口停了不到一秒，视线从左边的落地窗滑到右边的点单台，最后落向店内靠墙的四人桌。那里背对入口，左边是实墙，右边是通往洗手台的窄过道。从座位上能看见整间店，窗外来往的人却看不清桌边人的侧脸。

  她径直走过去。结衣的手还扶着玻璃门，愣了一下才跟进来。

  椅子拉开的声响被背景音乐压住。拉芙希妮坐下，先把深蓝色围巾从脖子上解下来，对折两次，码在膝盖上。手机从风衣左边口袋取出，屏幕朝下扣在桌角，与钥匙分别占据桌面两端。

  结衣站在点单台前，回头朝她扬了扬手。

  "拉芙希妮酱——要喝什么？"

  磨豆机把后半句话吞掉了。结衣先指了指菜单上的樱花拿铁，又点向收银台旁的限定杯展示架。

  "和你一样就好。"

  结衣端回来的托盘里放着两杯樱花拿铁，旁边还有一只刚从纸盒里拆出来的粉色陶瓷杯。杯口竖着两只立体猫耳，是店里三月限定的加购品。收据压在空杯下面，最末一行印着商品价格。

  拉芙希妮看了那只杯子几秒，伸出手，指尖抵住杯底，把猫耳转向自己。

  "谢谢。"

  "我只是帮你端过来而已啦。"结衣在对面坐下，捧起自己的拿铁喝了一口，立刻皱起鼻子，"好甜。"

  她说完便盯着猫耳杯，右手从杯壁上松开，手指在桌面上抠了两下。

  暖气口的风正好从头顶吹下来。拉芙希妮把围巾往膝盖上压了压。

  "你的鼻尖还是红的。"

  结衣用手背蹭了一下鼻尖，又缩回手去捧杯子。

  "外面真的很冷嘛。"

  她低头喝了一口，视线很快又绕回那张空着的椅子。

  拉芙希妮把手机翻过来。屏幕上显示十一点零五分。群聊对话框还停在她发出的那句话上。

  「今天有空吗？我想和你们见一面。」

  下面是结衣的一串感叹号和八幡的“收到”。雪乃没有回复，消息的已读人数也没有增加。

  拉芙希妮锁上屏幕，把手机放回原处。这次屏幕朝上。

  "……小雪乃还没回吗？"

  "嗯。"

  "小企之前回了吧？"

  "回了。"

  结衣把吸管从杯子里拿出来，在纸巾上蹭掉奶沫。她没有继续问雪乃去了哪里，而是从帆布包里抽出一张折了三次的便笺。

  "餐厅那边，我打了四通电话。"她把便笺摊在两人中间，"两家周末的包间都满了。新大谷幕张酒店的西餐厅可以先留一个包间，四月四号以前取消都不用付钱。我还没有告诉他们最后人数。"

  她在“人数”两个字下面画了一个小小的问号。

  "做得很好。"拉芙希妮说。

  "这句话怎么听起来那么像小雪乃……"

  店门在这时被推开。冷风顺着门缝灌进来，门顶的铃铛响了一声，又钝又短。

  结衣先回过头。

  "小企——！"

  八幡从门口走过来，手还插在风衣口袋里。他的视线扫过桌上的两杯拿铁，在那只粉色猫耳杯上停了停。

  "……那个杯子很像幼儿园的奖励品。"

  "才不是奖励品！是限定商品！"

  结衣的声音一下扬起来。八幡拉开拉芙希妮斜对面的空椅子，把书包搁在脚边。他坐下后又看了一眼猫耳杯。

  拉芙希妮把空杯往桌子中央推了半寸。

  "比企谷同学喜欢猫吗？"

  "你是怎么从刚才那句话得出这种结论的。"

  "你看了它三次。"

  "我是在确认人类的审美究竟能退化到什么程度。"

  拉芙希妮没有反驳。她把右手松松握起，第二个指节在桌面轻叩一下。

  "喵。"

  八幡的手停在书包拉链上。

  结衣捂住嘴，肩膀抖了起来。

  "拉、拉芙希妮酱，你在干嘛啊……小企整个人都卡住了！"

  八幡把脸转向窗外。

  "不要在公共场合做这种麻烦的行为。猫会掉毛，还挑食，而且凌晨四点会踩人肚子。"

  "很具体。"拉芙希妮说。

  "一般常识。"

  拉芙希妮把猫耳杯推到他手边。

  "那这个归你了。"

  "我没说我要。"

  "没关系。你已经看了第四次。"

  八幡没有拿杯子，也没有把它推回来。结衣趴在桌边笑了一会儿，原本不断瞥向空椅子的视线终于停了下来。

  拉芙希妮端起拿铁喝了一口，然后把杯子放回托盘。

  "雪乃今天大概来不了。"

  结衣抓着杯耳的手指紧了一下。八幡靠回椅背，视线从拉芙希妮脸上移到桌沿。

  "她去了本邸。"拉芙希妮说，"她母亲让她回去，可能和之前签过的进路文件有关。具体情况我不清楚。"

  "雪之下知道多少？"八幡问。

  "信是她帮我写完的。今天的安排，她还不知道。"

  八幡看了一眼桌角亮着的手机，没有追问。

  拉芙希妮把邮寄回执放在结衣的便笺旁边。

  "今天早上，我把信寄往伦敦了。寄出的只有信。爱布拉娜最快后天收到。"

  结衣的笑意收住。

  "所以，她真的会来吗？"

  "会。"拉芙希妮说，"只是不会按照我们希望的方式来。"

  她把钥匙往桌面中央推了一点。

  "从今晚开始，我暂时住在平冢老师那里。公寓里的家政太太、家族专机和固定电话都不能继续作为安全联络渠道。日常手机保留，紧急情况用雪乃之前给我的号码。"

  结衣张了张嘴，最后把那张餐厅便笺又往拉芙希妮面前推近了一些。

  "那我把包间先留下。"她说，"就算最后不用，也可以到四号再取消。"

  "嗯。谢谢。"

  八幡拉开书包，从里面取出三张打印纸和一幅折叠地图。

  "千叶站两公里内的酒店，我查了七家。"他把其中两张翻到背面，"把外宾接待和独立出入口算进去，没有一家合适。所以我把范围往幕张扩大了。再加上都柏林上次使用新大谷酒店的记录，最可能的是新大谷幕张。"

  他的笔尖落在地图靠近海滨幕张的位置。

  "从成田机场可以直接走高速，不必经过千叶站，也不会靠近你的公寓。酒店有能绕开大堂的宴会入口。她如果带助理和司机，这里最省事。"

  拉芙希妮看着地图上的圆圈。

  "姐姐会选择已经通过家族审查的连锁酒店。新大谷的概率最高。"

  "那餐厅也不用换地方了。"结衣用笔把自己便笺上的酒店名称圈起来，"她住楼上，我们约在楼下。有其他人，也有包间。"

  "公开场所、固定预约、取消期限。"拉芙希妮依次看过地图、便笺和回执，"可以。"

  八幡把笔横放在地图上。

  "先说好，这只是对方按照常识行动时的方案。"

  "爱布拉娜最擅长让别人误以为她会按照常识行动。"

  "听起来真是个值得跨越半个地球来见的好姐姐。"

  "如果你当面这样称赞她，她会很高兴。"

  "那还是算了。被国际财阀高兴地记住，怎么看都不像长寿的秘诀。"

  结衣在两人之间看了看，把便笺转正。

  "所以现在是：拉芙希妮酱住平冢老师家，小企继续看酒店，我先保留餐厅。小雪乃回来以后，我们再一起确认，对吧？"

  "对。"拉芙希妮说。

  她拿起手机，在群聊里输入会议摘要。

  「信已寄出。今晚起暂住平冢老师处。酒店第一候选为新大谷幕张，餐厅包间暂留至四月四日。详细资料等你回来后一起确认。」

  八幡看着她按下发送。

  "雪之下回来以后，大概会给这份摘要写三页修正意见。"

  "我给她留了修改时间。"

  手机被放回桌角，屏幕朝上。消息停在群聊最下方，旁边仍然没有新增的已读人数。

  对面的第四把椅子还空着。
