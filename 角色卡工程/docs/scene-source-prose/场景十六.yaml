场景: 16
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月下旬 · 林间学校出发前 2-3 天"
地点: "奉仕部活动室"
人物: "雪之下雪乃、拉芙希妮·都柏林、比企谷八幡、由比滨结衣"
正文: |
  距离林间学校的项目发布已经过去了一周。

  活动室的长桌上，散落着几份重新打印过的行程表和分组名单。由比滨结衣正趴在桌边，用粉色的荧光笔在行程表上画着圈，嘴里念叨着还需要买些什么防蚊喷雾。对面的比企谷八幡单手托腮，视线落在窗外的虚空中，仿佛要把自己从这个即将到来的集体活动中摘除出去。

  雪之下雪乃伸手将几张被由比滨弄乱的打印纸拨回原位，边缘对齐。

  随着一声轻响，活动室的拉门被推开。

  拉芙希妮·都柏林站在门口。和往常一样，她在跨过门槛前有大约一秒钟的停顿。那双翡翠色的眼睛迅速扫过室内的陈设和每个人的位置，像是在确认某种安全距离，随后，她迈步走过来，在雪乃身旁的空位上坐下。

  "拉芙酱，你来啦！"由比滨立刻抬起头，手里的荧光笔晃了晃，"我们正在讨论周末要去买防晒霜的事，你要一起去吗？"

  "……如果不麻烦的话。"拉芙希妮将书包放在一旁，声音平稳，"我确实还需要准备一些东西。"

  雪乃看了一眼拉芙希妮的手。那截烧焦的旧丝带在深色校服袖口边缘若隐若现。

  "既然是作为学生指导员随行，"雪乃翻开手边的一个文件夹，"就不只要准备私人物品。平冢老师中午把最终的确认表交给了我，要求奉仕部全员在今天之内完成最后的信息核对。"

  说着，她将几份纸页分别推向桌面的三个方向。

  比企谷拿起那张纸，发出一声干瘪的叹息："连血型和过敏史都要确认，不知道的还以为我们要去原始森林探险。简直是多此一举。"

  "以你那种随时准备在平地摔倒的体质，我不认为这是多此一举。"雪乃没有抬头，"请端正态度填好，比企谷同学。"

  由比滨倒是很认真地咬着笔帽开始填写。

  拉芙希妮看着推到面前的那张表格，视线停留在某个特定的栏目上，久久没有下笔。

  雪乃的余光捕捉到了她那个细微的僵硬动作。她的右手手指又无意识地蜷缩了一下，指尖轻轻碰到了手腕上的丝带。

  一周前，拉芙希妮看着那份项目介绍册时，也是这种在抗拒与妥协之间拉扯的反应。雪乃不清楚她在那五天的脱离背后需要应付什么样的阻力，但从她这几天愈发频繁地整理桌面的举动来看，阻力并没有消失。

  "都柏林同学，如果有看不懂的日文词汇，可以查阅字典。"雪乃端起手边的瓷杯，声音冷淡而清晰，"但'家属及应急联络人'那一栏，是校方出于风险管控必须留存的基础信息。空着是不被允许的。"

  这句话让拉芙希妮微微抬起了头。

  "……我知道。"拉芙希妮停顿了一拍，声音比刚才更轻，"我只是……在想该留哪个号码比较合适。"

  "这种事情有什么好想的，填你父母的或者监护人的不就行了。"对面的比企谷随口接了一句，然后似乎察觉到了什么，死鱼眼向这边瞥了一下，闭上了嘴。

  由比滨也从表格上抬起头，看看拉芙希妮，又看看雪乃，敏锐地察觉到空气中有一丝不自然的紧绷，她干笑了一声："那个，其实填小町的号码应该也可以吧？小企？"

  "别把我妹妹卷进这种麻烦事里。"比企谷迅速反驳。

  拉芙希妮没有接由比滨的话茬，她看着表格上那条空白的横线，水性笔的笔尖悬在上方。

  雪乃轻轻放下茶杯，瓷器与桌面碰撞出一声清脆的声响。

  "如果你因为跨国通讯的延时问题，难以确定合适的海外联络人，"雪乃伸手，从自己的文件夹最下方抽出一张纸，那是她自己已经填好的那一份。她将其推到了拉芙希妮和自己课桌的交界处。

  "这并不是在替你做决定，只是出于奉仕部部长对项目顺利进行的负责。"雪乃看着前方的黑板，语气依然像是在陈述某种校规，"作为同桌和同部员，如果在突发情况的五分钟内需要找到一个能接听电话，暂借我的联系方式，是最符合逻辑选项。"

  纸张边缘，是雪乃娟秀整齐的字迹，旁边跟着一串十位数的手机号码。
