场景: 26
幕: "第三幕·二学期"
时间: "2013年9月 · 二学期开学第一天 放学后"
地点: "奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
正文: |
  二学期的第一天，总武高中的空气里还残留着未散尽的暑气。
  放学后的特别栋走廊比主教学楼要安静得多。拉芙希妮推开那扇熟悉的活动室拉门时，长桌靠窗那一侧的由比滨结衣已经到了，正将一个巨大的双肩包扔在旁边的椅子上。

  "啊！拉芙希妮酱！"结衣几乎是立刻转过身，声音里带着未经修饰的雀跃，脚步在长桌和门之间挪动了半步，似乎在考虑是否要扑过来。但她极度敏锐的空气读取能力让她在拉芙希妮惯有的得体姿态前停住了。
  结衣的视线飞快地在拉芙希妮浅金色的头发上扫了一圈。那里依然梳理得一丝不苟，没有别上那枚廉价的粉色塑料发卡。她琥珀色的眼睛里闪过一丝极短的失落，但很快又被更耀眼的笑容盖过。
  "暑假过得好快哦。总觉得林间学校还是昨天的事呢。"结衣拉开椅子坐下，双手撑在桌面上。

  拉芙希妮走到长桌中间的位置拉开椅子。她当然注意到了结衣刚才视线的落点。那两枚发卡现在正安稳地躺在她制服裙的最深处口袋里。她暂时还不知道该如何将这种带有高浓度私人情感的物品展示在可能被家族评估的视野中。
  "……很久不见，由比滨同学。"拉芙希妮将随身的几本教科书和一本英日对照的诗集整齐地叠放在桌角，声音一如既往地平缓，但没有后退。

  长桌靠热水壶的一端，雪之下雪乃正背对着她们，将茶叶拨入瓷壶中。
  "如果不把课本收进书包里，明天早上你大概率会因为忘记带作业而在F班面临尴尬的处境，由比滨同学。"雪乃没有回头，声音里带着一贯的冷淡和挑剔规则，但水流注入茶壶的声音却稳定。
  结衣心虚地缩了缩脖子："小雪乃还是这么严厉……不过，能再听到这种话，总觉得安心了呢。"

  比企谷八幡坐在长桌的另一侧，单手托着下巴，死鱼眼盯着黑板上根本不存在的板书。
  "你的受虐倾向在过了一个暑假后似乎又升级了。"八幡用干瘪的语气吐出一句，随后身体微微向后靠在椅背上，"不过，能这么吵闹，证明各位的暑假作业大概是都抄完，或者放弃了吧。"

  "如果你试图将自己那套腐朽的生存哲学强加于人，我建议你先去平冢老师那里领一张退部申请。"雪乃转过身，将三个茶杯分别推到另外三人面前。
  给结衣的是果茶，给八幡的依然是无糖红茶。而推到拉芙希妮面前的那杯红茶里，并没有像林间学校那一晚那样放进笨拙的三块方糖。

  拉芙希妮的视线在杯口的白色热气上停顿了一拍。
  没有方糖。这意味着雪乃清楚那晚的额外加糖只是特殊环境下的安抚，而现在的奉仕部是日常的延续，不需要那种过度甜味的包裹。
  这种精准而克制的照料，比什么都不做更让拉芙希妮感到一种脚踏实地的真实感。
  她的右手本能地抬起，指尖隔着校服袖口轻轻压了一下手腕上那根烧焦的旧丝带。那个关于"永远"的探讨又一次在脑海中浮现。

  "比企谷同学，"拉芙希妮端起茶杯，没有看对面的八幡，只是盯着水面，用一种干燥的语气说道，"你刚才把自己那份没写完的作业，也算进了我的行程表里。请不要擅自替我做这种低效率的假设。"

  八幡的动作明显僵了一下，他似乎想反驳，但最终只是咂了下嘴，移开了视线："……知道了。算我多嘴。"
  结衣看着这一幕，忍不住发出了拉长音的感叹："诶——拉芙希妮酱，你刚才那句话，好像越来越像小雪乃了……"

  雪乃正在端起茶杯的动作在半空中凝滞了极短的几秒，随后她微微垂下眼睑。
