场景: 96
幕: "第六幕·春假战备"
时间: "2014年3月31日 · 周一下午 → 4月1日 · 周二傍晚 · 春假"
地点: "新大谷酒店 → 平冢静的公寓"
人物: "拉芙希妮·都柏林、平冢静（爱布拉娜 · 电话）"
正文: |
  阿斯顿马丁 V12 Vantage 的引擎声在拥堵的午后街道上被压抑成了一种低沉的轰鸣。

  车厢内充斥着新大谷酒店香氛的残留气味，混合着平冢静外套上淡淡的烟草味，形成了一种奇异的、将刚刚那场午餐彻底隔绝在外的物理边界。

  拉芙希妮坐在副驾驶的位置上，目光越过挡风玻璃，落向远处被高楼切割的天际线。原本还算明媚的天空，不知从什么时候起堆叠起了大片灰黑色的积云。那种沉甸甸的、随时会压下来的阴霾，像极了伦敦冬日里永远化不开的冷雨。

  温斯顿连一句重话都没有说。他只是穿着笔挺的西装，用最规范的措辞，替玛格丽特姑婆转达了对她"因病休学"的深切担忧。平冢静坐在邻座，那双锐利的眼睛审视了他整整九十分钟，然后在账单送来时，先他一步把卡抽了出来。

  "都柏林家的协调人，没有让高中老师买单的道理。"

  温斯顿的眉毛动了一下。拉芙希妮认识那个表情——他在判断平冢静是敌是友。但平冢已经转过身去签单了，没有给他判断的时间。

  车子在一个红灯前缓缓停下。

  拉芙希妮悄无声息地深吸了一口气。她没有去扯领口，也没有揉捏因为紧张而有些酸痛的额角。长期的家族训练在这一刻接管了她的身体：脊背微微挺直，并没有倚靠在椅背上；双手交叠，规矩地放在风衣的膝盖部分；下巴微收，翡翠色的眼睛里甚至还维持着一丝恰到好处的平静。

  越是恐惧，越要得体。这是她在阴影里生存下来的本能。

  平冢静的视线一直落在前方的红绿灯上，双手随意地搭在方向盘上。她没有问拉芙希妮刚才在里面到底听到了什么，也没有发表任何关于大家族冷血做派的愤慨。

  随着绿灯亮起，车子重新汇入车流。平冢静只是单手降下了一点车窗，让外面略带潮气的冷风卷进来一瞬，吹散了车厢里那种滞重的暖意。

  "还有大概十分钟。"平冢静目视前方，语气里没有往日那种大大咧咧的调侃，只是陈述着一个冰冷的距离，"如果觉得车里闷，右边的储物格里有常温的矿泉水。"

  拉芙希妮没有去动储物格里的矿泉水。

  她把视线重新投向窗外。红绿灯交替的倒影在玻璃上划过，远处的阴云被风揉成了一团混沌的深灰色。车厢里的安静还在继续发酵，那种即使裹着羊绒围巾也依然从骨缝里渗出来的寒意，让她本能地想要抓住点什么。

  "今天的天气真差。"

  她突然开口，声音比平时稍微干涩了一点。没有称呼，也没有加上敬语，只是像一个普通的、因为没带伞而对坏天气感到心烦的高中生一样，生硬地抛出了这句抱怨。

  平冢静转动方向盘的手停顿了不到半秒。她没有立刻接话，而是将车窗彻底升了上去，把冷风挡在了外面。

  "千叶春天的天气就是这样，像个更年期提前的老太婆。"平冢静的声音在一片密闭的车厢里响了起来，带着她惯有的一点粗鲁和漫不经心，"等会儿要是下大雨，明天的体育课估计又得改成室内理论了。真麻烦。"

  拉芙希妮悄悄扣紧在一起的指尖松开了一点。平冢老师不教体育，明天也没有体育课。这几句毫无逻辑的抱怨，就像是用一把钝剪刀，勉强划开了车厢里那层令人窒息的膜。

  十几分钟后，沉闷的引擎声在高级公寓的地下停车场里熄灭。

  空旷的水泥空间里只有皮鞋踩在地面上轻微的回音。拉芙希妮跟在平冢静身后，走进了电梯。金属轿厢的门缓缓合拢，数字指示灯随着轻微的失重感一层层跳动。

  推开公寓大门的那一刻，熟悉的气息扑面而来。那是没有散尽的咖啡味、淡淡的烟草香，以及早晨煎蛋时留下的、属于普通生活的烟火气。

  "咔哒"一声，平冢静反手落了锁，顺手把车钥匙扔在玄关的置物盘里。

  冰冷的皮鞋被替换下来。棉质拖鞋的绒毛接触到脚底的那一刻，从脚踝一直窜到后颈的那股属于伦敦的阴冷，终于被切实地阻断了。

  她直起身，看着平冢静已经一边扯着领带一边走向客厅的背影。即使背对着她，那位大人那副完全不设防、把家务抛之脑后的松懈姿态，也让这间公寓显得无比安全。

  拉芙希妮解下脖子上的羊绒围巾，搭在玄关的衣架上。

  窗外，那片从午餐后就一直在堆叠的积云，已经压到了贴着楼顶的高度。

  ——

  第二天傍晚，那层积云终于裂开了。

  拉芙希妮站在开放式厨房的料理台前，将滤纸折好放进滴漏杯里。热水刚好滤过最后一点咖啡粉，焦苦而安定的香气在室内散开。平冢静窝在沙发上翻着一份教育委员会的简报，电视开着但没有声音，天气预报的云图正在循环播放千叶全域的雷雨警报。

  如果不做点什么，昨天那顿午餐留在胸腔里的钝重感就会一直待在那里。她选择了咖啡——磨豆、控制水温、等滴漏完成。每一个步骤都精确、可预期、不需要思考。

  她放下细口壶，正准备将咖啡液分装进两只马克杯。

  "嗡——"

  放在料理台边缘的家族专机突然震动起来。屏幕同时亮起，原本应该休眠的界面上，跳出了一个只有单一字母的来电显示。

  E。

  那个字母像一把锋利的餐刀，瞬间切断了所有属于这间公寓的生活气息。刚刚还在被咖啡壶热度温暖的手指，迅速从指尖冷到了手背。

  那是专门为长姐设定的代号。Eblana。不是"姐姐"，不是"爱布拉娜"——只是一个字母。拉芙希妮在十四岁那年的某个夜晚把全名从通讯录里删掉了，换成了这个。好像少掉几个字母就能减轻那部手机的重量。

  当然没有。

  她盯着那个不断跳动的 E，没有立刻接起，也没有伸手去按拒接。逃避是没用的，不接电话只会让下一次的制裁来得更加猛烈。

  沙发那边传来打火机盖被合上的"啪"的一声轻响。平冢静没有问是谁，但那细微的动静像是在提醒她：这间屋子里有第二个人。她不是一个人。

  拉芙希妮闭了闭眼，勉强将肺里的空气挤出去，用微凉的手指滑开了接听键。

  "……姐姐。"她强迫自己的声音保持平稳，但尾音还是不受控制地轻颤了一下。

  "亲爱的拉芙希妮，千叶现在应该快下雨了吧。"

  电话那头的声音优雅、平缓，带着没有任何失真的纯正英音。即使隔着大半个地球，爱布拉娜依然能将这种像是在谈论天气般的语气，精准地投射到拉芙希妮的耳膜上。

  拉芙希妮没有接话。她知道，那不是关心，那是确认掌控权的开场白。

  "我收到了一份来自总武高校方的通报备份。内容很有趣。"爱布拉娜在那头翻动了一下纸张，纸页摩擦的沙沙声清晰可闻，"出于'健康原因'的休学申请？并且连公寓都搬空了。"

  对方完全没有提高音量，却让拉芙希妮握着手机的指缝开始出汗。

  "既然病得连学都上不了，为什么不告诉我呢？如果是需要休养，我也好安排温斯顿直接带你去那几家私立疗养院看一看。"爱布拉娜的语速放慢了半拍，每一道气音都带着不容置疑的笑意，"还是说，你现在正躲在某些地方，觉得那样就算'逃掉'了？"

  "我——"

  拉芙希妮刚准备出声，喉咙里的音节还没来得及构成完整的句子。

  窗外的天空骤然暗了下去。

  紧接着，"轰——"的一声闷雷毫无征兆地砸在千叶的市区上空。那声音沉闷而巨大，震得公寓的玻璃窗都跟着发出了令人不安的嗡鸣。

  这突如其来的巨响狠狠切断了拉芙希妮紧绷的神经。她本能地瑟缩了一下，右手不由自主地一抖——还握着细口壶的指节猛地松了力道。

  滚烫的深褐色咖啡液顺着壶嘴剧烈晃动。几滴热液直接跃过马克杯的边缘，重重地飞溅在拉芙希妮苍白的手背上。

  针扎一样的灼痛感瞬间在皮肤上炸开。她咬住下唇，将那声即将溢出喉咙的痛呼硬生生地咽了回去。眼眶因为疼痛和强忍的惊惧而微微发酸。

  但比烫伤更尖锐的，是这雷声和痛觉组合在一起，强行从脑海深处撬出的那段记忆。

  那是一个很旧的画面。那时候的伦敦也总是下这样吓人的雷雨。每当有雷声砸下来，那个总是显得比同龄人更冷静的姐姐，就会把还在发抖的她拉进宽大的被窝里，用带着淡淡冷香的双手，紧紧捂住她的耳朵。

  『拉芙希妮，别怕，我在这里。』

  那时候的保护，是那么有温度，那么真实。那个时候的姐姐，明明是唯一一个会在雷雨天把真实的拥抱分给她的人。

  可是，是什么时候开始变了呢。那些捂住耳朵的手，是什么时候变成了操控日程的丝线。那个替她挡住雷声的拥抱，又是怎么变成现在隔着半个地球、用最优雅的语气逼迫她无路可退的牢笼。

  手背上的那几点红痕还在隐隐发痛。拉芙希妮垂下视线，看着料理台台面上那几点溅落的咖啡渍。恐惧还在，但它在雷声的回音里变了质——酸涩的困惑从底下浮了上来。

  平冢静的脚步声在身后响起。纸巾被递到了她的视野边缘。大人没有出声打断。

  拉芙希妮没有接那张纸巾。她重新握紧了手机，听着对面刻意留白的、等待着她崩溃的安静。

  "我没有觉得这样就算逃掉。"拉芙希妮的声音很轻，甚至还能听出明显的颤抖，但吐字却很清晰，"我会准时赴约的。这是你定下的行程，我不会躲。"

  她停顿了半秒，目光落在自己那只系着红绸带的左手腕上——那是爱布拉娜的旧物，十四岁之前亲手系上去的。然后，又移向右腕上那截烧焦的旧丝带——那是还火那晚之后，她再也没换过的。

  左腕是姐姐给的。右腕是为了逃离姐姐而烧的。

  两根丝带同时硌在她的皮肤上。她终于将那个藏在雷声后面的问题问出了口。

  "但是……姐姐。"她的呼吸微不可察地乱了一下，"你以前，明明是会在雷雨天保护我的。究竟是因为什么……让你觉得，我现在连停下来喘口气的资格都不配拥有呢？"

  "……喘口气？"

  当爱布拉娜的声音再次顺着电波传来时，之前那种令人战栗的短暂静默已经被彻底抹平。甚至连语调都比刚才更加平缓、轻柔，像是在向一个不懂事的孩子解释最基本的常识。

  可那轻柔里，已经没有了任何温度。

  "亲爱的拉芙希妮，如果你把你在这里学会的这种软弱可欺、这种试图躲在别人羽翼下寻求可怜的庇护的行为，称之为'喘口气'的话——那你确实已经忘记了 Eblana 这个名字到底意味着什么。"

  电话那头的声音没有提高音量，却一字一字硌在拉芙希妮的耳膜上。她没有用"都柏林"这个姓氏，她用"Eblana"。

  "雷雨天捂住耳朵，就能让雷声消失吗？你以为躲在那间不属于你的公寓里，或者指望那个收留你的老师替你挡住门……你就能永远不用面对现实了？"

  拉芙希妮的呼吸停了半拍。

  平冢静的手还停在半空中。拉芙希妮依然没有去接那张纸巾。她只是沉默地听着那套完美无缺的、关于"锻造"和"责任"的逻辑，把她刚才鼓起所有勇气问出的那句"为什么"，一点点碾得粉碎。

  "我曾经教过你，恐惧是可以被利用的东西。但你把恐惧变成了逃避的借口。"爱布拉娜在电话那头轻轻叹了一口气，这种叹息比直接的呵斥更让人绝望，"看来我确实有些太宽容了。让你误以为，只要躲得够远，只要学会了怎么用那套虚弱的借口来骗自己，就可以否定我教给你的一切。"

  拉芙希妮依然保持着将手机紧贴耳侧的姿势。但她的视线已经从台面上的咖啡渍，慢慢移向了灰蒙蒙的窗外。那丝在雷声中好不容易冒出来的、对旧日温情的探究，已经问不出口了。

  左腕的红绸带，右腕的焦黑丝带。同一个姐姐的两种温度，隔着同一场雷声同时抵达她的皮肤——然后同时被否定了。

  "过几天，我会到千叶。有些事，很有必要当面谈。"

  爱布拉娜没有给她任何反驳的机会，用一句不容置疑的陈述句结束了这场短暂的交锋。

  "如果你觉得现在的你可以承受所谓的'停下来'——那就带着你在这里学会的全部，当面让我看看吧。"

  通话切断。

  那个 E 从屏幕上消失了。家族专机的屏幕暗了下去，重新变成一块冰冷的、背面带暗纹的银色金属。

  拉芙希妮慢慢地把手机放在料理台上。她的右手手背上，那几点烫伤的痕迹正在从红转暗。窗外，第二声闷雷在更远的地方滚过，玻璃窗发出轻微的嗡鸣，但比刚才那声轻了很多。

  平冢静把那张纸巾放在料理台边缘。她没有开口，只是拿起拉芙希妮泡好的那杯咖啡，靠在流理台旁边，安静地喝了一口。

  "……没放糖。"平冢静说。

  拉芙希妮低下头，把右手伸到水龙头下，拧开冷水。凉意覆盖了手背上的灼痛。

  窗外，雨终于落下来了。
