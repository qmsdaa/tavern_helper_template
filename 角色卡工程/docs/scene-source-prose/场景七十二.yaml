场景: 72
幕: "第四幕·冬假→三学期"
时间: "2014年1月10日 · 周五 · 早晨 · 三学期第一周"
地点: "总武高中 · 教室"
人物: "拉芙希妮·都柏林、雪之下雪乃"
正文: |
  走廊里急促的脚步声逐渐平息，教室内翻动书页的声音变得清晰起来。雪乃握着笔的手悬在半空，笔尖悬在纸面上方。她眼底那层淡淡的青色，在清晨略显刺眼的阳光下更明显了一些。

  因为假期的连续失眠，再加上今早为了维持"部长威严"而消耗的精力，她的大脑在这一刻出现了微小的、却关键的运转延迟。

  她原本打算在那本新开的学业笔记本上，列出一份精确到半小时的作息表。但当她的视线真正聚焦在纸面上时，那上面并没有什么空白的横线，而是写满了密密麻麻、字迹娟秀却带着隐秘克制感的文字。

  那是她在平安夜的公寓里，抱着潘先生玩偶写下的、专门用来记录转校生逾矩行为的"罪证"归档。

  距离太近了。

  拉芙希妮就坐在左手边不到半米的地方。当雪乃的笔尖因为错愕而悬停时，拉芙希妮的视线自然地越过了两人之间的那点空隙，落在了那本翻开的笔记本上。只用了一秒钟，她就看清了那几行字：
  "……毫无社交常识的盲道回踢……在餐厅桌下按手的恶劣行径……这种不讲道理的越界，必须被记录……"

  而在那些严厉的措辞旁边，甚至还有几处因为下笔太重而微微凹陷的纸痕，以及一行日期旁被用力划掉的、疑似"明天见"的字样。

  拉芙希妮那双原本平静的翡翠色眼瞳里，倏地闪过错愕，随后被带着温度的、干燥的笑意所取代。她没有移开视线，而是稍微侧了侧头，身体的重心向雪乃那边倾斜了半寸。

  "啪"的一声轻响。

  雪乃在拉芙希妮身体倾斜的瞬间，猛地合上了笔记本。她的动作比平时快了至少一倍，甚至带起了一阵微弱的气流，拂动了拉芙希妮垂在肩侧的金发。

  雪乃的后背瞬间挺得笔直。她将双手交叠在合拢的笔记本封面上，用力压平了其实根本不存在的褶皱。指关节因为用力而微微泛白。

  "……都柏林同学。"雪乃的声音听起来像是被砂纸打磨过，带着明显的紧绷感，"在未经允许的情况下，窥探他人的私人物品，这不符合一个在英国接受过精英教育的留学生应有的礼仪。"

  拉芙希妮并没有被这句冷硬的指责逼退。她收回了倾斜的重心，右手无意识地摩挲了一下左腕上那根红绸带。

  "非常抱歉，雪乃同学。"拉芙希妮的声音很轻，语气里带着那种不紧不慢的温和，"我只是以为，那是您为我准备的'复习计划'。毕竟，您刚才确实提到了要为我制定精确的作息表。"

  她停顿了半秒，目光从那本紧紧合拢的笔记本移到了雪乃泛红的耳尖上。

  "不过，我没想到，部长大人的'监督'工作，已经细致到了需要记录我……在盲道上走路的步态，以及在餐厅桌下的手部动作。看来，我的确是个需要被全方位'修正'的麻烦部员呢。"

  雪乃交叠在笔记本上的手指猛地一僵。

  她迅速移开视线，看向黑板右下角的值日生名单，左手抬起来，刻意地将鬓角的一缕头发别到耳后。

  "请不要误会。"雪乃深吸了一口气，试图让自己的声音听起来充满逻辑和公事公办的冷漠，"作为奉仕部的部长，我需要对每一个可能影响社团声誉的异常行为进行风险评估和归档。这是为了确保……确保在必要时，能够有据可查地向平冢老师提交你的行为矫正报告。"

  "原来如此。"拉芙希妮轻声应道。她没有回答，只是拿起笔，在自己的课本上轻轻划了一道。笔尖划过纸面的声音比平时长了一点。

  "那么，那份作为'罪证'的报告……"拉芙希妮没有转头，只是用那种只有她们两个人能听见的气声说道，"下次如果需要补充素材的话，随时可以叫我。"
