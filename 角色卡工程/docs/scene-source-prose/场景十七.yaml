场景: 17
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月下旬 · 林间学校出发日清晨"
地点: "千叶站 → 千叶村方向的电车"
人物: "比企谷八幡（POV）、雪之下雪乃、拉芙希妮·都柏林、由比滨结衣"
POV: "八幡"
正文: |
  清晨七点的千叶站，空气里还残留着未散尽的夜间潮气。比企谷八幡打了个漫长的哈欠，揉了揉依然处于半待机状态的眼皮，试图把自己的存在感缩减到最低。

  但这种企图很快宣告破产。由比滨结衣元气满满的声音几乎穿透了清晨的低气压。她穿着一件款式轻快的夏季私服，背着一个体积过于庞大的双肩包，走起路来拉链的金属扣互相碰撞，仿佛把半个便利店的货架都塞了进去。

  站在她旁边的雪之下雪乃则完全是另一个极端。她穿着一件素雅的浅色连衣裙，没有任何多余的装饰。手里拎着一个材质挺括、看起来非常专业的黑色旅行袋，这种打扮不像去参加林间学校，倒像是某个学术研讨会的考察组长。

  而站在更靠后位置的拉芙希妮，让比企谷的视线稍微停留了两秒。

  这还是他第一次看到那个留学生穿校服以外的衣服。一件剪裁合体的浅米色长袖衬衫，领口的扣子严丝合缝地系到了最上面那一颗，下身是一条深色长裙。即便是在这盛夏的早晨，她也将自己包裹得严密而妥帖，没有露出一寸不必要的皮肤。那截烧焦的旧丝带依然系在右手腕上，被稍长的袖口遮挡了大半。

  这身衣服很符合她那套精确计算过的社交距离——得体，且拒绝靠近。

  四人按照车票上的座位号，登上了通往千叶村的电车。比企谷和由比滨坐在过道的一侧，雪之下和拉芙希妮坐在另一侧。

  随着电车的行进，窗外的景色开始发生质变。混凝土建筑和纵横交错的高架线逐渐被大片深绿色的树林取代。阳光穿透枝叶的缝隙，在车厢地板上切出快速闪过的光斑。

  比企谷百无聊赖地看着窗外，耳朵里突然传来由比滨的一声轻呼。

  "诶？怎么回事……"由比滨举着手机，在半空中晃了晃，"刚才还是满格的4G，现在怎么变成3G了？我还想查一下待会到了那边的天气预报呢。"

  "很正常。"过道对面的雪之下没有从手里的文库本上抬起头，只是翻过了一页，"随着海拔升高和远离基站，山区往往存在大面积的信号盲区。出发前的项目确认表上，已经特别注明了这一点。"

  她说话间，放在折叠小桌板上的手机屏幕亮了一下，弹出一条"进入信号弱区，部分服务可能受限"的系统提示。雪之下只扫了一眼，就重新将注意力放回了书页上。

  比企谷没有接话。他不打算参与这种关于现代化便利性丧失的探讨。但他的视线在移开时，不可避免地擦过了雪之下旁边的拉芙希妮。

  自从上车后，她就一直维持着那种教科书般端正的坐姿。但在由比滨抱怨网络变差、雪之下的手机弹出提示的那一秒钟——

  比企谷看到，拉芙希妮紧绷的脊背，非常、非常细微地，往下松了半寸。

  那不是疲惫导致的松懈，而更像是某根一直勒在她脖子上的无形丝线，终于因为信号的衰减而失去了张力。她那双一直凝视着膝盖的翡翠色眼睛，甚至微微阖上了一瞬，原本过度端正而略显僵硬的肩膀，也找到了一个更舒适的角度。

  她在躲什么？

  比企谷的死鱼眼眯了一下。这几天在活动室里，她整理桌面的频率高得不正常。现在，面对着连由比滨都会抱怨的断网状态，她却露出了来到总武高后最真实的一次放松。

  简直就像是一个终于摆脱了电子脚镣的囚犯。

  比企谷收回了视线，重新靠在椅背上。他没打算开口去问。关于在这个世界上如何隐蔽地呼吸，他比谁都清楚那份沉默的价值。
