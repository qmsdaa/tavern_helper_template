场景: 33
幕: "第三幕·二学期"
时间: "2013年10月下旬 · 场景三十二的直接延续 · 文化祭开幕当天早晨"
地点: "特别栋二层休息平台 → 主体育馆后台通廊"
人物: "拉芙希妮·都柏林、比企谷八幡、由比滨结衣、相模南、优子、遥"
正文: |
  八幡拖着鞋底蹭过水磨石地面的干瘪声响，顺着特别栋偏僻的侧边楼梯往上晃荡。

  拉芙希妮那家伙的预判其实并不算高明，至少在八幡看来，只要稍稍撕开一点那种名为"现充"的自尊心表皮，下面藏着的逻辑就一目了然。相模南这种人，是绝对不会躲进真正没人能找到的地下室或者狭窄储物间的。她可是执行委员长，她要的不是从此人间蒸发，而是被大家焦急地"需要"和"寻找"。

  在连接着主楼与特别栋、能斜着俯瞰到半个主体育馆通道的二层休息平台上，八幡的脚步停住了。

  角落的阴影里，那抹略带棕色的中长发正靠在生锈的栏杆边。相模南缩在那里，手指用力捏着那几页边缘已经有些发皱的开幕致辞稿，目光正带着掩饰不住的焦虑，频频朝着楼下的方向张望。

  "选在这个位置，是在等着看有没有人为了找你而急得团团转吗？"

  八幡连走近几步的打算都没有，就这么隔着三四米的距离，用一种像在念没营养的说明书一样的干瘪语气开了口。

  相模南的肩膀明显地瑟缩了一下。她猛地回过头，在看清来人是那个平时最不起眼、甚至被她当成阴沉男的比企谷八幡时，原本慌乱的表情瞬间切换成了一种强撑出来的厌恶。

  "比企谷？"她把手里的稿子往身后藏了藏，声音有些发虚，但音量却刻意拔高了，"你来干什么？我……我只是在这里背稿子而已！"

  "啊，是吗。在这里吹着穿堂风背稿子，真是辛苦委员长大人了。"八幡用手抓了抓后脑勺那根翘起的乱发，语气里没有半点相信的意思，"别演了。你那根本不是逃跑，你只是受不了被那些乱七八糟的破事逼着做决定，所以跑到这个既能看到大家因为你而着急、又能随时给自己找台阶回去的地方。"

  他停顿了半秒，接着把最不留情面的结论扔了过去："你只是想确认，如果没有你，这个文化祭是不是转不起来。"

  "你懂什么！你给我闭嘴！"

  相模南的脸色涨得通红，这种被平时最瞧不起的人当面拆穿底裤的感觉，让她的音调直接飙到了破音的边缘。"我有多辛苦、压力有多大，你这种阴沉男懂什么！他们只会把问题丢给我，还有雪之下同学……明明她什么都能处理好，大家根本就不需要我这个委员长！我只是……"

  "你只是在借着雪之下的能干来掩饰你自己的无能，顺便还想骗点同情罢了。"八幡毫不犹豫地打断了她那套毫无逻辑的自我感动。

  他终于往前走了两步，那双死鱼眼就这么直接地盯着相模。

  "不过你也算盘算错了一件事。你以为躲在这里不下去，大家就会觉得'啊，相模同学原来这么重要'？"八幡扯了扯嘴角，扯出一个难看至极的嘲讽弧度，"别做梦了。如果你现在还不出现，雪之下马上就会站上那个主席台顶替你。到那时候，所有人的确会记住你的名字。"

  他看着相模南有些僵住的表情，干脆利落地补上了最后一击。

  "他们会记住，二年F班的那个相模，是个连这点破事都处理不了、只会在紧要关头逃跑的废物。然后顺便感叹一下，比起你这个只能当摆设的小丑，雪之下同学真是太可靠了。"

  八幡的这番话恶毒得没有任何转圜的余地。相模南的嘴唇颤抖着，眼眶里因为极度的委屈和愤怒而迅速积聚起雾气，但那份虚荣心被彻底踩碎的恐惧，却让她连一句完整的话都骂不出来了。

  相模南那僵着骨架的后背，在跨下后台最后一级台阶时彻底垮了下去。

  开幕式会场里那种敷衍的掌声还在通廊外回荡，她却像是失去了所有支撑的骨头，脱力地靠在了堆叠的杂物纸箱旁，眼泪毫无预兆地顺着涨红的脸颊砸了下来。

  "南！你怎么了？"优子和遥这两名常跟在她身后的女生立刻围了上去，声音里满是紧张。

  这种关切就像是精准的催化剂。相模南原本压抑在喉咙里的委屈瞬间冲破了界限，她一边抽噎，一边把带着浓重恨意的视线投向了通廊另一侧的阴影里——那里站着双手插兜的比企谷八幡。

  "都是他……"相模南断断续续地哭喊着，试图用最大的音量来洗刷刚才在休息平台上被踩碎虚荣心的恐惧，"比企谷……他刚才说我是个废物、是个只能当摆设的小丑……他还说如果不回来，就会让我变成全校的笑话……"

  "比企谷？"优子的脸色立刻变了，她猛地转过头，连带着旁边几个正好在后台帮忙的现充组男生也一并看了过去，"你这家伙有病吧？南为了委员长的工作已经够辛苦了，你凭什么把话说的那么难听？"

  "就是啊！你算什么东西，凭什么来骂南？"遥也跟着提高了音量，几个人隐隐形成了一堵包围的人墙，大有要替相模讨个说法的架势。

  面对这种阵仗，八幡连站姿都没换一下。

  他那双死鱼眼扫过相模那张挂满泪水的脸，又看了看这群义愤填膺的"同学"。干瘪的叹息声还没从喉咙里滚出来，他就已经做好了决定。解释根本没用，既然相模需要一个借口来发泄下台后的崩溃，那自己顺水推舟把这个"烂人"的角色坐实，也就是一两句恶心话的事。

  他张了张嘴，那句"对啊，那种废物不骂怎么走得动路"已经滑到了舌尖。

  一道穿着深蓝色校服裙的单薄身影，毫无征兆地从侧门的立柱后走了出来，不偏不倚地截断了八幡即将出口的话，也正好挡在了他和那群气势汹汹的跟班之间。

  拉芙希妮·都柏林。

  她没有提高音量，也没有表现出任何激烈的保护姿态。她只是安静地站在那里，翡翠色的眼睛越过优子和遥，直直地落在了还在抽泣的相模南身上。

  "他确实用了很难听的词。"拉芙希妮的声音里甚至没有任何波澜，像是在念一份早就处理好的文书报告，"但如果不是他用那些词把你逼回了台上，相模同学，你现在早就成了你口中那个'连致辞都会尿遁'的笑话了。"

  通廊里的吵闹声因为这句话出现了片刻的卡壳。

  相模南的哭声猛地顿住，像是被一只无形的手扼住了喉管。

  "你胡说什么……"优子最先反应过来，试图重新找回气势，"你个转学生懂什么！她……"

  "别说了。"

  另一个略带颤音、却异常清晰的声音在人群外侧响起。由比滨结衣拨开了一个路过男生的肩膀，她的手指捏着校服裙子边缘，平日里总是带着那种为了迎合气氛而硬挤出来的讨好笑容，此时已经完全不见了。

  她看了一眼瘫坐在那里的相模，然后快步走到了拉芙希妮的斜侧方，站定了位置。

  "结衣？"遥愣了一下，显然没料到同为现充圈一员的由比滨会在这种时候站到那个阴沉男那一边。

  "小企他……确实说话总是很过分。"结衣的视线在对上相模时闪躲了半秒，但很快又重新抬了起来，"可是，相模同学，大家都知道那份致辞稿在你手里。如果是小企没去休息平台找你，你……你真的会按时站在那个麦克风前面吗？"

  这句话就像是一根细细的针，不仅戳破了相模南仅剩的伪装，也让刚才还在叫嚣的优子和遥陷入了迟疑。

  相模南呆呆地看着结衣，又看看挡在八幡身前的拉芙希妮。那种被全方位看穿、连找个替罪羊发泄情绪都被堵死的绝望感，让她连继续大声哭号的力气都失去了，只能捂着脸，任由细碎的呜咽声在后台的死角里难看地回荡着。
