场景: 23
幕: "第二幕·暑夏·林间学校"
时间: "2013年8月上旬 · 暑假第二周"
地点: "千叶市某商务酒店 · 行政酒廊"
人物: "拉芙希妮·都柏林、温斯顿先生"
POV: "拉芙（主线）"
POV替代: |
    八幡: |
      某天下午，拉芙发来短信："今天有事，不能见面。"
      八幡没有多问。他回了一个"嗯"。
      然后他去便利店买了一罐 MAX 咖啡，在公园坐了一会儿。
      拉芙那天做了什么，他不知道。
    雪乃: |
      雪乃收到拉芙的短信："今天有点事，暑期作业明天再讨论可以吗？"
      雪乃回了一个"可以"。
      她没有追问。但她注意到，拉芙最近的"有事"似乎比以前多了。
    结衣: |
      结衣提议大家去海边，拉芙说"今天不行，下次吧"。
      结衣有点失望，但她说"那下次一定哦！"
      拉芙回了一个"嗯"。
正文: |
  暑假第二周。拉芙收到温斯顿先生的邮件——例行的"暑期状态评估"。她需要去温斯顿在千叶的一所商务酒店面谈。

  厚重的地毯吸收了所有脚步声。千叶市这间商务酒店的行政酒廊里，冷气维持在恒定的二十三度。

  坐在对面的温斯顿先生穿着体面却毫不张扬的深灰色西装，是一个四十多岁的英国男人。他没有拿出任何纸质表格，也没有打开录音笔，只是双手交叉放在膝盖上，用一种公事公办的温和语调，按照伦敦那边定下的标准流程逐一抛出问题。

  拉芙希妮·都柏林坐在他正前方的单人沙发上。她没有靠向椅背，腰部保持着一种训练有素的挺直弧度。

  面对关于学业进展的询问，她用没有起伏的匀速语调给出了准备好的数据：
  "上学期的期末测验结果已经出炉。除了现代文这一科外，其余科目均维持在年级前列。现代文部分的失分主要集中在对特定文化背景的阅读理解上。我已经根据错题整理了专项复习清单，目前进度未落后于原定计划。"

  稍微停顿了一拍后，她顺着日语水平的评估继续往下说道：
  "日常交流的词汇量和语法结构已经可以应对绝大多数生活情景。在敬语的使用和一些带有隐喻色彩的俚语理解上，目前也正在通过阅读额外的文学作品进行补充。"

  接下来是关于健康状况和近期去向的复查。拉芙希妮的目光平视着前方，落在温斯顿外套第一颗纽扣的稍微偏下位置：
  "除梅雨季节偶尔出现的轻微低热外，身体没有大碍。睡眠质量还可以。前些天，为了完成总武高方面的强制性要求，我参与了千叶村林间学校的辅助指导工作。目前该任务已经结束，后续的暑假时间将优先分配给课业复习。"

  问题推进到了社交圈这一环。

  "你有交到朋友吗？"

  当这句被包装在温和语气下的致命询问落过来时，拉芙希妮放在裙摆上的左手手指微小地向内侧屈伸了半寸，但她立刻克制住了去触碰右手腕那截烧焦丝带的冲动。

  她深知，这个问题过窄代表孤僻不合群，过宽则意味着她在这张网外产生了自己不该有的连结。那杯因为笨拙而过甜的红茶、那个藏在皮包夹层里的私人号码、那场只下了不到十分钟的雷雨，这些东西绝不能在此时被翻阅。

  "我在这里确实认识了几位同龄人。"拉芙希妮的声音听起来干燥、冷静，甚至带上了一点评估者才会有的客观距离感，"在执行那些校方安排的辅助任务时，需要进行一定程度的协作。"

  她停下了话音，把脊背挺得更直了一些，将最后那句足以让过去的五天彻底变成虚无的话说了出来：
  "目前为止，并没有产生任何需要被特别报备的、超出'必须接触'范畴的社会关系。"

  他没有任何多余的动作，也没有在神情中表现出任何质疑或是不满。他只是在笔记本上，将那几个在评估中被提及的名词——"奉仕部"——用端正的英文拼写记录了下来。

  他没有追问这几个字的具体运作机制，也没有要求拉芙希妮提供关于这些样本的详细背景信息。这种在关键节点上刻意保持的"不过问"，反而比步步紧逼更让人感受到那张严密监控网的存在感。

  温斯顿将钢笔重新别回西装内侧的口袋，然后双手交叉在桌面上，深灰色的眼眸重新看向坐在对面的拉芙希妮。

  那股属于伦敦办公室的公事公办的压迫感在此刻稍微淡去了一些，他的目光中甚至渗出了一丝属于长辈的平缓温度。

  "这是最后一个问题，只作为一项额外的参考。"温斯顿看着她，语气和缓地抛出了那个问题，"那些所谓的'奉仕部'……她们对你好吗？"

  这是一个极为不规范的、带有情感色彩的提问。

  拉芙希妮仍然维持着那种训练有素的端正坐姿。在家族数十年如一日的教导下，对于这种涉及到外界接触的宽泛问题，标准答案早就已经刻在了她的肌肉记忆里——"他们都很好，一切都在合理的预期之内，无需挂念。"这是最能终结对话、也能彻底封闭情感连结的完美说辞。

  但是，那个放在皮包夹层里写着私人号码的表格，那杯在雷雨过后冒着热气的、甜得让人无奈的红茶，以及那个站在天桥下用冷淡的语气批评她淋雨的背影，在这一瞬间不受控制地撞向了那个冰冷的标准答案。

  拉芙希妮放在裙摆上的左手手指，微小地向掌心收拢了半寸。

  她看着温斯顿外套上那颗深色的纽扣。

  "……是的。"

  拉芙希妮轻声回答了这两个字。她的语调依然平稳，没有任何颤音，但如果仔细观察，就会发现那双平时总是像湖水一样平静的翡翠色眼眸中，因为这种极端的、将真实情绪硬生生压抑在冰冷外壳下的克制，而多出了一份沉甸甸的重量。

  温斯顿注视着她因为挺直背脊而显得有些单薄的肩膀，又看了看她那双看似毫无波澜的眼睛。那双深灰色的眼睛里没有流露出任何评判的意味。

  他没有再说什么，只是平静地合上了面前的笔记本。

  笔记本发出轻微的闭合声，这场长达半小时的例行评估在明面上宣告结束。

  两人一前一后走向行政酒廊那扇厚重的深色木门。踩在柔软的地毯上，脚步声被完全吸纳。就在拉芙希妮准备按照家族礼仪欠身道别时，温斯顿停下了脚步。

  他没有拿出那款刻着都柏林家族徽章的烫金名片，而是从西装内侧的另一个口袋里，抽出了一张质地相对朴素的硬纸卡片。

  他将卡片递到了拉芙希妮面前。

  "都柏林小姐，如果有什么需要……"温斯顿的声音突然压得比刚才稍微低了一点，这是一种绝对不属于评估流程官方话术的音量，"我的私人邮箱在这个卡片背面。"

  拉芙希妮的视线落在那张白色的卡片上。

  她没有立刻伸手。在那看似微不足道的半拍停顿里，这十几年在主家学到的嗅觉已经替她完成了初步的风险拆解。"私人邮箱"——这个词在爱布拉娜构建的那个密不透风的监控体系里，本身就是一种足以被判定为越界的禁忌。

  温斯顿作为姐姐极为信任的长期雇员和执行者，他此时的举动，等于是在那张无形的网里，主动向她递过来一把微小的、未经授权的手术刀。

  见她没有立刻伸手，温斯顿顿了一下。

  那双深灰色的眼睛看着她，补上了一句更加直白的话：

  "不是所有的事情都需要走正式流程。"

  这句话里的重量，比刚才所有对学业进展和日语水平的盘问都要沉重得多。它撕开了都柏林内部那层表面和谐的幕布，向她展示了长辈派系与姐姐的权力控制之间，那道始终存在的、隐秘的裂缝。

  拉芙希妮维持着那种训练有素的得体表情，她慢慢抬起手，用食指和中指稳稳地夹住了那张卡片的边缘。

  卡片的纸张有些粗糙，背后用钢笔写着一串并不属于家族域名的邮箱地址。

  "好的，温斯顿先生。"

  她的声音依然平稳、干燥，像是在接受一份再普通不过的补充资料。她将卡片收进包的夹层里，让它和那张写有雪乃私人号码的折叠纸片待在了一起。
