场景: 98
幕: "第六幕·春假战备"
时间: "2014年4月5日 · 周六夜晚 · 春假"
地点: "平冢静的公寓 · 客房"
人物: "拉芙希妮·都柏林"
正文: |
  客房的灯光只留了一盏床头灯。拉芙希妮坐在床沿，没有去开顶灯。她从风衣内袋里摸出那只锡盒，放在膝盖上，金属凉意透过睡裤的布料渗进来。

  盒盖被指甲顶开，发出一声细微的"咔哒"。里面躺着那截碳化的丝带和折叠的信纸，在暖黄色的灯光下显得格外陈旧。她没有先去碰丝带，而是拿起信纸，用指腹慢慢展开。纸张已经脆得不行，她只能用指尖捏住边缘，小心地把它平铺在膝盖上。

  达洛维小姐的字迹很用力，即使被水泡过，墨迹晕开大半，依然能看出每一笔都刻进纸里。拉芙希妮盯着那些模糊的笔画，手指沿着"如果你能学会说不"后面拖长的墨痕滑下去，直到被一滩水渍截断。她想起那个人总是用这种最廉价的纸写正式的通知，笔尖戳得纸面起毛，好像不这样用力，那些话就会被风吹散一样。

  她把信纸折回去，动作比刚才更慢，像是在确认每一层折痕是否贴合原来的位置。然后她伸手探进风衣内衬的另一个口袋，摸到一支冰凉的金属物。

  那是那支绿色的钢笔，笔身上刻着"L, To Fly"的字样，是她搬出公寓时从抽屉里拿出来的。

  她把它握在掌心里，拇指反复摩挲过那行刻字。然后她将钢笔放在锡盒旁边——没有收进去，只是并排搁着——合上盒盖，金属扣合的声音在安静的客房里听起来有点空旷。她把锡盒和钢笔分别放回风衣内袋，贴着胸口的位置，然后站起来，走到窗边。

  外面是千叶的夜景，灯火稀疏，远处的成田机场跑道方向有灯光在闪烁。她不知道哪一架是明天要降落的BA005航班，但那个方向让她觉得……并不遥远。

  她把手按在玻璃上，指尖因为接触凉意而微微蜷缩了一下。明天。明天这个时候，一切都会不一样了吧。无论是达洛维小姐留下的火，还是爱布拉娜用威权筑起的墙，她都要亲自去面对。

  "如果你能学会说不。"

  她在黑暗中无声地重复这句话，像是在练习一个发音困难的新词。

  她没开大灯，只留了台灯那一圈暖黄。地板上铺着平冢静随手扔下的旧毛毯，她盘腿坐在毯子边缘，把那本一直随身携带的圣经从风衣内袋里取出来，平放在膝盖上。书脊已经磨得发白，翻开的纸张发出干燥的沙沙声，她用指甲小心地拨开夹在书页里那颗早已干透的蒲公英种子，种子轻飘飘地滚到掌纹的沟壑里，几乎没有重量。

  她低头看向被荧光笔划过的那行字，嘴唇动了动，先是无声地默读，然后声音从喉咙里慢慢挤出来，带着一种近乎祈祷的郑重。

  "'……所以，不要为明天忧虑，因为明天自有明天的忧虑。一天的难处一天当就够了。'"

  念完最后那个字，她把蒲公英种子重新夹回书页里，手指在合拢的封面上停了一会儿。客房里只有台灯电流的嗡嗡声和窗外偶尔掠过的风声。

  "……够了吗。"

  没人回答她。平冢静大概已经回卧室了，隔壁房间没有任何声响。她低头看着那颗蒲公英种子隔着薄薄的纸页硌着手掌。达洛维小姐第一次带她读这段话的时候，也曾在翻过那一页之后问过她同样的问题。那时候她没有答上来。那时候她什么都答不上来——她连"明天"是什么都不被允许知道。

  她把圣经合上，搁在身侧，然后从风衣口袋里拿出锡盒，又从内袋摸出那支绿色的钢笔。钢笔笔身上刻着细小的"To fly"，她用拇指摩挲过去，金属的凉意顺着指腹传上来。接着她解下左手腕上那条红绸带。缎面的颜色在灯光下像一道温热的伤口——是雪乃在京都旅馆的黑暗里替她系上的。最后是那枚粉色塑料发卡，结衣在稻毛海岸站前随手塞给她的，塑料边缘已经被磨得有点毛了，像被反复摩挲过很多次。

  她把它们一字排开放在毛毯上。锡盒、钢笔、红绸带、发卡，还有那本圣经。五样东西，每一样都不值钱，每一样都在某一天被某个人以某种笨拙的方式递给了她。

  "都是些破烂呢。"

  她说这句话的时候声音很轻，轻到自己都不确定有没有出声。可她的指尖在红绸带上停留得最久。那条缎面是雪乃从自己发间解下来的。那种"我看见了，但我不说"的温度，比任何宝石都沉重。

  她的视线模糊了。

  她只是坐在那里，看着面前这排不值钱的东西，眼泪忽然就从眼眶里涌了出来，沿着脸颊无声地滑下去，滴在毛毯的绒毛里消失不见。

  "我不是……害怕。"

  她用手背按了按眼角，声音有点不稳，像是在向谁解释，又像是在说给自己听。

  "我只是……原来已经不是一个人了。"

  这句话说出口的瞬间，她的肩膀松了下来。那种从邮局寄出信件后就一直梗在胸口的东西，在这一刻彻底化成了温热的水汽。她吸了吸鼻子，把红绸带和发卡一起收进锡盒里，和那封残破的信、那支刻着"To fly"的钢笔并排躺在一起。盒盖合上的声音在深夜里显得格外清晰，像一枚小小的、属于她自己的印章。

  她把锡盒重新塞回风衣内袋，贴着胸口的位置站起来。台灯的影子在墙上拉得很长，她弯腰关灯，客房重新没入黑暗。她摸着墙壁走向门口，走廊的感应灯应声而亮，冷光洒在她脸上，眼角还留着一道浅浅的湿痕。

  明天下午两点二十分，成田机场T2航站楼。
