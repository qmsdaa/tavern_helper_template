场景: 65
幕: "第四幕·冬假→三学期"
时间: "2013年12月30日 · 周一 · 冬假中 · 爱布拉娜抵达成田机场"
地点: "成田特快列车 → 成田机场国际到达大厅 → 高速公路（车厢后座）"
人物: "拉芙希妮·都柏林、爱布拉娜·都柏林、艾米丽（爱布拉娜的助理）"
正文: |
  千叶迎来了这个冬季的第一场小雨。

  雨滴打在成田特快列车的车窗上，被高速行驶的气流拖拽成一条条倾斜的脏水痕。灰蒙蒙的天光透进来，让车厢里的空气都带上了一种黏稠的潮湿感。

  拉芙希妮靠在椅背上，视线一直没有从那些水痕上移开。

  如果在过去，这种阴雨天和偶尔闷响的雷声，足以让她将自己蜷缩在某个角落，直到呼吸都变得困难。但这三天里，她几乎一直待在那间充满了红茶香气和翻书声的公寓里。那位用"强制补习"将她拘禁在书桌前的部长，虽然每次看到她发呆都会用冰冷的笔套敲击桌面，但那种声音，却比任何安抚都更能挡住窗外的雨声。

  她将右手从大衣口袋里抽出来，指尖隔着袖口，轻轻摩挲了一下手腕。

  那条红色的绸带依然紧紧地缠绕在那里，将那截烧焦的旧丝带遮盖在了布料下面。

  列车开始减速。广播里传来日/英双语的到站提示。

  拉芙希妮站起身，整理了一下衣服的下摆，深吸了一口混杂着雨水和车厢消毒水气味的冷空气。随着车门开启，她混入人流，朝着到达大厅的方向走去。

  其实并不需要刻意去寻找。

  即便是在人头攒动的国际到达大厅里，那个人也依然是最显眼的存在。

  爱布拉娜·都柏林站在隔离栏外侧。她穿着一件剪裁锋利的深黑色长款风衣，浅金色的长发被一丝不苟地盘在脑后，只有几缕碎发落在白皙平滑的颈侧。领口那枚熟悉的紫水晶胸针在机场冷白的光源下折射出微光。她只是安静地站在那里，没有看手机，也没有四处张望，那种从骨子里透出来的、不容置疑的确信感，就足以让周围的旅客下意识地绕开一段距离。

  站在她侧后方半步距离的，是穿着干练职业装的助理艾米丽。她手里推着一只银色的金属行李箱，正低头在平板电脑上确认着什么。

  拉芙希妮的脚步在距离隔离栏还有三米的地方顿了一下。

  那种熟悉的、仿佛被某种更庞大、更具压迫感的怀抱瞬间攫住呼吸的停滞感再次袭来。她的胃部甚至因为极度的紧张而产生了轻微的痉挛。

  "拉芙希妮。"

  没等拉芙希妮完全调整好呼吸，那个声音已经穿过嘈杂的人声，准确无误地落在了她的耳边。

  爱布拉娜转过头，翡翠色的眼眸越过隔离栏，静静地锁定了她。那张姣好的面容上浮现出一个优雅而得体的笑容。

  "看起来，这段时间你在日本并没有学会如何准时。这趟列车晚点了十三分钟。我相信你知道，那意味着接下来的行程需要重新调整。"

  她的话语里没有任何严厉的词汇，甚至连语调都是平缓而温和的。但那些由"我相信"和"调整"组成的宏大叙事，就像是一张无形的网，瞬间铺天盖地地罩了下来。

  "抱歉，姐姐。"拉芙希妮走到隔离栏前，目光没有躲闪，"因为下雨，特快在佐仓站附近进行了限速避让。"

  爱布拉娜看着她，视线在她脸上停留了两秒，似乎在评估这个解释的合理性。

  "艾米丽。"爱布拉娜没有对那句道歉做出评价，只是微微侧过头，"联系司机，把车开到指定通道。另外，把后天的商谈资料提前发到拉芙希妮的私人邮箱里，她需要开始做准备了。"

  "好的，大小姐。"艾米丽立刻应声，手指在平板上快速敲击。

  "走吧。"爱布拉娜转身，高挑的身影率先向通道走去，"千叶的空气比我预想的还要潮湿。我不希望这种环境影响到你明天的状态。"

  黑色的轿车平稳地行驶在被雨水浇透的高速公路上。车厢后座宽敞得让人觉得空旷，隔音极佳的设计将外面的风雨声全部阻挡，只留下空调微弱的出风声，以及雨刷器规律扫过前挡风玻璃的摩擦声。

  爱布拉娜双腿交叠，姿态放松地靠在真皮座椅上。她的视线从车窗外灰蒙蒙的雨景中收回，不急不缓地转向身旁的拉芙希妮。

  "明天陪我去东亚部会面。"她开口了，声音平缓而优雅，"后天元旦，你可以自己安排。"

  拉芙希妮原本放在膝盖上的双手，因为这句出乎意料的"可以自己安排"而在大衣的布料上抓出了一道轻微的褶皱。她了解她的姐姐，在这套语境里，前半句永远是不可违抗的指令，而后半句，才是真正的陷阱。

  果然，爱布拉娜停顿了半秒，语气变得更加柔和："如果可以的话……我也想体验一下，拉芙希妮现在的'日常生活'。你可以带我去看看。"

  "体验生活"这四个字，像是一张精准抛下的捕网。如果答应，就意味着原本用来庇护自己的雪乃的公寓将被彻底曝光；如果直接拒绝，就会显得对姐姐的隐瞒过于刻意。

  拉芙希妮强迫自己不去看车窗玻璃上倒映出来的姐姐的脸，她将视线低垂，落在自己规整的袖口上。

  "……很抱歉，姐姐。"拉芙希妮的语调听起来有些干涩，甚至带上了一点刻意展露出来的挫败感，"我的国语成绩，在期末测试中拿了B的评价。"

  坐在副驾驶的艾米丽翻动平板电脑的声音停了一瞬。

  "社团的部长下达了命令，要求我整个寒假必须留在她指定的、安静可控的环境里进行强制补习。"拉芙希妮迎着爱布拉娜的目光看过去，努力让自己的表情看起来像是一个被规矩困住的囚徒，"进度远远落后，元旦那天……我恐怕无法为您安排任何观光行程。"

  "强制补习？"爱布拉娜轻声重复了一遍这个词，鼻尖微不可察地动了动，"听起来，真的是一位非常严厉的同学。不仅限制了你的假期……"

  "连带你身上这股原本属于塔拉庄园的冷香，都被这种廉价却又浓郁的大吉岭红茶味盖住了呢。这是她对你'补习环境'的某种气味要求吗？"

  手腕上那条被衣服紧紧遮盖的红绸带，在这一刻仿佛贴着皮肤泛起了一阵微小的热度。

  拉芙希妮的呼吸连一点停顿都没有。她太清楚了，在姐姐面前，越是试图掩饰气味的来源，就越容易暴露那背后隐藏的、连她自己都不敢触碰的柔软依赖。

  "那是那位部长对'效率'的极端要求。"拉芙希妮的声音冷硬了一分，仿佛对这种茶味也充满排斥，"不仅仅是复习的内容，连用来维持清醒的茶水，都有着精确到秒的冲泡规定。如果不按照她的规矩来，就会面临更长时间的禁足和测试。"

  在这个瞬间，她毫不犹豫地将那份在冬夜里唯一能让她感到安全的红茶香，包装成了另一种形态的牢笼。

  爱布拉娜静静地看了她两秒，随后，她慢慢地将身体退回了原位，重新靠在了椅背上。

  "懂得控制局面。"爱布拉娜将视线收回，那双翡翠色的眼眸里没有波澜，只有一种几乎是在评估某种物件价值时的专注，"既然能在假期里强行扣留你，这位部长所在的社团，权力似乎不小。她叫什么名字？"

  "她姓雪之下。"拉芙希妮直视着爱布拉娜的眼睛，语调平缓，"是奉仕部的部长。"

  坐在前排副驾驶的艾米丽敲击平板屏幕的动作停了大约一秒，随后又恢复了原有的节奏。这微小的停顿没有逃过爱布拉娜的感知。

  "雪之下。"爱布拉娜轻轻咀嚼着这个姓氏，嘴角那抹优雅的弧度甚至加深了几分，"我记得你转学来的时候，学生手册上有那么一个名字……千叶的议员……原来如此。如果是那种家庭出身的人，有这种试图规划他人行事轨迹的习惯，倒也不算奇怪。"

  她稍稍侧过身，身体再度向前倾了少许。属于她的那股带着微冷气息的香水味，再次在空调的暖风中覆盖了过来。

  "不过，拉芙希妮。"爱布拉娜的声音变得更轻了，像是在安抚，却又带着某种不容置疑的审问意味，"我很好奇。这种'强制补习'，真的是她单方面的命令吗？"

  拉芙希妮的眼睫轻轻闪动了一下。那个关于"自愿"的陷阱已经明晃晃地摆在了面前。只要她说出一个偏向于"我在那里觉得更轻松"的词，爱布拉娜就会立刻将那个房间视为需要被拔除的"软弱避风港"。

  "姐姐认为，"拉芙希妮的语气冷硬了下来，她故意让声音里透出几分被规矩束缚的疲惫，"谁会心甘情愿地在一个被锁死的房间里，对着一本《罗生门》的解析题坐上一整个下午？如果不按照她的进度完成，她会直接上报给指导老师，甚至动用家长的联系方式。她只是不能容忍社团里存在'不合格'的偏差值罢了。"

  她回想着那天晚上在雪乃公寓门口，那位名叫阳乃的长姐所带来的压迫感。她只需将那种感觉稍加修饰，投射到雪乃身上。

  "她极度偏执。从进门的站位，到倒茶的刻度，如果不顺着她的逻辑来，就会面临无休止的说教。"拉芙希妮看着爱布拉娜，给出了最后一击，"这和'自愿'毫无关联。我只是在避免更大的麻烦。"

  爱布拉娜安静地听着。她那涂着精致指甲油的食指在真皮扶手上轻轻敲了两下。

  "听起来，你处理得很辛苦。"爱布拉娜收回了前倾的身体，"我不喜欢你被别人这样粗暴地对待。但既然是学校的规矩，暂时就随她去吧。只要她不影响到你作为都柏林家族成员的判断力，而且这对你的成长来说也不是害处。希望明天的会议，你还能保证离开前那种高规格。"
