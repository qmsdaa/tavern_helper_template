场景: 133
幕: "第九幕·以自己的名字委托"
时间: "2015年1月26日 · 周一"
地点: "伦敦·都柏林家族宅邸（拉芙希妮房间 → 爱布拉娜房间 → 庄园烤炉房）"
人物: "拉芙希妮·都柏林、爱布拉娜·都柏林、科尔马克·都柏林（父亲·轻触）、管家（轻触）"
POV: "拉芙希妮"
正文: |
  一月二十六日。伦敦下了一夜雨，早上停了。

  箱子摊在床上，衣服叠了一半。返程机票压在床头柜上，和护照叠在一起。

  九点，管家敲门，递进一只米黄色硬纸信封。

  "律师事务所送来的。交付条件满足了，"他说。

  "谢谢，"她说。

  门合上。信封很厚，封口点着火漆。正面一行黑墨水字：拉芙希妮·都柏林，亲启。是父亲的字。

  她在窗前坐下，拆信刀沿着封口划开。火漆碎在桌布上。她把碎屑一粒一粒捡起来，攥进掌心。

  里面有七页纸，手工缝的线。第一页是一行编号。和保险会社报告上的编号体系一样。底下是视察日前十天的风险升级评估。批复栏写着："行程维持。按原计划执行。"旁边附着《视察警备配置命令》第三条。下面有三个签名。笔迹是同一个人的。

  第二页下端，写着一行字。笔迹和信封上的一样。

  "这份审计，我核对了三遍。每一遍，都希望是我算错。"

  第三页是信托条款。设立时间，受托银行，启动年龄，支付范围。条款下方，有第二行字。

  "这笔钱只有一个用途：把她的人生，从都柏林名下买回来。买主是她自己。"

  最后一页是交付条件。落款日期在爱布拉娜被指定为继承人前一年。旁边的附注写着：若她问起，即刻交付。若未问起，待她不再需要向任何人索要答案时交付。

  最后是一句短句。

  "她也是我的女儿。"

  她看着这行字。窗外云层缓慢移动。她把纸按顺序理齐，收进那只贴着"受益人本人·支付记录"标签的文件夹，连同退出协议副本一起，塞进随身包的内袋。

  她蹲下去压行李箱盖。手掌按过箱子内侧的夹层，里面有个硬块硌在手心。

  她拉开那条拉链。

  一块怀表躺在夹层底部。表盖上镶着橄榄绿宝石，绿得发暗。她掀开表盖，指针停在原处。她把怀表托在掌心，金属逐渐沾上体温。

  她把右手腕的袖口向上推，指腹按住那条焦黑丝带的结扣。过了一会儿，她站起身，走出房间。

  三楼走廊很长，两旁的门关着。她走到最里间，敲门。

  "进来。"

  爱布拉娜坐在写字台前。桌面上摊着写给长老会的材料，右上角印着：执行层权限检讨。墙边的玻璃柜里，旧物垫着棉纸。拉芙希妮走过去，看着桌面。

  "明天走？"爱布拉娜问。

  "明天上午，"她说。

  拉芙希妮走到写字台前。她摊开手掌，把怀表放在桌面正中。

  爱布拉娜看着表。她的手指抬起来，碰到领口的紫水晶胸针，摩挲了一下，放回桌上。

  拉芙希妮从文件夹里抽出那七页纸，放在怀表旁边。

  "一起读吧，"她说。

  她把对面的椅子拉过来，坐下。

  第一页翻过去。两人的手在纸角碰了一下，各自收回。第二页，爱布拉娜读得很慢。读到"每一遍，都希望是我算错"时，她的肩膀僵直了。

  最后一页。"她也是我的女儿。"爱布拉娜的嘴唇动了动。

  窗外的雨又下起来，雨声很轻。

  "他把这种东西封了这么多年，"爱布拉娜说。

  "嗯。"

  "小时候他总坐在书房里，背对着门，"爱布拉娜说，"我以为他不看我们。"

  "他在看，"拉芙希妮说。

  爱布拉娜看着纸面。

  "你去千叶那天，"她说，"我在心里给你立过一个罪名。忘恩，背离，被外人收走。立了快两年。"

  "现在撤销。"

  "达洛维小姐只是完成了我没有完成的事。"

  拉芙希妮看着桌上的怀表。表针停着。

  "火的事。那十一分钟，我已经不去想了，"拉芙希妮说。"其余的，我还在想。"

  "嗯，"爱布拉娜说，"想多久都可以。"

  七页纸理齐，推回拉芙希妮手边。她把纸收好，拿起怀表。她走到门口，转过头。爱布拉娜坐在原处看着她。

  "路上小心。"

  "嗯。姐姐也保重。"

  她拉开门，走出去。

  ——

  回到房间，她把怀表放进贴身内袋。表没有上弦。

  她合拢行李箱，拉好拉链，把箱子推到门边。

  手机放在桌上。屏幕亮着，结衣昨晚发来千叶的街景，地上有残雪。她点开输入框，打了字，按退格键删掉。重新打字。

  "明天见。"

  按下发送。

  ——

  傍晚时分，雨停了。西边的云裂开一道口子，光透进来。

  她下楼去厨房。走廊里飘着木柴燃烧的气味。

  宅子后方的旧烤炉房开着门。那是十七世纪的老砖壁炉。她握住黄铜门把手，推开门。

  父亲坐在炉边的椅子上，穿着旧开衫毛衣，手边的矮桌上搁着茶杯。炉膛里的火烧了一半。

  她走进去，在另一把椅子上坐下。两张椅子隔着一臂宽。

  "信收到了，"她说。

  "嗯，"他说。

  "那份审计——"

  "三遍，"他说，"每一遍，都希望是自己算错。"

  她看着炉火。老砖被火气熏得发暗。

  "怀表找到了，在行李箱夹层里。"

  "那是你第一次去千叶之前放的，"他说，"那时候我以为，给你一把钥匙就够了。"

  炉火烧得很安静。

  "给爱布拉娜的是权力。给我的是一把钥匙，"她说，"不公平。"

  "不是，"她说，"我只是说，您给我的是钥匙。"

  他转过头看她。他的膝盖上盖着一条旧毛毯，毛毯的一角拖在地上。

  "信托里的钱够你读完大学。"

  "我知道。"

  "不够一辈子让你保持现在的.......奢侈生活。"

  "嗯。"

  他点了点头。

  "明天上午的飞机？"

  "十点。"

  "千叶那边——"

  "公寓续租了。温斯顿先生代办的。"

  "好。"

  炉膛里塌下一根焦木。他端起茶杯，喝了一口，又放下。

  "拉芙希妮。"

  "嗯。"

  "你在写东西。"

  "您怎么知道。"

  "玛格丽特姑婆说的，"他说，"她说你要做作家。"

  拉芙希妮看着炉火。

  "早稻田，文学部。如果考上的话。"

  炉火的光照在他的脸上。

  "你小时候坐在那扇窗下面看书，"他用下巴指了指客厅的方向，"一坐一个下午。爱布拉娜喊你，你也不动。"

  "嗯，记得。"

  "那时候我就想，"他说，"这孩子以后要写东西，我无论如何都要支持。"

  他盯着炉火。

  "父亲，"她说。

  "嗯。"

  "您说的那把钥匙，我拿到了。以后的路，我自己走。"

  他的手指摸着茶杯边缘。

  "嗯，"他说。

  她站起来，往外走。

  "拉芙希妮。"

  她停在门边。

  "路上小心。"他说。

  "嗯。"

  她走出烤炉房。走廊里很暗。门缝漏出一线火光，照在地上。

  明天这个时候，她在天上。

