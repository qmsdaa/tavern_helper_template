场景: 118
幕: "第七幕·重新为奉仕部命名"
时间: "2014年7月11日 · 周五放学后"
地点: "总武高特别栋奉仕部活动室"
人物: "比企谷八幡、雪之下雪乃"
POV: "共享场景／零POV"
正文: |
  考试周结束的第二天，蝉鸣忽然就有了真正的暑意。

  特别栋的走廊被晒得发白，活动室里闷了一天的热气从敞开的窗户里慢慢散出去。值日表左下角那处脱胶的地方，胶带又翘了起来，被夕照晒得发亮。

  今天的活动室，只剩下两个人。

  结衣被三浦叫去了车站前的商场，小町和大志有一年级的学期末面谈，拉芙希妮抱着一叠稿纸去了游戏部——她说，答应了材木座同学，要把改写稿的说明讲清楚。

  八幡站在黑板前，手里拿着湿抹布。

  周五。值日表上属于他的那一格，写着"扫除"两个字。那两个字是他自己写上去的。当时他写完了，还特地声明了一句——这不是任务认领，只是先把格子占住。但今天他擦完了黑板，又开始擦窗台，动作不快，却一处都没有跳过。

  "你生病了吗。"

  雪乃坐在长桌尽头，面前摊着一叠顾问要的学期活动报告。她的水笔停在半空，视线从纸面上抬起来，落在他手里的抹布上。

  "只是突然想到，要是连打扫的人都在敷衍，那这张值日表贴在门上就太难看了。"八幡把抹布拧干，"再说了，写报告的人都没喊累，我有什么资格喊热。"

  雪乃没有接话，重新低下头去。

  报告写到"活动实绩"那一栏的时候，她的笔停了一次。然后，在"体育祭·场地协调"后面，一笔一划地添了一行小字。

  八幡正好拎着水桶从她身后经过，视线在那行字上扫了一下——"器材管理：比企谷"——脚步没有停，继续往走廊尽头的水房去了。

  两个人谁都没有提这件事。

  窗台角落那盆去年文化祭留下来的干裂植物，土面今天有些深色。八幡擦窗台的时候多看了一眼，什么也没说。雪乃翻报告的手也没有停。

  "这学期结束，这本记录簿上的委托就满一册了。"雪乃把委托记录簿合上，指尖按在封面上，"明年，要用第二册。"

  "第二册吗。"八幡把椅子倒扣上桌面，准备拖地，"写的人就不是你了。"

  "嗯。"雪乃看着那本记录簿，"小町同学的字，比某个人工整得多。大志同学的流程也记得很牢。"

  "那家伙从小就会记账。"八幡顿了顿，"但是，别把她当成接班人培养。那丫头自己也有想做的事。这个房间对她来说，应该是一个可以来的地方，不是必须接下的东西。"

  "我没有说要交给谁。"雪乃把水笔的笔帽合上，"正式部门的继承，不是找下一个谁。是留下一些不管谁来都能接着用的东西。"

  她的视线扫过茶柜，扫过值日表，最后落在合上的委托记录簿上。

  "记录、流程、还有这间屋子本身。谁来都能用，谁来都不会用错——能留下这些，才算这个部门真的存在过。"

  "真是像你会说的话。"八幡拖着地，声音混在拖把的水声里，"不过，意外地不坏。"

  拖完地，八幡在雪乃斜对面坐下来。窗外的蝉声一阵高过一阵。

  "大学的事，定了吗。"他问。

  "法学。"雪乃的回答没有犹豫，但也没有展开，"具体的地方，还在看。"

  "法学啊。"八幡靠在椅背上，"你自己选的吗。"

  这一次，雪乃没有立刻回答。

  夕阳从西窗进来，把她手边的报告照得发白。她看着那一页纸，过了几秒。

  "至少，"她说，"想让它成为我自己选的。"

  八幡没有追问。

  "你呢。"雪乃忽然反问，"你的志愿栏，打算一直空着吗。"

  "文科。考得上哪里算哪里。"八幡耸了耸肩，"反正没有非做不可的事，也没有非去不可的地方。"

  "没有非去不可的地方，却有一个一直在来的地方。"雪乃看着他，"这比大多数人的志愿都要具体。"

  八幡被这句话堵了一下，别过脸去看窗外。

  "……你今天说话能不能别老是这么一板一眼。"

  "我只是在陈述记录所显示的事实。"

  沉默落下来。蝉声从窗口涌进来，把它填得满满当当。

  过了一会儿，雪乃起身去泡茶。只有两个杯子。她把其中一杯推到八幡面前，自己捧着另一杯，在窗边站着。

  "你那天说的话，"她望着窗外，声音不高，"四月的时候，在这里说的。现在还算数吗。"

  八幡握着茶杯的手停了一下。

  他没有回答"算数"，也没有回答"不算数"。他只是站起来，把喝完的茶杯洗干净，放回茶柜的上层——原来四只旧杯子的位置，把杯柄转向同一个方向，和另外三只对齐。

  "委托又没有期限。"他背对着茶柜说，"慢慢找就是了。"

  雪乃捧着杯子，没有回头。

  "嗯。"

  八幡把"扫除"那一格的抹布晾到窗框上，最后看了一眼活动室，带上了门。

  锁舌落下的声音在空走廊里响了一下。

  教员室门口的钥匙登记表上，今天的归还栏已经写了几行。八幡把钥匙挂回去，在最下面一行签下时间。雪乃站在两步外等他，手里抱着那叠学期报告。

  "大学的事——"八幡忽然开口。

  雪乃停下脚步。

  "……算了。"他挠了挠后脑勺，"等你定下来再说。"

  "嗯。"

  走廊尽头，两个人的影子被夕阳拉得很长，在楼梯口分开，各自走向了相反的方向。

  蝉声还在特别栋的屋顶上，一阵一阵，没有停。
