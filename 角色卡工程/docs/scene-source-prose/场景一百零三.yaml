场景: 103
幕: "第七幕·重新为奉仕部命名"
时间: "2014年4月9日 · 周三 · 新学期开学日"
地点: "总武高正门／鞋柜区 → 后勤处／教员室 → 特别栋奉仕部活动室"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林、高坂理津子、后勤工作人员"
POV: "雪之下雪乃"
正文: |
  “真的有。”

  结衣站在鞋柜区旁的升班名单前，用手指点着三年J班的名单。打印纸刚贴上不久，透明胶带还留着没有压平的边角。

  Loughshinny Dublin。

  拉芙希妮的名字排在名单中间，字母大小和其他人完全相同。旁边没有复学标记，也没有任何需要解释的括号。

  “学校既然已经完成手续，名字当然会出现。”雪乃说。

  “我知道啦。可是昨天还只有一张盖章的纸，今天真的贴出来了嘛。”

  结衣往旁边让开，拉芙希妮站到名单前。她看了一会儿，没有拿手机拍照。

  “拼写是对的。”她说。

  “而且拉芙希妮酱和小雪乃还是J班。”结衣又看向贴在旁边的三年F班名单，“小企和我也还是F班。叶山同学、小优美、姬菜、彩加，还有川崎同学，都在。”

  “居然没有把这么长的名字印错，总武高的行政部门在新学年第一天就创造了奇迹。”八幡把室内鞋从柜子里拿出来，“接下来只要祈祷他们没有把我的名字放进优秀学生名单，学校的信用就还能维持。”

  “那种错误不需要祈祷也不会发生。”

  “新学期第一句就如此可靠，真是令人安心。”

  开学典礼的广播从体育馆方向传来，催促还停在鞋柜区的学生入场。结衣拉着拉芙希妮往前走，八幡跟在后面。雪乃把手放进口袋，黄铜钥匙仍在那里。

  昨晚平冢静把它放回她手中时，钥匙已经被掌心捂热。经过一个夜晚，金属恢复了原来的温度。

  开学典礼结束后，四个人没有各自回到教室。结衣在通往后勤处的连廊口停下来，像昨晚说过的那样等着雪乃。八幡把书包换到另一边，拉芙希妮手里拿着刚领到的新学年材料。

  “你们没有必要一起去。”雪乃说。

  “我只是还没找到教室。”八幡说。

  “你刚才已经把班级安排看过了。”

  “看过和记住是两种互不兼容的学习活动。”

  “小企就是想一起来嘛。”结衣说完，又立刻转向他，“对吧？”

  “请不要擅自给迷路的高中生添加集体主义动机。”

  拉芙希妮把新学年材料夹在手臂下。

  “后勤处在同一个方向。”

  “都柏林同学，你的教室位于另一栋楼。”

  “我没有说是去教室。”

  雪乃没有再让他们回去。

  后勤处的窗口刚刚打开。工作人员正在核对各教室领用的粉笔、板擦和备用钥匙，柜台后方挂着整排贴有标签的钥匙圈。

  雪乃把黄铜钥匙放到托盘里。

  “归还特别栋闲置教室钥匙。”

  工作人员拿起塑料牌，看见已经褪成浅蓝的字。他翻开手边的登记册，又从下层抽出一份旧文件。

  “这是平冢老师保管的特别指导活动用钥匙吧。”

  “是。”

  “她的调职移交里写了活动记录由学生整理，钥匙会另行归还。”工作人员找到对应的空格，把钥匙放在文件上，“社团和活动室的事情现在由高坂老师负责。你们稍等一下。”

  他拿起内线电话。结衣站在窗口旁，抬头看着墙上那排钥匙。奉仕部的黄铜钥匙混进颜色相近的金属里，很快就不再显眼。

  高坂理津子过来时，手里夹着一本黑色文件夹。她穿着深灰色针织外套，胸前的教职员证随着脚步晃了一下。

  “雪之下雪乃同学？”

  “是。”

  “我是高坂理津子，公民科教师。本学年由我负责社团登记和活动室管理。”

  她先向四个人点头，又请工作人员把旧许可和钥匙一起交给她。文件夹打开以后，里面已经放着奉仕部上一年度的活动摘要。

  “平冢老师在调职材料中提到，你们会在新学年申请继续活动。”高坂说，“不过，校内登记里没有奉仕部作为正式社团或同好会的成立文件。”

  “这不可能。”雪乃说，“我们提交过活动记录，也长期使用特别栋的教室。”

  “活动记录在这里。教室许可也在。”

  高坂把旧文件转向他们。标题写着《特别指导活动场所临时使用申请》，责任教师一栏是平冢静。

  “过去的运行方式属于生活指导范围内的特别课后活动。平冢老师承担教师责任，校方因此允许你们使用那间教室。正式社团注册需要独立的成立申请、顾问确认和年度成员名单。这几项没有完成。”

  “也就是说，我们一直是依靠平冢老师的个人信用占用学校资产。”八幡说，“听起来像一群在违章建筑里开咨询公司的未成年人。”

  “校方批准过使用，所以不属于违规占用。”高坂回答，“平冢老师已经调离，旧许可需要在新学年重新确认。这才是目前的问题。”

  八幡收起了后半句歪理。

  结衣靠近柜台。

  “那奉仕部会消失吗？”

  “目前没有人作出这个结论。”

  高坂从文件夹中取出一份表格，放在旧许可旁边。

  “新学年开始后，学校需要重新核对课后活动、责任教师和教室用途。奉仕部没有完成正式注册，原责任教师也已经离任，所以要填写现况确认材料。”

  表格右上角盖着总武高教务处的章。后面还附着一页较薄的复印件，页眉是PTA执行委员会。检查项目列着闲置教室使用、未正式注册的学生组织和课后活动责任人。

  没有奉仕部的名字。

  那种把每一项责任拆开、要求所有空白都由具体姓名填满的写法，雪乃在本邸的文件里见过。

  “这是针对奉仕部的调查吗？”她问。

  “这是年度复核。”高坂说，“PTA向学校提出了校内空间和课后活动责任的检查意见。校方决定统一核对现况。你们同时符合表上的几项条件，所以会被纳入材料。”

  “PTA可以决定一个学生组织是否继续存在吗？”拉芙希妮问。

  “不能。”

  高坂回答得很快。她把PTA复印件放回总武高的现况确认表后面。

  “PTA可以提出意见，也可以要求学校说明经费与安全责任。活动是否成立、教室是否继续分配，由校方根据活动目的、记录、顾问和责任范围判断。”

  “如果判断材料里没有顾问呢？”八幡问。

  “那就如实留空。留空会成为需要解决的问题，但不需要编一个名字填进去。”

  结衣看着那份表。

  “所以，我们今天还能去活动室吗？”

  “可以。现况确认期间，原有物品和活动记录仍需由你们管理。”高坂说。

  她把钥匙领取记录放到现况确认表上。

  “钥匙从今天起存放在教员室，每次领取与归还都要登记。新委托请留下委托人、日期和基本事项。涉及隐私的内容不必写入公开记录。”

  “没有期限吗？”雪乃问。

  “先把事实整理清楚。学校还没有要求你们在某一天以前证明结论。”

  高坂把现况确认表递给雪乃。

  “我只确认学校能否对这项活动负责。你们希望它叫什么、想保留什么，需要由你们自己说明。”

  雪乃接过文件。

  “我会整理上一年度的全部活动记录，并提交新学年的活动目的和责任安排。”

  “先读完再写。”高坂说，“这不是考试，不需要抢在别人之前交卷。”

  她把黄铜钥匙收入后勤处的钥匙袋，在登记册上写下新的保管位置。随后带四个人走到教员室门口，示范如何填写领取记录。

  雪乃在第一行写下自己的姓名。用途一栏，她填了“现况确认与活动记录整理”。

  高坂核对后，把另一把贴着新标签的钥匙交给她。

  “离校前归还。”

  “明白。”

  特别栋的走廊比春假时热闹。低年级学生抱着新课本经过楼梯口，没有人留意四个人为什么一起走向那间闲置教室。

  雪乃打开门。

  长桌、书架和茶具仍在原来的位置。窗台上依然积着一层很薄的灰，八幡搬回隔壁教室的折叠椅也没有留下空位。房间容得下他们四个，和上学期没有区别。

  结衣先去检查电热水壶，拉芙希妮把新学年材料放到自己惯用的位置。八幡在椅子上坐下，拿起高坂交给他们的新委托记录样表。

  “委托人、日期、基本事项。终于从地下咨询公司升级成需要写业务日报的地下咨询公司了。”

  “既然校方已经开始确认，你就没有理由继续把这里称为地下组织。”雪乃把现况确认表摊开，“最多只能说明此前的制度基础不完整。”

  “这种精准区分非法经营与手续瑕疵的能力，确实很适合法学方向。”

  “感谢你终于承认自己的指控缺少依据。”

  结衣把水壶放到底座上。

  “小雪乃，过去的委托记录我也可以整理。哪些是学生会那边来的，我应该还记得。”

  “我可以核对日期和对外文件。”拉芙希妮说。

  八幡晃了晃手里的样表。

  “那么我负责证明这些表格为什么无法拯救任何人。至少专业对口。”

  “现在还不需要分工。”雪乃说，“我先整理初稿，完成以后再给你们确认。”

  水壶开始加热。三个人没有继续争取，活动室里只剩翻动新学年材料的声音。

  雪乃拿起笔。

  活动名称一栏，她写下“奉仕部”。

  当前成员一栏依次填入四个人的姓名。顾问栏空着，她翻到下一项。

  活动目的：帮助校内遇到困难的学生。

  字迹落在横线上，没有超过表格边框。再往下是最后一栏。

  “本活动区别于生活指导室、学生会及其他社团，并应由学校继续设置的理由。”

  电热水壶在桌边响了一声，停止加热。

  “小雪乃，要泡茶吗？”结衣问。

  “嗯。”

  雪乃盖上笔帽，把现况确认表收进深蓝色文件夹。最后一页没有完全压进去，那行问题仍露在外面。

  横线下面什么也没有。
