场景: 13
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月中旬 · 期末考成绩公布日"
地点: "奉仕部活动室"
人物: "雪之下雪乃、拉芙希妮·都柏林、比企谷八幡、由比滨结衣、平冢静"
正文: |
  七月中旬，窗外的蝉鸣在闷热的空气里显得有些疲惫。活动室的长桌旁，几张成绩单以不同的姿态散落着。

  雪之下雪乃将那张印着全班第一的单子叠好，压在手边的文库本下。长桌对面，比企谷八幡正以一种不自然的姿势，试图将一张边角写着个位数的纸片塞进书包的最底层。由比滨结衣靠在椅背上，长长地呼出一口气，像是在庆幸自己刚从某种灾难中幸存。

  拉芙希妮·都柏林的成绩单平铺在桌面上。雪乃的视线扫过，总分依旧在年级前列，只是现代文那一栏的数字比自己低了一截。这是意料之中也是有点意外的事，她学习很认真，还借了许多成绩优秀的人的笔记，这点失误不应该出在她这样高标准的人身上。

  "砰"的一声，活动室的门被推开。平冢静穿着标志性的白大褂走了进来，将几份彩印的册子扔在长桌中央。

  "暑假第二周，"她没有寒暄，直接切入正题，"千叶村青少年中心邀请奉仕部参与林间学校项目。对象是小学高年级，为期五天。作为学生指导员，协助完成集体活动、篝火晚会，以及——"她停顿了一下，目光在四人脸上扫过，"一个'合作与孤立'的教学主题。"

  "诶！要住在山里？"由比滨结衣立刻坐直了身体，声音拔高了几个分贝，"五天？"

  "让我这种社会不适者去带小学生？"比企谷八幡的驼背更严重了，他叹了口气，干瘪地吐出一句，"这是虐待儿童吧。"

  雪之下雪乃没有理会这两种极端的反应。她拿起桌上的册子翻开，目光落在行程表上："作为学生指导员的资格要求是什么？奉仕部是以提供帮助为原则，但这需要建立在能力匹配的基础上。"

  她的余光注意到，坐在身侧的拉芙希妮完全没有出声。

  那双翡翠色的眼睛盯着桌面上的册子，没有任何表示。雪乃注意到，拉芙希妮的右手没有放在桌面上，而是垂在身侧，指尖隔着校服布料，无意识地摩挲着口袋的位置。那里通常放着一部很少拿出来的黑色手机。

  平冢静的视线也落在了拉芙希妮身上。

  "都柏林同学也算在内。"平冢静的声音稍微放轻了一点，"这是奉仕部四人的项目。"

  拉芙希妮抬起头。她的手指依然停留在口袋边缘。

  三秒钟的沉默。在这三秒里，雪乃看着她调整了呼吸的节奏。

  "我需要处理一些事情。"拉芙希妮说，声音很平稳。

  没有答应，也没有拒绝。

  平冢静没有追问，只是点了点头，随后宣布散会。

  比企谷和由比滨最先离开，活动室很快安静下来。雪乃将茶杯收起，转身时，发现拉芙希妮已经走到了门口。

  但她没有立刻走出去。她停在那里，肩膀微微有些僵硬。视线没有看向走廊，而是越过肩膀，落在了长桌上那份林间学校的项目介绍册上。册子的封面上，印着千叶村的标志和一堆正在燃烧的篝火。

  她默默把宣传册收进自己的书包里，嘴角有一丝温柔的弧度。

  虽然不知道自己能不能去。
