场景: 129
幕: "第九幕·以自己的名字委托"
时间: "2014年11月21日 · 周五"
地点: "拉芙希妮公寓→千叶站前邮便局→总武高三年J班→拉芙希妮公寓"
人物: "拉芙希妮·都柏林、温斯顿（邮件）、布丽吉特·都柏林（挂号信）、玛格丽特·都柏林（便签）、外部律师（书面）、家政太太、雪之下雪乃、比企谷八幡、由比滨结衣（群聊）"
POV: "拉芙希妮"
正文: |
  十一月二十一日，公寓的暖气片从上周起开始热。起居室窗外那排银杏每天少一排叶子，今天只剩枝头几片。

  清晨六点过，温斯顿先生的邮件已经到了。

  邮件打印出来三笔回执。第一笔是早稻田大学文学部的报名费；第二笔是共通测试报名费；第三笔是下一年度国民健康保险预付额。受托银行账户当日划付，经办栏只有温斯顿先生的署名——按信托规则，受益人栏不必出现名字；信托本身用的是父亲那一份设立文书，户头归账户管理，与她姓什么都不冲突。

  邮件末尾一行他写着：

  "以上三笔由信托账户划付，回执已寄至您府上，不向都柏林家族抄送副本。"

  拉芙希妮把三笔回执整齐叠好放进文件夹。空白标签抽出一张，她在上面写下"受益人本人·支付记录"，贴到文件夹侧面。这一行字是她第一次写在自己的钱走过的纸张上。

  抽屉合上以前，她把珍藏抽屉拉开了一厘米。绒布袋还在原位，今天没有把它拿出来——让它在那里。

  这是账户启动以来的第一次付款。第一次的本质不是金额——是签字栏没有那边的名字。同一只手，同一种手续，落款不一样了。从前每一笔在外支出都要先回到那边报到，再被批回；现在这一笔走过的纸路上没有那一栏，回执只到她这里。

  上午六点五十，她写完申请书第二版。

  第一版的最后一段里她写过"永久"两个字，划掉，改成"自本协议生效之日起，不附任何条件地放弃"。姐姐曾经把这个字说了一半，断在那里；拉芙希妮不打算再说一次，也不打算把这个词装回别人的嘴里。

  申请书的第一条不是控诉，是程序：申请人本人年满十八岁，日内瓦信托独立存在；本人自愿请求家族全体长老审议其全部归属关系——继承等级、长老候选资格、家族津贴与资本权益的处置；同时请求家族对本人之教育、居住、婚姻、职业的现有一切审查权，自本协议生效日起、不附任何条件地放弃。审议时间安排在本人寒假赴英以前，具体由家族确定。附件：信托独立声明一份。

  瑞士信托独立存在，不作为交换筹码或附带条件——这一条她写在申请书末尾。律师叮嘱过的措辞：自己放弃的东西交给家族重新决定去向；不能让家族把放弃权挂在她的退出条件里。

  她把信装入信封，挂号寄给家族事务所行政组。转交人是中立长老布丽吉特·都柏林。

  布丽吉特姨婆是家族在世长辈中位次靠前的一位，也是长老会议事录里少数从不为任何一方提案背书、只走程序的人。一周前她回了一段话："作为中立长老，我可以接收你的申请、转交程序。不偏不倚，不替你主张。这个分寸你明白。"

  拉芙希妮明白。所以转交这件事她不请玛格丽特姑婆做。玛格丽特姑婆一直偏她，正是这个原因——她不能进程序。

  不过玛格丽特姑婆寄了一张便签，压在布丽吉特回信的信封底端，五厘米见方，没有抬头，没有落款：

  "Grandchild, you have learned to begin."

  英文，老一辈的字迹，墨水颜色比家族公函轻。她没有把便签放进珍藏抽屉，也没撕掉，只折回原位，和布丽吉特的回信一起收进书桌侧屉最里面那一格。

  上午七点四十，她在书桌上摊开第三封信。这一封给一位布丽吉特姨婆介绍的、在东京开个人所的英国律师——内容：本人自我代表出席家族全体审查；额外请一位可旁听的程序顾问，且回信与文件往来只走挂号邮件。

  信很短。她在写到"自我代表"四个字的时候停了不到一拍——不是犹豫，是确认。她在信托上签字整整一个月了，那时她已经选了一个走法：不靠谁替自己主张，也不靠谁再替自己说一次。

  上午八点早饭。家政太太把餐盘端进来时，目光在那张摊开的信纸上停了一下，没问。她端来的是茶碗蒸和味噌汤，菜单上没有爱尔兰炖肉已经一个月了。

  "您出门的时间是早班车吗？"家政太太问。

  "八点四十分。"

  "那我先把玄关收拾好。"

  八点四十分她出门，先到千叶站前邮便局。挂号窗口外面排着两个人——一位寄家庭信，一位寄包裹。轮到她时，她把信和回执副联一起推进窗口，签字，付挂号费。这笔挂号费从她本人钱包出，不走信托。

  "明信片回执寄到这里写的就是这个住所。"窗口人员说。

  "是的。"

  下午J班的朝鲜历史课例行小测她照常考完。题目关于十六世纪陶器工匠行会的分化——考点没有超出她在伦敦家族书房读过的范围。那种熟悉感曾让她在考试的题目里多想，今天没有。

  放学后回到公寓，她把第三封信的挂号封套贴好，等明天早班车投出。

  给三个人的群聊里她只发一句：

  "今天已经挂号申请家族全体审查。内容不发。等回执。"

  雪乃："收到。"

  八幡："……把家族丢给程序。这条路是反的。但能反成这样，我同意。"

  结衣："拉芙希妮酱，明天有没有时间。"

  雪乃之后又跟一句："今天J班小测是不是不算分？"

  "不算分。"

  八幡："所以你考的是给自己看的成绩。明白。"

  结衣没等她答复"明天"那句，又追了一条："明天不挤时间也没关系。我只想知道，你今天一个人做完那件事回家以后，身边有没有谁开口。"

  拉芙希妮看着屏幕，把那句读完。

  没有人开过口——除了那位姓氏只在信托设立文书里出现过的父亲。她已经知道了。

  但今天有人问了。

  她回："明天有空。"

  关了台灯，准备睡。睡前她把今早那三笺回执叠半露的角——交叠的一角——存进手机里一个新建的相册，名叫"beneficiary"，不发给任何人。

  窗外的银杏被一阵较大的风一下吹掉两片。明天枝头大概就空了。

  家政太太明早会知道这一个月里不再做爱尔兰炖肉——之前她已经把菜单调过来，没有再问。今天申请挂号以后，事务所没有发任何向那边的汇报；公寓这边，也没有。

  拉芙希妮合上眼之前，把今天的几样东西——三笺回执、一份挂号回执副联、一张墨水颜色很轻的便签、还有姐姐六十五天后那四个字——一同摆进今天的同一边。

  它们不冲突。它们只是各占一角。
