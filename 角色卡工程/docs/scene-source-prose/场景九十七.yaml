场景: 97
幕: "第六幕·春假战备"
时间: "2014年4月3日 · 周四傍晚 · 春假"
地点: "千叶站西口·家庭餐厅"
人物: "拉芙希妮·都柏林、雪之下雪乃"
正文: |
  那张被反复折过的纸摊开在两人之间，边缘已经起了毛，红笔的线条却清晰得像手术刀划过的痕迹。雪之下雪乃的食指还沾着没擦干净的红墨水，指腹压在草图的左下角，那里画着一个不太圆的方框，旁边标注着"T2"。

  "英国航空BA005。"她说，声音没有起伏，像在念一份课程表，"周日下午两点二十分，落地成田第二航站楼。"

  拉芙希妮·都柏林的手指搭在桌沿，视线从那根沾着红墨水的指尖移到航站楼标记上。家庭餐厅的背景音很吵，隔壁桌有人在争论菜单的定价，但她只听见自己呼吸的声音。草图上的线条画得精确，连到达层的出口编号都标了出来，显然不是随手画的。她认识这种画法——这是雪乃一个人对着电脑反复核对之后才会有的精度。

  "……艾米丽会和她同机。"拉芙希妮开口时声音很轻，像是确认而非提问，"她从不单独出行，助理会负责所有接洽环节。"

  雪乃的目光没有从草图上移开，只是微微点头。"那温斯顿呢？他这边会收到通知吗？"

  这个名字从雪乃嘴里说出来的时候，拉芙希妮的右手腕下意识缩了一下，袖管盖住了那截烧焦的丝带。温斯顿，她在日本的责任联系人，也是教育事务负责人。如果他接到爱布拉娜方面的正式通知，虽然不能替她决定去留，却可以依照现有备案发起会面协调、联系学校，并让一项“家族教育决议”以行政程序的面貌压到她面前。

  “会。”她的声音干了一点，“温斯顿先生和姐姐的通讯渠道一直保持畅通。她不需要亲自联络他，只要让艾米丽发一封正式的会面通知函过去，他就会收到副本。到时候……”她停了一拍，“他可以用责任联系人和教育协调的名义，正式要求我回应会面安排。”

  雪乃终于抬起眼睛看她。那双深蓝色的眼睛在餐厅的背光里显得很暗，里面没有安慰，也没有怜悯，只有一种很冷的专注。

  "所以，问题不只在机场。"雪乃说，手指从T2标记上移开，点在草图的空白区域，"如果她提前通过温斯顿锁定你的时间，接机这件事本身就是她布好的局。"

  拉芙希妮没有立刻回答。她低头看着那张草图，看着那些精确到分钟的时刻表标注，看着雪乃在成田特快的换乘节点上画的小圈。这些她从来没有要求过的东西，就这样被一个人在某个晚上铺开了，然后用沾着红墨水的手指一条一条地核对过。

  "……雪乃同学。"她叫了一声，声音比刚才更轻，"你今天……是从几点开始画这个的？"

  雪乃的手指停住了，然后很自然地移开，拿起旁边的纸杯喝了一口已经凉透的红茶。

  "这和当前的问题无关。"她说，"先把温斯顿的应对方案理清楚。他收到通知之后，最快多长时间可以执行要求你出席会面的行政程序？"

  拉芙希妮看着她不回答的样子，嘴角的弧度很浅，几乎看不出来。她没有追问，只是把手从桌沿收回来，重新搭在自己膝盖上的风衣下摆上。

  "如果走正式渠道，他需要至少一个工作日来确认函件的真实性和法律效力。"她说，"但如果艾米丽直接电话联络他，以都柏林家族的名义……几个小时就够了。"

  雪乃把茶杯放回桌上，指腹在杯沿擦了一下。餐厅的灯光打在她侧脸上，映出一点很淡的疲惫，但她开口的时候语气依然很稳。

  "那么周五之前，至少要让温斯顿愿意给我们留窗口。不用他违抗指令——只要他在走程序的时候不主动加速。"

  拉芙希妮抬起视线看她。这句话精准得像是雪乃已经替温斯顿本人做过一遍利弊分析。不是策反，不是对抗，只是利用体制本身的摩擦力争取时间。这恰好是她和温斯顿在新大谷午餐上感受到的同一件事——温斯顿可以做到。只要他知道拉芙希妮需要的是几个小时，而不是要他叛变。

  "我会把温斯顿的联络方式整理出来，"拉芙希妮说，手指从风衣下摆上挪开，重新搭回桌沿，"到时候……需要你帮我确认哪些措辞是安全的。"

  她说完这句，停了一拍。餐厅的背景噪音很大，隔壁桌在争论套餐的定价，盘子和杯子碰在一起发出闷响。她没有看那张草图，而是看着雪乃放在桌上的那只手——指腹上的红墨水已经干了，变成一层薄薄的暗红色，像是某种被反复按压过的东西留下的痕迹。那张草图边缘有几滴深褐色的茶渍，是刚才雪乃放杯子时溅出来的，和红笔线条在纸面上各自分明。

  "还有，"她说，语气比刚才轻了一点，"你真的想得很周到。"

  雪乃把茶杯放回桌上的时候动作比刚才重了一点，杯底磕在桌面上发出一声脆响，又有几滴凉透的红茶溅到了草图旁边。她没有去看那些茶渍有没有弄花墨迹，只是把手指从草图上收回来，叠在自己的膝盖边。

  "周到？"她重复这个词的时候语调平平的，听起来像是在念一句不相关的课文，"如果你当时能把这份判断力用在选寄信的时间点上，我们今天大概不需要在这里讨论温斯顿的问题。"

  拉芙希妮没有立刻回答。她的视线从雪乃的手移到她侧脸上，那片侧脸在餐厅的灯光下显得有点僵，下颌线收紧了，像是某种被强行压住的东西正在往外挤。

  "邮完信之后，"雪乃继续说，声音里那种平淡的东西裂开了一道口子，透出来的不是愤怒，而是一种更别扭的、几乎是赌气的冷硬，"你甚至没有等我的回复，就直接去联系了比企谷君和由比滨同学。"

  "……嗯。"拉芙希妮说。

  她没有否认。那张草图还摊在桌上，红色的线条像血管一样从T2航站楼向四面延伸，标注着每一条可走的路和每一个可能被人堵住的节点。她盯着那条被雪乃画了小圈的成田特快换乘线看了几秒，然后把目光收回来，落在雪乃自己都没注意到的、溅在草图边缘的那几滴红茶上。

  "当时信封已经邮好了。"她说，声音很轻，像是怕吵到什么似的，"我怕如果停下来等回复，就再也鼓不起勇气了。就像那天在圣诞舞台剧的后台一样。"

  雪乃没有接话。她转开视线去看窗外，外面天已经开始暗了，停车场里的灯亮起来，照在一排排车顶上，白得有点刺眼。

  "不过，"拉芙希妮在雪乃把脸转回来之前补了一句，"确实应该先等你的。"

  这句话说完，卡座里安静了几秒。雪乃的手还搭在膝盖边上，手指没有动，那只沾着干红墨水的食指微微蜷了一下，又松开了。

  "下次，"雪乃说，语气已经恢复了刚才那种平的东西，但底下那层别扭的硬还没有完全磨平，"不要一个人把所有步骤跑完。"

  她说完就站起来，拿起桌上的账单走向收银台。走了三步，脚步慢下来，停了一下——像是还有什么话留在卡座里没有拿。

  她没有回头。只是把账单换到左手，用右手在风衣口袋里找钱包。那个动作比平时慢了一点。

  拉芙希妮坐在原位，看着雪乃的背影停在收银台前的灯光里。草图还摊在桌上，红茶渍和红墨水在纸面上各自清晰。
