场景: 134
幕: "第十幕·冬去春来"
时间: "2015年1月29日 · 周四"
地点: "拉芙希妮公寓→总武高特别栋奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
POV: "共享场景／零POV"
正文: |
  一月二十九日的早晨，拉芙希妮在卧室里收好了两样东西。

  退出协议的正本放进文件匣，和日内瓦信托的银行来信躺在同一格。返程票的票根，希思罗到成田，一月二十七日那一程，对折，夹进护照。护照里已经有了去程的那一张。两张票根隔着十几页，各就各位。

  文件匣合上。楼下传来家政太太收拾早餐的声响。她拎起书包出了门。

  放学后的特别栋，三年级的楼层空了大半。共通テスト结束，学校对三年级的出勤管理松了下来，走廊里静得能听见暖气的声音。

  拉芙希妮在活动室门口站定，没有敲门，直接把门推开。

  "我回来了。"

  长桌边三个人。小町和大志要准备一年级的期末考，今天没来。

  结衣第一个从椅子上弹起来，绕过半张长桌，一把攥住她的胳膊。

  "回来啦！欢迎回来！"

  "嗯。我回来了。"

  "比走的时候胖了一点！很好！"

  "哪有，是衣服厚。"

  八幡坐在老位置上没动，MAX咖啡举到一半："哦。"他朝对面那把椅子抬了抬下巴。椅子上码着四五本文库本。"你的位置被我的书临时托管了十天。现在办理移交。"

  他把书抱走，又用袖子抹了一把椅面。

  雪乃合上委托记录簿，站起身，看着她，点了点头。

  "欢迎回来。"

  "嗯。"

  结衣已经跑去茶柜，踮着脚从上层取下那只深蓝瓷杯。

  "杯子我昨天先洗出来晾着了！杯柄跟大家朝一个方向哦！"

  拉芙希妮把书包放上自己的椅子。暖气口正对着这个位置。

  茶是拉芙希妮沏的。

  "今天的值日明明是我……"结衣趴在桌边，看她洗杯子。

  "这十天，我的份是大家轮着做的。"拉芙希妮把水壶坐上炉子，"从今天开始还。十天，一天一天还。"

  "值日表上可没有利息这一项。"八幡翻着文库本，头也不抬。

  "不是利息。"她说，"是复位。"

  她提着水壶，在门背后的值日表前站住。六张便签，六个名字，今天那一格写着由比滨。一月的风扇没有在转，纸角安安静静。

  水开之前，她从书包里取出一只扁平的铁罐，放进茶柜。

  "给活动室的。红茶，伦敦买的。"

  "哇！进口货！"结衣凑过去研究罐子上的标签，"这个很贵吧？"

  "用信托的生活费买的。"拉芙希妮说，"所以是大家的东西。"

  八幡从书上方瞥了一眼："把信托的钱花进活动室的茶柜。这是什么，洗钱吗。"

  "是分红。"

  水开了。她烫壶，投茶，第一遍水倒掉，第二遍水续上。动作和去年十一月之前没有任何区别。结衣捧着果茶，八幡的MAX咖啡换了新的一罐，雪乃自带的水杯放在手边。

  雪乃把委托记录簿翻到最新的一页，推到桌子中间。受理中那一栏，从去年十月挂到现在。

  "结果怎么样？"雪乃说。

  "表决通过了。"拉芙希妮在她对面坐下，"退出协议生效。我放弃的权益，按申请回归家族公共信托，没有转到任何个人名下。家族那边，永久放弃教育、居住、婚姻和职业上的审查权。"

  雪乃的水笔一行一行地记。记完，她在旁边写下日期：二〇一五年一月二十日。

  "和预案一致。"雪乃说。

  "嗯。"

  "反自我牺牲条款。"八幡从文库本上抬起眼睛，"用上没有。"

  "没有。原方案，一条没改。"

  "哦。"他把眼睛放回书上，"那我那一栏白紧张了。"

  "伦敦的部分，你不用逐项报销。"他又补了一句，"反正报了，我们也核不了账。"

  结衣张了张嘴，一个问题到了嘴边，转了个弯："伦敦……冷不冷？"

  "冷。一直在下雨。"

  "吃的呢？"

  "也下雨。"

  八幡嗤了一声。结衣拍了一下桌子："对了！上次那个问题，现在不是演习了。回来以后，第一顿想吃什么？"

  拉芙希妮看着杯子里的热气，想了几秒。

  "肉包。"她说，"便利店的那种。在希思罗排队的时候决定的。"

  "飞机餐呢？！"

  "飞机餐不算顿。"

  "这倒是。"八幡表示赞同，"飞机餐是一种赎罪券。"

  "那就肉包！"结衣宣布，"明天，车站那家便利店，我请客！"

  雪乃在合上记录簿之前，又想起一件事。

  "还有一项学校的事务。三年J班的毕业文集，每人一篇，三月截稿。你不在的这十天，我把你的页数保留下来了。"

  "谢谢。"拉芙希妮说，"我会写的。"

  "写什么好呢……"结衣托着腮，"拉芙希妮酱的话，肯定写得很好。"

  "写肉包评测。"八幡说，"从希思罗写到成田。"

  茶续到第二遍。

  雪乃把记录簿合上，笔帽按回去。

  "委托继续受理。交付期不变，明年三月。"

  "嗯。"

  拉芙希妮捧着杯子，左手在桌下抚过右手腕的袖口，隔着布料，在那条丝带上停了一拍。

  "还有一件事。"她说，"不是委托。是一个名字。"

  三个人都看过来。

  "在英国的家里，我小时候，有一个昵称。"她说得很慢，"家里最年长的一位姑婆起的。玛格丽特姑婆。她叫我，苇草。"

  "苇草？"结衣眨了眨眼。

  "拉芙希妮，在爱尔兰是一个地名，本身就有苇草的意思。"她说，"姑婆读帕斯卡的时候。读到了人是一根会思想的苇草。"

  "拿帕斯卡起小名。"八幡把文库本放低了一点，"你家的姑婆，下手挺重的。"

  "她叫得很轻。"拉芙希妮说，"她说，家里那么多人，总要有人记得，这一根是独一无二的。"

  活动室里静下来。暖气响了一声。

  "家里只有她一直这样叫我。后来，我不太让别人叫了。"

  她放下杯子。

  "这个名字，本来算家里的东西。现在，我从那个家里退出了。它在我手里。"

  她转向雪乃。

  雪乃没有立刻回答。

  "为什么是我？"

  "因为你会把它叫得很省。"拉芙希妮说，"这个名字，我不想被常叫。要交给一个在称呼上很省的人。"

  雪乃垂下眼睛，看了一眼合上的记录簿。

  "从管理上说，部内增加一个称呼，只会造成混乱。"

  "嗯。"

  "但是，委托人指定的事项，我没有拒绝受理的条款。"

  她把水笔帽又按紧了一些，才抬起眼睛，看着拉芙希妮。

  "苇草。"

  "嗯。"拉芙希妮应了一声。

  "诶？！只有小雪乃吗？！"结衣举起手，又自己放下，"啊，不过，算了！拉芙希妮酱就是拉芙希妮酱，叫顺口了，我才不想改呢！"

  "小企也不改吗？"

  "我免了。"八幡翻了一页，"都柏林叫顺了。现在改口，前面的全白叫了。"

  "各叫各的就好。"拉芙希妮说，"本来就是这样的意思。"

  结衣看看她，又看看雪乃，忽然笑了。

  "怎么了？"

  "没什么！"结衣把果茶喝完，"就是觉得，拉芙希妮酱回来了，真好。"

  那一壶红茶喝完的时候，天已经擦黑。

  "那，周六！"结衣收拾书包的时候宣布，"欢迎会！在我家！吃火锅！"

  "为什么是你家。"

  "因为我家热闹！"结衣说，"理由成立。"

  八幡把文库本塞进书包，"这顿算你那栏的工作成果。最终考核用得上。"

  "那当然！小企，你去把小町和大志也叫上！"

  雪乃最后一个出来把门锁上。四个人在走廊里分成两路。结衣挽着拉芙希妮的胳膊往楼梯口走，一路报着火锅的菜单，报到第三样就开始跑题。八幡跟在后面两步，MAX咖啡的空罐抛进转角的回收桶，哐当一声。

  "肉包，明天就有。"结衣说，"车站那家，从明天起每天都有！"

  "嗯。"拉芙希妮说，"明天开始。"
