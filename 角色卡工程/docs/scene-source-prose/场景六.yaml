场景: 6
幕: "第一幕·入部磨合"
时间: "2013年5月21日 放学后（承接场景五）"
地点: "奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、材木座义辉、平冢静"
正文: |
  材木座看着那份被红笔改得面目全非的原稿，非但没有崩溃，反而发出了一声比之前更响亮的怪叫。

  "原来如此！在极致的绝望中开出扭曲的忠诚之花，剥离一切虚伪的温情，只留下生存的本能与绝对的支配！这才是真正的暗黑流派！吾之盟友，还有雪之下殿下，都柏林殿下！吾悟了！"他一把抓起原稿，眼泪鼻涕糊了一脸，像一辆失控的战车般冲出了活动室，走廊里回荡着他那羞耻的宣言，"吾辈这就回去闭关！这一次，吾定要拿下新人赏！"

  雪乃看着他消失的背影，默默地把那支红笔收了起来，仿佛刚才只是处理了一件微不足道且气味难闻的垃圾。

  "看来你们相处得不错嘛。"

  活动室的拉门再次被拉开，平冢静穿着标志性的白大褂走了进来。她手里夹着一根未点燃的烟，目光在活动室里扫了一圈，最后停留在桌面上那几道红笔划过又被擦掉的痕迹上。

  "一个负责解构，一个负责填充，还有一个负责打圆场，顺便加上一个在一旁看戏的闲人。"平冢静拉过一张椅子坐下，语气里带着几分毫不掩饰的赞赏，"这种程度的合作，对于你们这群问题儿童来说，已经算得上是奇迹了。"

  雪乃没有理会这种评价，只是默默地开始收拾桌上的茶具。平冢静挥了挥手，示意活动结束。

  "好了，今天就到这里。雪乃，比企谷，由比滨，你们先回去吧。"平冢静的视线转向坐在长桌中央的浅金发少女，"拉芙希妮同学，你稍微留一下。"

  雪乃收拾茶具的动作顿了一下。她看了一眼依旧安静坐在原位的拉芙希妮，又看了看神色如常的平冢静，没有多问。她拎起书包，与八幡和结衣一起走出了活动室。

  当走廊里的脚步声渐渐远去，活动室里只剩下平冢静和拉芙希妮两人时，平冢静才把手里那根一直没有点燃的烟放回了口袋。

  "你今天做得很好。"平冢静看着她，原本豪爽的声音放轻了一些。

  拉芙希妮没有立刻回答。她坐在椅子上，视线并没有停留在平冢静的脸上，而是落在了对方白大褂的衣角上。过了好一会儿，她才缓缓抬起头，那双翡翠色的眼睛里带着一种与其年龄不符的、近乎清醒的审视。

  "老师，"拉芙希妮的声音很轻，却咬字清晰，"您在评价的，是我的观察，还是我的参与？"

  平冢静愣了半秒。她显然没料到，这个看起来安静柔弱、防备心极重的转学生，会抛出这么一个锋利且直指核心的问题。

  短暂的错愕后，平冢静笑了。那不是平时那种带着威压的笑，而是一个属于成年人的、带着几分释然的笑容。

  "两者都是。"

  拉芙希妮看着那个笑容，没有再追问。她轻轻点了点头，站起身，将那本英日对照的诗集收进书包，然后朝着平冢静礼貌地鞠了一个躬，转身走出了活动室。

  随着拉门重新合上，活动室彻底安静了下来。平冢静独自坐在椅子上，听着走廊里渐渐消失的脚步声。她伸手拉开了长桌下方那个平时用来存放废弃文件的抽屉。

  她从最里面取出一个没有署名的信封。信封边缘有些泛黄，看起来已经保存了一段时间。

  平冢静的手指在那几行简短的委托词上停留了片刻，然后将信封仔细地折好，妥帖地放进了白大褂的内侧口袋里。
