场景: 70
幕: "第四幕·冬假→三学期"
时间: "2014年1月3日 · 周五 · 冬假中"
地点: "总武高中 · 特别栋 · 奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、由比滨结衣、比企谷八幡"
正文: |
  走廊上的冷风带着一月特有的干涩感。

  雪之下雪乃原本准备了整整一套逻辑严密的质问。关于那条只有四个分句的异常报备，关于她这两天那种刻意维持的距离感。她甚至在脑子里预演了要如何用最冰冷的声音，要求对方把隐瞒的事情吐出来。

  但这一切都没能来得及发生。

  拉芙希妮走在前面，在距离特别栋那间闲置教室还有三步远的时候，突然停下脚步。她转过身，用一种比往常略快的节奏伸出手，准确地扣住了雪乃的风衣袖口，然后稍稍用力往后一拽。

  "你……"雪乃因为这毫无预兆的物理拉扯而踉跄了半步，精心准备的开场白瞬间卡壳。她看着那张总是保持着安全距离的苍白面孔，那双翡翠色的眼睛里没有平时的谨慎，反而带着一种类似那天硬塞给她热红豆汤时的干脆和任性。

  "抱歉。如果不麻烦的话，请先进来。"

  拉芙希妮完全没有给雪乃反抗的余地，甚至没说为什么，另一只手便直接拧开了部室的拉门，连拖带拽地将她拉进了门框内。

  "砰——！"

  雪乃的视线甚至还没来得及对准部室中央那张长桌，一声闷响就在耳边炸开。

  彩色的纸屑和细长的塑料彩带像一场没有逻辑的廉价暴雨，劈头盖脸地砸了下来。几缕红的绿的彩带挂在了她那头总是打理得一丝不苟的黑色长直发上，还有一截掉在了她的肩膀上。

  "小雪乃，生日快乐！！"由比滨结衣手里举着还冒着白烟的塑料礼花筒，从门后跳了出来，那张因为兴奋而涨红的脸上挂着毫无防备的巨大笑容。

  雪乃愣在原地。瞳孔里的冷硬因为感官超载而迅速涣散。她的手指僵在半空，甚至忘了去摘掉挂在鬓角的彩带。她看着这间平时只用来安静看书和处理委托的闲置教室，看着窗边那个应该很安静的角落现在被彩旗堆满。

  "……这算是某种针对我的新型校园霸凌吗？"过了足足五秒，雪乃才找回自己说话的声音。尽管她努力想让这句话听起来像往常一样充满压迫感，但微微打结的尾音还是出卖了她此刻的慌乱。

  "如果这是霸凌，那这成本也太高了一点。"

  伴随着门边传来的轮子干涩的滚动声，比企谷八幡推着一张从家政教室借来的带轮子的小茶几走了出来。他一如既往地驼着背，外套扣子敞开着，用那双看什么都觉得麻烦的死鱼眼瞥了雪乃一眼。

  茶几的正中央，放着一个精致小巧的蛋糕，上面还插着一根燃着微弱火光的蜡烛。

  "别用那种像看什么未确认生物的眼神看我。"八幡在距离雪乃一米的地方停下推车，抬手抓了抓后脑勺的乱发，语气干瘪得像是在念说明书，"先说好，买蛋糕这种麻烦事不是我的主意。我只是负责出苦力把它从车站那边运过来而已。"

  "小企你太破坏气氛啦！"结衣鼓起脸颊抗议了一句，然后又迅速转过头，眼睛亮亮地看着雪乃，"小雪乃，快过来许个愿！这个可是拉芙希妮酱特意挑的口味哦，据说不会太甜！"

  雪乃转头看向站在自己身侧的拉芙希妮。那个金发的转学生正安静地注视着她——左手腕上，那条红色的绸带在活动室的冷白色灯光下，明晃晃地缠绕在深青色针织衫的袖口外。拉芙希妮的右手微微背在身后，用那种清冷又认真的语气开了口：

  "如果不麻烦的话，请在蜡烛烧到底部之前许愿。不然清理蜡油会变成一件非常缺乏效率的事情。"

  她连邀请人去吹蜡烛，都要用这种干燥的借口。

  雪乃低头看着那个蛋糕，又看了看站在长桌前毫无默契、甚至有些吵闹的三个人。她伸手将挂在鬓角的那条红色彩带扯了下来，捏在手心里。那些在公寓里积攒了两天的冰冷焦虑、那些关于背叛和防备的推导公式，在这股充满奶油味和火药味的劣质空气里，被击得粉碎。

  "在活动室进行这种铺张浪费且污染环境的活动，如果被平冢老师发现，我想各位都不可能有什么好下场。"

  雪乃轻声说着。

  微弱的烛光在雪乃克制的一口气中熄灭。

  随着结衣重新按下墙上的开关，冷白色的灯光再次填满了这间闲置教室。结衣第一个从制服口袋里摸出一个粉色包装的小盒子，里面是一条手工编织的深蓝色发带。八幡则从推车的下层拽出一个没有任何包装的塑料袋，里面装着一盒猫咪专用的高级罐头和一本《猫语解读指南》。

  雪乃用一种"勉强算你有用"的目光扫了八幡一眼，将两份礼物收到了长桌自己的一侧。

  接着，部室里的视线自然而然地汇聚到了尚未有所动作的拉芙希妮身上。

  金发的转学生站得很直，她慢条斯理地从书包里拿出一个深褐色的牛皮纸袋。纸袋表面印着模糊的黑白棋盘格图案，袋口用一根普通的棉线封着。她双手拿着纸袋的上端，将它轻轻放在了雪乃面前的桌面上。

  "这是……"雪乃的视线落在那个牛皮纸袋上，声音还是带着那种习惯性的防备。

  "如果不麻烦的话，你可以现在打开。"拉芙希妮的语调依然平缓，甚至比平时还要低半个音阶。

  雪乃伸出手，动作带着一丝警惕，拆开了棉线。

  在看清纸袋内部物品的那零点一秒里，八幡清楚地看到，这位平时将"理智"和"正确"挂在嘴边的部长大人，肩膀像是被抽掉了所有骨头一样，猛地向下塌陷了一瞬。

  纸袋里躺着一个大约手掌大小的黑白相间的玩偶。那只圆滚滚的熊猫穿着一件缩小版的英伦粗花呢风衣，头上戴着一顶猎鹿帽，右边的爪子里还握着一个逼真的微型烟斗——贝克街探案版潘先生。原宿总店元旦限定。全日本前五十名。

  八幡的视线在那个牛皮纸袋的黑白棋盘格图案上停顿了一下，随后在大脑里迅速调出了昨天下午在车站咖啡馆的画面。那时拉芙希妮踩着三小时的底线赶回来，大衣口袋里露出的牛皮纸袋一角，正好就是这个图案。

  原来如此。八幡在心里毫不留情地叹了口气。这位金发的转学生不是去执行什么秘密任务，也不是去见什么危险的家族联系人，她只是坐电车跑到原宿，在寒风里排了将近一个小时的队，就为了抢一只穿着风衣的吉祥物。

  而雪乃昨天在咖啡馆里那种每隔三十秒扫一眼门口、反复确认手机屏幕的状态，在这个玩偶面前，简直成了一个彻头彻尾的喜剧。

  闲置教室里的空气里依然飘着廉价礼花筒没散尽的硫磺味，混合着茶几上那点微弱的奶油香气。

  雪乃低着头，手指依然紧紧攥着那个印着黑白棋盘格图案的牛皮纸袋。她的视线越过纸袋边缘，落在长桌上。左边是结衣那条走线还略显生硬的深蓝色手工发带，右边是八幡那袋毫无包装美感可言的猫罐头和实体书，正前方，是那只穿着英伦风衣、叼着烟斗的微型潘先生。

  这一切都太不符合逻辑了。

  在过去十七年的经验里，无论是在本宅里那张永远冰冷的餐桌上，还是那条元旦深夜发来的、只有四个分句的查岗回复，曾让她在公寓的沙发上预演了无数种最坏的背叛结果。

  她甚至已经做好了准备，如果拉芙希妮今天不再出现，或者收回了那条代表庇护的红绸带，她该用多么刻薄的词汇去掩饰自己的无能为力。

  可是现在，在这间设备简陋、连暖气都有些老化的特别栋教室里，那些被她武装到牙齿的计算公式，被一声礼花筒的闷响和一只排队将近一个小时才买到的绒毛玩具，轻而易举地碾成了粉末。

  "小雪乃……"结衣小心翼翼地凑近了一点，目光在她还泛着微红的耳根上绕了一圈，"你要是实在不喜欢那个玩偶，拉芙希妮酱也不会勉强的啦。不用这么勉强自己拿在手里的……"

  结衣那种完全凭借直觉散发的、毫无保留的体贴，在这种时候简直比任何质问都让人难以招架。

  "我没有勉强。"雪乃迅速反驳，声音因为过快而发紧。为了证明这句话的真实性，她甚至把那个纸袋往怀里又收拢了两厘米。

  "我说由比滨，你没看出来部长大人现在正处于某种因为收到过度珍贵物品而导致暂时失言状态吗？"八幡靠在茶几旁边，用那种事不关己的死鱼眼看着这边的动静，"比起讨论那个连烟斗都做得很逼真的胖熊，我觉得趁着奶油还没彻底化掉之前把蛋糕切开，才是目前最有建设性的提案。"

  "那是福尔摩斯造型，不是普通的胖熊。并且，潘先生的体型在同科属中属于标准的健康状态，比企谷同学，你的常识匮乏程度简直让人惊叹。"

  雪乃抬起头，条件反射般地给出了恶毒的纠正。但在对上八幡视线的那一秒，她并没有像平时那样带着那种居高临下的鄙夷，而是迅速将目光移开了。

  拉芙希妮站在桌边，看着雪乃这副强装镇定却处处是破绽的模样，没有再继续用那种干燥的逻辑去拆穿她。

  "既然雪乃同学已经对这件物品的外观做出了肯定性评价，那我们确实不应该继续在常识问题上浪费时间了。"

  她端起一块蛋糕凑到雪乃嘴边，笑着说。

  "部长，为了让您更好地监督我们后续的清理工作，如果可以的话，要不要尝尝这个比企谷同学提前两天就预定的蛋糕？"

  听到这句顺水推舟的台阶，雪乃微微垂下视线，没有理会八幡别扭地否定。

  雪乃轻轻咬了一口，甜的，但不讨厌，奶油的浓度刚好控制在雪乃的喜好区。

  她看着围在长桌前的这三个人。一个满脸兴奋准备破坏蛋糕完整性的笨蛋，一个满嘴歪理怕麻烦却站在旁边没走的别扭男生，还有一个用着敬语却把她的心理防线拆得七零八落的转学生。

  原来，被这种毫无逻辑可言的真实关系包围，是这种感觉。比公寓里一个人抱着玩偶要吵闹得多，也麻烦得多。

  "……下不为例。"

  雪乃终于松开了紧咬的牙关，将那个牛皮纸袋极轻、极小心地放回桌面上，然后用那副清冷得不带一丝多余情绪的嗓音宣布了最终判决。

  虽然说着这样的话，但她放在腿上的双手，却比进门时的任何一刻都要放松。
