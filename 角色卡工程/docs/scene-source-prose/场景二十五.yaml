场景: 25
幕: "第二幕·暑夏·林间学校"
时间: "2013年8月下旬 · 暑假尾声"
地点: "总武高教职员室"
人物: "拉芙希妮·都柏林、平冢静"
POV: "拉芙"
正文: |
  在那条简短的信息弹出来之前，这原本应该是一个普通到有些沉闷的夏日午后。
  "都柏林同学，暑假快结束了，你能来学校帮忙整理一下教职员室的旧档案吗？"
  信息的发送者是平冢静。对于这种属于"普通高中生"的被需要感，让她在沉闷的公寓里找到了一丝得以喘息的缝隙。她换上轻便的夏装，来到了总武高中的教员室。

  教员室里开着冷气，但依然弥漫着一股属于旧纸张、灰尘以及残存咖啡香气的混合味道。平冢静坐在靠窗的那张办公桌后面，手里拿着红笔，正快速地批改着堆积如山的暑假作业。笔尖划过纸面的"沙沙"声，在这个只有两人的空间里显得规律而安稳。
  拉芙希妮蹲在一排铁皮柜前，手里拿着抹布和分类标签。
  需要整理的大多是几年甚至十几年前的学生活动记录、落满灰尘的毕业生名册，以及一些边缘已经严重发黄的校务文件。她以一种近乎机械的精准度，将那些纸页对齐、归类、放入新的牛皮纸档案袋中。这种不需要调动太多情绪逻辑的重复性工作，让她感到一种久违的平静。

  直到她从铁皮柜的最底层，拖出了一个没有贴任何官方标签的旧纸箱。
  拉芙希妮拨开上面的防尘纸，里面堆放着厚厚一沓信件。没有贴邮票，有些信封甚至没有封口，看样子更像是以前的学生或者某位旧同事私下留给平冢静的私人信件。
  拉芙希妮原本打算直接将整个箱子搬出来，换上一个新的防尘罩。但就在她的手捏住最上面那几个信封边缘的那一秒，她的视线不可避免地扫过了其中一个泛黄信封上的字迹。

  那是一个没有写收件人，只在右下角写了一行简短英文注释的信封。
  拉芙希妮的手指没有收回，但她准备起身的动作却在半空中完全僵住了。
  对于普通人来说，那可能只是飘逸的花体英文，但在拉芙希妮眼底，那个大写首字母特有的起笔压迫感，那个尾部字母在收束时看似随意实则内敛的拖尾弧度，比最高级别的家族加密密码还要刺眼。
  不需要任何字迹比对，也不需要经过大脑皮层的逻辑推演。
  这几年里，她曾无数次在梦里、在那段最窒息的流水线岁月中，隔着一层薄薄的纸片抚摸过这种字迹。

  那是达洛维小姐的字。
  是那个教会她如何说"不"、那个用打火机的微弱光芒带她脱离黑暗，也是那个将大半截烧毁在火焰里的丝带，永远留在了她右手腕上的人的字。

  教员室里的冷气源源不断地吹在她的后颈上。不远处，平冢静翻过了一页作业本，纸张发出清脆的"哗啦"声。
  拉芙希妮蹲在那个旧纸箱前，手里依旧保持着捏住信封边缘的姿势。翡翠色的眼眸钉在那个发黄的信封上，一言不发，一动不动。
  教员室里的冷气继续运转着，压缩机发出低沉的嗡嗡声。不远处，平芷静红笔划过纸面的声音依然规律而清晰，仿佛一道无形的安全网，将这方小小的空间与外界隔绝。
  拉芙希妮蹲在铁皮柜的阴影里，手指捏着那个边缘泛黄的信封。
  信封没有用火漆封口，胶水也早就随着时间干涸失效。那是一种毫不设防的敞开状态。
  拉芙希妮没有挪动位置，只是微微低垂着翡翠色的眼眸。她的手指以一种轻微、却又异常稳定的幅度，从信封里抽出了那张折叠过的信纸。

  淡蓝色的墨水痕迹在纸面上铺开，字迹清晰，首字母依然带着那种熟悉的压迫感，却在行文间流露出拉芙希妮从未见过的随意与平缓。

  "静：
  伦敦这边下雨了。你那边的千叶是不是已经开始热了？

  那个孩子最近开始读诗集了。她总是在词典旁边放一本笔记，遇到不认识的古英文词就记下来。我有时候觉得她比我还要认真。

  上周她问我'什么是永远'。我不知道该怎么回答。我告诉她'永远是一个很长的时间，我们不需要现在就理解它'。她好像不太满意这个答案，但她没有追问。

  她是个好孩子。我希望她能有机会遇到一些不试图回答'永远'的人，而是陪她一起不去回答的人。

  代我向你那边的樱花问好。

  D"

  最后那个"D"字的拖尾弧度在纸页右下角收束。
  拉芙希妮的视线停留在那个字母上，长达半分钟没有移动。十五岁那年的雨声、泛黄的诗集纸页，还有那个带着焦糊味的打火机微光，在她的脑海深处无声地炸开。她的右手腕内侧，那根常年紧贴皮肤的旧丝带似乎又开始隐隐发烫。
  不试图回答永远，而是陪她一起不去回答的人。
  她想起了林间学校里那个没有监控的黑暗房间，想起了平稳的呼吸声，想起了那杯甜得发腻的红茶。

  她没有哭。
  眼眶里没有任何多余的水汽。在家族十几年如一日的锻造下，眼泪是最先被剔除的无用代谢物。
  她以同等精准的动作，将那张信纸沿原有的折痕折叠好，重新塞回那个没有封口的信封里。指尖抚平信封边缘因抽拉而产生的微小翘起。
  然后，她将那个信封放回了旧纸箱的最深处，把上面的防尘纸重新盖好。

  在这个过程中，不远处的平芷静没有抬头，红笔的"沙沙"声也没有任何停顿。
  拉芙希妮站起身。她拿起放在一旁的抹布和一沓空白的牛皮纸档案袋，转身走向下一个满是灰尘的铁皮柜。她抽出抽屉，将里面凌乱的文件拿出来，开始进行下一轮机械而规律的归类。
  教员室里只剩下纸张被翻动的声音，仿佛刚才那个泛黄的信封，以及那个关于"永远"的答案，只是冷气运转中一个微不足道的杂音。
