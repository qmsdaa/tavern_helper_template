场景: 50
幕: "第三幕·二学期"
时间: "2013年11月下旬 · 场景49八幡从教员室回来 · 放学后"
地点: "奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
正文: |
  手指微一用力，略显生涩的金属滑轨发出低沉的摩擦声，将长长的一截走廊冷风带进了室内。

  比企谷八幡踩着这道声音踏入活动室。他原本以为，等待他的要么是因为他刚才那个脚底抹油的借口而引发的声讨，要么是继续维持着一色彩羽离开后那种沉闷得让人无法呼吸的低气压。

  但在门被彻底拉开的那一刻，他那用来接收负面情绪的天线，却捕捉到了一种截然不同的频率。

  空气里并没有剑拔弩张的硝烟味，反而透着一种像是在深水中危险地潜游了一圈后、终于重新浮出水面大口呼吸的余韵感。

  "如果那个一年级的家伙以为，靠着一张哭丧的脸说几句不想连累朋友的漂亮话，就能让我们去帮她干弄脏手的活，那她也未免太小看负面传闻的反噬力了。"

  八幡盯着桌面上并不存在的焦点，让那段在走廊里反复推演过的构思顺理成章地滑入空气。

  "想要不着痕迹地落选，又不留下被人在背后指指点点的污名。那就不能用那些手段粗糙的恶作剧去强行降低她的名声。"

  他停顿了一下，将原本散落在桌面的视线抬起，精准地越过长桌，落在了拉芙希妮·都柏林那张笑容里藏着防备的脸上。

  "对付那种在意自身处境、又擅长用受害者身份来博取同情的家伙……也许不该去证明她'做不到什么'。"八幡用一种仿佛只是在自言自语、却又分明在下达邀请的口吻继续说道，"如果顺着她那种想要维持乖巧后辈形象的包装，把那个需要逃避的借口，置换成某种她根本无法承担、却又必须由她亲自去证明的'正面挑战'呢？"

  那段带着粗糙算计的话音在活动室里落下后，换来的是长达数秒的安静。

  由比滨结衣有些茫然地来回看着面对面坐着的两个人。她只听懂了"不制造负面传闻"这个安全的前提，却完全没跟上那个"置换概念"背后深藏的恶意。

  而拉芙希妮·都柏林则安静地端坐在长桌中段。她原本停留在八幡空手上的视线，随着他那番自言自语般的推演，慢慢移回了他的脸上。

  那双翡翠色的眼睛里并没有出现被冒犯的警惕，反而浮现出一种微小、却极度认真的审视。

  "顺应对方用来掩饰的防御外衣，将其反向构建成一座无法后退的高塔……"

  她轻轻开口，声音还是那种带着一点礼貌距离感的平稳基调，但吐出的字句却仿佛手术刀般精准。

  "这确实是一种干净的切割方式。比企谷同学，你的思维方式，比你过去那些鲁莽的做法要有效率得多。"

  这种不带任何私人感情的客观评价，让八幡在那一瞬间产生了一种自己是被摆在展台上的实验样本的错觉。

  没有给八幡去消化这种不适感的余地，拉芙希妮的双手自然地交叠在膝盖上，顺着他抛出的那条半成品思路，将最为关键的拼图推向了长桌对面。

  "既然一色同学如此看重她那份'不愿辜负前会长与平冢老师的期待，又不想连累朋友'的乖巧人设。那么，我们就没有必要去弄脏这份完美的履历。"

  她的视线没有任何偏移，语速也保持着恒定的节奏。

  "相反，她需要一份完美契合这份人设的、优秀的'努力证明'。"

  拉芙希妮稍微停顿了半拍。

  "比如，一份为了回应前辈期待，而彻夜赶制出来的、标准高到近乎离谱的竞选纲领。这份纲领里可以包含对学生会架构的彻底翻新、与校外企业甚至社会团体的超高要求联动……"

  "等等……"由比滨结衣在那份沉闷中举起手，发出了一声疑惑的轻呼，"可是，一色学妹不是想落选吗？如果拿这么厉害的方案出来……"

  "就是因为这份方案太过'厉害'，所以她才会顺理成章地落选。"

  八幡抢在拉芙希妮开口前，用一种仿佛齿轮终于咬合的低沉声音接过了话头。他的后背彻底离开了椅背，死鱼眼里的焦躁完全散去。

  对面的转学生听到这句接过来的话，只是幅度极小地点了点头，算是默认了这个推演。

  "既然连推荐她的前会长在任时都只维持着'马马虎虎'的运营……"拉芙希妮用陈述事实的口吻继续补全了剧本的最后一段，"那么当一年级的学妹贸然抛出这种好高骛远、完全缺乏可行性的华丽蓝图时，所有人自然会觉得，她是一个'虽然干劲满满，但眼界和能力还远未成熟的努力家'。"

  完美的人设，完美的努力。
  以及，因为这份过于努力而导致的完美落选。

  在这个剧本里，一色彩羽不用去弄脏手，不用去得罪推荐人。她唯一需要付出的代价，就是那份为了圆这个弥天大谎，而必须亲自去熬夜、去策划、去执行的超负荷劳动。

  在这个进退两难的困境里，奉仕部什么都没有代替她去决定，只是递给了她一个放大版的牢笼。

  不撕破脸，也不替人背锅。

  八幡看着对面那个神色安静的留学生，后颈莫名地泛起了一层凉意。

  那张包藏祸心的巨网，在拉芙希妮平稳的叙述和八幡低沉的附和中，已经彻底编织成型。

  在这个连空气都仿佛变得黏稠、充满着某种高级社交算计意味的房间里，长桌靠近热水壶的那一端，传来了水笔被轻轻放在桌面上的微声。

  那是一种轻微却不容忽视的碰撞音，精准地切断了活动室里蔓延的凉意。

  "没有越权，也没有代替委托人做出选择。"

  清冷的声音从那个方向传来。字句依旧简短，没有任何多余的修饰或赞美，就像是用最严苛的量尺卡拉过了那份剧本的边缘。

  "这份方案，只是构筑了一个合理的选项边界。至于一色同学是否愿意走进去……"那声音稍微停顿了一下，带着一贯的客观与理智，"那是她基于自身人设，需要自己去权衡的代价。"

  这句话就像是一记干脆利落的法槌，重重地砸在了案台上。

  没有撕破脸，没有沾染肮脏的指控，甚至没有违背这间活动室最重要的底线——它完美地符合了所有规矩，却又比任何直接的拒绝都要来得致命。

  比企谷八幡的肩膀不可察觉地松垮了一些。那阵因为听懂了这种高端切割术而泛起的后颈凉意，被他用一声干瘪的叹息强行压了下去。

  "既然剧本已经写好了，总得有人去负责推销。"

  他重新将双手放回口袋，身体稍微前倾，目光扫过桌面的木纹，用那种习惯性的、带着点嫌恶和自嘲的语气开口。

  "去向一个满肚子心眼的一年级学妹，推销一份包裹着糖衣的高墙……这种明显会破坏形象的恶劣行径，怎么看都不适合交由你们去执行。"

  长桌对面的拉芙希妮·都柏林并没有因为这句话而产生任何被抢夺了工作的恼怒。她只是极轻地眨了一下那双翡翠色的眼睛，双手依然交叠在膝盖上，安静地认领了这份"不沾染脏活"的合理分配。

  而由比滨结衣则刚刚从那段绕来绕去的逻辑里挣脱出来，她有些迟疑地看向八幡，似乎还在努力弄清楚这其中的利害关系。

  "小企……你又要去当坏人了吗？"结衣的声音里带着一丝本能的担忧，但很快又被她自己压了下去，因为她意识到这次的情况，并不像文化祭时那样是在伤害八幡自己。

  "这也算不上什么坏人。"八幡避开了那个担忧的视线，"充其量，只是一个恰好路过、并且十分热心地为学妹提供社团建设指导的、可疑的前辈罢了。"
