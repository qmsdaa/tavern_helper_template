场景: 41
幕: "第三幕·二学期"
时间: "2013年11月14日 · 修学旅行第1天下午至夜间"
地点: "京都站 → 洛东区旅馆 → 洛东某京料理店"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
正文: |
  新干线平稳地减速，最终停靠在月台。

  四人顺着下车的人流一路穿行，走出了京都站的闸机。

  中央大厅的玻璃穹顶极高，正午的阳光从上方倾泻下来，在光洁的地砖上切割出大块分明的光斑。拉芙希妮·都柏林在即将踏出出口阴影的那一刻，脚步出现了一瞬间极轻的停顿。

  那不是因为被周围兴奋的学生推搡。

  迎面扑来的空气里，夹杂着干冷、尘埃和某种陈旧木质的气息。那味道毫无预兆地撞开了她记忆里某个被封存的抽屉。也许是教员室铁皮柜深处那封边缘泛黄的信件，也许是某个雨天里，达洛维小姐指间燃到尽头的火星。

  又也许，那只是她从那些干瘪的文字里，一遍遍补出来的京都。

  拉芙希妮的指尖无意识地蹭过右手腕上的旧丝带。仅仅半秒，她便重新找回了那种无可挑剔的得体节奏，跟上了队伍的步伐。

  下午的行程在按部就班的集体观光与打卡中被迅速消耗。当二年级的学生们终于被塞进位于洛东的修学旅行指定旅馆时，外面的天色已经开始显出颓势。

  带队老师在铺着榻榻米的大厅里宣读房间分配名单。

  就像某种不需要言语确认的默契，或者仅仅是名单排列的逻辑必然，拉芙希妮和雪之下雪乃再次被分到了同一间和室。几个月前千叶村林间学校那次合宿，像一张被折好后重新展开的纸，安静地覆在了这间陌生旅馆的地板上。

  拉芙希妮提着行李，拉开写着两人名字的房间移门。

  她的步子很稳。

  只是站定于玄关与榻榻米交界处时，她的视线极快地掠过了天花板的四个角落。那动作轻得几乎无法被称作动作，像某种早已刻进肌肉里的礼仪：进入新环境，确认距离，排查视线，然后才允许自己把这里暂时称作房间。

  雪乃拖着黑色旅行袋，走在她身后半步的位置。

  她没有停下，也没有发问。只是自然地越过拉芙希妮，将旅行袋放到矮桌旁，随后拿起桌上倒扣的茶具。

  陶瓷杯底碰到桌面，在安静的和室里发出一声清晰而确定的脆响。

  拉芙希妮垂在身侧的手指微微松开。

  下一秒，两人的手机几乎同时震动起来。

  群聊里，由比滨结衣发来一串看起来就很兴奋的消息。她说自己查到附近有一家评价很高的京料理店，虽然菜单上写着"怀石风套餐"这种让人难以判断价格是否友善的词，但既然是修学旅行，偶尔体验一下也很重要。

  比企谷八幡很快回了一句："重要的是体验，死掉的是钱包。"

  结衣立刻发来一连串抗议表情。

  雪乃看了一眼屏幕，语气平稳地说："如果由比滨同学负责带路，我建议我们提前十五分钟出发。"

  拉芙希妮看着那几行跳出来的文字，眼睫很轻地动了一下。

  "那么，"她将手机收回口袋，露出一个比刚才柔和些的笑，"为了不让晚餐变成深夜探险，我们现在出发比较稳妥。"

  入夜后的洛东褪去了白日游人如织的喧嚣。

  干冷的空气裹挟着沿街町屋里透出的微弱暖光，在狭窄的青石板路上铺开一层暗黄色的底色。由比滨结衣走在队伍最前方，手里举着手机导航，兴致勃勃地带着几人前往她提前查好的那家店。比企谷八幡双手插在外套口袋里，驼着背跟在旁边，偶尔对结衣过于乐观的方向感发出几句缺乏生气的吐槽。

  拉芙希妮落在了队伍的末尾。

  她的步频不知不觉慢了下来。

  路旁偶尔经过的纸灯笼，屋檐下木质格栅投在石板上的阴影，还有店门口用毛笔写成的旧招牌，都像是从某封信的空白处悄悄生长出来的东西。她不确定达洛维小姐是否真的这样描述过京都，还是自己在无数个失眠的夜晚里，把一个从未抵达过的城市补成了可以喘息的形状。

  可眼前这些灯影是真实的。

  石板路是真实的。

  从结衣手里传来的导航提示音也真实得有些吵闹。

  拉芙希妮翡翠色的眼睛在那些灯影和屋檐间停留得稍久了一点。那不像惊恐，倒更像一种过分谨慎的靠近。她像是在确认，达洛维小姐曾经允许她想象的地方，是否真的存在于这个世界上。

  她的指尖再次搭上了右手腕那截烧焦的旧丝带。

  "拉芙希妮酱！"

  结衣的声音从前方传来。

  她转过身，发现拉芙希妮落后了一大截，立刻小跑着折了回来。结衣没有去盯那只按在丝带上的手，也没有用小心翼翼的语气询问她为什么发呆。她只是非常自然地伸手挽住了拉芙希妮的手臂。

  "快点快点啦，地图上说前面那个路口左转就到了。"结衣隔着制服布料传来的体温带着一种属于日常的鲜活，她苦恼地摸了摸肚子，"再不到的话，结衣真的要饿得走不动了哦？"

  那种带点撒娇意味的重量，硬生生把拉芙希妮从旧信纸、火光和灯影之间拉回了现在。

  雪乃停在几步开外的路灯下。

  "由比滨同学，如果你不想因为第八次认错路而让我们在接近零度的气温里继续游荡，建议你先确认一下转角的门牌号。"

  她的语调一如既往地冷淡，甚至显得有些不近人情。

  随后，她看向拉芙希妮。

  "另外，京都的石板路在夜晚存在许多光线死角。行走时把注意力分散到两旁旧建筑上，并不符合基本安全逻辑。如果绊倒受伤，我们今晚的晚餐计划会被迫变更为附近医院的急诊室。"

  那只按在丝带上的手停顿了一下。

  随后，拉芙希妮不着痕迹地将手放回身侧。

  "抱歉。"她对着两人露出一个得体的微笑，但这一次，那个笑容没有完全盖住眼底残留的光，"这里的建筑风格确实让人容易分心。"

  她顿了顿，又补上一句。

  "不过，能亲眼看到它们，我很高兴。"

  结衣眨了眨眼，然后笑得更用力了一点。

  "那吃完饭回来的时候，我们慢慢走嘛。"

  雪乃没有反驳，只是转身朝结衣指出的方向走去。

  比企谷八幡站在前方不远处的阴影里。他看着拉芙希妮把手从丝带上放下来，又看着她被结衣半拖半拽地带回队伍里。八幡不耐烦地抓了抓头发，转身朝那个标着店名的转角走去。

  "所以说，"他开口时，声音还是那副懒散到近乎敷衍的样子，"要是菜单价格超过高中生常识范围，我会主张把由比滨的导航权永久剥夺。"

  "为什么啦！"结衣立刻转过头抗议，"我明明有认真查评价！"

  "评价高和价格正常之间没有必然关系。"雪乃走到店门前，看了一眼挂在外面的木牌，"不过从菜单来看，还在可以接受的范围内。"

  "小雪乃也太冷静了吧。"结衣松了口气，随后又立刻恢复精神，"那就是可以吃的意思，对吧？"

  "如果你没有把饮料、甜点和纪念品预算全部混在一起计算的话。"

  "呜哇，被发现了。"

  八幡看着结衣一副被账本击沉的表情，觉得这场修学旅行至少在财务教育方面已经产生了意义。虽然这个意义大概会在她看到甜品菜单的瞬间消失。

  店里比外面暖一些。

  木质地板被人走得有些旧，墙上挂着几张手写菜单。靠窗的位置可以看见街上的灯笼，来往行人的声音被门帘隔在外面，只剩下很轻的说话声和碗筷碰到托盘的声音。

  结衣很自然地选了四人桌。

  她把包放下后，又探头看向菜单，整个人立刻陷入了"每一样都想吃但钱包不允许"的现实困境。八幡本来想发表一篇关于高中生与观光地经济剥削之间关系的简短论文，但在看到雪乃已经拿起菜单时，决定把发言权交给更适合处理现实的人。

  "汤豆腐套餐。"雪乃说，"价格、分量和地方特色都比较均衡。"

  "听起来好健康。"结衣把菜单翻了一页，"可是这个烤鱼也好香的样子。"

  "你刚才说自己饿到走不动。"八幡提醒她，"这种状态下看菜单，连店里的筷架都会显得很好吃。"

  "才不会吃筷架啦！"

  拉芙希妮坐在靠里的位置，手指停在菜单边缘。她没有急着开口，只是看着那几个陌生又熟悉的菜名。汤豆腐、汤叶、白味噌。那些字被灯光照得很温和，比她在信纸上见过的印刷体多了一点热气。

  "我也选汤豆腐。"她说。

  结衣立刻看向她："拉芙希妮酱喜欢豆腐吗？"

  "还不知道。"拉芙希妮把菜单合上，语气很轻，"不过我好像在哪里读到过，京都的豆腐适合在冬天吃。"

  "好像？"雪乃问。

  拉芙希妮停了一下，随后笑了笑。

  "也许是信里写过。也许是我自己记错了。"

  这句话落下后，桌边安静了一小会儿。

  结衣没有追问。她只是把手里的菜单推过去一些，用一种努力显得轻快的声音说："那就刚好啦。今天这么冷，吃热的东西肯定会很好。"

  "由比滨同学。"雪乃说。

  "嗯？"

  "这句话在逻辑上没有问题。"

  "小雪乃夸我了！"

  "我只是没有否定你。"

  "那也是夸！"

  八幡拿起水杯，决定不参与这场关于肯定与未否定之间是否存在本质差异的讨论。参与之后只会变成雪之下讲义现场，最后由比滨点头，拉芙微笑，他本人负责胃痛。

  菜很快送了上来。

  热气从小锅里升起，豆腐安静地浮在浅色汤汁里，旁边放着葱花、酱油和一小碟腌菜。

  "可是就是很京都嘛。"结衣夹起一块豆腐，吹了吹才送入口中，"啊，好烫。可是好吃。"

  "你能在被烫到之后仍然坚持评价，某种意义上也算执着。"八幡说。

  "小企你也吃嘛。真的很好吃。"

  "我知道。至少它没有贵到让我在吃的时候听见钱包哭。"

  "钱包不会哭。"

  "会。它们只是没有声带。"

  拉芙希妮低下头，轻轻笑了一声。

  那声笑很短，却没有被她立刻收回去。结衣听见后，像是完成了什么重要任务一样，偷偷松了一口气，又把自己碟子里的腌菜推过去一点。

  "这个也可以试试看。味道有点特别。"

  "谢谢。"拉芙希妮夹了一小块，放进嘴里后认真停了一会儿，"比我想的更甜。"

  "诶，甜吗？"

  "只有一点。"拉芙希妮说，"但很清楚。"

  雪乃没有加入这段关于味觉的讨论。她只是把桌上的茶壶往拉芙希妮那边推近了些，动作自然得像是整理桌面。

  拉芙希妮看了那只茶壶一眼。

  这一次，她没有去碰腕上的丝带。

  她拿起茶杯，自己给杯中添了些热茶。茶水颜色很淡，和甜红茶没有任何相似之处。它只是普通的、旅馆附近餐馆里端上来的热茶，杯壁温热，入口时带着一点粗糙的涩味。

  可它正在这里。

  京都也正在这里。

  达洛维小姐是否真的说过那些话，暂时不需要在这一刻被确认。窗外的灯笼、桌上的豆腐、结衣对菜单价格的哀叹、雪乃毫不留情的纠正，还有八幡关于钱包声带的无意义理论，都把这个夜晚牢牢按在了现实里。

  拉芙希妮喝了一口茶。

  "这个地方，"她说，"比我想象中吵一点。"

  结衣愣了愣："这是好事吗？"

  拉芙希妮想了想。

  "是好事。"

  八幡咬着豆腐，含糊地说："恭喜京都在都柏林小姐的幻想审查中获得了噪音合格评价。"

  "比企谷同学。"雪乃放下筷子，"请不要把别人的正常感想加工成听起来很可疑的认证制度。"

  "我只是协助观光业提升宣传语。"

  "如果京都观光宣传采用你的文案，游客数量下降并不令人意外。"

  结衣终于没忍住笑出了声。

  拉芙希妮也跟着笑起来。她这次笑得很轻，却没有躲开任何人的声音。热茶放在她手边，杯口的白气慢慢散开。她看向窗外时，街灯正照着湿冷的石板路，几个学生从店门外经过，讨论着明天要去哪里买伴手礼。

  晚餐最后没有变成医院急诊，也没有变成高中生财政危机。

  由比滨结衣在甜品菜单前挣扎了很久，最后还是点了一份几个人分着吃的抹茶冰淇淋。比企谷八幡声称这是"以共享之名降低个人负罪感的现代消费陷阱"，然后在结衣把勺子递过来时接得很快。

  回旅馆的路上，结衣果然又认错了一次方向。

  雪乃在路口停下，语气平静地纠正她。八幡站在旁边叹气，说修学旅行的本质就是在陌生城市里被同班同学合法拖行。拉芙希妮走在他们身后，慢慢把手从口袋里拿出来。

  她没有再碰那截旧丝带。

  路旁的纸灯笼亮着，冷空气里有饭后的暖意。她跟上去时，结衣正回头叫她的名字，声音穿过狭窄的街道，落在她能听见的地方。
