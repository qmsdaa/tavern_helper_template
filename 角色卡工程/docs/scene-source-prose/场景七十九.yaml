场景: 79
幕: "第五幕·PTA→舞会"
时间: "2014年2月21日 · 周五 · 三学期"
地点: "总武高中 · 特别栋 · 奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、一色彩羽"
正文: |
  那道磨损的牛皮纸边缘贴着食指的指腹。

  雪乃没有再让指尖退缩。她用左手按住信封的下半部分，右手捏住封口处那条已经起毛的折痕。不需要剪刀或是裁纸刀，她直接顺着封口的粘合处用力一撕。

  "嘶啦——"

  粗糙纸张撕裂的声音在安静的闲置教室里被放大了，刺耳。这声音盖过了走廊外淅淅沥沥的雨声，也短暂地截断了八幡那永远也不会枯竭的叹息。

  两三页折叠好的A4打印纸被抽了出来。在抽出的瞬间，略显锋利的打印纸边缘擦过雪乃的右手食指外侧，留下一道极细的、尚未渗血的白印。她没有停顿，也没有去揉那道微小的印记，只是将那几页纸平铺在反光的桌面上。

  那是学生会原本提交给学校的，关于即将到来的毕业舞会的策划草案。

  但在这些原本整洁的黑色铅字上方、侧边、甚至是段落之间的空白处，密密麻麻地写满了红色的批注。那些字迹并不潦草，甚至可以说是端正和刻板，但每一笔每一划都带着居高临下的审视感。

  雪乃的视线落在那一片刺眼的红色上。

  教室里安静得只剩下纸张被她一页页翻动的"沙沙"声。第一页翻了过去，第二页也被翻了过去。她的眼睫毛没有丝毫颤动，蓝色的瞳孔像是在处理一组枯燥的数据，但紧绷的下颌线出卖了她试图维持的平静。

  结衣探过头来。她没有去看那些密密麻麻的文字，只是看着那片红色，本能地缩了缩肩膀。

  "小雪乃……上面写了什么？"她的声音压得很低，像是在询问一个刚刚被宣判的坏消息。

  八幡也坐直了身子。他那标志性的死鱼眼在扫向桌面时，瞳孔微微收缩了一下。即便是隔着半张桌子的距离，那种强烈的、属于大人们的"公文式傲慢"就要从纸面上溢出来。

  雪乃没有立刻回答。她将最后一页纸也看完了，然后，她将三页纸在桌面上分开，并排摆列，确保桌边的每一个人都能清楚地看到。

  "这是原本的场地预算和流程安排。"雪乃的手指点在第一页的一个段落旁，那里被红笔画了一个巨大的圈，"批注是：'预算分配严重失衡，场地选择不符合该项活动的固有规格，缺乏对等匹配的礼仪考量。'"

  她移动手指，指向第二页的安全预案部分。

  "这里写的是：'安保及散场疏导方案过于儿戏，建议参照上一年度的高级研讨会标准重新规划。'"

  最后，她的手指停在第三页的末尾，那里有一段较长的红色手写字迹。

  "'总体评价：这份草案未能体现出总武高应有的成熟度与精英气质。在这些显而易见的漏洞被彻底修正之前，PTA无法提供任何形式的协助与认可。'"

  雪乃将那三段批注念完，语气平稳，没有刻意模仿那种高高在上的语调，只是像机器一样读出了上面的字。但在最后一个音节落下时，教室里的空气被抽干了一部分。

  "这根本就不是在商量吧。"八幡干瘪的声音打破了沉默。他伸手挠了挠凌乱的头发，眉头皱得很紧，"'缺乏匹配的礼仪规格'？'精英气质'？这群大人们是打算在这里办一场跨国峰会吗？这只是一群高中生给自己找乐子顺便欢送毕业生的舞会而已。他们甚至连修改建议都没给，只是单纯地在说'这不行，那也不行'。"

  "确实。"拉芙希妮坐在她的位置上，视线从那张纸上收回。她没有去触碰那些纸，只是用冷淡的客观语气说道，"他们并不在乎预算到底去了哪里，也不在乎场地到底有多大。这只是建立在权力不对等上的施压。"

  结衣听得迷糊，但她能感觉到那种沉重："所以……他们就是要让一色学妹知难而退吗？"

  "不。"雪乃看着结衣，摇了摇头，"他们是要在一色同学退缩之后，顺理成章地接管整个活动的控制权。用他们自己的'标准'，把一场原本属于学生的活动，变成他们展示'总武高PTA治理能力'的橱窗。"

  雪乃的手指离开了纸面。那道细小的白印在白炽灯下模糊，但轻微的刺痛感一直都在。

  这就是她的母亲。这就是那个永远用"还不够成熟"作为标尺，将所有人困在轨道里的女人。这份文件上的每一个红色批注，都在向她、向一色彩羽、向这间教室里的每一个人宣告控制。

  "一色学妹大概是完全被这种阵势吓傻了吧。"八幡看着那个写着'儿戏'的批注，嘴角扯出一个难看的弧度，"所以她才连门都不敢进，把这个炸弹从门缝里塞进来就跑了。"

  "这是她作为会长必须经历的。"雪乃将那三张纸重新拢在一起。纸张在她的手指间发出干脆的碰撞声，"既然她已经按下了开始键，那就没有资格中途拔掉电源。"

  雪乃将文件边缘在桌面上磕齐。

  "如果他们认为这份草案'缺乏成熟度'，那我们就用他们无法反驳的'成熟标准'重新做一份。"她的声音不再有片刻前的干涩，那种属于雪之下雪乃的、冰冷而坚硬的理智重新占据了主导。"他们挑剔场地规格，我们就列出所有可用场地的性价比和风险评估报告。他们挑剔安保，我们就把疏导方案细化到每一个出入口。"

  她将那一叠文件平平地推到了桌子正中央。

  "这不是退让。既然他们想玩这种标准化的文书游戏，那我们就用同样的规则把球踢回去。只要新的方案在逻辑和事实上无可挑剔，他们就无法再用这种空泛的词汇来否决。"

  八幡看着她。那双死鱼眼里有什么东西停了一瞬。他原以为雪乃会选择直接硬碰硬，或者干脆顺水推舟地撒手不管。但她现在的选择，是用更繁琐、也更耗费精力的方式，去迎击那种名为"长辈"的意志。

  "真麻烦啊……"八幡嘟囔了一句，但身体却没有从椅子上挪开。

  拉芙希妮看着桌中央那份写满红字的草案。她知道，那不仅仅是一份需要修改的文档。那是一根绑在雪乃手腕上的绳子。而雪乃现在的做法，是想要在一根根解开它。她那双翡翠色的眼睛里倒映着雪乃坚定的侧脸。

  "既然确定了方向，那至少也该把那位逃跑的'会长大人'抓回来吧。"拉芙希妮轻声说道。

  雪乃的视线落在那个牛皮纸信封上。

  "一色同学必须在场。"雪乃的指尖在那道细微的白印上划过，"既然方案是为她准备的，她就需要一条一条地把这些'成熟的标准'咽下去，然后再用她自己的声音读给那些大人们听。"

  屏幕亮起，冷白色的光打在她刚才一直绷紧的下颌线上。她的拇指在屏幕上滑动，没有丝毫犹豫地停在了通讯录里的"一色彩羽"上。

  手指按下拨通键。

  她将手机贴在耳边。部室里很安静，八幡那干瘪的呼吸声、结衣挪动脚步时裙摆摩擦的声音，还有窗外淅淅沥沥的雨声，都成了背景音。听筒里传来规律的"嘟——嘟——"声，拉得很长。

  "嘟——"

  声音被切断。紧接着，一阵刻意压低、带着几分甜腻和明显心虚的声音传了出来，哪怕没有开免提，在安静的教室里也能让人捕捉到那种做作的尾音。

  "前～辈～？怎么突然给我打电话呀？我正在第二美术室打扫卫生呢，灰尘超大的，咳咳……"

  八幡在长桌对面翻了个白眼。显然，他对这种拙劣的演技已经免疫了。

  雪乃没有顺着这套虚假的剧本往下走。她的声音很冷，像是一把没有温度的尺子，直接切断了一色试图建立的闲聊框架。

  "关于毕业舞会的策划草案。"雪乃直切主题，"也就是三十分钟前，你像丢弃炸弹一样从门缝里塞进来的那份文件。"

  听筒那边的咳嗽声瞬间消失了，连背景里装模作样的翻箱倒柜声也停了下来。一阵长达三秒的死寂。

  "……诶？那个……我这边信号好像不太好……"一色的声音开始发飘。

  "在你的信号彻底断掉之前，我只陈述事实。"雪乃用拇指抵住那张写满红字的纸页边缘，"它被PTA全盘否决了。不仅是否决，他们甚至没有给出修改余地，只是单方面地用诸如'缺乏精英气质'和'儿戏'这种词汇进行了批斗。"

  "骗、骗人的吧……"一色发出一声短促的悲鸣，甜腻的伪装彻底碎裂，"我、我已经让城廻学姐帮忙看过一遍了啊……"

  "城廻学姐现在的身份是即将毕业的三年级学生，她的人格魅力无法成为你对抗PTA决议的行政护盾。"雪乃一点点收紧了握着手机的力道，"而且，在这个活动方案的执行人一栏里，签的是你一色彩羽的名字。"

  "可是……可是……"

  "没有什么可是。"雪乃的声音依旧平稳，没有任何情绪起伏的波动，却带着让人无法反抗的压迫感，"你现在有两个选择。第一，去向所有三年级的毕业生宣布，因为学生会的无能，毕业舞会取消。第二，立刻滚回特别栋闲置教室。"

  对面传来一阵吸气的声音，一色正试图在大脑里快速权衡这两种选项的灾难程度。

  "我……我现在去找平冢老师……"

  "平冢老师负责的是活动的申报流程，她不能替你回答PTA关于'场地规格不够体面'的质询。"雪乃毫不留情地切断了她最后的退路，"解决问题的第一步，是直面它的全貌。这份写满了大人们傲慢的评估报告还在桌子上，我给你五分钟时间。从第二美术室跑到这里，足够了。"

  "学姐你这也太——"

  "嘟。"

  雪乃直接按下了红色的挂断键，根本没有给一色将那句拖长音的抱怨或者发卡说出来的机会。

  她将手机反扣在桌面上。屏幕的冷光熄灭了。

  "你还真是不留情面啊。"八幡看着雪乃，嘴里吐出一口浊气。"把那种满肚子心眼的学妹逼到死角，也只有你能做得这么行云流水了。那家伙现在估计正一边哭丧着脸一边往这边跑吧。"

  "这只是最基本的职责要求。"雪乃拿起桌边的红茶杯，指尖在杯壁上感受着下降的温度。"既然她享受了成为学生会长的虚荣，就必须承担起被架在火上烤的代价。"

  "小雪乃好厉害……"结衣在一旁看着，虽然同情一色，但她更害怕那些红色的批注。听到雪乃几句话就把跑掉的一色叫了回来，她不禁松了一口气。"一色学妹看到这些字，一定会吓坏的吧。"

  "害怕是合理的反应。"拉芙希妮坐在原地，视线从那张方案上移开，看向窗外灰蒙蒙的雨景。"那些人的目的就是制造恐惧。用看似标准，让试图尝试的人在第一步就因为自我怀疑而放弃。"

  拉芙希妮的声音很轻，却准确地戳中了问题的核心。她没接话。随即恢复成那种干燥的平静——透过这张纸，她看到了某些更加遥远、更加庞大的阴影。

  雪乃看向拉芙希妮。她没有出声赞同，但她放在膝盖上的手微微收紧。那不仅仅是针对一色的考验，这也是她对自己必须要跨越的那道高墙的预演。

  "既然要反击，那我们就需要把他们抛出的那些虚无缥缈的词汇，全部量化成具体的数据。"雪乃将桌子上的几页纸重新整理了一下，动作带着准备开工的决绝。"关于场地，去确认周边可用的所有酒店大厅租金明细；关于安保，去查阅消防法规里关于大规模人群聚集的标准预案。"

  她抬头看着部室紧闭的推拉门。

  走廊外，雨声依旧沉闷。但在那沙沙的雨声中，一阵急促、慌乱、带着鞋底打滑声音的脚步声踩了进来。那脚步声踩在木质地板上，越来越近，越来越急，就像是一个被逼到悬崖边的人在拼命狂奔。

  "看来，我们的主笔人到了。"雪乃轻声说道。

  "砰——"

  老旧的木质推拉门发出了一声不堪重负的巨响，粗暴地撞在轨道尽头的胶垫上，震得窗玻璃也跟着嗡嗡作响。

  一色彩羽站在门口。她的胸口剧烈起伏着，平时总是打理得整整齐齐的亚麻色梨花头现在凌乱，几缕发丝被汗水贴在脸颊上。敞开的西装外套下，白衬衫的领口歪斜，肩头甚至还沾着一点不知从第二美术室哪个角落蹭来的白色灰尘。

  走廊的冷风顺着大开的门灌了进来，把她短了一截的裙摆吹得往后贴。

  "学、学姐……"一色大口喘着气，平时那种习惯性拖长的甜腻尾音现在因为肺部缺氧而变得断断续续，听起来像是在努力从喉咙里挤出声音。"我跑……我真的跑过来了……根本没有五分钟……"

  她一只手扶着门框，眼睛湿漉漉的，刚准备换上那副惯用的、可怜兮兮的表情来换取同情或是八幡的帮忙。

  但她的台词卡壳了。

  她的视线越过了坐在靠窗位置的八幡，越过了正满脸担忧看着她的结衣，直直地落在了长桌的中央。那里放着一份散开的文件。

  雪乃坐在桌子的另一端，双手交叠放在文件边缘，并没有因为这巨大的动静而有任何反应，只是平静地看着她。

  一色吞咽了一下，扶着门框的手慢慢松开。她往前走了两步，步伐不像平时那样轻盈讨巧，显得沉重。

  白色的纸张上，到处都是红色的字迹。那些红笔不是温和的勾画，而是充满粗暴感和压迫性的涂抹与批注。红色的线条甚至划破了牛皮纸的纤维，力透纸背。

  一色在桌边停下。她低头看着那些字。

  "儿戏"、"缺乏精英气质"、"不成体统"、"完全不符合总武高的传统"……

  那些刺眼的词汇像是一把把没有温度的尺子，毫不留情地把她绞尽脑汁、甚至四处讨好才拼凑出来的那些关于"华丽舞会"的幻想，切割得粉碎。

  她的视线顺着那些红字往下移动。在执行人那一栏，她自己签下的"一色彩羽"四个字，被一个巨大的、红色的"×"毫不留情地覆盖了过去。

  那一瞬间，一直支撑着她在这所学校里游刃有余的那种"人设"，以及从城廻巡那里继承过来的、带有几分虚荣的"学生会长"头衔，像是突然被戳破的泡沫。

  "这……这是什么啊……"一色的声音开始发抖。她伸出手，指尖还没碰到纸面，就在半空中悬停了。她的肩膀微微瑟缩了一下，鼻尖迅速泛起了一层粉红色。

  "如你所见。"雪乃的声音依旧平稳，"大人们的评估。而且，是不留任何情面的全盘否定。"

  "我……我明明已经很努力了啊……"一色的指尖终于碰到了那张纸的边缘，纸张发出轻微的沙沙声。她的眼眶迅速积满了泪水，那些原本用来作为武器的眼泪，此刻失去了控制，毫无防备地大颗大颗地往下掉，砸在木桌的纹理上。

  "我去求了城廻学姐，我去求了足球部的大家帮忙看场地，我连那些商家的报价单都跑去要了……"她开始抽噎，声音里带着彻底的挫败和委屈，"他们凭什么只看一眼就全给毙了啊！还说我儿戏……我哪里儿戏了！"

  她一边说，一边用手背胡乱地抹着眼睛，把沾着灰尘的手背在脸上擦出几道脏兮兮的印子。她不再是那个游刃有余的小恶魔，只是一个发现自己拼命努力却连门槛都没摸到的、感到委屈的普通高一女生。

  "这就是所谓的'大人的傲慢'。"八幡坐在斜对面，看着一色那张花猫一样的脸，伸手抓了抓自己的后脑勺，用干瘪的、带着几分叹息的语调开了口，"你以为你当了学生会长，就能顺理成章地在这个学校里呼风唤雨了？在那些真正的决策者眼里，你不过是个连公文格式都搞不清楚的提线木偶。"

  "前辈你这个时候居然还在说风凉话！"一色转过头，红着眼睛恶狠狠地瞪着八幡，虽然那眼神此刻毫无杀伤力可言。

  "我是好心提醒你。"八幡把视线挪向窗外，"那种麻烦得要死、又吃力不讨好的东西，从一开始就不该接下来。现在好了，被人家用红笔把脸都打肿了吧？"

  "呜……前辈最差劲了！"一色吸着鼻子，眼泪掉得更凶了。

  "好了小企，你就少说两句吧。"结衣看不下去了，她赶紧从口袋里拿出一包纸巾，绕过桌子走到一色身边，抽出一张塞进一色手里。"一色学妹，先擦擦脸吧。小雪乃她……她肯定不是故意要吓你的。"

  雪乃看着眼前这乱糟糟的景象，并没有出声制止。她等一色用纸巾把眼泪擦干，呼吸平复了一点之后，才慢慢将桌子上的那份红字草案推向一色。

  "擦干眼泪，这并不能改变它被否决的事实。"雪乃的声音依旧冷硬，但少了刚才电话里的那种紧逼感，"大人们不需要看到你的努力，他们只看结果的'合理性'。"

  雪乃从旁边抽出一张干干净净的、雪白的A4打印纸，放在了那份红字草案旁边。

  "这是空白的表格。"雪乃从笔筒里抽出一支黑色的水性笔，按在纸面上，"你作为执行人的名字，必须重新填上去。既然他们要求'精英气质'和'严谨'，那我们就用无懈可击的数据和法规把他们的嘴堵上。"

  一色呆呆地看着那张白纸，又看了看雪乃。

  "这……重新写？"一色的声音还带着一点浓重的鼻音。

  "关于场地。"一直坐在一旁没有出声的拉芙希妮突然开了口，她的视线落在一色身上，语调是平静的客观陈述，"你之前拿到的报价单，缺乏对防火通道承载量的评估。如果我们能将市中心几家符合安保最高标准酒店的坪效数据拉出来，大人们就无法再在'安全与体面'上挑刺了。"

  拉芙希妮用指尖在一张空白的便签纸上轻轻点了一下。

  "至于'儿戏'。"她继续说道，"那就把学生会的支出预算做到个位数。让他们知道，即便是一分钱，你们也在按照比他们更严苛的审计流程在运作。"

  她那种将庞大的恐惧瞬间拆解为具体工作项目的话术，有奇异的镇定效果。一色愣了一下，看着拉芙希妮那双翡翠色的眼睛。

  "……真的能行吗？"一色小声嘟囔了一句。

  "如果不试试看的话，就真的只能去跟毕业生鞠躬道歉了。"雪乃将笔往一色的方向推了推。

  走廊的冷风又吹了进来，这一次，一色没有再逃避。她盯着那支黑色的笔看了一会儿。

  "我都跑成这样了……还被前辈嘲笑……"一色咬了咬牙，伸手抓过那支笔，"要是改完还被否决，我就直接在PTA会议上哭给他们看！"

  她重重地拉开椅子，拉门外雨声依旧沉闷，但她坐了下去。

  雪乃给众人安排完任务，之后埋头进了那一堆文件当中。

  【2014年2月21日 17:40 星期五|总武高中特别栋闲置教室|阴雨|安静紧绷】

  黑色的水性笔在白纸上摩擦，发出细密而连续的沙沙声。

  雪乃的脊背挺得很直。那张淡黄色的便签纸被她压在左手手腕下，她将上面的英文缩写和商业数据一行行搬运到那张崭新的A4纸上。每一个字母和数字都写得棱角分明，没有任何连笔。

  闲置教室里只有敲击屏幕和翻动纸张的响动，那种属于傍晚的冷色调光线被厚重的雨云压得更加暗沉，只有旧荧光灯管在散发着嗡嗡的白光。

  "找到了。"八幡的声音干瘪地打破了沉默。

  雪乃没有抬头，笔尖依然在移动："说重点。"

  "市文化会馆和南区市民演艺中心，也就是PTA之前在废稿上批注'极具传统氛围'的那两个备选场地。"八幡把屏幕往长桌中间推了推，那是几个地方新闻网站的截图，"过去三年里，市文化会馆因为消防通道堆积杂物被责令整改过两次，南区的演艺中心则因为电路老化在去年的某个集会上引发过小型停电恐慌。当然，这些在官方记录里都被美化成了'设施维护'。"

  "很好。"雪乃的笔尖停顿了一下，迅速在纸张的边缘开辟了一个新的栏目，写下"备选场馆合规性风险排查"。

  八幡搓了搓后颈："把这些拿去堵那些大人的嘴吗？这种找茬的方式还真是阴暗得让人舒坦啊。"

  "这不叫找茬，比企谷同学。"雪乃手腕移动，把几个具体的年份和事故关键词填了进去，"既然他们要求'精英气质'和'体面'，那么安全合规这种最基础的体面，自然要在考量范围之内。"

  她抬起头，视线越过长桌，落在那堆传单里。

  结衣正咬着笔头，把最后几个数字抄在自己的小本子上。察觉到雪乃的目光，她立刻把本子举了起来，上面用粉色荧光笔画得五颜六色。

  "小雪乃！我都列出来了！市中心那几家符合拉芙希妮酱说的安保等级的酒店，如果只租用附楼宴会厅的话，基础报价是六十万日元，不包含灯光和花篮布置！"结衣邀功似的眨了眨眼睛。

  "辛苦了。把总金额和那几家酒店的联系方式抄到这一栏里。"雪乃用笔尖点了点面前白纸的左下角。

  接下来，她转向了一色。

  一色的眼眶依旧是红的，但那种歇斯底里的崩溃已经被高强度的抄写工作压了下去。她面前的纸上画满了横七竖八的时间轴。

  "开场致辞三分钟，学生代表发言五分钟，中间预留十分钟的串场空白给乐队调音……"一色吸了吸鼻子，声音里还带着浓重的鼻音，"后勤组至少需要十二个人在门口维持排队秩序……"

  雪乃将这些零散的部件，像是一块块精密咬合的齿轮，强行塞进了自己面前的这张名为"方案"的外壳里。

  整整二十分钟，她就这么坐在那里，用偏执的工整，在一张白纸上构建起了一座堡垒。

  "这就是最终的架构体系。"雪乃终于停下了笔。

  她将那张写得密密麻麻的A4纸往前推了推，推到了长桌的正中央。在昏白的灯光下，那些黑色的字体看起来冰冷而坚硬。

  "以'确保学生在极高密度集会下的安全'为核心论点，我们不仅全盘接受了PTA关于'体面'的要求，并且将这种标准翻倍。"雪乃看着一色，声音平稳，"既然传统场馆存在消防合规性风险，我们就在企划案中列出高层酒店附楼宴会厅的商业安保模型，也就是刚才都柏林同学拉取的人流疏散标准。"

  拉芙希妮坐在原位，用手指轻轻勾了勾耳畔浅金色的碎发，眼底带着兴味："用他们无法拒绝的'安全'和'精英阶层的客观要求'，来逼迫他们面对高昂的报价单吗？"

  "是的。"雪乃微微扬起下巴，"如果他们驳回，那就是漠视学生安全和校方声誉；如果他们同意，那就把增加预算的审批责任重新踢回他们的办公桌上。这份企划案不再是一份等待被批阅的作业，而是一份让对方陷入二选一泥沼的风险确认书。"

  闲置教室里有那么一瞬间陷入了死寂。

  八幡看着那张纸，眼角抽动了两下："用大人的魔法去殴打大人……你真的不是什么恶魔转世吗。"

  "比起在这个充满了霉味的地方听你抱怨，我更愿意相信这是符合逻辑的最优解。"雪乃冷淡地瞥了他一眼。

  一色呆呆地看着桌子中央的那份企划案。她刚才擦眼泪用的纸巾还攥在手里，但此刻那种属于"伪物"的慌乱已经被这种冰冷而强大的逻辑直接震慑住了。

  她这辈子都没见过，有人能把抗拒和不满，写得如此道貌岸然又无懈可击。

  雪乃没有理会众人的反应。她只是坐在那里，保持着防守的姿态。

  只有她自己知道，在写下这些字的时候，她脑海里浮现的，全都是母亲那种、能看透一切的视线。这些数据和法条，是她用来对抗那种视线的屏障。她必须做得比任何人都要正确，哪怕这种正确本身就带着令人窒息的疲惫。

  雪乃轻轻吸了一口气。

  抄写了将近半个小时的右手传来一阵酸痛。她垂下眼帘，将笔盖合上。

  在做这个动作的时候，她的右手手背擦过了自己放在桌边椅子上的书包侧袋。隔着帆布，那个坚硬的方盒子轮廓抵在书本边缘——那是七天前的情人节早晨，在千叶站检票口，拉芙希妮塞给她的那盒巧克力。她还没有拆开。

  雪乃的指尖在书包侧袋边缘停顿了半秒。那种因为高强度抗压而产生的紧绷感，在这个微小的触碰中，融化了一点点。

  她将笔放回桌面上，没有发出任何声音。

  "剩下的就是走流程了。"雪乃看着坐在对面的新任学生会长，语气平静，"一色同学，在这个名字栏里签上字，这就是你明天要提交的东西。"
