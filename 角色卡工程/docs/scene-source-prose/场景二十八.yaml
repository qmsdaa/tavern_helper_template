场景: 28
幕: "第三幕·二学期"
时间: "2013年9月中旬 · 场景二十七次日放学后"
地点: "总武高中第三会议室（文化祭执行委员会大本营）"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、相模南、优子、遥"
正文: |
  第二天放学后的第三会议室，比预想中更加闷热。
  厚重的木门被推开时，混杂着白板笔气味、劣质打印纸油墨味以及高密度人群散发出的焦躁感扑面而来。巨大的U形会议桌占据了房间的主体，原本应该秩序井然的座位上堆满了未经整理的文件夹和废弃的企划书。

  雪之下雪乃停在门边，深蓝色的眼眸冷冷地扫过全场。
  在U形桌前端最显眼的位置，相模南正被几个女生簇拥着。她棕色的中长发随着她略显夸张的肢体动作微微摇晃，正用一种拔高了半个音阶的声音抱怨着某个班级的进度滞后。听到开门声，相模南转过头，视线在接触到奉仕部四人的瞬间，刻意停顿了一下。

  "哎呀，这不是雪之下同学吗？"
  相模南推开面前散乱的文件，踩着制服皮鞋快步走过来。她的脸上挂着一种极度明亮、甚至有些刺眼的笑容，语气里充满了那种现充群体特有的亲昵，"太好了！平冢老师说会有人来帮忙，我还想着是谁呢。有雪之下同学在，我就放心啦。这些麻烦的文书工作……"

  她一边说着，一边自然地伸手，试图将一沓厚厚的、边缘起卷的未处理表格塞进雪乃的手里。

  "请等一下，相模同学。"
  雪乃没有去接那沓文件。她的声音不高，却有着穿透那些嘈杂背景音的冰冷质地。她微微向后退了半步，恰好让相模南伸在半空的手尴尬地停住，"奉仕部接到的委托是'辅助处理积压事务'，而不是'接管执行委员长的本职工作'。在这堆垃圾被分类出优先级之前，我不会接手任何东西。"

  相模南脸上的笑容僵了一下。那只悬在半空的手指微微蜷缩，随后又不自然地收了回去，在校服裙摆上蹭了蹭。

  站在此刻的站位里，拉芙希妮恰好落在雪乃右侧偏后的半步距离。
  雪乃的余光注意到，拉芙希妮并没有像昨天在活动室里那样因为面临强社交而完全紧绷。相反，她白皙的面容上透出一种比平时更加冷峭的静默。

  就在相模南那张挂着热络笑容的脸凑近时，拉芙希妮浅金色的睫毛微微垂下，掩盖了翡翠色瞳孔里的情绪。但雪乃清晰地看到，拉芙希妮的视线没有落在相模南那张喋喋不休的嘴上，而是笔直地盯着对方的眼睛。

  那是一双被过度表演撑开，却没有丝毫真实笑意的眼睛。瞳孔深处藏着的，只有对麻烦的急于摆脱，以及对自身地位被挑战的隐隐戒备。

  对于拉芙希妮来说，相模南这种为了虚荣而强行拼凑的低劣表演，就像是一张画着笑脸的劣质面具，连边角的胶水都清晰可见。

  拉芙希妮的左手没有去摸右手腕上的那截烧焦丝带。她的指尖只是轻轻在裙侧收紧了半寸。
  那是她本能的、嫌恶。

  "雪之下同学，话不能这么说呀。"相模南迅速调整了表情，将那沓文件重新抱在胸前，语气里多了一丝带刺的委屈，"大家都是为了文化祭好嘛。我是委员长，要统筹全局，哪有时间管这些细节？你不是最擅长这种事吗？"

  跟在相模南身后的两个女生——优子和遥——也互相对视了一眼，发出几声细碎的附和。

  "就是啊，稍微帮帮忙怎么了……"

  雪乃冷淡地看着眼前的这场闹剧。她身后的比企谷八幡发出一声轻微的、只有他们几个人能听见的干瘪嗤笑。而站在她侧后方的拉芙希妮，依然保持着那种看透了一切劣质表演后的冰冷静默，安稳地待在雪乃划定的那条不可逾越的边界线后。
