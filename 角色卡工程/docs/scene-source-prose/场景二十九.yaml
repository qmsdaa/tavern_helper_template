场景: 29
幕: "第三幕·二学期"
时间: "2013年9月中旬 · 场景二十八的直接延续"
地点: "总武高中第三会议室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、相模南"
正文: |
  相模南收回那只悬空的手时，指甲在文件夹硬壳上刮出一声细微的摩擦音。

  但她的恢复速度比雪乃预估的更快。
  那张精心维护的笑容重新拼装完毕，只是眼角的细纹收紧了一些，像是在皮肤下面藏了一根绷断的弦。她把怀里的文件往桌上一放，转身面向整间会议室，用一种刻意放柔了的、充满了"委员长体谅下属"意味的语气开口。

  "也是呢，雪之下同学说得对。"
  相模南双手交叠在胸前，微微侧头，让中长发恰好滑落到一个柔和的角度，"毕竟我是委员长嘛，得统筹全局，盯每一个班级的进度什么的，实在是分身乏术。这些文书整理的活儿，细碎是细碎了点，但总要有人做。那就拜托奉仕部帮忙处理一下积压的好不好？回头文化祭的成功，也有你们一份功劳呀。"

  最后半句，她是对着整间会议室说的。声音恰好提高了那半个音阶，确保在场的每一个人都听见"委员长"正在"体面地"分配工作。

  雪乃没有立刻回答。
  她在心里将相模南的话拆解了一遍。核心诉求：把积压的文书工作整体转移给奉仕部。话术包装：以"统筹全局"为由，将文书贬低为"细碎"的次要事务，同时用"功劳"作为廉价的情感补偿。

  很粗糙。但有效。至少在场那几个女生已经点头附和了。

  "辅助处理积压事务。"
  雪乃重复了一遍昨天在活动室里确立的定义，声音没有任何起伏，"仅此而已。相模同学作为委员长，统筹和决策仍由你负责。奉仕部不代替你做判断。"

  她没有等相模南回应，径直走向会议室侧面那张被空文件夹和矿泉水瓶占据的长条桌。

  "比企谷同学，清场。由比滨同学，去确认各班提交的企划书是否到齐。都柏林同学，过来。"

  长条桌在八幡面无表情地把三个空水瓶和一摞废弃传单挪走之后，终于露出了它可以作为工作台的本质。

  雪乃将相模南塞过来的那沓文件在桌面上墩齐，指尖飞快地掠过最上面几张的标题。班级摊位申请表、器材借用清单、预算审批单——三种完全不同类别的表格被随意混在一起，连编号都没有标注。

  "分类标准按编号前缀。"雪乃的声音压得很低，只有身旁的人能听见，"B是摊位，E是器材，F是预算。先按字母归三堆，再按数字排。"

  "知道了。"

  拉芙希妮的声音同样低。
  她在雪乃左侧坐下，桌面下两人的距离不到一肘。右手从那一沓混乱的文件中抽取第一张时，她的左手自然而然地搭在了桌沿上，而不是去触碰右手腕的丝带。

  这是雪乃在两天前就为她圈出的后方。
  文件、编号、分类规则——这些是可以被逻辑掌控的东西，不需要读取任何人的表情，不需要在虚伪的社交信号里辨别真伪。只要按照雪乃给出的规则处理，就不会出错。

  拉芙希妮的手指翻动纸张的速度比在活动室里修改材木座小说时更快。B-07，摊位申请，归左。E-03，器材借用，归右。F-12，预算审批，中间。

  雪乃在旁边同步处理着另一沓。两人的手偶尔会在桌面中央的文件堆上方交错，却从不碰撞。雪乃抽走预算单的瞬间，拉芙希妮的手已经伸向了下一张摊位表。没有多余的确认，没有不必要的停顿。

  那种在修改材木座小说时已经磨合出来的无声节奏，在此刻被更密集的工作量压缩成了一种近乎本能的配合。

  会议室前方，相模南的声音仍在断断续续地飘来。她在跟另外两个女生讨论舞台表演的时间安排，语气里夹杂着对某个班级"不配合"的抱怨。那种拔高了半个音阶的、充满表演质感的语调，像一只被关在玻璃窗外的苍蝇，嗡嗡地撞着却渗透不进来。

  拉芙希妮翻过一张表格，发现上面有人用粉色荧光笔在空白处画了一只猫。
  她没有表情变化，只是将那张表格无声地放到正确的类别堆里，继续下一张。

  雪乃的余光捕捉到了这个细节。
  她什么也没说。只是在自己那沓文件中发现了一张被咖啡渍浸透边角的器材清单时，同样面无表情地把它抽出来，放在桌角单独留作"需要重新提交"的一类。

  两个人都没有抬头。但在这张被清理出来的长条桌上，某种属于她们的秩序正在安静地生长。

  前方的会议室里，八幡靠在墙边，双手插在口袋里，用那种只有他自己觉得舒适的反社会姿态观察着来往的人群。结衣抱着一份班级名单，正努力在两个争执器材借用顺序的男生之间打圆场，她马尾辫上的发圈随着她频繁的点头动作一晃一晃的。

  相模南从人群间隙里回头瞥了一眼侧面长条桌。
  雪之下和那个转学生正埋头处理文件，速度快得惊人，原本堆成小山的混乱纸张正在被迅速消化。她松了口气，转回头继续自己的"统筹全局"。

  她没有注意到，雪之下雪乃在分类到第三十七张表格时，曾经短暂地抬眼扫过她的背影一眼。
  那个眼神里没有愤怒，没有轻蔑，只有一种冷静到近乎外科手术式的评估。
