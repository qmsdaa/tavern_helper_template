场景: 52
幕: "第三幕·二学期"
时间: "2013年12月上旬 · 一色当选后 · 选举日当日放学后"
地点: "体育馆后方连接走廊 → 特别栋活动室（奉仕部部室）"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、一色彩羽、平冢静"
正文: |
  城廻巡的致辞结束后，体育馆内响起了代表大会解散的提示音。原本规整的方阵瞬间被打散，学生们像退潮时的水流一样，混杂着抱怨和闲聊，朝着几个出口涌动。

  比企谷八幡直起身子，双手插在校服裤兜里，沿着人流较少的墙边向外走。拉芙希妮和由比滨结衣走在他的身侧。

  还没等他们踏出体育馆后方的连接走廊，一道娇小的身影就从侧面的侧门里蹿了出来，伴随着有些急促的呼吸声，精准地横在了他们前进的道路上。

  "哎呀——这不是比企谷前辈吗？"

  一色彩羽穿着那身改短过裙摆的西装校服，脸上绽放着灿烂的笑容。但从她喉咙里挤出来的声音，却冷得几乎能在空气中凝出冰霜。

  "多、亏、了、前、辈、的、帮、忙……我现在可是，完完全全当选了呢。"

  由比滨结衣被这带着明显寒意的笑容吓得往后退了半步，不自觉地捏紧了书包的肩带。

  拉芙希妮则停下了脚步。她依然保持着右手半插在口袋里的姿态，安静地看着眼前这个卸下了"天然可爱"伪装、露出尖牙的学妹。

  "你那是什么吃人的表情……"八幡错开视线，盯着走廊另一侧的防火箱，用一种缺乏干劲的语调推卸着责任，"我只是提供了一个方向有些极端的草稿。决定站在台上把那些话念出来的，毕竟是你自己吧。"

  "前——辈——"

  一色的笑容在嘴角微微抽动了一下。她上前一步，缩小了与八幡的距离，压低的声音里透着咬牙切齿的不甘。

  "你还好意思说？什么'不切实际的耀眼目标'，什么'没人会追究可行性'……结果根本就是在配合大人们的意图，把我的退路全封死了吧！你这算什么帮忙，根本就是诈骗！"

  八幡看着她那副明明气得想骂人、却还要因为走廊里不时经过的学生而强行维持笑容的憋屈模样，反而感到了一种微妙的平衡感。这种直接找上门来发泄算账的举动，证明她至少接受了这个结果，没有跑去向校方哭诉。

  就在一色准备继续用指责和撒娇混合的语言逼迫八幡时，站在后方的拉芙希妮平缓地开了口。

  "一色同学。"

  她的声音不大，但那种带着英式矜持的克制语调，清晰地穿透了一色用愤怒垒起的声浪。

  拉芙希妮微微欠身，脸上露出了一个毫无破绽的、完全属于局外人的礼貌笑容。

  "恭喜你以绝对优势当选本届学生会长。那份在全校面前许下的沉甸甸的期待与责任……以后就拜托你好好承担了。"

  一色猛地转过头，盯着拉芙希妮。

  那句准备吐出来的抱怨硬生生地卡在了她的嗓子里。这种将她自己亲手垒起的"华丽高墙"当做反弹盾牌、甚至连嘲讽的把柄都不留给她的"礼貌祝贺"，让她瞬间体会到了那种一拳打在棉花上的窒息感。

  一色盯着拉芙希妮。过了几秒钟，她猛地深吸了一口气。

  那一口气像是抽干了周围空气里的冰冷。紧接着，她硬生生地将那些快要溢出来的愤怒压了下去，重新在脸上扯出一个灿烂得有些紧绷的笑容。

  "前——辈。"她转过头，不再看拉芙希妮，而是重新将矛头对准了八幡，"你以为这样就能把我打发了吗？我现在可是学生会长哦？以后……我可是有很多机会'关照'你们这个边缘社团的。"

  她试图用这种带有威胁意味的撒娇来强行找回一点主动权，但手指还是不自觉地绞住了书包肩带。

  由比滨结衣有些不安地看了一眼八幡。

  八幡看着她这副死撑的样子，不仅没有慌乱，反而微微放松了肩膀。

  "是吗。"八幡错开视线，用那种缺乏干劲的语气陈述道，"不过，比起把精力浪费在我们这种毫无价值的社团上，你难道不觉得，有一个更值得你去'关照'的地方吗？"

  一色愣了一下，那种强装出来的可爱笑容瞬间僵在了脸上。

  "比如……足球部。"八幡毫不留情地切开了她最后的一层遮羞布。

  走廊里的喧闹声似乎在这一刻变远了。

  "比起一个连社团活动都不怎么参加的一年级经理，现在，你可是拥有实权的'学生会长'了。"八幡用平缓却致命的语气继续说道，"不管是以视察社团预算的名义，还是以组织学生活动的名义……你现在，拥有了随时随地靠近那个'核心'的正当理由。"

  由比滨结衣微微张着嘴，似乎刚刚反应过来这句话背后所指向的人。拉芙希妮依然保持着右手半插在口袋里的姿态，安静地看着眼前这场博弈。

  一色当然清楚那个"核心"是指谁。叶山隼人。

  八幡虽然用算计把她强行推上了这个位置，却也顺手把接近那个人的正当理由塞进了她的手里。

  "可恶……"

  一色咬着下唇，那种虚假的营业笑容彻底垮塌了。她不再维持任何形象，恶狠狠地瞪了八幡一眼。

  "前辈，你这人……性格真的烂透了！"

  她连一句多余的辩解都没有留下。因为她很清楚，八幡把那些见不得光的心思全部分析透了。她转过身，踩着制服皮鞋在走廊的地板上发出重重的声响，气急败坏却又不得不去接手那个烂摊子。

  看着那个娇小的背影消失在通往主楼的楼梯拐角，八幡收回了视线，抓了抓后脑勺。

  "走吧。"他像是什么都没发生过一样，对着身旁的两人说道，"回活动室去吧。这里太吵了。"

  推开特别栋那扇熟悉的拉门时，金属滑轨发出了有些干涩的摩擦声。

  房间里的空气比走廊要暖和一些，但也混入了一丝淡淡的烟草味。平冢静正坐在靠墙的一把空椅子上，身上那件标志性的白大褂随意地敞着。听到门响，她将视线从窗外收了回来。

  "动作还挺慢的。"平冢静随口丢出一句开场白，并没有因为教师的身份而端什么架子，"广播里那个充满活力的胜选宣告，我可是十多分钟前就听到了。"

  八幡拉开长桌对侧的椅子，用一种消耗了极大部分体力的姿态坐了下去。

  "只是在走廊上处理了一点必要的售后服务。"他声音里透着干瘪的倦意，"既然最麻烦的头衔已经有人接手了，您那边的压力应该也算解决了吧。"

  平冢静站起身，走到八幡的座位旁。她习惯性地握起拳头，但这一次并没有像往常那样挥出"铁拳制裁"，而是张开手掌，不轻不重地拍了两下他的肩膀。

  "虽然手法依然恶劣，抛出的方案也充满了令人不快的阴暗算计……"平冢静略微收起了平时的豪爽，语气里多了一份身为导师的认真，"但至少，你这次没有再用那种把自己扔进火里当柴烧的蠢办法。算你稍微长进了点。"

  被直接戳中心思的八幡不自在地别开视线，盯着桌面的划痕，没有接话。

  由比滨结衣见状，小声地舒了一口气，随后快步走到长桌靠窗的一侧，准备去开热水壶的开关。拉芙希妮也走到了自己的位置前，安静地拉开椅子。

  在这个过程中，坐在长桌靠近热水壶一端的雪之下雪乃，已经翻开了那本专业的黑色笔记本。

  她并没有去看八幡，也没有对平冢静的评价发表任何意见。她只是拔出水笔的笔帽，将笔尖对准了纸页空白的下一行。

  "关于一年级生一色彩羽最初提出的'落选'委托。"

  雪乃的声音在活动室里响起，带着一种不掺杂任何个人情绪的公事公办。

  "鉴于其本人已在全校面前完成了竞选演讲，并依据正规程序获得了多数选票从而当选。虽然过程受到了不规则因素的引导和干预，但最终决定站在台上念出那份纲领、以及被迫接受这一当选结果的选择，均由其本人亲自做出。"

  水笔在纸页上发出轻微且连续的沙沙声。

  "没有越权，也没有代替委托人做出决定。因此，在没有偏离奉仕部基本原则的前提下，该项委托可视为强制达成目标。"

  笔尖在最后一句话的末尾重重地点了一下，随后划出一条利落的横线。

  "就此归档。"

  那条利落的横线划下后，活动室里出现了短暂的安静。只有角落里热水壶加热的声音在持续发出低沉的嗡鸣。

  雪之下雪乃将水笔的笔帽盖回原处，发出一声轻响。但她并没有像往常归档结束时那样，直接将那本专业的黑色笔记本合上收起。

  她稍微抬起手腕，指尖轻触着皮革封面的边缘，将那本摊开的笔记本沿着长桌的桌面，平稳地推向了坐在她身旁的拉芙希妮。

  雪乃的声音依然保持着那种清冷的公事公办，视线没有直接对上拉芙希妮的眼睛，而是停留在刚写好的那几行字迹上。

  "这是本次委托的几处关键总结，请务必好好参考。"

  拉芙希妮显然对这个突如其来的动作感到了一丝意外。她的视线在桌面上那本本子和雪乃的侧脸之间游移了片刻。她很清楚这本笔记本对雪乃的日常运转意味着什么，那是由缜密的逻辑和客观记录构成的秩序防线。

  短暂的停顿后，拉芙希妮伸出左手，将那本笔记本拉近了半寸。

  "如果不麻烦的话。"她用平时那种礼貌而克制的语气回应道，"我会仔细阅读的。"

  一直站在八幡椅子背后的平冢静，将这一幕完整地收进了眼底。她将插在白大褂口袋里的手稍微动了动，目光在那本被推过去的笔记本上停留了一秒。

  "既然这里的文件都已经归档完了，我也没必要继续待在这个到处是灰尘的闲置教室里了。"

  平冢静转过身，迈着爽利的步子朝着活动室的拉门走去。

  "剩下的时间，你们就自己在这耗着吧。"她走到门边，拉开门把手时，回头看向了正在热水壶旁忙活的结衣，"对了，由比滨。下周的国语随堂测验，别以为装傻就能糊弄过去。"

  由比滨结衣本来正小心翼翼地往杯子里倒水，听到自己被点名，手不自觉地抖了一下，茶壶的嘴磕在杯沿上，发出一声轻响。

  "啊……是！我会努力的，静老师！"

  随着拉门重新合上，走廊里的脚步声渐渐远去。结衣有些后怕地拍了拍胸口，随后端起托盘，将泡好的红茶依次放在了长桌上，打破了刚才那种微妙而正式的氛围。

  八幡依然维持着瘫坐在椅子上的姿势，看着面前冒着热气的茶杯，发出了一声微不可闻的叹息。
