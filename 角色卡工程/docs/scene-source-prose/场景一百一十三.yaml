场景: 113
幕: "第七幕·重新为奉仕部命名"
时间: "2014年5月28日 · 周三放学后"
地点: "总武高特别栋奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、比企谷小町、川崎大志、材木座义辉、游戏部部员两名"
POV: "共享场景／零POV"
正文: |
  "——就是这样！吾之盟友啊，在这个名为青春的战场上，男主角现在必须做出最终的抉择！"

  两叠用粗糙黑尾夹装订起来的A4打印纸被重重地拍在了长桌中央。材木座义辉那件永远穿不整齐的校服外套在空中划过一个夸张的弧度，指尖用力戳在上面两页纸的标题上。

  旁边两个穿着游戏部制服、戴着厚底眼镜的男生整齐划一地连连点头，其中一个抓着PSP掌机补充说明："原稿的容量太大了，如果是做成AVG游戏，只能在这两个结局分支里选一个作为True End。到底是选A还是选B，现在社团内部已经吵翻天了！"

  "A选项，"材木座双手叉腰，语气悲壮得像是在朗诵某篇史诗，"'留下'——放弃远征魔王军的荣耀，留在已经失去一切力量的精灵女主角身边，在平凡的村落里度过余生！"

  "至于B选项……"材木座故意拉长了音调，镜片反过一道白光，"'离开'！为了保护这个世界，也为了不让女主角承受被牵连的痛苦，斩断所有的羁绊，独自踏上没有归途的雪原！"

  五月末的初夏微风从半开的窗户里灌进来，带着操场上足球部训练时的隐约哨声。活动室里安静了两秒。

  拉芙希妮坐在靠窗第二把椅子的位置上。风吹起她耳边那缕浅金色的发丝，但她没有像往常那样抬手去挽。她的视线越过长桌，毫无阻碍地落在那两叠稿纸上。准确地说，是落在那加粗放大的"离开"两个字上。

  左手拇指几乎是条件反射般地蜷缩进了掌心，指肚死死地抵在了右手腕的内侧。那根焦黑旧丝带的粗糙纹理终于传来了一点微弱的刺痛感。她盯着桌面，呼吸的节奏被她硬生生切成了细碎而均匀的短节拍，强迫自己不露出一毫的情绪破绽。

  "欸——真的好难选啊！"由比滨结衣双手托着脸颊，视线在两份稿纸之间来回游移，"虽然留下来很感人，但是如果离开真的是为了保护她的话……呜，小企你觉得呢？"

  "不要把这种强行制造悲剧滤镜的二流设定塞给我。"比企谷八幡坐在对面，甚至连眼睛都懒得从文库本上挪开，"不管选哪个都只是自我满足而已。以为'只要自己消失就能解决问题'，这种自以为是的温柔才是最让人火大的。"

  正在靠墙的文件柜前整理旧档案的川崎大志闻言，动作顿了一下。他转过头，有些拘谨地看了一眼活动室里那几位升入了三年级的前辈们。

  "大志，这边这叠去年学生会的决算报表也要分类哦。"比企谷小町笑眯眯地把一摞文件递了过去，随即转过头，用看透一切的眼神对着八幡感叹，"刚才那句话，小町分数要给负一百分！哥哥居然好意思说别人'以为自己消失就能解决问题'，这种毫无说服力的台词简直让人不忍直视。"

  "吵死了，快干你的活。作为正式部门的新进免费劳动力，给我有点自觉。"

  长桌尽头传来了一声清脆的陶瓷与杯垫的碰撞声。

  雪乃放下了手里的红茶杯。

  在这之前，她一直维持着那种生人勿近的冷漠姿态在翻看着手里的文库本。

  她走到长桌中央，直接越过了还在等着听取"盟友"意见的材木座，拿起旁边一叠夹在蓝色硬抄文件夹里、盖着教务处和学生会红色确认章的单据。

  那是高坂理津子老师昨天刚送来的、关于奉仕部作为正式部门的年度部员名册与活动预算确认单。

  "啪。"

  那份沉甸甸的名册被毫无迟疑地盖在了右边那份写着"离开"的稿纸上，将那两个刺眼的字体彻底遮蔽进了阴影里。

  "首先，如果这只是一场虚假的羁绊，那么从一开始就不存在所谓的'离开是为了保护'这种逻辑怪圈；其次，在真正具有契约意义的同伴关系里，无论是单方面的强迫逗留，还是擅自做主的消失，都只是掩饰自己不足的劣劣手段。"

  她双手按在桌沿上，身体微微前倾，极具压迫感地看着材木座。

  "把必须两个人共同承担的重量，单方面冠以拯救的名义剥离出去。这种完全剥夺了女主角选择权的自我牺牲，除了能骗取几滴廉价的眼泪，对现实问题的解决毫无帮助。"

  材木座被这连珠炮般的批评轰得倒退了一步，原本理直气壮的姿态瞬间垮塌了一半，发出一声类似喉咙被卡住的"嘎啊"的怪叫："雪、雪之下殿下，但这是轻小说的王道展开……"

  "如果所谓的王道就是用逃避来粉饰太平，那我建议你立刻把这份原稿扔进特别栋一楼的垃圾桶里。比起在这里做些无病呻吟的文字游戏，你不如先去把那份因为错字连篇而被高坂老师退回来的请假条重写一遍。"

  拉芙希妮维持着那个用拇指抵住手腕的姿势，但掌心里的冷汗却开始慢慢停止了渗出。

  她的视线落在那份盖在原稿上的预算名册上。最上面一页的名单里，用黑色水笔清晰地写着每一个人的名字。而在"部员"那一栏里，第四个名字赫然写着：拉芙希妮·都柏林。

  那些因为"离开"两个字而翻涌起来的东西，在这份名册的重量下被硬生生地压了回去。

  "……小雪乃说得好过分，但是好像很有道理欸。"由比滨结衣缩了缩脖子，小声嘀咕着。

  "总之就是两边写得都很烂的意思吧。"比企谷八幡打了个哈欠，"趁早放弃重写，或者直接让男主角被魔王打死，这样就不用选了。"

  "不要放弃啊！游戏部还需要这个剧本来立项啊！"两个戴眼镜的男生发出了哀嚎。

  长桌这边的空气重新恢复了那种带着一点疲惫和吵闹的日常氛围。

  雪乃重新走回自己的位置。她端起茶杯，在送向唇边之前，余光却落在了旁边。

  "谢谢。"

  只有两个音节，微弱，像是在牙关里咬碎了才漏出来的。拉芙希妮没有转头，依然盯着那份部员名册，但刚才那种紧绷到快要断裂的肌肉线条已经渐渐松弛了下来，抵在手腕上的拇指也放回了膝盖上。

  "我只是在陈述客观事实。"雪乃用同样只有两人能听见的音量低声回应，语气里没有任何波澜，"作为预算审批单上列明了必须执行社团义务的正式部员，在你达到现代文A级标准之前，不存在任何超脱于部规之外的选项。"

  她喝了一口红茶，又补了一句。

  "而且，手腕上的缎带，歪了。"

  拉芙希妮眨了眨眼睛，随后，非常清淡的、沾着一点苹果糖甜味的弧度，终于回到了她的嘴角。

  圆珠笔的笔尖压在粗糙的打印纸背面上，发出一阵连续而低沉的沙沙声。

  浅金色的发丝顺着肩膀滑落，左手腕上那条红绸带被重新理平，服帖地贴在袖口边缘，不再有歪斜的痕迹。拉芙希妮低垂着眼眸，手腕随着字迹的延伸平稳地移动着。

  就在五分钟前，当雪乃那句关于"现代文标准"和"手腕缎带"的评价落下时，拉芙希妮先是抬起手，缓慢地把那条绸带重新系紧，然后伸出了手。

  "既然部长大人对现代文的考核标准这么严格。"她看着桌上那叠被名册压住的稿纸，声音里已经找不出刚才的僵硬，"那这个小说的结尾，我自己试着改写一下可以吗？刚好，就当是检验一下寒假和最近这段时间的训练成果。"

  被雪乃驳斥得缩在一旁的材木座还没反应过来，几张被抽出来的稿纸就已经翻了个面，平铺在了拉芙希妮面前的空位上。

  活动室里因为这突如其来的书写动作陷入了奇妙的安静。

  原本还在抱怨剧本难选的两个游戏部男生面面相觑，自动闭上了嘴。结衣小心翼翼地把刚撕开包装的苹果糖放回纸袋里，生怕弄出一点塑料摩擦的噪音。八幡合上了手里的文库本，视线停在长桌中央。

  大志在文件柜前屏住呼吸，小町则用手背托着下巴，目光在专注书写的拉芙希妮和正在喝茶的雪乃之间来回转悠。

  整整十分钟。

  初夏的阳光被窗框切割成倾斜的方块，从长桌的边缘一点点往中间爬，刚好照亮了半个茶杯的瓷面。

  随着圆珠笔被轻轻套上笔帽的喀哒声，那张写满了清秀日文字体的A4纸被一根食指推着，滑过了木质桌面，停在了距离雪乃的茶杯只有几厘米的地方，刚好也在材木座的视线范围内。

  "与其在'逃避'和'施舍'里选一个。"拉芙希妮收回手，手腕交叠放在膝盖上，"不如试着写一条根本不存在选项的路。"

  八幡越过桌子，微微探出上半身。材木座更是直接凑了过去，厚底眼镜几乎要贴在纸面上。

  纸上的字迹没有涂改。

  "主角踩灭了雪原上的篝火，转过身，将那把生锈的长剑扔回了满是灰烬的炉膛。
  '我不会走，我也不会代替你背负那些诅咒。'他看着那个失去力量的精灵，声音比外面的风雪更冷，'既然深渊是从这里开始的，那你就必须站在这里，看着它结束。不要妄想把你那份逃避的罪恶感塞给我，哪怕是死，那份重量也得由你亲自扛一半。'"

  材木座的嘴巴张成了一个圆洞，眼镜顺着鼻梁往下滑了半寸。

  "这、这这这！"他猛地直起身，校服外套剧烈地晃动了一下，"没有自我牺牲的悲壮，也没有隐居田园的柔情……这种几乎在逼迫女主角一起面对深渊的残酷做法……"

  "没有放弃，但也不允许对方放弃。"八幡重新瘫回椅子上，死鱼眼里多了一点平时没有的光泽，"把责任均摊，连软弱的退路都给彻底堵死。真是个毫不讲理的恶劣结尾，连最后一点煽情的余地都没了。"

  结衣眨了眨琥珀色的眼睛，虽然没太听懂那种复杂的逻辑，但还是松了一口气："感觉……这样的话，两个人就谁也不会丢下谁了吧？"

  雪乃没有说话。

  她盯着纸上的那两段话。深蓝色的瞳孔里，倒映着那句"那份重量也得由你亲自扛一半"。

  材木座终于从震惊中恢复过来，开始手忙脚乱地收拾桌上散落的两叠原稿。

  "等、等一下！虽然被批得体无完肤，但这些可都是吾辈的心血——"

  雪乃伸出手，从那叠写着"离开"的稿纸中抽出了最上面的几页。

  "这几页留下。"

  "欸？"

  "废稿存档。"她把那几页纸对齐，放进了名册旁边的蓝色硬抄文件夹里，"被放弃的可能性也是记录。"

  材木座张了张嘴，最终没敢抗议，抱紧了剩下的稿纸。

  雪乃端起已经有些微凉的红茶，浅浅地抿了一口。

  她的手指在那张改写纸的边缘轻轻敲了一下。

  "这个结局，以你之前那种只能拿B级的词汇量来说，算是勉强达到及格线了。"

  拉芙希妮看着那根落在纸页边缘的、白皙的食指，嘴角那种沾着苹果糖甜味的弧度稍微扩大了一些。

  "只到及格线吗？"她的声音很轻，却在一屋子的喧闹里显得格外清晰，"看来，接下来的训练，又要麻烦部长大人多费心了。"
