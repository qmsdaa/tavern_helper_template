场景: 62
幕: "第四幕·冬假→三学期"
时间: "2013年12月25日 · 圣诞节 · 傍晚 · 场景 61 之后 · 拉芙回到公寓"
地点: "拉芙希妮的公寓"
人物: "拉芙希妮·都柏林、家政太太"
正文: |
  指纹锁发出一声轻柔的电子提示音。

  拉芙希妮握住金属门把手向下压去。今天的社团活动出人意料的顺利，那些属于普通高中生的喧闹与笨拙的温情，让她在回程的路上连脚步都比平时轻快了几分。

  然而，当厚重的防盗门被推开，室内微凉的空气夹杂着某种不属于这里的气息扑面而来时，拉芙希妮嘴角的弧度瞬间僵住了。

  玄关的灯光被调得冷硬而锐利。原本铺着浅色地毯的走廊，此刻被换上了深绿色的羊毛长植绒，上面织着繁复且古老的凯尔特结纹样。墙壁上那些原本带着现代简约风格的装饰画消失了，取而代之的是几幅装裱在沉重黄铜画框里的高地风景油画。甚至连空气中都弥漫着一股淡淡的、被萃取过的琥珀松香的味道。

  这种冷峻、正式且带有绝对等级感的装潢风格，瞬间将拉芙希妮从千叶市的喧嚣中强行剥离，粗暴地将她拖回了英国肯辛顿区那座都柏林家族庄园里。

  拉芙希妮的呼吸出现了微不可察的停滞。那是她多年来在家族训练中培养出的本能——先观察，再判断，后行动。翡翠色的目光扫过这些"不合规"的改变，搭在大衣口袋里的手指不自觉地攥紧了一下。

  "欢迎回来，二小姐。"

  从客厅的阴影处走出来的，是那位每周定期来打扫卫生的家政太太。她今天换上了一套带有明显维多利亚时代特征的深色制服，双手交叠在身前，微微低着头，语气恭敬得没有任何起伏。

  "这里的布置……"拉芙希妮的声音很轻，却带着一丝不容忽视的紧绷。

  "这是大小姐越洋发送的指令。包括香薰和地毯的材质，都严格按照圣诞节的标准进行了更替。"家政太太依然低着头，没有去探究拉芙希妮眼底那闪过的一丝抵触，只是尽职尽责地完成了传声筒的任务，"另外，大小姐吩咐，今晚八点，她可能会亲自与您通一次视频电话。请您提前做好准备。"

  拉芙希妮的呼吸轻轻顿了一下。喉咙里像是堵住了什么，她咽了一口，没有咽下去。

  爱布拉娜。

  拉芙希妮的视线落回墙上那幅新挂的高地风景油画上。画框的黄铜边角在灯光下反射出一点冷光。她看着那点光，没有移开。

  "我知道了。"

  短短半秒钟的迟疑后，拉芙希妮已经迅速调整好了状态。她脸上的错愕与排斥被尽数收敛，取而代之的是那种在酒店接受温斯顿先生评估时才会展露的、不露破绽的得体微笑。

  家政太太没有再多说什么，微微欠身后便走向了玄关。

  拉芙希妮侧过身，站在门边。她把手背在身后，指尖轻轻压住袖口边缘，视线送家政太太到门口，看着她换好鞋子，打开门，走进了电梯间。

  "咔哒。"

  防盗门重新合上的声音在死寂的公寓里显得格外突兀。拉芙希妮独自站在玄关处，手指轻轻搭在右手腕那条烧焦的旧丝带上。

  琥珀松香的味道从鼻腔滑到喉咙，带着一种陈旧而干燥的苦味。

  拉芙希妮没有换上室内的拖鞋，她就这么穿着来时的制服鞋，放轻脚步穿过那条陌生的走廊，走进了盥洗室。

  水槽上方的冷色调壁灯亮着。她站在宽大的半身镜前，看着镜子里那个穿着深色呢子大衣、肤色苍白、浅金长发因为静电而微微贴在脸颊上的少女。这副模样，和那些挂在走廊里的高地风景油画一样，像是被框住的东西。

  右手的指尖无意识地穿过大衣的衣摆，探入了贴近身体的长裤口袋。

  在那个温热的狭小空间里，她的手指触碰到了一个坚硬、带有弧度、甚至边缘还有些微塑料毛刺的微小物件。那是今天下午在稻毛海岸站前，由比滨结衣不由分说塞给她的东西。

  拉芙希妮的手指在那里停留了几秒，指腹在塑料毛刺上轻轻蹭过，然后才将发卡拿了出来。

  一枚廉价的、带着明显工业量产痕迹的粉色塑料发卡，静静地躺在她白皙的掌心里。

  在盥洗室锐利的冷光照射下，这枚发卡散发着一种有些俗气的反光。它与这间公寓里刚刚被更换的昂贵地毯、与她从小接受的严苛审美教育、甚至与她身上这件冷色调的大衣，都格格不入。

  如果爱布拉娜在这里，大概连看都不会看这种毫无价值的工业废料一眼，甚至会用最温柔的语气责问她，为什么要将这种有损家族体面的东西带在身上。

  她抬起手，动作很轻，甚至带着一丝平时少有的迟疑，将那枚粉色发卡别在了右侧耳畔的浅金长发上。

  镜子里的画面瞬间发生了一点奇妙的偏移。那一点显眼的、甚至有些破坏画面平衡的粉色，硬生生地在这片冷峻的、充满阶级感的灰绿色调中撕开了一道不讲理的豁口。

  看着镜子里的那一点粉色，拉芙希妮的呼吸慢慢变得平稳下来。下午在长椅上被塞进这枚发卡时，结衣那有些冒失却毫无保留的笑脸在脑海中浮现。随之而来的，是更早些时候，在那间充斥着旧纸张气味的活动室里，那罐因为太甜而有些烫手的红茶，以及某个人明明耳尖发红却还要强装镇定喝下红豆汤的局促侧脸。

  这些都不属于都柏林家族。这些是她自己找到的，是只属于"拉芙希妮"这个名字的温度。
