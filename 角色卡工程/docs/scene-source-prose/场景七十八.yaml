场景: 78
幕: "第五幕·PTA→舞会"
时间: "2014年2月21日 · 周五 · 三学期"
地点: "总武高中 · 特别栋 · 奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、平冢静（+ 提及：一色彩羽、雪之下母）"
正文: |
  雪乃很清楚这种氛围的转换意味着什么。每次当这位国语老师收起那种像大叔一样抱怨单身或是乱开无聊玩笑的做派时，随之而来的，必然是某些连大人都觉得棘手的烂摊子。

  "既然你们关于代可可脂的实验已经得出了初步结论，"平冢静的视线越过长桌，声音平静下来，"那么，接下来就该处理一下现实世界里的麻烦了。"

  八幡的死鱼眼翻了一下，他原本偏向窗外的脖子僵住了，只能用缓慢的速度转回来。由比滨结衣死死攥着碎花布包的手指微微松开了一点，但肩膀依然缩着。

  雪乃没有动。她将压在进路调查表边缘的左手食指微微收紧，抵住了纸张的边角。

  "麻烦是指？"雪乃问。

  "家长教师协会，也就是所谓的PTA。"平冢静吐出这个缩写时，语气里带着明显的疲惫，"关于即将到来的三年级毕业典礼，以及伴随而来的某些'传统'送别活动。校方原本的企划案，在昨天下午的审核会议上，被PTA那边以'形式过于老旧，缺乏体现总武高精英气质的创新性'为由，几乎全盘否决了。"

  那个名词出来的瞬间，雪乃的胃部微微收缩了一下。

  PTA。

  在总武高，这个组织的大部分干事或许只是走个过场，但其中掌握着话语权、能够在审核会议上轻易否决校方方案的存在，雪乃连想都不用想就能拼凑出那张脸。

  那张与她相似，却带着压倒性威严的面孔。

  "这是学生会和校方行政层面的工作交涉。"雪乃的声音冷硬，语速比平时快了半拍，"奉仕部没有介入这种层级博弈的立场。我们只接受学生的个人委托，提供必要的帮助，而不是代替某些无能的大人去完成他们应尽的职责。"

  平冢静的眉毛微微挑起，她看着雪乃那挺得笔直的脊背。

  "理论上是这样没错。"平冢静并没有因为这种直接的反驳而生气，她反而放松了身体，向后靠在木质椅背上，"但是，昨天那场会议，一色彩羽也在场。作为现任学生会长，她当场夸下海口，说学生会已经有了一套完美的备用方案，只是还在完善细节。"

  "那个笨蛋。"八幡终于忍不住从喉咙深处挤出了一句干瘪的咒骂。

  "她不是笨蛋，她是太清楚你们的底线在哪里了。"平冢静纠正道，目光在八幡和雪乃之间扫过，"她把自己和整个学生会的信誉推到了悬崖边上，然后把退路和唯一的绳索，绑在了这间活动室的门把手上。如果交不出一份让PTA满意的方案，那个小恶魔学妹的会长生涯，恐怕在开春前就要提前结业了。"

  雪乃的呼吸变得迟滞。

  这种被强行裹挟的被动感，比纯粹的行政摊派更让人火大。一色彩羽用自毁的方式进行要挟，而站在悬崖对岸负责审查的，是她的母亲。

  这已经不是一个简单的活动企划了，这是一场针对她是否"足够成熟"的变相考核，而场地被硬生生地搬到了总武高的舞台上。

  "这就是所谓的'麻烦'吗。"坐在雪乃身旁的拉芙希妮突然开口了。

  她的声音很轻，带有干燥的质感，像是在陈述与己无关的事实。

  平冢静的视线循着声音移向了拉芙希妮。在目光交汇的瞬间，雪乃注意到，平冢静的视线并没有停留在拉芙希妮的脸上，而是向下偏移了十几厘米。

  那里是拉芙希妮搭在膝盖上的左手，袖口边缘，那条暗红色的绸带正安静地缠绕着。

  平冢静的眼神里有某种克制——知情者与旁观者混合在一起。雪乃的脊背绷紧了。

  在这间教室里，还藏着另一条她无法触及的暗线。

  "是的，都柏林同学。"平冢静收回了视线，"大人们总是喜欢用一些冠冕堂皇的理由，把那些原本应该由自己承担的重压，用'试炼'或者'期待'的名义包装起来，然后扔给更年轻的人。"

  平冢静说这句话时，语速放得很慢。每一个词都像是有着特定的指向。

  拉芙希妮的眼睫毛轻微地颤动了一下。雪乃看到她放在膝盖上的手指有那么一瞬间的收紧，指节泛出苍白的颜色。

  这种被高高在上的权威用宏大叙事进行施压的模式，对于拉芙希妮来说，太过于熟悉了。那是属于爱布拉娜的统治方式。

  雪乃的心脏猛地跳动了一下。她突然觉得，如果刚才这只是一场针对她的麻烦，那现在，这种麻烦的辐射范围已经触及了旁人的边界。

  "我们拒绝。"

  雪乃的声音在教室里响起，清脆得像是冰块碎裂。

  由比滨结衣惊讶地转过头。八幡原本挠着头发的手也停在了半空。

  "我刚才说过了，"雪乃迎着平冢静的目光，没有丝毫退让，"奉仕部的原则是提供帮助，而不是代替完成。一色同学为了逃避当下的责任而捏造谎言，这是她个人信用的破产。奉仕部没有义务为她的虚荣心和短视买单。至于PTA那边的审核……"

  雪乃顿了顿，咬紧了后槽牙。

  "我不认为在这个阶段，一份由学生匆忙赶制、带有明显敷衍性质的备用方案，能够满足那些对'完美'有着偏执追求的审查者。这只会让事态变得更加"

  她的语速很快，逻辑严密，像是在防守，又像是在进攻。

  平冢静静静地听完，没有打断她。等雪乃说完后，这位国语老师才慢慢地从白大褂的口袋里摸出一个没有任何标记的牛皮纸信封，推到了桌面的中央。

  "这并不是一份正式的委托，雪之下。"平冢静的手指离开了那个信封，"这是昨天的会议纪要，以及被否决的初版方案。我不需要你们去代替一色写出一份完美的备考卷，我只是把这些事实放在这里。"

  她停顿了一下，目光变得柔和，甚至带上了一点连她自己都没察觉到的依恋。

  "有些事情，如果一直选择绕开，那面墙就会变得越来越高。我不可能永远站在这里，看着你们在这间屋子里玩这种安全的游戏。"

  平冢静站起身，白大褂的下摆发出轻微的摩擦声。

  "信封留在这里。看不看，接不接，那是你们的自由。放学时间快到了，如果吃完了那些会影响神经系统的代可可脂，就早点回家吧。"
