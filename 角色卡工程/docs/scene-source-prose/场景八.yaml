场景: 8
幕: "第一幕·入部磨合"
时间: "2013年6月26日 傍晚（期末复习结束当日）"
地点: "奉仕部活动室 → 总武高校门 → 千叶站天桥"
人物: "雪之下雪乃、拉芙希妮·都柏林、比企谷八幡、由比滨结衣、户冢彩加"
正文: |
  初夏来临，给千叶潮湿的空气染上了一丝燥热，无声告诉众人：梅雨季节要来了。为期两周的期末复习地狱终于宣告结束。

  户冢彩加的进步出人意料。在雪乃严苛的计划表、结衣的陪伴，以及比企谷那种"绝对不能让彩加不及格"的死撑效应下，他已经完全不需要人陪同复习了。由比滨结衣的数学也奇迹般地摸到了及格线的边缘，这自然归功于雪乃不厌其烦的讲解，以及拉芙希妮偶尔提供的、更注重逻辑推演的辅助指导。

  至于比企谷八幡，这两周里他始终没有拿出过哪怕一张属于自己的复习计划表。雪乃在批改习题的间隙暗自注意到了这一点，但她什么也没说。她很清楚，他不是不需要复习，他只是习惯性地把自己的努力连同存在感一起隐藏起来。

  拉芙希妮的情况最为特殊。J班的期末考试科目与其他班级截然不同，她的复习基本上是独自进行的。然而，这两周里她没有一次早退，始终安静地坐在长桌的中间，直到活动室的门最后被锁上。

  "呼——终于结束啦！"结衣伸了个大大的懒腰，脸上的疲惫被兴奋取代，"为了庆祝大家都能顺利及格，我们出去吃点东西吧！"

  "我拒绝。"雪乃将最后一份资料塞进书包，头也不抬地回答。

  "我妹让我回家吃饭。"八幡也用他惯常的干瘪语气搪塞了过去。

  结衣的肩膀瞬间垮了下来，但她很快又振作起精神，将期待的目光转向正在收拾文具的浅金发少女。

  "那……拉芙希妮酱呢？"

  活动室里的空气似乎停滞了一瞬。雪乃停下手中的动作，用余光瞥向邻座。

  拉芙希妮的手指在文具盒的边缘停顿了半秒。

  如果她说"我可以一起"，那就会变成由比滨单独带她出去。在雪之下和比企谷都已经回绝的情况下，这种答应会打破这间活动室里好不容易维持的平衡。

  如果她说"我也回家吧"，那就保持了"每个人都独立存在"的假象。

  她垂下眼帘，右手习惯性地碰了一下左手腕。

  "……我也回家吧。"她的声音很轻，几乎要融化在老旧空调的嗡鸣声里。

  结衣的脸上闪过一秒的失落，但她立刻扬起招牌式的元气笑容："这样啊……那大家明天见啦！"

  拉芙希妮独自走出了总武高的校门。

  这是梅雨季前的最后一个傍晚，空气还没有完全潮湿下来，带着一丝干燥的闷热。她沿着熟悉的路线，走到了千叶站的天桥上。

  天桥上人来人往，步履匆匆。她停下脚步，双手扶着冰凉的金属栏杆，眺望着远处那片被城市建筑切割得支离破碎的灰色海面。

  她似乎想起了什么，从书包侧边的口袋里掏出了那部爱布拉娜送给她的手机。

  屏幕亮起，一条一小时前发来的短信静静地躺在未读列表里。发件人是爱布拉娜。

  "亲爱的拉芙希妮，期末考试是普通高中生的第一道考验。我相信你会保持家族的水准。
  顺便，塔拉庄园的蓝绣球开了。等你放假回来。"

  拉芙希妮看着屏幕上的字句，看了很久。那些优雅得体、甚至带着温情的词汇，像是一张无形的网，精准地卡在她的呼吸道上。

  她没有回复。屏幕的光慢慢暗了下去，直到彻底变成一片死寂的黑色。

  她把手机放回口袋，转过身，继续顺着天桥往前走。在天桥的另一端，一家便利店招牌的白光刚刚亮了起来，在渐暗的暮色中显得格外刺眼。
