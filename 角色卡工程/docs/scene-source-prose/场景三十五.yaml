场景: 35
幕: "第三幕·二学期"
时间: "2013年10月下旬 · 场景三十四的直接延续 · 文化祭开幕仪式期间"
地点: "主体育馆后台通廊 · 走廊通风口"
人物: "拉芙希妮·都柏林、比企谷八幡"
POV: "拉芙希妮"
正文: |
  随着高跟鞋踩踏地砖的声音在通道尽头彻底消失，那种由绝对零度构筑的压迫感才算完全散去。

  走廊里又一次只剩下了冷风的呼啸。

  比企谷八幡站在那片阴影里，维持着双手插兜的姿势，整个人像是一具刚被抽干了水分的标本。他没有去看几步之外的拉芙希妮，更没有去试图解释刚才到底发生了什么。他刚才准备好的、用来承接所有恶意的自毁剧本，被眼前的金发少女用毫无温度的陈述硬生生截断了。而雪之下雪乃临走前的那句警告，更是像生锈的钉子一样，直接钉死了他所有试图挽尊的退路。

  他用极低的幅度抓了抓那一头本就凌乱的短发，发出了一声仿佛要把肺里最后一点空气都挤干净的干瘪叹息。

  "我去外面找个没人的角落，继续光合作用去了。"

  八幡用一种仿佛连发音器官都嫌麻烦的语调丢下这句话，然后转过身，驼着背，像只规避光源的夜行动物一样，顺着走廊另一侧的出口溜了出去。

  拉芙希妮没有阻拦他。她很清楚，对于比企谷八幡这种人来说，任何试图在这个时候进行的"开导"或者"安慰"，都比直接给他一拳更让他觉得恶心和难堪。刚才那短暂的一两分钟里发生的事，已经远远超出了他那个习惯于将自己置于受害者位置的社交处理系统的承载极限。

  她安静地站在走廊的通风口处，看着那个单薄的背影消失在拐角。

  直到确认周围再没有第二个人，拉芙希妮才微微松开了绷紧的脊背。她没有立刻离开，而是伸手进校服外套的口袋，掏出了那部属于她自己的、没有安装任何家族监控软件的旧手机。

  屏幕的冷光在昏暗的通道里亮起，打在她那张略显苍白的脸上。她点开了那个除了几行无意义的诗句外几乎空无一物的备忘录界面，手指悬停在虚拟键盘上方几秒钟后，开始有节奏地敲击起来。

  这不是为了汇报给任何人看的东西。这只是她自己，作为这个临时团体中半个"局外人"，通过这五个月的近距离观察，对这几个打破了她既有认知的个体的重新定性。

  『比企谷八幡』
  『过度理性的自我惩罚者。』
  『他擅长用最丑陋的方式撕开虚伪，却又愚蠢地试图用自毁来充当缓冲剂。他的自爆并非出于英勇，而是一种极度控制欲——只有把最坏的牌攥在自己手里，他才能确认没有人会因此受到伤害。可以理解，但不具备可持续性。』

  拉芙希妮的指尖在屏幕上顿了顿，脑海中闪过刚才由比滨结衣虽然发抖却依然挡在前面的侧影。

  『由比滨结衣』
  『行动驱动的共情实体。』
  『极度害怕破坏气氛，却拥有为了保护底线而亲手打碎气氛的本能。她的温柔不是廉价的妥协，而是在清楚了解所有代价后依然做出的靠近。危险的传染源。那个廉价的发卡依然在我的口袋里。』

  键盘的敲击声在走廊里显得有些空灵。拉芙希妮深吸了一口气，将注意力转向了刚才那个用几句话清空了整条走廊的身影。

  『雪之下雪乃』
  『用规则包装的防御性庇护者。』
  『她用冰冷的逻辑和正确的规矩将所有人推开，却又在推开的瞬间悄悄划定了一个绝对安全的边界。她的冷漠是一种筛选，而她的毒舌是对外在攻击的被动反弹。在雷雨天递过来的茶，林间学校那间没有监控的和室。她不是在控制，而是在试图共享一种笨拙的温度。』

  最后，拉芙希妮的手指在光标后敲下了两行空行，写下了最后的总结。

  『初步关系评估：』
  『一个脆弱、互相刺痛却又在竭力避免对方被外界伤害的矛盾体系。他们都在试图用自己残缺的方式寻找某种不被命名的"真实"。』
  『我大概，已经被这个体系捕获了。』

  光标在最后那句话后面安静地闪烁着。

  拉芙希妮盯着屏幕看了一会儿。她没有去按那个发送键，而是郑重地点了屏幕左上角的"保存"。

  手机被重新锁屏，塞回了外套的口袋里。在指尖抽离的瞬间，她隔着薄薄的布料，轻轻碰了碰那个被结衣硬塞进来的、边缘还有些粗糙的粉色塑料发卡。手腕上的旧丝带服帖地贴着皮肤，没有再传来那种熟悉的灼烧感。

  拉芙希妮转身，顺着雪乃刚才离开的方向，迈开了脚步。
