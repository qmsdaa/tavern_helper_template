场景: 30
幕: "第三幕·二学期"
时间: "2013年10月上旬 · 文化祭筹备中期"
地点: "总武高中第三会议室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、相模南、优子"
正文: |
  接下来的一个多星期里，第三会议室后方那张长条桌逐渐长出了属于它的秩序。

  雪之下雪乃用编号前缀和三色优先级标签，将原先堆积如山的混乱文件消化成了整齐的分类档案。贴在墙壁上的手写流程图将预算审批的路径固定下来，各班企划书的提交率从百分之四十三爬升到了百分之七十八。拉芙希妮·都柏林坐在她左侧半步的位置，翻页的手速比第一天快了将近一倍，两人的配合已经不需要口头确认——雪乃的手伸向哪一堆，拉芙希妮的手就自动翻向下一个编号。

  整间会议室的运转节奏被那张长条桌无声地锚定着。相模南在前方继续她的"统筹全局"，偶尔回头瞥一眼后方，确认那堆让她头疼的文件正在被稳定地消化，便放心地转回去继续和优子讨论舞台灯光的色温问题。

  10月9日。周三。下午四点十五分。

  雪乃的手指停了。

  那是她在那个位置上连续工作了六个工作日后，第一次出现完全的停顿。

  两张体育馆场地申请表被她从V类归档中同时抽出，并排放在桌面上。编号V-023，轻音部，周五15:00至17:00，Live演出。编号V-031，2年F班，周五15:30至17:30，音乐剧公演。

  时间段重叠了一个半小时。
  两张表的右下角，都盖着相模南的红色确认章。

  那种熟悉的、来自规则被破坏时的不适从雪乃的指尖蔓延上来。不是疼痛，是更接近于一根细针沿着神经通路缓慢推进的、持续而精确的警报。她的浅蓝色瞳孔在两张表之间移了一次，确认了编号、日期、时段和印章均无歧义。

  然后她站起身。

  拉芙希妮的手在半空中悬了一瞬。
  她的视线追随雪乃的背影离开了长条桌区域，落在U形桌前端那个被几个女生环绕的棕色中长发身影上。

  "相模同学。"
  雪乃的声音不高，但穿透力足以让前方的讨论中断。她将两张申请表放在相模南面前的桌面上，纸面朝上，重叠的时段用她的指尖点出标记，"体育馆，周五时段。两张申请表都盖了你的确认章，时间段重叠一个半小时。请作为委员长裁决，哪一方保留。"

  相模南正拿着一支红色马克笔在白板上圈画舞台日程。她转过头，视线落在两张表上，笑容维持了大约两秒钟——然后像是被什么东西从内部蛀空了一样，嘴角的高度开始缓慢地、不可控地下降。

  "啊……这个……"
  她放下马克笔，拿起两张表翻看了一下。她的拇指在纸边缘摩挲了两次，指甲无意识地刮过红色印章的凸起纹路。

  轻音部的Live是文化祭的人气项目，去年吸引了整个体育馆的观众。F班的音乐剧是今年新提案，班主任据说是音乐老师，在教师会议上专门提过一次。

  两边都得罪不起。

  "哎呀，这个确实是个问题呢。"
  相模南的语气重新挂上了那层熟悉的、柔软的糖衣。她把两张表并排拿在手里，目光在雪乃和身后的优子之间游移了一圈，最终落在一个安全的中间地带——桌面上的矿泉水瓶，"轻音部的Live大家都很期待，F班的音乐剧也是花了心思的。两边都很重要，我也很难说让谁让步……"

  "所以需要你裁决。"雪乃的声音没有温度变化。

  相模南的笑意加深了一层，眼角的细纹收紧。她将两张表轻轻推回桌面，推向雪乃所在的方向，动作里有种经过排练的流畅。

  "不如你们帮忙看看？"
  她的语气里甚至带上了一丝真诚的恳切，"商量一下，看看能不能协调一下时间什么的。奉仕部不是最擅长处理这种事吗？我相信你们的判断！"

  这句话落地的时候，拉芙希妮坐在后方的长条桌前，左手搭在桌沿上，右手握着一张未分类的器材清单，指节没有动。

  但她的翡翠色瞳孔里，有什么东西完成了对焦。

  相模南用"信任"包装了"推卸"。用"你们擅长"替换了"这是我的责任"。用"商量"替代了"裁决"。

  三个替换，一次转移。干净利落，甚至带着某种连她自己都没有意识到的本能——逃避型人格在面临冲突时所执行的、几乎是肌肉记忆般的责任外推。

  拉芙希妮见过这种本能。
  在都柏林家族的权力走廊里，那些被安排了超出其能力范围的职位的远亲，在面对爱布拉娜或家族长老质询时，会做出完全相同的反应：微笑，示弱，将决策权上交或下放，以确保无论结果如何，自己的手上不沾任何一方的怨怼。

  区别在于，在都柏林，这种本能背后至少还配套着对后果的清醒认知。而相模南——

  拉芙希妮的视线越过雪乃挺直的脊背，落在相模南那张重新挂上笑容的脸上。那双被表演撑开的眼睛里，没有对"裁决"这件事本身的任何理解。她甚至没有意识到，把裁决权交出去的同时，她也交出了委员长仅存的实质性权力。

  一个被虚荣驱动、却没有支撑虚荣的能力的人。

  拉芙希妮在心里完成了这个评估，措辞冷静得像在填写都柏林分部的季度人员审查表。

  雪乃没有立刻回应。
  她站在原地，脊背的线条笔直得像一把正在被缓慢折弯的尺子。她的视线落在被推回来的两张申请表上，停留了三秒。

  "相模同学。"
  她的声音依然平稳。但在"相模"和"同学"之间，有一个几乎不可察觉的、比正常停顿长了半拍的间隙，"这是执行委员长的裁决权限。奉仕部的职责是辅助处理积压事务，不是代替你做决策。"

  "我知道我知道！"相模南的语气里多了一丝带刺的委屈，双手在胸前合十，"但你们不是更擅长嘛！我又不懂这些协调的事情……万一我说错了，让哪一边不高兴怎么办？你们帮忙想想嘛，就当帮帮我这个忙？"

  最后四个字。"帮帮我这个忙。"

  拉芙希妮看到雪乃的后背有一个细微的僵硬。不是愤怒——雪之下雪乃的愤怒从来不表现为僵硬。那是某种更深层的、来自"正确性被系统性地回避"时的不适。

  靠在侧墙上的比企谷八幡发出了一声几不可闻的鼻息。不是嗤笑，更接近于某种确认——他歪着头，死鱼眼从相模南脸上移到雪乃背上，再移到后方长条桌前拉芙希妮那张毫无表情的脸上。

  然后他从墙上撑起身子，插兜的手没有抽出来。

  "……总之，"他的声音干瘪地飘过来，像是从隔壁房间透过来的收音机杂音，"被当免费劳动力了啊。"

  "相模同学。"

  一个带着微微卷舌音、字正腔圆却毫无起伏的声音从长条桌后方传来。

  会议室前端的喧闹声仿佛被按下了暂停键。由比滨结衣抱着名单的手臂下意识地收紧了，优子和另外几个女生也转过头。

  拉芙希妮·都柏林依然坐在那张被整理得井井有条的桌子后。她的左手依然搭在桌沿，右手握着一张器材清单，甚至连身体的朝向都没有完全改变。但她的视线穿过了人群之间的缝隙，笔直地钉在了相模南那张尚未来得及收起讨好笑容的脸上。

  "如果两个班级都不让步。"
  拉芙希妮停顿了一拍。不是在寻找措辞，而是在习惯性地让对方承接这句话的重量，"这个决定，最终还是要有人做。"

  相模南的笑容在脸上僵住了。她看着那个平时像个幽灵一样只在后方处理文件的转学生，一时没能反应过来。

  "如果你不做。"
  拉芙希妮并没有给相模南重新组织话术的时间。她的声音依旧平稳，那种在都柏林家族长期浸泡出的、不容置疑的确定感，在此刻剥去了所有伪装，像一把冰冷的手术刀切开了那层糖衣，"那做的就不是奉仕部。是你放弃了委员长的位置。"

  会议室里死一般的寂静。

  相模南嘴角的肌肉难看地抽动了一下。那句"是你放弃了"像一记响亮的耳光，不仅扇飞了她刚刚搭建好的"信任"借口，甚至直接将她最在意的"头衔"踩在了脚下。

  "你……你胡说什么！"
  她的声音终于尖锐了起来，先前的游刃有余荡然无存，手指猛地攥紧了手里的马克笔，"我只是、我只是觉得奉仕部更专业而已！我怎么可能放弃委员长的位置！"

  "那请你裁决。"

  这次接话的是雪之下雪乃。

  她原本笔直且微微僵硬的脊背，在那声带着卷舌音的质问后，肉眼可见地松弛了半寸。那种正确性被系统性回避而产生的不适，仿佛被那句精确的手术刀式的切断了。

  雪乃的视线没有看拉芙希妮，而是重新落回相模南身上。但她原本带着隐忍的不悦的声线，此刻恢复了那种绝对零度般的清明。

  她伸手用食指和中指压住那两张重叠的申请表，缓慢地向前推了推。

  "就像都柏林同学所说。这两个时段既然都盖了你的章，那么解决这个矛盾，就是你作为委员长无法外包的核心职责。"雪乃看着相模南几乎开始泛红的脸颊，语气里没有任何商量的余地，"保留哪一个，或者同时驳回。请现在做出决定。"

  八幡靠在墙上，视线在长条桌后的拉芙希妮和前方的雪乃之间来回扫了一圈，最终在心底发出了一声只有他自己能听见的干瘪叹息。

  完了。
  他看着相模南攥着马克笔发抖的手，心想。

  这下那条蛇不仅被踩住了尾巴，连七寸都被钉死在地上了。
