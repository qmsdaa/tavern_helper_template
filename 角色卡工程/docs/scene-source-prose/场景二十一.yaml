场景: 21
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月下旬 · 林间学校第三天夜晚"
地点: "青少年中心外空地（烟花大会）→ 临时活动室（四人独处）"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、鹤见留美、优香等"
POV: "拉芙"
正文: |
  合宿第三天的夜晚，千叶村的露天草坪上聚集了准备观看烟花大会的小学生和指导员。

  拉芙希妮站在奉仕部四人的边缘，周围是由比滨结衣偶尔传来的期待声和比企谷八幡干瘪的嘟囔。她的视线并没有停留在那些准备点火的纸箱上，而是越过人群，落在了不远处的鹤见留美身上。

  和前两天的林间活动不同，那个六年级女孩的怀里没有再抱着用来作为防御壁垒的书本。她站立的位置虽然依然在小团体的边缘，但已经明显比以往更接近人群的中心。优香等几个女生就站在离她半步远的地方，女孩们之间没有热络的交谈，但那种明显的排斥和孤立氛围已经从空气中剥离了。

  伴随着一声尖锐的呼啸，第一束烟花拖着长长的尾痕升空，在漆黑的夜幕中炸开。

  那不是普通的圆形花火，而是在空中散开成了一个奇特的、带着些许滑稽感的心形图案。光芒瞬间照亮了草坪上仰头观看的面孔。

  在火光映照下，留美微微睁大了那双总是透着早熟和疏离的灰色眼睛。她几乎是本能地、甚至没有经过任何成年人式的防备过滤，发出了一声短促的惊呼。

  这一声惊呼非常轻，但在那一瞬间，站在她旁边的优香转过了头。

  两个女孩的视线在五彩的光影中交汇。优香没有表现出排斥，而是对着那个奇怪形状的烟花指了一下，给出了一个同样微小、却足够自然的附和。

  留美的肩膀微微僵了半秒，随后，那种属于小学生原本该有的生动慢慢回到了她的脸上。她看着同伴，嘴角轻轻牵动，终于露出了一丝没有任何防备和倔强的、真实的笑容。

  几个同伴相视着，在烟花不断升空的轰鸣声里，那种曾经因为背叛和秘密而产生的裂痕，在这一刻被悄然填补。她被接纳了。

  拉芙希妮安静地看着光影下那个终于卸下防备的女孩。右手腕那截烧焦的旧丝带在夜风中轻轻拂过皮肤。

  她的墙，在那一刻里，被美好的东西撑开了。拉芙希妮在烟花的轰鸣声中默默想着。那不是被人推开的，不是被某种暴力的牺牲砸碎的。是被美撑开的。

  随着最后一束金色的火花在夜空中逐渐暗淡，烟花大会宣告结束。

  草坪上响起了带队老师集合整队的哨声。小学生们开始三三两两地排队。

  留美和优香那几个女生走在队伍的中间。她们的肩膀偶尔在走动时轻轻触碰，脚步声混杂在其他孩子的喧闹里。

  拉芙希妮站在原地，看着那个六年级女孩的背影慢慢融入夜色。

  她没有回头。一次也没有。

  推开那间被临时征用作奉仕部活动室的空和室移门时，草坪上喧闹的夜风终于被彻底阻隔在外。

  长桌尽头，热水壶的电源指示灯发出微弱的红光。水流沸腾的轻微轰鸣声在相对安静的房间里回荡。

  雪之下雪乃走到热水壶前，挽起宽大白袍的袖口，从旁边的纸盒中抽出四个一次性纸杯。她的动作依然带有一种属于茶道习惯的规范感，即便使用的是这种毫无质感的容器。

  她先将一杯散发着微酸香气的果茶推到了由比滨结衣面前，结衣发出了惯常的、带着些许疲惫和开心的道谢声。

  接着，她把一杯没有任何添加物的红茶推向长桌对侧。

  "比企谷同学，你近期购买那种高糖分罐装饮料的频率令人担忧。"雪乃没有看那个刚刚在泥地里打过滚的男生，只是在放下纸杯后，语气平稳且冷硬地给出了最低限度的解释，"如果你一定要通过自毁来证明什么，至少请不要从提高患糖尿病的风险开始。"

  比企谷八幡在一旁发出了一声干瘪的叹息。他盯着那杯冒着热气的无糖红茶，没有反驳，也没有伸手去拿，只是把身体向后靠在了椅背上。

  最后，雪乃的目光落在了那盒供人自取的方糖上。

  两块，或者三块。

  作为一个在理论和执行力上几乎毫无破绽的人，这种纯粹依靠"经验"而非配方的手工计量，显然触碰到了她某些不擅长的领域。更何况，这不仅仅是冲泡，这是基于前期有限的观察，在试图安抚对方的同时所作出的微小让步。

  最终，纸杯里落进了三块方糖。

  红茶的液面被注满，深棕色的茶汤表面泛着因为糖分溶解而产生的微小气泡。那杯茶被推到了拉芙希妮的面前，紧接着，雪乃为自己倒满了一杯没有任何添加的大吉岭，回到了自己的座位上。

  拉芙希妮看着面前那个正向外散发着丝丝热气的纸杯。

  这几天在林间学校的种种见闻，从试胆大会那一晚的狼狈，到刚才烟花下轰然崩塌的高墙，所有的疲惫似乎都随着这股热气慢慢沉淀下来。

  拉芙希妮伸出双手，捧起了纸杯。那个被火烧焦过尾端的旧丝带，随着她倾斜手腕的动作，安静地贴在了桌面边缘。

  茶水入口的那一瞬间，那股过于浓郁、甚至显得有些直接的甜味，瞬间侵占了味蕾。

  这不是一份经过精确计算的甜度。它笨拙、未经修饰，带着一种试图给与却又不知道边界在哪里的茫然。

  在过去很长的一段岁月里，爱布拉娜和她都喜欢这份甜度，经常翘掉下午的礼仪课偷偷跑到海德公园附近的甜点店去点当季时尚的甜品，然后躲到肯辛顿一边分享一边喂天鹅。

  但现在，坐在长桌另一端的那个女生，正低头看着自己那杯大吉岭的倒影，假装刚才那场关于糖分的斟酌并没有发生。

  拉芙希妮慢慢咽下了那口很甜的红茶。

  这不是来自大洋彼岸的试探，更不是一种包裹着爱意的命令。这种因为不知道分量而产生的甜度，就像是在黑暗的榻榻米上那阵平稳的呼吸声一样，是这个人用她自己的方式，在这个只有四个人的房间里，分出了一块安全的区域。

  拉芙希妮再次抬起手，将纸杯边缘贴近了嘴唇。她在升腾的水汽后闭上了眼睛。

  这是一种共享。

  甜的。过甜。

  像某个人独处时的味道。

