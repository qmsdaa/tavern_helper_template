场景: 123
幕: "第八幕·归国与失语"
时间: "2014年8月9日 · 周六"
地点: "伦敦（宅邸→保险会社档案中心→宅邸）"
人物: "拉芙希妮·都柏林、温斯顿（电话）"
POV: "拉芙希妮"
正文: |
  电话是早上九点打的。

  "温斯顿先生。有件事，想请教手续上的问题。"

  拉芙希妮坐在书桌前，那张对折了两次的纸摊开在台灯下。行程单立在旁边，返程日期在晨光里很安静。

  电话那头安静了一拍。

  "……我明白了。"温斯顿的声音和平时一样平稳，但那一拍比平时长，"您请讲。"

  她把编号报了一遍。AXI-2013-04873-J。然后说："我想调取这份档案的正式副本。以当事人的身份。"

  这一次，电话那头沉默了更久。她能听见很轻的、笔尖碰到纸面的声音，像是对方在写什么，又像只是手指无意识地敲了一下。

  "编号的前三位，属于一家伦敦的损害保险会社。"温斯顿再开口时，语速放得慢了，"他们有面向当事人的档案调取窗口。凭身份证明和受理番号，可以预约阅档，也可以申请认证謄本。流程是公开的，合法的。"

  他顿了顿。

  "预约电话，您自己打。本人到场，本人签字。"他的声音里没有多余的起伏，"您本人去，比我经手更干净。"

  "……好。"

  "还有一件事。"温斯顿说，"调档记录会留在这家会社的业务系统里。合法，正常，但存在。——您明白我的意思吗。"

  "明白。"她说，"有人能看到我去查过。没关系。"

  挂断之后，她拨通了那个预约电话。

  ——

  保险会社的档案中心在市区边缘，一栋没有任何标志的灰色建筑。

  阅档室在三楼，长条桌，荧光灯，空调出风口的声音低而持续。接待她的职员核对了护照和预约号，让她填了两张表，然后推过来一只牛皮纸档案盒。

  "AXI-2013-04873-J，全卷。阅档时间两个小时，需要延长的话到前台登记。"

  档案盒不重。比她想象的轻。

  她把盒盖打开。

  最上面是理赔申请与结案记录。下面是现场照片——她翻过去，没有停。再下面，是《独立保险调查报告书·正卷》。

  她先读的是附件部分的风险评估卷宗。

  视察日前十天，安保顾问公司向视察主办办公室提交了《风险升级评估》：产业区的罢工集会出现外部煽动者，现场发现可用于纵火的器材，建议"延期视察，或变更路线与陪同规模"。评估书的收件栏盖着主办办公室的收文章，旁边附一页签收记录。

  签收记录上写着：已读。签收栏里的字迹，她从小就认识。

  她盯着那两个字看了一会儿，翻页。

  批复栏在评估书的末页。处理意见一栏，是同一个签名——从小在各种文件的落款处见过无数次的那种、锋利而克制的字迹。

  "行程维持。按原计划执行。"

  空调出风的声音压了过来。

  她把那页纸放平，继续往下读。

  调查结论的第一部分写得很清楚：经查证，视察主办方与集会煽动者之间不存在任何联络记录；纵火行为系骚乱现场独立发生，无人指使。

  没有下令纵火。

  这一条，报告用了一整段来否认。她读得很慢，一个字一个字地读，读完了，在桌前坐直，闭上眼睛停了几秒，再睁开。

  第二部分是安保部署。

  《视察警备配置命令》的复印件夹在报告里。第三条："现场安保力量于视察区域外围部署警戒。未获视察负责人明确授权，不得进入视察区域。"

  命令的签发栏，是同一个签名。

  她的手指落在那行"不得进入"上，没有用力，指尖却慢慢变白了。

  第三部分是时间线。

  报告用一张表列出了从起火到坍塌的每一分钟。起火点，阁楼下一层的废弃车间。报警时间。消防到场时间。以及一行单独列出的记录——

  "坍塌前，进入火场的人员：一名。达洛维（同行家庭教师）。进入时间距起火约四分钟。安保队获得进入授权时，已超过可介入窗口约十一分钟。"

  唯一及时进入的人。

  窗外有云飘过去，阅档室的光暗了一瞬，又亮回来。

  拉芙希妮维持着那个姿势坐了很久。前台的职员隔着玻璃看了她一眼，没有过来。

  意外。

  她在心里把这个词拿出来，放在桌面上，看着它。

  意外是不需要已读标记的。意外是不需要批复"行程维持"的。意外，更不需要一条"未经授权不得进入"的命令。

  她用了一年多的时间，把那一天理解成一场意外。

  而这份报告只用了三个签名，就把"意外"两个字拆掉了——火不是姐姐放的。报告说得很清楚，甚至比她更希望把这一点说清楚。可是火向她靠近的那一路，每一步都有人签字。警告到了，被读了；建议来了，被批回了；安保在外面，被命令站着。

  直到达洛维小姐一个人跑进去。

  档案盒的牛皮纸边缘硌着她的手腕。她低下头，看见自己的指尖还按在那行"不得进入"上，就把手收了回来，一根手指一根手指地伸直。

  然后她合上报告，把全卷按原来的顺序理好，放回档案盒，盖上盖子。

  "需要延长吗？"前台的职员问。

  "不用。"她说，"我申请全卷认证謄本。"

  ——

  謄本两个工作日后可取。她约了自取——八月十二日，下午。

  走出那栋灰色建筑的时候，伦敦的天很亮，亮得不像刚读完一份那样的东西之后该有的天色。她在台阶上站了一会儿，把手机拿出来，对着天空拍了一张照片。

  "伦敦晴天。今天的第一条。——拉芙希妮"

  回复陆续进来：太阳、熊猫、一个"哦"，最后是雪乃的"收到"。

  她把手机收起来，沿着街道往地铁站走。影子在身后，被下午的太阳压得很短。

  回到宅邸，管家在门厅迎上来："拉芙希妮小姐。爱布拉娜小姐来电话，明晚回来用晚餐。"

  她停下脚步。

  "……我知道了。"

  楼梯很长。她一级一级地走上去，不快，也不慢。

  书桌上，行程单还立在台灯旁边。她把它拿起来，看了一眼返程的日期，然后拉开抽屉，把手帐翻到空白的一页，用一支黑色圆珠笔写下三行字：

  已读。
  行程维持。
  不得进入。

  她看着那三行字，看了一会儿，把手帐合上，收进抽屉。距离八月十二日，还有三天。
