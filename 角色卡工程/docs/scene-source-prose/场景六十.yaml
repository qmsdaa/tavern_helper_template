场景: 60
幕: "第三幕·二学期"
时间: "2013年12月24日 · 平安夜晚上 · 紧接场景 59 · 萨莉亚家庭餐厅"
地点: "萨莉亚家庭餐厅 · 同桌"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
正文: |
  在成功地用一份田园沙拉把桌面上那股不断攀升的火药味按回原位后，拉芙希妮并没有选择继续在这个边缘上试探。

  对于一个观察者来说，见好就收是维持秩序的基本准则。

  她将那只已经离开水杯的右手轻轻抬起，指尖越过桌面，从由比滨结衣手边抽过了那本印满彩色食物图片的菜单。在雪乃依然冷硬的注视下，拉芙希妮将菜单不慌不忙地平推到了桌子对面。

  "如果雪乃同学和结衣同学在这件事上难以达成共识……"

  拉芙希妮微微倾身，那双翡翠色的眼睛在餐厅昏黄的顶灯下显得柔和。她的语气里听不出一丝调侃，甚至带着一种真诚。

  "不如听听比企谷同学的意见吧？一直以来，你都在默默替奉仕部承担着各种各样的麻烦，还要一并忍受这种让人窒息的空气，真的是辛苦了呢。"

  "哈？"

  一个干瘪、甚至带着几分破音的单音节从比企谷八幡的喉咙里挤了出来。

  他原本举在嘴边用来掩饰围观姿态的塑料水杯，此刻尴尬地停在了半空中。一股淡红色迅速从他的脖颈蔓延到了耳根，那颜色甚至比刚才由比滨结衣因为兴奋而涨红的脸还要显眼几分。

  这个金发的家伙今天到底吃错了什么药？

  八幡的死鱼眼在眼前那份菜单和对面的三名女性之间迅速扫过。这种把善意包装成毒药、再用最真诚的语气递到你嘴边的手段，他根本连一句吐槽都说不出口。

  他清楚地意识到——反驳会显得矫情，接受又会让在场的每一个人都盯着自己。

  在短暂的沉默后，八幡终于在这场极端恶劣的社交处境里，重启了独行侠多年练就的绝佳技能：物理级逃避。

  他僵硬地放下水杯，视线钉在桌面的边缘，坚决不肯与桌对面任何一双眼睛产生交集。接着，他伸出食指，像一台缺乏润滑的机械臂，在菜单上胡乱地、迅速地戳了一下。

  "蒜香橄榄油意大利面。大份。谢谢。"

  没有起伏的语调，没有多余的废话。八幡用一种在超市收银台结账般的干瘪嗓音，为这场突如其来的"感谢"画上了一个极度敷衍的句号。最便宜、最不起眼、连酱汁都吝啬给予的基础款意面，完美契合了他此刻只想从这场神仙打架中隐身出去的迫切愿望。

  面对这种拙劣到连幼儿园小孩都骗不过去的逃避，拉芙希妮并没有选择乘胜追击。

  "蒜香橄榄油意面吗？很好的选择呢。"

  那双翡翠色的眼睛里滑过一丝轻巧的了然。拉芙希妮微微弯起眼角，用挑不出半点毛病的礼貌语气自然而然地收回了菜单。仿佛刚才那句带着压迫感的"辛苦了"真的只是一句普通的社团寒暄——她并没有在八幡那颗脆弱的心脏上再补一刀。

  结衣敏锐地察觉到了这股重新开始流通的空气，立刻抓住了机会，指着拉芙希妮手中的菜单欢快地喊了起来："那我就要田园沙拉！还有一份烤蜗牛！"

  气氛似乎又回到了家庭餐厅本该有的喧闹轨道上。

  然而，在这个诡异的三角平衡里，总有人不甘心就此偃旗息鼓。

  "原来如此。"

  一个清脆、冰冷、带着绝对理性质感的声音，像一把精准的手术刀，切开了结衣刚刚营造起来的热闹表皮。

  雪之下雪乃不知道什么时候已经松开了那个被她扣了半天的玻璃杯。她微微扬起下巴，视线越过长桌，居高临下地落在了那个还在试图降低存在感的死鱼眼上。

  "遇到无法理解或者不敢面对的社交局面时，你的第一反应永远是退缩到最不需要付出代价的角落。一盘廉价、且几乎不具备任何营养价值的蒜香意面——确实非常符合你那贫瘠且悲惨的生存哲学。"

  雪乃的声音不大，但每一个音节都咬得极重，透着一种终于找到宣泄口的快意。她没有去看拉芙希妮，而是把所有的火力都集中在了八幡身上——仿佛这样就能宣告：在这个奉仕部里，能够对眼前这个满嘴歪理的男生进行单方面说教的人，只有她一个。

  "更何况，如果你以为用这种掩耳盗铃的方式，就能假装刚才那段莫名其妙的、包装成廉价善意的寒暄不存在……"雪乃冷笑了一声，嘴角勾起了一个具有攻击性的弧度，"那可就未免太低估在场其他人的判断力了，比企谷同学。"

  比企谷八幡的眉头明显跳了一下。

  他原本已经决定打死也不抬头，但面对这种直接贴脸输出的毒舌，多年来在夹缝中练就的战斗本能让他下意识地张开了嘴。那句"总比某人只能靠讽刺别人来找存在感要好"已经滑到了舌尖。

  就在这千钧一发、新一轮部内冷战即将开火的瞬间，桌底下的战况发生了逆转。

  拉芙希妮的左手一直安静地垂在桌下。她没有去理会桌面上正在酝酿的风暴，也没有去看即将反击的八幡。那只手极其自然地、几乎没有任何多余动作地平移了几厘米，越过并不宽敞的桌下空隙——手背贴着雪乃搁在膝盖上的那只手。

  然后，指腹极短地按了一下。

  没有力道，没有停留。像是场景四十四那个夜晚在被褥间隙里那种克制的触碰的日常缩影。

  雪乃刚刚滑到嘴边的下一句话骤然被卡住了。

  她那原本准备继续输出批判的呼吸猛地一顿，鼻子里泄出一声极小的、几乎听不见的音节。她的手指在膝盖上僵了半秒，随后极快地把手从桌下抽回，端起了那个早就空了的玻璃杯。玻璃杯的杯沿在她微微发抖的指尖下发出一声几不可闻的轻响。

  对面的比企谷八幡将这一切尽收眼底。

  ——他没有看到桌下的动作，但雪乃那种极不寻常的、"话说到一半突然被强行拔线"的僵硬状态，是他这个死鱼眼多年来看惯了各种"隐形处刑"之后练就的绝佳直觉。

  那句已经到了嘴边的干瘪吐槽被他以惊人的反应速度咽了回去。他清楚地知道，现在不是继续跟雪乃较劲的时候，而是让那个女人下不来台的黄金机会。

  "咳咳，"八幡清了清嗓子，果断放弃了原本的防御姿态，"我说，你们也稍微考虑一下别人的心情吧。刚才在过来的路上，都柏林可是偷偷跟我提过。"

  他顶着雪乃那足以杀人的目光，一本正经地开始了满嘴跑火车的圆场。

  "她说，今天是平安夜。对一个离家万里的留学生来说，这可不是随便吃顿饭就能糊弄过去的日子。她是很认真地……想和我们几个，在一年快结束的时候，度过一个没有争吵的夜晚。"

  拉芙希妮显然对八幡这种无中生有的圆场感到了一丝意外。但她随即接住了这个完美的台阶。

  她没有去辩解八幡的信口开河，只是垂下眼睫，让原本那份从容的腹黑感彻底消失了。

  "其实……也没有比企谷同学说得那么严重。"拉芙希妮的声音放得很轻，与刚才那种游刃有余的干燥语气完全不同，"只是……如果可以的话。"

  她停顿了半拍，眼睫又轻轻抬起了一次。

  "第一次，我竟然会觉得，被这样围绕着，是一件不该拒绝的事。"

  这句话没有直接使用"朋友"或者"感谢"这一类的字眼，它甚至没有一个明确的宾语。但正是这种不完整的、几乎带着自我怀疑的坦白，狠狠地砸在了由比滨结衣的心坎上。

  "呜哇……拉芙希妮酱！"结衣几乎瞬间就从点餐的焦虑中切换到了情感共鸣的频道。她一把抓住了拉芙希妮那只还搁在桌面上的手，眼眶甚至有些发红，"小企说得对！今天是平安夜啊！我们可是奉仕部啊，怎么能因为这一点点小事就不开心呢！小雪乃也真是的——今天就别管什么热量了嘛！"

  刚才还在用冰冷逻辑重塑权威的雪乃，此刻彻底陷入了孤立无援的境地。

  她刚才用来武装自己的那些"生存哲学"、"廉价"和"判断力"，在拉芙希妮那种带着"第一次过节"渴望的坦白面前，像是碰到了热水的雪花，融化得连一点挣扎的余地都没有。

  最致命的是，膝盖上那只手的手背，还残留着刚才被指腹极短按压过的、几乎无法用语言描述的余温。

  雪乃张了张嘴，试图在她那套无懈可击的逻辑库里找到一句足以反驳这种温情绑架的话。但她最终只是非常生硬地别开了脸，假装去研究面前那个早就空了的玻璃杯。

  看着雪乃那副仿佛要把空水杯盯出一个洞来的生硬侧脸，比企谷八幡的作死雷达似乎在这一刻出现了严重的信号干扰。

  或者说，被这个女人用逻辑压迫得太久，一旦看到她吃瘪，他就控制不住想要在火上浇点油的冲动。

  "啊，是吗。"

  八幡用那种干瘪且带着明显欠揍意味的语调开了口，甚至还故意把身子往后靠了靠，做出一副事不关己的姿态，"平时不是挺能用逻辑给人挑刺的吗？现在怎么突然安静了？该不会真的是被这种俗套的温情把戏感动得说不出话来了吧？如果是这样，我建议你最好用旁边的餐巾纸稍微遮一下，免得待会儿眼泪掉在桌面上，还得让别人误会我在欺负你。"

  空气在这一瞬间几乎凝滞了。

  由比滨结衣立刻转过头，用一种混合着惊恐和"小企你是不是疯了"的眼神盯着他。拉芙希妮也放轻了呼吸，准备安静地旁观雪乃那即将到来的、逻辑严密的毒舌洗礼。

  然而，预想中的冰冷反击并没有降临。

  雪乃盯着空水杯的视线终于动了动。她缓慢地、仿佛带着某种巨大决心般地把脸转了回来。那双深蓝色的眼眸里，还带着未完全褪去的红晕。但那些平时用来武装自己的防备与尖刺，在这一刻奇迹般地褪去了。

  她看向对面的八幡，又看了一眼身旁的拉芙希妮和满脸担忧的结衣。

  "……是啊。"

  她的声音很轻，不再是那种字正腔圆、掷地有声的辩论式发音，甚至尾音还带着一丝极难察觉的微颤。但这两个轻飘飘的字，却清清楚楚地砸在了这张桌子上的每一个人的耳朵里。

  八幡那副事不关己的姿态僵住了。他原本已经准备好的下一句吐槽被硬生生地卡在了喉咙口，半张着嘴。

  雪乃深吸了一口气，她的视线没有再逃避。

  "我很意外。"

  她一字一句地看着面前的同伴说道，那份毫无遮掩的坦白让刚才还在调侃的八幡感到了一阵莫名的、手足无措的慌乱。

  "在遇到你们几位之前……我一直以为，'共通'与'热闹'这类词汇，对我来说属于某种可以在书本上定义、但不需要真的去理解的东西。"

  她停顿了一下，那双深蓝色的眼眸里罕见地漂浮着一层近乎困惑的光。

  "但今天……不知道是不是因为番茄酱和现烤芝士的味道过于浓烈的缘故……我竟然会认真地觉得，此刻这张桌子上正在发生的这些毫无逻辑的事情，也不算太差。"
