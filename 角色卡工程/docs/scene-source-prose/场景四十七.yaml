场景: 47
幕: "第三幕·二学期"
时间: "2013年11月18日 · 修学旅行归后第一日 · 放学后"
地点: "奉仕部活动室"
人物: "雪之下雪乃（POV）、拉芙希妮·都柏林、比企谷八幡、由比滨结衣、户部翔"
POV: "雪之下雪乃独占（本项目首场雪乃 POV 独占）"
正文: |
  活动室的拉门发出沉闷的滑动声。比企谷像往常那样，带着那股拖沓的脚步声走了进来。

  他的视线在扫过雪乃这边的瞬间，明显停顿了一秒。那双毫无生气的眼睛在她的高马尾和防辐射眼镜上转了一圈，最后什么多余的话也没说，只是默默拉开他对面的椅子坐了下去。他那种为了避免卷入麻烦而选择闭嘴的求生本能，在这个时候确实省去了我许多解释的功夫。

  隔了没几分钟，门再次被拉开。

  拉芙希妮走了进来。在她迈步走向长桌的过程中，雪乃注意到她的右手下意识地抬起，似乎准备去拽左侧的校服袖口——但在指尖即将触碰到布料的瞬间，她停住了。

  她将手重新放回身侧，任由左手腕上那条原本属于我的红绸带暴露在室内的空气中，随后在距离雪乃不远的位置安静地坐下。

  雪乃把杯子推向她的时候，我的视线不可避免地在她的左手腕上停留了半秒。

  "茶泡好了，不热，尽快喝。"我用尽量平稳的声音给出了这句最低限度的提醒，随后翻开了手边的文库本。

  这种安静的默契并没有持续太久。

  走廊外传来一阵急促的脚步声，紧接着门被猛地推开。由比滨气喘吁吁地冲了进来，手里还紧紧抓着书包。

  "抱歉抱歉！今天值日稍微晚了一点……"她的声音在看清雪乃模样的瞬间戛然而止，琥珀色的眼睛猛地睁大，紧接着发出一声夸张的惊呼。

  "小、小雪乃？！"由比滨三步并作两步凑到桌前，毫不吝啬地将那份吵闹的赞美砸了过来，"哇！这个高马尾超级好看！还有眼镜！感觉就像那种特别厉害的精英！是怎么想到换这种风格的？"

  雪乃被她这种缺乏距离感的打量弄得有些不自在，手指本能地想要去绕耳边垂下的发辫，却只摸到了冰冷的镜框边缘。

  由比滨那种缺乏距离感的打量和吵闹的赞美还在活动室里回荡，拉门便被人再次略显粗暴地拉开了。

  户部翔探进半个身子。他今天没有像往常那样一进门就发出那种毫无营养的喧闹，而是先在门口停顿了一下，视线飞快地在房间里扫了一圈，像是在确认这里有没有某个他不愿见到的身影。

  他手里提着一个印着京都某家著名点心店名字的纸袋。

  "哟！那个……大家都在啊。"户部走进来，把那个纸袋放在了长桌的边缘。他的动作有些僵直，脸上的笑容也是那种刻意扯出来的、试图维持平时"气氛担当"人设的弧度。

  "这是给你们的伴手礼。京都的生八桥，味道还挺不错的。"他搓了搓手，视线飘忽着，刻意避开了坐在对面的比企谷，也没有看我，最后落在了拉芙希妮和由比滨的方向。

  "那个……京都那天的事，真的谢啦。"他抓了抓头发，语气里带着一种强行扭转的轻快，"你们那一招'即兴戏剧'，真的是绝了！我一开始还没反应过来，后来想想，这简直就是最高级的社交手腕啊！"

  他越说声音越大，仿佛音量的提升能掩盖他内心的虚弱。

  "要不是留学生那一出，我当时如果真的脑子一热说出来……海老名肯定会很尴尬的，大家之后都不好相处了。"他自顾自地干笑了几声，"这叫什么来着？战术性撤退？总之，没有破坏大家现在的气氛，真是太好了。你们奉仕部，确实挺有一套的嘛。"

  他把那天的狼狈全盘包装成了一场他早已看穿的高级战术，用这种现充特有的粉饰方式，去拼凑他那点少得可怜的自尊。

  由比滨站在桌边。她的视线停在户部那张因为笑得太过用力而微微有些扭曲的脸上。她的嘴唇半张着，向前迈了半步，手指攥紧了书包的背带。

  她显然看出了对方那种一戳即破的逞强，想要开口说些什么。但那些话在她的喉咙里滚了一圈，最终又被她强行咽了回去。她的肩膀在那一瞬间微微塌下来半寸。

  她明白，如果在这里戳破那个借口，只会让户部变得更加无地自容。

  "谢谢户部同学的伴手礼。"由比滨松开了书包带子，嘴角重新扬起了一个柔和的弧度。她的声音放得很轻，带着那种她特有的、不带任何攻击性的妥协，"那天……大家后来都能开开心心地逛完京都，真是太好了。"

  由比滨结衣轻柔的话语像是一块恰到好处的缓冲垫，接住了户部翔那摇摇欲坠的借口。

  户部紧绷的肩膀肉眼可见地松垮了半分。他暗自呼出一口气，脸上的笑容终于褪去了几分刻意扭曲的痕迹。为了不让刚刚缓和下来的气氛再次陷入令人窒息的停顿，或者说仅仅是为了掩盖自己急于脱身的慌乱，他伸手胡乱挠了挠后脑勺，语调夸张地上扬起来。

  "对了对了，说起来，"他像抓住了什么现成的救命稻草，生硬且飞快地转移了话题，"我们足球部有个一年级的学妹，叫一色伊吕波来着。她最近也说你们奉仕部很厉害什么的，好像还挺感兴趣的。"

  这个陌生的名字被他没头没脑地抛进房间里。他似乎并不期待能得到什么具体的回应，这仅仅是他用来填补离开前最后几秒空白的工具。

  "那什么，伴手礼大家趁新鲜吃啊。我社团那边还有点事，必须得先走了！"

  没有给任何人接话的余地，户部匆匆忙忙地扔下这几句毫无营养的客套话。他一把拉开门，半个身子瞬间探了出去，步伐急促得像是在躲避某种无形的追赶，转眼间便消失在了走廊的拐角处。

  拉门在滑轨上发出一声沉闷的撞击声，重新合上，将门外细碎的脚步声隔绝了。

  活动室里那种由他带来的、黏糊糊的虚假轻松感，随着门框的微震慢慢沉淀下来。长桌边缘那个印着京都某家点心店名字的纸袋孤零零地立在那里，成了这场荒诞道谢留下的唯一实体证据。

  比企谷八幡盯着那个包装精美的纸袋，原本就毫无生气的死鱼眼多了一丝烦躁。他向后靠在椅背上，发出一声低沉且干瘪的咋舌音。

  "一色彩羽？一听就是个会被卷进麻烦里的名字。"比企谷的声音里透着一股显而易见的排斥，"足球部的经理不好好去递毛巾，闲到跑来打听我们这种边缘社团，现充们的精力还真是过剩得可怕。"

  由比滨依然站在桌边，视线从纸袋移向对面的比企谷，随后又略显局促地低下头。

  "足球部的一年级学妹啊……"由比滨小声地重复了一遍，手指不自觉地绞在一起。

  长桌的另一端，拉芙希妮安安静静地坐在自己的位置上。她并没有去碰手边那杯温度刚刚好的热茶，翡翠色的眼睛在纸袋和由比滨之间淡淡地扫过。左手腕上那条没有去刻意遮掩的红缎带，在深色制服的衬托下显得异常清晰。她一言不发，仅仅是注视着这个房间里刚刚落幕的这出拙劣的收场戏。

  拉门合上所引发的最后一点微震，在空气中慢慢消散。长桌周围陷入了长达数秒的静默。

  那是一种并不尖锐，却让人觉得无法舒适呼吸的停顿。由比滨结衣绞在一起的手指松开又抓紧，她的视线在那袋被孤零零留在桌角的生八桥上绕了一圈，率先开了口。

  "唉……户部同学他……"她刻意拖长了尾音，试图用一种日常的、带着点无奈的语汇来打破这种黏糊糊的空气，"还是没变呢，欸嘿嘿。"

  那声干巴巴的笑声落在安静的房间里，显得有些单薄而勉强。她迫切地需要一个台阶，来安置刚才那种看穿却不能说穿的局促。

  拉芙希妮在这时接过了话头。她没有去端那杯已经变温的茶，声音平缓得没有一点起伏："至少，那位始终被保护在不知情状态里的同班同学，明天依然可以用最轻松的姿态去回应他那种夸张的打招呼方式。"她停顿了半拍，"对于一份不得不收回的告白来说，能被包装成一场戏剧，已经是伤害最小的结局了。"

  轻描淡写的几句话，精准地将这场拙劣的掩饰剥离了那层难堪的外衣，缝合成了一个由比滨可以安然吞咽下去的故事——一个关于笨拙男生的无奈努力。由比滨的肩膀肉眼可见地松弛了下来，她用力地点了点头，嘴角终于露出了一个稍微自然些的笑容。

  这短暂的、用来抹平尴尬的交流，并没有在长桌的另一端激起任何波澜。

  雪之下雪乃维持着原本的坐姿。她没有抬头，也没有对户部的登门发表任何惯常的、带着冰冷逻辑的总结或严厉批评。黑色的笔记本平整地摊开在她面前。然而，她握着水笔的右手，却突兀地停在了一行字的正中间。

  这不是那种为了斟酌某个高级词汇而产生的短暂思考。笔尖悬浮在距离白纸不到半厘米的地方，那一滴墨水在金属尖端凝聚，却在漫长的几秒钟里，迟迟没有落下下一个字符。她的视线仿佛被牢牢钉死在那个未完成的句子里，整个人呈现出一种近乎僵硬的凝滞感。

  比企谷八幡的眼珠在那一刻极短地转动了一下。

  他那总是习惯性地盯着桌面纹理的视线，像被什么东西绊了一下，不受控制地在雪乃那支悬停的笔尖上划过。仅仅只停留了一瞬。在第一滴墨水可能因为重力坠落到纸面上之前，他已经将目光强行移开，重新投向了窗外被玻璃过滤过的那片灰白色的天空。
