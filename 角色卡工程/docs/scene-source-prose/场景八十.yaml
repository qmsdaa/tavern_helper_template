场景: 80
幕: "第五幕·PTA→舞会"
时间: "2014年2月24日 · 周一 · 三学期"
地点: "总武高中 · 特别栋 · 奉仕部活动室 → 总武高会议中心第三厅"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、一色彩羽、平冢静、雪之下母"
正文: |
  卤素暖炉的网罩发出轻微的"劈啪"声。暗红色的光在灰白的地板上投下几道栅栏状的影子。

  雪乃的视线停留在手中的文库本上。页码显示在一百四十二页，但从三分钟前开始，她的眼睛就没有再往下移动过一行。纸张边缘被她的拇指捏得发皱。

  "好慢啊……"

  一声拖长了音调的哀嚎打破了只有电流声的死寂。

  一色彩羽趴在长桌另一头，下巴抵在交叉的手臂上，金色的发丝乱糟糟地散在桌面上。她伸出一根手指，无意识地在木纹上来回画着圈。

  "那些大人们是不是故意的？这都三天了。就算他们要开会讨论，也不至于连个传真的回执都没有吧？预算再不批下来，花篮和灯光公司就要把我的定金吃掉了……"

  "这就是大人们最喜欢的保留节目，名为'放置play的心理战'。"八幡坐在窗边，手里捏着一罐早就喝完的MAX咖啡空罐，手指在铝皮上按出一个个浅坑，"通过无限期的拖延来消磨你的耐心，等你在焦虑中开始自我怀疑、甚至主动降低要求的时候，他们再抛出一个看似让步的折中方案。很高明的肮脏手段。"

  一色把脸埋进臂弯里，发出沉闷的抗议声。

  结衣坐在八幡旁边，手指在手机屏幕上毫无目的地滑动："可是，我们交上去的那个方案，不是已经把消防漏洞什么的全都堵死了吗？他们总不能真的装作没看见那些隐患吧？"

  "他们当然看见了。"拉芙希妮端起面前的红茶，瓷杯碰到托盘，发出一声脆响，"但在庞大的官僚体系或者某些权威的眼里，'对'与'错'并不是第一顺位的考量。"

  她翡翠色的眼睛越过蒸腾的水汽，安静地落在一色那张写满沮丧的脸上："他们在考量的是——这个方案是谁递上来的，以及，为什么要用这种带着刺的方式递上来。"

  雪乃听着空气里交织的声音，睫毛微微颤动了一下。

  她将手里的文库本放低了一些。

  拉芙希妮说得很对。PTA的那群人里，或者说，那群人背后站着的那个女人，绝不会单纯因为一份逻辑严密的文书就乖乖盖上同意的印章。

  那是一封宣战书。母亲在看到那份方案的时候，一定会认出里面那些属于她雪之下雪乃的、执拗且带着反抗意味的修辞习惯。这三天的等待，不是效率低下，而是母亲在门后冷静地注视着这边的挣扎。

  雪乃深吸了一口气，手腕不自觉地收紧。她端起旁边早就温吞的红茶抿了一小口，冰凉的液体滑过喉咙，却没能压下那种盘旋在胃部的焦虑。

  "如果……我是说如果。"一色突然抬起头，眼睛里带着疲惫的血丝，"如果他们就是不批呢？如果他们宁愿找别的理由把整个企划砍掉……"

  "那就砍掉。"雪乃打断了她的话，声音冷硬得像一块刚从冰水里捞出来的石头。

  长桌周围瞬间安静下来。结衣担忧地看向她。

  雪乃将文库本合上，封面敲在桌面上发出一声闷响。她的脊背挺得笔直，视线扫过长桌对面的人："我们在上周的方案里已经说得很清楚了。如果退回传统的场馆，发生消防事故的责任将由谁来承担。既然把选择的泥沼踢给了他们，我们现在能做的，就是站在这里，看着他们做出决定。"

  一色被这股气场震慑，下意识地缩了缩脖子："学、学姐……你现在看起来好可怕。"

  八幡在旁边发出一声轻微的冷哼。这当然可怕，因为那个家伙现在浑身上下都竖满了名为防御的刺。她越是表现得无懈可击，就说明她内心越是绷到了极限。

  就在这时，走廊外面传来了一阵不属于学生鞋底的沉重脚步声。

  脚步声停在门外。

  "咔哒"一声，特别栋闲置教室的门被一把推开。

  平冢静穿着那件万年不变的白大褂走了进来，带着走廊外阴冷潮湿的风。她的眉头微微皱着，手里并没有拿往常用来提神的香烟，而是捏着一个眼熟的牛皮纸信封。

  一色立刻从桌子上弹了起来，刚才的疲惫一扫而空："老师！是不是……"

  平冢静没有直接回答，而是径直走到长桌前，将那个牛皮纸信封"啪"地一声扔在了桌子正中央。

  "你们这群难缠的小鬼。"平冢静叹了口气，拉过一张椅子坐下，"方案他们看了。不仅看了，还让教育委员会的几个干事拿着你们指出的那几个消防隐患，去现场做了实地评估。"

  结衣的眼睛亮了起来："那也就是说……同意了？"

  "自己看。"平冢静扬了扬下巴。

  一色迫不及待地拆开信封，从里面抽出一份带有红色批注的复印件。

  只看了两眼，一色的脸色就变了。她那张原本因为期待而红润的脸颊，瞬间失去了血色。

  "怎么了？"八幡察觉到了不对劲。

  "他们……同意将高层酒店的附楼宴会厅纳入备选名单，并且……原则上同意增加百分之三十的安保预算……"一色结结巴巴地念着上面的字，手腕开始微微发抖，"但是，由于该方案跳过了常规的申请流程，且涉及预算的重大追加……"

  她停住了，咽了一口唾沫。

  雪乃盯着那张纸，拇指按住纸面的力道加重了一分："念下去，一色同学。"

  "……要求学生会代表，以及该方案的共同起草人，在下周一的PTA特别会议上，进行当面汇报。并接受理事会关于资金使用明细的……质询。"

  一色的声音在空荡荡的教室里回荡。

  这根本不是什么同意。

  这是一场蓄谋已久的、包装在"同意"外壳下的狙击。

  用同意预算为诱饵，把一直躲在文书背后的起草人，硬生生地拖到光天化日之下，拖进那个充满了成年人权力和傲慢的会议室里，进行一场居高临下的公开审判。

  八幡捏紧了手里的空易拉罐。铝皮发出令人牙酸的摩擦声。

  "这算哪门子的同意。"八幡死死盯着桌面，"让一群高中生去面对那些在社会上摸爬滚打了半辈子的老油条？这根本就是一场明目张胆的屠杀吧。"

  "他们是故意的。"拉芙希妮声音很轻，却带着冰冷的确定感，"用程序上的正义，来掩盖实质上的权力施压。既然你在纸面上让他们无法反驳，他们就要在现实的场域里，用身份和地位让你屈服。"

  结衣捂住了嘴，眼神在雪乃和那张文件之间来回游移。

  平冢静没有反驳八幡的话。她只是靠在椅背上，看着对面的雪乃。

  "就是这么回事。"平冢静的声音里带着少见的疲惫，"他们没有驳回那些关于消防隐患的指控，这意味着他们认输了方案本身。但作为交换，他们要看看，敢用这种方案逼他们就范的，到底是个什么样的角色。"

  她站起身，将那份文件往雪乃的方向推了推。

  "我帮你们把这份东西带了过来。但是，去还是不去，谁去，那是你们自己的事情。我只是个跑腿的邮递员。"平冢静转过身，手放在了门把手上，顿了顿，"下周一的会议，雪之下夫人也在场。"

  说完，大门关上。

  部室里再次陷入了死寂。只有暖炉发出的微弱热气在空气中扭曲。

  一色的肩膀塌了下来，她看着那份文件，眼睛里全是慌乱："我不行的……如果是一群老师就算了，可是那些赞助商，那些PTA的理事……我只要站在那里，连话都说不利索……"

  "别说了。"

  一直沉默的雪乃开口了。

  她的声音很平静，没有颤抖，也没有歇斯底里。

  她伸出手，动作并不快，但有坚定感。她拉住了那份带有红色批注的文件的边缘。

  拇指按在纸张上，因为用力，骨节泛出苍白的颜色。

  "他们要听汇报，我们就去汇报。他们要质询明细，我们就给出明细。"雪乃抬起头，那双深蓝色的眼睛里没有任何逃避的温度，只有一片比窗外的冬雨更冷的清明，"既然泥沼已经铺好了，没有只让对方跳下去的道理。"

  她将那份文件叠好，连同那本一直没有翻页的文库本一起收进了自己的书包。

  那是她母亲下达的通牒。

  她接下了。

  【2014年2月24日 15:10 星期一|总武高会议中心第三厅】

  "……综上所述，根据预估的参与人数规模以及高层封闭场地的建筑特性，增加百分之三十的安保及消防引导预算，是规避重大安全事故的最低限度要求。"

  扬声器里的声音在挑高的天花板下回荡，带着微弱的电流杂音。

  雪之下雪乃站在长桌的一侧。她没有去碰那个鹅颈麦克风，只是双手虚按在桌沿，指尖隔着一寸的距离悬停在木纹上。

  宽阔的会议室内亮着刺眼的白炽灯。空调出风口发出低沉且持续的轰鸣。巨大的U型长桌对面，坐着十二名成年人。

  那是总武高的校方代表、活动赞助商，以及PTA的主要成员。

  一色彩羽站在雪乃左后方半步的位置。她手里抱着一沓作为备份的说明资料，从会议开始的第十分钟起，那沓资料的边缘就被捏得全是皱褶。在这个完全由成年人社会规则构筑的场域里，平时那种游刃有余的撒娇和可爱彻底失去了作用。

  "最低限度要求？"

  一名戴着金边眼镜的男性理事发出一声轻咳，他靠在皮质座椅上，把手里的文件往桌子中间推了推，"雪之下同学，你们提交的消防隐患评估确实很详实。但是，仅仅为了一个'可能发生'的情况，就要求大幅追加经费，甚至临时更换场地……从往年的经验来看，这种提案缺乏可操作性。"

  "往年的经验，是建立在参与人数只有今年预期七成的基础上的。"雪乃看着那个方向，声音没有起伏，"如果发生踩踏，'没有先例'并不能成为法庭上免责的条款。"

  那个理事皱了皱眉，对这种不留情面的反驳感到不快。他刚想张嘴继续说话。

  "哒。"

  一声脆响打断了他。

  那是金属笔管轻轻磕在硬木桌面上的声音。

  声音是从U型桌正中央传来的。

  原本还要说些什么的男性理事闭上了嘴，将视线挪开。整个会议室的空气在这声脆响后变得更加粘稠。

  雪之下夫人坐在主位稍偏一点的地方。她穿着藏青色的套装，头发一丝不苟地盘在脑后。自从雪乃站在这里开始汇报，她就一直低着头看着面前的文件，手里握着那支银色的签字笔，像是在批改一份并不怎么出色的作业。

  现在，她把笔放下了。

  雪乃的呼吸在这个瞬间停了半拍。她极力控制着肩膀的线条，不让它们出现向内收缩的痕迹。

  母亲抬起头，那双和雪乃一模一样的深蓝色眼睛看向了这边。目光里没有愤怒，没有惊讶，只有一片平静的、深不见底的审视。

  "这份说明草案，是你一个人写的吗？"雪之下夫人的声音不大，但在麦克风和音响系统的放大下，每一个字都清晰得令人发闷。

  "是基于学生会的初步构想，由我进行的风险排查和补充编撰。"雪乃回答。她的声音通过左侧的麦克风传出去，显得干涩。

  "很详实。"雪之下夫人的视线扫过纸面，"甚至可以用严密来形容。你指出的那些漏洞，确实存在。"

  一色在后面偷偷松了一口气，原本绷紧的肩膀往下塌了点。

  但雪乃没有放松。她太了解母亲了。在那种平静的语气背后，从来不会藏着单纯的赞美。

  "但是。"

  雪之下夫人微微前倾了一点身体，双手交叉放在桌面上。

  "预算我们可以追加，场地也可以按照这个方案去协调。我想问的是另一件事。"

  她直视着雪乃的眼睛，目光像是一根没有温度的钢针，挑开了那些严密的逻辑外壳。

  "你们预设了所有的最坏情况，并要求为此买单。可是，雪乃——如果满足了你们要求的资金、场地和安保，活动当天依然出现了疏漏，甚至造成了实质性的损失。到那个时候，谁来承担责任？"

  会议室里安静得连空调的风声都显得吵闹。

  "是站在那里连话都说不清楚的学生会长，还是只会把预算缺口写在纸上的你？"

  问题落在空气里。

  这根本不是一个关于财务或消防的问题。

  这是一个关于"资格"的质问。是大人们最习惯的、用现实的重量压垮年轻人理想的手段。你们觉得自己找出了问题，觉得自己比我们聪明，可当真正的后果砸下来的时候，你们这些高中生，拿什么来赔？

  一色彻底僵住了，怀里的资料有一份滑落在地，发出轻微的声响。

  雪乃站在那里。

  视线变得模糊。喉咙里像塞着一团干燥的棉花，让她发不出声音。

  "责任"这两个字，太重了。它不是一沓A4纸，也不是几个百分点的数据。母亲只用了一句话，就把她刚才那些滴水不漏的逻辑全盘否定了。

  你们还不成熟。

  这就是母亲想说的话。你们在玩一场自以为是的过家家，而能够替这场游戏兜底的，只有我们这些大人。你们甚至连承担失败后果的资本都没有。

  雪乃的视线游移。

  如果现在低下头，承认自己没有能力承担，那么这一切就会结束。预算会被批下来，但方案的实质控制权将彻底被PTA收走，奉仕部的挣扎就会沦为一个笑话。

  她的手指慢慢蜷缩起来。

  就在这时，她的视线余光扫过了会议室最后一排的旁听席。

  那里坐着两个没有发言权的人。

  比企谷八幡靠在椅背上，一条腿伸在外面，正用那种死鱼眼盯着天花板上的吊灯，脸上写满了对这场会议的厌倦。

  拉芙希妮坐在他旁边，手里端着一杯主办方提供的纸杯水，脸上的表情平静得像是在看一场事不关己的默片。但当雪乃的目光扫过去的瞬间，拉芙希妮的指尖在纸杯边缘轻轻敲了敲。

  很轻、很随意的一个动作。

  雪乃的视线重新收了回来。

  她低下头，看着自己面前那份因为长期的翻阅而边缘卷曲的A4纸。

  她伸出右手，将那页卷曲的纸角压平。拇指用力地在折痕上抹过去。

  当她再次抬起头时，眼底的那抹动摇消失了。

  "责任的界定，不应该是用来逃避问题或者互相推诿的借口。"

  雪乃的声音在会议厅里响起。没有之前的干涩，多了一份冷酷的平稳。

  "如果一切资源都已到位，却依然出现疏漏，那么责任自然在于执行层的执行不力，以及监管层的监管缺失。"

  她直视着母亲的眼睛，没有移开视线。

  "学生会是执行层，PTA和校方是监管层。谁在这个链条上出现了过失，谁就应该承担相应份额的责任。在活动尚未开始、执行尚未落地之前，就试图用一个假设的'失败结果'来逼迫某一方全盘兜底，这在逻辑上，是不讲道理的傲慢。"

  坐在两侧的几名理事发出了轻微的骚动。这种直接把PTA也划入责任链条的说法，在通常的汇报里是绝不会出现的。

  雪之下夫人看着女儿。

  那双同样深蓝色的眼睛里，情绪依然没有波澜。她看了雪乃很久，久到一色的呼吸节奏开始失控，手不自觉地攥紧了衣摆。

  "傲慢吗。"

  雪之下夫人轻声重复了一遍这个词。

  她重新拿起了那支银色的签字笔，在面前那份带有红字批注的文件上，签下了一个名字。

  "既然你们已经把权责划分得这么清楚，那就按照这个方案执行吧。"

  她把笔放下，将文件向旁边推了推，视线越过雪乃，看了一眼后排的旁听席，随后收回。

  "希望在真正的现场，你的执行力能和你的发言一样严密。"

  会议室的后半程依然在各种细节的确认中缓慢推进，但最让人窒息的阻碍已经消失了。

  几分钟后，雪乃伸出手，按下了麦克风底座上的红色按钮。

  细微的电流声被切断。

  推开第三厅那扇包裹着厚重吸音软包的木门，冷气夹杂着走廊上淡淡的清洁剂味道迎面扑来。

  雪之下雪乃走在最前面。高跟皮鞋踩在走廊厚实的地毯上，声音被吞得干干净净。一色彩羽像是一滩失去了所有水分的软泥，拖着步子跟在后面，嘴里发出毫无意义的漏气声。

  背后的两扇大门缓缓合拢。那些关于预算、责任、以及大人们相互推诿的冗长讨论，被那扇门彻底隔绝在另一个世界。

  雪乃放慢了脚步。在这个只有冷色调壁灯的走廊里，刚才在会议桌前硬撑起来的那副骨架正在慢慢松懈。紧绷了一个多小时的后背传来了隐秘的酸痛。

  "雪乃。"

  不急不缓的声音在背后响起。

  没有通过麦克风的放大，这声音听起来平静，甚至带着家常的随性。

  雪乃的脚步定在原地。那股刚要从肩膀上卸下的重量，以更加沉实、更加无法逃避的方式重新压了下来。

  "一色同学。"雪乃转过头，看着还在梦游状态的学妹，"你先去电梯口等。把资料整理好。"

  "啊……是，好的。"一色如蒙大赦，抱着那沓被捏得皱巴巴的文件，逃也似的快步走向了走廊尽头。

  雪乃转过身。

  雪之下夫人正站在几步之外的地方。她手里提着那个样式简洁的手提包，藏青色的套装在走廊偏暗的光线下显得更加深沉。那扇会议室的门已经完全关上了，她没有和其他理事一起走，而是刻意在这里停了下来。

  雪乃站在那里，没有主动靠近，也没有后退。

  "刚才在里面，说得不错。"

  母亲走近了两步，在刚好保持着社交礼仪与长辈威压边界的距离停下。

  "把PTA也划进责任链条。这种话，平时在家里可是听不到的。"她的语气里听不出褒贬，"你把学生会当成了执行的挡箭牌，把我们当成了兜底的保险柜。逻辑很完整。"

  "我只是陈述了事实。"雪乃回答。她的声音放得很轻。

  "是吗。"

  雪之下夫人微微垂下视线，看了一眼雪乃手里拿着的那份文件。那是在会议上被她签字同意的方案。

  "在会议桌上，大家为了各自的面子和台阶，可以允许你用这种带刺的方式划清界限。因为那是一场明面上的游戏。"母亲抬起眼睛，直视着雪乃，"但是，雪乃，你是不是觉得，只要拿到了这张纸，签上了那个名字，这件事就算是你自己'解决'了？"

  雪乃看着那双和自己一模一样的深蓝色眼睛。

  "我已经做出了承诺。奉仕部会协助学生会完成执行。"

  "奉仕部。"母亲重复了一遍这个词。

  她向前迈了一小步。

  这只是很简单的一步，却让两人之间的空气瞬间被抽干。那种在餐桌上、在客厅里、在雪之下家本邸无数次弥漫过的压迫感，毫无保留地覆压过来。

  "你搬出家里，住进那个公寓，然后在这个名为'奉仕部'的社团里，找了几个愿意顺着你、或者说，愿意陪你玩这种过家家游戏的同伴。"

  雪之下夫人的声音很低，低得只有她们两个人能听见。

  "你觉得，这就是你的'独立'了吗？"

  雪乃的呼吸发紧。她没有伸手去碰自己的头发，也没有去捏衣服的下摆。她强迫自己的双手自然地垂在身体两侧。

  "这并不是过家家。"

  "那就证明给我看。"

  母亲突然伸出手。

  雪乃的瞳孔微微收缩，本能地想要向后躲，但那个名为"规矩"和"体面"的枷锁把她钉死在了原地。

  雪之下夫人的手没有落在她的脸上，也没有带着任何敌意。那只手只是轻轻地搭在了雪乃的左肩上。

  这是一个极具长辈关怀的动作。

  但也仅仅是看起来像而已。

  母亲的手指隔着校服的布料，在雪乃的肩膀上轻轻抚了两下，像是在替她掸去那上面根本不存在的灰尘。

  "你在那间活动室里怎么做，那是你的自由。但不要以为，拉着别人一起站在前排，就能分担你自己的软弱。"母亲的手停在她的肩膀上，温度透过布料传来，"那个男生，还有那个金发的女孩。他们今天坐在后面，一句话也没说。"

  雪乃的呼吸彻底停住了。

  "你在利用他们给自己壮胆吗？"母亲轻声问，"还是说，你觉得只要他们还在那里看着你，你就真的可以不用再依靠家里了？"

  "我没有利用任何人。"雪乃终于反驳。声音发颤。

  "是吗。"

  母亲收回了手。她脸上的表情依然是那种无可挑剔的平静。

  "这周末，回趟家吧。你的父亲说，很久没和你一起吃过饭了。另外……"

  雪之下夫人将手提包换到了另一只手。

  "关于你那份还空着没填的进路调查表，我们也需要好好谈一谈了。"

  走廊的空气因为这句话而彻底结冰。

  "文理分科可以由着你的性子来，但以后的路，不能永远靠你临时想出来的那些'反击逻辑'走下去。"

  母亲没有等雪乃回答，或者说，这根本不是一个需要回答的句子。

  她转过身，高跟鞋踩在地毯上，发出了第一声沉闷的声响。

  "周末见。雪乃。"

  雪之下夫人向着电梯的方向走去。

  雪乃站在原地，保持着刚才的姿势。她的左肩还残留着那种触感和温度。走廊里的冷风从身侧吹过，她发现自己的掌心全都是冷汗。

  那种在会议室里凭借着数据、条例和言语反击建立起来的胜利感，在几句轻描淡写的闲话面前，碎得连渣都不剩。

  "责任"是可以被划定的，但"你还不够成熟"的审判，永远悬在她的头顶。

  她看着母亲的背影消失在走廊转角。

  过了很久，她才慢慢地长出了一口气。她试着动了一下僵硬的脖颈。

  就在这时，身后的那扇大门再次被推开。

  "热死了里面……简直就像是那种为了防止犯人翻供而故意调高温度的审讯室。"

  比企谷八幡那标志性的、带着点气无力抱怨的声音传了出来。

  "那是因为你在后排一动不动地靠着暖气口，比企谷同学。"拉芙希妮平稳的嗓音紧接着响起，"如果你愿意把扣子解开，或者站起来活动一下，也不至于产生这种错觉。"

  "不，我现在哪怕只是呼吸都觉得在消耗本来就为数不多的生命力了。"

  伴随着随意的拌嘴声，两个人从门里走了出来。

  雪乃转过身。

  八幡正一边扯着自己校服的衣领一边四处张望，视线落到她身上时，那个扯衣领的动作停顿了一下。

  拉芙希妮的手里还是端着那个早已经空掉的纸杯，翡翠色的眼睛安静地看向这边。

  走廊里的白炽灯不再刺眼了。她深吸了一口气，将拿在手里的那份卷边的文件收回到胸前，把原本僵硬的脊背重新挺直。
