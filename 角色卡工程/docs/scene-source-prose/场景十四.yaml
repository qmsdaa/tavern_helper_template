场景: 14
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月中旬 · 场景十三当晚"
地点: "拉芙希妮的公寓（美滨区）"
人物: "拉芙希妮·都柏林"
正文: |
  回到公寓时，玄关是暗的。厨房操作台擦得很干净，家政太太已经离开了。

  拉芙希妮径直走到书桌前，按下了笔记本电脑的开机键。屏幕亮起，她新建了一封邮件。

  "姐姐，暑假第二周奉仕部有一个到千叶村青少年中心的教育实习项目……"

  光标在"目"字后面闪烁。手指悬在键盘上方，停住了。

  "教育实习"。这个词显得太主动。如果是爱布拉娜看到，接下来的问题必然是："这个项目能为你提供什么实质性的增益？"如果回答不能令她满意，项目就会被定性为"无意义的社交消耗"。

  退格键被按下，整句话消失。

  "姐姐，我想请示您一件事。学校方面安排了一个……"

  她盯着屏幕上的"我想"两个字。这是一种僭越。在那个体系里，她不需要有自己的意图，所有的意图都应该是由伦敦金融城那个办公室那边打包好发送过来的。

  这两字被毫不留情地删掉。

  "姐姐，奉仕部的指导教师下达了一个不能拒绝的任务。"

  这句留下了。将动机转嫁给学校的强制力，是最稳妥的防盾。

  接下来的内容迅速在屏幕上成型：
  明确任务内容为指导小学生完成合作教育。
  限定日期边界：仅为期五天。
  附加回程时间线，保证活动结束后立刻恢复常规状态。

  没有"我想去"。没有"我很期待"。

  收件人填上了教育业务负责人温斯顿先生的邮箱地址——为整个流程包装上合规性。

  点击发送。

  随着发送成功的提示音响起，拉芙希妮合上了电脑。

  她从书包里抽出那份需要额外提交的日语现代文补习作业，整齐地压在书桌一角。

  目光扫过书架。她站起身，抽出那本厚重的《圣经》。翻开特定的一页，那颗不知名的蒲公英种子安静地躺在油墨的缝隙里。

  她没有碰它，只是看了一会儿，然后合上书本，将它推回了原位。

  在厨房给自己倒了一杯牛奶，放进微波炉加热。微波炉运转的嗡嗡声在安静的公寓里显得格外清晰。她站在中岛台前，等着那个"叮"的声音响起。

  看着中庭自己的那幅肖像画——十六岁的自己收拢着天鹅绒的披肩，雪白的羽毛解构成了一条条锁链，紧紧抓住自己。

  她揉了揉自己的眉心，让自己不去思考这些问题，她又想起了达洛维小姐送给自己的那根印着To L-Fly的钢笔和雪乃的熊猫纸巾，她忽然觉得暑假也没那么可怕了。
