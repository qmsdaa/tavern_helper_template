场景: 54
幕: "第三幕·二学期"
时间: "2013年12月16日 · 周一放学后 · 京王联合圣诞企划第一次筹备会议"
地点: "总武高第三会议室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、一色彩羽、平冢静、雪之下阳乃、折本香织"
正文: |
  周一放学后的第三会议室，暖气运转得过于充足，让空气变得粘稠且令人烦躁。在这个原本为了容纳执行委员会而显得空旷的房间里，那张巨大的U形桌此刻成了权力与压迫感交织的刑场。

  平冢静拉过一张椅子，在靠近黑板的侧边坐下，摆出一副"只旁观不干涉"的姿态。一色彩羽作为学生会长坐在主位，但她紧紧攥着笔的样子，显然已经被对面的阵仗压得毫无气场可言。

  在U形桌的对面，京王高中的代表已经落座。

  雪之下阳乃穿着一身剪裁利落的深酒红色风衣，手肘随意地撑在桌面上，嘴角挂着那抹令人熟悉的、不达眼底的温和笑容。她的目光像游走的探照灯，从进入这间屋子起，就没离开过奉仕部这边的几个人。

  而坐在她旁边那个扎着马尾、穿着海滨综合高中制服的女生，就是平冢静在周五提到的"朋友"。

  "啊——！真的假的！"那个女生刚坐下没多久，视线在扫过对面的长桌时突然顿住了，随后发出了一声响亮且充满惊奇的呼喊，"这不是小企吗？欸，我们居然在这里碰到了，这个可以有！"

  折本香织的声音在空旷的会议室里回荡，带着一种完全没被这凝重氛围影响的天然热络。

  比企谷八幡的动作在那个瞬间彻底卡壳了。

  他原本正试图把半张脸藏在竖起的衣领里，假装自己只是一件没有生命的室内摆设。听到那个阔别两年的称呼，他的肩膀猛地往下一塌，整个人几乎要滑到桌子底下去。他飞快地偏过头，视线盯住面前那份只印着标题的会议议程。他干咽了一下，喉咙里发出微弱的、类似受刑般的低哑气声，攥着圆珠笔的右手用力过度，笔尖在纸面上划出了一道深深的凹痕。

  "哎呀，原来你们初中就认识吗？"阳乃轻笑了一声，肩膀微微前倾，视线在八幡和折本之间来回打转，"这可真是太巧了。我还担心折本同学第一次来总武高会不习惯呢。看来有小八幡在，是可以放心了。"

  她把"小八幡"三个字咬得很重，带着显而易见的戏谑和恶意。

  由比滨结衣发出了短促的倒抽气声，她看着八幡那副恨不得把自己打包扔出窗外的惨状，急得想开口打圆场，却在阳乃那极具压迫感的笑容下卡了壳。

  "既然人员已经到齐，我希望各位能将注意力转移到本次会议的议题上。"

  雪之下雪乃的声音像一把带着冰碴的尺子，冷硬地切断了那股试图蔓延的叙旧气氛。她把手里的一份企划案推到了桌子中央，目光笔直地越过桌子，毫不退让地迎上了阳乃的视线。

  "这里是讨论联合跨校企划的筹备会议，不是用来交流陈年旧事的茶话会。"雪乃微微抬起下巴，语速平稳却锋利，"如果京王高中的代表打算继续把时间浪费在这种毫无意义的寒暄上，那么为了保证总武高学生会的效率，我建议终止今天的碰头。"

  一色彩羽在主位上猛地打了个哆嗦，赶紧低下头假装在研究手里的笔帽。

  拉芙希妮·都柏林坐在雪乃的另一侧，安静地看着对面那个笑容越发灿烂的女人。那种通过揪出别人最不愿面对的弱点来获取愉悦的姿态，那种用温和的语气将别人逼入死角的做法，实在太熟悉了。

  "可是，难得遇到小企嘛……"折本似乎完全没有接收到雪乃话语里的警告意味，她甚至越过阳乃，探出半个身子看向八幡，语气里满是那种未经打磨的直率，"小企，你读了总武高之后好像都没怎么变啊？还是以前那种感觉。啊，除了眼神好像更可怕了一点。欸，不对，以前好像也是这样？哈哈，这个可以有！"

  那一刻，八幡握在手里的圆珠笔发出了不堪重负的一声轻响。

  在这个暖气充足却让人感到骨底发寒的空间里，雪之下雪乃并没有顺着折本的话头再次施压。

  那双深蓝色的眼睛里没有愤怒，只有一种沉入水底般的平静的审视。她比任何人都清楚，对待这种将无知当成直率、把钝感当作热情的"伪物"，讲道理或者划定规则都是无效的。因为对方根本听不懂，甚至还会把警告当成某种有趣的玩笑。

  于是，雪乃微微将视线偏开半分，沉默地将注意力转移到了坐在她身侧的拉芙希妮身上。

  "那个……"由比滨结衣终于打破了那诡异的安静。她用手背蹭了蹭额头，挤出一个略显僵硬但依然努力保持热情的笑容，"折本同学对吧？初次见面！既然是阳乃学姐带来的朋友，那大家就是一起合作的伙伴啦。这边的会议议程其实挺赶的，要不……我们先对一下流程表？"

  这已经是结衣能想到的、最不具攻击性却又能试图把话题拉回来的方式了。

  她的话音刚落，八幡那紧绷得像拉满的弓弦一样的肩膀，微不可察地松动了半寸。他依旧没有抬头，喉结艰难地上下滑动了一下，似乎想借着结衣递过来的台阶随便敷衍一句，但当他听到折本的声音再次响起时，那些原本就少得可怜的话语又被硬生生堵了回去。

  "欸——开会这种事随时都可以嘛！"折本完全没有察觉到结衣话里的暗示，她甚至把手肘搁在桌子上，用手托着下巴，兴致勃勃地看着八幡，"小企，你现在在哪个班啊？也是在这里搞执行委员会吗？这个可以有！我们初中那会儿的班长现在也在海滨综合哦，下次要不要一起出来玩——"

  "折本同学。"

  拉芙希妮·都柏林那带着轻微口音、平缓而柔和的声音，就这样毫无预兆地切入了折本那长长的闲聊之中。

  她的语速不快，在开口前甚至还习惯性地停顿了一拍，但这短短的一句话，却有一种让空气瞬间冷却的质感。

  拉芙希妮将放在大腿上的双手轻轻抬起，交叠着放在桌面那份空白的议程表上。那条系在右手腕上的烧焦丝带，在惨白的灯光下隐隐约约。她那双翡翠色的眼睛没有看八幡，也没有看阳乃，而是专注、礼貌地平视着对面的折本香织。

  "在英国的社交礼仪中，当会议的主导方已经两次明确提出推进议程，并且有人尝试用温和的方式进行过渡时，作为客座方，如果继续坚持私人话题的延展，通常会被视为一种对合作缺乏诚意、甚至是对在场所有人时间的不尊重。"

  拉芙希妮的嘴角勾起一个浅浅的弧度，那是一个无懈可击的、标准的贵族式微笑，但眼底却没有丝毫笑意。

  "当然，我相信这是因为两国的文化差异，或者是总武高与海滨综合高中的交流方式有所不同。"她微微侧过头，目光终于落在了雪之下阳乃身上，"不过，既然作为对接人的阳乃学姐坐在这里，我想，您一定不希望京王高中的代表团，在合作的第一次碰头里，就被留下'毫无时间观念'的粗劣印象吧？"

  这一句话，不仅精准地把折本那不识气氛的闲聊定性为"无礼"，还直接把管教不严的责任扣在了阳乃的头上。

  折本香织半张着嘴，脸上的笑容僵了一下。她那总是能在任何场合找到"这个可以有"的自动接续，终于在这个金发留学生完全不留情面的礼貌压制下，卡了壳。

  一色彩羽在主位上咽了一口唾沫，原本攥着笔的手稍微松开了一些，眼神里闪过一丝不易察觉的敬畏。

  八幡握着圆珠笔的指尖终于松懈了力道，那道被划破的纸缝边缘有些翘起。他依然低着头，但呼吸声已经不再像刚开始那样沉重得令人窒息。

  雪乃安静地看着这一幕，交叠在膝盖上的双手，缓缓地放松开来。

  那是一种短暂、却又紧绷到极点的寂静。

  雪之下阳乃的眼底闪过一丝危险的光芒，她嘴角的笑意加深，那张完美的面具下似乎有什么东西正准备翻涌而出。只要给她半秒钟的空隙，她那带着毒刺的话语就能将拉芙希妮刚才建立的防线轻易撕开。

  但是，雪之下雪乃并没有留下这半秒钟。

  "咔哒。"

  圆珠笔的笔端落在桌面上，发出一声清脆的敲击声。雪乃没有去看阳乃，也没有去看拉芙希妮，而是将目光笔直地投向了坐在主位上、正试图把自己缩小成背景板的一色彩羽。

  "既然客座方已经'理解'了我们的时间观念，那么，一色会长。"雪乃的声音清晰而冷硬，不带任何商量的余地，"作为总武高学生会的代表，请你现在宣读联合圣诞企划的第一项议程。我们没有时间继续在这里消耗。"

  突然被点名的一色猛地打了个激灵，她那双原本试图装无辜的眼睛立刻瞪大，求助般地看向雪乃，又迅速瞥了一眼对面似笑非笑的阳乃和依然冷若冰霜的拉芙希妮。

  那股试图用撒娇蒙混过关的本能刚冒头，就被这三方夹击的高压气场给硬生生地碾碎了。

  "……是、是的！"一色干咽了一下，手忙脚乱地翻开面前那份企划书，那强装镇定的声音里依然带着一丝微不可察的颤抖，"那、那个，根据京王高中发来的初步草案……本次联合圣诞活动的地点，暂定在海滨公园附近的社区中心……预算方面需要……"

  随着一色有些磕磕巴巴的宣读声，会议室里那股令人窒息的闲聊气氛终于被强行冲散，取而代之的是干瘪而实际的工作条目。

  "留学生的规矩真多啊……"

  长桌对面，比企谷八幡终于把头抬高了半寸，他用那种干瘪得像缺水海绵一样的声音，极小声地嘟囔了一句。他松开了那支可怜的圆珠笔，双手插进口袋里，目光依然避开对面的折本，但那种随时准备自我防卫的刺猬状态已经褪去了一半。

  "社区中心？"

  阳乃轻飘飘地打断了一色的话，她把玩着自己那修长的手指，语气里带着毫不掩饰的挑剔："雪乃酱，如果这就是总武高学生会的效率，那可真是太让人失望了。那种只能用来办社区大妈联谊会的地方，怎么能配得上三校联合的圣诞企划呢？京王的代表们可是期待着一场真正华丽的派对哦。"

  她微微偏过头，目光再次落在了拉芙希妮身上，那笑容里多了几分挑衅："总不能让客人们觉得，我们在用对待'闲聊'的敷衍态度，来对待这场重要的合作吧？"

  面对阳乃那带有明显嫌弃意味的挑衅，雪之下雪乃连睫毛都没有颤动一下。

  她那双深蓝色的眼睛平静地注视着桌面上的企划草案，仿佛对面坐着的不是一直试图向她施压的亲生姐姐，而仅仅是一个提出不合理诉求的陌生谈判对象。

  "如果京王高中的代表团对'效率'的理解，是建立在忽视基础预算和筹备周期的前提下，"雪乃的声音冷硬得像一块刚从冰水里捞出来的石头，"那么我确实需要对贵校的工作能力重新进行评估。"

  她伸手将那份草案推到长桌中央，细长的手指点在"预算估算"那一栏上。

  "总武高能够拨给这次联合企划的预算份额，以及学生会能在期末期间投入的人力资源，都已经被严格计算并列在了这份表格里。社区中心不仅租金低廉，而且距离三所学校的通勤节点都相对适中。在有限的资金和时间下，这是获取最大收益的最优解。"

  雪乃抬起头，目光直逼阳乃那张笑容依旧完美的脸，语气里没有半分退让："还是说，姐姐认为，为了满足所谓'华丽派对'的虚荣心，我们应该去透支明年的学园祭经费，或者让高三的备考生也来帮忙布置场地？如果京王高中坚持要用那种高昂的规格来粉饰门面——"

  雪乃停顿了半秒，那不带温度的话语像裁纸刀一样利落地切下了结论。

  "——那么，超出的资金缺口，请贵校全额承担。总武高不会为毫无意义的面子工程买单。"

  会议室里的空气随着雪乃这番毫不留情的驳斥，似乎变得更加稀薄了。

  一色彩羽偷偷咽了一口唾沫，看着雪乃的眼神里除了原本的求助，又多了一丝夹杂着敬畏的恐惧。她甚至开始庆幸刚才被强行按回了主位，至少不用去直面那种级别的逻辑碾压。

  坐在对面的雪之下阳乃并没有因为被当众拂了面子而露出任何难堪的神色。

  相反，她嘴角的笑容反而扩大了几分。她轻轻拍了拍手，发出几声脆响，看向雪乃的眼神里充满了那种如同注视喜爱之物般的愉悦。

  "哎呀，雪乃酱真是越来越有长进呢，说起话来真是一套一套的，姐姐好感动哦。"

  阳乃用那种甜得发腻的声音说着，随后，她向前倾了倾身子，单手托着下巴，那双与雪乃极度相似但更加深邃的眼睛微微眯起。

  "既然总武高的'效率'是不为面子买单……那如果我说，"阳乃的声音放轻了些，却带着一种不容拒绝的诱惑和危险，"场地的赞助，以及那个'华丽派对'所需要的全部额外开销，京王都可以自己解决。或者说，由'某位朋友'的家族企业友情提供呢？"

  她那修长的手指在桌面上轻轻敲击了一下。

  "只要你们能保证，在场地的布置和流程安排上，完全配合我们的'高标准'。这样的条件，符合雪乃酱的'最优解'吗？"

  桌面上那份企划草案静静地躺在两人视线的交汇处。

  阳乃那充满诱惑力的条件抛出后，会议室里只有墙上时钟秒针走动的微弱声音。一色彩羽屏住了呼吸，比企谷八幡的目光在两人之间转了一圈，最后落在自己面前的桌面上。

  拉芙希妮坐在原位，听到"家族企业"几个字时，她的手指微微蜷缩了一下，但很快又恢复了平铺在膝盖上的端庄姿态。那翡翠色的眼眸里，闪过一丝只有同样在那种环境里浸泡过的人才能察觉到的厌恶。

  雪之下雪乃抬起眼帘，深蓝色的瞳孔里没有任何动摇。

  "'朋友'的家族企业？"雪乃冷冰冰地重复了一遍这个词，"如果我没记错，京王高中并不具备随意调动外部财团资金进行无偿赞助的特权。而那些所谓的'朋友'，也不会为了一个高中生的圣诞派对，做纯粹的慈善。"

  她微微扬起下巴，目光像手术刀一样剖开了阳乃话语里包装精美的糖衣。

  "那种需要'完全配合'的赞助，不过是变相的收购和控制。一旦接受，总武高的学生会和执行委员会就会彻底沦为那个'朋友'的免费劳动力，去执行那些为了满足某些人控制欲的冗长流程。这种名为赞助、实为转嫁劳动力的毒药，我不认为它符合任何意义上的'最优解'。"

  阳乃嘴角的笑容依然无懈可击，她并没有急着反驳，只是用手指轻轻绕着自己耳边的一缕黑发。

  "更重要的是，"雪乃的声音没有丝毫起伏，她双手交叠放在桌上，用一种宣读判决般的语气继续说道，"无论你背后站着谁的资源，你都没有资格替总武高，更没有资格替我做任何决定。"

  她伸手将那份草案拉回自己面前，用指关节压住纸张的边缘。

  "这份草案上的选址和预算，只要总武高依然作为联合企划的一方参与，它就不会被那种夹带私货的'赞助'所绑架。在双方关于责权分配和场地规格达成基于平等前提的共识之前，这项议程不可能通过。"

  她转头看向一色。

  "一色会长，这项议题暂时搁置。请继续宣读下一项不需要外部资金介入的活动流程。"

  阳乃看着雪乃那张绷得紧紧的侧脸，轻轻地叹了口气，随后发出一阵低低的笑声。她并没有暴怒，反而像个纵容妹妹胡闹的姐姐一样摊开了手。

  "真遗憾，看来雪乃酱还是这么固执呢。"阳乃慢条斯理地收回了敲击桌面的手，"好吧，既然你现在不愿意接受……那我们就先聊聊那些'不需要外部资金介入'的小事。不过，你可别后悔哦。"

  接下来的几分钟里，会议室的空气似乎稍微流通了一些。

  雪乃冷硬的表态像一堵无法逾越的墙，将阳乃那些关于场地和预算的挑刺全部挡了回去。一色彩羽磕磕巴巴地念完了前期的宣传分工，虽然听起来毫无底气，但好歹没有再被阳乃中途打断。

  阳乃单手托着下巴，百无聊赖地听了一会儿。她那修长的手指在红木桌面上百无聊赖地敲击了几下，随后，她轻轻叹了口气，拎起了放在手边的深酒红色风衣。

  "哎呀，看来今天的会议也就是这样了。全是些无聊的条条框框，姐姐我可坐不住了。"她站起身，将风衣搭在小臂上，动作优雅得像是在参加一场无趣的晚宴后准备退场。

  就在她转身即将离开长桌的瞬间，她的目光越过了正在整理文件的雪乃，精确无比地落在了低头装死的比企谷八幡身上。

  "说起来……"阳乃的声音突然放轻了，那种甜得发腻的语调重新浮现，但这一次，里面夹杂的恶意几乎快要溢出，"整天面对这些死板的工作，确实挺没意思的。小八幡，你说是吧？"

  八幡没有抬头。他手里握着的那支圆珠笔在纸面上划出了一道极短的墨痕，随后便停滞不前。

  阳乃脸上的笑容没有因为被雪乃驳回而有丝毫的褪色，反而多了一层觉得无趣的慵懒。

  "既然雪乃酱非要在这张桌子上玩这种'互相卡着脖子'的规则游戏，那我也就不奉陪了。"阳乃踩着高跟鞋，鞋跟在会议室的静音地毯上发出沉闷的声响，她走到门边，手搭在金属门把手上，却没有立刻推开，而是转过了身。

  她那双深蓝色的眼睛越过长桌，精准地落在了比企谷八幡的身上，笑容里带着一种几乎能把人切碎的恶劣温柔。

  "啊，对了。"阳乃的声音轻柔得像是在谈论明天的天气，"既然会议这么无聊，不如周末我们自己找点乐子吧？我刚好打算叫上隼人，小八幡，你和折本同学要不要一起来个'四人聚会'？"

  一直在一旁无所事事的折本香织听到这话，原本有些发僵的表情立刻生动了起来，她几乎是毫不犹豫地拍了一下手。

  "欸？真的吗？和叶山同学一起？这个可以有！"折本的视线也立刻转向了八幡，语气里满是毫无恶意的兴奋，"小企，你也一起来吧！我们好久没一起出去过了！"

  第三会议室里的暖气似乎在这一瞬间彻底失效了。

  比企谷八幡坐在那里，肩膀猛地往下沉了半寸。他没有转头去看门边的阳乃，也没有去看正兴奋地盯着自己的折本香织。他的视线钉在面前那份空白的签到表上，原本松弛在膝盖上的手指一点点收紧。

  他一言不发。从雪乃的那个角度看过去，可以清晰地看到他下颌线咬紧的坚硬线条，以及被完全压平的、没有任何起伏的胸腔。那种窒息般的沉默，比任何反驳都更能暴露出他此刻的状态。

  "咔哒。"

  门锁转动的声音传来。阳乃最后留给这个会议室的，是一声清脆的轻笑和一句"周末见咯"，随后，那扇沉重的木门将她高挑的背影彻底隔绝在了外面。

  随着主导施压者的离去，一色彩羽长长地舒了一口气，整个人像是脱力一样瘫在了椅背上。

  折本香织还在看着八幡，似乎在等一个确切的回答。

  雪之下雪乃慢慢地转过头，视线从那扇紧闭的门移开，落在了依然维持着那个僵硬姿势的比企谷八幡身上。她看到了他绷紧的下颌线，看到了他避开所有人视线的侧脸。

  雪乃伸手，拿起了桌上那支刚才被八幡松开的圆珠笔，指腹在塑料笔杆上轻轻摩擦了一下，然后，她用笔端在桌面上敲出了两声短促而清脆的声响。

  "折本同学。"雪乃的声音冷得没有任何温度，瞬间扑灭了折本香织脸上残存的兴奋，"我刚才说过了，这里不是茶话会。如果你对三校联合企划的非资金流程没有其他补充意见，你可以选择和阳乃学姐一起离开，或者，安静地坐在那里。"

  折本香织被这突如其来的冷眼刺了一下，刚刚张开的嘴又尴尬地闭上了。

  雪乃没有再分给折本半点注意力，她的目光径直穿过长桌，锁定了对面的八幡。

  "至于你，比企谷同学。"雪乃将圆珠笔丢回到八幡面前的签到表上，"既然一色会长现在连宣读草案都困难，那么接下来关于杂务分配的记录工作，就由你来负责。在会议结束，并且整理完所有书面记录之前，我不允许你离开这个会议室半步。"
