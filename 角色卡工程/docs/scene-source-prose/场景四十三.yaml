场景: 43
幕: "第三幕·二学期"
时间: "2013年11月15日 · 修学旅行第2天 · 傍晚至夜间"
地点: "洛东旅馆归途 · 洛东夜街"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
正文: |
  在拉芙希妮放慢半拍脚步的那个瞬间，雪之下雪乃彻底停下了。

  她不再满足于那种带有安全距离的侧后方审视。雪乃转过身，视线笔直地平移，认真且不容退避地对上了那双翡翠色的眼睛。

  因为距离的拉近和刻意的观察，雪乃捕捉到了拉芙希妮极力收拢在腿侧的右手。那个拇指内扣的趋向，和雷雨天里想要摩挲旧丝带的动作如出一辙，只不过这一次，它被本人用一种近乎残酷的克制力生硬地切断了。

  雪乃没有催促，也没有把这个发现点破。她只是站在洛东渐暗的天光里，用一种固执的沉默，坚持等待那个不再被礼仪包装过的真实回答。

  青石板路上，空气凝滞了几秒。

  拉芙希妮看着雪乃那双完全不打算妥协的深蓝色眼睛。她微张的嘴唇终于合拢，那层让人挑不出错处的温和假面像干涸的泥壳一样剥落，露出了底下带着防备的尖锐。

  "如果我说，"拉芙希妮的声音很轻，像是一张被揉皱后强行摊平的纸，"我只是单纯觉得那种虚伪的味道很恶心。算不算是一个合格的答案？"

  雪乃注视着她，没有立刻接话。

  "小雪乃——拉芙希妮酱——"

  前方几十米外的拐角处，由比滨结衣终于察觉到了背后的异样。她停下急促的步子，转过身用力地挥了挥手，声音远远地顺着街道传了过来，"快点跟上呀！"

  而在她们身后五六步的距离，比企谷八幡正专心致志地研究着一家町屋店铺紧闭的木格栅，仿佛那上面雕刻着什么惊世骇俗的考点。他的双手依然插在口袋里，只是左脚的鞋尖有一下没一下地踢着石板路的接缝，一副完全不想知道前面两位女生在聊什么的别扭姿态。

  雪乃收回了视线。

  "勉强及格。"她用那种挑剔但并不冰冷的语气抛下四个字，转过身，重新迈开了步子。

  京都入夜后的风带着明显的凉意，穿过町屋间的窄巷时，会将路灯的光晕吹得微微晃动。

  由比滨结衣走在拉芙希妮·都柏林的身侧，脚步比平时拖沓了许多。她没有像往常那样叽叽喳喳地寻找话题，也没有伸手去挽拉芙希妮的胳膊。在离开旅馆后的这十分钟里，她只是低着头，盯着青石板路面，像是在和自己脚下的影子较劲。

  拉芙希妮没有催促。她配合着结衣那种漫无目的的慢步调，双手浅浅地插在制服外套的口袋里，保持着一个随时可以开启交流、却又不具备任何逼迫感的平齐身位。

  "白天的时候……在二年宁坂，"结衣终于开了口，声音听起来有些发闷，带着一点点像是快要哭出来之前的鼻音，"看到小雪乃对叶山同学说那些话，还有拉芙希妮酱挡在小企前面的时候，我其实……好害怕的。"

  这句没头没尾的开场白，如果放在雪之下雪乃面前，大概会被立刻要求整理好主谓宾再行陈述；如果抛给比企谷八幡，多半会换来一句干瘪的自我贬低从而强行斩断话题。

  但拉芙希妮只是放缓了呼吸。她只是静静地走着，用这种近乎固执的沉默，给了结衣一张完整的、不会被突然抽走的倾听底片。

  "我一直都觉得，只要大家还能维持着那个圈子，哪怕有些事情不说破，哪怕气氛变得有点奇怪，只要忍一忍……就总还能像以前一样走下去。"结衣的手指在衣角处无意识地绞紧，把平整的布料揉捏出一道道死褶，"可是，当叶山同学想用那个中暑的借口把户部同学的事情糊弄过去，当他为了让大家看起来都没事，而打算让小企去背上那个最难看的锅的时候……我突然觉得那里面的空气好难闻。"

  她停顿了一下，深吸了一口稍显清冷的夜气。

  "明明知道他在撒谎，明明知道那种名为'为大家着想'的做法是在踩着别人的尊严粉饰太平……可就在拉芙希妮酱走出去之前的那一秒，我的脑子里居然还在想：'是不是只要我什么都不说，就不会有人讨厌我了'。"

  结衣的步伐彻底停了下来。她转过半个身子，那双眼睛里，此刻只剩下毫无遮拦的迷茫。

  "我是不是很狡猾？"她的声音低了下去，像是在等待一场宣判，"明明觉得不对，却又不敢第一个站出来打破它。我明明那么讨厌那种虚假的气氛，却还是本能地想要缩在里面。"

  拉芙希妮也停下了脚步。

  她的指尖在口袋的衬布边缘轻轻蹭了一下，隔着一层薄薄的布料，能感觉到那枚粉色塑料发卡边缘稍显生硬的弧度。她想起了傍晚时分，自己在洛东街道上被逼出的那句干硬的实话——她也不过是在刚才，才勉强学会了把对那股泥水味的厌恶诉诸于口而已。

  拉芙希妮没有伸出手去拍结衣的后背，那是用来安抚弱者的动作，而结衣现在需要的不是怜悯，而是被平视的确认。

  "如果因为害怕干净的水被彻底倒掉，而不得不闭着眼睛去咽下那些看起来很平静、实际上却漂浮着谎言的泥水，"拉芙希妮看着路灯下两人被拉长后微微交叠在一起的影子，声音和平时一样干燥，却不再带有那种让人敬而远之的疏离感，"那并不是因为狡猾。结衣同学。"

  结衣愣怔地看着她。

  "那只是因为，在此之前，你在这个名为维持现状的培养皿里，从来没有被允许过拥有吐出那口泥水的权利而已。"

  说完这句话，拉芙希妮没有再往下接。她安静地站在路灯下，把剩下的空间留了出来。

  结衣攥着衣角的手指没有松开。那道被绞紧后揉出的死褶，此刻正卡在她指节的第二关节处，粗粝的布料棱线硌着皮肉。

  她张了张嘴。

  夜风顺着窄巷灌进来，将路灯昏黄的光晕又一次吹得微微晃动。结衣的眼睛里，那点迷茫并没有因为拉芙希妮的话而消散，反倒像是被某种更陌生的东西替换了下来——那是一种"被允许"之后才会浮现的、不知道下一步该往哪里迈的空落。

  她的手指从死褶上松开了一半。

  然后，又停住了。
