场景: 91
幕: "第五幕·PTA→舞会"
时间: "2014年3月25日 · 周二 · 夜（春假 · 雨）"
地点: "拉芙希妮公寓"
人物: "拉芙希妮·都柏林、雪之下雪乃"
POV: "拉芙希妮"
正文: |
  钢笔的笔尖在厚实的羊皮纸上顿了一下，随着力道的加重，一滴深蓝色的墨水在纸张边缘缓慢地晕开。

  "如果你继续用'Dear Eblana'这种带有家庭妥协意味的词作为开头的话，"雪乃把视线从草稿纸上抬起来，深蓝色的眼睛里倒映着公寓茶几上方那盏吊灯冷白的光，"那么这封邀请函在被拆开的前三秒，就已经被对方在心理防线上拦截了。"

  她微微直起身，把那张写满了废案的草稿纸推到一旁，重新拿过一张空白的信纸。

  "这不只是一次普通的探亲邀请。你要让她飞过半个地球在这个时候出现在千叶，就必须在第一行字就把那种不容拒绝的强硬感建立起来。"

  拉芙希妮坐在地毯的另一侧，手里捧着一个已经失去温度的马克杯。

  昨天下午在特别栋那间部室里，平冢静头也不回地递进她手里的那个牛皮纸信封，此刻正安静地贴着她外套的内侧口袋。隔着一层布料，那截烧焦丝带的粗糙质感贴着外套内侧，和她的呼吸同一个频率。

  "对于一个习惯于掌控时间表的人来说，"拉芙希妮把马克杯放在桌垫上，指尖顺势摩挲了一下杯沿，"生硬的措辞反而会引起防备。姐姐不需要看第一行字，她只要看到寄件人是我的名字，就会自动戴上那副'审视猎物'的滤镜。"

  她想起了去年在成田机场的到达大厅，爱布拉娜只是在原地站定，用那种轻描淡写的语气评价她的迟到——那种不容置疑的空气重量。

  "这就是为什么，关于发送方式，我们需要重新评估。"雪乃把钢笔的笔帽盖上，发出极轻的一声"嗒"，"邮件是绝对不可行的选项。"

  拉芙希妮抬起眼。这个提议不在她的预判之内。

  在过去十几年被操控的经验里，她已经习惯了用应急邮箱接收那些带有隐喻和警告的指令。不管是深夜泡澡时突然弹出的行程表，还是在酒店里被敲定的越洋通话，数字信号的即时性一直是爱布拉娜最常用的牵引绳。

  "她习惯用邮件向你下达指令，因为那代表着效率、远程和不可逃避。"雪乃指了指旁边那台正处于休眠状态的笔记本电脑，"如果用电子邮件发送邀请函，它首先会经过艾米丽的初筛，然后再以一种被处理过的工作信息的形态进入她的视野。在那条信息流里，你依然是被管理的从属者。"

  雪乃把手压在刚才那张空白的羊皮纸上，手腕细得只剩骨节的轮廓，但这并不妨碍她此刻散发出的那种审判官式的强硬。

  "纸质的信件。"雪乃一字一句地说，"用国际加急件，直接寄到翡翠资本的总裁办公室，或者都柏林庄园的私人书房。"

  拉芙希妮没有立刻回话。

  空气里只有空调运转时发出的微弱嗡嗡声。窗外的细雨打在玻璃上，把这座公寓与外面的千叶街道彻底隔绝成了一个密闭的空间。

  "在现今这种只要几秒钟就能传递信息的社会里，一封需要跨越物理距离、贴着邮票、还要经过数道人工转运的纸质信，本身就代表着一种惊人的代价和不合时宜的执拗。"雪乃看着她，眼神并没有因为分析的深入而变得锐利，反而透出一种沉甸甸的托付感，"它需要对方亲手拿起拆信刀，割开封口，把纸抽出来。在这个过程里，她无法用鼠标点击'已读'来敷衍。"

  雪乃停顿了一下，视线落在那叠昂贵的信纸上。

  "只有实体的纸，才能逼迫她感受到那个不在她预想中的重量。"

  拉芙希妮放在腿上的右手缓缓收紧。指节隔着外套布料，再次压上了那个信封的轮廓。

  雪乃的逻辑推导严密，甚至带着一点属于奉仕部部长那种不近人情的苛刻。但拉芙希妮知道，这看似冷酷的推演背后，是怎样一种笨拙的支撑。

  雪乃并不知道她口袋里藏着平冢老师交还的那截烧焦的丝带——属于过去的东西。但雪乃的直觉却精准地找到了唯一能承载这份对峙的途径。

  眼眶一阵酸涩。她眨了一下眼，把那层水汽逼回去。在这座曾经每个角落都像被什么盯着的公寓里，她很少允许自己这样。

  她看着雪乃因为反复推敲语法而微微皱起的眉头，看着那张被钢笔墨水划出深深折痕的草稿纸。在这个瞬间，远在伦敦的爱布拉娜那种庞大得让人窒息的阴影，被眼前这个固执地坚持使用羊皮纸的同桌撕开了一个口子。

  "而且，"雪乃把草稿本扯了回来，重新拔开笔帽，声音里带着一点不明显的恼火，"你刚才把'诚挚地邀请您莅临'拼错了两个字母。如果这也算是一种抵抗的方式的话，我只能说这种粗心大意简直比直接投降还要丢人。"

  拉芙希妮深吸了一口气，把涌到喉咙口的酸涩压了下去。

  她把手从藏着信封的口袋里拿出来，拿起桌上另一支放在笔架上的钢笔。

  "抱歉。"拉芙希妮在信纸的边缘轻轻写下了一个正确的单词前缀。

  "ap——"

  笔尖在羊皮纸上勾勒出前两个字母，发出细微而干涩的沙沙声。拉芙希妮的手腕仍然绷得很紧。即使已经确定了要用这种最原始、最笨重的方式去迎击那片庞大的阴影，但在真正要将邀请函的每一个字敲定在纸面上时，那种被多年训练刻入骨髓的肌肉记忆依然在试图夺取控制权。

  就在她准备写下第三个字母的时候，一只微凉的手覆了上来。

  很轻，带着一点属于室内空调的冷意，但掌心却贴得很实。雪乃的手越过那张被墨水划满折痕的草稿纸，不经意地按在了她握着钢笔的右手上。

  拉芙希妮的动作停住了。她没有转头，视线依然落在那半个单词上，但呼吸的节奏却在这一刻被打乱。

  "你不必这么紧绷。"

  雪乃的声音放得很低，低得与窗外的雨声缠在一起。没有了平时那种严厉纠错的部长语调，这句话听起来甚至有些生涩。

  她的手指只是停留在那儿，没有进一步收紧，也没有立刻抽离。这是一种完全不同于爱布拉娜那种"把手放在肩上以宣告所有权"的接触。这只是单纯的支撑——只要这样放着，就能把那片来自大洋彼岸的空气重量顶回去一点。

  拉芙希妮能感觉到雪乃指侧微微的薄茧——那是常年握笔和翻书留下的痕迹。

  手腕里的那根原本绷得像要断掉的弦，突然就松了下来。那种因为过度紧张而产生的胃部痉挛感，在掌背传来的微小压迫感中平复了下去。

  拉芙希妮深吸了一口气，原本紧捏着钢笔的手指松了半圈。

  "这种书写方式太消耗体力了。"拉芙希妮轻声说。

  她感受着手背上尚未离开的温度，笔尖重新落在纸面上，顺着刚才的字母继续往下写。

  "apprieciate."

  写完这个单词，钢笔的笔尖悬停在纸面上方不到三毫米的地方。墨水在羊皮纸的纹理中慢慢干涸。

  空气里突然有长达五秒钟的绝对安静。

  那只覆在拉芙希妮手背上的手没有动。但拉芙希妮能感觉到，雪乃的食指微不可察地蜷缩了一下。

  "……拉芙希妮同学。"

  雪乃的声音在耳边响起，刚才那种难得的、低沉的安抚感已经荡然无存，取而代之的是一种极力压抑着什么的平稳。

  "我在。"拉芙希妮看着纸面，语气里甚至带上了一点无辜。

  "如果我没有记错的话，"雪乃的视线钉在那个单词上，"appreciate这个词中间，不应该多出一个'i'。"

  "啊，"拉芙希妮发出一声轻巧的感叹，笔尖在那个多出来的字母下方点了点，"确实多了一个。"

  "刚才把'莅临'拼错，还可以用紧张和粗心来勉强解释。"雪乃的手终于从拉芙希妮的手背上移开，但并没有收回去，而是顺势在旁边的桌沿上轻轻敲了一下，"但在这两分钟之内，在同样的语境下，连续犯下这种连初中生都不会犯的拼写错误——"

  雪乃停顿了一下，转过头看着她。深蓝色的眼睛里倒映着客厅炽热的灯光，那里面没有真正的恼怒，反而透出一种被戳穿了笨拙安抚后的羞恼。

  "如果是故意的，这种拖延时间的方式简直劣劣到了极点。"

  拉芙希妮没有反驳。她甚至没有把那张写废了的纸抽走。手背上虽然失去了刚才的温度，但那种被戳穿了小动作后的隐秘愉快感，却让这间一直被监控错觉笼罩的公寓变得触手可及。

  "只是突然发现，如果写得太快的话，"拉芙希妮把笔搁在笔架上，身体向后靠了靠，"雪乃同学的手可能就会收回去了。"

  雪乃的肩膀僵了一下。

  她看着拉芙希妮那种不加掩饰的、甚至带着理直气壮的坦诚，刚才准备好的那些关于"逻辑"、"效率"和"责任感"的词汇，忽然全部堵在喉咙里。

  "……这跟写信的速度在逻辑上没有任何关联。"雪乃把脸转回桌面，声音干涩地反驳，但耳尖却泛起了一点明显的红色。

  她伸手把拉芙希妮面前那张因为故意拼错而彻底作废的羊皮纸扯了过来，团成一团，准确地扔进了旁边的纸篓里。

  "如果你打算用这种方式来试探我的底线，那我不得不提醒你，羊皮纸的库存是有限的。"雪乃重新抽出一张崭新的信纸，将它展平在拉芙希妮面前，又拿过自己的那支钢笔，"在这个词上浪费的这五分钟，毫无意义，而且极度缺乏效率。"

  拉芙希妮安静地看着她。看她一边用那种生硬的语气说着教训的话，一边把信纸的边缘对齐桌面，然后用手指把纸面上的微小折痕抚平。

  这种被纠正、被挑剔、甚至被"训斥"的过程，在过去的人生里只会让拉芙希妮感到窒息。但现在，坐在这里，听着雪乃用那种其实并没有多少威慑力的声音强调效率，她的肩膀往下沉了一寸。

  "抱歉。"拉芙希妮重新拿起钢笔，"不会再写错了。"

  雪乃没有看她，只是盯着那张空白的纸。

  "最好是这样。"雪乃低声嘟囔了一句。她的手依然搭在桌子上，离拉芙希妮的手腕只有不到五厘米的距离。在接下来的十几分钟里，她都没有再把手收回自己的膝盖上。

  全新的羊皮纸平摊在桌面上。

  雪乃的手依然搭在距离纸张边缘只有几厘米的地方。她的手指自然地蜷曲着，指腹贴着木质桌面。室内空调的微风吹过，把她身上那种极淡的洗发水香味带了过来，很好地冲淡了空气里因为回忆而泛起的霉味。

  "如果你的视线还要在我的手背上停留超过五秒钟，我会有充足的理由怀疑，你刚才的保证只是一种缺乏诚意的敷衍。"

  雪乃的声音在耳边响起。她没有转头，视线盯着那张空白的纸，但那种能精准捕捉到走神的直觉毫无破绽。

  拉芙希妮眨了一下眼睛，把目光从那只手上收了回来。

  "因为雪乃同学靠得这么近，注意力不太容易集中。"拉芙希妮握着钢笔，语气诚恳，"不过，不去想就好了。"

  "……那就请你立刻停止思考，把注意力转移到你的笔尖上。"雪乃的呼吸微微停顿了一下，随后用食指的指节在桌面上轻轻敲了两下，"这封信是在向对方确认时间、地点和必须到场的期限。这不是什么文学创作，不需要你在这上面发挥多余的联想能力。集中精神，把那些单词准确地写上去。"

  敲击桌面的声音很轻，却像一道校准信号，把拉芙希妮飘忽的思绪强行拉了回来。

  拉芙希妮没有再说话。她深吸了一口气，钢笔的笔尖终于落在了纸上。

  沙——沙——

  房间里只剩下笔尖滑过羊皮纸粗糙纹理的声音。

  在雪乃无声的注视下，那些原本在脑海中像泥沼一样搅在一起的英语单词，开始一行行地变成纸上的深蓝色墨迹。

  这是一封写给爱布拉娜的信。不需要委婉的问候，也不需要那些用华丽辞藻堆砌出来的虚伪关怀。信的内容直白，直白到挑衅。这是总武高这边定下的底线。要求她在高三开学前，亲自降落在这个名为千叶的地方。不是通过越洋电话，也不是通过那些冰冷的指令邮件。

  拉芙希妮的肩膀不由自主地绷紧了。

  哪怕只是写下这些代表着反抗的词句，她都能感觉到那种从小被反复揉捏、训导出的恐惧感正在沿着脊椎往上爬。写"arrive"这个词的时候，指关节因为用力过度而泛白；写到具体的日期时，呼吸变得短促。

  但那只手依然停在旁边。

  雪乃什么都没说，只是坐在那里。当拉芙希妮的笔迹出现不稳的颤抖时，雪乃就伸手把纸张边缘压平一点，或者顺手把旁边那个快要空掉的马克杯往外推一推，腾出更多书写的空间。

  这种没有实质性帮助的动作，却像一根物理上的定海神针。

  拉芙希妮感觉到那种熟悉的胃部痉挛被硬生生地压了下去。她顺着雪乃压住纸页的那个方向，把最后一行关于"逾期不候"的客套话写完。

  正文结束。羊皮纸的右下角留下了一片空白。

  那是留给署名的地方。

  拉芙希妮的手停了下来。钢笔的笔尖悬在纸面上方。她的视线落在那片空白上，脑海里突然涌出很多声音。那些在都柏林宅邸里回荡的、要求她隐去自己的面容、只作为影子的声音。

  只要写下这个名字，就意味着这封信具备了效力。这不再是一场单方面的逃避，而是真正的"邀请"。

  那支钢笔在指间压出了不该有的分量。笔尖上的墨水聚成一小滴，悬在纸面上方，随时可能砸下来，弄脏刚才花了十几分钟才写好的整张纸。

  她迟迟没有落笔。

  旁边传来衣料摩擦的细微声响。

  雪乃稍微侧过身。她没有像刚才那样用言语来催促，也没有出声询问"怎么了"。她只是安静地看着那片空白。

  随后，雪乃伸出了右手，食指的指尖越过纸张的边缘，准确地落在了那片留白的中心。

  指甲修剪得很干净，指尖点在羊皮纸上，发出极轻的"笃"的一声。

  "落款。"雪乃的声音很轻，没有任何情绪上的起伏，甚至听不出一丝严厉，只有一种近乎冷淡的陈述感，"写在这里。然后把它装进信封。"

  不是安慰，也不是催促，而是给她定下了一个坐标。

  拉芙希妮看着那根停留在纸面上的食指。指尖压着的那个位置，刚好是整个信件排版最完美的地方。

  原本僵硬的手指重新找回了知觉。所有的恐惧和自我怀疑，都在这个精准的坐标面前被强行切断。既然已经有人把位置指给她看了，她需要做的，只是把笔放下去。

  拉芙希妮握紧了笔杆，向着雪乃指尖旁边的位置挪了过去。

  雪乃的手指停留在那里，直到钢笔的笔尖在羊皮纸上划出第一个大写字母的优美弧线时，她才不着痕迹地把手收了回去。

  "Loughshinny Dublin."

  最后一个字母的收尾勾过羊皮纸的纹理，停顿，提笔。

  深蓝色的名字终于稳稳地落在了那里。带着一种连拉芙希妮自己都觉得陌生的清晰与锋利。

  拉芙希妮把笔搁在笔架上。手指离开金属笔杆的那一刻，手心里出了一点细汗。

  "写完了。"她轻声说道，没有转头去看雪乃的表情。

  "从排版的角度来说，勉强算是及格。"雪乃把视线从那个名字上移开，"如果没有在中间停顿那十几秒，这份信的墨色深浅会更加均匀。"

  虽然说着挑剔的话，但拉芙希妮能听出那里面并没有真正的责备。

  雪乃站起身，把那张写满字的羊皮纸小心地拿了起来，对着灯光吹了吹上面还没有完全干透的墨迹。

  "趁墨水还没干透——"

  拉芙希妮已经从茶几旁边站了起来。她走向书桌最下面那个抽屉，拉开。抽屉轨道发出陈旧的摩擦声。

  她从抽屉深处拿出一叠崭新的牛皮纸信封。在关上抽屉的时候，外套内侧的口袋轻轻压了一下她的肋骨——平冢老师昨天塞给她的那个旧信封，还在那里。

  她把新信封放在茶几上。和口袋里的那个，是同一个尺寸。

  她没有伸手去碰口袋。
