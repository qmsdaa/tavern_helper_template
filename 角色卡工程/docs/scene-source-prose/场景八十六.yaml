场景: 86
幕: "第五幕·PTA→舞会"
时间: "2014年3月21日 · 周五（春分の日）· 19:40"
地点: "拉芙希妮公寓"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡"
正文: |
  "刷啦。"

  柔软的羊毛刷扫过颧骨，带起几粒肉眼难以捕捉的散粉，在梳妆台明亮的镜前灯下短暂地浮空，随后又落回深色的实木台面上。

  雪之下雪乃微微弓着背，左手扶着转椅的靠背，右手捏着那根黑杆化妆刷，视线在镜子里的映像和眼前这张脸之间来回比对。

  这是一张经过近一个小时修饰后，挑不出任何瑕疵的脸。浅金色的长发被暂时用发夹挽在脑后，露出了修长白皙的颈部线条。在这个光线下，拉芙希妮闭着眼睛的侧脸呈现出透明的质感，连睫毛的阴影都显得根根分明。

  "那个橘调的其实也可以。"

  从房间另一头靠窗的沙发上，传来比企谷八幡干瘪的声音。他正盯着手里那本旧文库本，连头都没抬一下。

  "比企谷同学，如果你对'橘调'和'珊瑚红'的色彩阈值停留在只能分辨红绿灯的程度，我建议你继续看你的书，或者去厨房确认那壶水到底烧开了没有。"

  雪乃连转头确认的动作都省了，直接用同样平板的语气封死了对面的话头。

  沙发那边传来书页翻动的沙沙声，然后是一声叹息。"反正明天晚上的礼堂灯光一打，不管是珊瑚还是橘子，在底光里都会变成一片反光的白板。再说了，主色调早就定下来了，现在纠结这一点点色差……"

  "舞会的灯光布置是冷暖光源交替的阵列。如果在强冷光下使用偏黄的橘调，只会让整个人看起来像是患了罕见的黄疸疾病。"

  雪乃用刷子柄轻轻敲了一下梳妆台的边缘，结束了这场对话。

  她重新把注意力放回眼前。拉芙希妮听着他们的拌嘴，并未睁开眼睛。她那只搭在膝盖上的右手，拇指正无意识地来回摩挲着手腕上那根暗红色的烧焦旧丝带。

  雪乃收起刷子，从台面上拿起一支口红，拔掉外壳。"稍微仰一下头。"

  拉芙希妮顺从地仰起下巴。

  灯光打在她的喉部和锁骨上，皮肤的纹理在白炽灯下显出薄瓷般近乎透光的质地。雪乃拿着口红的手悬在半空，准备做最后的提色。

  "……平冢老师，明天之后就要调走了。"

  拉芙希妮的声音很轻。这并不是一句疑问，也没有任何起伏的情绪前奏，就像是在陈述窗外刚刚驶过了一辆电车那样普通。

  但房间里翻书的声音瞬间停止了。

  雪乃拿着口红的手僵在距离那双嘴唇不到两厘米的地方。指管传来的重量压进她的掌心，从自己手腕处蔓延开的酸麻顺着小臂一路攀上来。

  "校方关于外籍学生的住宿及行为担保，"拉芙希妮慢慢睁开眼，翡翠色的瞳孔在光线下蒙着一层薄薄的失焦，"一直是平冢老师在利用教员的职权做隐性背书。三月份一旦调离名单公示，这项背书就会失效。"

  她停顿了一下，视线从镜子里越过雪乃的肩膀，看向虚空中的某个点。

  "如果在接下来的核查里找不到新的、具有足够分量的在地担保，她不需要动用其他的强制手段。"她终于把视线收回来，重新落在那层水银涂层里，"只需要一封校方发送的退学建议函，我就必须回英国了。"

  水壶在厨房里发出一声尖锐的气哨声，水烧开了。但在这间卧室里，没有人起身去关火。

  拉芙希妮转过头。

  她偏转颈部的动作牵动了衣领，梳妆台的灯光顺势切过了她的侧脸。

  在这个瞬间，雪乃看着眼前的拉芙希妮。那层精心铺设的底妆、点缀着珊瑚红的唇角、被发夹束缚的金发，还有那双即便说出这种话也依然维持着体面和从容的眼睛。

  画面突然在雪乃的脑海里重合了。

  那是每次来到这间公寓时，都会在玄关侧墙看到的那个物件——那幅装裱在沉重画框里的肖像画。

  画上的少女被厚重的羽毛紧紧包裹、束缚，只有一半的面容从那些羽毛里挣脱出来。画里那种阴冷的压抑感，和少女本身如同工艺品般的圣洁感交织在一起，形成了一道无法被打破的结界。

  眼前化好了妆的拉芙希妮，和那幅画里的少女完全重叠在了一起。

  精致。从容。毫无破绽。

  还有那种只要用力一碰，就会彻底碎掉的单薄。

  "呲——"

  因为拉芙希妮转头的动作，雪乃僵在半空的那支口红，前端的膏体不偏不倚地擦过了拉芙希妮敞开的锁骨上方。

  一道极浅、极细的红色印记，像是尖锐的瓷器裂纹，出现在了那片白皙的皮肤上。

  拉芙希妮微微垂下眼，看了一眼锁骨上的那道红痕，并没有伸手去擦。

  "看来，我确实不太适合这种颜色。"她的语调依然平缓。

  雪乃咬住了下唇的内侧。她能尝到一点铁锈般的血腥味。

  她没有后退，也没有把视线从那道红痕上移开。她伸出左手，大拇指的指腹直接压在了那个红色的印记上，顺着皮肤的纹理，用力地向下抹去。

  膏体被指温晕开，在锁骨上留下了一片红色的阴影，反而在那份圣洁感上撕开了一个更显眼的破口。

  "这不属于校方的行政范畴。"雪乃的声音比平时低了半个音阶，甚至带上了一点鼻音，"只要你还能在这个舞台上提供足够的'作用'，没有人能单方面发出一份退学建议函。"

  她收回弄脏的拇指，从台面上抽出一张卸妆湿巾，递到拉芙希妮面前。

  "擦掉。然后抬起头。"雪乃重新拿起口红，目光死死地盯着拉芙希妮的眼睛，"明天的舞会，你最好别顶着这种会让人觉得可怜的脸出现。"

  八幡在沙发的阴影里站了起来。

  他把那本旧书随手扔在坐垫上，发出一声沉闷的声响。

  "水开了。"他转过身，背对着梳妆台的灯光，朝着厨房走去，"我去拔个电源。你们最好快点，不然水倒进杯子里的时候可能就不够烫了。"


  【2014年3月31日 19:40 星期一|拉芙希妮公寓|微凉|凝滞】
  那块湿冷的无纺布压上了锁骨。

  卸妆液的触感渗透进皮肤的纹理，紧接着是指腹隔着薄布施加的力道。雪乃弯下腰，靠得很近。她的目光完全钉在那片被晕开的珊瑚红印记上，右手捏着卸妆巾，一点一点地向下擦拭。

  摩擦带来轻微的刺痛感。拉芙希妮靠在椅背上，微仰着脖颈，没有躲避。

  从这个角度，她能看见雪乃低垂的睫毛，以及被走廊灯光勾勒出的紧绷的下颌线。雪乃擦得很用力，似乎那是一旦留下就会立刻生效的判决书。她左手撑在拉芙希妮的座椅扶手上，指节因为过度用力而泛着不正常的青白，袖口随着动作偶尔会蹭过拉芙希妮的手臂。

  呼吸声在极近的距离交错。带着克制的急促。

  随着卸妆巾的移动，那片红色的膏体逐渐变淡，而皮肤因为反复的擦拭开始泛起另一种真实的、带着些微灼热感的粉红。

  雪乃的动作终于慢了下来。

  她盯着那片终于恢复干净的皮肤看了一会儿，像是确认了危险被彻底清除，然后直起身，把那张沾着红色的无纺布团成一团，准确地扔进了梳妆台旁的纸篓里。

  拉芙希妮低下头，拉了拉偏移的衣领。

  "姐姐手里的牌，不只有这一张。"她看着镜子里雪乃整理衣服下摆的倒影，声音很干，"她很清楚我在总武高能接触到的所有人。即使是退学建议函，也只是她切断我所有后路的第一步。"

  厨房里传来燃气灶旋钮被拧死时沉闷的"咔哒"声。

  紧接着是水壶被拎起，滚烫的开水注入瓷杯的声响。水流撞击杯底，在这个安静到发紧的公寓里，清晰得刺耳。水倒满了，但没人走出来。那边只有几声杯底磕在台面上的细碎碰撞声，然后是死一样的静默。

  雪乃站在原地，把那支沾了指纹的口红重新盖好。

  "既然她用的是行政手段，"雪乃握紧了那支黑色的塑料外壳，"那就能用同样的途径堵回去。"

  拉芙希妮抬起眼睑。"你的意思是……"

  "平冢老师明天依然是总武高的教员。"雪乃的语速变快了，带着那种处理社团委托时特有的、让人无法插嘴的主导感，"只要她在离职前的流程里还留有权限，或者还能在这份名单的移交上做文章，这封建议函就发不出来。"

  她转过身，深蓝色的眼睛对上拉芙希妮的视线。

  "在明天的舞会结束之前，你依然是总武高2年J班的学生。"雪乃把那支口红"啪"地一声放回台面，"我不接受任何在流程结束前的'认命'。既然这是她布置的棋局，那就把棋盘掀掉。"

  拉芙希妮看着她。

  那个站在梳妆台灯光下的人，明明手指还在发僵，语气却强硬得像块石头。拉芙希妮右手拇指停下了摩挲那根焦黑丝带的动作。锁骨上刚被擦拭过的地方还在发热，那种粗暴但真实的温度，就这么硬生生地楔进了她原本已经设想好的、冰冷的告别程序里。

  "……我知道了。"拉芙希妮收回视线，看着台面上那些瓶瓶罐罐，"如果你坚持要增加这种无谓的工作量的话。"

  走廊的阴影里终于传来了脚步声。

  八幡端着两个冒着白气的马克杯走了出来。他的肩膀塌着，眼睛半睁半闭，刚才在厨房里像是进行过什么极耗体力的劳动。

  他把其中一个杯子放在梳妆台边缘，另一个递向雪乃的方向。

  "白开水。"他干巴巴地说，"没找到茶叶在哪。反正用来烫死那些没用的胡思乱想，温度应该刚好够了。"
