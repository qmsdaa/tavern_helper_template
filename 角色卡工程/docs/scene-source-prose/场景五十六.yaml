场景: 56
幕: "第三幕·二学期"
时间: "2013年12月中下旬 · 联合彩排日（推定 2013/12/23 周一放学后 or 2013/12/22 周日）"
地点: "总武高室内体育馆 · 京王联合圣诞舞台剧彩排场地"
人物: "拉芙希妮·都柏林、雪之下阳乃（+背景：奉仕部其他成员、一色彩羽、执行委员会成员、各班志愿者）"
正文: |
  室内体育馆顶部的巨大卤素灯将光线惨白地投射在木质地板上。执行委员会和各班志愿者搬运纸箱、拖拽电缆的声音在空旷的场馆内回荡，形成一阵阵令人烦躁的低频噪音。

  拉芙希妮站在靠近后台通道的边缘区域，手里拿着那份被修改过多次的预算表。她刚指点完两名负责搬运折叠椅的一年级生将椅子码放到指定位置，试图在这片混乱中维持一种属于她的秩序。

  "这块区域的调度，比我想象的还要有条理呢。"

  一个带着笑意的声音毫无预兆地从右后方传来。拉芙希妮的肩膀微不可察地停顿了半秒。

  雪之下阳乃不知道什么时候已经穿过了那些忙乱的志愿者，悄无声息地站到了距离拉芙希妮不到半米的位置。她今天穿了一件米色的高领毛衣，外面套着一件剪裁利落的黑色风衣，那种从容不迫的姿态与周围满头大汗的高中生形成了极其刺眼的对比。

  阳乃微微偏着头，深蓝色的眼眸透过拉芙希妮那头浅金色的长发，肆无忌惮地打量着她的侧脸。

  "上次在会议室里，我也觉得很有趣。"阳乃的声音轻柔得像是在分享什么秘密，却精准地越过了社交距离的红线，"你那种把资料推过去的动作，虽然在大人眼里稍微有些生涩，但也算是很漂亮地挡在小八幡前面了。"

  那是一种极其熟悉的、令人窒息的审视感。

  拉芙希妮觉得后颈处的皮肤有些发凉。阳乃说话的语调、那种似乎能看透一切伪装的笑意，甚至是那种居高临下的压迫感，都与远在英国的爱布拉娜如出一辙。那封警告"不要妄图建立屏障"的邮件内容，再次像针一样扎回了她的神经里。

  她没有立刻转过身。拿着预算表的那只手，大拇指无意识地向后蜷缩，指腹轻轻按在右手袖口下那截烧焦的旧丝带上。丝带粗糙的触感在那一瞬间成为了某种微弱的锚点，将她即将溃散的理智稍微拉回了这间喧闹的体育馆。

  "只是出于维持会议流程的必要举措。"拉芙希妮终于转过身，迎上了阳乃的视线。她的声音很平稳，没有表现出阳乃所期待的那种慌乱，"如果场地布置没有其他问题，我想您可以去主席台那边看看，负责音响的同学似乎遇到了一些麻烦。"

  阳乃并没有因为这种礼貌的驱逐而退开。相反，她脸上的笑容变得更加明显了，甚至带上了一种发现新玩具般的愉悦。

  "原来如此，'必要举措'啊。"阳乃拉长了语调，目光慢条斯理地从拉芙希妮那张过于平静的脸上滑过，"明明连呼吸都要经过精密的计算，却还要假装自己真的拥有那种名为'从容'的东西。你这件'工艺品'，真的是越来越让我觉得……有继续观察的价值了呢。"

  阳乃微微压低了身体，那股夹杂着高档香水味的压迫感再次拉近了距离。她的视线从拉芙希妮护在袖口的位置扫过，仿佛能透过布料看到那根烧焦的旧丝带。

  "我知道你的顾忌哦。"阳乃的声音淹没在周遭搬运器材的嘈杂声中，却清晰地落进拉芙希妮耳里，"也知道你最不想被别人知道的事情。比如……那个把你塑造成现在这副完美模样的源头。"

  她伸出一根食指，轻轻点在拉芙希妮拿着的那份预算表边缘，像是在拨弄着某种易碎的机关。

  "所以，你想选哪一种呢？是继续留在那道虚假的屏障后面，还是……让我帮你在别人面前撕开它？告诉我嘛。"阳乃微微歪头，嘴角的弧度恰到好处，仿佛只是在询问要不要一起喝下午茶。

  那张单薄的预算表在两人之间发出了轻微的沙沙声。拉芙希妮没有后退。她大拇指从袖口处松开，那截烧焦丝带带来的粗粝质感似乎已经传递到了掌心。

  "如果您觉得，用这种方式就能看到我失控的样子，那您可能要失望了。"

  拉芙希妮抬起头，浅金色的发丝随着动作微微晃动，她的声音里没有愤怒，只有一种常年浸泡在冰冷规矩里打磨出的干燥。

  "阳乃学姐，您其实很无聊吧。"

  阳乃点在预算表上的食指停住了。

  "那些高高在上的审视，还有这些看似能看透人心的试探。"拉芙希妮看着那双深蓝色的眼眸，语速平稳而清晰，"您说我是'工艺品'，那是因为您比任何人都熟悉这种被修剪的滋味。您把这种恶趣味当成从容，但实际上，那只是您用来掩饰自己无法反抗的代偿而已。"

  拉芙希妮将那份预算表从阳乃指尖下抽了出来。

  "您不敢真正违抗那些给您定下标准的人，所以只能通过拨弄身边的人——比如雪乃同学，或者现在试图拨弄我——来获取那一点点可怜的控制感。"她用那种近乎悲悯的平静视线看着阳乃，"在这个体系里，我们都是不敢掀翻桌子的弱者。区别只在于，我正在努力学会说不，而您，还沉醉在那个'完美长姐'的剧本里不可自拔。"

  体育馆里有人因为接错线路而发出了一声惊呼，随之而来的是一阵短暂的混乱。
