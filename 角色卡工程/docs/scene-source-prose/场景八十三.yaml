场景: 83
幕: "第五幕·PTA→舞会"
时间: "2014年3月2日 · 周日 · 傍晚"
地点: "千叶市美滨区 · 拉芙希妮公寓（玄关→客厅）"
人物: "拉芙希妮·都柏林、雪之下雪乃（+ 提及：一色彩羽、比企谷八幡、由比滨结衣、平冢静、雪之下母）"
正文: |
  视线里是大理石墙面上扭曲的倒影。

  雪乃站在那排闪着微光的公寓对讲机前，手指悬在半空，指尖被风吹得发红。她看着倒影里自己僵硬的肩膀，还有那被大衣包裹着的、透着一股局促的姿态。

  十分钟前，她像逃兵一样从电车上下来，盲目地跟着直觉换乘了开往美滨区的线路。脑子里那些乱七八糟的纠结、关于母亲的聚餐通知、关于牵连同伴的负罪感，在那十分钟的步行里被冷风吹成了一团死结。

  等她回过神的时候，人已经站在这栋高档公寓的楼下了。

  手指离那个呼叫按钮只有不到两厘米的距离。只要按下去，就能听到扬声器里传来的、那带着几分冷清和克制的"哪位"。

  可是，按下去之后呢？

  那个问题像是一堵透明的墙，结结实实地挡在她的手指前面。

  "突然想起来有个关于下周活动的细节需要确认……"

  太假了。连由比滨那种笨蛋都不会相信这种要在周末下午顶着冷风特意跑一趟的借口，更别提是拉芙希妮了。那双翡翠色的眼睛会越过这句干瘪的台词，直接看见她藏在后面的慌乱。

  "今天天气还不错，刚好路过这里，就来看看……"

  更蠢了。这种只会在三流轻小说里出现的台词，怎么可能从她的嘴里说出来。而且这里是美滨区的高档住宅区，没有任何可以"路过"的商业街或是散步路线。特意跨越了几个街区"刚好路过"，就像是在承认自己别有用心。

  "其实，关于我母亲下周末的那个决定……"

  不行。

  雪乃猛地把手收了回来，用力攥紧了大衣的口袋边缘。

  把这种带着家族毒性的消息，在这种毫无准备的周末下午丢进那个恒温系统精确运转、却比三月街头的冷风更让人待不住的公寓里，那她和阳乃、和自己的母亲还有什么区别？她太清楚那种被迫面对别人强加过来的"秩序"时，那种无处可逃的窒息感了。

  那个金发留学生手腕上的红绸带还在。那个在这两天刚刚有了一点点人气、学会用干巴巴的笑话来顶嘴的女孩，不需要在这个时候被迎头泼一盆冷水。

  这只是一时冲动而已。雪乃在心里给自己下达了判决。

  这种不负责任的靠近，除了满足自己那点可怜的寻找安慰的私心之外，没有任何实际意义。既然连开口的借口都找不到，那就说明她根本就不该出现在这里。

  对。事情就是这样。在逻辑上完全闭环。

  雪乃盯着对讲机面板看了一会儿，像是在努力说服那个倒影里的自己。随后，她深吸了一口气，将双手彻底塞进大衣口袋里，转过了身。

  皮鞋的鞋跟在冷硬的地砖上敲出清脆的一声响。

  她决定去前面的十字路口拦一辆出租车，直接回家，哪怕是一个人呆在那个充满了潘先生的公寓里，也比在这里做一些连自己都无法解释的蠢事要好。

  "叮——"

  就在她的视线刚刚扫向人行道的瞬间，背后突然传来了一声电子提示音。

  那种高档公寓用来彰显身份的、没有任何杂音的自动玻璃门开启声，在这个安静的午后像针一样扎了进来。

  紧接着，是一阵细微的脚步声。

  雪乃的脚步硬生生地停住了。

  她其实没有回头的理由，就算有人出来，百分之九十九的概率也只是某个恰好出门的住户。可是，那种常年处于高压下磨练出来的、该死的第六感，却偏偏在这一刻拉响了警报。

  她僵着脖子，一点点地转过了头。

  玻璃门正缓慢地向两侧滑开。

  门内的自动恒温系统带出了一小股干燥的暖风。而站在这股暖风中央的，是一个穿着浅灰色居家毛衣、手里捏着两封白色信件的人。

  浅金色的长发随意地用一根皮筋松松垮垮地扎在脑后，几缕散落的碎发贴在苍白的脖颈边。那双翡翠色的眼睛原本正低垂着确认信封上的寄件人，在感受到视线后，睫毛微微颤动了一下，抬起了头。

  视线在空气中撞在一起。

  两米的距离。没有对讲机，没有屏幕，也没有任何可以缓冲的屏障。

  雪乃的脑子里像是有什么东西短路了。那些刚才在心里反复排练又被毙掉的借口，在这一瞬间被清空得干干净净。

  她就这么直挺挺地站在冷风里，大衣的下摆还在小腿边微微晃动，双手死死地插在口袋里，用错愕的、完全不符合"部长"身份的表情，盯着门后的人。

  拉芙希妮也愣住了。

  她显然没有预料到会在自己公寓的感应门外看到这个原本应该呆在温暖房间里的人。她先是看了看雪乃被风吹得凌乱的发丝，又看了看她那双插在口袋里的手，视线最终落回了那张努力想要板起来、却又因为过度紧张而发红的脸上。

  拉芙希妮的手指在信件边缘停住了。

  这算什么？雪乃在心里发出了绝望的哀鸣。

  被当场抓获？还是像个可疑的跟踪狂一样徘徊在别人的家门口？如果在这个时候说一句"我刚好路过"，对方会报以那种干燥得能把人噎死的冷幽默。

  她甚至已经能想象到拉芙希妮接下来会用怎样平稳的语调来拆穿她了。

  雪乃咬了咬下唇，强行把脊背挺得笔直。就算是在这种最糟的局面下，也不能连最后一点体面都丢掉。

  "我……"她开口了，声音干涩得像是在砂纸上擦过。

  拉芙希妮没有让她说完。

  那个留学生只是把手里的信件折了一下，随意地塞进了宽大的居家服口袋里。然后，她往前走了一步。

  感应门本来已经准备合拢了，因为她的动作又重新向两侧滑开，发出了微弱的嗡嗡声。

  "外面风很大。"

  没有那些预想中的刺眼调侃，也没有关于她为什么会出现在这里的质问。拉芙希妮的声音听起来和平时在部室里一样，甚至还带着一点刚刚睡醒的、没那么多防备的慵懒。

  她站在大堂和室外的一线之隔处，视线越过雪乃的肩膀，看了看灰蒙蒙的天空，然后又重新落回了雪乃的脸上。

  "如果不麻烦的话，"拉芙希妮右手轻轻碰了碰公寓门框上的感应器，防止它自动关上，语调平稳得像是在讨论今天要在部室里喝哪种红茶，"要进来喝杯热的东西吗？"

  她没有问"你怎么在这里"，也没有问"有什么事"。

  她只是给出了一个最简单、也最让人无法拒绝的台阶。

  雪乃僵在那里。她看着那张苍白但平静的脸，看着那根在袖口边缘若隐若现的红绸带。那些原本像死结一样堵在胸口的烦躁和愧疚，突然就泄掉了一大半的力气。

  这种被完全看穿、却又被小心翼翼地接纳的感觉，比任何激烈的拆穿都更让人无法防备。

  雪乃慢慢地把手从口袋里抽了出来，指节因为长时间的用力而发白。

  "如果在这种温度下被冻出感冒，明天的出勤率会很难看。"她垂下视线，用挑剔的语气掩盖着颤抖的尾音，"而且，作为部长，我也确实有义务……偶尔确认一下部员的周末起居状态。"

  拉芙希妮没有接话，只是把茶杯往雪乃的方向推了半寸。

  "那么，感谢部长的'定期巡查'。"她侧过身，将那个通往室内的通道让了出来，"请进。"

  茶杯里的水汽笔直地向上升腾，很快就在空气里散开了。

  雪乃坐在深灰色的布艺沙发上，双腿并拢，腰背挺得笔直，肩胛骨的轮廓从制服衬衫下顶出来。大衣已经脱下来搭在旁边的扶手上，但她那种如临大敌的姿态却一点也没有放松下来。

  这是她第一次真正意义上踏进这个空间。虽然在修学旅行的那个晚上，在旅馆的榻榻米上，她们曾分享过彼此作为"影子"和"工艺品"的伤痕，但这里——拉芙希妮在千叶的住处——却又是另外一回事。

  整洁，空旷。墙上挂着几幅色调冷峻的爱尔兰风景画，胡桃木的茶几上除了两个杯子什么杂物都没有。没有随意散落的杂志，没有看了一半的电视节目，连空气里都透着一股被精确打理过的、没有任何生活温度的规矩感。

  这就是那个远在英国的"长姐"延伸过来的手。

  雪乃看着拉芙希妮端着一个白瓷托盘从开放式厨房里走出来，轻轻把一小碟点心放在她面前。浅金色的长发随着动作在肩膀上扫过，那几根散乱的碎发配上灰色的居家服，是这个房间里唯一一点活着的气息。

  "我这里的红茶种类不多，只能用这种普通的锡兰红茶来应付'巡查'了。"拉芙希妮在她对面的单人沙发上坐下，语调里带着一点干燥的揶揄。

  "没关系。比起那种在包装上极尽奢华但冲泡温度不对的劣质品，这种最基础的茶叶反而更考验基本功。"

  雪乃用这种带着挑剔的语气顶了回去。

  回击得很顺畅。可是在这句话落地之后，客厅里又陷入了短暂的安静。

  不能再拖延了。雪乃在心里对自己说。

  那个被母亲用签字画押作为交换条件而下达的命令，像一块石头一样沉甸甸地压在她胃里。下周末，本邸，奉仕部的全员。那不是一场单纯的聚餐，那是对她社交圈的一场全方位的审视和狙击。

  她必须在今天，在明天大家回到那个活动室之前，把这件事说出来。

  把拉芙希妮拉进那个充满母亲威压的本邸？让她面对那种从骨子里透出压迫感的审视？雪乃的指尖在茶杯边缘用力地摩擦了两下。

  这就像是把一个好不容易在总武高找到一点呼吸空间的人，重新拖回满是冰渣的深水里。

  "都柏林同学，关于下周末……"
  "我母亲她，以活动预算为条件，提出了一个私人邀请……"

  无论在脑子里怎么排练，这些话听起来都透着一股浓浓的剥削感。

  雪乃深吸了一口气，将视线从茶杯上抬起来，目光越过那层稀薄的水汽，定在拉芙希妮的脸上。

  "那个……"她终于开口了，声音因为紧张而显得干硬。

  "说起来，比起讨论红茶的冲泡技术，"

  拉芙希妮的声音贴着她的尾音响起的。没有丝毫的唐突，只是语速比平时快了半拍。

  金发的留学生倾过身，将刚才放在茶几下层的一个文件夹抽了出来，"啪"地一声摊开在两个茶杯的中间。那是一份密密麻麻打印着表格的文件，上面还用刺眼的红笔画了几个大大的圈。

  "我觉得一色同学昨天晚上发过来的这份灾难级排班表，可能更需要部长的优先关注。"

  雪乃愣住了。

  那个已经到了嘴边的、沉甸甸的邀请，被这份突然出现的排班表硬生生地砸了回去。她看着拉芙希妮，对方翡翠色的眼睛里没有多余的波动，只有公式化的认真。

  拉芙希妮没有问"你刚才想说什么"，也没有表现出任何过度关心的姿态。她只是把一份明显属于"工作"的文件推了过来，像是在两人之间搭起了一座坚固的防波堤。

  雪乃胃里那块一直坠着的石头突然就变轻了。

  在这栋满是家族压迫感的公寓里，在她即将因为负罪感而"自爆"的前一秒，拉芙希妮用最干脆、最不讲理的方式，把她拉回了那个名为"奉仕部"的理性安全区。

  "……一色同学的排班表？"

  雪乃眨了眨眼睛，视线顺着拉芙希妮的指尖落在那份文件上。紧绷的肩膀在这一刻终于有了微放松。

  "是的。"拉芙希妮用指尖点着那个用红笔画了圈的地方，"她把体育馆后勤清理的任务交给了材木座同学，并且将时间安排在舞会结束后的十五分钟内。从物理学和人类学双重角度来看，这都是一个不切实际的幻想。"

  "那个女孩……"

  雪乃的眉毛立刻皱了起来，这是针对工作失职才会有的、纯粹的恼火。

  "她到底有没有认真看过场地图纸？材木座同学那种体能，不仅无法在规定时间内完成清理，还会因为他那些奇怪的自言自语严重影响其他志愿者的撤场效率。而且，为什么器材归还的对接人写的是比企谷君？这不是学生会内务该做的事吗？"

  "我想，一色同学大概是觉得，既然那个人已经习惯了收拾烂摊子，那么把最容易产生纠纷的器材核对工作丢给他，是最'安全'的决策。"拉芙希妮端起茶杯，轻轻吹了吹上面的热气，"这种把麻烦转嫁给别人的直觉，在程度上也算是天赋。"

  "那是推卸责任。"雪乃冷冷地定性。

  她放下茶杯，伸手将那份文件拿了过来，顺便从大衣口袋里摸出一支随身携带的钢笔。拔下笔帽的那一刻，那个在楼下吹着冷风、不知道该怎么按门铃的雪之下雪乃已经被重新藏好了。现在的她，是总武高奉仕部的部长。

  "体育馆清理的工作，必须重新划归给学生会的执行委员。器材对接的名单，让她去和相模协调。"雪乃的笔尖在纸上划出几道凌厉的黑线，直接将一色彩羽的原始安排划掉，"如果她今天不能给出一份符合基础常识的表格，明天的会议上，我会让她重新了解一下什么叫'说明材料'。"

  "我会把部长原话转达给她的。"

  拉芙希妮看着那份被改得面目全非的表格，语气很轻。

  房间里的暖气安静地运转着。冷峻的爱尔兰风景画和空旷的客厅依然没有变，但空气里那种凝滞的尴尬感已经被文件翻动的沙沙声和钢笔划过纸面的声音取代了。

  "还有音响设备的租赁确认。上次平冢老师提到的那家供应商，最终报价出来了吗？"雪乃头也没抬，视线专注地在表格的下一项扫过。

  "周五下午已经确认过了。比之前的预算低了百分之五。"拉芙希妮从文件夹的后面抽出另一张纸，"不过，他们要求在舞会当天必须由我们的委员协助搬运。这一点，一色同学显然又把它'忘记'写进志愿者职责里了。"

  "这是疏漏。"雪乃的笔尖停顿了一下，"把它加上。让叶山君从足球部抽调几个人过去帮忙。既然他那么在意集体的氛围，这种能够展示凝聚力的体力劳动，他没有理由拒绝。"

  "人力资源配置。"拉芙希妮淡淡地评价了一句，嘴角勾起一个微小的弧度。

  两个人就这样坐在茶几两边，一句接一句地拆解着那份错漏百出的排班表。没有嘘寒问暖，没有试探内心，只有毫无感情色彩的工作交接和针对学妹工作能力的无情吐槽。

  可是，当雪乃将最后一行修改意见写完，重新盖上钢笔的笔帽时，她发现自己刚才那种连呼吸都觉得困难的压抑感，真的消失了。

  手里的红茶已经不烫了，温度刚好入口。

  她端起杯子抿了一小口，锡兰红茶那种微微的涩味在舌尖散开。

  "一色同学大概又要抱怨被魔鬼盯上了。"拉芙希妮将那份修改过的文件重新收回文件夹，动作不紧不慢。

  "如果她对魔鬼的定义是要求她履行最基本的职责，那我并不介意承担这个称号。"雪乃放下茶杯，目光落在拉芙希妮的手腕上。那根红绸带安安静静地缠在那里，没有任何松动的迹象。

  "关于……这份排班表的最终确认，"雪乃的声音比刚才低了些许，"明天放学后，在部室里再正式核对一遍吧。"

  明天，在部室里。在由比滨和比企谷都在场的时候。

  拉芙希妮动作微停顿了半秒。她听懂了这句"明天在部室"背后隐藏的另一层意思。那是雪乃决定不再自己一个人硬扛，而是准备在所有人都在场的安全结界里，坦白那个沉重的麻烦。

  "好的。"拉芙希妮拿起茶壶，为雪乃那只空了三分之一的杯子重新注入热水，"明天见。"

  客厅里只剩下纸张对折的沙沙声。

  雪乃将那份被红笔改得面目全非的排班表仔细折好，确保边缘完全对齐后，才把它塞进书包最里层的夹层里，拉上了拉链。

  "今天就到这里。"她站起身，将搭在沙发扶手上的大衣拿起来，手臂穿过袖管，手指顺势将微皱的领口扯平，"明天的部室活动，我不希望看到有人迟到。那份报告的最终版，必须在平冢老师出现之前敲定。"

  语气很硬，是那种完全的、属于部长的公事公办。

  拉芙希妮从沙发上站起来，轻轻理了一下因为久坐而微微发皱的浅灰色毛衣下摆。

  "我知道了。我会准时出现的。"她回答得也很平静，没有任何多余的后缀。

  雪乃拎起书包，目光在对面那张白皙的脸上停留了半秒，然后迅速移开，转向通往玄关的走廊。

  刚才那股卡在喉咙里的、让人窒息的粘稠感已经彻底消失了。胃里的石头也不见了。雪乃比任何人都清楚，自己其实根本没有准备好在今天、在这个只有两个人的封闭空间里，把母亲的那个"审视邀请"说出来。

  那太沉重，也太像无端的牵连。

  而拉芙希妮刚才递过来的那份错漏百出的表格，就像是一把手术刀，切断了她自我施压的引线。没有关切的询问，没有多余的同情，只是用最生硬的"工作"给她搭了一个完美的台阶，让她可以顺理成章地退回到安全线以内。

  这种不需要说出口的默契，让雪乃的眼眶有一点发热的错觉。但她只用加快的步伐掩饰了过去。

  穿过走廊，空气比客厅里要更冷一些。

  拉芙希妮跟在她身后，脚步声很轻。

  玄关的感应灯在雪乃靠近时亮了起来，洒下一片昏黄的光。雪乃弯下腰，在玄关的台阶边缘停下，从鞋柜旁边拿起自己那双黑色的制式皮鞋。

  就在她准备换鞋的时候，视线在转过某个角度时，被玄关侧墙上的一幅画吸引住了。

  之前进门的时候因为心事重重，她完全没有注意到墙上挂着东西。

  那是一幅装裱在暗银色画框里的肖像画。画面的底色很暗，大片的灰黑和深蓝交织在一起。画面中央是一个少女的背影——金色的长发，苍白的皮肤，正从坚硬的、类似蛋壳或者石卵的东西里挣扎着破出来。

  少女的肩膀向上弓起，是用力想要逃离的姿态。

  但让人感到压抑的并不是这层壳，而是少女背后。在那些灰暗的色块里，密密麻麻地画着无数根羽毛。那些羽毛并不是轻盈的，它们排列的方式、弯曲的弧度，像是一只又一只苍白的手，死死地抓着少女的肩膀、后背，甚至缠绕上了她的发丝。

  不仅是抓住，更像是拖拽。像是要把那个好不容易探出身子的少女，重新拖回那个深不见底的灰黑色漩涡里去。

  没有任何多余的色彩，只有金、白和灰黑的拉扯。

  雪乃换鞋的动作完全停住了。皮鞋拿在手里，鞋跟悬在半空。

  她盯着那幅画，呼吸在不知不觉中变得很浅。

  那只是一幅画，但雪乃却闻到了一种属于古老家族的、陈腐而压抑的气息。那种羽毛化作手的意象太直白了，直白到让人反胃。那不是保护，那是纯粹的窒息。

  拉芙希妮就站在这里，每天进出门都会看到这幅画。

  在那个远在英国的"长姐"的安排下，连玄关的装饰都在无时无刻地提醒着她：你逃不掉，你永远被那些"羽毛"抓着。

  雪乃脊背上泛起一阵细密的凉意。她想起了自己曾经被母亲安排出国的那段日子，想起了阳乃站在门外时那种似笑非笑的压迫感。比起自己，拉芙希妮所面临的那个漩涡，更深，也更冷。

  一阵细微的衣料摩擦声从旁边传来。

  拉芙希妮站在距离她不到半米的地方，同样面对着那面墙。她没有说话。没有解释这幅画是哪里来的，也没有解释画里的少女是不是她自己。

  她只是安静地站着，像是在等雪乃作出宣判。

  如果在这个时候开口问"这幅画是怎么回事"，或者说出类似"你一定很辛苦"的蠢话，那就等同于把那些羽毛亲手按在拉芙希妮的肩膀上。

  雪乃将视线从画框上收了回来。

  她弯下腰，把右脚的拖鞋褪下，踩进冷硬的皮鞋里，然后是左脚。动作很稳，没有再去看墙上那幅画哪怕一眼。

  "明天的会议结束后，由比滨同学应该又会吵着要吃点心。"

  雪乃站直身体，整理了一下大衣的衣摆。她的声音在玄关狭小的空间里回荡，带着刻意的、属于日常的平淡。

  拉芙希妮微微侧过头，拉芙希妮微微侧过头，手指停在毛衣下摆的折痕上。

  "千叶站前面那家新开的薄饼店，虽然排队时间缺乏效率，但根据网上的评价，它的焦糖奶油口味似乎很受好评。"雪乃转过身，面向大门，手搭上了金属门把手，"考虑到她最近勉强维持的国语测验成绩，作为奖励，偶尔去一次也不是不行。"

  她没有去提画，没有去提羽毛，也没有去提那个让人窒息的家族。

  她只是在讨论明天放学后吃什么。用最琐碎的、最不理智的甜食，硬生生地在这片灰黑色的空气里砸下了一个属于总武高的锚点。

  "焦糖奶油的话，含糖量确实不低。"拉芙希妮的声音停顿了两秒，然后慢慢恢复了那种干燥的质感，"不过，如果是作为对某人勉强及格的奖励，也还不错。"

  "所以明天，尽量不要让排班表的问题占用太多时间。"

  雪乃按下门把手。

  门发出一声轻响，沉重的防盗门被推开了一条缝。三月初走廊里的冷风立刻顺着门缝钻了进来，带着属于室外的、生冷的气息。

  雪乃踏出半步，脚踩在走廊的水泥地面上。她转过半个身子，大衣的下摆被风吹得微微扬起。

  拉芙希妮站在玄关的暖光里，浅灰色的毛衣裹在她身上，袖口盖过半个手背，领口的织线松了两针。她的左手垂在身侧，那个缠着红绸带的手腕刚好从袖口露出一小截。那不是羽毛，也不是被死死抓住的枷锁，那是一根被系上去的、属于她们之间的红绳。

  "再见，都柏林同学。"雪乃看着她，声音被风吹得有点散，但很清晰。

  "再见。"拉芙希妮站在那里，嘴角终于勾起了一个微小的弧度。

  雪乃转过身，将门在身后拉上。随着"咔哒"一声落锁的声音，那幅让人窒息的画、那个空旷的客厅，都被关在了门后。

  走廊里的风还在吹。雪乃紧了紧衣领，朝着电梯走去。

  她知道，明天在那个有着暖炉和保温杯的活动室里，她要把那个关于聚餐的麻烦说出来。但这一次，她的手指没有再去掐大衣口袋的内衬。
