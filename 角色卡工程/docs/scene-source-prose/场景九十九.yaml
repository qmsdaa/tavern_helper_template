场景: 99
幕: "第七幕·重新为奉仕部命名"
时间: "2014年4月6日 · 周日下午 · 春假"
地点: "成田机场第二航站楼 · 国际到达大厅 → 铁路连接通道"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、爱布拉娜·都柏林、艾米丽"
POV: "零 POV 共享场景"
正文: |
  国际到达大厅上方的电子屏又跳了一次。

  BA005后面的字样从“已降落”变成了“到达手续办理中”。一辆清洁车沿着隔离栏外侧缓慢经过，轮子压过地砖接缝，发出一阵断断续续的轻响。

  拉芙希妮站在接机区第二排。她手里拿着一张折成四层的纸，最外面露出雪乃用红笔画下的“T2”和半条箭头。纸张已经被反复展开过几次，原本压平的折角重新翘了起来。

  “航班已经降落了。”雪乃说。

  “嗯。”

  拉芙希妮看了一眼出口上方的时钟，又把那张纸展开。红色线路从海关出口延伸到铁路连接通道，旁边标着几个换乘站名。她的手指停在到达口的位置，没有继续往下移动。

  雪乃从她手里抽走草图，沿着原来的折痕重新叠好。

  “从入境检查到领取行李需要多久，并不由你盯着电子屏的次数决定。”

  “我只看了三次。”

  “如果不计算我们抵达以前，确实是三次。”

  拉芙希妮没有反驳。她把叠好的纸接回来，收进风衣口袋。袖口随动作往上缩了一点，露出的左手腕上什么都没有。昨晚解下来的红绸带、粉色发卡和烧焦的旧丝带都收在锡盒里，贴着风衣内侧；右腕只剩下一圈长期系紧留下的浅色勒痕。

  “拉芙希妮酱。”

  结衣从旁边的自动售货机跑回来，怀里抱着四瓶饮料。她把一瓶无糖红茶递给雪乃，又把MAX咖啡塞进八幡手里，最后将两瓶常温矿泉水并排放在隔离栏的平台上。

  “我不知道你现在能不能喝甜的，就买了水。还有一瓶可以给你姐姐。”

  “她不会喝没有确认过来源的瓶装水。”拉芙希妮说。

  结衣伸向瓶盖的手停住了。

  “不过，可以留给艾米丽。她通常会忘记在飞机上喝水。”

  “那就不算买错了。”结衣把其中一瓶往拉芙希妮那边推了推，自己拿起剩下那瓶，随后看向靠在隔离栏末端的八幡，“小企，你那个要四百二十日元。记得给我钱。”

  八幡低头看了看手里的罐装咖啡。

  “一罐容量完全没有增加的MAX咖啡，为什么进入机场以后就能获得挑战货币体系的勇气。”

  “可是你不是只喝这个吗？”

  “偏好甜味和愿意接受机场敲诈，是两个完全不同的问题。”

  “比企谷君如果执意把贫穷包装成消费观念，至少应该先把拉环打开。”雪乃说。

  拉环被拉开的声音夹在周围接机人群的谈话里。八幡喝了一口，没有再讨论价格。

  拉芙希妮把矿泉水握在手里。塑料瓶被机场暖气吹得有些温了，掌心贴在瓶身上，只能摸到一层很薄的凉意。

  她没有喝。

  到达口的自动门打开过几轮。穿着短袖的旅客推着大件行李出来，孩子隔着栏杆扑向等候的人，旅行团的领队举起印着公司名称的纸牌。每次门上的感应灯亮起，拉芙希妮都会抬头。雪乃没有再纠正她。

  下午三点过后，门内的人流短暂地断了一次。

  一个穿灰色职业套装的女人先从海关通道里走出来。银色行李箱跟在她身后，四只轮子在地砖上滚动得很安静。艾米丽低头确认了一眼手机上的车辆信息，抬头时，很快在接机人群中找到了拉芙希妮。

  她的脚步慢了一点。

  拉芙希妮身边站着三个人。没有接机牌，也没有统一的位置。结衣还抱着那瓶没开封的水，八幡把喝过一口的咖啡放在隔离栏平台上，雪乃手里拿着那张被红笔画满的草图。他们看上去不像受过安排的接待人员，只是几个在周日下午被叫到机场、连站姿都没有商量过的高中生。

  自动门再次打开。

  爱布拉娜从通道里走了出来。

  她穿着一件深黑色长风衣，紫水晶胸针固定在领口。十几个小时的飞行没有在衣料上留下明显褶皱，只在眼下压着一层很淡的疲惫。她没有四处寻找，视线越过隔离栏，很快落在拉芙希妮脸上。

  随后，那道视线依次经过她身边的三个人。

  拉芙希妮握着矿泉水的手收紧了一点。瓶身发出一声很轻的凹响，又在她松开手后慢慢恢复原状。

  这一次，她没有等爱布拉娜先开口。

  “姐姐。”

  她往前走了一步，在隔离栏允许的距离前停下。

  “一路辛苦了。”

  爱布拉娜看着她，唇角带着旅途中用于应付海关、机组与接待人员的得体弧度。

  “亲爱的拉芙希妮。”她说，“看来这次列车没有让你迟到。”

  “我们提前到了。”

  拉芙希妮没有为上次的晚点重新道歉。她侧过身体，让出身后三个人的位置。

  “这是雪之下雪乃、由比滨结衣，还有比企谷八幡。”

  她停了一下。

  “他们是我的朋友。”

  广播开始播报另一架航班的行李转盘变更。日语结束后，英语又重复了一遍。爱布拉娜没有立刻接话，直到广播里的女声转向下一种语言，她才把视线落到雪乃身上。

  “雪之下小姐。”

  “初次见面，爱布拉娜女士。”雪乃将草图换到左手，向她点头致意，“一直听拉芙希妮同学提起您。”

  “我也听说过你。”爱布拉娜说，“看来那段相当严格的假期补习，确实留下了不少东西。”

  雪乃的眉梢动了一下。拉芙希妮已经把视线移向结衣，没有给她追问那场“强制补习”的机会。

  “初、初次见面。”结衣抱紧了矿泉水，鞠躬的幅度比刚才预想的大了一些，抬起头时刘海已经散下来一缕，“我是由比滨结衣。您坐了那么久的飞机，一定很累吧。”

  她说完，把手里那瓶水递向艾米丽。

  “这个……如果不介意的话，请收下。拉芙希妮酱说您可能不会喝，不过艾米丽小姐会需要。”

  艾米丽看了一眼爱布拉娜。得到一个很轻的点头后，她从隔离栏的开口处接过瓶子。

  “谢谢，由比滨小姐。”

  最后轮到八幡。他把罐装咖啡从平台上拿起来，站直了一些。

  “比企谷八幡。初次见面。”

  没有补充，也没有拿自己开玩笑。爱布拉娜在他脸上停留了一会儿，像是在等待那句过分简短的自我介绍后面还有什么内容。

  八幡只是略微低头，把咖啡罐换到另一只手里。

  “这么多人特意来接机，辛苦各位了。”爱布拉娜重新看向三人，“拉芙希妮身体不适的这段时间，多谢你们照顾我的妹妹。”

  “我们也受过拉芙希妮酱很多照顾。”结衣说。

  她这一次没有先去看雪乃，也没有等八幡接话。声音仍然有点紧，却完整地留在了原处。

  爱布拉娜唇角的弧度没有变化。

  “那么，艾米丽会替各位安排返回千叶的车辆。接下来要谈的是都柏林家的内部事务，恐怕会占用很长时间。”

  她说得很周到，连“离开”都没有出现。艾米丽已经打开平板，准备确认临时用车。

  “不需要另外安排。”拉芙希妮说。

  爱布拉娜的视线回到她脸上。

  “是我请他们来的。接下来的会面，他们也会在场。”

  “你在信里没有提到这些。”

  “因为那封信是我写的。”

  拉芙希妮的声音不高。她握着那瓶常温矿泉水，瓶盖仍然没有被拧开。

  “他们没有替我写信，也不会替我回答。但我要让他们在场。”

  人群从几人身后绕过。行李箱的轮子在地砖上连续滚动，随后被自动门合拢的声音截断。

  爱布拉娜看着拉芙希妮。那层长途飞行留下的浅淡疲惫还停在她眼下，除此之外，她脸上没有任何可以被称为失态的痕迹。

  “原来如此。”她说。

  艾米丽关掉了临时用车页面。

  “车已经停在专用通道。”爱布拉娜转向出口，“走吧。”

  她向前走了两步。

  和去年十二月三十日一样。相同的机场，相同的黑色风衣，也是一句没有询问去向的“走吧”。只要拉芙希妮跟上去，艾米丽就会替她拉开后座车门，外面的声音会被隔音玻璃关在车厢之外。

  拉芙希妮没有跟上。

  她从风衣口袋里取出交通卡。卡面边缘有一道很浅的划痕，是她每天经过千叶站闸机时留下的。

  “我们乘电车去学校。”她说，“平冢老师已经办好了访客登记。不会耽误约定的时间。”

  爱布拉娜停下脚步。

  “你不和我一起？”

  雪乃站在拉芙希妮身后，没有展开那张草图。结衣还抱着自己的水瓶。八幡喝掉了最后一口已经不再冒热气的咖啡，将空罐握在手里。

  没有人替她回答。

  “我们在总武高见，姐姐。”拉芙希妮说，“有个地方，我想让你亲自看一看。”

  艾米丽的手停在行李箱拉杆上。爱布拉娜看了看拉芙希妮手里的交通卡，又看向她身后的三个人。

  “既然这是你的安排。”

  她转回身，向专用停车通道走去。

  “那么，总武高见。”

  银色行李箱从光亮的地砖上滚过。爱布拉娜没有回头，艾米丽跟在她侧后方，在进入通道前举了一下结衣给她的矿泉水。

  四个人站在原处，直到黑色风衣消失在转角后面。

  八幡先把空咖啡罐扔进分类垃圾箱。

  “现在反悔改坐对方的车，还来得及节省一笔不必要的交通费用吗？”

  “小企。”结衣叫了他一声。

  “只是确认成本。成田机场对陆路交通的定价，明显建立在旅客已经无路可逃这一前提上。”

  “比企谷君如果真的介意，可以留在这里等下一班普通列车。”雪乃展开草图，“不过那样会比我们晚到四十分钟，你需要独自向爱布拉娜女士解释迟到原因。”

  八幡看了一眼铁路通道的指示牌。

  “突然觉得指定席也不是不能接受。”

  结衣低头笑了一声，伸手拿走拉芙希妮一直握着的矿泉水，替她拧松瓶盖，又放回她手里。

  “走吧，拉芙希妮酱。”

  拉芙希妮喝了一口水。

  “嗯。”

  他们转向铁路连接通道。四张交通卡依次贴上感应区，电子提示音一声接着一声响起，闸门在他们面前逐次打开。
