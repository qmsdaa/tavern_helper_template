场景: 138
幕: "第十幕·冬去春来"
时间: "2015年2月10日 · 周二"
地点: "总武高网球场 → 特别栋奉仕部活动室"
人物: "户冢彩加、比企谷八幡、雪之下雪乃、由比滨结衣、拉芙希妮·都柏林"
POV: "共享场景／零POV"
正文: |
  二月十日，天气晴。风不大——二月的网球场难得的无风日。

  八幡是被户冢拉到球场的。不是"被通知要去打网球"，是下午第二节下课后，户冢在三楼走廊尽头等他，手里抱着一筒网球。

  "八幡，今天有空吗。"

  不是疑问句。是确信对方有空的句式。

  "如果我说没空呢。"

  "那我就明天再问。"户冢笑了，"不过今天天气很好。二月里最好的那种。"

  八幡看了一眼窗外。天蓝得没话讲。算了。

  球场上没有别人。户冢说其他网球部成员明天有练习赛，今天都提前回去休息了。八幡听出来这句话里面的安排——不是在说明事实，是在告诉他这里不会有观众。

  "你不用特意清场。"

  "我没有清场。"户冢把球筒放在长椅上，"我选了他们会自己走的时间。"

  八幡接过球拍。还是那把旧拍，握把的胶带被磨得半透明。上一次握它是什么时候，他想了几秒，没有想起来。

  "规则还记得吗。"

  "发球要过网，出界算对方得分。"八幡说，"够吗。"

  "够了。"

  户冢发球。球过网的速度不快，落在中线靠后的位置。八幡接回去——手比记忆里慢，但球还是回到了对面的场内。

  拉锯了几回合。没有人计分。户冢的球一次比一次轻松，八幡的球也渐渐不需要用肩膀去够。球在两个人之间来回，没有刁钻的角度，也没有必须接住的压力。

  "八幡。"

  "嗯。"

  "你是不是在想，我是不是有什么要说的。"

  八幡接住一球，打回去。"没有吗。"

  "没有。"户冢说，"就是想打一场普通的网球。不是练习，不是比赛，不是有什么事要商量。就是——两个快毕业的人，在放晴的二月打一场球。"

  "这个理由成立吗。"

  "成立。奉仕部的委托记录上写'普通网球练习'也可以。"

  八幡把球打过网。球擦着网上缘翻过去，户冢跑了两步，接住了。

  "好球。"

  "运气。"

  "运气也是球的一部分。"户冢说。

  打了四十分钟。户冢坐下来喝水，八幡把球拍放在长椅上。场上只剩太阳晒在防滑涂层上的反光。

  "上一次这么打球是什么时候。"八幡说。

  "一年级。文化祭之后。"

  "你还记得。"

  "记得。"户冢把水瓶放下，"那时候八幡还不太会接发球。现在接发球很稳了。"

  "稳和没力气是同一件事的两种说法。"

  "不是。"户冢说，"接发球稳，是因为你知道球会去哪里。"

  八幡没有回答。他把最后一颗球捡起来，放进球筒。

  "今天的事，可以写进记录簿吗。"户冢问。

  "'普通网球练习'。没什么好记的。"

  "对。就是没什么好记的，所以想记。"

  回到活动室的时候已经过了五点。结衣看见八幡手里没喝完的矿泉水瓶，眼睛亮了一下。

  "小企！你去打球了？！"

  "被拖去的。"

  "户冢同学呢？"

  "回去了。说明天有练习赛。"

  雪乃把记录簿翻到新的一页。"基本事项呢。"

  "普通网球练习。"八幡把矿泉水瓶放在自己那格桌子上，"委托人：户冢彩加。没有危机，没有需要解决的问题，没有需要说服的对象。"

  雪乃的水笔停了一下。然后她在基本事项栏写下了"普通网球练习"。

  "受理中。"

  "受理什么。"八幡说，"就是打了场球。"

  "就是打了场球，也是委托。"结衣趴在椅背上，"委托人认为值得记录，奉仕部就受理。"

  拉芙希妮把茶杯放回碟子上，看了八幡一眼。

  "户冢同学在教你一件事。"

  "什么。"

  "没有危机也可以被陪伴。"

  八幡拉开MAX咖啡的拉环，喝了一口。过了一会儿。

  "我知道。"

  他把记录簿拉过来，在自己的那一栏补了一行字。不是受理回应，是今天的日期和四个字——

  "天晴。无风。"
