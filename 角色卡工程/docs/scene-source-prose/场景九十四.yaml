场景: 94
幕: "第六幕·春假战备"
时间: "2014年3月28日 · 周五 · 19:40（伦敦时间 · 雨）"
地点: "伦敦 · 翡翠资本总部 · 执行董事办公室"
人物: "爱布拉娜·都柏林、艾米丽"
POV: "爱布拉娜"
正文: |
  伦敦的雨从下午一直下到入夜。

  深米色信封平放在胡桃木办公桌中央。右上角的邮戳叠着两道转运章，最晚的一道日期是今天。艾米丽把它送进来时只说了寄件人的名字，没有像处理工作函件那样附上内容摘要。

  爱布拉娜让她留在门边，拿起拆信刀。

  金属刃口沿封胶划过。她把开口朝下，落到桌面的只有一张折叠整齐的羊皮纸。

  没有便笺，没有照片，也没有任何可以替正文解释来意的附带物。

  爱布拉娜展开信纸。

  深蓝色墨迹已经彻底干透。第一行没有私人称谓，正文也没有询问她是否方便。日期、地点、到场期限依次排列，每一句都短得足以单独成为一项要求。写信的人没有为这次邀请准备退路。

  她从第一行读到末尾，没有动。

  第二遍，她逐句确认时态和措辞。那些句子准确得近乎刻意，偶尔又留下一个拉芙希妮才会使用的停顿位置。像有人把她原本会写下的道歉和敬语一层层删掉，却没有代替她完成最后的表达。

  第三遍，她只看右下角。

  “Loughshinny Dublin.”

  全名。

  最后一个字母的收笔清晰，深蓝色线条在羊皮纸的纹理上微微分叉。没有涂改，也没有墨点。那个名字稳稳落在纸面上，锋利得与她记忆中每一封家书的落款都不相同。

  爱布拉娜的食指停在署名上方，没有碰到纸。

  拉芙希妮在害怕。

  这一点不会因为字迹平稳就改变。她太熟悉那个孩子被要求做出决定时的停顿：先计算所有人的期望，再寻找最不让人失望的答案，最后把自己的意愿留在空白处。如今空白被一个完整的名字占住，只能说明千叶有人替她清理了退路。

  那位姓雪之下的部长最有可能。也可能是那个总把牺牲包装成办法的男生，或者笑起来过分明亮的女孩。无论是哪一个，在爱布拉娜看来，都不过是替拉芙希妮纠正句子，告诉她应该怎样拒绝，然后把这种借来的强硬误认为成长。

  爱布拉娜没有考虑另一种解释。

  右眼上方的神经跳了一下。她把信纸沿原有折痕重新叠好，动作比拆开时慢。

  “艾米丽。”

  “在。”

  “让机组预留四月五日离开伦敦、四月六日抵达成田的航路窗口。通行许可和日本方面的行政文件照常准备，三天内把方案给我。”

  艾米丽低头记下日期。

  “是否需要先向都柏林方面报备行程性质？”

  “私人探访。需要长老会确认的文件只提交必要部分。”

  需要长老会确认的部分仍留在流程里。她先动的只有自己的行程。

  “另外，通知温斯顿核对拉芙希妮下学年的在日责任联系人与居住备案。不要催促，只把缺少的材料列给她。”

  艾米丽的笔尖停了一瞬。

  “千叶公寓那边呢？”

  “请家政太太确认她春假期间的饮食和用药记录。如果人不在公寓，不必询问去向，把未完成的服务项目照常发给她。”

  “明白。”

  爱布拉娜把折好的信放在桌面左侧，没有送进等待归档的银色文件盘。

  “周日替我联系玛格丽特姑婆。”

  艾米丽抬起眼。

  “需要她转达什么？”

  “什么都不需要。”爱布拉娜说，“只提醒她，日本已经到樱花季了。”

  办公室里只剩雨水敲在玻璃上的声音。温斯顿的表格、家政太太的问候和玛格丽特真心实意的关心会从三个方向抵达千叶，没有一项可以被称作威胁。

  艾米丽合上记录本。

  “这封信需要回复吗？”

  爱布拉娜看向桌上的羊皮纸。

  如果拉芙希妮期待的是拒绝，她不会给。如果她期待一句同意，也不会在此刻得到。让一个刚学会写下要求的人等待，她迟早会开始反省自己是不是做错了。

  爱布拉娜拉开办公桌右侧最上层的抽屉，把那封信放进去。抽屉里没有待办文件，只有一枚备用门卡。

  “不要回信。”

  艾米丽转身走向门口。她的手刚碰到门把，爱布拉娜又叫住了她。

  “还有。”
