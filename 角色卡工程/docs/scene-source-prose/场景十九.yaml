场景: 19
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月下旬 · 林间学校第二天上午"
地点: "千叶村青少年中心 · 户外空地"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、鹤见留美"
POV: "拉芙"
正文: |
  山里的清晨比城市冷得多，即便是盛夏，草叶上也挂着未蒸发的露水。

  四名指导员被分配在空地的外围，观察那些正三两成群准备活动的小学生。在一片嘈杂的嬉闹声中，那个坐在最边缘的角落里的女孩显得格外突兀。

  那是一个很早就暴露了破绽的姿势——她背靠着一棵粗糙的杉树干，双膝蜷起，紧紧贴着胸口。手里举着一本漫画或者文库本，但书页举得太高了，完全挡住了她的下半张脸。而且光线的角度不对，书页在那个倾斜度下会严重反光，她根本读不进任何字。

  她只是在用那本书筑起一道墙。

  那个孩子身边，没有任何挡她的人。

  没有试图假装和她说话的同学，没有顺手把水壶放在她脚边的同伴。那些若有若无的、带着排斥和敌意的注视，像毫无遮挡的阳光一样，毫无保留地打在她身上。

  她是赤裸地坐在那里的。

  而拉芙希妮，从来不是赤裸地坐在那里的。

  她的身边，一直有人挡着。爱布拉娜永远站在前面。不管是赞美、嫉妒、试探还是恶意，所有人的目光都会先落在爱布拉娜身上。她把一切都隔绝了，用爱意和保护把拉芙希妮变成了"影武者"。

  这个名叫留美的孩子，是被排斥。

  而拉芙希妮，是被忽略，是被当成了附庸的影子。

  这两件事看起来一样。它们都会让人在人群中显得孤立无援。

  但它们不一样。排斥是有人在确认你的存在后试图抹杀你；而忽略，是从一开始就没有人相信你的存在。

  雪之下雪乃也注意到了那个角落。

  她放下了手里的签到板，径直朝那棵杉树走去。她停在留美面前时，拉芙希妮侧过脸看到她站立的姿态——笔直，端正，甚至带着一种准备解决某项校务委托的正式感。

  雪之下同学开口说了什么，距离稍远拉芙希妮听不太清。但从她微微下压的视线和过于平稳的语速来看，那一定是某种逻辑严密、挑不出任何语法错误的关怀。

  留美没有放下书。她甚至没有改变膝盖蜷缩的弧度，只是从书页上方露出那双透着远超年龄的防备的灰色眼睛，用一个极轻的、几乎没有起伏的单音节"嗯"字，敷衍地挡回了所有的话。

  几秒钟的僵持后，雪之下同学站了起来，眉头微皱，嘴唇紧抿，带着明显的碰壁后的不甘退回了原位。

  拉芙希妮看着雪之下同学的背影，大概能猜到她做错了什么。

  她介入的时机没错，态度也没错。甚至，她对那个女孩处境的共情也是真实的。

  但雪之下同学太"正确"了。

  那是一种居高临下的正确，是一种试图用规则和道理去纠正现实泥沼的傲慢。那个叫留美的孩子，需要的根本不是一个光鲜亮丽的"正确的大人"来告诉她该怎么做。

  那个缩在角落里、防备着整个世界的孩子，需要的是"一个也曾经赤裸地坐在角落里，甚至现在依旧满身刺骨防备的人"。只有同类的气味，才能降低这种猎物本能的警惕。

  拉芙希妮没有走过去。

  她知道——走过去的人，不能是"正确"的。

  也不能是"被保护过的"。

  必须是"也曾经赤裸地坐在角落里"的。

  她的视线移向长桌另一端的比企谷八幡。

  那个人正在用死鱼眼看着这个活动室。

  拉芙希妮的右手腕上，丝带在袖口下微微发热。
