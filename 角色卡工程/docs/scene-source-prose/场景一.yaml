场景: 1
幕: "第一幕·入部磨合"
时间: "2013年5月20日 上午（第一节课前）"
地点: "2年J班教室"
人物: "雪之下雪乃、拉芙希妮·都柏林、班主任"
正文: |
  五月的早晨，阳光穿过窗玻璃，在课桌的木纹上投下一道刺眼的光斑。雪之下雪乃将手里的文库本向左移了半寸，避开那道反光，视线却没有落在纸页上。

  黑板前站着一个人。

  "我是拉芙希妮·都柏林。接下来的一段时间，请多关照。"

  简短的自我介绍，没有多余的寒暄，甚至没有刻意放慢语速来照顾可能存在的语言障碍。但那口流利的日语咬字清晰，带着一种近乎受过严苛训练的工整。

  J班的空气在短暂的停顿后，细碎的窃窃私语迅速在座位间蔓延开来。作为国际课程班，这里并不缺乏有海外背景的学生，但讲台上的少女依然显得过于突兀。

  雪乃的视线停留在对方身上。浅金色的长发被梳理得一丝不苟，没有高中女生常有的那种刻意营造的蓬松感。深蓝色的校服穿得非常规整，领口的丝带打着标准的结，没有任何随意的改动。她的肤色苍白，翡翠色的眼睛在扫视教室时，带着一种礼貌却不容靠近的疏离。

  像是一件被精心打磨过、放在橱窗里展示的易碎品。

  这是雪乃脑海中浮现的第一个比喻。但很快，她就推翻了这个想法。因为当拉芙希妮的视线掠过前排那些交头接耳的女生时，那双眼睛里并没有局促，只有一种仿佛在评估某种距离的冷静。

  "那么，都柏林同学的座位……"班主任的声音在轻微的骚动中显得有些底气不足，他环顾了一周，目光最终落在了教室靠窗的后排。"就先坐在雪之下同学旁边的空位吧。"

  雪乃没有转头看班主任，只是不动声色地将放在邻桌边缘的几本参考书收回了自己的桌面上。

  脚步声从过道传来。不急不缓，每一步的间距似乎都经过精确计算。

  随着那道高挑的身影靠近，一种淡淡的、几乎难以察觉的药苦味混杂着极淡的香气飘了过来。雪乃微微蹙了蹙眉，手指下意识地压平了书页的折角。

  拉芙希妮在她身旁的空位停下，没有立刻拉开椅子，而是先侧过头，看了雪乃一眼。

  那是短暂的视线交汇。雪乃看清了对方垂在身侧的右手——手腕上系着一条旧丝带，尾端有明显的烧焦痕迹。在整洁到近乎完美的装扮中，这个细节显得尤为刺眼。

  "如果不麻烦的话，我坐这里。"拉芙希妮开口了，声音不大，语气里带着恰到好处的客气。

  雪乃将视线从那条焦痕上收回，重新落在自己的书页上。

  "这是老师的安排，谈不上麻不麻烦。"她的声音平静得像是一潭没有波澜的水，甚至连头都没有抬，"而且，这张桌子本来就是空的。"

  拉芙希妮似乎对这个不够热情的回答并不意外。她轻轻拉开椅子，动作控制得很好，几乎没有发出摩擦地面的刺耳声响。她坐下，将随身的包放在桌斗里，然后拿出了一本英日对照的诗集，端正地放在桌面上。

  没有试图开启新的话题，也没有因为周围同学不加掩饰的打量而显得局促。她只是安静地坐在那里，像是在自己的周围画下了一道无形的界限。

  雪乃用余光看着对方翻开书页的动作。那只系着烧焦丝带的手腕在阳光下显得分外纤细。

  这个转学生，不仅是在拒绝别人的靠近，似乎也在竭力克制着自己向外伸手的本能。

  雪乃伸出手指，将垂在脸颊旁的一缕长发别到耳后，随后翻过了手里的书页。纸张摩擦的声音在两人之间细微地响起，像是一种无声的休战协议。

  窗外的风向似乎变了，带着一点属于海边的潮气涌入教室。第一节课的预备铃在这时突兀地响了起来。
