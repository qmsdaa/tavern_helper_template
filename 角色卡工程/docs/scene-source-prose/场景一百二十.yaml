场景: 120
幕: "第八幕·归国与失语"
时间: "2014年7月25日 · 周五 · 暑假部活日"
地点: "总武高特别栋奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、比企谷小町、川崎大志"
POV: "共享场景／零POV"
正文: |
  暑假的部活日，活动室从中午开始就浸在热浪里。

  窗户全开，风扇摇头摆尾地转，吹起来的风也是温的。结衣给大家倒的麦茶换成了冰的，玻璃杯外壁的水珠一路滑到杯垫上。

  雪乃坐在长桌尽头，正在核对拉芙希妮做的那叠索引卡。三只纸箱码在文件柜旁边，每一只的侧面都新贴了手写的标签。她一页一页翻过去，翻得很慢，最后把索引页理齐，放回箱盖上。

  "整理得很清楚。"她说，"辛苦你了。"

  "分内的事。"拉芙希妮坐在窗边的老位置，双手捧着马克杯。水珠在她的指腹下面聚起来，又滑下去。

  八幡瘫在斜对面翻文库本，小町和大志趴在对面的桌上清点文化祭剩下的便签纸库存——这是今天给一年级的任务。

  下午三点刚过，小町忽然直起身。

  "啊，对了！小町想起来，答应了同学要去车站前帮忙挑东西的！"她麻利地把便签纸收成一摞，抓起自己的包，不由分说拽起大志的袖子，"大志，借我用一下，东西很多！"

  "欸？啊，好、好的——"

  大志被拽得踉跄了一下，回头看了看长桌，跟着小町出了门。拉门合上之前，小町回头挥了挥手，笑容灿烂得和平时没有任何区别。

  门外的脚步声远了。

  活动室里安静下来，只剩下风扇的嗡嗡声。

  拉芙希妮放下手里的玻璃杯，站了起来。

  她从衬衫胸口的口袋里，取出那张对折了两次的纸，走到长桌中央，把它摊开，压平在桌面上。

  "周二整理档案的时候，"她说，声音平稳，"我发现了一样东西。我想把它，从头到尾告诉你们。"

  纸上只有一行编号。AXI-2013-04873-J。

  她从三只纸箱讲起。讲第二只箱底那只没有年份标记的牛皮纸文件夹，讲文件夹里属于她自己的休学申请书，讲家族事务所那份措辞完美的情况说明，讲说明末尾引用的那份独立保险调查报告，讲附属清单上唯一空着的第五项。

  然后，她把那张褪色便签的事也说了——"⑤未着。3/12再照会。"

  "平冢老师在我复学之前，问过这份报告的下落。"拉芙希妮的指尖停在那行编号上，"没有得到回答。文件夹就这样封起来了。"

  结衣捧着杯子的手收紧了。

  "那场事故——达洛维小姐去世的那场火灾，"拉芙希妮继续说，语速没有变，"从那以后，我一直以为，知道它全部经过的，只有家族。可是这串编号的前缀，不属于家族的任何一个文书系统。它属于家族之外的人。"

  "保险公司，或者他们雇的调查机构。"八幡的文库本不知什么时候合上了，"也就是说，当年有外人调查过，写过报告。"

  "嗯。而那份报告，没有跟着我的档案一起旅行。"拉芙希妮看着他，"有人决定过，它不应该跟着。"

  活动室里安静了几秒。风扇转过来，吹动桌上那张纸的角。

  "原件还在箱子的最底层，我按原样放回去了。编号我核对过两遍，没有抄错。"她顿了顿，"现在知道这件事的，只有这个房间里的人。"

  雪乃的视线从那张纸上抬起来。

  "你打算怎么办。"

  "回英国。"

  拉芙希妮的回答没有任何迟疑。

  "自己买票，自己去。编号在我这里，家族的书库、保险会社的窗口，能查的地方我都要查一遍。"她说，"这不是被叫回去。是我自己要回去。"

  "什么时候。"

  "八月二日出发。返程票买八月末的。"

  结衣站了起来，杯子里的麦茶晃了一下。

  "但是，拉芙希妮酱，你一个人在那边……要是出了什么事，怎么办……"

  "没关系。"

  拉芙希妮转过头，对她很轻地摇了摇头。

  "这件事，只能是我自己去。"她说，"家族的书库也好，姐姐那里也好，都是只有我才读得懂的地方。而且——"她的视线扫过桌上的编号，"现在，我有的只是一处缺失。不是答案。可能查到最后，什么都查不到。"

  "那就把'什么都查不到'也当作结果带回来。"

  雪乃开口了。

  "奉仕部受理过的答案里，'没有'也是记录。"她说，"废稿也好，空白也好，都值得存档。"

  八幡瘫在椅子上，从鼻子里哼出一声笑："反正我们也帮不上什么忙。英文合同之类的东西，看一眼就想死。"他抓了抓后脑勺，"不过，算账倒是会。钱不够了就说，虽然我很穷。"

  "联络呢。"雪乃从旁边的便签本上撕下一页，水笔悬在纸上，"定下来。频率，方式，断线的时候怎么办。"

  "每天一条。"结衣立刻说，"什么都行，吃了什么、天气、看到的东西，什么都可以！发在群里。"

  "两天没有消息，就当作有状况。"八幡说，"到时候，找温斯顿确认。"

  "温斯顿先生的联系方式，我会留给大家。"拉芙希妮点了点头，"我在伦敦的住处，是家族的房子。姐姐……也在那里。"

  "你姐姐那边，怎么说。"雪乃问。

  "还没有说。"拉芙希妮的声音低了半分，但很清楚，"到了，再决定。"

  雪乃把便签推过来。上面是三行字：每天一条群聊，两天断线找温斯顿，八月二日出发、八月末返程。

  "还有要补充的吗。"

  三个人都摇了摇头。

  "那就这样定了。"雪乃把便签贴在予定表的八月那一页上，"这一周，把要带的东西准备好。周五的部活，出发前最后一次，大家给你送行。"

  窗外的蝉鸣一阵一阵地涌进来。拉芙希妮站在长桌中央，看着那张贴在八月上的便签，很久没有动。

  收拾东西准备锁门的时候，雪乃在门背后的值日表前停了一下。

  六张任务便签，五个名字。拉芙希妮的那一格，从五月贴上去那天起，就是空的。

  "这一格，"雪乃说，"留着。"

  拉芙希妮看着那个空白的格子。风扇的风吹过来，值日表左下角的纸角掀了一下，又落了回去。

  "……回来以后，"她说，"我来填。"

  六张便签中间，那张没有名字的，安安静静地待在原处，没有掉下来。
