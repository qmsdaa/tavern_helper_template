场景: 104
幕: "第七幕·重新为奉仕部命名"
时间: "2014年4月15日 · 周二 · 放学前后"
地点: "总武高三年J班教室 → 来宾接待室 → 特别栋奉仕部活动室"
人物: "雪之下雪乃、拉芙希妮·都柏林、高坂理津子、雪之下夫人、比企谷八幡、由比滨结衣"
POV: "雪之下雪乃"
正文: |
  “雪之下同学，方便出来一下吗？”

  最后一节课结束不久，高坂理津子站在三年J班门口，手里夹着那本雪乃已经见过的黑色文件夹。教室里还有不少人没有离开。几名学生听见她的声音后抬起头，很快又继续收拾书包。

  雪乃把读到一半的材料合上，起身走到门外。拉芙希妮还坐在自己的座位上，桌上摊着新学年发下来的选修课说明。她没有跟过来，只把那一页折好，朝走廊看了一眼。

  高坂从文件夹里取出一份复印件。

  “PTA执行委员会今天补交了一份意见。教务处已经收件，副本会附在你们的现况确认材料后面。”

  雪乃接过文件。页首仍然使用年度课后活动复核的格式，正文里却第一次出现了奉仕部的名字。意见要求学校说明，为什么一间长期分配给未注册学生组织的教室不能改作其他用途，以及奉仕部提供的帮助是否无法由生活指导室、学生会或现有社团承担。

  “一般复核文件里没有点名任何学生组织。”雪乃说。

  “这是追加意见。”

  “学校接受了？”

  “学校接受了文件。”高坂回答，“但是是否接受其中的判断，还没有结论。”

  雪乃重新读了一遍页首。文件用的是执行委员会名义，末尾没有列出提出者的姓名。措辞很克制，也给学校留下了完整的裁量空间。她熟悉这种写法。

  “奉仕部的活动许可会受到影响吗？”

  “现阶段的安排没有改变。钥匙继续登记领取，新委托继续保留基本记录。”高坂说，“学校需要你们补充最后一栏，尤其是无法由现有制度替代的理由。”

  “提交期限呢？”

  “校方还在整理全部复核对象，没有为你们单独设置期限。”

  高坂合上文件夹，却没有立刻离开。

  “另外，来宾接待室有人希望见你。”

  “谁？”

  问出口以后，雪乃已经知道了答案。

  “雪之下女士。她刚参加完PTA的校内事务说明会。”高坂说，“这次谈话由她以监护人身份提出，不属于校方通知。你可以拒绝。”

  教室里传来椅子挪动的声音。拉芙希妮背着书包走出来，手里拿着两人的选修课材料。

  “我陪你过去。”她说。

  “不必。只是家庭谈话。”

  “这是你的判断吗？”

  “是。”

  拉芙希妮看着她，随后把雪乃的材料递了过来。

  “那我们先去活动室。比企谷同学已经登记领取钥匙了。”

  “嗯。”

  “这份意见需要复印的话，结衣带了夹子。”

  她说完便沿着走廊离开，没有再问接待室里的人准备说什么。

  高坂等她走远以后才开口。

  “你也可以先去活动室，书面意见不会因为今天少一次谈话改变。”

  “我会去。”雪乃说，“既然她已经把话送进学校，我至少应该知道她准备如何解释。”

  来宾接待室的门没有完全合上。雪乃推门进去时，母亲正坐在靠内侧的沙发上，面前放着学校招待来宾用的白瓷茶杯。桌上有一份和雪乃手中相同的追加意见，页角压在杯垫下面。

  “坐吧。”母亲说。

  “我站着就可以。”

  “随你。”

  雪乃把文件放到桌上，没有碰另一侧的沙发。

  “以PTA执行委员会的名义点名一个由自己女儿负责的学生组织，这种做法很难称为公正。”

  “所以最终判断由学校作出。”母亲端起茶杯，“我提出问题，学校决定是否需要回答。权限并没有混在一起。”

  “你很清楚，PTA的书面意见会给校方带来什么压力。”

  “校方也很清楚。”

  母亲放下茶杯，杯垫发出一声轻响。

  “如果一份措辞克制的询问就足以让奉仕部失去活动室，它原本也没有你想象得那么稳固。”

  “奉仕部过去持续接受学生委托，也留下了活动记录。文化祭、学生会选举和游园会期间，我们处理过学校现有制度无法及时接住的问题。”

  “我看过你提交的摘要。”

  “那么你应该知道，它的作用并不只是一间闲置教室里的私人聚会。”

  “作用存在过。”母亲说，“学校现在问的是，为什么还要继续。”

  雪乃拉开文件，把过去一学年的委托目录翻出来。

  “新的问题不会因为平冢老师调离就消失。奉仕部能够在保留隐私的前提下接受委托，再根据当事人的需要协调学生会、教师或其他社团。这种形式有继续保留的价值。”

  “生活指导室也会保护隐私。”

  “学生未必愿意直接向教师求助。”

  “学生会同样由学生负责。”

  “学生会有固定职责，不适合处理所有私人问题。”

  “所以你需要证明的，是奉仕部承担了哪一部分无法替代的职责。”母亲说，“你刚才列出的内容，只能说明你们做事的方法有所不同。”

  雪乃没有立刻回答。母亲没有催促，接待室外偶尔有人经过，鞋底擦过地面的声音从门缝里传进来。

  “四名成员都愿意继续。”雪乃说。

  “这句话更像一份同好会申请。”

  “成员意愿本来就是社团成立的基础。”

  “平冢老师还在的时候，你们没有申请正式成立。她离开以后，你才开始寻找制度基础。”

  “过去的手续不完整，不等于现在没有补正的必要。”

  “当然可以补正。”母亲说，“我只是想知道，你究竟在补什么。”

  雪乃把委托目录压在追加意见上。

  “我已经说明了活动价值。”

  “你说明了这个房间里发生过什么。”

  母亲拿起自己的那份文件，将最后一页翻到“继续设置理由”。那一栏依然空着。

  “比企谷同学习惯把自己放到最容易承担代价的位置。由比滨同学总想让每个人都能接受结果，最后才会考虑自己。都柏林小姐刚结束休学，她留在这里的理由也在改变。”

  “他们各自的处事方式和奉仕部的制度价值没有直接关系。”

  “你真的这么认为吗？”

  “奉仕部从来没有要求成员采用同一种方法。正因为判断不同，我们才有可能修正彼此的错误。”

  “那是你希望它继续存在的理由。”母亲说，“学校需要的是另一种答案。”

  雪乃准备好的话在这里断了。她可以继续写活动记录、责任范围和隐私规则，也可以证明他们曾经解决过多少问题。那些材料都能回答奉仕部做过什么，却无法证明这四个人必须留在同一个房间。

  母亲把文件放回桌上。

  “只要奉仕部仍然存在，你每天放学后走进那间教室就有正当理由。他们坐在那里，可以说是在等待委托。你替他们泡茶，可以说是部长的职责。即使一下午什么也没有发生，你也不需要问任何人明天还会不会来。”

  “我们不会因为没有委托就停止来往。”

  “那么，活动室是否保留都不重要。”

  “学校是否保留一个有价值的学生组织，不能用这种方式判断。”

  “你又回到学校了。”母亲说，“我问的是你。”

  雪乃站在桌边。接待室里的茶已经没有热气，母亲依然没有碰那份委托目录。

  “你不是在保护奉仕部，雪乃。”

  母亲说得很平静，语气和指出材料里一处冗余没有区别。

  “你只是害怕一旦那个房间失去名字，他们就有理由离开你。”

  “他们不会。”

  这句话说得太快。雪乃听见以后，反而不知道该怎样接下去。

  母亲没有笑。

  “我没有说他们一定会离开。我说的是，你从来没有在失去那些理由以后问过。”

  “我们之间的关系不需要向你证明。”

  “校方也没有要求你证明关系。”母亲把追加意见推到她面前，“它只要求你说明，为什么学校应当继续为这段关系保留教室、名称和教师责任。”

  雪乃拿起文件。

  “如果你认为这只是我的私人恐惧，我会用材料回答。”

  “很好。”母亲说，“那就不要再把平冢老师的判断、过去的成果，或者那三个人愿意陪着你，写成你自己的答案。”

  “你来学校，只是为了说这些吗？”

  “我来参加PTA说明会。你负责的学生组织恰好出现在复核材料里。”

  母亲重新端起茶杯，没有要求她回家，也没有提起志愿与家族安排。

  “学校会按照自己的程序判断。我也会看着你这次能不能在没有人替你承担责任的时候，把那一栏填完。”

  雪乃离开接待室时，高坂已经不在走廊。教员室门口的钥匙登记表多了几行记录，比企谷八幡的名字写在当天最下面，用途是“活动记录整理”。

  奉仕部的门开着。

  结衣正在给茶壶添水，八幡把几本旧记录摊在桌上。拉芙希妮坐在雪乃平常的位置旁边，已经把学生会转来的委托单按照日期分开。

  “小雪乃。”结衣放下水壶，“谈完了吗？”

  “嗯。”

  “你妈妈是为了奉仕部来的？”

  雪乃把追加意见放在长桌中央。

  “她推动PTA提交了这份文件。意见点名要求学校重新说明奉仕部的独特必要性。”

  八幡拿起来读了一遍。

  “把亲子沟通升级成带委员会抬头的正式文书。看来普通家庭那种在餐桌上问成绩的交流方式，已经无法满足上层社会的工作效率了。”

  “她没有要求校方撤销奉仕部。”拉芙希妮说。

  “没有。”雪乃回答，“她只提出了一个学校可以接受的问题。”

  结衣在她对面坐下。

  “那我们一起想回答吧。上次不是说好，过去的委托记录也一起整理吗？”

  “我会先修改现况确认意见。”

  “成员栏里写了四个人。”拉芙希妮说。

  “对外责任人仍然是我。”

  “顾问栏目前还是空的。”八幡把文件放下，“把所有责任主动集中到唯一有名字的人身上，通常是制造控制狂最喜欢的局面。顺便一提，我没有在暗示任何具体的家庭教育方式。”

  “你的补充说明只会让暗示失去最后一点隐蔽性。”

  雪乃拉开椅子坐下。结衣替她倒了茶，没有再问接待室里还说了什么。拉芙希妮把分好的记录往中间推了一些，八幡继续核对被学生会转交的日期。

  三个人都还在这里。

  雪乃打开深蓝色文件夹，取出那张没有填完的现况确认表。她在最后一栏下面另起一行，写下“现况确认意见”。

  笔尖继续往下。

  “奉仕部的继续设置……”

  她只写到这里。
