场景: 108
幕: "第七幕·重新为奉仕部命名"
时间: "2014年4月21日 · 周一晚 → 4月24日 · 周四放学后"
地点: "比企谷家餐厅 → 总武高特别栋奉仕部活动室 → 教员室"
人物: "比企谷八幡、比企谷小町、比企谷母亲、雪之下雪乃、由比滨结衣、拉芙希妮·都柏林、川崎大志、一色彩羽、高坂理津子、数名一年级学生"
POV: "共享场景／零POV"
正文: |
  “这不是入部届。”

  比企谷母亲把那张纸翻到背面，又对着餐桌上方的灯看了一遍。纸头印着“奉仕部成立公开说明会”，下方列了时间、地点和活动范围，最后一行写着“一年级学生均可参加”。

  八幡坐在她对面，筷子已经停了很久。

  “所以不用看得那么认真。那只是一个最终目的为招收无辜新生的宣传单。”

  “哥哥主动从学校带宣传单回来，怎么看都不是‘只是’吧？”小町从旁边探过来，“而且是哥哥所在的奉仕部。小町分数应该先加多少比较合适呢？”

  “扣完以后归零。”

  母亲把通知放回桌上。

  “新生说明里写得很清楚。正在申请成立的社团只能开说明会，不能收正式入部届。等学校批准、班主任确认以后，你把正式表格带回来，我再盖章。”

  “还需要家长盖章？”八幡问。

  “你入学的时候没参加社团，当然没看过。”

  “原来如此。过去的孤立经验终于在关键时刻保护了家庭印章。”

  “只是确认家长知道放学后的活动安排。”母亲说，“参加什么由小町自己选。你也是。”

  八幡试图利用校规建立的防线就此失效。

  小町拿起通知，先读完活动范围，又读拉芙希妮补在下面的那行小字。

  “不保证实现愿望，涉及安全和专业事项时转交教师……哥哥，你们的宣传语好消极。”

  “是风险告知。真正的善意应该让人拥有在靠近以前逃跑的机会。”

  “那哥哥为什么还在里面？”

  “当年没有这张纸。我属于制度不完善时期的受害者。”

  小町把通知放在自己那边。

  “小町要去听。”

  “不行。”

  “只是说明会哦。校规没有写哥哥可以替妹妹拒绝公开活动。”

  “这里每周要值日，要保管不能拿回家说的委托记录。有人来求助，也不会保证感谢你。更麻烦的是，我们毕业以后，剩下的人要自己找顾问、整理文件，还得解释为什么学校里需要这样一个地方。”

  “哥哥连说明会的内容都在家里讲完了。”

  “这样你明天就不用去。”

  “说明会是周四。”

  “我反对到周四也有效。”

  小町低头看了看日期，把通知夹进新生手册。她没有去碰冰箱旁边装印章的抽屉。

  “小町现在只决定去听。要不要签其他东西，听完以后再说。”

  母亲起身收走空盘子。

  “这样就行。正式入部届拿回来以后，我会再问一次。”

  八幡看着新生手册合上。通知没有被还给他。

  “家里的民主制度为什么总在涉及小町时运行得这么顺利。”

  “因为哥哥提出的议案只有反对，没有替代方案。”小町说。

  “我刚才说了一整页风险。”

  “风险告知不等于替小町决定。所以小町才要认真去听呀。”

  周四放学后，奉仕部活动室的门没有关。

  一色在门外支了一张从学生会借来的课桌，上面放着出席记录和剩余的说明会通知。相同的通知已经在学生会公告栏挂了两天，也随一年级各班的社团活动登记夹传过一轮。

  “学生会只负责证明通知确实公开发布。”她对排在门口的一年级生说，“是否参加、是否签成立意向，全部由本人决定。还有，这个社团目前没有正式成立。”

  “会长，你最后一句说得像风险投资说明。”八幡说。

  “前辈自己写的风险栏比学生会的还长。”

  小町在出席记录上写下名字。她后面还有几名一年级学生，大志排在其中，没有和她一起到场。他带着自己的新生手册，公开通知被夹在社团介绍页中间。

  “大志君也是看公告来的？”小町问。

  “嗯。姐姐说，要来就先把责任栏读完，别只看认识的人在不在。”

  八幡听完那句话，朝大志点了一下头。

  “川崎同学偶尔也会说正确的话。”

  “学长说的是姐姐，还是我？”

  “请选择不会令你骄傲的解释。”

  活动室原来的四把椅子不够用。结衣从隔壁空教室借来几把折叠椅，又给每个人发了一份删去委托人信息的活动说明。装有旧委托记录的文件箱已经上锁，钥匙放在高坂手边。

  高坂站在门边，没有坐下。

  “开始以前先确认资格。奉仕部目前属于申请成立阶段。今天可以公开说明活动内容，也可以让有意愿的学生签署成立成员意向书。校方批准以前，意向书不等于正式入部，你们不能查看保密记录，也不能以奉仕部成员身份处理委托。”

  前排一名男生举起手。

  “签了以后，学校如果不批准呢？”

  “意向书失效。”高坂说，“你仍然可以在新生登记期限内选择其他社团。今天不要求当场签字。”

  另一个女生看了看活动说明。

  “这里会处理恋爱咨询吗？”

  “会先确认那是不是应该由学校社团处理的问题。”雪乃回答，“奉仕部不会替人告白，也不会设计让对方无法拒绝的局面。”

  “那能增加志愿活动证明吗？”有人问。

  “校内委托不会自动换算成志愿服务时数。”高坂说。

  后排传来一阵低声商量。有人本来还要赶运动部体验，听完固定活动时间后先行离开；问志愿证明的学生把说明折好，说要回去考虑。那名询问恋爱咨询的女生留下了通知，没有留下意向书。

  门口的出席记录还在，离开的人没有被划掉。

  等活动室重新安静下来，雪乃才把章程翻到成员职责。

  “奉仕部接受学生提出的困难与协作请求。受理以后，成员可以整理问题、提出方案、联系校内资源。委托人的选择权不会转交给我们。”

  “日常还包括烧水、打扫和写记录。”结衣说，“有时候整个下午没人来。有时候谈了很久，最后也只能陪对方去找老师。帮忙以后不一定会被感谢，做错了还要回来修改。”

  “明年这四名三年级学生毕业，低年级成员需要重新确认顾问、活动计划和受理方式。”拉芙希妮说，“现在签名，意味着你们愿意考虑继承这些责任。还没有想清楚，可以把表带回去。”

  “以及一个被前任成员塞满过期茶叶和失败方案的文件柜。”八幡说，“如果你们期待的是解决烦恼以后获得掌声，建议去参加戏剧部。至少那里鼓掌属于规定流程。”

  小町翻着章程，停在转介规则那一页。

  “小町可以提问吗？”

  “请说。”雪乃回答。

  “一年级学生来这里，说不清自己到底遇到了什么，也可以先听吗？”

  “可以。”雪乃说，“如果需要教师、保健室或校外机构介入，我们会告诉对方原因，再进行转介。”

  “不会因为说不完整就拒绝？”

  “表达能力不是受理条件。”

  小町点点头，把章程放回桌面。

  “小町想签成立意向。”

  八幡从靠墙的位置开口。

  “理由呢？”

  “哥哥刚才听见了。”

  “我想听你完整说一遍。这里的成员不能靠读空气决定别人是什么意思。”

  小町看了他一会儿。

  “小町想知道哥哥为什么一直回到这间活动室。可是，只为了看着哥哥加入，太浪费自己的高中生活了。”

  她把成立成员意向书拉到面前。

  “中学的时候，同学遇到麻烦会先问朋友。朋友也不知道，就只能找老师和家长。有些事情还没想好要不要变成大事，又不能一直放着。小町希望一年级也有一个可以先把话说清楚的地方。等哥哥他们毕业以后，这里不该只剩一块写着‘以前有人用过’的牌子。”

  “你不需要替我们保管遗址。”八幡说。

  “所以小町说的是以后来敲门的人。”

  “完全没有安慰到我。”

  “这段话本来就不是用来安慰哥哥的。”

  小町先填写姓名和年级，签名栏仍然空着。她转头看向大志，没有把笔递过去。

  拉芙希妮问：“川崎同学，你也准备签吗？”

  “我想签。”

  “为什么？”

  “奉仕部以前帮过姐姐。我也想找机会帮忙。小町又正好……”

  八幡抬手截住了后半句。

  “感谢可以用点心解决。认识的人在这里，可以靠放学后一起回家解决。这两项都不需要承担明年的文件柜。”

  大志低下头，重新翻开新生手册。公开通知旁边夹着奉仕部过去的活动介绍，上面标出了“接受学生困难咨询”。

  “姐姐以前每天很晚回家。我只知道肯定出了事，不知道该问老师、父母，还是直接跟着她。我去找奉仕部的时候，连自己希望姐姐停止打工，还是只想知道她平安都说不清楚。”

  他把手册合上。

  “后来事情解决了，我当时还是不知道该怎么办。学校里应该还有人，只能说出‘哪里不对’，却不知道那算不算可以求助的事。我想学会先听清楚，再决定应该找谁帮忙。”

  拉芙希妮问：“如果小町今天不签，你还会留下意向书吗？”

  大志没有马上回答。小町把自己面前的笔收回笔袋，等着他。

  “会。”他说，“会更紧张，不过还是会。”

  “为什么小町不签会让你更紧张？”

  “现在不用追问这个吧！”

  结衣把剩下的空白表格收进文件夹。

  “那个问题可以等你们正式入部以后再讨论。今天只写自己的理由。”

  大志拿出自己的笔，在意向书上写了很久。他写完后从头读了一遍，才在最后签名。

  小町也补上自己的签名。

  雪乃没有说“欢迎加入”。她分别检查两份表格，把它们夹到四名原成员已经签好的成立申请人名单后面。

  “谢谢你们愿意作为成立申请人承担这项选择。”她说，“校方批准以前，你们可以参加公开体验活动。保密记录与正式委托仍由我们四人和高坂老师负责。”

  “如果学校不批准呢？”小町问。

  “那就重新讨论我们还能以什么方式留下。”雪乃回答。

  八幡没有反驳。他把桌边那只上锁的文件箱推回书架下方，给两份意向书留出位置。

  教员室里，高坂先核对学生会盖章的公开通知存档和说明会出席记录，再分别询问小町与大志。

  “你们清楚学校要求的是公开纳新，不是指定你们填补人数吗？”

  “清楚。”小町说。

  “清楚。”大志说。

  “也清楚今天签的不是入部届，学校可能拒绝成立申请？”

  两个人再次回答清楚。

  高坂翻到顾问确认书，在末尾写下：“校方批准成立后，本人愿意承担奉仕部顾问职责。”

  她签上名字，没有碰批准栏。

  “正式入部届要等批准以后发放。届时由班主任确认活动安排，再由监护人签章。监护人确认知情，不替学生选择。”

  小町点头。

  “妈妈已经说会再问一次。”

  “姐姐也说，表格拿回家以后要先给她看。”大志说。

  “川崎同学不是你的监护人。”八幡说。

  “可是不给她看，回家会更麻烦。”

  “这点我无法反驳。”

  教务窗口清点完材料，在封面盖下“受理”章。高坂把带编号的回执交给雪乃。

  “结果会另行通知。在那以前，仍按临时规则活动。两名成立申请人不接触保密材料，也不参与委托处理。”

  雪乃收好回执。

  申请封面的成立申请人栏写着六个名字。第五行和第六行后面多了一项括注：成立意向，待批准。

  八幡读完那行小字，把文件还给雪乃。

  “至少校规还记得替我保留几天反对时间。”

  “哥哥。”小町说，“参加公开说明会以后还能让哥哥承认校规有用，今天的小町分数很高哦。”

  “那套制度没有经过任何公开审查。”

  “可以回家开说明会。”

  “我拒绝参加。”

  这一次，没有人把他的拒绝写进任何表格。
