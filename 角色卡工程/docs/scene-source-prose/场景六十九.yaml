场景: 69
幕: "第四幕·冬假→三学期"
时间: "2014年1月2日 · 周四 · 冬假中"
地点: "家庭餐厅 → 原宿表参道 → 站前咖啡馆"
人物: "拉芙希妮·都柏林、雪之下雪乃、由比滨结衣、比企谷八幡"
正文: |
  "抱歉，接下来的时间，我想单独行动。"

  从家庭餐厅走出来的瞬间，拉芙希妮停下了脚步。她拢了拢羊绒大衣的领口，声音在冷空气里发紧。这一句话像是一块突兀的石头，砸进了原本已经趋于平稳的队伍里。

  雪之下雪乃正低头整理被风吹乱的大衣腰带，听到这句话，整理动作生硬地停滞了一瞬，随后她抬起头，那双冰蓝色的眼眸迅速锁定了拉芙希妮。

  "单独行动？"雪乃的语气立刻降到了冰点，"虽然我不记得我们的补习计划里有'自由活动'这一项。"

  她下意识地看向拉芙希妮放在口袋里的手机，显然还在忌惮昨天初诣中那通被强行切断的视频通话。

  "正是因为那样，才需要单独行动。"拉芙希妮迎着雪乃审视的目光，语气平稳得近乎冷漠，"姐姐在昨天的通话之后，又发了一条信息。她要求我去确认一家店铺的位置。她不喜欢有外人在场的场合，哪怕那个人是……监督者。"

  这个借口精准地击中了雪乃的软肋。她欲言又止，似乎想要反驳这又是某种拙劣的谎言，但一想到爱布拉娜那种强烈的领地意识和控制欲，又觉得这个理由在逻辑上完全成立。

  但她的表情依然写满了抗拒。

  "既然是那种人的要求，那你更应该由我陪同。"雪乃向前迈了半步，挡在了拉芙希妮与商业区方向之间，"你的判断力在那种高压环境下是不可靠的。"

  "不。"拉芙希妮退后了半步，拉开了距离，"如果姐姐发现我带了'尾巴'，那之前我们努力维持的补习借口就会立刻失效。这是为了你好，雪乃同学。"

  雪乃张了张嘴，没有反驳。

  "那……那小拉芙要注意安全哦！"由比滨结衣察觉到气氛的凝重，试图打圆场，她拉了拉雪乃的袖子，"既然是那个姐姐的要求，也没办法嘛……而且我们就在车站附近等她也行呀。"

  "是啊是啊。"比企谷八幡把手插在兜里，懒洋洋地开口，"既然是被姐姐大人召见，咱们这种平民还是别去凑热闹了。万一被当成可疑分子扭送警局，我的新年第一个愿望就要变成保释金了。"

  雪乃的嘴唇抿成了一条直线。她盯着拉芙希妮，似乎在试图从那张平静的脸上找出破绽。但拉芙希妮只是安静地回望着她，左手隔着袖口无意识地摩挲着右手腕上那截烧焦的旧丝带。

  "……三个小时。"雪乃终于松口，声音里满是被迫妥协的恼怒，"三小时内必须回到车站集合点。每四十五分钟向我报备一次位置。如果发生任何异常，立刻——立刻联系我。"

  "我会的。"拉芙希妮微微点头，没有多余的废话。她转过身，米色大衣的衣角在冷风中划过一道利落的弧线。

  就在拉芙希妮迈出几步时，由比滨结衣突然对着她的背影喊了一声。

  拉芙希妮的背影没有停顿，只是微微摆了摆手，很快便汇入了冬日午后熙攘的人流中，消失在街道转角处。

  雪乃站在原地，维持着那个转头的姿势僵硬了两秒，才缓缓转回身。

  "总觉得……"比企谷八幡看着雪乃那张阴沉得快要滴出水来的侧脸，忍不住吐槽，"你现在的表情好可怜。"

  "闭嘴。"雪乃的声音毫无起伏，却透着一股寒气，"如果你再多说一个字，我会让你在接下来的补习里体验什么叫'地狱式默写'。"

  八幡识趣地闭上了嘴。

  雪乃低下头，看着自己空荡荡的手。刚才在餐厅里，拉芙希妮借口去洗手间时，曾把那个随身的小包短暂地交给她保管。那时包的拉链没有完全拉上，她无意间瞥见了一角——一叠崭新的千元钞票，和一张手绘的简易地图，上面用红笔圈出了原宿表参道的一处地点。

  那不像是去见姐姐的路线。

  雪乃的手指在袖子里微微蜷缩，指甲掐进了掌心。她当然知道1月3日是什么日子。那是她最不想面对、却又无法回避的日期。

  "走了，去车站的咖啡馆等她。"雪乃转过身，率先迈开步子，语气冷硬，"如果她迟到了一秒钟，我会让她知道什么是'后悔'。"

  ——

  原宿总店门前排着一条不算长但移动缓慢的队伍。冬日下午的冷风从表参道的方向灌进来，站在拉芙希妮前面的几个女生缩在羽绒服里跺着脚。她把羊绒大衣的领口拢到最高，将下半张脸埋进去，只露出一双翡翠色的眼睛盯着店门口那块"元旦限定·前五十名"的手写告示牌。

  排了将近一个小时。

  她终于在店员的引导下走到柜台前。玻璃柜里摆着那只她在一周前的预售海报上看到就决定要买的潘先生——与普通款圆滚滚的憨态不同，这只穿着缩小版的英伦粗花呢风衣，头上戴着一顶猎鹿帽，右边的爪子里握着一个逼真的微型烟斗。贝克街探案版。原宿总店元旦限定。全日本前五十名。

  店员从柜子里取出最后一只。

  拉芙希妮从大衣内袋里取出那叠崭新的千元钞票。这是她从去年十月开始，每周从家族拨给的生活费里抠出来的——少买一瓶洗发水，少坐两站电车，一次攒几百円。她没有动用家族账户里那笔可以随时支取的备用金，因为那张卡上的每一笔支出都会被家政太太整理成月度报告，发往塔拉庄园。

  这只潘先生不能出现在任何一份家族报告里。

  店员用印着黑白棋盘格图案的牛皮纸袋将潘先生仔细包好，贴上两圈透明胶带。拉芙希妮接过纸袋，将它小心地放进大衣内侧最深的那个口袋——那个之前用来装结衣发卡的位置。纸袋的边缘略微顶到了肋骨的侧面，隔着羊绒和针织衫依然能感觉到那个硬质的棱角。

  她在原宿站附近一间公共洗手间里停了一下。

  镜子里映出她自己的脸。浅金色的长发因为一整天的奔波已经有些松散，发辫尾端那个红色的蝴蝶结依然保持着昨天早晨编进去时的形状。她抬起右手，指尖搭在蝴蝶结上——和昨晚爱布拉娜离开后那个停在半空中的动作一模一样。

  这一次，她拉了。

  红绸带从发辫间滑落，柔软的布料在指尖展开，还原成它本来的长度。她低下头，像那个坐在和室矮桌旁的夜晚做过的那样，将红绸带一圈一圈绕回左手腕。动作很慢。不是因为生疏。是因为每绕一圈，她就离"千叶的拉芙希妮"近了一步，离"都柏林家族的次女"远了一步。

  蝴蝶结重新成形的时候，她的呼吸比刚才更平稳了。

  ——

  咖啡馆玻璃窗外的光线随着午后推移逐渐变薄，墙面指针式时钟的秒针在一片爵士乐的掩盖下持续推进。雪乃的视线钉在桌面上那部毫无动静的旧款手机上，黑色的屏幕将她原本引以为傲的逻辑推演一点点吞噬。距离那个人离开已经过去了一百七十八分钟，没有一条报备位置的讯息。她交叠在膝盖上的双手不知何时变换了姿势，左手拇指抵在右手虎口处，力道让皮肤表面浮现出苍白的印记。

  坐在对面的比企谷八幡在一阵令人窒息的低压中翻过了一页模拟卷，纸张边缘摩擦桌面的细碎声响在这片狭小的空间里被无限放大。雪乃抬起眼睫，那双冰蓝色的眼眸里没有一丝温度，仿佛随时会用最锋利的言辞将对面那个无辜的考生劈得体无完肤。由比滨结衣甚至不敢抬头，只是紧紧握着自动铅笔，在那道她根本解不出的数学题旁画着毫无意义的圈。

  挂在店门顶端的黄铜风铃在此刻发出了一声突兀而清脆的碰撞声。雪乃抵在虎口处的拇指瞬间顿住，视线如同被某种看不见的引力牵扯般迅速越过桌沿投向了入口。有些凌乱的浅金色在推开的玻璃门后闯入视野，拉芙希妮裹着那件米色的羊绒大衣，带着尚未散尽的冬日寒意和肉眼可见的微喘站在那里。她胸口起伏的频率明显快于平时，几根脱离了红绸带束缚的发丝凌乱地贴在略显苍白的脸颊侧，那双翡翠色的眼眸在捕捉到角落座位的瞬间便定格了下来。

  她的左手腕上，那条红色的绸带重新缠绕在深青色针织衫的袖口外——不是编在发辫里，不是藏在布料下。是明晃晃地、毫无遮掩地绑在那里。右手腕上，那截烧焦的旧丝带也露在袖口外，没有被任何东西遮盖。

  她迅速收回了停留在对方身上的目光，脊背重新挺得笔直，试图用一种挑剔且傲慢的姿态将刚才那短暂的失态完全掩埋。当拉芙希妮踩着有些急促的步伐走到桌旁时，那股混杂着冷空气和微弱茶香的气息彻底打乱了原本弥漫在周围的咖啡味。

  "你应该清楚自己只比约定的失效时间早到了不到一分钟。"雪乃的声音平稳得听不出一丝波动，但吐词的速度却明显快于往常，像是迫不及待地要用规矩来给这场让人煎熬的等待画上句号，"在这个效率至上的社会里，踩着底线是对他人极大的不尊重。你所谓的'单独确认路线'，显然超出了你本身的时间规划能力。"

  拉芙希妮没有反驳那些如同冰雹般砸过来的指责，她拉开椅子在雪乃身旁坐下，将冻得有些发红的双手插进了大衣较深的口袋里，顺势将某个略显鼓胀的物体往深处压了压。她轻微调整着紊乱的呼吸节奏，试图让声音听起来自然一些。

  "抱歉，遇到了不得不绕路的情况。"拉芙希妮的声音因为冷风的侵袭而带着一点发紧的干涩。

  坐在对面的比企谷八幡在短暂的停顿后终于抬起了那双疲惫的眼睛。他借着拿红笔修改答案的动作，视线不经意地扫过拉芙希妮那件米色大衣因为坐姿而微微敞开的口袋边缘——那里短暂地露出了一角揉皱的牛皮纸袋边缘，上面印着黑白棋盘格图案。他将视线迅速收回，笔尖在试卷的错题上画了一个生硬的红叉，随后用一种只有自己能听见的音量发出一声混杂着麻烦与叹息的吐气。
