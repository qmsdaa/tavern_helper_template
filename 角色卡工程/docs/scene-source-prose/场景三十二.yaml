场景: 32
幕: "第三幕·二学期"
时间: "2013年10月下旬 · 文化祭开幕当天早晨（距开幕仪式约半小时）"
地点: "奉仕部活动室 → 特别栋走廊"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
正文: |
  活动室略显陈旧的拉门被粗暴地一把拽开。

  木质滑轨发出一声刺耳的悲鸣。由比滨结衣几乎是跌跌撞撞地冲了进来，甚至来不及把被门框绊偏的书包带拨回肩膀。她大口喘着气，琥珀色的眼睛里满是压抑不住的焦急。

  "小雪乃！相模同学不见了！"

  结衣的声音因为跑动和慌乱而有些发劈，她的手撑在长桌的边缘，指节因为用力而泛出紧绷的弧度。

  "执委会那边已经急疯了……到处都在找她！开幕致辞的稿子还在她手里……她、她自己按理也应该要上台的啊！"

  "意料之中。"

  坐在长桌对侧的比企谷八幡连姿势都没换。他用一种干瘪到几乎缺乏水分的语调，替这个彻底偏离轨道的烂摊子做了一个冷冰冰的总结。

  雪之下雪乃没有理会那句带着嘲讽意味的评价。她原本正在核对进度表的手指瞬间停顿了一下，红色的水性笔被轻轻搁在纸面上，没有发出一丁点多余的声音。

  但拉芙希妮看到了，雪乃好看的眉头在这一刻紧紧地皱在了一起。

  奉仕部的底线是提供协助，而不是代替完成。但现在，那个戴着委员长头衔的空壳，居然在距离开幕仅剩半小时的节骨眼上选择了最彻底的逃避。

  "这种时候发脾气解决不了任何问题。"雪乃的声音很快压过了结衣急促的呼吸声，音色里带着一种剔除了感性的冰冷逻辑，"如果她是有计划地躲避责任，那绝对不会离开学校的范围。"

  雪乃站起身，动作干脆利落。

  "执委会的人找过哪些地方了？她可能在避难室、女子更衣室，或者主楼背面的那些旧卫生间……"

  "她不会去那种地方的。"

  拉芙希妮一直沉默地坐在靠窗的阴影里，此时突然开了口。

  她没有去看正在罗列搜寻地点的雪乃，而是将视线越过长桌，径直投向了对面的八幡。

  "避难室或者旧卫生间太偏僻了。"拉芙希妮的语气放得很轻，像是在拆解一个拙劣的机关，"如果躲在一个谁也找不着、连声音都听不见的死角，那别人就没办法在最后一刻'满怀焦急地哀求'她回去了。"

  她看着八幡那双开始因为接收到信息而慢慢聚焦的死鱼眼。

  "所以，相模同学一定会在一个所有人都能看到，但在这个忙乱的时间点，大家又会本能地忽略掉的地方。"拉芙希妮顿了半秒，给出最后一块拼图，"既能看到会场的动静，又能保证自己暂时不被轻易拽走……那样，才符合她的性格。"

  拉芙希妮的最后一句话落在桌面上，像是一把干瘪的钥匙，"咔哒"一声扭开了某个锁扣。

  比企谷八幡的眼皮稍微抬了一下，原本涣散的死鱼眼在瞬间有了明确的焦点。他发出一声极轻的、几乎是从鼻腔里挤出来的干笑，似乎已经完全看透了那个所谓的"显眼但被忽略"的角落到底在哪里。

  他没有再多问半句废话，直接单手拎起搭在椅背上的校服外套，从椅子上站了起来。

  "我去。"

  "我和你一起。"

  雪之下雪乃的声音接得太快了，甚至快过了她思考逻辑的习惯。她几乎是在八幡站起身的同时就推开了椅子，双手撑在桌面上，深蓝色的眼瞳里带着一丝不容拒绝的警惕。

  拉芙希妮坐在旁边，清楚地看到雪乃撑着桌沿的指尖绷得很紧。她知道那种眼神意味着什么——雪乃在害怕，害怕那种把所有恶名都揽到自己身上的"自爆式破局"再一次在这所学校里重演。

  "不行。"

  八幡毫不客气地打断了她。他一边用随便的动作把外套套上，一边用那种听不出半点温度的声音把现实砸向长桌对面。

  "雪之下，你去主席台确认开幕的流程。"他根本不去看雪乃的眼睛，目光盯着手里的扣子，"刚才那家伙的话你听懂了吧？如果相模真的是躲在那里等着人去'哀求'，你那张只会讲道理的嘴过去，只会让她彻底下不来台。"

  他停顿了一下，最终还是把最残酷的底线亮了出来。

  "而且……如果我十分钟内揪不回她，你需要去台上顶那个开幕致辞的缺口。"

  雪乃猛地闭上了嘴。

  那个"顶上"的词像一块沉重的铅，硬生生地砸断了她所有的反驳空间。如果委员长真的跑了，副委员长必须完成后续流程，这是她一向标榜的"责任"和"正确"决不允许她推卸的底线。

  活动室里陷入了一种令人窒息的静默。

  雪乃的视线僵在半空中。她咬住了下唇，原本准备好的指责或者坚持被卡在喉咙里。她很清楚，比企谷八幡正是吃准了她绝对不会放弃大局，才会用这种毫无破绽的理由把她留在安全的后方，然后自己孤身一人去处理那个最容易沾染泥水的烂摊子。

  由比滨结衣有些不知所措地看着这两个人，想要去拉雪乃的手臂，却又在半空中停住。

  八幡没有给任何人继续辩论的时间。他将最后半截扣子胡乱敞着，侧过身，把手插进了裤兜里，朝着活动室那扇敞开的拉门迈出了第一步。

  雪乃猛地别开脸，没有再看八幡那张干瘪的脸。她用几乎是夺的动作，从长桌末端一把抓起了那份厚重的进度表文件夹。文件夹的塑料封皮在空气里发出一声短促而压抑的闷响。

  那是一个放弃争执的明确信号。既然无法阻止他去招惹泥水，那如果连主席台那边的缺口都没人堵上，这场恶心人的逃避就不算结束。

  "走吧，由比滨同学。"

  雪乃的声音冷得像结了冰，步伐迈得极快，连平时整理裙摆的缓冲动作都被省略了。结衣被那声塑料脆响吓得肩膀瑟缩了一下，她看看已经走到门口的八幡，又看看快步走开的雪乃，最终还是小跑着追上了雪乃的背影。那份主席台的慌乱里，小雪乃现在大概很需要有人在旁边吧。

  八幡早就转过了身，双手插在校服裤子的口袋里，拖着那种特有的、毫无精神的步子，越过拉芙希妮，跨出了活动室的拉门。

  走廊上的空气依然带着早晨未散的凉意。他没有往热闹的体育馆方向看一眼，而是直奔着那条最不受待见、也最符合虚荣者"躲藏"逻辑的偏僻侧边走去。那个背影干瘦、驼背，像是一个早就习惯了被所有人排斥，于是理所当然地去接手烂摊子的老套反派。

  拉芙希妮站在拉门边缘，白皙的手指虚虚地搭在木质门框上。

  她没有跟上雪乃去面对那个充满高压视线的主席台，也没有去追八幡那个单薄的背影。她就这么静静地站在那里，看着雪乃和结衣的背影向右边的主楼消失，又看着八幡向着另一侧的阴暗角楼远去。

  一南一北。在这个满是混乱的清晨，他们两个人用一种近乎残酷的默契，把最难堪的部分丢给了自己，把最有底线的责任分给了对方。

  拉芙希妮的左手不自觉地覆上了右手腕上那截有些烧焦的旧丝带。指腹粗糙的触感像是一种冷硬的提醒。她明白那种自焚式的燃烧是不允许旁人插手的，如果你在那时靠近，只会让他的警惕更深。

  所以她会在这里等。等这场因为逃避而引起的闹剧彻底落地，等那把用"正确"包装的火烧完。到那时候，她得去看看那些被烧伤的人。
