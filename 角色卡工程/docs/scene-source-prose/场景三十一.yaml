场景: 31
幕: "第三幕·二学期"
时间: "2013年10月上旬 · 场景三十的直接延续"
地点: "总武高中第三会议室 → 特别栋走廊"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、相模南、优子、遥"
正文: |
  相模南那只握着红色马克笔的手还在半空中，笔端因为用力不稳而在白板边缘擦出了一道断断续续的红痕。她看着面前那两张薄薄的申请表，嘴唇张开，喉咙里发出轻微的气流声，然后又紧紧闭上。

  她甚至连一句完整的辩解都拼凑不出来了。

  这种令人窒息的安静让U形桌前端的气压降到了冰点。优子和遥互相对视了一眼，优子先往前凑了半步，打破了这层冰面。

  "那个……相模同学是不是需要点时间考虑……"她干巴巴地笑着，试图在这张紧绷的桌子上找回点活泼的空气。

  遥也立刻跟上，语气里带着点维护的急躁："对啊，这么重要的决定，不能仓促吧，万一协调不好……"

  "她已经有十分钟的考虑时间了。"

  雪之下雪乃直接切断了那点活泼的空气。她站在长条桌前，视线没有一秒钟离开相模南的脸，声音里的冷淡像刚从冷库里取出的金属尺子，精准而毫无弹性。

  相模南的脸色开始发白。不是那种被激怒的红，而是因为退路被彻底封死、眼看就要当众暴露出无能底牌时产生的慌乱的白。她被逼到了不能继续拖延的死角。

  "V-023……轻音部。"她干咽了一下，视线垂在桌面上，声音细得像是一扯就断的线，"V-031，2年F班。"

  比企谷八幡的死鱼眼顺着她的声音重新扫过那两张表。

  轻音部的Live。全校期待的焦点，文化祭的招牌。
  2年F班的音乐剧。那个平时笑眯眯的音乐老师、同时也是F班班主任在会议上亲自护盘的项目。

  两边都得罪不起。相模南这个连推卸责任都做得如此拙劣的胆小鬼，怎么敢冒着被人讨厌的风险去挥下这一刀。

  八幡发出了一声极短的鼻息。他插在裤兜里的右手慢慢抽了出来。

  他往前走了一步，手伸过去，直接从雪乃和相模南之间的那道看不见的防线上，捏起了V-031那张属于2年F班的申请表。

  他不看相模南。
  他也没有看雪乃。

  "F班驳回。"

  他就像是在报一串毫无意义的超市结账条码，声音干瘪得没有任何起伏。

  "理由是文化祭主要吸引的是校外访客和其他年级学生，一年一度的轻音部Live是招牌项目，不能替换。"八幡捏着那张纸，语速不快不慢，"F班的音乐剧是新提案，时段冲突时应该让位。"

  他在这短短几句话里陈述了一个近乎无可辩驳的客观事实，把所有的逻辑漏洞都填补得严严实实。

  但在那段干瘪的话语中，那个最得罪人的、本该由执行委员长说出来的词，是他自己说的。

  "等一下。"优子先是愣了一下，随即声音拔高了两度，像是在维护领地一样瞪着他，"你是奉仕部的吧？你凭什么越过委员长直接裁决？你有什么权力在这指手画脚……"

  "我没有权力。"

  八幡连看都没看她一眼，直接打断了那连串的质问。他的手重新插回裤兜里，视线越过那张薄薄的申请表，落在了相模南那张尚带余悸的脸上。

  "这只是我个人的意见。"他干瘪的声线里没有半点多余的情绪，像是念着剧本上的台词，"相模同学才是委员长。她可以采纳，当然……也可以不采纳。"

  这是一个不需要任何翻译就能听懂的暗示。

  既然是我个人的意见，如果F班的那群家伙有什么不满，那是我的问题，因为这个得罪人的决定——是我建议的。

  相模南显然听懂了。

  在听到那句"个人的意见"时，她原本因为难堪而发白的脸上，迅速闪过一丝如蒙大赦的松动。那是一种溺水者抓住浮木时、本能且毫不犹豫的贪婪。不需要一秒钟的犹豫，她立刻顺着这个台阶滑了下来。

  "既然……既然比企谷同学这么说了。"她清了清嗓子，试图把刚才那种濒临崩溃的颤音藏起来，重新端出那副执行委员长的架子，"那我作为委员长，参考了你的建议——决定对F班的音乐剧时段进行调整。当然，这个决定是基于……基于奉仕部的专业意见做出的。"

  八幡站在那里，没有反驳。

  这句甩得干干净净的官腔，就是他用自爆换来的结果。

  在这段短暂得滑稽的裁决过程中，雪之下雪乃一直没有说话。

  她原本因为拉芙希妮那句切断了退路的话而略微放松的脊背，在那句冠冕堂皇的"基于奉仕部的专业意见"出口时，猛地重新绷紧了。

  她撑在长桌边缘的手指慢慢收拢，指尖因为用力压着木纹而泛出缺少血色的白。她看着八幡那个略微佝偻、仿佛一切都无所谓的背影，深蓝色的瞳孔深处，有什么尖锐的东西像被硬生生吞下去的冰渣一样刺痛着。

  那是对这种粗暴、自毁且毫无底线的做法的极度厌恶，却又因为对方确实解决了困局而无法当场发作的隐忍。

  "比企谷同学。"

  一个很轻、带着微微卷舌音的声音在长条桌后方响起，只有距离最近的雪乃和八幡能听见。

  拉芙希妮·都柏林坐在那里，视线依然平静。她看着相模南急忙招呼人去把结果记录在案的迫切模样，然后把目光移向了八幡的侧脸。

  "你替她做的事，她不会记得是你做的。"

  这句带着轻微干燥感的提醒，就像是在陈述一个已经被验证过无数次的真理。

  八幡转过脸，视线在拉芙希妮和她身边脊背僵直的雪乃身上短暂停留了半秒。

  "我知道就行。"他发出了一声干瘪的回应。

  僵局被打破后，第三会议室重新恢复了那种表面的喧闹。

  相模南捏着那支红色马克笔，又开始在白板前指手画脚地"统筹全局"起来。她故意用比刚才更高亢的声音分配着一些不痛不痒的杂务，仿佛只要表现得足够忙碌，就能彻底洗刷掉几分钟前那种濒临崩溃的丑态。

  而那些原本应该刺向委员长的针芒，现在毫无保留地扎向了长桌的另一侧。F班的几个女生在整理纸箱的间隙，毫不掩饰地把混杂着厌恶和鄙夷的白眼甩给比企谷八幡。

  八幡低着头收拾书包，仿佛对那些刺人的视线毫无察觉。

  由比滨结衣把笔记本塞进包里，琥珀色的眼睛在八幡和雪乃之间来回转了两圈。她咬了一下下唇，抱着包走到八幡旁边，停顿了一秒，似乎想用平常那种拖着长音的语调说句什么来打圆场。

  但她最终只是把手收紧在了包带上，把话咽了回去。

  在这间充斥着虚伪和推诿的会议室里，现在的气压低得连她那种习惯性的打圆场都变得刺耳。

  雪之下雪乃摘下来自己常戴的防辐射眼镜。

  没有那句惯例的"今天就到这里"，也没有看对面的八幡一眼。她甚至连多余的一秒钟都不想在这个房间里停留。她拎起书包的带子，转身直接走向拉门，步伐比平时快了半个节拍。

  她没有等任何人。

  拉芙希妮立刻拿起了桌沿的预算报表，迈着安静的步子跟上了那个几乎有些决绝的背影。

  从主楼连接特别栋的走廊上铺着一层夕阳的余晖。

  拉芙希妮走在雪乃的左侧，始终保持着落后小半步的距离。她没有试图找话题，只是用余光安静地看着雪乃绷紧的侧脸。

  那不是单纯因为看到恶劣行径而产生的普通愤怒。

  雪乃的视线盯着走廊前方虚无的一点，下颌的线条紧紧收拢着。拉芙希妮在这张漂亮的侧脸上读到了一种似曾相识的痛楚——那像是一道已经被时间勉强糊住的旧伤口，突然被一种熟悉的、带着倒刺的力量，从最脆弱的那个角度，再一次硬生生地撕开。

  拉芙希妮不知道那道伤口是什么时候留下的，也不清楚当年握着刀柄的是谁。

  但她清楚地看到了，它重新裂开时的样子。

  走廊的后方，隔着由比滨结衣有些局促的步伐，还传来着一串慢吞吞的脚步声。

  那是学校统一配发的制式皮鞋在水磨石地板上拖沓出的声音，又闷又钝，带着一种破罐子破摔的干瘪感。

  它就那么不紧不慢地坠在最后面，和雪乃那种快半拍的步频形成了一种糟糕的错位。
