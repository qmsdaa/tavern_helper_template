场景: 82
幕: "第五幕·PTA→舞会"
时间: "2014年3月2日 · 周日 · 午后"
地点: "雪之下家本邸 · 起居室"
人物: "雪之下雪乃、雪之下母、雪之下阳乃（+ 提及：比企谷八幡、由比滨结衣、拉芙希妮·都柏林、平冢静）"
正文: |
  黄铜把手的触感隔着薄薄的手套传来，带着初春特有的滞重与冰冷。

  雪乃站在本邸的大门前，手指渐渐收紧，随后用力推开了那扇沉重的木门。

  熟悉的玄关气味扑面而来。不是具体的花香或熏香，而是长年由高档清洁剂、地毯和静谧堆砌而成的、没有生活气息的冷味。

  她换下鞋子，将带来的伞整齐地收进伞架里，脱下手套塞进大衣口袋，然后拎着书包走向客厅。

  一切都安静得惊人。脚下的走廊隔音效果极好，连布拖鞋踩上去都发不出一丁点儿声音。

  推开起居室那扇双开的毛玻璃门，空间豁然开朗。高耸的落地窗外是灰蒙蒙的天空，厚重的窗帘被拉开了大半。

  母亲坐在那张宽大的红木长桌主位上。深色的丝绒居家服服帖地贴合在肩膀上，她面前放着一套骨瓷茶具。听见开门声，她没有立刻抬头，只是用那双修长而保养得宜的手，将茶杯放回杯垫上。

  没有发出瓷器碰撞的脆响，一点也没有。

  "比预计的时间晚了五分钟。"

  平稳、舒缓，听不出任何责备的意味，却像是在直接宣读已经被确凿无疑的测量结果。

  雪乃在距离她隔着三个座位的客座前站定。"抱歉。路口的电车有延误。"

  "呀，雪乃酱回来了。"

  随着这声甜腻到发软的嗓音，阳乃从另一侧的内室里走了出来。她穿着一件酒红色的宽松针织衫，手里端着半杯玻璃杯装的冰水，脸上挂着那种无论看多少次都让人觉得看不透的笑容。

  她拉开母亲左手边的椅子坐下，两条长腿交叠在一起。

  "我还以为，你会像小孩子一样，找借口说今天身体不舒服，躲在那个公寓里不肯出来呢。"

  "如果你觉得这种假设能让你觉得有趣的话，随你怎么想。"雪乃拉开椅子坐下，将书包放在了膝盖上。

  这里的空气比她那间公寓更让人觉得胸口发闷。她没有去看阳乃，视线落在了母亲面前那张深色木桌的光滑桌面上。

  "茶就不必了。"母亲并没有理会阳乃的挑逗，视线终于越过杯沿，落在了雪乃身上。"既然回来了，那就直接说正事吧。你带回来了吗？"

  那道目光锐利而深邃，就像是在评估一件刚被送出库房、还需要再次抛光打磨的物件。

  雪乃从书包的夹层里抽出了那张折叠得平平整整的纸。

  进路调查表。

  纸张摩擦的声音在空旷的客厅里显得尤为刺耳。她双手将表格推到了桌子中央。

  母亲没有去拿。她只是微微低下头，在那张纸上扫了一眼。

  "文科。法学方向。"

  母亲的声音依然没有任何起伏，但周围的空气在那一瞬间凝固了。

  "志愿校的栏目还空着。"母亲终于抬起头，直视着雪乃的眼睛，"不过，这并不妨碍后续的准备。预备校、推荐人和大学期间的见习安排，家里会替你联系。"

  不是询问，而是一份已经开始执行的通知。

  "法学符合你过去的成绩积累，也符合家里对你的后续安排。"母亲缓慢地陈述着，"既然你最终作出了合理的判断，就不该再把时间浪费在没有意义的犹豫上。"

  "哎呀，法学？"阳乃凑近了一些，用手指轻轻弹了一下玻璃杯，"最后还是回到妈妈替你画好的格子里了呢。可是雪乃酱之前不是一直很认真地烦恼，该怎么证明这是自己的选择吗？"

  雪乃放在膝盖上的手慢慢攥紧了书包的提手。

  帆布的粗糙感勒在掌心里。几天前，她也曾在这个位置放过那份被反复批注的预算表，也曾在沙发上抱紧过那个穿着风衣的玩偶。

  那时候的心跳是因为那些不按常理出牌的同伴，而现在，这种令人窒息的心跳，是多年来刻在骨子里的、面对这双眼睛时就会产生的条件反射。

  "既然结果相同，就没有拒绝安排的必要。"
  "你所擅长的一切，本来就是家里培养出来的。"

  脑海里那些在公寓里反复预演过的冰冷台词，和现在母亲所说的话一模一样。

  雪乃松开了抓着书包提手的手指。胃里还残留着早晨那一杯热茶的、虽然微弱但切实存在的温度。

  "我选择的是法学方向。"雪乃看着母亲的眼睛，尽量让自己的声音不要发抖，"不是家里替我安排的见习，也不是毕业后的任职去向。请不要把它们当成一份不可拆分的东西。"

  "不可拆分？"母亲微微眯起眼睛。

  "是的。"雪乃挺直了脊背，"法学符合我的成绩和适性，我也愿意学习它。但这不代表我同意让别人提前决定这些知识以后必须用在什么地方。方向相同，不代表作出决定的人也相同。"

  客厅里陷入了短暂的死寂。

  阳乃拿着玻璃杯的手停在了半空，笑容在嘴角僵了一下，随后饶有兴致地挑起了眉毛。

  母亲静静地看着她。那种目光不再是单纯的审视，而多了正在权衡什么新变量的冷意。

  "你的意思，"母亲终于开口了，语速比刚才慢了半拍，"你要保留家里为你培养出的判断力，选择最适合你的道路，却拒绝承认这条道路所附带的责任？"

  "我会承担自己选择法学的后果。"雪乃迎着那道目光，声音不再有平时的闪躲，"但家里替我决定的去向，不是我的责任。如果法学最后是错误的答案，我也会清楚地承认那是我的错误，而不是把答案交给别人以后再假装自己从来没有选择过。"

  话音落下。

  母亲没有立刻反驳。她盯着雪乃看了很久，视线在雪乃那张虽然紧绷但已经没有任何退意的脸上转了一圈。

  随后，她伸出食指，在那张平摊在桌子上的进路表边缘，轻轻地敲了一下。

  沉闷的敲击声，在安静的房间里荡开。

  那一声沉闷的敲击后，宽大的起居室里只剩下空调出风口细微的运作声。

  雪乃保持着挺直的坐姿，视线落在母亲的手指上。那根保养极好的食指停留在进路表的边缘，指甲修剪得圆润整齐，没有涂任何指甲油，却因为微小的压迫力而在指节处泛出一点苍白。

  她没有像往常那样急切地去寻找解释的词汇。刚才那番关于"选择法学"的话已经是她能给出的最大程度的坦诚，她清楚地知道，如果在母亲敲击桌面后立刻补充说明，那些话就会从"陈述决定"变成"祈求许可"。

  她闭着嘴，安静地等待着。

  膝盖上的书包随着她呼吸的频率微微起伏。隔着厚重的布料，那些文具、书籍和那个缩在深处的毛绒玩偶构成了微弱的重力场，把她稳稳地钉在这张椅子上，不至于被对面那双深不见底的眼睛看穿。

  一秒。十秒。或者是半分钟。

  在这让人忘了如何呼吸的寂静里，"叮"的一声脆响突兀地打破了僵局。

  阳乃咬着玻璃杯的边缘，冰块顺着杯壁滑落，撞到了杯底。她将杯子放回桌面上，一圈化开的水渍立刻印在了深色的原木上。

  "妈妈，雪乃酱可是很认真的呢。"阳乃双手托着下巴，身体向前倾了倾，"你看她现在的表情，简直就像是一只觉得只要竖起毛就能吓退猎犬的流浪猫。如果再逼她的话，说不定她真的会咬人哦。"

  "如果你所谓的独立，就是把家里教给你的东西重新命名为个人选择，再切断它应当承担的义务，那确实很方便。"母亲终于收回了手。她慢慢地往后靠在椅背上，视线从那张纸上移开，重新定格在雪乃的脸上。

  "那不是从别人那里学来的。"雪乃轻声说。

  "是吗。"母亲的声音里听不出任何波澜，甚至连嘲讽的意味都很淡，只是客观描述，"那么，预备校、报考指导、推荐人与见习机会，你准备怎样处理？如果你拒绝这些安排，我是否可以认为，你已经做好了不再用未来的服从交换家里支持的准备？"

  这是最现实、也最直接的切断。

  雪乃的后背僵了一瞬，但很快又恢复了平稳。她看着进路表边缘那道被母亲敲出来的细微折痕，它像是一条浅浅的界线。

  "是的。"她听见自己的声音在空旷的客厅里回荡，虽然不大，但咬字清晰，"除了现在公寓的基本生活费用之外，关于升学和补习的事项，我会自己解决。没有附带条件的帮助，我不会为了证明什么而拒绝；但我不会用毕业后的去向交换它。"

  "自己解决？"阳乃像是听到了什么好笑的笑话，噗嗤一声笑了出来，"雪乃酱，你是不是把生活想得太简单了？法学是你自己选的，拒绝妈妈替你铺好的路也是你自己选的，然后呢？你指望那个只有三个人的过家家社团替你证明，这两件事真的能分开吗？"

  阳乃的目光像针一样扎过来，带着她特有的那种洞穿一切的恶趣味："啊，或者我应该说，是指望那个整天把没用的话挂在嘴边的小男生？还是那个看起来一阵风就能吹倒的留学生？"

  雪乃的视线终于从桌面抬起，冷冷地扫向坐在左侧的姐姐。

  "这和他们没有任何关系。这是我自己的进路表，不是社团的活动企划。"

  "但你现在的底气全都是他们给的不是吗？"阳乃的笑容扩大了，眼底却没有笑意，"明明以前只要妈妈随便说一句，你就会像个被丢掉的玩偶一样不知所措。现在却敢坐在这里谈什么'承担后果'。雪乃酱，你到底是因为找到了自己的路，还是因为找到了可以躲避的借口？"

  "如果你只能把别人的决断曲解为借口，那我们之间确实没有什么好谈的。"雪乃将视线重新收回，直接越过了阳乃，看向主位上的母亲，"如果是关于这份表格的事，我已经说明完毕了。"

  母亲端起刚才放下的茶杯，送到唇边抿了一口。

  "即使我在这里签了字，也不代表我认可了你对责任的解释。"母亲放下茶杯，骨瓷和杯垫再次发出了那种被控制得极好的摩擦声，"法学方向本身没有需要反对的地方。我会看着你能在这种拒绝安排的清高里坚持多久。当现实的费用和机会摆在面前时，我希望你还能像现在这样，坐得这么直。"

  她拉开抽屉，拿出了一支黑色的钢笔。

  笔尖落在纸张上的声音沙沙的。母亲在表格最下方的家长意见栏里，流畅地签下了自己的名字。

  雪乃看着那个熟悉而凌厉的签名。没有长篇大论的驳回，也没有暴怒的撕毁。母亲用最轻描淡写的方式承认了表格上的方向，又把对她选择权的审判延长到了毕业以后。

  "拿走吧。"母亲将笔盖合上，把表格往前推了十公分，"然后用你自己的方式，去收拾你弄出来的局面。"

  雪乃站起身，动作因为先前的紧绷而迟钝。她伸出手，指尖捏住表格的边缘，将其重新折叠好。

  "我会的。"

  她将表格放回书包的夹层，重新拉好拉链。

  "那么，我先失礼了。"雪乃微微躬身。她没有去看阳乃那副还在等待好戏的表情，直接转过身，朝着来时的毛玻璃门走去。

  "下个周末，"母亲的声音在她的后背响起，让她的脚步顿了一下，"让平冢老师和你那个社团里的人，或者说，和你一起弄那个预算案的相关人员，来家里吃顿饭。"

  雪乃猛地转过头，瞳孔有一瞬间的收缩。

  "这是家庭内部的餐会，请不要把毫无关系的人卷进来。"雪乃的声音第一次出现了不稳。

  "毫无关系吗？"母亲看着她，眼神平静如水，"既然你坚持这是独立决策，作为母亲，我总该见见那个让你相信自己能够把法学和家族安排拆开的环境。还是说，你刚才那些话，只是说说而已？"

  雪乃站在门边。客厅里那股冷硬的空气一下子变得更加粘稠。她看着坐在那里的母亲，知道这件事已经不再有任何反驳的余地。

  "……我知道了。"

  她推开那扇毛玻璃门，将起居室里压抑的一切重新关在了身后。
