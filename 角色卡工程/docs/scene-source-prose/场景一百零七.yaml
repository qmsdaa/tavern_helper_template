场景: 107
幕: "第七幕·重新为奉仕部命名"
时间: "2014年4月21日 · 周一放学后"
地点: "总武高特别栋奉仕部活动室"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林、高坂理津子、一色彩羽"
POV: "共享场景／零POV"
正文: |
  高坂理津子把一叠表格放到长桌上。

  “这是正式社团成立申请。”

  最上面一页印着总武高的校章，下面依次夹着成立申请人名单、活动章程、年度计划和顾问确认书。纸张还带着复印机留下的热度，右上角没有填写社团名称。

  八幡拿起那份成立申请人名单，看完第一行便放了回去。

  “打扰了。奉仕部决定继续保持地下经营。”

  “你连条件都没有读完。”雪乃说。

  “最低五名在籍学生。我们只有四个。算术在这种时候总是比人的愿望可靠。”

  “比企谷同学终于承认基础教育具有实际价值，值得记录。”

  结衣把表格拉到自己面前。

  “再找一个人就可以了吧？”

  “人数只是第一项。”高坂说，“四位目前都是三年级。正式社团还需要至少一名非毕业年级成员，并提交下一学年的继承安排。”

  她把成立申请人名单下面那张《新生社团活动登记说明》抽出来。

  “还有公开纳新。正式社团不能只在熟人之间指定一名学生补足人数。申请成立期间可以举行公开说明会，让所有一年级学生获得相同的信息。愿意成为成立成员的人签署意向书，等校方批准后再提交正式入部届。”

  八幡把刚放下的名册重新拿起来。

  “也就是说，我们需要一名低年级学生。除了人数，还要负责在我们毕业后继承这间问题学生收容所。”

  “奉仕部没有被登记为问题学生收容所。”

  “那是因为过去的文件不完整。”

  “文件不完整无法替你的自我评价提供法律效力。”

  拉芙希妮翻到活动章程。纸上只列了标题和学校要求的基本项目，活动目的、受理范围、成员职责和停止条件全部留白。

  “章程需要写到什么程度？”她问。

  “学校不要求你们预先列出所有委托。”高坂说，“需要写清楚哪些事情可以受理，哪些必须转交教师、保健室、学生会或校外机构。还要说明记录由谁保管，谁可以查看。”

  “委托人不愿留下姓名呢？”结衣问。

  “可以使用非公开编号。公开活动记录至少保留日期、事项类别、处理状态和转介去向。涉及个人身份的部分另行保管。”

  “听起来越来越像一家需要应付合规审查的咨询公司。”八幡说。

  “如果你们继续处理他人的私人问题，合规并不是多余的装饰。”高坂回答。

  她从黑色文件夹里取出场景106留下的委托记录复印件。基本事项栏写着“个人选择与行动理由的整理”，四名处理成员的签名排在旁边。

  “这份记录可以作为章程样例。你们已经写明委托人的决定权、成员可以提供的帮助和需要转介的部分。正式注册意味着以后也要维持同样的边界。”

  雪乃把章程翻到成员职责一页。

  “如果成员对处理方式无法达成一致呢？”

  “由你们自己设计决策程序。学校只要求涉及安全、违法风险和重大校园事务时必须通知顾问。”

  “多数表决不适合私人委托。”拉芙希妮说，“人数多的一方未必比委托人更了解他想保留什么。”

  “全体一致也会让任何一个人拥有无限否决权。”雪乃说。

  “可以先确认是否受理，再分别记录异议。”八幡说，“反正我们从来没有真正意见一致过。强行装成一个声音，只会增加伪造会议记录的工作量。”

  “小企，最后那句不可以写进去。”

  “放心。我的贡献通常会在正式文件形成前被集体删除。”

  雪乃拿起笔，在空白处写下：“受理决定由在场成员共同确认；处理方案允许保留异议；委托人拥有最终选择权。”

  她写完以后，把表格转给另外三个人。

  “这只是初稿。需要修改就直接标注。”

  结衣先在“允许保留异议”下面画了线。

  “这一句留下。我觉得很重要。”

  “你可以提出修改意见，不需要用划线代替投票。”雪乃说。

  “可是划一下比较明显嘛。”

  拉芙希妮在“委托人拥有最终选择权”后面补上：“但学校安全责任不因此免除。”

  八幡看了一遍，只在页边写了两个字：“太长。”

  “你的反馈缺少可执行内容。”雪乃说。

  “删掉所有读起来像学生会规章的部分。”

  “这样只会剩下社团名称。”

  “简洁有力。”

  活动室的门在这时被敲响。一色彩羽抱着牛皮纸文件袋走进来，最上面的封口处已经被重新折过，仍留着一道压痕。

  “打扰了。学生会来归还一批历史资料。”

  她把文件袋放到高坂的黑色文件夹旁边，语气比平时正式。八幡看了看她，没有听到熟悉的“前辈”。

  “这是学生会过去一年转交给奉仕部的委托复印件，还有文化祭、圣诞活动和游园会期间的协作记录。”一色说，“涉及个人姓名的部分已经遮掉了。”

  “辛苦了。”雪乃说。

  “雪之下前辈居然会这么正常地道谢，害得我差点以为自己送错房间了。”

  “如果你希望得到更熟悉的待遇，我也可以指出学生会把资料拖到今天才送达。”

  一色把文件袋往长桌中间推了一些。

  “前几天来过一次。当时里面好像在谈很重要的事情，我就先回去了。”

  她没有说自己听见了什么。结衣正准备拆文件袋，听到这句话后停了一下，又继续解开缠在封口上的棉线。

  高坂取出协作记录，按日期翻了几页。

  “学生会希望奉仕部正式成立吗？”

  “希望。”一色回答得很快，“学生会每年都会收到一些不适合直接用委员会名义处理的请求。以前我可以来这里找前辈，明年换了会长，这条联系就会消失。”

  “正式社团也不能成为学生会绕开教师责任的出口。”

  “所以我带了记录。”一色说，“哪些是学生会负责，哪些交给奉仕部，最后由谁确认，里面都写了。以后也可以按同一套方式留档。”

  八幡靠在椅背上。

  “学生会长亲自为地下组织提交业务需求。总武高的行政奇迹又增加了一项。”

  “现在申请正式成立，就是为了让前辈失去继续自称地下组织的乐趣。”

  “请不要以剥夺他人的廉价乐趣为校园治理目标。”

  一色终于笑了一声。

  “那前辈要不要加入学生会？这样每天都有更昂贵的痛苦可以体验。”

  “我拒绝。”

  “好快。难道前辈刚才是在担心和我一起工作以后会产生办公室恋情吗？对不起，我虽然对认真工作的男性没有意见，但前辈距离那个条件还隔着完整的录用流程。”

  “为什么拒绝学生会还要附赠拒绝恋爱。”

  “正式记录需要写清楚处理状态嘛。”

  结衣抱着拆开的文件袋笑了起来。雪乃没有制止，只把学生会协作记录放到现况确认表旁边。

  “这些记录能够证明奉仕部具有独立价值吗？”她问。

  “能够证明学生会存在稳定的转介需求。”高坂说，“能否成为正式社团，仍然取决于你们是否满足成立条件并持续承担责任。”

  她翻到申请材料的最后一页。

  “还有顾问。正式社团必须有校内教师签字，负责安全确认、活动记录审阅和必要转介。顾问不能只提供姓名。”

  活动室安静了一会儿。

  “高坂老师愿意担任吗？”结衣问。

  “目前我只负责评估。”

  “也就是说，就算找到第五名成员，写完章程，仍然可能没有老师签字。”八幡说。

  “是。”

  “这套制度很懂得怎样让人在完成一叠表格以后发现下一叠表格。”

  “你们也可以申请同好会。”高坂说，“同好会的成员和顾问条件较宽，活动室与对外协作权限会受到限制。现有茶具和资料可以临时保管，但不能长期独占这间活动室。”

  雪乃看着申请表上的两个选项。

  “如果申请正式社团，材料齐全以后，学校会受理吗？”

  “会受理，也会根据章程、成员、顾问和试行记录作出判断。我不保证结果。”

  “PTA的追加意见呢？”

  “会作为意见附在评估材料中。它不能代替学校结论。”

  雪乃拿起笔，却没有立刻落下。

  “我准备申请正式社团。”她说，“你们有反对意见吗？”

  “没有。”结衣说。

  “我也没有。”拉芙希妮说。

  八幡看着那张只写了四个名字的名册。

  “我对申请本身没有意见。对缺少新成员和顾问的状态很有意见。”

  雪乃在“申请类别”一栏勾选了正式社团。

  “你的异议属于执行问题。”

  “你昨天已经同意受理一项没有完成期限和验收标准的长期委托。现在才要求难度合理，顺序很奇怪。”

  “人会从错误里学习。”

  “那就请你学习如何完成成员招募。”

  “我拒绝。招募这种行为本质上是在公共场合承认我们需要别人。已经超出我的心理承受范围。”

  “小企昨天连真物都说了，现在才害怕承认缺一个人吗？”结衣问。

  “请把那件事从部内教材和日常会话里一起删除。”

  “说出口的话应该算数。”拉芙希妮说。

  八幡没再接话，拿起MAX咖啡喝了一口。

  高坂收走现况确认表，留下正式申请材料。

  “材料没有期限优惠。你们准备齐全以后交到教员室。正式批准以前，仍按现况确认期间的规则活动。”

  “明白。”雪乃说。

  一色把学生会协作记录整理好，没有把自己名字写进成立申请人名单。

  “说明会通知可以放在学生会公告栏。”她说，“一年级各班也有社团活动登记夹。我可以让负责同学把同一张通知放进去。”

  “不需要。”八幡立刻说。

  “这是正式申请的必要程序。”高坂说。

  “公开说明只会吸引对解决青春烦恼抱有错误幻想的人。我们会收到恋爱咨询、占卜请求和寻找走失橡皮擦之类的业务。”

  “橡皮擦丢了也会很困扰呀。”结衣说。

  “由比滨，你已经开始替不存在的委托人辩护了。”

  拉芙希妮拿起空白通知，在活动内容下面补了一行：“不保证实现愿望；涉及安全与专业事项时转交教师。”

  “先把不会做什么写清楚。”她说，“看到以后仍愿意来的人，再听完整说明。”

  “那小町和大志君也能看到吧？”结衣问，“他们都是一年级，也认识我们。”

  八幡把咖啡罐放回桌面。

  “不行。”

  “他们只是可能阅读通知的学生。”雪乃说，“即使我们认为合适，也必须经过和其他一年级生相同的说明与本人登记。”

  “你已经把我妹妹列进候选范围了。”

  “由比滨同学提出了两个名字。我只是在纠正你试图提前行使的否决权。”

  高坂看过拉芙希妮补上的那一行，又在通知顶端填下周四的日期。

  “今天确认说明内容，明早交给学生会。说明会之前，不要收取任何人的入部届。你们现在没有接收正式部员的资格。”

  雪乃接过通知，放到八幡面前。

  “既然你反对，应该由你负责核对风险部分。”

  “这是什么强制分工。”

  “让反对者拥有陈述反对理由的机会，符合你刚才要求保留异议的规则。”

  八幡看完通知，把它对折后塞进书包外层。纸角没有完全进去，露出一行“一年级学生均可参加”。

  “我只负责说明风险。”他说，“不负责把任何人带来。”

  “没有人要求你带她来。”雪乃说。

  八幡拉上书包拉链，那张纸被压在透明夹层后面。

  “就是因为不用带，她自己也会来，才麻烦。”
