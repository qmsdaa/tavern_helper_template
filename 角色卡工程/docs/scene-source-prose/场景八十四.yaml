场景: 84
幕: "第五幕·PTA→舞会"
时间: "2014年3月3日 · 周一 · 放学后"
地点: "总武高 · 特别栋闲置教室（奉仕部部室）→ 生活指导准备室"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林、平冢静"
正文: |
  特别栋闲置教室里的空气，通常是被红茶的热气和某人干瘪的吐槽撑满的。

  但今天下午的茶香被什么东西往下压了压。窗外的天色阴沉，风撞在玻璃上发出沉闷的闷响。

  雪乃坐在长桌靠近热水壶的那一端，右手拇指和食指捻着文库本的一角。那薄薄的一页纸已经被她捻得发软，但她并没有要翻过去的意思。

  视网膜上印刷着密密麻麻的铅字，她一个字也没看进去。

  由比滨结衣正在对面小口咬着一块带包装的玛德莲蛋糕，塑料纸发出细碎的响声。比企谷八幡坐在斜对角，视线低垂，正在试图弄清楚那本轻小说封面上的插画到底画了几个角色。拉芙希妮坐在雪乃左侧，安静地翻着她那本英日对照的诗集，左手腕的红绸带在袖口边缘若隐若现。

  很普通的日常。

  但在距离现在不到十秒钟之后，这种日常就会被她亲手砸碎。

  雪乃松开了那页被捻软的纸，将文库本合拢，放在了桌面上。封面与桌面碰撞发出了一记并不响亮、但足够清晰的闷声。

  塑料纸的沙沙声立刻停了。由比滨抬起头，琥珀色的眼睛在雪乃的脸上停住，嘴边的蛋糕沫还没来得及擦。比企谷那双原本就缺乏生气的死鱼眼慢慢抬了起来，视线像缓慢移动的雷达，最终锁定了长桌的这一端。

  只有拉芙希妮的翻书动作没有停，但手指的速度明显慢了半拍。

  雪乃端起手边的瓷质茶杯，温热的杯壁把指尖的冰冷压了回去。她抿了一小口大吉岭红茶，咽下去的时候，喉咙因为干涩而发紧。

  "有一件事。"她的声音很平，没有起伏，像是在宣读某份社团活动报表，"下个周末，需要占用大家一点私人时间。"

  教室里没有人接话，连风撞击玻璃的声音都显得刺耳。

  "那份文科进路调查表，她已经签了字。"雪乃垂下视线，看着茶杯里暗红色的水面，波纹在轻微地晃动，"但她提出了一个附加条件。她要求我邀请平冢老师，以及奉仕部的全体成员，到本邸进行一次正式的聚餐。"

  "本邸"两个字说出来的瞬间，桌子对面的比企谷僵了一下。那是本能的对"麻烦"的抗拒。

  "等一下，小雪乃……"由比滨咽下嘴里的蛋糕，声音变得小心翼翼，"你说的是，雪乃的妈妈？去……去你家里？"

  "确切地说，是去那栋我不愿意回去的房子。"雪乃将茶杯放回瓷托盘里，发出一声清脆的磕碰声，"她想确认，我把法学方向和家里的后续安排分开，究竟是自己的判断，还是受到了奉仕部的影响。这是一场针对我的社交圈、或者说是针对奉仕部本身的一次评估。"

  她抬起头，视线扫过长桌上的三个人，肩膀的线条绷得很紧。

  "所以，你们完全有理由拒绝。"雪乃的语速加快了，"这是一次极具压迫感且毫无益处的会面。你们不需要为了证明自己没有替我作决定，去承受那种无端的审视。"

  这是她能想到的、最坚硬的盔甲。把请求包装成"风险提示"，把朋友间的依赖拆解成"利益交换"。只要说得足够冰冷，如果他们拒绝，自己就不会显得难堪。

  比企谷没有立刻说话。他重新把视线投向手里的轻小说，左手甚至还漫不经心地翻了一页。

  雪乃的后背挺得更直了，双手在桌面下交握，指甲嵌进了手背的皮肤里。那种熟悉的、被拖向灰暗深渊的窒息感又开始在胸腔里弥漫。那幅画里的羽毛，真的化作了实质。

  "那个……"

  坐在旁边的拉芙希妮终于合上了书。她没有看雪乃，而是侧过头，看着窗外阴沉的天空。

  "既然是'正式聚餐'，那请问雪乃同学，对我们的着装有什么具体要求吗？总武高的校服是可以被接受的最低标准吗？另外，需不需要准备符合那个家庭规格的伴手礼？"

  干燥、平静，甚至还带着一点点因为麻烦而衍生的学术探讨式的严谨。

  雪乃愣住了。交握在桌下的手不自觉地松开。

  "不需要伴手礼。那种场合……他们并不在意那些。"雪乃下意识地回答，声音里的那层冷硬的壳突然就裂开了一条缝。

  "那就好。"拉芙希妮转过头，浅金色的头发随着动作轻轻扫过毛衣的领口，"如果需要定制特殊的礼服，那这个周末的时间可能就不够了。"

  她没有问"你母亲到底想干什么"，没有安慰说"别怕，我们在"。她只是直接越过了那道充满荆棘的门槛，开始讨论进门后的规矩。

  这就是那个总是用着"用橡皮擦不掉的笔写字"的人，所能给出的、最不讲理的接纳。

  "我也要去！"由比滨的声音突然高了八度，她猛地站了起来，动作太大差点掀翻了身后的椅子，"如果是去见小雪乃的妈妈……我、我得回去问问我妈妈有没有什么拿得出手的点心配方！不能在气势上输掉！"

  这种毫无逻辑的"气势比拼"，让雪乃眼眶里的酸涩瞬间被无奈的荒谬感取代。

  "由比滨同学，刚才我已经说过了，这不是需要你们去'战斗'的场合……"

  "真是麻烦。"

  一声干瘪的、带着浓重鼻音的叹息从对角线传来。

  比企谷合上了轻小说，把它扔在桌子上。他伸手从书包侧面的网兜里抽出一包只剩下一半的纸巾，然后又摸出了一罐甚至没有开封的MAX咖啡。

  手指扣住金属拉环，"咔哒"一声，刺耳的开罐声在部室里响起。

  "原本这个周末是打算彻底在被炉里度过的。现在这种天气，还要跑去那种一听就充满了规矩和麻烦的地方，光是想想就让人想立刻提交退部申请。"比企谷喝了一口咖啡，甜腻的气味立刻飘了过来，他的死鱼眼半耷拉着，目光并没有落向雪乃，"不过，既然平冢老师也会去，那就算我们不去，那个暴力女大概也会用她的阿斯顿马丁把我们绑架过去吧。"

  他把那罐甜得发腻的咖啡放在桌子上，"时间，地点。最好能报销车费。"

  雪乃看着他那张因为嫌麻烦而皱在一起的脸，又看了看对面握紧拳头的由比滨，最后转头看向旁边正平静地重新翻开诗集的拉芙希妮。

  那股试图把她拖入深渊的重力，突然就消失了。

  那些附着在进路表上的、母亲的冷厉目光，在这个小小的闲置教室里，被几句关于"着装"、"点心"和"车费"的吐槽，硬生生地冲散成了没有任何威胁的泡沫。

  "车费是不可能报销的。"雪乃将双手重新放回桌面上，指尖轻轻压住那本文库本的封面，"时间是周日晚上六点。地点稍后我会把地址发给你们。另外，由比滨同学，请务必不要携带任何带有杀伤性气味的手工作品。"

  "欸——！我明明已经进步很多了！"

  "比企谷同学，你的衬衫领子如果不洗干净，连平冢老师的阿斯顿马丁都不会让你上车的。"

  "那是阴影！是光线问题！"

  雪乃没有理会那些抗议。她端起已经微凉的红茶，再次抿了一口。

  其实红茶的味道并没有变，但那种大吉岭特有的涩味已经淡了很多。她看着窗外依然阴沉的天空，手指在茶杯的边缘轻轻摩挲了两下。

  这只是一次聚餐而已。

  放学后，平冢静把八幡叫到了办公室。

  "咔哒。"

  金属滚轮摩擦燧石的声音在安静的生活指导准备室里显得刺耳。

  比企谷八幡站在办公桌前，视线落在那团跳动的蓝色火苗上。平冢静靠在椅背上，手指捏着一只银色的Zippo打火机。她并没有拿烟出来，只是单纯地按下、点火、松开，再按下去。火光在她黑色的瞳孔里忽明忽暗，把她平时那种总是带着点暴力或者热血的气场压得很低。

  墙上的挂钟时针刚刚越过五点的位置。走廊外面偶尔还能听到参加社团活动的学生跑过的脚步声，但那些声音完全无法穿透这扇门。

  这已经是被叫来这里的第五分钟了。

  "如果有事的话，您可以直接从处分单开始念吗？站在这里发呆让我有已经被判了无期徒刑的错觉。"比企谷把手插进西装外套的口袋里，调整了一下站姿。

  "咔哒。"

  火苗再次熄灭。平冢静把打火机扔在了堆满文件的桌面上。金属外壳砸在纸张上，发出一声闷响。

  "你准备好去送死了吗，比企谷？"她抬起头，手指交叉垫在下巴下面，语气里没有一点开玩笑的意思。

  比企谷的肩膀绷了一下。他把视线从打火机移开，转而盯着桌角那个装回形针的塑料盒。"如果您说的是这周末那场名为聚餐实为批斗大会的活动，那我只能说，作为一个常年负责在班级里垫底的阴暗角色，我对挨骂这种事还是有一定的抗性。"

  "别说这种废话了。"平冢静的声音提高了一度，"你以为这次面对的是相模那种只会在意别人目光的小女孩，还是那些只会起哄的同班同学？"

  她站起身，绕过办公桌，走到窗边。窗外的天色压得很低，看样子又要下雨。

  "雪之下夫人。"平冢静念出这个称呼的时候，声音低得像是在提醒一个危险的禁忌，"她是一个完全用理性和结果来衡量一切的人。她不会因为你的那些小聪明或者自损八百的战术而感到羞愧，她只会看到一个漏洞百出的、不成熟的系统，然后毫不留情地把它彻底碾碎。"

  比企谷的手在口袋里握紧了一些。他当然知道。光是从雪乃每次提到母亲时那种凝固的表情，还有那份带有红笔批注的PTA反馈文件，就能闻出那种令人窒息的气味。

  "那我们就老老实实地去蹭顿饭，吃完赶紧滚蛋。"他说，"又不需要我去做什么汇报演讲。"

  "如果你真的能做到'只是蹭顿饭'，我今天就不会把你叫到这里来了。"平冢静转过身，黑色的长发顺着肩膀滑下来，她的目光像锋利的解剖刀一样切了过来，"比企谷，你那种只要把烂摊子揽到自己身上就能解决所有问题的毛病，这次不能用。"

  房间里的空气变得更加粘稠。

  "当你以为你把自己推出去当挡箭牌，就能保护雪乃那个小圈子的时候，在雪之下夫人眼里，你只是在证明：她女儿所谓的'朋友'和'独立'，不过是一个需要靠这种扭曲的牺牲才能维持的沙堡。"平冢静往前走了一步，两人的距离拉近了，"你只要露出一丁点想要替她们抗下什么的态度，她就会立刻以此为借口，把雪乃这几个月来在这里建立起来的所有东西，全部否决。"

  比企谷张了张嘴，平时那些用来反驳的歪理，现在一句也想不出来。

  他的喉咙发干。从文化祭到校际会议，他习惯了在最后关头把自己扔进泥潭里。因为泥潭对他来说很安全，只要脏了他一个人，其他人的衣服就还是干净的。

  "还有都柏林同学。"平冢静的声音压得更低了，"那个饭桌上，情况可能比你想象的还要复杂得多。那不仅仅是雪之下的家庭审判。"

  比企谷猛地抬起头，视线终于对上了平冢静的眼睛。

  "拉芙希妮？这和她有什么关系？那不是雪之下的局吗？"

  "有些火，是在很远的地方烧起来的，但温度是一样的。"平冢静并没有详细解释，只是重新走回桌边，拿起那个银色的打火机在手里转了一圈，"你只需要记住一件事。不管那天晚上发生什么，不管雪乃被逼到什么角落，或者是都柏林同学露出多熟悉的表情——"

  打火机"啪"的一声被按在桌面上，平冢静的眼神前所未有地严厉。

  "不要替她们做决定。哪怕那是错的决定，也让她们自己去说。听明白了吗？"

  比企谷看着桌面上那个再也没有亮起火苗的打火机。

  如果是以前，他一定会毫无负罪感地把桌子掀了，只要能让情况好转。但在这一刻，他突然意识到，如果他真的那么做了，雪乃在部室里那种捏着书角、强忍着颤抖的宣告，就会变成一场彻头彻尾的笑话。拉芙希妮那天用干燥的语气问出的着装要求，也会变成没有意义的数字。

  那不是保护，那是在剥夺她们站着的权利。

  比企谷深深地吸了一口气，然后缓缓地吐出来。他把手从口袋里抽出来，拉了拉歪斜的西装外套。

  "这种事情。"他移开视线，看向没有关紧的门缝，"如果是去吃高级料理，我本来也就没打算出什么力。毕竟我只是去充数的分母而已。"

  平冢静盯着他看了一会儿，紧绷的肩膀终于松懈了下来。她叹了口气，挥了挥手，像是在赶赶一只烦人的虫子。

  "滚回去写你的作业。记得星期天穿得像个人一点。"

  比企谷没有再回答。他转身拉开准备室的门，走进了灰蒙蒙的走廊。走廊里的风吹在脸上很冷，但他知道，这场真正的寒潮，甚至还没有开始。
