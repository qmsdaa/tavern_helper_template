场景: 101
幕: "第七幕·重新为奉仕部命名"
时间: "2014年4月7日 · 周一上午 · 春假"
地点: "总武高中 · 教务会议室 → 正门玄关"
人物: "拉芙希妮·都柏林、爱布拉娜·都柏林、温斯顿、学籍事务负责人（雪之下雪乃、比企谷八幡、由比滨结衣在门外等候）"
POV: "拉芙希妮"
正文: |
  “剩下的一半也要吃掉。”

  结衣把装着三明治的纸袋重新塞回拉芙希妮手里。袋口已经被折过几次，边缘沾着一点蛋黄酱。

  “会议要开始了。”拉芙希妮说。

  “所以才要带进去。万一谈到中午怎么办？”

  “教务处禁止在会议室用餐。”雪乃站在旁边，替拉芙希妮把露在袋口外面的包装纸压回去，“不过，放在包里并不违反规定。”

  八幡看了看会议室门上的磨砂玻璃。

  “昨天是国际家庭纠纷，今天是跨国行政谈判。春假还要连续上班的人，果然都已经被劳动制度放弃了。”

  “小企明明什么都不用做。”

  “陪同本身就是一种无偿劳动。”

  “你可以回去。”雪乃说。

  “来都来了，现在回去只会让之前支付的电车费彻底变成沉没成本。”

  拉芙希妮把纸袋放进单肩包。三个人没有问自己是否可以进去。昨晚离开奉仕部之前，他们已经确认过，今天的会议由她自己参加。

  “我们在外面。”结衣说。

  拉芙希妮点了点头，推开会议室的门。

  长桌上已经摆着四份文件。英文版本在左，日文译本在右，每份都用银色长尾夹固定。爱布拉娜坐在靠窗的一侧，面前是一杯没有加糖的黑咖啡。温斯顿坐在她下首，公文包竖在脚边。负责国际课程学籍事务的教务老师正在核对拉芙希妮原来的留学资料，红色校章放在文件托盘中央。

  “早上好，拉芙希妮小姐。”温斯顿站起来。

  “早上好。”

  爱布拉娜没有催促。她等拉芙希妮坐下，才把最上面那份文件推到长桌中间。

  “昨晚你提出由温斯顿承担日本境内的责任联系与学校担保。我让艾米丽整理了初稿。”

  文件标题是《海外教育观察期间责任转移附则》。拉芙希妮读到“观察”时停了一下，继续往下看。

  第一页确认温斯顿作为在日责任联系人，负责与学校、入国管理事务和居住地管理方联络。第二页开始出现附加条款：温斯顿需要定期提交生活状况、出勤、诊断、治疗安排与用药记录；居住地址及任何变更必须获得都柏林家族认可；家族可以基于安全与教育需要随时撤回授权。最末一项保留了长老会恢复回国审查的权利。

  “这和昨天说的不一样。”拉芙希妮合上文件。

  “昨天没有人同意过任何具体内容。”爱布拉娜说，“你要求我不要阻止温斯顿。我没有阻止。现在需要确认的是，这项安排能否真正保护你。”

  “随时撤回担保，会让学籍随时失效。”

  “如果你保持正常出勤、接受必要治疗，并住在经过确认的地址，没有人需要撤回它。”

  “也就是说，只要我接受全部报告。”

  “也就是说，承担责任的人需要获得足以承担责任的信息。”

  爱布拉娜的语气没有昨晚的疲惫。经过一夜整理，所有关于火、达洛维和医院的内容都被留在了奉仕部。摆在这里的只剩下一份条款清楚的文件。

  教务老师把日文版本翻到担保期限一栏。

  “关于这一点，学校需要先说明。”他说，“恢复学籍以后，校方必须确保担保关系在就学期间稳定有效。如果担保方可以不经通知随时撤回，学校无法据此完成复学手续。”

  爱布拉娜转向他。

  “都柏林家会在撤回前提供新的安排。”

  “文件里没有写明。”

  教务老师把笔尖放在“随时撤回”下面。

  “学校至少需要客观事由、书面通知和替代担保的处理期限。‘基于安全与教育需要’由家族单方面解释，范围太宽。”

  爱布拉娜没有争辩，只在自己的英文版本上作了一处标记。

  “那么，由学校提出可以接受的撤回事由。”

  “签证或留学资格失效、受到足以影响学籍的重大处分、实际终止就学，以及担保人因健康或身份变化无法继续履职。”

  “离开登记住址且拒绝提供新地址呢？”

  “可以列入地址失联。”

  “我接受。”拉芙希妮说。

  爱布拉娜看了她一眼。

  “我接受学校需要知道我住在哪里。”拉芙希妮补充，“地址由温斯顿先生和学校确认。家族可以收到变更通知，但不拥有认可或否决住址的权利。”

  “房租和安全费用仍由家族账户支付。”

  “那是付款关系。”

  “付款方有权确认资金对应的住处真实存在。”

  “所以温斯顿先生可以核实租约、地址和紧急联系方式。”拉芙希妮说，“核实不等于替我选择。”

  会议室安静下来。温斯顿一直没有开口。他面前那份文件保持在第一页，连长尾夹的位置都没有动过。

  爱布拉娜把笔放下。

  “温斯顿。”

  “大小姐。”

  “你昨天在邮件里留下了一个提前联系的窗口。”

  “是。”

  “这是否意味着，你已经决定接受拉芙希妮提出的全部要求？”

  温斯顿抬起头。他没有去看拉芙希妮，也没有翻开爱布拉娜准备的初稿。

  “不意味着。”他说，“那封邮件只意味着，如果拉芙希妮小姐希望在正式会面前了解程序，我愿意说明。”

  爱布拉娜等着他继续。

  “但今天这份申请，需要我回答另一个问题。”温斯顿说，“我是否愿意作为她在日本的责任联系人和学校担保人签字。”

  他把自己的文件转向长桌中央。

  “我的回答是愿意。”

  爱布拉娜没有动笔。

  “我还没有授权你接受新的职责。”

  “我目前已经承担教育事务协调、学校联络和留学手续处理。”温斯顿说，“新的文件会增加住址确认和正式担保责任，也会把我原本模糊的权限写清楚。是否愿意承担，需要由我本人签名。”

  “你仍然受雇于都柏林家。”

  “是。因此涉及家族付款、签证资料和重大紧急情况时，我会履行报告义务。”

  温斯顿翻到医疗报告条款。

  “日常诊断、治疗细节和用药记录不在这些职责之内。除非拉芙希妮小姐无法表达意愿，或者医疗机构要求责任联系人作出紧急决定。”

  爱布拉娜端起黑咖啡。杯子已经凉了，她仍然喝了一口。

  “你认为自己有资格判断什么属于紧急情况？”

  “如果我没有，就不适合在这份文件上签字。”

  温斯顿说完，将自己的钢笔放到文件旁边。笔帽没有打开，方向却朝着签名栏。

  拉芙希妮想起他邮件末尾那句不属于任何命令的话。昨晚以前，温斯顿能做的只是在句号前留出一点空隙。今天，那道空隙被写进了一份需要他亲自承担后果的文件。

  教务老师翻到健康资料附件。

  “学校在复学审核中，只需要确认学生具备在校学习能力，以及是否需要校内照护。诊断名称、治疗经过和日常用药由学生本人、医疗机构与校内保健人员保管。除紧急情况外，学校不会向担保人提供完整记录。”

  “如果她再次因为健康原因中断学业呢？”爱布拉娜问。

  “学校会通知责任联系人出勤状态与是否需要调整课程。具体治疗仍需要本人同意。”

  爱布拉娜翻过那份医疗附件。纸页在她手里停了一会儿，最终被放到一旁。

  “删除诊断、治疗安排和日常用药。”她说，“保留出勤变化、在校能力与紧急救治需要。”

  艾米丽不在会议室，没有人立刻替她修改电子版本。爱布拉娜自己拿起笔，在英文初稿上划掉了那几行。

  拉芙希妮重新打开文件。

  “家族随时撤回授权这一条也要删除。”

  “已经改为客观事由。”

  “还需要写明，在温斯顿先生无法继续履职时，必须先完成替代担保。不能先撤回，再要求我停学等待。”

  “如果你严重违反学校纪律，家族没有义务替你维持这里的学籍。”

  “重大处分本来就是客观事由。”拉芙希妮说，“它不需要再附加一次家族判断。”

  爱布拉娜没有立即落笔。

  长桌另一侧，红色校章还安静地放在托盘里。教务老师把复学申请从资料夹中抽出来，压在初稿旁边。

  “校方可以接受这样的写法。”他说，“担保中止必须写明事由，并预留替代手续。否则复学申请无法盖章。”

  爱布拉娜看着那枚尚未使用的校章。

  “写进去。”

  温斯顿打开笔帽，在日文译本旁边标注修改内容。爱布拉娜处理英文版本。两份文件之间第一次出现了不完全相同的笔迹。

  最后一项是长老会审查。

  “这一部分不属于学校事务。”爱布拉娜说。

  “但它决定家族是否会要求我回国。”拉芙希妮说。

  “长老会保留审查家族成员教育与居住风险的权利。任何人都无权在这间会议室撤销。”

  “昨天你说，我在日本没有稳定担保和住址。”

  “这是目前最直接的问题。”

  “如果今天补齐呢？”

  爱布拉娜没有回答。温斯顿将已经修改的日文版本推回桌面。

  “依照现有决议，回国审查的启动理由是海外就学安排失去有效责任联系人，并出现居住登记空缺。”他说，“两项缺口补齐后，当前申请没有继续提交的事实基础。”

  “你看过长老会决议？”拉芙希妮问。

  “我收到过要求准备材料的副本。”

  爱布拉娜看着温斯顿。

  “你今天准备得很充分。”

  “这是学校担保人需要了解的风险。”

  那个称谓被他平静地放在桌上。不是“被要求”，也不是“如果您允许”。

  爱布拉娜把最后一页翻过去。

  “完成备案以后，我会通知伦敦，目前没有继续启动审查的依据。”她说，“如果出现新的事实，长老会仍可重新提出。”

  “新的事实需要写明。”拉芙希妮说。

  “那不属于这份学校文件。”

  “但你刚才已经说出来了。”

  爱布拉娜把文件合上。

  “我说过的话不会因为没有写在这里就失效。”

  拉芙希妮把长老会决议的副本压回文件夹，没有再追问。

  修改后的文件被重新复印。纸张从会议室角落的机器里依次送出，带着刚加热过的干燥气味。

  温斯顿先签名。

  他的姓名落在“在日责任联系人兼学校担保人”下方。爱布拉娜在家族知情栏签字，笔迹比平时更重。最后轮到拉芙希妮。

  学校提供的黑色签字笔放在她面前。她拔开笔帽，在复学申请和责任确认书上写下自己的全名。

  Loughshinny Dublin。

  没有人替她指出位置，也没有人按住纸张。最后一个字母写完以后，她自己盖上了笔帽。

  教务老师核对三处签名，拿起红色校章。

  印章压在复学申请右下角，发出一声闷响。

  “手续已经齐全。”他说，“新学期开始后，按新学年班级安排恢复在校。住址证明在规定期限内补交即可。”

  拉芙希妮接过属于自己的那份文件。红色印泥还没有完全干，她没有立刻把纸收进包里。

  爱布拉娜把其余文件交给温斯顿。

  “电子版本整理完成后，发送给艾米丽和学校。家族内部档案标记为海外观察安排的风险修订。”

  “明白。”温斯顿说。

  “不是复学许可。”拉芙希妮说。

  爱布拉娜拿起那杯已经见底的黑咖啡，看了一眼杯底。

  “你可以在自己的文件里使用喜欢的名称。”

  会议结束后，几个人一同走向正门。雪乃、八幡和结衣还坐在玄关外的长椅上。结衣最先站起来，手里仍拿着早晨那个三明治纸袋。

  她看见拉芙希妮手里的复学文件，嘴唇动了一下，最后没有在教务老师和爱布拉娜面前喊出声。

  爱布拉娜停在台阶下。黑色轿车已经等在校门外，艾米丽替她打开后座车门。

  “我今天离开日本。”她说，“温斯顿会留下处理住址与学校后续事项。”

  “嗯。”

  “这份文件没有证明你对责任的理解是正确的。”

  “它只需要生效。”

  爱布拉娜看着拉芙希妮。她没有说“亲爱的”，也没有像昨天那样确认她是否吃过早餐。

  “新学期不要迟到。”

  “姐姐也是。”拉芙希妮说，“别误了航班。”

  爱布拉娜坐进车里。艾米丽关上车门，黑色轿车驶出校门。拉芙希妮没有追上去，也没有站在原地等待它消失。

  温斯顿留在台阶旁，公文包里装着已经生效的担保文件。

  “拉芙希妮小姐。”他说，“住址备案需要在开学前完成。下午如果方便，我会把可行方案送到平冢老师的住处。”

  “可以。请先发给我本人。”

  温斯顿停了一下，随后点头。

  “明白。”

  结衣终于走过来，把纸袋打开。

  “现在可以吃剩下的一半了吧？”

  拉芙希妮接过三明治。复学申请上的红色印章仍然摊在她另一只手里。

  她咬了一口已经有些发干的面包。
