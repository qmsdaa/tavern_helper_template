场景: 90
幕: "第五幕·PTA→舞会"
时间: "2014年3月24日 · 周一 · 修業式 · 午后"
地点: "总武高 · 奉仕部部室"
人物: "平冢静、雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林"
正文: |
  广播里的结课音乐已经停了有十五分钟，但走廊上依然有一阵阵细碎的脚步声和鞋底摩擦的动静。高二结束的这一天，连空气里那股旧地板蜡的味道都比平时沉。

  部室的窗户开了一条缝，风吹进来，把雪乃手边的那摞活动记录本翻开了一页。

  她伸出手指，在纸页上压了一下，把它重新合拢。这是这一年来的最后一次归档，黑色的封皮上贴着几张颜色各异的标签，有结衣随手涂鸦过的贴纸，也有拉芙希妮用细笔写下的时间索引。

  结衣正用一块半干的抹布擦拭着长桌的另一头，动作很慢，擦过去的桌面上留下一道道很快就会消失的水痕。

  八幡靠在窗边的椅子上，手里握着一罐还没拉开拉环的咖啡。手指摩挲着铝罐冰冷的边缘，视线停在外面的树冠上。那棵树的枝条上已经冒出了很小的一点花苞，灰扑扑的，还没到能开花的程度。

  门轴发出了一声短促的摩擦音。

  平冢静没有敲门。她走进来的时候，带起了一阵走廊里的冷风。

  她今天没有穿那件万年不变的白大褂。因为是修業式，她换上了一套剪裁利落的深色女式西服套装，领口系着一条条纹丝巾，脚下的高跟鞋踩在木地板上，发出比平时更清脆的声响。

  她走到长桌的前端，停在距离雪乃一米左右的位置。

  "大扫除还没结束吗。"平冢静扫了一眼桌面，视线在雪乃手底下那摞黑色的记录本上停顿了一瞬。

  "已经差不多了。"雪乃把记录本推到桌子边缘的整齐位置，双手放在膝盖上，抬起头，"平冢老师今天来得比平时早。"

  平冢静没有顺着这句话往下接。

  她把手插进西装裤的口袋里，姿势和她平时穿着白大褂时一模一样，但那身正装让这个动作显得不合时宜的紧绷。

  "教员室那边还有一堆清点手续要办。"平冢静看着桌子对面的几个人，声音没有平时那种混杂着说教和调侃的张力，很平稳，"我就是过来告诉你们一声。"

  结衣擦桌子的动作停了下来，抹布在桌面上挤出了一点微弱的水声。

  拉芙希妮把手里那支一直在转动的签字笔停了下来，笔杆搭在虎口上，没有发出任何声音。

  八幡握着咖啡罐的手指收紧了一点，铝皮发出细微的变形声。

  "下个学期开始，我就不在总武高了。"

  教室里的空气在这个瞬间停止了流动。

  窗外的风又吹进来一阵，把桌角的一张废纸吹得翻了个面。除此之外，没有任何声音。

  结衣的嘴唇微微张开，眼睛一下子睁大了。她的手指紧紧攥着那块半干的抹布，指关节因为用力而泛着白。"平冢老师……？"她的声音发颤，像是没听懂这句话的语法结构。

  雪乃依然维持着双手放在膝盖上的姿势，脊背挺得笔直。但她的肩膀有幅度的下沉，深蓝色的眼睛定在平冢静的制服纽扣上，眨眼的频率比平时慢了整整一拍。

  拉芙希妮的视线依然垂在桌面上，笔尖在草稿纸上点出了一个很深的墨点。作为唯一的留学生，这间教室里只有她知道那个名字从行政系统里被划掉意味着什么。但她只是平静地松开了捏着笔的手指。

  八幡没有转过头去。他的视线依然停在窗外那根灰扑扑的树枝上，只是手里的咖啡罐被彻底捏出了一个凹坑。

  平冢静看着他们，嘴角往上提了一下。那个弧度在脸上停留了不到一秒就垮下来，像是连自嘲的力气都不够用。

  "公立学校的教师调动，到了年限就得走人。上面那个老头子早就看我不顺眼了，能拖到现在才发文，大概也是因为我还没找到能结婚的对象，怕我立刻失业会去教区公所闹事吧。"

  这是一句标准的、属于平冢静风格的自嘲。如果是平时，八幡早就该在心里吐出一大段关于大龄单身女青年的刻薄言论。

  但现在，他连一句腹诽都挤不出来。

  结衣的眼眶已经开始泛红了。她把抹布丢在桌子上，往前走了一小步，手足无措地站在那里。

  "那……那下学期的指导老师，会是谁啊？"结衣的声音里带着很浓的鼻音。

  "谁知道呢。"平冢静耸了耸肩，"大概是个比我正经、至少不会在走廊上抽烟、也不会动不动就用拳头教训问题学生的无聊家伙吧。"

  她把视线转回雪乃身上。

  雪乃微微扬起下巴，嘴唇抿得很紧。那是一个标准的防守姿态，用来把所有多余的情绪都拦截在面部肌肉之下。

  "雪之下。"平冢静喊了她的名字。

  "在。"雪乃的声音很干脆，挑不出一点毛病。

  "这一年多，算是稍微长进了那么一点。"平冢静看着她，眼神里没有任何成年人居高临下的怜悯或者审视，只是平等的确认，"虽然还是会在半夜钻牛角尖，虽然处理问题的方式还是那么不留余地，但至少……你学会了在这张桌子上泡茶。"

  雪乃垂在身侧的手指弯曲了一下，大拇指的指腹擦过食指的指节。

  "我会把这些记录整理好，移交给下一任顾问。"雪乃的声音低了一点，但语速依然很快，像是在执行某道程序，"这间教室的使用权限，我也会在这个星期内向教务处递交新的申请。"

  "不用那么麻烦。"

  平冢静把插在口袋里的手抽了出来。

  她的掌心里攥着一把黄铜钥匙。齿槽边缘的镀层已经磨出了灰白的底色，钥匙圈上挂着一块塑料牌，马克笔的字迹褪成了浅蓝——「特别栋·闲置教室」。

  她把那把钥匙放在了实木桌面的另一端。

  手指松开。

  这是一把原本应该被交还给总武高后勤处的公物。是一道把他们和外面的世界隔开的物理屏障。是只要它在，这间活动室就依然存在的证明。

  平冢静没有解释为什么这把钥匙没有被清点上交，也没有说任何多余的叮嘱。

  她只是屈起食指和中指，在那把黄铜钥匙上轻轻弹了一下。

  黄铜的金属质感撞击着实木桌面。钥匙在平滑的木纹上滑动，发出"呲"的一声短促而微弱的钝响。它沿着长桌的中轴线，不偏不倚地滑到了雪乃的正前方。

  它停在了那摞黑色的活动记录本旁边。

  雪乃低头看着那把钥匙。钥匙齿上的金属光泽在从窗缝里漏进来的阴天光线里冷硬。

  "我把问题，连同这个烂摊子，一起留给你们了。"

  平冢静转过身，背对着他们。她的声音里重新恢复了那种带着不耐烦的飒爽。深色西装的下摆随着她的动作划出一道利落的弧线。

  "别在门背后待太久。发霉的空气对年轻人的大脑发育可没什么好处。"

  她迈出两步，高跟鞋踩在水磨石地板上。然后停了下来。

  "都柏林。"

  拉芙希妮抬起头。平冢静没有转身，只是把左手伸进西装内侧口袋，掏出一个巴掌大的牛皮纸信封。信封的边角被磨得起了毛边，封口处简单地折了两折，没有贴任何胶带。

  她把信封往后一递，夹在食指和中指之间。

  "达洛维留给你的。离开日本之前寄存在我这里。"平冢静的声音很平，"她说总有一天你会需要用到这个。至于什么时候用、怎么用——你自己判断。"

  拉芙希妮从椅子上站起来。她走过去，从平冢静的指间接过那个信封。指尖触到牛皮纸粗糙的表面时，她感觉到里面装的不是文件——那是一小块不规则的、边缘带着焦痕的布料。很轻，轻得连一张纸的重量都不如。但她托着它的手却往下沉了一寸。

  "平冢老师——"

  "别问。我也不知道里面是什么。"平冢静把手重新插回西装裤口袋，迈开步子走向门口，"达洛维那个人，到死都在替别人留后手。"

  没有等任何人说出那句"谢谢"或者"再见"，她直接走出了那扇拉开了一半的门。

  高跟鞋踩在水磨石地板上的声音逐渐远去。
