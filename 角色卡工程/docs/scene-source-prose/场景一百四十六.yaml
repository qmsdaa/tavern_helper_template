场景: 146
幕: "第十幕·冬去春来"
时间: "2015年3月13日 · 周五"
地点: "总武高特别栋奉仕部活动室"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林"
POV: "共享场景／零POV"
正文: |
  三月十三日。傍晚六点，天还没全黑。活动室的灯亮着，窗外的天空是一种很深的蓝，介于黄昏和夜晚之间。西边还剩最后一线光。

  记录簿翻开到最后一页。前面每一页都写满了——委托日期、委托人、基本事项、受理结果。封底内侧的纸袋里夹着几张便签，大多是结衣的饼干配方修正案。还有一张是八幡画的千叶县电车路线图，用来帮一个一年级的委托人计划通学路线。

  雪乃翻到一页空白。上面只有一个日期——去年七月。委托人：雪之下雪乃。基本事项：找到真正的自己。

  那一页除了日期和委托事项，至今没有写过任何别的东西。

  "受理记录。"她说。"这一年，只写了这些。"

  "委托还在受理中。"八幡说。

  "对。也不打算结束。"

  "理由呢。"

  雪乃把记录簿摊在膝盖上。三个人坐在各自的位置——八幡靠窗，结衣趴在桌边，拉芙希妮坐在热水壶旁边。

  "去年七月，我写这个委托的时候——那时候以为'找到自己'是一个终点。找到之后，就不用再找了。像解数学题。答案写下来，这一页就过去了。"

  结衣把下巴搁在手背上。"然后呢。"

  "然后这一年——文化祭。体育祭。体育祭筹备的场地冲突。平冢老师留了档案，我帮她整理。看到了别人怎么驳回方案、怎么坚持、怎么让步。看到了拉芙希妮怎么把家族的训练变成自己的选择。看到了结衣怎么拒绝替全班决定谁值得被记住。看到了八幡——"

  "我不用案例。"八幡说。

  "你从自爆到接受'没有危机的陪伴'。一年内发生的。确实发生了。"

  "这是在翻旧账。"

  "是记录。"雪乃说。"委托记录簿的用途。受理中的委托，需要定期更新进度。"

  拉芙希妮把她那只深蓝色的杯子从茶柜拿出来。没有倒茶。只是放在桌角。

  "那进度呢。"

  "进度——"

  雪乃停了几秒。

  "我自己做的选择。法学部。一桥。不听母亲的方向。和姐姐说'这是我自己选的'。不是对抗。是——我看见了一条路。顺着规则帮人维护权利。这条路以前也在那里，但我不敢觉得'这就是我'。"

  "现在敢了。"

  "不是敢。是不需要'敢'了。是我觉得它就是。"

  八幡把MAX咖啡的拉环拉开。"嗯。一年级的时候你绝对不会说这种话。那时候你说服别人靠的是'这是正确的解法'。不说'我觉得'。"

  "那时候还没有被人说'伪善'。"

  "那是我说的。"

  "我知道。你说的那天，我气了很久。后来不气了。不是因为发现你说得对。是因为——"她翻开记录簿前面某一页，那页上记着一个冬天的委托，一个后辈归还一把骨是弯的伞。"因为后来做了很多委托。发现帮人的时候，有些问题用'正确'解决不了。需要——需要问对方'你想要什么'。需要偶尔说'我不知道'。需要承认'我以前以为自己在帮人，其实是在证明自己正确'。"

  结衣从桌边直起腰。"那你现在找到自己了吗。"

  "找到了几件。法学部、一桥、不替别人承认、说'高兴'、承认自己有立场——昨天和你收拾杯子的时候，承认了。这些是我知道的。还有不知道的——"

  "够多了。"八幡说。"不知道的部分，不是没找到。是还没到找的时候。"

  "你这话像拉芙希妮说的。"

  "托她的福。"

  拉芙希妮把杯子端到嘴边，发现里面没有茶，又放回去。

  "去年冬天。"她忽然说。"我在伦敦。退出协议通过那天晚上。布丽吉特姨婆说了一句话。她说——'接下来的路，你自己走。不是替你安排的人替你走。是你自己。'"

  "那不是和'找到自己'一样。"

  "不一样。她说的不是'找到'。是'自己走'。找到是一个结果。自己走是一个过程。"

  雪乃看着拉芙希妮。过了一会儿。

  "所以不是'找到了'。是'在找'。"

  "嗯。"

  "找到自己——"雪乃把记录簿合上又翻开。"委托事项需要修改。不是'找到真正的自己'。是'继续找'。找的过程本身，就是存在的方式。"

  她从笔筒里抽出水笔，在原来那行"找到真正的自己"下面，画了一条横线。然后另起一行。

  "继续以自己选择的方式，确认自己是谁。"

  字迹和原来那行一样工整，但下笔比原来轻了。她把笔帽拔开，又按回去，没有按紧。

  八幡看着那行字。"基本事项修改。受理中。"

  "受理。"结衣说。

  "受理。"拉芙希妮说。

  窗外的天已经全黑了。西边最后一线光收进了地平线。从活动室的窗户看出去，能看见几颗很淡的星星。冬天的亮星已经转到了地平线以下，春天的星座还没升到中天。在冬和春之间的这几晚，夜空有一段时间是空的。不是没有星星，是正在换季。

  雪乃站起来，走到窗边，抬头。

  "冬去春来，雪之下仍旧仰望星空。"

  这句话说得很轻。不是在宣布。是在确认。

  结衣走到她旁边。"看到了什么。"

  "还没升起的那颗。"

  "哪一颗。"

  "春天的。"

  八幡没有站起来。他把空罐子丢进垃圾桶，罐子碰在桶壁上，轻轻的一声。

  "雪之下。"

  "嗯。"

  "'仍旧仰望'——不是'终于仰望'。"

  "对。"

  "那就是——"

  "以前以为仰望是因为找不到。后来发现——找本身就是仰望。不需要找到才看天空。"

  拉芙希妮站起来，把自己那只深蓝色杯子放回茶柜。杯底有一点水印，她用指腹擦了一下。

  "明天清理活动室。"她说。"那页委托——留下。"

  "留一整页空白。"结衣说。

  "不是空白。"雪乃说。她把记录簿翻到委托那一页。原来的字还在，下面画了一道横线。横线下面，是今天新写的那行字。字很轻，但没有犹豫。

  她把记录簿合上，放进书架的指定位置。那是奉仕部所有已完成和未完成委托的家，一排薄厚不一的册子，书脊上贴着年份标签。今年这本是最厚的一本。标签上写着二零一四到二零一五。

  四个人在活动室里又坐了一会儿。没有人说话。热水壶的灯从绿色跳成橙色，又跳回绿色。窗外的夜空，还是那种介于冬天和春天之间的深蓝。春分在下周。
