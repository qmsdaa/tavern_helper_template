场景: 139
幕: "第十幕·冬去春来"
时间: "2015年2月12日 · 周四"
地点: "总武高三年F班教室 → 特别栋奉仕部活动室"
人物: "由比滨结衣、三浦优美子、海老名姬菜、比企谷八幡、雪之下雪乃、拉芙希妮·都柏林"
POV: "共享场景／零POV（结衣侧重）"
正文: |
  二月十二日，三年F班的教室在放学后还亮着灯。

  结衣被三浦和海老名叫住了。三浦把一本厚重的相册样书放在她桌上——封面印着"第二十三回卒業記念"，下面空着一行，留给班级名。

  "优美子，这是……"

  "毕业相册的样本。"三浦把椅子拉过来，反跨着坐下，"印刷厂先打了一版给我们看。一年到三年的照片，各班委员选过了。"

  "选过了？"

  海老名推了推眼镜。"准确地说，是'初步选过了'。体育祭、文化祭、修学旅行、日常抓拍。每班二十页，照片由各班代表选。"

  "然后呢？"

  "然后我们发现，"海老名说，"选照片的人，选了太多自己。"

  三浦把相册翻开。F班的二十页，前几页是大合照、全班活动、运动会的接力棒交接。到了后半段，照片开始缩小——两三个人的合照，午餐时的抓拍，走廊上的偶遇。

  结衣一页一页翻过去。翻到第十一页的时候，她的手指停了。

  "这个人。"她指着照片边缘的一个侧脸，"被裁掉了一半。"

  三浦凑过来看。"构图的问题——"

  "不是构图。"结衣说，"这张照片我见过。原图是四个人。这里，这里，还有这里——"她的手指在照片周围画了一圈，"全部是裁过的痕迹。"

  海老名安静了几秒，然后把相册翻到第十五页。

  "这张也是。班级讨论会，拍了九个人。印出来的只有五个。"

  "谁选的这些照片？"

  "委员会。"三浦说，"各班两个代表。F班的代表——学期初选代表的时候，我和姬菜在忙体育祭的事。最后选出来的人，是班上存在感最强的那几个。"

  "那照片也是他们选的？"

  "对。"

  结衣把相册合上，看着封面那行空着的班级名。一年级时自己也站在合照的边缘。有些人的名字从来没有出现在任何照片说明里。文化祭那天晚上，相模南站在灯下说"基于奉仕部的专业意见"。

  "这本相册不是记录。"她说，"是某个视角的人替全班决定，谁值得被记住。"

  三浦没有说话。海老名把眼镜取下来擦了擦。

  "所以来找你。"三浦说，"离毕业还有一个月。重新选照片，重新排版，还来得及。但我们不想自己做——我们自己也是某个视角的人。"

  "你们想让我来选？"

  "不是'让你来选'。"海老名把眼镜戴回去，"是想请你帮忙，让每个人提交自己想留下的画面。委员会选的是照片，每个人选的可以是别的——一句想写的话，一个想被记住的位置，一张自己手里藏着没发出去的照片。"

  结衣看着三浦和海老名。三浦的表情是认真的——不是命令，不是请托，是这件事必须做，而你能做。

  "为什么是我。"

  "因为你不会替任何人决定。"海老名说。

  结衣的指尖在相册封面上停了一会儿。

  "受理。"她说，"但不是我一个人。奉仕部接。"

  奉仕部活动室。结衣把相册放在长桌正中间，讲完了来龙去脉。

  "F班全班三十七人。每个人提交自己想留下的东西。然后我们负责把它放进二十页里——不是替他们选，是把他们选的东西排列起来。"

  "多大的工作量。"八幡说。

  "很大。"结衣说，"所以不是明天交。"

  雪乃翻开记录簿。"截止日期。"

  "二月二十八。印刷厂的最后期限。"

  "受理中。"雪乃记录，"基本事项：F班毕业相册重新编辑——以全班三十七人各自提交的内容为基础排列，不以任何人的视角代替另一个人的视角。"

  "这个基本事项写得比以往都长。"八幡说。

  "因为委托人自己把规则说得很清楚。"雪乃说。

  拉芙希妮看着结衣。结衣正在翻相册的空白页，手指从一页画到下一页，在分配什么看不见的东西。

  "结衣。"

  "嗯？"

  "你自己的照片，也要自己选。"

  结衣的手停了一下。"嗯。我的照片，我也要自己选。"

  "那就已经够了。"拉芙希妮说。

  第二天，三年F班的黑板上多了一行粉笔字：

  "卒業アルバムの写真、募集中。あなたが覚えておきたい一枚を、委員ではなく、由比滨まで。——F班卒業アルバム編集（本物）"

  字是海老名写的。三浦在旁边加了一行：拒否権なし。あなたが出すか出さないかだけ。

  放学前，结衣的桌上放了七张照片。不同的人放的，有些背面写了字，有些没有。海老名收走了原来的相册样本，封面那行空白还在等一个名字。
