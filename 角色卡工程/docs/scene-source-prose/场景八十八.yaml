场景: 88
幕: "第五幕·PTA→舞会"
时间: "2014年3月22日 · 周六 · 傍晚（紧接场景八十七）"
地点: "总武高 · 特别栋道具室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
正文: |
  那个被结衣摇晃出来的日期，细弱得像是一阵没底气的风。拉芙希妮的视线还是没有真正聚焦，只是顺着由比滨那张凑得极近的脸，木然地把那个藏在日程表里的数字交了出来。

  "下周三……"

  数字刚在充满灰尘的空气里落地，道具室里的气压就变了。

  雪乃连半秒钟的迟疑都没有。她甚至没再看那个处于完全失语状态的"委托人"一眼，直接转过身。藏青色西装外套在昏暗中划出一道生硬的弧线。

  "比企谷同学。"

  那种平时在课后部室里用来下达杂务指令的语气——准时、精确、理直气壮——砸了过来。

  "加急护照的申请周期，如果在千叶县厅的窗口办理，最快能压缩到几天？我需要确切的数字。"

  雪乃一边抛出问题，一边从旁边堆满杂物的桌上扯过一张皱巴巴的打印纸，摸出口袋里的红蓝圆珠笔。动作利落得像在准备期末考试的复习大纲。

  "不知道，我又没被跨国通缉过。"八幡把身体重心换到另一条腿上，"但我可以去网上查，或者找隔壁班那个成天吹嘘自己去过夏威夷的户部问问旅行社的门路。"

  "那这件事就交给你。明天午休前，我要看到三种以上可行的签证加急方案。"雪乃在纸上重重划下一道横线，"由比滨同学。"

  "在！"正抱着拉芙希妮胳膊的结衣立刻挺直了腰板。

  "明天放学后，去车站前的旅行代理店。拿到最近几期飞伦敦的航班时刻表，包括转机和直飞的所有红眼航班。日期是四号——我们要把所有能在她落地前后十二小时内到达的路线全部筛出来。"

  "包在我身上！我还可以拜托小町帮忙一起看！"

  八幡在旁边冷眼看着。这算什么？针对都柏林家族的登陆作战演习？

  那个刚才还在用"不替别人做决定"这种高尚说辞进行抵抗的留学生，此刻像一个被强行塞进云霄飞车的乘客。拉芙希妮坐在垫子上，平时那种经过严格计算的距离感和礼仪框架全都没了。她呆呆地看着雪乃在纸上画框，看着结衣兴奋地比划找资料的路线。浅金色的长发因刚才的拉扯散乱在肩侧，右手腕上那根焦黑的旧丝带跟着她僵硬的呼吸纹丝不动。

  那个叫爱布拉娜的怪物用家族和恐惧把她锁住。而这帮更不讲理的家伙，直接用粗暴的任务清单把锁砸了。

  "雪之下。"八幡打断了圆珠笔的摩擦声，"签证和机票是硬件问题，可以靠跑腿解决。但我们是不是该讨论一下软件了？"

  雪乃抬起头。

  "向家里说明的情况。"

  "这不是明摆着的事吗。"八幡抓了抓头发，"三个高中生在没有老师带领的情况下，突然在春假期间飞去英国——如果不给出一个哪怕听起来能糊弄过去的理由，别说登机了，我们在去成田的半路上就会被截回来。尤其是你。你那位连换个公寓都要层层审批的母亲大人，会同意这种行动？"

  道具室里昏黄的灯光打在雪乃那张带着疲惫却清醒到锋利的脸上。

  "如果只说'去英国旅行'，显然通不过逻辑审查。"她低下头，用红笔在纸上画了个圈，"所以我们需要一个不仅合理、还能让所有大人都无法轻易反驳的'官方名义'。"

  "……你想说什么？"

  "平冢老师下周就要正式调职。"雪乃的语速慢了下来，字眼却像钉子一样清晰，"如果是作为'护送国际交流班转学生回国探亲'——并且是一项由现任生活指导老师在离任前夕，利用最后的职权特批的'特别教育实践项目'——"

  八幡的后背一下子绷直了。

  "你疯了。"他瞪着她，"你想把那个快三十岁还没嫁出去的大龄单身女教师也拖下水？她要是敢在这份假报告上签字，她的教职生涯可能就要在这最后几天里提前完蛋了。"

  "这是她亲口说的。"雪乃的目光一点也没退缩，"在这个体制失效之前，大人的特权，是用来给不想长大的小鬼们收拾烂摊子的。"

  安静。

  角落里的拉芙希妮发出了一点声音。像是在喉咙深处卡了很久才挤出来的气音。

  "……这太荒谬了。"

  她慢慢收拢手指，指节因用力而泛白。

  "让平冢老师担责，让你们去编造谎言，甚至要去面对一个根本没有任何道理可讲的家族……"声音还在发抖，但那种空白的状态已经开始消退，被深切的、无法掩饰的无措取代，"你们没有义务做到这种程度。这根本不算是'帮助'——"

  "既然承认了这是帮助，那就没资格挑剔帮助的形式。"

  雪乃转过头。视线终于重新落回了拉芙希妮的脸上。那不是安慰，也不是同情。那是雪之下雪乃最本色、最刻薄、也最锋利的坦诚。

  "你如果真的觉得荒谬，就在伦敦的机场里把我们拦下来。不然，就老老实实当那个需要被运送过去的'社会实践考察对象'。"

  雪乃把那张写满鬼画符的打印纸折成方块，塞进口袋。

  "另外。明天的问卷排查报告——如果你敢因为要打包行李而迟交，我不介意在申请表上给你加一条'社团态度恶劣'的补充说明。"

  拉芙希妮看着雪乃。没有再反驳，没有再提爱布拉娜的名字。

  她就那样坐在杂物堆里。那张习惯了伪装平静的脸上，慢慢地、艰难地，扯出了一个比哭还要难看的笑。

  ——

  "我不去。"

  这三个字出现得突兀。没有歇斯底里的音量，没有发抖的气声。像是从生锈的齿轮里硬生生挤出来的，带着干燥到极点的摩擦感。

  圆珠笔的笔尖悬在了废纸上方。雪乃的手指停住了。

  结衣拽着袖子的手也僵在半空。

  拉芙希妮从那个满是灰尘的旧垫子上站了起来。她没有整理散乱的金发，也没有去摸手腕上的旧丝带。她只是直直地看着雪乃的眼睛——然后缓慢地，把视线移到八幡和结衣身上。

  "我不去英国。"

  她又重复了一遍。这一次，吐字比刚才更清晰。

  "既然她想看我变成了什么样子，既然她觉得那些邮件和监视还不够——"

  拉芙希妮的声音很轻，却带着病态的固执。

  "那就让她自己来看。"

  八幡靠在旧跳箱上的身子直起来。

  "我要把她喊来千叶。"

  这句话像一块石头，直直砸进刚才那种充斥着签证、航班和虚假报告的荒诞狂欢里。

  八幡的脑子在短暂的空白后飞速运转。这比他们几个高中生偷渡去伦敦还要疯。把爱布拉娜·都柏林叫到总武高——叫到这个千叶市的普通高中来——那个只要在屏幕后面动动手脚就能把拉芙希妮逼到绝境的女人，真的会理会这种挑衅的邀请吗？

  会的。

  答案在八幡脑海里瞬间成型。那个女人的控制欲——那种"必须由我亲手在火焰最中心检阅她"的扭曲执念——根本不允许她在这个时候拒绝。只要拉芙希妮摆出"我已经建好了堡垒，你来打破看看"的姿态，爱布拉娜就会踏上飞往成田的航班。

  "这等于是把战场从伦敦的庄园直接搬到了这间旧道具室里。"八幡吐出一口气，打破了寂静，"而且还是你主动拉的警报。"

  "在她的地盘上，我连一个呼吸都要经过计算。"拉芙希妮垂在身侧的手指慢慢攥紧，"如果真的要面对她，我至少要站在我选的地面上。"

  她看着八幡，又看向雪乃。

  "……你们刚才说，这是'帮助'。"

  眼眶终于红了。她死死憋着，没让一滴眼泪掉下来。

  "如果要把她喊来，我可能连一句话都说不完整。我会发抖。我会忍不住想退到那些你们好不容易替我撕开的角落里。"

  拉芙希妮往前走了一步。在结衣还没来得及拉住她之前，她已经站在了靠近中央的位置。

  "到时候……"

  她咽了一下喉咙。那个字眼比任何东西都烫嘴。

  "你们，能站在我旁边吗？"

  那是拉芙希妮·都柏林——这个一直以来都在试图用尽全力证明"我一个人也能行"、甚至不惜把自己算进牺牲品里的人——第一次如此直白、如此不加掩饰地向这群人开口。

  连退路都不要了。把最不堪、最软弱的一面，直接摊开在这几个人面前。

  结衣直接撞了过去。

  "当然啊！"结衣的脑袋重重磕在拉芙希妮的肩膀上，双手死死环住她的腰，声音因激动变了调，"不仅要站旁边，还要站在前面！她要是敢欺负你，我就去咬她！"

  拉芙希妮的身体被撞得晃了一下，下意识想往后缩。结衣那股蛮力没给她机会。过高的体温隔着单薄的衣料传过来。

  八幡抓了抓后脑勺。

  "这也太麻烦了。"他用那种干瘪的语气抱怨着，视线移向天花板的某个水渍印，"千叶县厅的加急签证肯定办不下来了，我还得去跟户部那家伙打听成田机场的接机流程。这要是被查出来，小町肯定要没收我半个月的零花钱。"

  拉芙希妮愣了一下。眼眶里那点红晕，突然化开了一点。

  "既然战场换了。"

  刚才一直没说话的雪乃发出了声音。

  红蓝圆珠笔在废纸上划出一道深蓝色的痕迹。雪乃干脆利落地把那张写满了航班和签证的纸揉成一团，随手丢进旁边的废纸篓。

  "那我们的布防策略就需要全盘推翻。"她从桌上又扯过一张新的打印纸，"比企谷同学，你的任务变了。去查清楚成田机场到千叶站最快的轨道交通时刻表，以及附近两公里内所有符合外宾接待标准的酒店信息。我们要先确认她的行进路线。"

  "你还真把这当成战争来打啊。"八幡叹气。

  "由比滨同学，别挂在别人身上了。"雪乃的笔尖再次在纸上摩擦，"去确认这周末所有还能预约的高级餐厅位置。如果她真的来，不能让她挑剔环境——在交谈开始前就输了一半的事情，我不接受。"

  结衣立刻松开手，大声应了一句。

  雪乃最后抬起头。深蓝色的眼睛直直地看着拉芙希妮。

  那张一直紧绷着的脸上，有了松动的痕迹。不是平时那种带着嘲讽的冷笑，而是轻微的——轻到难以察觉的柔和。

  "既然是你在千叶发出的邀请——邀请函的用词，由你自己决定。我会在旁边帮你检查语法。"

  拉芙希妮看着那支正在新纸上飞快移动的圆珠笔。

  那只绑着焦黑丝带的右手腕，慢慢地放松了下来。
