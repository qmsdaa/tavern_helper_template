场景: 119
幕: "第七幕·重新为奉仕部命名"
时间: "2014年7月22日 · 周二 · 暑假"
地点: "总武高特别栋奉仕部活动室"
人物: "拉芙希妮·都柏林"
POV: "拉芙希妮"
正文: |
  暑假第二天，特别栋安静得能听见电线里的电流声。

  没有课的校园把蝉鸣放得很大。活动室的窗户开到最大，风从操场那边过来，吹得值日表的纸角一下一下地掀动。

  纸箱一共三只，摞在文件柜旁边的空地上。最上面那只的盖子上，压着一张便签：

  "柜旁的旧材料，麻烦按年份整理。能丢的和要留的，由你判断。——雪乃"

  字迹工整，连拜托别人的方式都像在下达规格书。拉芙希妮把便签揭下来，夹进自己的手帐，然后蹲下身，打开了第一只箱子。

  平冢老师留下的东西，比想象中更乱，也比想象中更有秩序。

  旧许可申请书的复印件按年度捆在一起，橡皮筋已经老化发黄；奉仕部历年的活动记录只有前几年有，后面的年份空着，像一个没人接着讲下去的故事；文化祭的预算表、体育祭的器材单、几届学生的志愿指导手册，纸页间还夹着当年统一配发的垫板。有一只信封里甚至装着半包没有用完的打印纸，和一枚写着"加油"的图章。

  她把手帐摊开在长桌上，给每一捆材料做了索引卡。年份、类别、保存状态、去向建议。字迹一行一行排下去，和窗外的蝉鸣保持着各自的节奏。

  第二只箱子见底的时候，她摸到了一个没有年份标记的牛皮纸文件夹。

  脊背上没有贴标签。翻开，第一页是复印件的封面：《休学申请书·附属资料》。申请人那一栏里，印着她自己的罗马字姓名。

  拉芙希妮的手指停在了封面上。

  那是今年春天的东西。休学的理由栏里只写着"家庭原因"四个字，但后面附着一份由家族事务所出具的情况说明——用词克制、格式完美，把那场事故描述成一桩发生在遥远国度的、与本人意愿无关的不幸。说明的末尾，有一行以"详情"起头的小字：

  "详情参照独立保险调查报告书（受理番号：AXI-2013-04873-J）。"

  她抬起眼，看了看文件夹内侧贴着的附属资料清单。

  清单列了六项。前四项的右上角都有蓝色的"付"字小印，第六项也有。第五项——《独立保险调查报告书·要旨》——那一栏是空的。

  不是没有装订进来。是这一项的后面，连一张纸都不存在。

  清单的空白处，贴着一张极小的便签。褪色，边角卷起，是平冢老师的字：

  "⑤未着。3/12再照会。"

  三月十二日。那时候，休学的手续还在办理之中，离她复学还有将近一个月。平冢老师曾就这一页纸向某个地址发出过询问，而那张便签的下面，没有第二行字。

  询问没有回音。文件夹就这样被封存了。

  活动室里的蝉鸣忽然显得很远。

  拉芙希妮维持着蹲姿没有动。她的视线落在那串受理番号上，逐位读过去。

  AXI。都柏林家族内部的文书编号，从来不用三个字母打头——家族事务所用两位字母加年份，温斯顿的公务文书用单字母加部门代码。三个字母的冠码，属于家族之外的系统：保险公司，或者保险公司雇用的第三方鉴定机构。

  也就是说，当年那场事故之后，有人在家族之外调查过它，写过一份报告。

  而这份报告，没有跟着她的档案一起旅行。

  有人决定过，它不应该跟着。

  至于是谁决定的、报告里写了什么，纸页之外没有任何东西回答她。她唯一握着的，只是一处形状整齐的缺失——一份被引用、却不被附上的调查。

  拉芙希妮把手帐翻到新的一页，用桌上那支普通的黑色圆珠笔，把受理番号一个字一个字抄了下来。AXI-2013-04873-J。她核对了两遍，在番号下面画了一条很轻的横线。

  然后，她把附属资料按原来的顺序理好，把褪色的便签贴回原来的位置，把牛皮纸文件夹放回第二只箱子的最底层，再把上层的材料一捆一捆复原成最初的样子。

  做完这些，她在自己的索引卡上如实写下："第二箱：许可·休学复学关系，保存。"

  没有多一个字。

  第三只箱子整理完的时候，夕阳已经偏西。她把三只箱子按"保存"的记号重新码回文件柜旁，把手帐上的索引页撕下来，压在雪乃的便签下面——下次部活日来的人，一眼就能看懂每一捆东西的去处。

  写着受理番号的那一页，她单独撕下，对折两次，收进了衬衫胸口的口袋。

  她锁上文件柜，把钥匙收好。

  "……平冢老师。"

  活动室里没有人回答她。只有值日表的纸角还在风里一下一下地掀动，像一页没有人读的信。

  拉芙希妮拿起自己的包，把活动室的钥匙挂回教员室门口，在钥匙登记表上签下名字和时间。

  走廊很长，夕阳把她的影子投在身后。她把手放在胸口的口袋上，隔着布料，那张对折的纸有一个很硬的角。

  周五，部活日。

  她要把这件事，从头到尾，告诉他们。
