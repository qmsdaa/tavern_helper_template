场景: 122
幕: "第八幕·归国与失语"
时间: "2014年8月6日 · 周三"
地点: "伦敦·都柏林家族宅邸（书库→爱布拉娜房间→拉芙房间）"
人物: "拉芙希妮·都柏林"
POV: "拉芙希妮"
正文: |
  伦敦的雨下了三天，终于在早上停了。

  宅邸的书库在一楼最深处，一排一排橡木书架一直顶到天花板，百叶窗把上午的光切成细条，落在积年的书脊上。空气里是旧纸和皮革混合的、干燥的气味。

  拉芙希妮坐在长桌前，手帐摊开在左手边，右手边的桌上摞着三册书库总目录。

  这是她在伦敦的第五天。

  家族事务所的文书档案按年度收在书库东翼，她一年一年地翻过去。2013年的档案薄得反常——那一年的产业视察、事故记录、保险往来，合起来只有一只很浅的抽屉，里面的文件干净得像刚从模板里印出来：每一份都格式完美，每一份都不回答问题。

  AXI-2013-04873-J。家族的索引里，没有任何一个条目指向这个编号。不是编号不存在——是连"曾经有过这份报告"的痕迹，都没有留下。

  她早就料到会这样。所以今天早上，她的目标不是档案本身，而是目录。

  书库总目录的最后一册收在楼上。管家告诉过她：书房的目录副本，一直放在爱布拉娜小姐房间的写字台里，爱布拉娜小姐上班去了，晚上才回来。

  三楼的走廊很安静，地毯吸掉了全部脚步声。

  拉芙希妮在姐姐房间的门前站了两秒，抬手，敲门——没有人应。她旋开门把。

  房间和她记忆里的一样。深色的书桌，一尘不染的台面，文件按日期码成一列，连笔筒里笔的朝向都是统一的。窗帘拉开了一半，雨后的阳光斜进来，照见空气里浮动的细尘。这房间整洁得不像有人居住，倒像一间每天被精心维护的样品间。

  写字台右手边的抽屉没有锁。她拉开，里面确实是那册目录副本，黑色的硬壳，脊上烫着年份。

  她把目录抽出来，正要合上抽屉——

  视线越过抽屉的边缘，落在了书柜的最底层。

  那是一扇嵌在书架里的玻璃柜门。柜子不大，里面没有书，只垫着一层折得整整齐齐的棉纸。棉纸中间，坐着一只玩具熊。

  很小，两掌就能捧起来的那种。毛色已经褪成了浅浅的棕，右耳的根部有一排细密的针脚——缝的人很仔细，针脚密得几乎要陷进绒毛里，但线的颜色和原来的绒毛差了一点点，离近了还是看得出来。

  玻璃柜门没有上锁。柜里的棉纸没有压痕，熊的绒毛上也没有积灰。

  拉芙希妮保持着弯腰的姿势，很久没有动。

  她五岁那年，把这只熊塞进姐姐怀里的时候，姐姐比她也只高出一个头。那天的事情她记得很清楚，又不敢确定自己记得清不清楚——十四岁以前的事，后来她反复核对过很多次，每一次都担心哪一件是自己编出来的。

  熊在这里。

  不是储藏室，不是阁楼，不是被捆起来等待丢弃的旧物。是在她的房间里，垫着棉纸，没有灰尘。

  耳朵上的针脚，和记忆里的一样细。

  楼下的钟敲了十一下。

  拉芙希妮直起身，把玻璃柜门轻轻合上。柜门合拢的时候发出很轻的"咔"的一声，在安静的房间里显得很清楚。她低头看了一眼手里的目录副本，把它夹在臂弯里，退出房间，带上了门。

  走廊上仍然只有她一个人的脚步声。

  回到三楼自己的房间，她把目录副本摊开在书桌上，翻到2013年的索引页，一行一行地读下去。

  那一年的条目依然很薄。产业视察四项，事故一项——只有一行标题，没有附件编号，没有保险索引。那行标题的措辞，和她休学档案里那份情况说明，出自同一个人的手笔。

  她把这一行也抄进手帐，在旁边画了一个很小的问号。

  窗外的云散开了一些。书桌上，那张立在台灯旁边的行程单被照得发亮——返程：八月二十九日，成田。

  晚上七点，餐厅里只有她一个人的餐具。管家布完菜，轻轻退了出去。

  吃到一半，管家进来传话：爱布拉娜小姐来了电话，说公司有并购案要处理，这周都会在城里过夜。

  她说了"知道了"，没有多问。

  饭后，她回到房间，给千叶的群聊发了今天的消息——一张书库百叶窗的照片，光从缝隙里落下来，一格一格的。

  "伦敦的天晴了。书库很大，灰也很大。今天的第一条。——拉芙希妮"

  结衣很快回了一个太阳和三块蛋糕。小町回了熊猫。八幡回了一个"哦"。雪乃回了两个字："收到。"

  她看着那两个字，笑了笑，把手机扣在桌上。

  台灯旁边，行程单的影子投在墙面上。她伸出手，把它扶正了一点，然后关掉台灯，躺了下去。

  窗外，伦敦的灯光一直亮到很远的地方。
