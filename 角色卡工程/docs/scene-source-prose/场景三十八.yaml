场景: 38
幕: "第三幕·二学期"
时间: "2013年10月末 · 文化祭后第一个周一 · 放学后（承接场景三十七）"
地点: "奉仕部活动室 → 千叶站前\"高木\"拉面馆"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、叶山隼人、户部翔"
正文: |
  "不用那么刻意……"

  雪之下雪乃的手指在伞柄上停留了半秒，随后将那把黑色的长柄伞拿离了桌面。她低声开口，声音比刚才指责八幡时轻了许多，像是在给这个突兀的交接找一个合理的台阶。

  但她的话没有说完。

  门轴的滚轮发出微弱的摩擦声，拉门被第二次推开。

  原本已经稍稍回暖的空气因为新来者的出现再次发生偏转。叶山隼人站在门口，脸上维持着那种挑不出毛病的温和笑容。跟在他身后的是户部翔，那头用发带束起的橘色长发依然扎眼，但平时那种吵闹得让人头疼的气场却被某种不自然的局促压了下去。

  拉芙希妮还站在长桌的尽头。她侧过身，看着进来的人。叶山进门后，视线在扫过桌对侧之前，先是以一种标准到毫无破绽的前辈式礼貌，向热水壶旁边的浅金发少女微微点了点头。

  拉芙希妮用同样挑不出错漏的轻幅颔首作为回应。这种浸泡在礼节里的疏离感，把他们之间原本应该存在的高中生社交，推开到了一个极度安全的距离。

  随后，叶山的目光自然地转向了靠窗的位置。

  原本还在飞快按着手机的由比滨结衣，动作突兀地停了下来。她把手机翻了个面扣在桌上，视线下意识地垂向了水壶的底座，刻意避开了叶山扫过来的视线。

  没有人去点破这个细节。上周五在文化祭后台那次没有商量余地的站队，让那种维持表面的默契变得再也无法继续伪装下去。

  "那个……"户部抓了抓后脑勺，用干笑试图缓和结衣避开视线而产生的短暂冷场。他并没有像往常那样熟络地喊八幡或者结衣的名字，而是直接切入了正题。

  他磕磕绊绊地说明了来意。下个月的京都修学旅行，海老名姬菜，以及他的告白计划。希望奉仕部能提供某种形式上的协助。

  平日里那个总是习惯用冷笑话糊弄场面的气氛担当，在吐出这几个名词时，不仅没有平时的轻浮，语气里反而带上了一点连他自己都没察觉到的、因为害怕被拒绝而产生的僵硬的认真。

  比企谷八幡依然以那种极低的驼背姿态坐在椅子上。那些用来平息车祸余波的自毁手段还隐秘地残留在他的肩膀上。

  他听着户部关于"如何让告白成功"的陈述，那双死鱼眼却慢慢越过了桌面的划痕，落在了旁边陪同的叶山身上。

  "毕竟是难得的修学旅行，要是能让大家都没什么遗憾地度过，那就最好了。"叶山适时地补上了一句话，语气依旧温和体贴。

  八幡把背往后靠了靠，什么也没说。

  在这句看似善解人意的漂亮话背后，那种对现存团体平衡可能被这发告白打破的忌惮，已经被八幡听得清清楚楚。维持现状，不让任何人受伤，也不让任何人向前走。这种试图把所有的关系都强行稳在原地的软弱，跟八幡那种通过烧毁自己来排除变数的做法，完全是处于两极却又同样让人不快的东西。

  被强行打断了原本质问的雪乃，静静地听完了这个带有现充气息的委托。她将属于自己的那杯大吉岭端了起来，温度已经刚好可以入口。

  送走两人后。

  门轴的滚轮声再次响起，随后被轻轻合拢。随着户部翔和叶山隼人的离开，走廊上的脚步声逐渐消失在特别栋的尽头。

  那股因为外人介入而被暂时挤压到角落的低气压，重新填满了这间闲置的教室。没有人开口去提起刚才那个关于修学旅行告白的委托，那些粉饰太平的试探和算计，随着拉门的关闭被彻底隔绝在了外面。

  比企谷八幡依然维持着那个极低的驼背姿态，视线黏在桌面的划痕上。刚才那场试图用自毁来排除他人愧疚的执拗，还像一团无法消散的阴云罩在他的肩膀上。

  拉芙希妮·都柏林站在长桌的尽头，右手下意识地摩挲着袖口边缘那截烧焦的旧丝带，没有回到座位。雪之下雪乃则静静地看着那杯已经不再冒热气的大吉岭红茶，那场被打断的质问似乎失去了重新开始的支点。

  就在这种连呼吸都显得粘稠的沉默中，由比滨结衣把扣在桌面上的手机收进了口袋。

  她看着面前的这三个人，像是下定了某种决心。

  "那个……"结衣的声音在安静的教室里有些突兀，她努力让语调向上扬起，试图驱散空气里的沉闷，"文化祭也算是顺利结束了，大家要不要一起去吃拉面庆祝一下？"

  八幡的视线终于从桌面上抬了起来。他看着结衣，那副习惯了看穿虚伪、并把自己排斥在外的别扭姿态，在面对这种不讲理地强行塞过来的温柔时，明显陷入了处理困难的僵局。他可以毫不留情地驳斥算计，却不知道该怎么回击一碗热气腾腾的拉面邀请。

  拉芙希妮的目光在结衣和雪乃之间流转。在都柏林庄园那张长长的餐桌上，这种充满油烟味和毫无防备感的平民聚餐是绝对不被允许的体验。但这种她极度缺乏的生活方式，恰恰是她现在试图去学习和触碰的东西。她安静地站在那里，没有开口拒绝，只是默默等待着局面的走向。

  雪乃的视线终于从那杯彻底变凉的红茶上移开，落在了结衣脸上。

  她的嘴唇微启，那个习惯性的、包裹着逻辑外壳的拒绝似乎已经滑到了舌尖。她并不擅长应对这种毫无来由的热情，更何况还是在这个充满裂痕和疲惫的下午。

  结衣没有退缩，那双琥珀色的眼睛里带着一种近乎恳求的固执。她不是在为了维持表面气氛而读空气，她只是想用最笨拙的行动，把这些快要散开的人重新黏合在一起。

  "拉面馆的油脂气味会弄得校服很难闻，而且为了——"

  "没关系的！那家店的叉烧味道超级好！"结衣直接截断了那串正在构建的拒绝逻辑，甚至向前迈了半步，"小企和拉芙希妮酱也来。"

  雪乃看着她，看着那双不容拒绝的眼睛，停顿了两秒后，没再接话。

  她将那个瓷杯往桌子内侧推远了半寸，用一种近乎无声的方式，放弃了继续抵抗，默认了这个充满油腻感的提议。

  十几分钟后。

  站前"高木"拉面馆的角落卡座里弥漫着浓郁的猪骨高汤和葱爆油脂的香气，头顶的排风扇发出沉闷的转动声。

  结衣将那张被油污浸得发黄的塑封菜单推到中间。拉芙希妮安静地看着上面那些色泽浓郁的图片，仔细思考每一个字的重量。

  当服务员拿着点单纸走过来时，拉芙希妮指着菜单上标注着"极浓"的推荐款，用和平时一样平稳而礼貌的声音开口："如果不麻烦的话，请帮我加三倍的味增。"

  这句话让原本还在用面巾纸擦拭桌面的雪乃停下了动作。

  几分钟后，那碗汤底呈现出深邃红褐色、表面飘着厚厚一层凝结油脂的面条被端到了拉芙希妮面前。浓烈的咸香瞬间覆盖了小半个桌面。

  雪乃的视线顺着热气落进那个红黑相间的大碗里。她的眉头缓慢地向中间聚拢，嘴唇张开又闭上，似乎在脑海中快速计算这碗食物的钠离子含量和热量总和。面对这种完全超出她健康认知常理的画面，她最终只能将视线移开，用手指轻轻按压着一侧的眉心。

  坐在对面的比企谷八幡原本还维持着那种拒绝交流的驼背姿态。

  他看着雪乃那副罕见的、仿佛被击溃了逻辑体系的挫败神情，又看了看身旁正拿着一次性筷子、用一种对待学术报告般的严谨态度准备对抗那碗三倍味增的拉芙希妮。

  一阵短促的气声从八幡的喉咙里漏了出来。他迅速用手背抵住嘴角，但肩膀还是不受控制地跟着胸腔的起伏微微发抖。

  "小企，你刚才是笑了吧？"结衣立刻捕捉到了这个微小的变化，眼睛亮了起来。

  "我只是觉得那碗汤看起来像生化武器，被呛到了而已。"八幡的声音依然干瘪，但他没有再继续把视线黏在桌面上。

  对面的拉芙希妮并没有理会周围的动静，她挑起一筷子面条送入口中。

  紧接着，她原本平稳的咀嚼动作出现了一次明显的停顿。浅金发少女那双翡翠色的眼睛微微睁大，浓重到发苦的咸味瞬间霸占了她的味觉。

  一杯倒满了冰块的柠檬水沿着桌面无声地滑到了她手边。

  "如果你明天因为失眠而无法来上课，"雪乃的声音像往常一样冷淡，但视线却看着自己的拉面碗，"这会给我的社团考勤记录增加不必要的麻烦。"

  在这股混杂着油脂和味增的浓郁热气里，那股从活动室一路跟随着他们的沉滞低气压，终于被驱散开了一道缝隙。
