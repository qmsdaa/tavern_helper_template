场景: 77
幕: "第四幕·冬假→三学期"
时间: "2014年2月14日 · 周五 · 情人节"
地点: "千叶站检票口 → 电车 → 总武高中 · 特别栋 · 奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、由比滨结衣、比企谷八幡"
正文: |
  清晨七点四十五分的北风，像是一把没开刃的钝刀，从千叶站上方那块巨大的广告屏旁刮过来，直接切开大衣的缝隙。

  雪之下雪乃刚刚把冻得有些发僵的右手从口袋里抽出来，准备去摸大衣内侧的交通卡。还没等她的指尖碰到布料，一个带着暗红色丝带的深色方盒就这么毫无征兆地挡在了她的视线和检票口之间。

  盒子不大，表面有细微的磨砂纹理，包装得严丝合缝。

  雪乃的视线顺着拿着盒子的那只手往上移，撞进了拉芙希妮·都柏林那双在这种温度里也冷得能结冰的翡翠色眼睛里。拉芙希妮的围巾松松垮垮地堆在颈间，鼻尖因为冷风吹拂而微微泛红，但她的神态却和往常一样，带着那种干燥和平静。

  "如果不拿稳的话，大概会掉到地上。"

  拉芙希妮说完，手腕稍微往前递了递。那张原本应该用来维持距离感的面具，在清晨微弱的阳光下裂开了一条细微的缝隙，露出了一点类似于恶作剧得逞的促狭。

  雪乃的呼吸在冷空气里变成了一团短暂的白雾。她的手悬在半空，指节因为寒冷和无措而微微发白。

  "现在是早上七点四十六分。"雪乃的声音在风声中听起来比平时还要紧绷，但那种习惯性的逻辑武装立刻全功率运转起来，"而且，这里是人流量每分钟超过两百人的交通枢纽。"

  "确实。"拉芙希妮深表认同地点了点头，"但我大概是等不到放学后了。"

  "这是什么缺乏逻辑的借口？"

  "因为到了下午的部室里，会有太多双眼睛看着。"拉芙希妮那只系着红绸带的左手从口袋里伸出来，非常自然地将雪乃耳边被风吹得凌乱的一缕头发别到了耳后。那只手稳得不像是在做一件会让人事后反复回想的事。

  指尖冷得像冰块，擦过雪乃耳廓边缘的瞬间，带起了一阵让人心悸的战栗。

  "那样的话，"拉芙希妮的声音低了半度，"雪乃同学如果觉得收下会困扰，我就连让你装傻拒绝的机会都没有了。"

  那股冷空气直接灌进了雪乃的喉咙里，把她刚才构筑好的那些关于"效率"、"场合"、"糖分摄入指标"的词汇统统冻成了冰块。她的视线在那张精致的磨砂包装盒和拉芙希妮带点笑意的眼睛之间快速切换了两下。

  最后，她粗暴地一把抓过了那个盒子。

  盒子的边角有些硬，但触感却意外地并不冰冷。也许是因为在这个人手里握了有一段距离了吧。这种认知让雪乃本来就有些发热的耳朵变得更烫了。

  "……我并没有觉得困扰。"雪乃咬了咬牙，把盒子极快地塞进了自己书包的最深处，拉链拉得哗啦作响，好像这样就能把刚才自己耳朵发烫、脑子一片空白的证据一并封存起来，"只是觉得你的送礼方式缺乏基本的文明教养。"

  "那还真是抱歉。"拉芙希妮顺着她的话接了下去，嘴角勾起的弧度变大了一点，"看来我需要在明年的这时候改进一下。"

  "你还想有明年了！"

  雪乃转过身，用最快的速度把交通卡拍在闸机上，"滴"的一声后，她头也不回地走进了站台，黑色的裙摆在风里卷起一个凌厉的弧度。

  拉芙希妮跟在她身后走过闸机。

  上学的早高峰电车总是拥挤得毫无道理。即便是往总武高方向的这趟车，车厢里的氧气也被这些穿着各种制服的学生们抽干了。

  雪乃被挤在靠车门的角落里。她没有去抓吊环，而是双手抱紧了自己的书包，将它紧紧地贴在胸口。车厢里的暖气开得很足，加上人多，空气变得有些闷热。

  拉芙希妮就站在她面前不到二十公分的距离。她的后背抵着车门旁的挡板，一只手拉着吊环，身体的角度刚好在拥挤的车厢里为雪乃撑开了一个勉强能够呼吸的半圆形屏障。

  列车启动。车轮碾过轨道的摩擦声和车厢内低声的交谈混合在一起。

  雪乃低着头，视线死死地钉在拉芙希妮大衣领口第二颗扣子上。她能感觉到那个躺在自己书包底部的方盒在随着电车的晃动而轻微地磕碰着书本的边缘，每一次磕碰都像是在提醒她刚才那个在冷风里的插曲。

  这是超出了常规预期的事态。

  在雪乃原本的计算里，即使要在今天这个被冠以各种无聊商业标签的日子里有所交集，那也应该是在放学后的特别栋部室里，在由比滨那种吵闹的掩护下，勉强地进行类似于"人情往来"的交换。

  但拉芙希妮把所有的步骤都提前了。不仅提前了，而且用干燥的方式，在没有任何第三方见证的情况下，把东西硬塞了过来。

  "如果是担心里面的形状被挤坏，那个盒子里面垫了防震的海绵纸。"

  拉芙希妮的声音从头顶飘下来，混在电车的报站广播里。她没有低头，视线落在车门玻璃上倒映出来的模糊影子上。

  "我没有担心。"雪乃的回答快得就像是条件反射，她把下巴往围巾里缩了缩，试图掩饰语气里的生硬，"我只是在考虑……这种高热量物质，怎么处理才不会对近期的作息规律产生负面影响。"

  "那确实是个严重的课题。"拉芙希妮淡淡地说。

  车厢忽然因为转弯而剧烈地晃动了一下。周围的人群产生了一次小规模的推挤。拉芙希妮因为站立的角度问题，肩膀被人撞了一下，身体失去平衡，向前栽了半步。

  雪乃本能地松开了一只抱着书包的手，抓住了拉芙希妮大衣的袖口。

  两个人的距离在一瞬间被无限压缩。雪乃甚至能闻到拉芙希妮衣服上那种非常淡的、类似于冷冽草木的洗发水味道，以及从围巾缝隙里渗出来的一点点体温。

  拉芙希妮很快稳住了重心。她借着吊环重新站好，但并没有抽回被雪乃抓着的袖口。

  "……抱歉。"拉芙希妮轻声说。

  "平时那双不用转头就能把全局收进眼底的眼睛去哪里了？"雪乃没有立刻松手，而是等电车完全平稳后，才慢慢地把手收了回来，重新握住书包提手，"如果刚才抓不住，你打算直接撞上那边的铁栏杆吗？"

  "没去哪里。"拉芙希妮垂下眼看着她，"只是刚才稍微有点走神了。"

  这算是什么逻辑。雪乃紧紧地抿着嘴唇。

  这种把所有未来可能产生的摩擦都预先包装成"道歉"的恶劣手段，简直让人无从反驳。她盯着那只被拉芙希妮握着吊环的手，那一截从袖口露出来的红绸带在车厢的灯光下显得格外刺眼。

  "……谢谢。"

  声音很小，被电车到站时刺耳的气阀放气声完全盖住。

  拉芙希妮放在吊环上的手指微微收紧了一下。她转过头，看着雪乃因为扭头躲避视线而露出的那小半截通红的后颈。

  "不用谢。"

  电车门打开了。清晨的冷空气重新涌进车厢。人群像开闸的水一样涌向站台。

  两人一前一后地走下了电车，汇入了走向总武高正门的人流里。沿途的商店有些已经开门了，那些贴在橱窗上的各种粉色和红色的海报在晨光下显得喧闹又刺眼。

  阳光终于驱散了一些清晨的寒意，把总武高那条长长坡道的影子拉得很长。

  雪乃走在稍微靠前一点的位置。她没有再说话，也没有回头去确认拉芙希妮有没有跟上。她只是在走动的时候，左手不自觉地按在书包外侧的一个位置，感受着隔着帆布传递过来的、那个方盒坚硬而又令人安心的棱角。

  ——

  "哗啦——"

  特别栋闲置教室那扇有些年头的拉门被粗暴地推开，门缝底部的滚轮发出刺耳的摩擦声。

  比企谷八幡维持着那副肩膀微微瑟缩的姿态站在门口。他没有立刻走进来，而是像只警觉的猫一样，用他那双死鱼眼在教室里扫视了一圈。

  "我说……"他吸了吸鼻子，声音干瘪得像是一块被风干的抹布，"你们在这里做什么生化实验吗？为什么连走廊里都散发着一股想要把人的血糖强行拉高到糖尿病晚期数值的诡异气味？"

  雪之下雪乃把刚烧开的热水注入陶瓷茶壶里。上升的水汽模糊了她的侧脸。

  "如果你因为嗅觉神经受到一点糖分的刺激就产生幻觉，我建议你先去医务室检查一下你的大脑中枢。"她把茶壶的盖子盖上，视线并没有从茶壶挪开，"而不是站在门口，用你那种足以降低这间教室整体平均智商的表情阻挡通风。"

  八幡抓了抓乱蓬蓬的头发，拖着步子走向靠窗那个常坐的位置。他把书包扔在桌上，拉开椅子坐下。

  "我只是合理怀疑这间教室的氧气已经被可可脂取代了。"他嘀咕着。

  由比滨结衣坐在靠窗的另一侧，原本正在摆弄手机的双手突然僵住了。她的脸颊以肉眼可见的速度泛起一层红晕，视线开始在桌面上那些根本不存在的花纹上游移。

  在长桌的中央，那堆中午在J班出现过的碎花包裹已经被重新整理好了，只留下几个空出的隔层，而旁边的空位上，放着一个明显是单独包装好的、扎着粉色缎带的方形小盒子。

  八幡的视线落在那条粉色缎带上，身体下意识地往椅背上靠了靠。这种后撤的动作是他在面对"不合理善意"时的条件反射。

  "那个……"结衣的声音小得像是蚊子叫，她的一只手紧紧抓着自己的裙摆，另一只手慢慢地推着那个方形的小盒子，朝着八幡的方向挪动了五厘米。

  "小企。"结衣终于深吸了一口气，把那个小盒子推到了桌子的中心线上，"这个是……那个，就是……"

  她结巴了半天，那些平时在F班里信手拈来的用来调节气氛的轻快词汇，突然集体从她的词汇库里蒸发了。

  八幡的视线从那个盒子移开，看向窗外那棵光秃秃的树。

  雪乃端起托盘，绕过桌角，把一杯冒着热气的红茶重重地放在八幡面前。

  陶瓷杯底和木质桌面碰撞，发出一声沉闷的声响。

  她用指尖微微捏住茶杯柄，顺势把它往八幡的手边推了推。水面上荡起一圈涟漪。

  "没有人会把你这种满脑子只有如何贬低自己的人类当作试毒对象。"雪乃把手收回来，目光冷冷地锁定在八幡那张还试图用废话逃避的脸上。

  八幡缩了缩肩膀："所以说，这不就更像是需要签署免责声明的危险——"

  "闭嘴。"雪乃打断了他。她的声音不大，但带着力度。

  "这不是那些你在便利店里用硬币就能买到的、流水线上的标准化糖块。这也是为什么，这里没有任何可以让你用那些充满自嘲的无聊借口去逃避的余地。"雪乃的目光从八幡移开，落在了那个扎着粉色缎带的小盒子上。

  拉芙希妮停下了搅动红茶的动作。

  "比企谷同学。"她用那种带着一贯温和的语调开口了，"逃避卡路里，并不能解决你现在面临的社交问题。"

  她顿了一下，看着八幡的手。

  "除非，你对'真心'这种成分过敏。"

  这句轻飘飘的补充，像是一把直接切断退路的刀，把八幡所有可以用来自我保护的台词都堵死在了喉咙里。

  闲置教室里只剩下热水壶因为冷却而发出轻微的收缩声。

  结衣依旧低着头，只敢用眼角去瞥八幡放在桌子上的手。

  八幡叹了一口气。那是一声漫长的叹息，叹息里混着认输和一种他自己也说不清楚的东西。他的手指在桌面上蜷了一下，又松开。

  他伸出手。手指在这二月中旬的空气里显得有些僵硬。

  他拿起了那个盒子。

  盒子的外包装纸有些粗糙，但折角被压得非常平整，那条粉色的缎带虽然打得不是很对称，却系得很紧。在手指触碰到包装的瞬间，他能感觉到这绝不是什么便利店货架上那种冷冰冰的东西。

  "……虽然不知道这算不算是违背了我一直以来的信条。"八幡没有抬头看结衣，而是盯着自己手里的盒子，声音依然有些干瘪，但那种带刺的外壳已经完全消失了，"不过，如果待会儿放学后我的血糖值异常，你们得负责帮我叫救护车。"

  他顿了顿。

  "……谢谢。"

  结衣猛地抬起头，那双琥珀色的眼睛里瞬间亮起了一层水雾。她是从椅子上弹了起来，整个人都软了下去。

  "太好了！"她用力吸了一下鼻子，又立刻用手背揉了揉眼睛，露出了一个巨大而灿烂的笑容，"我、我还以为小企真的会说出什么更可怕的话来拒绝呢！"

  "我哪有那么不讲理。"八幡把盒子塞进书包里，迅速拿起那杯红茶喝了一口，随后立刻被烫得咳嗽了起来。

  雪乃看着他那副狼狈的样子，端着自己那杯红茶走回了座位。

  "毕竟，除了用那种不中用的语言去掩饰自己连好好接一份巧克力都要绕十八圈弯的别扭性格之外，你也找不到别的办法了。"她坐在椅子上，轻轻吹了吹漂浮在水面上的热气。

  "就算再怎么贫瘠，也比某些动不动就要对别人进行智商碾压的人要强一点。"八幡沙哑着声音反击。
