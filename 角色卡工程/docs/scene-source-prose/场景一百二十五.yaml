场景: 125
幕: "第八幕·归国与失语"
时间: "2014年8月29日 · 周五"
地点: "成田机场→总武高特别栋奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、比企谷小町、川崎大志"
POV: "共享场景／零POV"
正文: |
  成田机场第二航站楼的到达口，下午两点刚过，人群里有人举起了一块手写的牌子。

  牌子是硬纸板做的，边角用粉色荧光笔描了框，上面写着歪歪扭扭的四个大字："欢迎回来"。举牌子的是小町，牌子太重，她举了不到十秒钟手就开始晃，大志在旁边默默伸手托住了牌子的下沿。

  "来了来了！！"结衣第一个看见那个拖着行李箱的身影，踮起脚尖用力挥手。

  拉芙希妮走出闸口的时候，脚步停了半拍。

  水色的连衣裙，肩上挎着那只熟悉的包。她看着到达口外面一字排开的五个人——挥着手的结衣，被牌子压得摇摇晃晃的小町，托着牌子的大志，站在稍远处抱着手臂的八幡，以及最边上的雪乃。

  "我回来了。"她说。

  "回来啦——！！"结衣冲上去，一把抱住她的胳膊，上下打量，"有没有瘦？有没有好好吃饭？照片里的东西看起来都不好吃！"

  "吃过了。伦敦的汤，没有你想的那么难喝。"

  "拉芙希妮姐，欢迎回来！"小町把牌子塞给大志，蹦过来，"房间给你留得好好的哦！值日表也——"

  "小町。"八幡在后面提醒了一句。

  "啊，没事的。"拉芙希妮笑了，"我记得的。"

  雪乃最后走上前，看了她一眼，点了点头。

  "欢迎回来。"

  "嗯。"

  回程的电车上，六个人坐成两排。结衣和小町一左一右夹着她，问伦敦的天气、伦敦的地铁、伦敦有没有企鹅。拉芙希妮一个一个地回答，语速和出发之前没有任何区别。

  八幡坐在对面，看着她左手腕上那条红绸带，什么都没有问。

  ——

  活动室里，结衣提前准备的蛋糕摆在长桌中央，六只杯子全部上了桌。

  小町和大志负责切蛋糕。小町把最大的一块分给了拉芙希妮，理由是"长途飞行的人需要糖分"，八幡的那份明显小了一圈，他看了一眼，什么都没说。

  欢迎会一直开到傍晚。开学前的最后一个周五，夕阳把活动室的地板晒得暖烘烘的。

  小町最先看的表："啊，糟了，小町答应妈妈六点前回去买菜的！"她手忙脚乱地收拾书包，拽起大志，"大志，走走走，顺路！"

  门在两个人身后合上。

  活动室里安静下来。风扇慢慢地摇着头。

  拉芙希妮放下手里的麦茶，站了起来。她走到长桌正前方，从包里取出一份复印的档案，放在桌面上。

  "约好了要告诉你们的。"她说，"现在，从头到尾。"

  她讲得很慢，也很平。

  从那个编号开始，到保险会社的阅档室。视察日前十天的风险升级评估，签收记录上的"已读"。批复栏里的"行程维持。按原计划执行"。《视察警备配置命令》的第三条，"未获视察负责人明确授权，不得进入视察区域"。三个签名，同一个人。

  "报告也写清楚了另一件事。"她说，"主办方和煽动者之间没有任何联络。火，不是姐姐放的。"

  结衣的手一直攥着杯壁。

  "起火之后约四分钟，只有一个人跑进去。"拉芙希妮的声音低了半分，但很稳，"达洛维小姐。安保获得授权的时候，已经超过可介入窗口约十一分钟。"

  活动室里很静。风扇转过去，又转回来。

  "八月十二日晚上，我把謄本放在她面前。"拉芙希妮说，"我说，我知道安保为什么没有进去。"

  "她……"结衣的声音卡了一下，"她说什么？"

  "她说，她没有命令任何人纵火。"

  那句话转述出来的时候，语序和措辞忽然变得不像拉芙希妮平时的说法——干脆，冷，每一个字的位置都精确得过分。

  八幡抬起眼睛。

  "……刚才那句，是原话吧。"他说，"连说法都跟你平时不一样。"

  拉芙希妮顿了顿。

  "嗯。"她垂下眼睛，轻轻点了点头，"原话。"

  她没有解释为什么自己记得那么清楚。没有人追问。

  "她没有否认。"拉芙希妮继续说，"謄本留在她那里了。我那里还有副本。"

  "我告诉她，八月二十九日，我回日本。"她说，"去是我自己要去的，回来，也是我自己要回来的。"

  她抬起眼睛，环视了一圈长桌。

  "现在，我回来了。"

  "你打算怎么办？"雪乃问。

  这是她今天问出的第一个问题。

  "什么都不打算。"拉芙希妮摇了摇头，"我不会把它交给长老会。如果我把它交出去，姐姐就变成了那份报告的受害者。她不是。达洛维小姐才是。"

  "我也不会原谅她。"

  她说得很平静。平静得像在念别人的句子。

  雪乃看着她，很久没有说话。

  "你说过，可能什么都查不到。"雪乃最后开口，"现在，答案在你这里了。"

  "嗯。"拉芙希妮看着自己交叠在桌上的手，"是比'没有'更重的答案。"

  "姐姐她……"结衣犹豫了一下，还是问了出来，"后来，怎么样了？"

  拉芙希妮沉默了几秒。

  "有些部分，"她抬起眼睛，"请允许我不说。"

  "嗯！"结衣立刻点头，点得很快，"不说也可以！什么时候想说了再说，不想说就永远不说！"

  "对，反正我们也不收利息。"八幡瘫在椅子上，"不过有一件事我倒是想确认一下。"

  "什么？"

  "四分钟啊。"八幡看着桌面，声音很干，"……跑得真快。"

  没有人接话。这一次，没有人急着说话。

  拉芙希妮低下头，眨了一下眼睛，又眨了一下。

  "……嗯。"

  ——

  收拾蛋糕盘子的时候，雪乃在门背后的值日表前站住了。

  六张便签。五个名字。一个空格——从她离开的那天起，被留了二十七天。

  拉芙希妮端着洗好的杯子走过来，顺着她的视线看过去。

  "啊。"

  她放下杯子，从长桌上拿起那支水笔，站在值日表前，把那个空白的格子，一笔一划地填上了自己的名字。

  拉芙希妮·都柏林。

  字不大，写在五个名字的旁边，笔画很稳。

  "这样，"她退后半步，看着那张表，"就是六个人了。"

  风扇吹过来，值日表左下角的纸角掀了一下，又落了回去。

  那张表在门背后贴着。六张便签，六个名字，一个不少。

  窗外，八月最后的夕阳把特别栋的影子拉得很长。
