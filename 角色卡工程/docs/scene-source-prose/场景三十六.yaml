场景: 36
幕: "第三幕·二学期"
时间: "2013年10月下旬 · 文化祭第一天傍晚至夜晚"
地点: "雪之下雪乃的公寓"
人物: "拉芙希妮·都柏林、雪之下雪乃、雪之下阳乃"
正文: |
  文化祭第一天的喧嚣终于在夕阳彻底沉入海平线后被强制按下了暂停键。

  拉芙希妮跟在雪之下雪乃身后，两人一前一后，顺着通往美滨区的那条熟悉的路往回走。一路上，只有皮鞋踩在干燥柏油路面上的声音。雪乃没有刻意放慢脚步等待，拉芙希妮也没有试图去拉近那大约两米多的距离。这种沉默不同于早上在走廊里的那种极度紧绷，更像是一种刚刚脱离高压水域后，连多说一个字都觉得浪费氧气的疲惫。

  直到在雪之下公寓那扇厚重的玻璃门前，雪乃才停下脚步。

  她转过身，视线落在拉芙希妮并没有停下、甚至还有继续往前走趋势的鞋尖上。

  "你这样我真的很难办。"

  雪乃的声音在夜风中显得有些干硬，带着明显的不耐烦。她微微扬起下巴，似乎想用这种居高临下的姿态来掩饰自己不知道该怎么处理这种"被一路尾随"的无措感。但她的手已经越过了拉芙希妮的视线，按在了感应门禁上。

  伴随着轻微的机械解锁声，玻璃门向两侧滑开。雪乃没有再多说第二句拒绝的话，径直走了进去。

  拉芙希妮安静地跟了进去。

  公寓内的装潢呈现出一种缺乏生活气息的冷色调。厚重的防盗门在身后"咔嗒"一声落锁的瞬间，拉芙希妮的肩膀因为长时间的肌肉记忆而本能地紧绷了一下。

  "坐在那里就好，不要乱碰东西。"

  雪乃把那只黑色的旅行袋放在玄关的柜子上，换了拖鞋，头也没回地向厨房的方向走去。她熟练地打开水壶的开关，取出了柜子里的茶具。水流注入陶瓷壶的声音在安静的公寓里显得格外清晰。

  拉芙希妮依言走到客厅中央那张看起来非常规整的沙发前坐下。

  在雪乃背对着她准备茶水的这几分钟里，拉芙希妮那双翡翠色的眼睛开始不动声色地对这个完全陌生的私人空间进行快速剥离和评估。

  这是多年来在爱布拉娜的监控下养成的习惯：确认门窗的死角，评估家具的摆放是否便于躲避，寻找可能存在的电子眼——

  但在她扫视过电视柜旁边那个本该放置某种冰冷工艺品的展示架时，她的视线突兀地卡住了。

  那是一排排列得整齐的玩偶。

  不仅有穿着不同衣服的熊猫，还有一个体型大到几乎能占据半个沙发的熊猫抱枕，就那样大大咧咧地靠在侧边的单人椅上。空气中弥漫着淡淡的大吉岭红茶的香气，而在那股香气的深处，拉芙希妮居然在茶几的边缘看到了一包印着那个傻乎乎熊猫脸的面巾纸。

  这和那个在后台走廊里用冰冷逻辑终结闹剧、警告别人"不要再让我收拾场面"的雪之下雪乃，完全无法重合。

  拉芙希妮的手指无意识地摩挲了一下西装外套的口袋，碰到了里面那个边缘有些粗糙的发卡。厨房里传来了茶杯碰撞的轻脆声响，雪乃端着两杯热气腾腾的红茶走了出来。

  拉芙希妮将视线从那个巨大的熊猫抱枕上收回，端正地坐在沙发上。雪乃将其中一杯红茶推到她面前，瓷器与玻璃茶几碰撞出清脆的声响。

  大吉岭特有的醇厚香气在空气中蔓延。雪乃在对面的单人沙发上坐下，双手交叠放在膝盖上，没有对角落里那些排列整齐的玩偶进行任何符合逻辑的解释，仿佛只要她不提，那些东西就不存在于这个空间里。

  拉芙希妮端起茶杯，轻轻抿了一口。这杯茶没有放方糖，带着一丝极淡的苦涩，但这股热度确实让那份僵硬的防备感消退了不少。

  尖锐的门铃声毫无预兆地在此时响起。

  雪乃端茶的动作出现了一个明显的停顿。杯子距离嘴唇只有几公分，水面上荡起了一圈波纹。她没有立刻起身，而是板起脸，将茶杯放回原处。那是一种长期处于某种习惯性防守状态下才会有的反应。

  "叮咚——叮咚——"

  门铃声变得急促起来，随之而来的是门外有节奏的敲击声，以及一个带着笑意却毫无温度的声音穿透了厚重的防盗门。

  "雪乃酱——我知道你在家哦。姐姐好心来看看你，这么冷漠可不好呢。"

  雪乃的后背重新绷紧。她快步走向玄关，解开了门禁锁，但防盗链依然挂着。门只开了一条勉强能看到外面的细缝。

  "你来做什么。"雪乃的声音冷硬，语速比平时快了半拍，"我不需要探望，也没有多余的时间用来配合你那些无聊的游戏。"

  门外，雪之下阳乃穿着一件深酒红色的风衣，脸上的笑容完美无缺。她并没有在意门缝的宽度，而是将视线微微下移，透过那条狭窄的缝隙，精准地捕捉到了玄关地垫上多出来的那双属于拉芙希妮的平底皮鞋。

  "哎呀。"阳乃拉长了尾音，声音里立刻多了一种找到了新玩具的愉悦感，"难怪连门都不愿意开。原来这间公寓里，不仅藏了那么多没长大的熊猫，还藏了不能让姐姐看见的小客人呢。"

  雪乃猛地握紧了门把手，试图用身体挡住阳乃探究的视线。"这与你无关。回去。"

  "真无情啊。"阳乃不仅没有退后，反而将一只手搭在了门框上，笑容愈发明媚，"不过，能在文化祭这种混乱的日子里被你带回这个冷冰冰的笼子……雪乃酱的交友标准，真是越来越让人好奇了。"

  坐在客厅里的拉芙希妮并没有动。她甚至没有看向玄关的方向，但阳乃那刻意提高了一点音量的、带着糖衣的尖锐句子，清晰地传进了她的耳朵里。

  这种通过居高临下的关心来撕开对方边界的沟通模式，让拉芙希妮的呼吸本能地放轻了。她的手指在茶杯边缘停住，左手慢慢滑向了右手腕那截烧焦的旧丝带。

  雪乃长长地叹了一口气。那声音里没有愤怒，只有一种常年积累下来、已经无法用反抗来消解的疲惫。她很清楚，如果不放行，门外那个人有足够的耐心站在走廊里，把那些能精准刺痛神经的台词说到引来整栋楼的侧目为止。

  大门被彻底拉开。雪乃没有看阳乃脸上的胜利笑容，而是径直转身走向厨房。

  "只能喝一杯茶。"她背对着玄关，声音冷硬得没有起伏，"喝完之后，立刻离开这里。"

  这句话在空旷的过道里有了短暂的停顿，随后，雪乃补上了后半句。

  "你们两个都是。"

  坐在客厅沙发上的拉芙希妮睫毛轻颤了一下。她听懂了那个复数代词里的重量。雪乃在关门，不仅是把阳乃关在门外失败后，选择把所有人都清退出她这片已经不再安全的私人领地。那是一道为了掩饰狼狈而强行升起的冰冷高墙。

  高跟鞋踏在玄关地板上，发出清脆的响声。

  阳乃慢条斯理地走进客厅。她对那些占据了大量视野的潘先生周边视若无睹，仿佛它们只是一堆透明的空气，而是将那双不带温度的眼睛，笔直地落在了拉芙希妮身上。

  拉芙希妮没有躲避视线。她的脊背挺得笔直，双手以一种极度符合礼仪规范的姿态交叠在膝盖上，下颌微微收紧，脸上维持着一种无懈可击、却又缺乏鲜活生气的平静。这是她十四岁前，在塔拉庄园的宴会厅里面对那些审视目光时，被反复锤炼出的本能防守状态。

  但这副刻意伪装出的完美外壳，却让阳乃嘴角的弧度更深了。

  那是一种发现了同类的愉悦。

  "哎呀。"阳乃走到茶几旁，没有坐下，而是居高临下地俯视着拉芙希妮。"难怪雪乃酱不欢迎我。原来家里藏着这么一件……漂亮的'工艺品'呢。"

  拉芙希妮交叠的指尖在布料上稍微用力了一下。

  "工艺品"这个词，带着明显的评估意味。阳乃的眼神像手术刀一样，轻而易举地切开了她刻意摆出的那份端庄。阳乃自己就是在更严苛的标准下被打磨出的完美成品，因此，她一眼就能看出拉芙希妮身上那种还没有完全凝固、因为试图伪装完美而显得格外僵硬的"刻意"。

  就像看着一个刚从同样的机器流水线上走下来、还在努力适应模具的胚型。

  "明明呼吸的频率都控制得很好了，连肩膀的弧度都没出错。"阳乃的声音放得很轻，带着令人毛骨悚然的温柔，"可是……你现在很害怕我，对吗？"

  瓷器与玻璃茶几狠狠磕碰在一起，发出一声极不和谐的脆响。

  雪乃端着两杯刚泡好的红茶站在茶几旁。她没有给这声碰撞做出任何解释，甚至连看都没有看阳乃一眼。她直接转身，将那杯属于自己的茶杯端了起来，重新在单人沙发上坐下，脊背挺得僵直。

  "茶已经送到了。"她的声音干涩且缺乏起伏，每一个字都像是在宣读某种强制执行的倒计时，"现在，你可以停止你那些无趣的审视，然后履行你离开的承诺了。"

  阳乃的话语被打断了。她看了看茶几上那杯还在冒着热气的大吉岭，又看了看对面如同竖起尖刺般的雪乃，发出一声轻快的叹息。

  "真可惜，明明聊得正开心呢。"她直起身，不再继续保持那种居高临下的压迫姿态，"既然雪乃酱这么不欢迎我，那我还是识趣一点比较好。"

  阳乃转身向玄关走去。拉芙希妮深吸了一口气，将刚才那种被爱布拉娜阴影笼罩的窒息感强行压下。她站起身，以完美的客座礼仪跟在阳乃身后，一直送到了大门前。

  阳乃在推开门的前一秒，微微侧过头，那双带着笑意的眼睛再次从拉芙希妮紧绷的肩膀上扫过。

  "再见啦，小工艺品。"

  "谢谢您的评估，雪之下姐姐。"拉芙希妮的音量压得很低，低到只有站在门边的人才能勉强听清。她的语速放缓，带上了一点平时极力隐藏的冷淡英音，"不过，即使是未定型的胚型，也有拒绝被装进特定橱窗的权利。"

  阳乃推门的动作顿了一下。紧接着，她嘴角的弧度不受控制地向上扬起，变成了一个更加明媚、也更加危险的笑容。她没有再回话，只是深深地看了拉芙希妮一眼，然后迈出大门，伴随着咔哒一声轻响，将那扇沉重的防盗门重新关上。

  公寓里重新恢复了死寂。只有厨房方向传来偶尔的水管滴漏声。

  拉芙希妮在玄关处站了半分钟，彻底调整好呼吸后，才转过身。她没有重新坐回沙发，而是走向了门口自己放鞋的位置。

  "今天打扰了，雪乃同学。"她的声音已经恢复了平时的温和与疏离，"我也该回去了。"

  雪乃放下手中的茶杯，站起身走到玄关走廊的另一端。她的视线在拉芙希妮的鞋子上短暂停留，然后走到旁边的储物柜前，拉开柜门，从里面拿出一把黑色的长柄伞。

  "天气预报说一会将会下雨。"雪乃将那把伞递了过去，眼神并没有直视拉芙希妮，而是落在了伞柄的缝线上，"作为奉仕部的重要劳动力，我不希望你因为淋雨这种低级错误，导致明天的效率受到影响。"

  拉芙希妮伸出手，握住了那把带着微微凉意的伞柄。

  "带着这把伞回去。"雪乃转开脸，盯着旁边的墙纸，语气比刚才还要生硬几分，"另外，到达住处后……发一条信息过来。我需要确认我...我还能联系到你"
