场景: 42
幕: "第三幕·二学期"
时间: "2013年11月15日 · 修学旅行第2天 · 白天到傍晚"
地点: "清水寺 → 二年宁坂 → 洛东旅馆"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣（+ 叶山组：叶山隼人、户部翔、海老名姬菜、三浦优美子、大和、大冈）"
正文: |
  从清水寺正殿顺着石阶一路往下，二年宁坂的青石板路几乎被密密麻麻的修学旅行队伍和游客填满。两侧商铺里飘出的抹茶甜香与劣质纪念品的叫卖声混杂在一起，将周围的空气搅得浑浊而嘈杂。

  奉仕部的四人走在人群边缘，与前方十多米开外那个引人注目的现充圈子始终保持着不远不近的距离。

  户部翔那件标志性的连帽衫在人群中很显眼。他手里拿着刚才在某个摊位上买下的小物件，正带着那种惯有的大声嚷嚷，试图硬挤到队伍最前方的海老名姬菜身边。

  但他失败了。大和自然地转身递过一瓶水，恰好卡在了他向前的路线上；前方的三浦优美子几乎在同一秒转过头，拉着海老名的手腕指向旁边一家卖木簪的店铺。户部就像是一颗被精密齿轮排斥在外的砂砾，不管怎么尝试往前靠，都会被这个圈子里某种默认的结构轻描淡写地推回原位。

  而叶山隼人就站在几步之外，脸上带着无可挑剔的温和笑容，看着这一切发生。

  拉芙希妮·都柏林停下了脚步。

  她越过那些熙熙攘攘的人头，安静地注视着叶山集团内部正在上演的那出戏。翡翠色的眼睛没有移开，视线一寸一寸地扫过每一个人的位置：三浦的排外、大和的物理阻挡、叶山那毫不痛痒的温和缓冲。她左手的拇指隔着制服袖口，压在右手腕那截烧焦的丝带上。

  由比滨结衣站在拉芙希妮身旁，双手不安地抓着挎包的带子。

  她看到了海老名姬菜配合着三浦的动作发出那些标志性的腐女笑声。在旁人看来，那只是一个女生在热闹的旅行中毫无防备的表现。但结衣在这一刻，第一次读懂了那笑声背后的东西——那不是害羞，也不是暧昧，是一层层垒得极高、把所有试探都挡在外面的冰冷外壳。

  她此前一直没看出来。直到这一刻，当着现场活体样本，她第一次意识到，海老名对户部的靠近根本没有半点所谓的好感，甚至连发展可能性的苗头都被掐断了。

  这个发现让她张了张嘴，想要把这种过于强烈的直觉说出口。只要她说出来，这个看似荒诞的观察任务就可以当场结束。可是，那句话滚到舌尖，又被她硬生生地咽了回去。这种拆穿他人拼死维持的体面而招致关系破裂的恐惧，让她把包带攥紧了一些，最终什么也没说。

  比企谷八幡在一旁发出一声短促而干瘪的气音。他没有去看前方那个看似光鲜的团队，只是将视线落在旁边一家店铺斑驳的木门上。

  "毕竟，谁也不想当那个把针尖戳向气球的坏人。"八幡用极低的音量接上了这句话，"只要假装那层皮还在，里面装的是不是空气也就没人去在乎了。"

  结衣把头埋得很低，只留给旁边人一个紧绷的下颌线，在喧闹中维持着难堪的沉默。

  终于，在二年宁坂的下坡，户部按捺不住自己的感情和海老名疏远的态度，尝试主动向海老名搭话。就在他准备大声发出声音的那一瞬间——

  叶山隼人悬在半空的那只手，落在了户部翔剧烈起伏的肩膀上。他五指收紧，隐蔽地发力，试图将那个正在崩溃边缘的身体钉在原地。

  "户部，冷静一下。"叶山的声音刻意压得低缓，那个被震裂的温和笑容正以一种令人牙酸的速度在他脸上强行拼凑重启，"这里游客太多，挡着别人了。你昨晚没睡好，大概是有点中暑，我们先去旁边的茶屋休息……"

  由比滨结衣的手指已经在包带的帆布纹理上掐出了深深的勒痕。看着户部那种近乎被人剥光了扔在街上的狼狈，她喉咙里那块酸涩的异物感几乎要冲破声带的阻碍。她想开口，想闭着眼睛喊出一句"其实海老名根本就不——"

  一只穿着深蓝色制服袖子的手臂，不轻不重地横在了她的视线前方。

  比企谷八幡没有回头，连半个余光都没有分过来。他只是驼着背，用那种干瘪而毫无起伏的音量，贴着结衣那侧的空气低声开口。

  "一旦说出口，你就是那个亲手把气球扎破的人。"八幡的声音平淡得没有任何情绪，"没有把这个烂摊子扛到底的觉悟，就别去捡那种别人死都不想背的黑锅。"

  结衣的呼吸猛地顿住，眼底因为挣扎而漫上的薄红被这句尖锐的警告生生逼停在了眼眶边缘。

  几乎就在叶山准备半强迫地将户部拽出人群的那一秒，雪之下雪乃冰冷的声音，像一道无法通融的隔离带，强行截断了那团黏腻混乱的空气。

  "在二年宁坂这种高密度的狭窄路段引发骚乱，并在试图掩盖窘迫的过程中进一步阻碍其他游客通行。"雪乃的目光从叶山按着户部肩膀的那只手上刮过，深蓝色的瞳孔中只剩下纯粹的审视。"这就是对所有人都好的做派吗？"

  叶山的动作彻底僵住了。他转过头，那双翠绿色的眼睛里终于褪去了那层毫无意义的光泽，漏出了几分无法遮掩的狼狈与疲倦。

  站在石阶下方几步开外的拉芙希妮·都柏林，依旧维持着那个不含任何温度的神情。

  她左手拇指隔着制服袖口，压在右手腕那截烧焦的丝带上，指节微微发白。

  四周嘈杂的叫卖声在这一连串冰冷直接的敲打下，显得尤为刺耳。户部翔涣散的目光顺着声音扫过站在下方的奉仕部四人，嘴唇微张。而站在他对面的海老名姬菜，依然稳稳地端着那杯抹茶拿铁，视线正落在旁边一家卖京都烧的店铺招牌上，仿佛这场刚刚引发的地震与她没有半分关系。

  户部的崩溃和叶山的难堪在二年宁坂的青石板上僵持着，空气沉闷得几乎无法流转。

  在这片令人窒息的死寂里，比企谷八幡发出了一声干瘪而悠长的叹息。他把手从校服口袋里抽出来，随意地抓了两下后脑勺的短发，肩膀塌得比平时更厉害了一些。

  "啊——真是麻烦死了。"八幡懒散的声音在人群边缘响起，带着一种毫不掩饰的恶劣感，"本来不想选在这个时候说的。不过既然气氛都已经烂成这样了……海老名，虽然户部这家伙不怎么样，但我其实一直暗中对你……"

  他语调轻浮，试图用一场突如其来的、由比企谷八幡构成的妄想式告白闹剧，强行砸进这片废墟里。只要他把水彻底搅浑，在场所有人的焦点就会从户部的尊严受挫，立刻转移到对某个死鱼眼男生的集体排斥上。

  "比企谷同学，我有一个问题想问——"

  拉芙希妮·都柏林的声音不高，却像是一把精准切割了空气的寒刃，生生将八幡那句未出口的荒诞说辞连根斩断。

  拉芙希妮·都柏林向前跨出两步，脚步轻得没有发出声音，却精准地卡在了八幡、户部和海老名形成的三角中央。她背对着海老名，侧身用半个肩膀挡住了八幡的视线，从物理层面彻底切断了那套即将落地的自毁逻辑。

  "你昨天在车上告诉我的，关于'京都人特有的排外隐喻测试'，就是指这种由多名男士在街头突然发起的即兴争执吗？"

  拉芙希妮转过身，用一种带着纯粹困惑的神情看向叶山和户部。

  "抱歉。"拉芙希妮微微欠身，对他们露出一个标准到找不到破绽的微笑，"在英国的一些地方，如果在街上看到这样具有冲击力的情绪爆发，我们通常会默认那是某个街道戏剧节的即兴排练。所以刚才，这是比企谷同学为了让我体验本地文化，特意拜托两位演的一出即兴表演吗？"

  空气停滞了微不可察的一瞬。

  比企谷八幡插在西装裤口袋里的手指，无声地握紧了一下。那句被生生咽回喉咙里的自毁台词还堵在那里，他没有把它吐出来，也没有把它咽下去。他的视线越过拉芙希妮的肩膀，短促地扫了一眼那个已经背对着他的、单薄的侧影。

  海老名姬菜推了推鼻梁上的红框眼镜，嘴角的弧度瞬间切换到了最无伤大雅的模式。

  "啊呀，被都柏林同学识破了呢。"海老名的声音轻快得仿佛刚才什么都没发生过，"八幡君想出来的这个'用夸张演技测试外国同学'的惩罚游戏真是太坏了。不过户部同学刚才的演技真的超级逼真哦，我都有点磕你俩了，腐腐腐。"

  原本摇摇欲坠的平衡，被这根荒谬却又异常好用的绳子强行拉住了。叶山隼人的肩膀明显放松下来，他立刻顺着这个台阶拽了户部一把，动作里透出一种劫后余生的仓促。

  "是啊。"叶山脸上重新挂上了温和的笑容，甚至还带着点歉意，"拉芙希妮同学果然没那么好骗。户部，你刚才那一下演得太过了。"

  户部张着嘴，在这套毫无逻辑的连招里茫然地眨了眨眼，发现所有人都顺着这台阶走了下来。他只能干巴巴地挠了挠后脑勺，发出两声尴尬的笑声。

  雪之下雪乃站在稍远的路灯下，看着拉芙希妮转过头时那恢复平静的侧脸。她没有任何要评价的打算，只是默默地转身，面向了下坡的方向。

  在回去的路上。

  由比滨结衣走在队伍的最前方。她的步伐比平时迈得更急，双手紧紧揪着提包的边缘，连背影都透着一种想要尽快逃离某种黏腻氛围的急迫感。叶山组那种为了粉饰太平而产生的窒息感，显然还需要她花上好一阵子去慢慢消化。

  比企谷八幡远远地落在最后。他双手插在西装裤的口袋里，肩膀依旧垮着，鞋底擦过石板路发出拖沓的声响。那副不远不近跟着的姿态，似乎还在为自己刚才被强行塞回喉咙里的自毁台词而感到不自在。

  雪之下雪乃走在拉芙希妮·都柏林身侧，稍稍落后半步。

  这是一个微妙的角度。雪乃的视线没有刻意避让，而是笔直地落在拉芙希妮的侧脸上。那张原本因为厌恶而透着冷厉的脸，此刻已经完全恢复了那种带着恰到好处距离感的温柔。

  那种熟练，绝不是出于天然的迟钝，而是经过千百次雕琢后形成的肌肉记忆。

  对于雪乃而言，这种视线并不包含任何多余的情感欣赏。她只是在进行一种近乎苛刻的分类——试图把这副滴水不漏的假面从拉芙希妮本人的真实轮廓上剥离下来。

  "都柏林同学。"雪乃的声音平稳地响在石板路的缝隙间，不大，但足够清晰。

  拉芙希妮的步调没有乱，只是微微偏过头。

  "你好像很擅长应付这种场合。"雪乃看着她，语气像是在陈述一份刚被归好档的观察报告，没有任何起伏。但紧接着，那句话的末尾却锋利地挑开了表面的包装，"但是你所做的，是为了他，还是你？"

  拉芙希妮呼吸停了一瞬，她放慢了半拍脚步，微张的嘴唇没有出声。
