场景: 148
幕: "第十幕·冬去春来"
时间: "2015年3月15日 · 周日"
地点: "总武高中体育馆 → 三年F班教室 → 特别栋奉仕部活动室"
人物: "比企谷八幡、雪之下雪乃、由比滨结衣、拉芙希妮·都柏林、比企谷小町、川崎大志、一色彩羽（背景）、户冢彩加（背景）、材木座义辉（背景）、叶山隼人（背景）、三浦优美子（背景）、海老名姬菜（背景）"
POV: "共享场景／零POV"
正文: |
  三月十五日。晴。总武高中的体育馆里坐满了三年级的学生。椅子按班级排成方阵，每个椅背上贴着一张姓名签。家长席在两侧，校外来宾坐在后排靠门的位置。讲台上挂着一面校旗，旗角垂在讲台的边缘。

  校长致辞。教务主任念毕业生名单。三百多个名字，一个接一个。三年F班念到中间，念到"比企谷八幡"。他站起来，点了一下头，坐下。旁边的椅子空着——那是材木座的位子，他被叫到名字的时候还没从洗手间跑回来。

  三年J班。念到"雪之下雪乃"。她站起来的时间比前一个人短一点。坐下的时候，她拨了一下肩上的头发。

  念到"拉芙希妮·都柏林"。她站起来，转学生、归国子女、英国人。两年前五月转进三年J班——不，那时候是二年J班。她站在那里，翡翠色的眼睛看着前方。坐下的时候，手在袖口底下，隔着布料，在那条丝带上停了一下。

  念到"由比滨结衣"。她站起来。米色的发卡别在原来的位置。坐下去的时候，她朝F班的方向看了一眼，又收回视线。

  在校生致告别词。毕业生代表致答词。校歌合唱。校旗降下。

  毕业典礼结束。

  散场的时候，体育馆的门一扇一扇打开，三月的阳光涌进来。三年级学生在走廊里互相拍背、交换纽扣、在制服上签名。有人在哭，有人在笑，有人把领带扯下来拿在手里甩。F班的教室被前后门同时打开，穿堂风从走廊里灌过来，把黑板上的"卒業おめでとう"吹得歪了一下。三浦的桌面上被人放了一枝塑料樱花，叶山的外套第二颗扣子已经不在原位。

  八幡坐在自己的位置上。一直坐着。人都走了，教室只剩几张还留在椅背上的姓名签。他的那张还在。他把姓名签从椅背上撕下来——胶带粘了两年多的边，撕下来的时候纸角薄了。

  走廊里还有人。窗外有人在拍照。一年级的校舍在操场的另一头，隔着整个操场。

  他把姓名签放进外套口袋。

  然后他的眼眶开始发酸。

  不是突然的。是从体育馆出来就开始的。那些名字一个个念过去，他想起来——文化祭那天晚上，相模南站在灯下说"基于奉仕部的专业意见"。冬天，平安夜，舞台剧后台，拉芙替结衣沏了一杯甜红茶，茶雾从杯口冒起来。千叶村，篝火旁边，雪之下说"我对你——"，然后停住。活动室，四百多个下午，暖气片咔嗒咔嗒的声音，六只杯子排成一排。一年级的自己用自爆解决了鹤见留美的事件，三年级的自己在记录簿上写了四个字——天晴。无风。

  这些全部是确实发生过的。不是比喻。不是后来美化。是在那些具体的下午，在这所学校的具体角落，和具体的人一起发生过的。

  眼泪从他眼角淌下来。他没有擦。不是因为放弃了抵抗。是因为不需要抵抗。

  由比滨结衣在门口站了一会儿。她没有走过去。她知道这个人不需要安慰。他只是——在确认。确认这段生活真的发生过，真的结束了，真的值得。她转过去，用手指轻轻按了按自己的眼角。然后她走了。

  户冢从走廊另一头经过，看了一眼教室里面，脚步停了一秒。然后继续走。走的时候，嘴角往上弯了很小的一个弧度。

  材木座在走廊里碰到了八幡。他站在窗台旁边，手里还抱着那份"最终稿"。他看见八幡的眼眶红着，张了张嘴，没有开中二模式的玩笑。他把手里的稿子卷成一个筒，往八幡肩膀上轻轻敲了一下。

  "哭了。"

  "花粉。"

  "三月中旬哪来的花粉。"

  "那就提前了。"

  材木座没有拆穿。他把稿子夹在腋下，往校门方向走了。

  一年级的校舍那边，小町站在走廊上，隔着操场看着三年级的楼。她没有过来。她知道这个距离刚好。大志站在她旁边。

  "前辈在哭。"大志说。

  "嗯。看到了。"

  "不是花粉。"

  "我知道。"小町说。"哥哥以前说，他是不需要被记住的人。现在他在被记住的高中的最后一天哭了。这是——他对自己说了真话。"

  下午两点。活动室的门开着。四个人回到了这里。窗户开着，三月的风吹进来，把剩下的几张废纸从桌角吹到地上。

  八幡站在门口。眼角的泪痕已经干了。眼眶还有一点红。结衣把一只纸杯放在他手里。倒了半杯水，是凉的。

  "不是MAX咖啡。"

  "今天没有MAX咖啡。"她说。"杯子都收起来了。纸杯。凉的。但是——"

  "够了。"

  他把水喝了。把纸杯倒扣在长桌上，和昨天那四只纸杯排成一排。

  雪乃站在窗边。她看着窗外的天空。昨天傍晚，她在夜空里找那颗春天还没升起的星。现在是下午，天是亮的。没有星星。

  "下午没有星星。"她说。

  "嗯。"

  "但是天空是一样的。"

  拉芙希妮把热水壶的插头从插座上拔下来，线收好。热水壶是活动室的共有财产，不带走。

  "今天早上。"她说。"管家给我发了一条消息。英国来的。他说——你姐姐没有问今天是什么日子。你父亲问了。然后你父亲说：'不用告诉她我问过。她今天很忙。'"

  她把线绕在壶身上，打了一个不松不紧的结。

  "他知道今天是我毕业。"她说。"他没有直接问我。他在厨房的烤炉旁边——想了一会儿——然后决定不要打扰。"

  "那是什么感觉。"结衣说。

  "迟来的。"拉芙希妮说。"但是听到了。"

  四个人站在活动室里。东西已经搬空了——书架空了，茶柜空了，黑板空了。窗台上那一片银杏叶还在，干透了，叶脉清晰。

  八幡走过去，把银杏叶捡起来。他想放进外套口袋，但口袋里已经有了那张姓名签。他把银杏叶夹进姓名签的纸缝里。姓名签上有他的名字、班级、年份。旁边是材木座昨天给他的那张纸条——不是大业。是字条，铅笔写的：城墙外面有春天。

  他把姓名签收回去。

  "走吧。"他说。

  四个人走出活动室。走廊里很安静。特别栋的楼梯在他们身后响着——四个人的脚步声，步频从来不齐，但方向是一样的。这种事也是确实发生过的。从二年级的春天，一直到三年级的今天。每一件都确实发生过。

  楼梯口的安全灯亮了。毕业典礼结束五小时后，黄昏才从天边漫过来。
