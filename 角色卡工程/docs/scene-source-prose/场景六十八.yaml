场景: 68
幕: "第四幕·冬假→三学期"
时间: "2014年1月1日 · 周三 · 元旦 · 下午"
地点: "拉芙希妮的公寓"
人物: "拉芙希妮·都柏林、爱布拉娜·都柏林（+隐性提及：雪之下雪乃、由比滨结衣、家政太太）"
正文: |
  指纹锁咬合解开的电子音在门板后方空旷。当玄关感应灯亮起的瞬间，那种属于千叶神社的喧嚣与寒风被厚重的防盗门彻底隔绝在外，取而代之的是一种被恒温系统维持在恒定摄氏度下的、连呼吸声都多余的死寂。家政太太那双常备的防滑拖鞋并不在鞋柜旁的常规位置上，这是一个明确得不需要任何语言赘述的清场信号。拉芙希妮那只正准备褪下米色羊绒大衣左侧袖管的手停滞在了半空，视线越过玄关的胡桃木隔断，准确地落在了客厅中央。

  爱布拉娜正靠坐在那张宽大的皮革沙发上，双腿优雅地交叠，深酒红色的定制西装外套在室内偏冷的顶灯下泛着微弱的光泽。而在她正前方那张光洁得足以倒影出水晶吊灯的玻璃茶几正中央，端坐着一只与周围这种冷峻阶级感不符的米白色旧玩具熊。

  那只熊的右耳边缘有一道拙劣的、歪斜着收尾的缝线，那是拉芙希妮在八岁那年试图自己充当修补匠留下的痕迹；而它原本应该是纯白色的左爪内侧，有一小块明显的泛黄褪色，那是某次在海德公园草坪上野餐时，被一杯意外倾倒的柠檬水染变了颜色的部分。

  "你把它带来了。"爱布拉娜的声音打破了这片凝固的空气，那是一种经过打磨、却在每一个音节的收尾处透着不容反驳的笃定的语调。她的视线并没有在那个破旧的毛绒玩具上多做停留，只是自然地看着站在玄关处尚未完全卸下户外装扮的妹妹，"我还以为，你早就不需要这种东西了。"

  她停顿了一下。翡翠色的眼眸这才转向茶几上那只熊，目光落在那只歪斜的右耳上。

  "你缝它的时候才八岁。躲在被子里缝了半个晚上，缝完之后发现耳朵歪了，哭得比缝之前还厉害。"爱布拉娜的语调里浮现出一层极薄的、几乎无法与冷峻区分开的柔软，"左爪上那块褪色——Hyde Park。那天阳光很好，你坐在长椅上，脚还够不到地面。柠檬水是你自己弄洒的，但后来我用手帕帮你擦的时候，你哭得比弄洒的时候还凶。"

  这不是一句疑问，而是一次单方面的判定。那种"刚好在衣柜里看到"的轻描淡写，比任何大张旗鼓的翻找都更具破坏力。它在无声地宣布：在这个由都柏林构建的体系里，那些试图被藏匿起来的、代表着软弱和不舍的陈旧物件，随时可以被轻易翻出并公之于众。

  拉芙希妮没有立刻回话。那只停在半空的左手以一种比平时稍微缓慢的节奏继续完成了褪下大衣的动作。她将那件带着室外冷空气的外套挂上衣帽架，在这个过程中，她闭上眼睛，花了两秒钟的时间将心跳的频率强行压制回那条名为"拉芙希妮·都柏林"的刻度线上。

  当她重新转过身走下玄关的台阶时，脸上的表情已经恢复了那种缺乏温度的平静。她没有去看沙发上的爱布拉娜，而是径直走到玻璃茶几前。右手腕上那截有些许磨损的烧焦旧丝带随着她俯身的动作，从深青色的针织衫袖口里滑出一小段。她伸出手，指尖避开了那处被柠檬水弄脏的左爪，握住玩具熊的腰部，将它从那种被当做展示品的难堪境地中拿了起来。

  那只带有陈旧污渍的玩具熊被重新收拢到臂弯里，拉芙希妮转身走向那张宽大的皮革沙发，在距离那道酒红色身影刚好一个肩膀宽度的位置坐了下来。这个间距经过了精确的测量，既不会因为疏离而引发无谓的诘问，也不会因为过度靠近而暴露出自己此刻略微发紧的呼吸节奏。沙发皮面因为重量的压迫发出了一声极轻的下陷声，在此时的客厅里被无限放大。

  爱布拉娜的视线并没有随着那个米白色的毛绒玩具移动。那双翡翠色的眼眸在拉芙希妮落座的瞬间，先落在了她右侧耳畔那枚廉价的粉色塑料发卡上，随后顺着深青色针织衫的袖口，停留在她刚刚因为拿取动作而显露出的右手腕上。那里，一截有些许磨损的烧焦旧丝带正贴着皮肤。而那条编在浅金色发辫尾端的红绸带——在这个完全被冷峻阶级感统治的爱尔兰风格空间里，与发卡和旧丝带一起，刺眼且突兀。

  "看来，那位雪之下部长对你的'补习'，比我想象的还要彻底。"爱布拉娜的声音依旧维持着那种经过仔细打磨的平缓，她随意地调整了一下交叠的双腿，酒红色的西装下摆在皮面上划出一道细微的折痕，"那种颜色……我甚至以为你是从某个糟糕的廉价折扣店里随手抓来的。这种明显带有强迫性质的审美输出，你在这个假期里适应得不错。"

  空气中那种由恒温系统制造的死寂被这段缓慢的问话切开了一道细长的豁口。拉芙希妮下意识地将抱着玩具熊的右臂收紧了半寸。她将视线投向茶几上原本放置玩具熊的那块空白区域，大脑在两秒钟内将几天前在车上编造的谎言重新梳理了一遍，随后用一种冷漠且带有疲惫感的语调给出了回应。

  "您见过那位部长，知道任何试图在规则上与她进行争辩的行为，都是在浪费本就稀缺的个人时间。"拉芙希妮的语速均匀，没有因为被迫提及这些物品而产生任何磕绊，"她对所谓'集体风貌'的偏执要求甚至延伸到了私人物品上。为了避免那种动辄几十分钟的无聊说教，顺从这种毫无意义的表面形式，是维持日常平静代价最小的做法。"

  "确实是一个非常高效的避险策略。"爱布拉娜对这个回答没有表露出明显的赞同或质疑，她只是微微向后靠在了沙发背上，手指轻轻摩挲着领口那枚紫水晶胸针。室内的顶灯在紫水晶的切面上折射出一点冰冷的光芒。"那么，亲爱的拉芙希妮。"她将刚才那种闲聊般的语调稍微收拢了一些，让每个词都带上了不容回避的重量。

  "在经历了整个假期这种近乎强制补习，以及如此糟糕的审美强加之后——你，还想回到那所总武高中，回到那个什么奉仕部去吗？"

  "回去那里，只是为了能够顺利拿到符合家族预期的学分证明。"拉芙希妮的声音里没有夹杂哪怕一丝的迟疑，那是一种被反复打磨过的、剔除了所有感性色彩的干瘪腔调。她将视线从茶几的玻璃表面略微抬高了半寸，平视着对面那面没有任何装饰的白墙，以确保自己的眼神不会在这段近乎自毁的陈述中漏出任何可以被捕捉的破绽。"那种以所谓'帮助他人'为借口，实则只是在进行毫无意义的社交游戏和规则过家家的地方，我并没有任何留念的理由。"

  这段话的每一个字都被她咬得清晰，在宣读一份与自己毫无关联的商业报告。但在那个被袖口遮盖的右手手腕处，那些因用力而绷紧的肌肉线条，却在隔绝了视线的布料下方，诚实地记录着这种割裂的违心之论所带来的沉重负荷。

  客厅里的恒温系统再次发出了微弱的运转声。爱布拉娜那张一直维持着审视姿态的面容上，并没有因为这段试图划清界限的冷酷辩白而出现预期的怒意或嘲讽。相反，她那翡翠色的眼眸里甚至浮现出了一种更为复杂的、近似叹息的柔软。她将交叠的双腿放下，微微前倾了身体，那种属于都柏林继承人的绝对压迫感在这一刻被她用一种近乎完美的姐姐外壳包裹了起来。

  "如果那真的只是一场让你感到疲惫和厌恶的过家家，亲爱的拉芙希妮……"爱布拉娜的声音轻得像在陈述一个不容置疑的真理，每一个音节都精准地落在那种让人无法直接推开的温情刻度上，"家人们都在等你回家，回英国去。"

  这句轻飘飘的话语，在这个充斥着琥珀松香气息的冷硬空间里，砸出了比任何严厉质问都更为沉闷的回响。爱布拉娜的视线并没有从拉芙希妮那张略显苍白的侧脸上移开，她用那种能轻易洞穿一切虚伪的目光，继续编织着那张名为"保护"的网。

  "如果在这片异国的土壤里，那种被强加的规则和毫无意义的社交已经让你感到难以呼吸……"她的语速放得很慢，要确保每一句话都能准确地嵌入拉芙希妮的认知深处，"你随时都可以结束这场糟糕的体验。因为我的身边，永远是你可以依赖的避风港。"

  爱布拉娜起身走向玄关。深酒红色的西装外套在转身时带起了一丝凉风，那股微冷的气息掠过玩具熊扁平的绒毛，掠过深绿色的羊毛地毯，掠过拉芙希妮停在半空中还没来得及收回的手指。

  她在玄关停了一步。

  "今天的初诣，玩得开心吗？"

  她没有回头。这句话的语气里没有试探——因为她不需要试探。她知道答案，她只是想听拉芙希妮自己说出来。

  拉芙希妮望着她的背影。

  "外面太冷了。人也很多。"
  拉芙希妮想了一下、
  "苹果糖太甜了。部长因为我的拖延骂了我两次。"

  爱布拉娜在玄关的光影里站了两秒。然后她抬起手，手指搭在门把上。

  "那就好。我希望你能享受今天这样的元旦。"

  门开了。门关了。

  爱布拉娜离开了。

  公寓重新安静下来。中央空调的送风声在这时候才作为迟到的背景音，重新在管道里响了起来。

  拉芙希妮独自坐在沙发上。她的手指还停在那只玩具熊的头顶上方半寸的位置。

  她将熊拿了起来。翻到背面。左爪内侧那块褪色的淡黄痕迹，在客厅冷色调的灯光下几乎看不清楚，但她用指腹准确无误地找到了它的位置。

  她将玩具熊放在膝盖上，然后抬起右手，指尖搭在发辫尾端那个红色的蝴蝶结上。浅金色的长发在一天的冷风和人群中已经有些松散，但那根红绸带依然保持着那个早晨被她编进去时的形状——紧密、整齐、不去触碰就不会松开。

  拉芙希妮的手指停在蝴蝶结上。

  没有解，也没有拉。

  只是停在那里。
