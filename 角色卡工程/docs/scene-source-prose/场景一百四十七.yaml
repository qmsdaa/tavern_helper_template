场景: 147
幕: "第十幕·冬去春来"
时间: "2015年3月14日 · 周六"
地点: "总武高特别栋奉仕部活动室"
人物: "比企谷八幡、雪之下雪乃、由比滨结衣、拉芙希妮·都柏林、比企谷小町、川崎大志、材木座义辉、户冢彩加、三浦优美子、海老名姬菜、叶山隼人、一色彩羽"
POV: "共享场景／零POV"
正文: |
  三月十四日。毕业典礼前一天。周六下午，学校空了，只有特别栋的活动室亮着灯。

  四个人从中午开始收拾。书架上的委托记录簿按年份排好，二〇一三到二〇一五，三册。茶柜清空，杯子用报纸包好。黑板上的粉笔字擦掉，最后一行是上周三的事——"各自出发"四个字下面，画了一条总武线的路线图，墨迹已经被板擦磨得断断续续。

  窗台上的银杏叶早就干了。八幡拿起来看了看，放回原处。

  一点左右，户冢推开了门。他穿着网球部的队服，背后印着三年生的名字。

  "路过。网球部今天最后一次晨练。"

  "户冢。"八幡把一摞过期文件放下。"今天不是周六吗。"

  "毕业前特别加练。不是正式训练。就是——想在毕业前的球场再打一次球。"他在门口站了一会儿。"八幡，上次打网球。那四十分钟。我把记录写进我的训练手帐了。旁边画了一颗很小的太阳。"

  "太阳。"

  "嗯。因为那天天气很好。天晴。无风。"

  户冢笑了一下，他不是来帮忙的。也不是来道别的。他就是来这里站一会儿，看看这几个人的活动室，然后回去。

  他走了。走廊里的脚步声很轻，和上次约八幡去打球那天一样轻。

  两点左右，材木座来了。抱着一沓打印纸，封面上印着"最终稿"。

  "吾之半生大业！"他把稿子往桌上一放。"这一次，把两个结局都写完了。你说的——'破败的城墙外面有春天'。我写进去了。"

  八幡翻了几页。"不是大业吗。怎么变成薄薄一份了。"

  "删了很多。删完之后发现——想说的东西，原来不需要那么多字。"

  "这是你写的。"

  "当然！"

  "不是。我是说——删之前的和删之后的。都是你写的。"

  材木座推了推眼镜。他听懂了。他把那份"最终稿"放在桌角，没有等任何人评价。走到门口的时候，转过头。

  "八幡。你说的'留下和被留下都是选项'——我后来想过了。不是选项。是同一个方向的不同走法。"

  他走了。走廊里回荡着剑道部常用的那种大步流星的脚步声，很快远了。

  三点。海老名推开门，三浦跟在后面。海老名手里抱着一本毕业相册，封面印着三年F班。三浦看着活动室的书架。一本一本看过去。

  "今天不是来委托。"海老名把相册放在桌上。"相册印好了。二月二十八号交的稿，前天拿到成品。全班三十七人。每个人交的照片都放进去了。一页一页翻——"

  "被裁出去的人。"结衣说。

  "没有。"海老名说。"一个都没有。有人交了照片，有人交了字。有人只交了一句话。有人在背面写——这张照片拍得很烂，但是那天是高中最快的一天，烂照片也能帮我想起。我把那句话也放了进去。"

  三浦在活动室里走了一圈。她停在值日表前面。那张纸已经很旧了，六个名字，用铅笔写的。上面三个是前辈的，下面三个是后辈的。

  "这个。"她指着拉芙的名字。"一年级的时候，这个名字后面写的是拼音。后来才换了汉字。"

  "你还记得。"

  "记得。"三浦说。"我当时想，连名字都写不好的人，为什么要来这所学校。现在我觉得——换名字的人，比别人更知道名字是什么意思。"

  她没有等回答。海老名把相册推给结衣。

  "这本是F班的。奉仕部不是F班的——但是这本相册的理由是奉仕部。最后一页，留了一行空白。你想写什么都可以。"

  她们走了。外走廊的高跟鞋声和海老名翻包找东西的声音混在一起，往楼梯口的方向去了。

  四点。叶山推开门的时候，八幡正在把最后一摞书放进纸箱。叶山站在门口，没有进来。

  "路过。学生会那边在收拾。"

  "学生会。"八幡说。"不是奉仕部的管辖范围。"

  "我知道。我不是来接管。"叶山看着活动室的茶柜。杯子已经收起来了，台面上只剩四只纸杯倒扣着。"一年级文化祭，三浦来委托。我说'不要想太多'。后来我发现——给不想想太多的人说'不要想太多'，只是在替自己省事。"

  "所以。"

  "所以我来告诉你一件事。不是道歉。是——谢谢。谢谢你们接住了我没接住的东西。"

  他没有等回答。他走了。走廊里的脚步声不紧不慢。脚步声的主人已经学会不用跑走的方式结束对话。

  四点半。一色推开了门。她穿着学生会的会服，手里拿着一个文件夹。

  "前辈们，收拾得怎么样了？"

  "快收完了。"结衣把茶柜的抹布拧干。

  "那就好。"一色翻开文件夹，又从口袋里掏出一枚印章——学生会正式受理章。她把印章在文件夹上按了一下，抬头：奉仕部活动终止确认书。下面六行字：主要活动、存续期间、部员名单、活动室返还状态、备品清单、引继先。她把文件夹推给雪乃。

  "这是最后一份文件。学生会的。签完，奉仕部正式移交。"

  雪乃接过文件夹。她一页一页看过。主要活动——从文化祭到毕业相册，六十二件委托。存续期间——二〇一三年五月至二〇一五年三月。备品清单——记录簿三册、水壶一只、茶柜一只、纸杯若干。杯子，个人所有，自行带走。

  "'引继先'。"她念出来。"这个栏你写了什么。"

  "新奉仕部。"一色说。"部员两名。中学部两名原部员编入。顾问，高坂理津子老师。申请日期——下周一。"

  "学生会受理。"

  "明天。"一色说。"明天毕业典礼。明天之后，学生会没有现三年生的部长。我是交接期间的临时负责人。这个章——"她指了指自己盖的那个印。"是学生会最后一个有三年生盖章的受理件。"

  "你留到最后了。"

  "不是留。"一色说。"是选了。选了做最后一件。"

  她把文件夹合上。没有鞠躬，没有说"谢谢前辈照顾"。她站在活动室正中间，看了一圈——没了茶柜、没了杯子、没了值日表、没了黑板上的粉笔路线图的活动室。一个普通的空房间。

  "好空了。"她说。

  "嗯。"八幡说。"空了。"

  一色走了。走廊里没有脚步声——学生会的人穿室内鞋走这条路两年多，已经学会怎么不吵人。

  五点半。六个人——四个前辈，小町，大志——站在活动室门口。所有的东西收进了纸箱。窗开着，三月的风灌进来。明天毕业典礼之后，这扇窗由别人来关。

  八幡把钥匙从钥匙圈上退下来。一把黄铜钥匙，磨得发亮。他把钥匙放在长桌正中。

  六个人排成一排，看着那把钥匙。没有人伸手去拿。明天才是交接日。今天的任务是清空。把过去两年多的痕迹清出来，给未来的人留下一个干净的、空着的、等着他们自己的东西填满的房间。
