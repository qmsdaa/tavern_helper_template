场景: 3
幕: "第一幕·入部磨合"
时间: "2013年5月20日 放学后"
地点: "奉仕部活动室（总武高中特别栋闲置教室）"
人物: "雪之下雪乃、平冢静、拉芙希妮·都柏林、比企谷八幡、由比滨结衣"
正文: |
  放学后的特别栋褪去了主教学楼那种令人烦躁的喧闹。雪乃坐在长桌靠窗的一端，文库本在桌面摊开，视线随着纸页上的铅字缓缓移动。旁边插着电源的热水壶发出低沉的嗡鸣，白色的水汽从壶嘴溢出，在半空中消散。这是奉仕部最常规的开局，直到活动室的木质拉门被一股不属于这里的力道粗暴地扯开。

  老旧的滑轨发出刺耳的摩擦声。平冢静穿着那身标志性的白大褂大步跨进室内，甚至没有低头看一眼门槛。跟在她身后的，是上午才转入J班的拉芙希妮·都柏林。

  雪乃的视线从书页上移开，手指习惯性地压平了书页的折角。那个转学生依然保持着早晨那种无可挑剔的整洁，浅金色的长发垂在深蓝色的校服外套上，右手腕那条烧焦的旧丝带在白大褂的背景下显得尤为扎眼。

  "听好了，雪之下。"平冢静走到长桌前，伸手拉开靠门位置的一张折叠椅，"从今天起，都柏林同学要在奉仕部进行为期一学期的'融入学校生活练习'。这算是我个人的强制委托。"

  "我拒绝。"雪乃的声音没有因为这份突如其来的强硬而产生任何波动，她平静地看着指导老师，"奉仕部的原则是协助委托人解决问题，同时也不接受这种毫无具体目标、仅凭教师个人意愿强加的'托管'行为。更何况，都柏林同学本人似乎也并不需要这种多余的关照。"

  她将目光转向站在一旁的拉芙希妮。那个高挑的少女并没有因为两人谈论她的去留而露出任何局促或辩解的神色，只是安静地站在那里，像是在等待一场与自己无关的判决。

  "少拿规章制度来压我。"平冢静毫不客气地拍了拍椅背，"这是生活指导老师的决定。她需要一个能让她学会怎么做普通高中生的地方，而这里刚好有几个同样不太'普通'的家伙。坐下吧，都柏林。"

  拉芙希妮微微颔首，动作控制得极好地拉开椅子坐下。她没有碰桌面，只是将双手交叠放在校服裙的膝盖上，视线垂向地面，在自己周围划出了一道无形的安全距离。雪乃微微蹙眉，她并不喜欢这种被强行塞入的责任，尤其是面对一个从头到脚都写着"拒绝靠近"的人，但她最终没有再继续反驳，只是伸手关掉了已经沸腾的热水壶。

  走廊里传来杂乱的脚步声。门再次被拉开，比企谷八幡拎着书包走了进来。他的视线扫过长桌，在触及坐在接待区的拉芙希妮时明显停顿了半秒。那种属于独行侠的敏锐雷达让他立刻察觉到了活动室里诡异的气压。

  "……平冢老师，如果你打算把这里改造成某种外宾接待室，至少应该提前通知我换一套稍微体面点的说辞。"八幡拖着步子走到长桌另一侧坐下，随手将书包扔在脚边，用一种干瘪的语气吐出一句缺乏起伏的抱怨。

  "小企你走得太快啦！"由比滨结衣的声音紧接着从门外传来。她探进半个身子，招牌式的粉色团子头随着动作晃动。当她的目光落在拉芙希妮身上时，眼睛立刻亮了起来。

  "诶？拉芙希妮同学！"结衣毫无芥蒂地跨进门，径直走到拉芙希妮旁边的位置，语气里带着那种天然的亲昵与高昂，"中午的时候我就想去J班找你打招呼了，结果你不在座位上。原来你加入了奉仕部吗？太好了！我是F班的由比滨结衣，叫我结衣就好啦！"

  面对这份突如其来的热烈，拉芙希妮交叠在膝盖上的手指微微收紧。她抬起头，看着结衣那张充满善意的脸，翡翠色的眼瞳里闪过一丝极难察觉的迟疑。

  "……你好，由比滨同学。"拉芙希妮的声音很轻，带着一贯的客气与疏离，但那份刻意维持的完美外壳在结衣毫不讲理的距离感面前，似乎出现了微小的裂缝，"如果不麻烦的话……请多指教。"

  雪乃看着这一幕，默默从旁边的柜子里拿出了三个茶杯。她并没有拿出第四个，只是动作缓慢地用热水烫洗着陶瓷杯壁。

  结衣想问拉芙希妮烧焦丝带的问题，被雪乃用眼神制止。雪乃对拉芙希妮还是有点警惕，但她还是递给了她一杯茶——用的是一次性纸杯。之后开始奉仕部的干瘪日常，原来三人互相刺痛又互相试探，拉芙希妮就在一遍暗暗观察着。
