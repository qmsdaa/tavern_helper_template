场景: 45
幕: "第三幕·二学期"
时间: "2013年11月17日 · 修学旅行第4天 · 归途"
地点: "京都站 → 东京站 → 千叶（新干线车厢内）"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
正文: |
  新干线车厢内，平稳的低频震动取代了京都石板路上的脚步声。靠窗的位置，拉芙希妮的双手在膝上无意识地交叉在了一起——左手拽住右侧深蓝色的校服袖口往下压了半寸，右手同时扣住了左侧袖口的边缘。两条丝带都被稳稳地藏在了布料底下。

  坐在斜对面的比企谷八幡将视线从窗外一闪而过的农田收回，目光恰好停留在那个微小却刻意的动作上。从早上在旅馆大堂办理退房开始，这个转学生就一直维持着一种隐蔽的防卫姿态。她的两只手几乎没有离开过袖口的范围，动作间带着一种生硬的紧绷感。

  像是在极力隐瞒某种超出常规的物理存在。

  八幡在喉咙里咽下了一口干瘪的叹息。按照他那套通过无数次自毁总结出来的社交法则，这种明显的违和感就像是雷区边缘的警告牌。结合前几天在二年宁坂发生的那场被强行打断的闹剧，直觉告诉他，麻烦的事看样子又多了一件。他果断地把视线重新投向窗外，将下巴缩进制服衣领里，决定把"不闻不问"贯彻到底。

  拉芙希妮敏锐地捕捉到了那道视线的撤离。

  她微不可察地放松了有些发酸的肩膀，但两只交叠在膝上的手并没有松开。布料之下，右手腕上粗糙的旧丝带与左手腕上柔滑的红缎带同时贴着皮肤，传递出一种沉甸甸的温度。她知道，只要稍微露出一点红色的边缘，由比滨那超常的共情雷达和八幡的死鱼眼就会立刻锁定。

  而如果他们顺势注意到坐在旁边的雪之下今天少了一根扎发辫的红缎带——那将是一场难以解释的逻辑灾难。

  "既然四个人都已经就位。"

  一个清冷的声音打断了车厢里微妙的静默，也切断了拉芙希妮的过度思虑。

  坐在八幡身边的雪之下雪乃从黑色的旅行袋里取出一本熟悉的笔记本，动作利落地在座椅间的小桌板上摊开。她今天罕见地没有用那对标志性的红缎带将两侧的垂发扎起，而是任由柔顺的黑色长直发随意披散在肩头。这个在旁人看来或许只是出于旅途疲惫的微小改变，却让拉芙希妮的视线在她那头披散的长发上停留了半秒。

  雪乃将别在胸口的黑色水笔拔下，深蓝色的眼眸扫过对面的两人，原本因为车厢暖风而略显松懈的空气瞬间被她那种绝对的规则感拉紧。

  "距离到达千叶还有一段时间。为了今后的工作成果，我建议，我们现在对这五天的事情做一个总结。"

  "诶——？现在就要总结吗？"

  坐在拉芙希妮旁边的由比滨结衣发出一声带着软糯鼻音的哀嚎。她刚刚从挎包里摸出一袋抹茶味的生巧，此刻正低着头拆包装——那个拆开小袋子的动作比平时慢了半拍，指腹在塑料封口上来来回回蹭了两次才找准撕开的位置。

  等她终于把包装袋撕开，才举着半开的袋口，求助似地看向雪乃。

  "明明车才刚开起来没多久，感觉京都的味道都还没散掉呢……小雪乃太严格了啦！"

  "很多细节过一阵时间再去回忆会被模糊，由比滨同学。如果在细节被日常的惰性覆盖前不进行复盘，很多重要的委托就失去了其成长的价值。"

  雪乃的声音依旧冷淡，甚至带着点惯常的逻辑说教。但在翻开笔记本内页的瞬间，她的目光极为隐晦地在拉芙希妮那两只交叠在膝上的手上掠过。

  随后，笔尖悬停在纸面上。

  "那么，第一个问题。"雪乃垂着眼睑，将视线固定在空白的横格纸上，语气公事公办，"比企谷同学，对于昨天你那种自以为是的将所有恶意揽到自己身上的行为，你现在有什么要说明的吗？"

  面对雪之下雪乃那冷硬且不留余地的质问，比企谷八幡的肩膀习惯性地塌了下去。他将视线从窗外收回，准备把那套关于"性价比最高"和"损害最小化"的生存歪理搬出来当作挡箭牌。

  然而，还没等他那干瘪的音节挤出喉咙，坐在斜对面的拉芙希妮开口了。

  "昨天在离开那条青石板路的时候，雪乃同学曾经问过我一个问题。"

  拉芙希妮没有去看雪乃那张冷淡的脸，而是将翡翠色的双眼直直地投向八幡。在平稳的车辆震动声中，她的话语像是在宣读某种不容更改的观测报告，"她问我，那种多余的打断，是为了你，还是为了我自己。"

  八幡原本堆在喉咙里的防守台词被这句毫无预兆的开场白直接卡住了。他只能用那双死鱼眼防备地盯着对面。由比滨结衣手里那袋刚刚打开的抹茶生巧也悬在了半空，显然被这突如其来的尖锐走向惊到了。

  "我现在的正式回答是——那完全是为了我自己。"拉芙希妮的两只手依旧维持着藏住袖口的姿势，但声音却清晰得没有半点杂音，"因为你那种迫不及待把自己打包成垃圾丢出去的做法，会让周围的空气变得非常难闻。我不想在好不容易能够顺畅呼吸的地方，再被迫忍受一次那种令人作呕的自我牺牲感。"

  八幡的喉咙里还有半个音节没有吐出来，被这句近似同感的直白按了回去。他张了张嘴，最终只发出一声长长的、泄气般的叹息。

  "啊，是吗。"八幡把头彻底偏向另一边的窗外，干巴巴地回击，"那还真是抱歉污染了你那边的空气质量。转学生的洁癖果然很麻烦。下次如果你觉得刺鼻请早点提醒，我尽量离通风口近一点。"

  虽然语气里全是嫌弃与吐槽，甚至连看都不想多看一眼，但他侧脸垂下的下颌线松弛下来了。

  坐在八幡旁边的雪乃将这一切尽收眼底。

  她握着黑色水笔的手指停在摊开的笔记本上方。她看了一眼八幡那张放弃抵抗的侧脸，视线随后平移，落在拉芙希妮那两只依然交叠在膝上、紧紧扣住彼此袖口的手上。视线又极短地跳到她自己肩头那缕披散的长发上，然后回到笔尖悬停的位置。

  在这个被拉芙希妮用"洁癖"强行封死退路的回合里，八幡那套令人火大的自爆逻辑竟然被处理得如此干净利落。

  雪乃的嘴唇微微动了一下。她原本可以抛出几句更为严苛的逻辑谬误来结束这场未经允许的插话，或者用她惯用的挑剔去警告拉芙希妮这种越界的判定。

  但最终，那些话只停留在喉咙深处，没有化作声音。

  她垂下眼帘，让那头罕见披散的长发遮挡住大半侧脸，手中的水笔在横格纸上划下一道克制的黑线，将所有的评价都封存在了无声之中。
