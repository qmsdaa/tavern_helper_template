场景: 2
幕: "第一幕·入部磨合"
时间: "2013年5月20日 第二节课间（上午）"
地点: "总武高中中庭 / 教学楼连廊"
人物: "雪之下雪乃、拉芙希妮·都柏林"
正文: |
  教员室的空气总是带着一股陈旧纸张与咖啡混合的沉闷味道，雪之下雪乃将新印好的奉仕部活动签到表夹进文件夹，沿着连廊走回教学楼。第二节课间的休息时间并不长，校园主干道上三三两两散布着去自动贩卖机或是闲聊的学生。

  她的视线越过几个打闹的男生，停留在中庭边缘的那棵樱花树下。五月的樱花早已落尽，只剩下繁茂的绿叶在微风中翻涌。拉芙希妮站在树冠的阴影里，浅金色的长发被叶隙漏下的阳光切割成细碎的光斑。

  她没有和班里的任何人在一起。作为转学生，在这个时间点脱离群体独自行动，往往意味着被孤立或是主动拒绝社交。雪乃在心里给对方的行为下了一个简单的判断，脚步却没有停顿，笔直地顺着石板路走了过去。

  距离拉近时，雪乃看清了对方手里的东西。那本早读时放在桌面上的英日对照诗集被翻开了一半，拉芙希妮的视线落在纸页上，整个人透出一种与周遭喧闹校园格格不入的静谧。那种安静并不让人觉得放松，反而带着某种绷紧的防备。

  "距离第三节课的预备铃还有三分钟。"雪乃在距离对方两步远的地方停下，声音平稳地穿过微风，"都柏林同学，如果对校园地形还不熟悉，建议你现在就开始往回走。"

  拉芙希妮翻书的动作停了下来。她慢慢抬起头，翡翠色的眼瞳里映出雪乃的身影。那条系着烧焦丝带的右手腕轻轻搭在书脊上，随着呼吸微微起伏。

  "'我们把心藏在文字里，因为世人太容易将它踩碎。'"拉芙希妮开口了，声音很轻，像是在念诵，又像是在陈述某种事实。

  雪乃的目光在对方那张精致且苍白的脸上停留了半秒。那是威廉·巴特勒·叶芝的句子，一个出身爱尔兰的诗人。在这个突兀的场合念出这句诗，显然夹杂着某些属于她个人的隐喻或经历。那双眼睛里藏着某种等待被解读的暗流，似乎在评估眼前的同桌是否具备跨过界线的资格。

  雪乃将手里的文件夹换到左手，指尖压在硬质塑料边缘。她听出了那句话里包裹的重量，但她并不打算在今天、在这个短暂的课间去过分关注一个陌生人的过去。

  "如果那是你阅读进度的总结，那是一句很好的诗。"雪乃的语气依旧保持着无可挑剔的礼貌，她转过身，将背影留给对方，"但在总武高的校园里，迟到会被记入考勤。请尽快回教室吧。"

  她没有去深究那句诗背后的意思，也没有回头确认拉芙希妮是否跟了上来。石板路上的脚步声平稳地向前延伸，直到几秒钟后，身后才传来极轻的、几乎被风声掩盖的脚步声，以一种不远不近的距离，跟随着她走向教学楼的入口。
