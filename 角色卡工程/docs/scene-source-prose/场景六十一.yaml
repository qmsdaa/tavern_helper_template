场景: 61
幕: "第三幕·二学期"
时间: "2013年12月24日 · 平安夜深夜 · 场景 60 之后 · 雪乃回到公寓"
地点: "雪之下雪乃的公寓客厅"
人物: "雪之下雪乃（POV 独占）"
POV: "雪之下雪乃独占（本项目雪乃 POV 独占的第二场·第一场为场景 47）"
正文: |
  随着防盗门发出一声沉闷的"咔哒"轻响，千叶市冬夜里刺骨的冷空气和车站喧嚣的余波，终于被彻底隔绝在了这扇门外。

  公寓里很安静，恒温系统运作时发出的微弱白噪音，配合着空气中残留的淡淡红茶香气，构成了雪之下雪乃十七年来最熟悉、也最能让她感到安全的气息。但今天，这种往日里只要吸入一口就能让大脑迅速冷却、恢复严密逻辑的空气，却似乎失去了原有的效力。

  她换下那件已经被冬风吹透的深蓝大衣，草草套上了一件宽松素净的居家服。这件平日里总是被穿得一丝不苟的衣服，此刻领口却微微有些凌乱。

  雪乃没有像往常结束社团活动后那样，直接走向书桌去翻阅没看完的文库本，或是去厨房熟练地烧水泡茶。她径直走到客厅中央，然后像是失去了支撑身体的力气一般，几乎是有些赌气地将自己摔进了那张柔软的沙发里。

  紧接着，她伸出双臂，一把将那个几乎有她半个身子大的、毛茸茸的黑白相间玩偶紧紧抱进了怀里。

  那是她绝对的私密慰藉——熊猫潘先生。

  "……太过分了。"

  她将自己那张依然泛着未褪尽红晕的脸颊深深埋进了潘先生柔软的腹部绒毛里，声音闷闷的，带着平时绝不会在任何人面前展露的懊恼与控诉。

  "潘先生，你评评理。作为转学生，难道不应该具备最起码的社交常识吗？在公共街道的盲道边缘，像个还没长大的小学生一样，故意用皮鞋去踢别人的脚后跟……这种行为，不管从哪个角度看，都缺乏教养吧？"

  她白皙的手指无意识地收紧，揪住了潘先生那只圆乎乎的黑耳朵，力道大得让玩偶原本憨态可掬的脸都微微有些变形。

  可即便是躲在这个绝对安全的堡垒里，脑海中浮现出那个金发少女在路灯下毫无防备地笑起来的样子时，她的胸腔里还是不可抑制地传来了一阵沉闷的悸动。

  "更过分的是……"雪乃的声音变得更小了，像是生怕被谁听见，"在萨莉亚餐厅的时候，居然、居然在桌底下偷偷按我的手。明明是在讨论那么严肃的社团责任问题，却用那种完全不讲理的肢体动作来打断我……这算是哪门子的逻辑辩论？"

  她越说语速越快，仿佛只要把这些"罪状"罗列得足够详细，就能重新建立起自己那套无坚不摧的防线。

  可是，控诉到了最后，所有的声音却都在那句轻轻的、带着温度的"明天见"面前，溃散成了一声长长的、带着无奈的叹息。

  "而且，我都已经用'约定'把这件事规范化了。她只需要点头答应就好，为什么还要用那种……那种连一层修饰词都不加的直白语气来说话？"雪乃松开了揪着玩偶耳朵的手，转而将双臂收得更紧，仿佛要从潘先生身上汲取更多的热量来对抗内心的慌乱。

  "这种完全不讲道理的越界行为，下次如果她再敢尝试，我一定会用最严厉的校规来处罚她。"

  她对着潘先生软绵绵的肚子下达了最后通牒。但这句话里，却再也找不到一丝平日里那种拒人于千里之外的锋利。

  在安静的公寓里，雪乃闭上眼睛。她知道，其实自己并没有真的在生气。那句明明很轻的"明天见"，此刻却像一颗投入深潭的小石子，在她胸腔里带起了她自己也无法否认的、鲜活的温度。

  为了强行掐断脑海里那些不断闪回的画面，她单手从身侧摸出了那部黑色潘先生手机壳的手机。

  按下电源键，荧蓝色的冷光在昏暗的客厅里亮起，勉强驱散了一点那种快要把人溺毙的暖意。雪乃漫无目的地滑动着屏幕，试图用机械的翻找动作来重启自己彻底宕机的逻辑中枢。手指在屏幕上微微停顿，通讯录界面停留在了最下方。

  那里静静地躺着一串没有备注姓名的十一位数字。

  这是在夏天筹备林间学校时，她以"部长需要进行紧急情况下的风险管控"为由，强行塞给对方自己号码后，出于对等的安全考量而留存的电子纽带。当时为了彰显这仅仅是"职务行为"，她刻意连名字都没有输入。

  可是此刻，对着这串生冷、机械的数字，雪乃却像被施了定身术一样发起了呆。

  明明只是没有任何装饰的默认字体，但在看了十几秒后，那串数字却仿佛变得比怀里的潘先生还要沉。

  雪乃的大拇指悬停在屏幕上方。

  "已经安全到家了吗？"

  太像过分操心的母亲了。

  "明天的值日表还在你书包里。"

  太生硬，而且根本没有值日这回事。

  "别忘了做周末的文言文作业。"

  ……这算什么，深夜的教导主任查岗吗？

  她烦躁地在心里将那些试图用"正当理由"包装起来的借口一一否决。她清楚地知道，自己根本不是想查问进度，也不是想确认考勤。她只是……只是那种不合常理地、想要在那句"明天见"之后，再稍微抓取一点切实存在的联系而已。

  雪乃闭上眼睛，狠狠地咬了一下下唇，点开了信息输入框。

  【到……家】

  光标在屏幕上闪烁着。她盯着这两个字，然后像是被火烫到一样，大拇指迅速而连续地按下退格键，把辛苦憋出来的字符全部清空。

  这种像初中生一样举着手机反复内耗的行为，实在太不符合"雪之下雪乃"的做派了。她感到一阵深刻的自我厌弃，准备干脆利落地锁上屏幕，强迫自己去洗漱。

  然而，就在她的拇指刚刚移向电源键的瞬间。

  原本一片空白的屏幕顶部，突然弹出了一个新信息的悬浮窗。

  发件人显示的是那串没有备注的号码。而就在刚才，那个惹人火大的字眼，毫无预兆地闯进了她的视线。

  【睡了吗，雪乃同学？】

  那四个字在视网膜上炸开的瞬间，直接让雪乃的思考按下了暂停键。

  "雪乃同学"。

  她那个原本悬停在屏幕上方、正准备按下电源键的大拇指，因为这种不可理喻的突发状况而产生了一次不协调的肌肉痉挛。手里原本就有些分量的旧款智能手机瞬间失去了支撑，在重力的作用下，不偏不倚地、重重地砸在了她的鼻梁上。

  "唔——！"

  一声带着痛呼和委屈的闷哼从喉咙里溢了出来。雪乃猛地闭上眼睛，眼泪几乎是条件反射般地涌上了眼眶。她一把抓开那块惹祸的金属和玻璃混合物，双手捂住遭遇重创的鼻子，一头扎进了旁边潘先生那个毫无防备的大肚皮里。

  太丢脸了。

  鼻梁上残留的钝痛不断提醒着她刚才那滑稽的一幕。仅仅是因为一个缺少敬语的称呼，就让她失去了作为总武高优等生最基本的肢体协调能力。如果在拉面馆或者活动室里发生这种事，比企谷八幡那个家伙绝对会用世界上最恶毒的词汇嘲笑她一整年。

  把脸埋在绒毛里深深地吸了好几口带着洗衣液香味的空气后，雪乃终于稍微找回了一点理智的碎片。

  她猛地抬起头，一把将潘先生推开，从沙发上坐直了身体。她伸手拿过那部刚才还被当成暗器的手机，动作生硬得像是在拿什么随时会爆炸的危险品。

  不能秒回。

  这是她脑海里浮现出的第一条最高指示。如果现在立刻回复，那简直就是在向对方大声宣告："我刚才不仅一直盯着屏幕在等你的消息，而且还被你那句没大没小的称呼吓得手机砸脸！"

  她绝对不能容忍这种处于绝对劣势的局面发生。

  雪乃瞥了一眼屏幕右上角的时间：21:00。

  她在心里迅速拟定了一个战术：必须等待一个合理的、能够彰显自己对这条信息毫不关心的"冷却期"。五分钟，这个时间长度刚好足够她营造出一种"我刚才在忙别的事情，碰巧现在才看到手机"的假象。

  于是，这位奉仕部部长开始了她人生中最漫长的五分钟倒计时。

  21:01。她端正了坐姿，像是要出席什么严肃的听证会。
  21:02。她用食指轻轻敲击着沙发的扶手，试图维持那份并不存在的从容。
  21:03。她拿起那本文库本，装模作样地翻开了一页，却发现自己一个字都看不进去。
  21:04。敲击扶手的频率开始明显加快，她不得不按住自己的手腕来阻止这种泄露焦躁的行径。

  当右上角的数字终于跳动到21:05的那一刻，她几乎是迫不及待地点开了那个没有备注的对话框。

  没有多余的寒暄，没有理智的说教，甚至连标点符号都省去了。她的手指在虚拟键盘上飞快地敲击了一下。

  【没】

  点击，发送。

  雪乃将手机反扣在沙发垫上，微微扬起了下巴，像是一个刚刚在法庭上用无可辩驳的证据驳倒了对方律师的胜利者。她笃定，面对这样一个只有一个字的回复，即使是那个惯于用笑容伪装自己的留学生，此刻也应该知难而退了。

  然而，那份属于胜利者的、居高临下的从容，连三秒钟都没能维持住。

  被反扣在沙发垫上的手机，发出一声短促而沉闷的"嗡"响。

  雪乃那原本微微扬起的下巴瞬间僵住了。那声震动在恒温系统安静运转的客厅里显得尤为突兀，像是某种极具嘲讽意味的叹词。

  秒回。

  这根本不符合常理。就算对方正握着手机，在收到她那足以掐断所有话题的"没"字之后，正常的反应也该是知难而退，或者至少需要消化一下这份冷淡。怎么可能在眨眼间就给出回应？这种近乎预判了她所有反应的速度，让雪乃刚才还挺得笔直的脊背，不自觉地崩紧了一个防备的弧度。

  她深吸了一口气，告诉自己这只是一种粗劣的巧合。用食指和拇指捏住那块金属边缘，她极不情愿地将手机翻转了过来。

  荧蓝色的屏幕光再度亮起，新信息的悬浮窗占据了视野。

  那不是一个为了敷衍而凑出来的短句，而是一整段字数颇多、连标点符号都排列得整整齐齐的文字。光是看到那个文本量，雪乃就不受控制地产生了一种想要把手机顺着窗户扔出去的冲动。

  【这么晚打扰到你真的很抱歉。另外，如果不麻烦的话，作为朋友还是想善意地提醒一下雪乃同学：像LINE这类的现代即时通讯软件，只要点开对话框，哪怕不回复，对方那边也会立刻显示"已读"的哦。晚安。】
