场景: 75
幕: "第四幕·冬假→三学期"
时间: "2014年2月1日 · 周六 · 三学期"
地点: "千叶Sogo地下一层 → 总武高中 · 家政教室"
人物: "拉芙希妮·都柏林、由比滨结衣"
正文: |
  千叶Sogo地下一层的中央促销区，视线所及之处全被高饱和度的粉色和正红色包装纸淹没。

  拉芙希妮站在一排展示着"法式调温巧克力碎"的货架前，目光落在包装袋背面的营养成分表上。她的视线在可可脂含量和乳化剂成分之间来回扫视，像在评估一份关于南美某橡胶园并购案的风险报告。

  "拉芙希妮酱！看这个看这个！"

  由比滨结衣的声音穿透了商场里循环播放的轻快背景音乐。她抱着一个已经快要装满的购物篮小跑过来，篮子里罐子互相碰撞发出叮叮当当的声响，在一排巧克力货架前急刹车，差点撞上拉芙希妮的肩膀。

  拉芙希妮将视线从那袋巧克力碎上移开。

  结衣的购物篮里呈现出具有毁灭倾向的多样性：两盒写着"零失败初学者适用"的免调温巧克力块，五六罐颜色鲜艳且可疑的星空糖霜，一大包看起来像用来做建筑粘合剂的棉花糖，以及几个形状扭曲的硅胶模具——其中一个勉强能辨认出是狗的形状。

  拉芙希妮看着那些材料，脑海中自动演算出它们如果在结衣的厨房里相遇，将会引发何等惨烈的化学反应和物理坍塌。

  "这款'奇迹的彩虹糖霜'，据说只要撒上去，就能让最普通的巧克力也闪闪发光哦！"结衣举着一个装满蓝色和紫色颗粒的小塑料罐，眼睛里闪烁着期待的光芒。

  "结衣。"拉芙希妮的声音平静得像一杯放凉的白开水，"如果要让那罐糖霜里的食用色素C和亮蓝淀粉在常温下不发生凝结，你需要将厨房的相对湿度控制在百分之四十五以下。并且，我不认为这种颜色的覆盖物，能让比企谷同学那本就脆弱的肠胃产生任何积极的食欲。"

  结衣高举着糖霜的手在半空中僵住了。

  "呜……小企的肠胃确实不太好……"她小声嘟囔着，然后挫败地把那罐闪闪发光的糖霜放回了货架的角落，"但是，如果只做那种黑乎乎的普通巧克力，感觉好单调啊。"

  "巧克力的本质是可可脂的晶体结构重组。只要温度控制得当，它自身的光泽就足够了。"拉芙希妮伸手从货架上拿下两袋刚才看好的高可可脂黑巧克力粒，放进结衣那个充满灾难气息的购物篮里，顺便将那包像建筑粘合剂一样的棉花糖拿了出来。

  "把超过三种不同甜度指向的材料混合，最后只能得到一场味觉上的泥石流。"拉芙希妮把棉花糖放回原位，"如果你不想今年再次收获一块碳化或者无法咀嚼的暗物质，建议你先从最基础的融化和注模开始。"

  "欸嘿嘿……拉芙希妮酱连这个都懂啊。"结衣抓了抓自己的团子头，不仅没有因为被全盘否定而沮丧，反而像是松了一大口气，"其实我昨天在家里看着网上的教程，脑子已经完全变成浆糊了。所以今天才硬把你拉出来的。小雪乃这段时间又不知道在忙什么，总是不在状态的样子。"

  听到那个名字，拉芙希妮的手指在购物篮边缘停了半拍。

  她想起几天前，在特别栋那个漏风的闲置教室里，某位部长大人因为日记本暴露而拼命想要用"客观问卷"来掩饰局促的样子。从那天起，雪乃在部室里的视线只要稍微和她对上，就会立刻移向那把不锈钢热水壶，好像那个水壶需要被时时刻刻盯梢一样。

  "大概是因为，她在试图消化一些'擦不掉的'事物吧。"拉芙希妮拿起一个方正、没有任何多余花纹的正方体硅胶模具。

  "擦不掉的？"结衣歪了歪头。

  "没什么。"拉芙希妮将那个方正的模具丢进结衣的篮子里，顺手又拿了一小罐价格高昂的宇治特级抹茶粉。

  "哇，这个抹茶粉好贵！"结衣凑过来看了一眼标价签。

  "对于那种对生活规律和甜度配比有着偏执要求的人来说，这种微苦的口感，或许能稍微中和一下她最近过于紧绷的神经。"拉芙希妮没有解释那个"她"是谁，只是自顾自地把抹茶粉放在了那堆黑巧克力旁边。

  结衣看着篮子里的搭配，突然开心地笑了起来。

  "拉芙希妮酱，其实你很喜欢小雪乃吧？"

  拉芙希妮伸向另一盒坚果的手停顿在半空。她转过头，看着结衣那张没有试探、只有纯粹开心的脸。

  "这种没有数据支撑的推论，如果雪乃同学知道的话，你肯定会被说教一下午的。"拉芙希妮收回手，用克制的语调回答。

  "可是，拉芙希妮酱现在买的东西，完全就是按照小雪乃的喜好在挑啊。"结衣抱着购物篮，身体往拉芙希妮身边凑了凑，"你看，这个方方正正的模具，还有这个不加糖的抹茶。虽然嘴上总是在互相挑刺，但拉芙希妮酱其实一直在看着她呢。"

  这种完全不经过大脑皮层过滤的直觉型打击，让拉芙希妮准备好的那些关于"营养学"和"口味中和理论"的辩词瞬间卡在了喉咙里。

  她没有回答，只是把手插进大衣的口袋里。指尖下意识地触到了右手腕袖口下那条烧焦旧丝带的微弱凸起感。

  "如果这些买完了，就去结账吧。"拉芙希妮转开视线，看着不远处排起长队的收银台，"否则，你可能需要用整个下午的时间来思考为排队这件事赋予浪漫意义。"

  "啊！对哦，前面人好多了！"

  结衣惊呼了一声，左手紧紧抱住购物篮，右手自然地挽住了拉芙希妮的手臂，拉着她朝队伍的方向小跑过去。

  由于步伐的突然加快，拉芙希妮在大衣下的身体出现了一瞬间的僵硬。

  那种透过厚实的冬装布料传递过来的温度，带着完全不讲道理的亲昵和拉扯力。这是在都柏林的庄园里不被允许的、缺乏礼仪和距离感的动作。

  但她没有甩开。

  她的脚步只是顺从地跟着结衣的节奏，混入了那些正在讨论着可可粉比例、包装纸颜色和心动告白的吵闹人群中。

  在那个满是监视和汇报的寒假里，她曾向爱布拉娜撒谎，将这里称为"低成本的无意义消遣"。

  但在这个满眼都是高饱和度粉色的周末下午，在这条需要排队结账的冗长队伍里，拉芙希妮感受着手臂上结衣传来的重量。

  她突然觉得，这种毫无效率的、充满糖分和笨拙心意的"无意义"，大概就是她能找到的，最沉重也最真实的锚点了。

  她看着结衣把那些黑巧克力和抹茶粉一件件摆上收银台的传送带，嘴角终于不再是那种训练有素的弧度。

  那是一个微小的、真实的浅笑。

  ——

  总武高中的家政教室里，空气中漂浮着粘稠的、由可可脂和砂糖混合而成的温热香气。

  拉芙希妮站在不锈钢操作台前，手里拿着一把耐热硅胶刮刀。她的目光紧紧盯着大理石台面上的黑褐色液体，刮刀在台面上快速而稳定地抹平、收拢。动作没有任何多余的停顿，像是在进行精密的外科手术。

  "拉芙希妮酱……那个，温度计刚才好像降到二十八度了……"由比滨结衣站在两步开外的地方，双手紧张地绞在一起，声音轻得像是怕惊碎了锅里的什么东西。

  "正好。"拉芙希妮没有抬头，刮刀将台面上的巧克力糊利落地刮回不锈钢盆中，然后迅速移到一旁准备好的温水盆上方，"现在再把它升温到三十二度。可可脂的结晶需要经历这个过程，才能在凝固后产生脆裂的声音和光泽。"

  结衣在一旁屏住呼吸，连大气都不敢喘。

  在这之前的两个小时里，这间因为周末而显得格外空旷的家政教室，经历了一系列险象环生的尝试。如果不是拉芙希妮在关键时刻果断夺下了结衣试图倒进锅里的半瓶香草精，今天那袋昂贵的法式巧克力碎很可能又要走上碳化或者胶质化的不归路。

  "好了。"拉芙希妮将刮刀放下，拿起早就准备好的硅胶模具，"可以注模了。"

  结衣小心翼翼地凑过来，看着那些散发着完美丝缎光泽的液体被均匀地填入一个个方正和小熊形状的模具中。

  三十分钟后。

  当拉芙希妮戴着一次性手套，将最后一块带着完美倒角的黑巧克力从硅胶模具里轻轻叩出来，并放在铺着油纸的托盘上时，结衣猛地扑倒在操作台前，手肘撞在不锈钢台面上发出一声闷响。她完全没在意。

  "成……成功了！"

  结衣猛地扑倒在操作台前，眼睛睁得大大的，死死地盯着托盘上的成品。

  那些巧克力表面平滑得甚至能倒映出天花板上的日光灯管，边缘没有任何气泡和缺损。如果闭上眼睛，根本无法将这些精致的方块和结衣以前做出的那些被比企谷八幡称为"暗物质"的焦炭联系在一起。

  "好厉害！太厉害了！"结衣转过头，双手在胸前握紧，"拉芙希妮酱，你简直是天才！明明平冢老师借钥匙给我的时候，还嘱咐我一定要记得准备好灭火器……你居然连固定都做得这么完美！"

  拉芙希妮摘下塑料手套，扔进一旁的垃圾桶里，走到水槽边打开水龙头冲洗手指。

  "这不是魔法。只是热力学和结晶物理的最基础应用。"拉芙希妮的声音伴随着水声，听起来有种干燥的平静，"只要不向里面随意添加超出饱和度的水分或外来物质，它就会顺从地呈现出该有的样子。"

  她看着水槽里旋转的水流。

  以前，在伦敦那座巨大而阴冷的庄园里，每当家里的大人们要求她去上那些关于"如何优雅地使用三套不同尺寸的餐具"的礼仪课时，她总是会想办法溜进厨房的后角。在一大堆面粉和黄油中间，看着液体如何在温度的掌控下变成固体，是她当时唯一能感觉到"可以由自己决定结果"的瞬间。

  这种逃避训练得来的副产品，没想到会在这里派上用场。

  "可是不管怎么说，真的很厉害啊。我连看教程都看不懂……"结衣拿出一个纸杯蛋糕的包装盒，小心翼翼地捏起一块方块巧克力放进去。

  拉芙希妮关掉水龙头，扯过一张纸巾擦干手。

  当她转过身时，却发现操作台前的气氛突然变了。

  结衣拿着夹子的手悬在半空。刚才那种大功告成的兴奋感像潮水一样褪去，取而代之的，是肉眼可见的、缓慢蔓延开来的僵硬。

  桌子上摆着两组包装盒。一组是简单的透明塑料袋配着普通的金色扎丝；另一组则是非常精致的、带有粉色丝带和内置隔层的纸盒。

  拉芙希妮靠在水槽的边缘，没有说话，只是静静地看着结衣像被施了定身咒一样站在那里。

  结衣的目光在那些完美的巧克力块和那两组不同规格的包装之间来回游移。

  "那个……"结衣小声嘀咕着，声音听起来像是从喉咙深处挤出来的，"如果是义理的话……用这种透明的袋子装个三块应该就够了吧？"

  她的夹子夹起一块巧克力，悬在那个透明的塑料袋上方，却迟迟没有落下去。

  "可是……这次做得这么好。如果只给小企这种随便的包装，他肯定会用那种死鱼眼看着我说'反正这也是顺便做多的残次品吧'这种气人的话……"

  结衣的肩膀塌了下去，夹子又移到了那个精致的粉色纸盒上方。

  "但是！如果用这个盒子装！是不是太明显了！"结衣突然拔高了音量，像是在和某个看不见的敌人辩论，"虽然说上面写着'友谊长存'……但是小企那个人肯定会想很多奇怪的事情吧！万一他觉得这是在给他压力怎么办……"

  拉芙希妮看着那块在夹子上微微发抖的巧克力，觉得结衣现在的样子，就像是一只面对着两根萝卜，却在计算哪根萝卜会引发雪崩的兔子。

  "还有小雪乃……"结衣的声音又低了下去，"小雪乃那份，我特意放了你挑的抹茶粉。如果我给小企的包装比小雪乃的还要好，小雪乃虽然嘴上不说，肯定会用那种冷冰冰的眼神盯着我看的。"

  结衣把夹子放下，双手捂住自己的脸，发出了一声哀嚎的长叹。

  "呜哇……怎么办啊。明明做坏的时候只用担心会不会毒死人，现在做好了，反而不知道该怎么办了……"

  拉芙希妮走到操作台前，拿过台面上的一个透明玻璃杯，倒了半杯温水，轻轻推到结衣的手边。

  水杯在不锈钢台面上发出一声轻微的磕碰声。

  结衣抬起头，从指缝里露出一双可怜巴巴的琥珀色眼睛。

  "在面临无法穷尽所有可能性的多重博弈时，放弃选择通常是人类大脑自我保护的第一反应。"拉芙希妮看着桌上那些等待被赋予意义的巧克力，"如果你真的无法界定'义理'和'本命'的界限，为什么不把它们全部装进相同的盒子里。"

  "诶？"结衣愣了一下。

  "如果你不愿意用包装来区分重量，那就让收到的人自己去尝。"拉芙希妮指了指那两批不同口味的成品，"抹茶的苦味，和纯黑巧克力的醇厚。至于他们尝到了什么，那是他们自己需要思考的问题。"

  结衣看着桌上的杯子，又看了看拉芙希妮那张没有太多表情的脸。

  过了好一会儿，结衣猛地放下手，拿起玻璃杯咕咚咕咚喝了一大口水。

  "拉芙希妮酱，有时候你说的话，和小雪乃真的很像呢。"结衣放下杯子，长长地呼出一口气，脸颊因为刚才的纠结还带着一点微红，"不过，小雪乃肯定会加上一句'这是你自己的愚蠢导致的困境'。"

  拉芙希妮的嘴角牵动了一下。

  结衣重新拿起夹子。这一次，她没有再去碰那堆代表着"退避"的透明塑料袋。

  她把那些带有粉色丝带的精致纸盒全都拉到了面前。

  "也是啊。反正我都做得这么好看了，为什么还要藏起来呢。"结衣一边小心翼翼地把巧克力排进盒子里，一边小声碎碎念，"大不了小企那个笨蛋如果敢说多余的话，我就真的把灭火器砸到他头上。"

  拉芙希妮没有再多说什么。

  她转过身，开始收拾水槽里那些沾满了可可脂的工具。

  窗外，千叶市冬日的阴冷风声刮过特别栋的玻璃。而在这个弥漫着甜腻气味的家政教室里，关于情人节的、更加隐秘而具体的齿轮，已经开始转动了。
