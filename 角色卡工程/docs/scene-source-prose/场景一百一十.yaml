场景: 110
幕: "第七幕·重新为奉仕部命名"
时间: "2014年5月8日 · 周四上午至放学前"
地点: "总武高体育馆前厅／入口登记区 → 特别栋一层候场走廊与男女分流口 → 体育馆器材收拢处"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林、比企谷小町、川崎大志、一色彩羽、折本香织、高坂理津子、总武高与京王高中师生"
POV: "共享场景／零POV"
正文: |
  第一辆校车在体育馆外停稳时，前厅的广播刚好念到第三遍注意事项。

  鞋底声从门口一直叠到折叠桌前。总武高的学生会志愿者站在两张桌子后面，看见深色西装便递左边的纸，看见京王高的制服便从右边抽一份。刚下车的学生顺着前面的人往里走，两列队伍在入口处挤成一列，领到纸的人又逆着人流找自己的学校。

  “总武高从左侧进入，京王高中请往——”

  广播里的句子被桌脚拖过地板的声音盖住了一半。

  雪乃拿开压在登记表上的透明文件夹。

  “入口只确认到场。两校表格分开放，不要在这里补其他栏目。”

  “可是刚才领到京王表的人已经往总武那边走了。”志愿者说。

  “先请他回来。后面暂停发纸。”

  结衣抱着一叠候场号码从桌边侧身穿过，差点被迎面而来的学生撞掉最上面几张。她用下巴压住纸角，朝通道尽头喊了一声。

  “小町！男生区还差一叠号码牌！”

  “小町现在过去——”

  声音从人群后面传来。小町抱着胶带和备用夹板钻出队伍，把号码递给大志，自己又被一名拿着表格的京王学生拦住。

  “请问，特别栋受付是在那边吗？”

  对方指着挂在篮球架旁的纸牌。上面印着“总武受付／京王受付”，下面一行小字写着“特别栋分流”。

  “从这边出去，沿连廊——”小町说到一半，回头看了一眼，“那个，你刚才是不是也问过一次？”

  学生把手里的表格翻到正面。

  “我走到那里了。那边的人又让我回来登记。”

  门口又进来一批人。他随着队伍往旁边让开，站回同一块纸牌前。

  折本正替京王的联络教师清点公开说明页。她从纸牌看到连廊，又看回上面的字。

  “‘特别栋’是你们学校的楼名吧？第一次来的人不知道在哪儿。还有这个受付，到底是先签到，还是签完以后去的地方？”

  “两种都有。”一色把一张倒放的桌牌转正，“这里先共同登记，后面再分学校。”

  “那两边都写受付，还是会走回来吧。”

  一色低头看着桌牌。入口外的校车门再次打开，带队教师已经在催下一班下车。

  “小町先送号码。”雪乃说，“这块牌暂时撤掉。”

  “等一下。”小町把备用夹板翻到背面，拔开细头笔，在空白处写下“还没登记”和“已经登记”。字挤在一起，她举远看了一遍，又划掉重写，“雪乃姐，能不能先挂这个？楼名放下面，走近再看。”

  雪乃接过夹板，从门口的方向看了一次。

  男生候场区忽然有人喊了一个名字。

  那声叫喊越过半条走廊。队伍里几个人一齐转头，有人拖长声音“哦”了一下。靠墙的一名学生仍低头折着号码纸。负责叫人的志愿者又喊了一次。

  大志把号码牌塞给旁边的学生，快步走向八幡。

  “比企谷学长。”

  八幡正蹲在登记桌侧面，拿直尺把一张空白纸划成两栏。

  “先说发生了什么，别说名字。”

  “那边叫人出去单独确认。”大志压低声音，“没说是什么事。可是名字一喊，大家就知道他和别人不一样了。他现在不肯动。”

  八幡的笔沿着直尺停住。

  “号码呢？”

  “手里有。也可以让老师走过去找他。”

  “去告诉那个志愿者，先别叫第三次。”

  大志转身跑回去。八幡在两栏上方分别写下“到场”和“材料”，把纸推到一色手边。

  “入口留编号和到场。其他纸装封套，交给学校指定的人。队伍里只叫号码。”

  “前辈，现场改表格可不是拿尺子划两道线。”一色说。

  “所以我只负责划线。”

  “真会挑便宜的部分。”

  咨询台旁边，一名学生捏着表格边缘站了很久。后面的人问能不能先过去，对方立刻让开，却没有离开桌边。

  结衣放下号码纸。

  “是路线不清楚，还是想去安静一点的地方等？”她把声音放低，先指通道，再指向靠墙的空椅，“如果都不是，我也可以叫老师或者医务人员过来。你不用在这里说原因。”

  学生没有开口，只朝最近那名教师指了一下。

  “好。你先跟我到那边。”

  结衣举手示意，陪着学生沿墙边离开。她经过男生候场区时，大志已经拦住那名志愿者，指着学生手里的号码。志愿者看看名单，又看看仍站在原处的人，捏着纸没有动。

  高坂从分流口走过来。

  “名单交还带队教师。”她伸出手，“需要单独确认，由教师或医务人员过去。学生志愿者只报号码。”

  带队教师接过合起的名单，往队伍后方走。大志退回编号桌，把刚才空出的那叠号码重新放齐。

  另一边，小町还举着翻面的夹板。

  “先用这个。”雪乃说，“‘已经登记’下面加一支向右的箭头。”

  “这个可以有。”折本从京王队伍末端走回来，“从门口能看懂。原来那张对我们来说全是你们学校的暗号。”

  拉芙希妮从一色的文件袋里取出粗记号笔，把小町重写的字描粗，又将箭头涂到隔着人肩也不会被遮住的宽度。

  “楼名放在箭头后面。”她说，“先写做什么，再写去哪里。”

  小町把胶带撕成四段。雪乃接住夹板上缘，两个人把它挂到原纸牌的位置。那名第二次停下的学生抬头看了看，转向“还没登记”的桌子。这次径直排到了队尾。

  “入口标识不清，九点二十二分，体育馆前厅。”拉芙希妮在公开流程表上写完，合上笔帽。

  她翻到上一页，又拔开笔帽。

  其中一行在候场编号后面多写了几个字。拉芙希妮用直尺压住那一行，将多出的内容涂去，只留下编号、时间、地点和处理环节。纸面上多了一道黑线。

  “谁写的？”雪乃问。

  “学生会的临时记录员。”一色说。

  她抽走桌上那块写着“共同登记”的牌子，反扣在文件袋上。

  “这次算学生会的。我们把共同登记当成了一张表管到底，连现场记录也照着做了。”

  “一色同学，现在需要调整人员。”雪乃说。

  “我知道。”

  一色把挂在胸前的人员表翻到背面，叫住两名学生会成员。

  “入口桌只留到场表和号码。你去拿不透明封套，直接送到两校负责老师手里；你把咨询台往走廊里挪，别跟登记桌排成一列。旧牌都收起来。”

  “京王那边要重新说明吗？”志愿者问。

  “我去。”

  “总武的负责老师——”

  “也归我。”一色抱起反扣的牌子，“自己做错的统一表，总不能让奉仕部替我挨个解释吧。”

  她先拦住高坂，把八幡画的两栏递过去。

  “高坂老师，公开桌改成只确认到场。其他材料装封套，由两校各自接收。刚才是我漏了权限区别。”

  “可以。”高坂看完，把纸还给她，“封套只写候场编号和交接时间。各校的保管要求，让负责教师自己确认。”

  一色点头，又往体育馆内走。她刚对总武负责人开了个头，广播便响起第二批学生即将入场的提示。她闭上嘴等完那一段，从第一句重新说起。

  八幡把直尺递给拉芙希妮。

  “公开记录也分栏。左边写故障，右边写处理到哪一步。别写人。”

  “字数限制呢？”

  “能让下一个人看懂就行。”

  “很像对你本人提出的长期要求。”雪乃说。

  “部长在现场还有余力攻击成员，看来情况没想象中严重。”

  雪乃把一摞新号码交给大志。

  “男生区由你补发。再有需要单独联络的，直接找附近教师。”

  “明白。”

  “小町，入口走线再走一遍。”

  “这次小町从校车那边开始。”

  “由比滨同学回来以后，请她继续留在咨询台。咨询和登记分开。”

  结衣正好从走廊另一头回来，手里没有带回那张表。

  “老师已经接到了。接下来我在这边，对吧？”

  雪乃点头，把咨询台的箭头转向靠墙一侧。折本帮忙抬起桌脚，让一色派来的志愿者把桌子挪出入口直线。

  第二批学生从门口进来。

  最前面的人从“还没登记”的夹板下取了号码，报出班级后继续向前。装着材料的封套从桌面另一端递出，被带队教师直接收进带盖文件箱。男生候场区的志愿者举起号码牌，喊出的只有两位数字。

  小町从校车停靠处一路走回来，在箭头下面重新按紧一角翘起的胶带。大志把叫过的号码翻到背面，下一张仍朝着队伍。结衣陪一名找不到等候处的学生走到分流口，回来时顺手把咨询台前歪掉的线贴直。

  粗记号笔在几张手里来回传，最后落在折本的公开观察表旁。

  下午最后一张交接单被教师带走时，体育馆里的折叠桌已经开始收拢。桌腿扣进卡槽，连续响了几声。学生会的人推来器材车，把撤下的旧桌牌一起放进最下层。

  一色蹲在车边清点物品。

  “少一支粗记号笔。谁拿走了，今晚学生会就用委员会经费通缉谁。”

  “用经费之前先确认通缉属于学生会权限。”八幡说。

  “那就从前辈的活动补助里扣。”

  “刚成立的社团为什么已经有可扣项目了。”

  “找到了。”折本从自己的夹板下面抽出笔，走到八幡面前，“刚才写观察表的时候压住了。”

  她把笔放到器材车上，又把公开流程表递给一色。海滨综合的观察人员已经和京王联络教师走到门外，折本却仍站在原地。

  “小企。”

  八幡刚把折叠椅推上器材车。

  “等一下有空吗？”

  广播在体育馆上方响起来。器材车的前轮越过门槛，盖住了八幡还没出口的声音。
