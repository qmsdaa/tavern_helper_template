场景: 37
幕: "第三幕·二学期"
时间: "2013年10月末 · 文化祭后第一个周一 · 放学后"
地点: "奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
正文: |
  智能手机的按键音在这间闲置教室里显得大得惊人。由比滨结衣坐在靠窗的位置，大拇指飞快地在屏幕上按动着。她甚至没有去管团子头侧边掉下来的一缕头发，只是拼命地回复着那些来自现充群组的消息，试图用这种机械的社交补偿，去缝合上周五因为她的站队而摇摇欲坠的表面和平。

  比企谷八幡坐在她的侧斜方，把背驼得极低。他没有看那部正在震动的手机，也没有看长桌的任何一端，只是盯着木桌面上一道不起眼的划痕。那种关于车祸旧事的、试图用伤害自己来排除他人愧疚的偏执控制，再次被他当成了理所当然的解法抛了出来。而这个单方面的选择，直接把这间教室里好不容易积攒起来的那一点信任感，砸得连渣都不剩。

  沸水冲入瓷杯的声响短暂地盖过了按键音。

  雪之下雪乃站在长桌靠热水壶的一端，将热水分装。白色的水汽升腾起来，她没有去看对面的八幡，但她将属于他的那杯无糖红茶推过去的动作，比平时生硬了不止一星半点。瓷杯底座在桌面上擦出一声极短的刺耳声响。

  她松开了杯柄。

  "比企谷同学，你似乎有一种错觉。"她的声音里没有任何温度，"认为只要把自己放在最底端，就可以理所当然地替别人决定那些过去该有多重——"

  没等这句话的尾音落下，活动室的拉门发出沉闷的滑动声。

  这突如其来的声响硬生生地切断了那股原本已经满溢出来的低气压。由比滨的按键动作停住了，八幡也将原本盯着划痕的视线稍微抬起了一点。

  拉芙希妮·都柏林站在门后。她今天到得最晚。浅金色的长发没有像往常那样梳理得一丝不苟，发顶有几处明显的毛糙，看起来像是刚在教员室被平冢静因为糟糕的国语成绩留下来狠狠教训了一顿，并毫不客气地揉搓过。

  带着这份略显狼狈的毛糙感，她关上拉门。她没有走到那个平时靠近雪乃的位置坐下，而是径直穿过了长桌两侧那片近乎凝固的防线，直接走向了热水壶旁边。

  在一片死寂中，拉芙希妮将一把黑色的长柄伞横放在了雪乃手边的空桌面上。

  "伞。"她习惯性地在开口前停顿了一拍，声音平稳得没有带上这个房间里任何一点焦躁的附着物，"如果没有它，周五晚上的雨大概会是个麻烦。谢谢。"

  这把黑色的长柄伞，以及这句话，像是一块毫无预兆砸下来的实心木板，将那三人之间岌岌可危的闭环平衡，强行敲开了一道明晃晃的裂缝。
