场景: 4
幕: "第一幕·入部磨合"
时间: "2013年5月21日 放学后"
地点: "奉仕部活动室"
人物: "雪之下雪乃、拉芙希妮·都柏林、比企谷八幡、由比滨结衣、材木座义辉"
正文: |
  活动室的拉门再次被一股不属于常人的力道扯开。伴随着一阵沉重的脚步声和一声刻意压低的"嘎啊——"，材木座义辉披着那件被他当成披风的校服外套，手里紧紧捏着一叠厚实的打印纸，用一种视死如归的神情跨过了门槛。

  "吾之盟友啊！还有雪之下殿下！请务必过目吾之新作！"

  接下来的二十分钟里，整个奉仕部被迫经受了一场名为"阅读"的灾难。雪乃将那叠被命名为《暗黑剑士与绝对服从的奴隶少女》的打印纸推到长桌中央，用一种缺乏温度的语调开始了单方面的解剖。

  "且不说中世纪背景下为什么会出现现代才会出现的经济漏洞，单是女主角这种在被剥夺了所有人身自由和尊严后，还能对男主角产生毫无保留的爱意这种设定，就足以证明作者在常识认知上的严重缺陷。"雪乃看着坐在对面的材木座，声音平稳得像是在宣读病历，"这不叫小说，这只是一份将个人扭曲欲望具象化的废纸。"

  "……我说你啊，设定成奴隶就算了，为什么对着男主开后宫还是百依百顺？你是想写轻小说还是想写《人类饲养指南》？"八幡在一旁发出一声干瘪的叹息，用缺乏起伏的语调附和着，"这种东西要是能出版，日本的轻小说业界就真的完蛋了。"

  "小企说得有点过分啦……"结衣看着那叠原稿，双手不自觉地绞在一起，语气里带着些许同情，"虽然我不太懂那些设定，但是……女主角一直被这样控制着，连自己的想法都不能有，感觉好可怜哦。"

  "不！你们不懂！这正是男主那无与伦比的魅力所在！"材木座挥舞着手臂，试图进行苍白的辩解，"在那种绝望的环境下，男主是她唯一的光！她是自愿服从的！"

  在这场单方面的批判中，拉芙希妮一直保持着安静。她没有伸手去碰那叠原稿，视线一直停留在自己面前那个一次性纸杯的边缘。直到材木座喊出"自愿服从"这四个字时，她才缓缓抬起头。

  "你自己相信，在那种环境下，她能活下来吗？"

  拉芙希妮的声音不大，语调也一如既往的客气，但那句话却异常清晰地切断了活动室里的喧闹。

  材木座发出一声短促的怪音，像是一只被卡住脖子的鸭子。他张着嘴，看着拉芙希妮那双翡翠色的眼睛，显然没能立刻理解这个问题中蕴含的重量。

  结衣敏锐地察觉到了气氛的变化，她担忧地看向拉芙希妮，想要开口，却又不知道该说些什么。

  雪乃的视线不动声色地移向了拉芙希妮。那个浅金色头发的转学生并没有看着材木座，她的目光越过了那个肥胖的躯体，落在了活动室墙壁的某处空白上，仿佛在透过那本拙劣的小说，质问着某种更庞大、更不可理喻的存在。

  雪乃注意到，拉芙希妮左手的指尖，正无意识地摩挲着右手腕上那条烧焦的旧丝带。

  那不是在讨论小说的合理性。雪乃在心里迅速得出了结论。那种对"控制"的极度排斥，那种认为"绝对服从就等于自我死亡"的清醒认知，绝对不是凭借想象就能说出的话。她是在用这本满是漏洞的小说，倒映出她自己所面临的某种处境。

  八幡发出一声干瘪的叹息，他伸手把那叠原稿从桌子中央扯了过去，用一种毫无干劲的语调打破了这种诡异的沉默。

  "行了，别拿这种问题去难为这家伙了。"八幡用原稿敲了敲桌面，"他那容量可怜的大脑里，根本塞不下'生存逻辑'这种高级词汇。这只是一篇充满了扭曲欲望的垃圾而已。材木座，把这些废纸拿回去重写，或者干脆烧掉。"

  雪乃收回了落在拉芙希妮身上的视线，用同样的冷淡语气接过了八幡的话头："我同意比企谷同学的判断。这份原稿没有任何修改的价值，请带走它，不要继续在这里污染空气。"

  "……抱歉，我说了一些奇怪的话。"

  拉芙希妮的声音很低，她收回了摩挲丝带的手，将视线重新投向面前那个一次性纸杯。那是一个非常标准的、拉开距离的防御姿态。

  雪乃看着她微微垂下的眼睫，眉头轻轻蹙了一下。这是今天这个转学生第三次道歉了。那种过度得体的外壳下，似乎总是藏着某种随时准备撤退的戒备。

  "嘎啊——八幡！盟友啊！你不能见死不救！"材木座突然扑倒在长桌上，庞大的身躯让桌子发出痛苦的吱呀声，也彻底打断了那短暂的僵局，"既然你们都觉得不行，那就帮吾修改吧！为了吾的出道大业！"

  八幡嫌恶地往后仰了仰身子，拉开与那个肥胖身躯的距离，发出一声干瘪的叹息。

  "真麻烦……不过，如果就这么让你拿着这堆充满了犯罪预谋的废纸出去，大概会被出版社的编辑直接报警抓起来吧。"八幡用手背撑着脸颊，视线懒散地扫过桌面，最后落在雪乃身上，"喂，部长，奉仕部的工作范围应该包括纠正这种脱离社会常识的妄想症患者吧？"

  雪乃没有立刻回答。她看着八幡那双缺乏干劲的死鱼眼，似乎在衡量他这种反常的积极性从何而来。比企谷八幡从来不是一个热心助人的人，他顺水推舟接下这个麻烦的委托，大概只是想给那个随时可能再次缩回壳里的转学生，一个可以借题发挥的出口。

  如果直接讨论她的处境，她一定会逃走。但如果是讨论"小说里的角色"，她或许愿意把那些不能说的话说出来。

  "既然是正式的委托，"雪乃将那叠原稿重新拉回自己面前，拔开了一支红笔的笔帽，语气恢复了惯常的冷淡，"那就只能从最基础的常识开始重建了。材木座同学，准备好接受现实的毒打了吗？"
