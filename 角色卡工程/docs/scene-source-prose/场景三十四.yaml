场景: 34
幕: "第三幕·二学期"
时间: "2013年10月下旬 · 场景三十三的直接延续 · 文化祭开幕当天"
地点: "主体育馆后台通廊"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、叶山隼人、相模南、优子、遥、F班男生们"
正文: |
  那一阵略显嘈杂的脚步声，是从通廊那头传来的。

  叶山隼人拨开最外围看热闹的两个男生，他那件从来都穿得整整齐齐的西装外套随着步伐轻晃。他显然是听到了这里的骚乱，目光在触及到瘫坐在地上捂脸痛哭的相模南时，他那张仿佛永远戴着半永久温和面具的脸上，立刻换上了一种恰到好处的关切。

  "怎么了？大家在文化祭这么重要的日子里，不要因为一点小事伤了和气嘛。"

  他一如既往地微笑着，声音平稳得像是一汪没有波澜的死水。他绕开挡在前排的遥，弯下腰试图去扶相模南的手臂。

  相模南就像是溺水的人抓住了唯一的浮木，哭声猛地高了一个八度，眼泪混着残妆蹭在手背上。"叶山同学……比企谷他……"

  "隼人！你来得正好，比企谷刚才把南骂得太过分了！"优子立刻凑了上去，仿佛找到了能推翻刚才拉芙希妮和结衣压迫的法官。

  叶山的动作停顿了一下。他直起身，视线越过拉芙希妮和由比滨结衣的肩膀，落在了阴影里的比企谷八幡身上。他那标准的温和笑容里，迅速剥离出了一丝复杂的无奈，甚至带着点对八幡"又在制造麻烦"的不赞同。

  "比企谷。"叶山叹了口气，拿出他那套最擅长的、用于平息一切事端的说辞，"就算有什么误会，你也不该把女生逼成这样。相模同学为了开幕式已经承受了很大的压力，你……"

  "她承受的压力，并不是将烂摊子甩给别人的理由。"

  拉芙希妮的声音很轻，却在叶山的尾音落下前，精准地将其切断。

  她没有后退半步，甚至连挡在八幡身前的姿态都没有变。翡翠色的瞳孔像冰冷的玻璃珠，毫不避讳地迎上了叶山那略显错愕的目光。

  "叶山同学，你是在不知道前因后果的情况下，凭借眼泪的多少来判定谁是过错方吗？"拉芙希妮的语速不快，每一个字都像是经过了称量，"如果比企谷同学没有去休息平台用那些'过分'的话逼她，相模同学现在根本不会站在这里哭。她只会躲在某个角落里，看着全校在开幕式上为找她而乱作一团。"

  她看了一眼叶山悬在半空中、还想要维持体面的手，丢出了最后一句冰冷的陈述。

  "你这种名为调停的安抚，不过是在纵容她继续扮演一个受害者，顺便廉价地踩着比企谷同学来证明你的好心罢了。"

  叶山脸上的那层温和终于出现了肉眼可见的裂痕。他张了张嘴，似乎还没从这种全然不顾及"空气"与"面子"的直白攻击中缓过神来。

  他下意识地把求助的目光投向了由比滨结衣——这个在他的印象中，永远最懂得读空气、最会迎合圈子氛围的女孩。

  "结衣……"叶山的声音里带着点求证的意味，"连你也觉得，现在的气氛不需要稍微缓和一下吗？"

  结衣的肩膀在一瞬间瑟缩了半寸，那是她长期浸泡在那个圈子里所养成的、害怕被孤立的本能反应。可是，当她看到拉芙希妮单薄却挺直的脊背，再想起八幡孤零零走向休息平台的那个背影，她咬住了下唇。

  她抬起头，那双平日里总是弯成月牙的眼睛，此刻睁得很大，里面竟然透着一种连叶山都觉得陌生的冷硬，但一句话都说不出来，她在拉扯。

  后台的死角彻底安静了下来，只剩下相模南被噎回去的、断断续续的抽气声。

  八幡站在那片阴影里。他习惯了把自己扔进火里，习惯了在那群人鄙夷的目光中干瘪地笑几声然后走开。可现在，那扇本该由他自己关上的隔离门，被这两个人一左一右地卡住了。

  她们把他护在后面，替他挡下那些原本理所应当的污水。那种从来没有处理过的、名为"被维护"的沉重感，压在了他的气管上，让他连一声最擅长的自嘲式叹息都挤不出来。

  短暂的死寂并没有换来任何理性的反思，反而像是在发酵着某种更为浑浊的情绪。通廊里原本只是在远处张望的学生，见叶山吃了瘪，又听到了相模南的哭声，不知不觉间越围越近。

  压抑的空气终于在几声低语后彻底炸开了锅。

  "对啊，就是那个阴沉男吧。"一个F班的男生提高嗓门，指着阴影里的八幡，声音里带着一种找到出气筒的亢奋，"文化祭好好的，全被他一个人搞成这样！"

  "申请也是他随便乱毙，现在又把相模同学骂成这样，他以为他是谁啊？"另一个男生立刻接腔。

  他们根本不关心相模南是不是临阵脱逃，也不在乎拉芙希妮刚才陈述的事实。他们只是借着相模南的眼泪，把这段时间因为F班企划被驳回而积压的怨气，连本带利地朝着那个本就不受待见的"阴沉男"砸了过去。

  叶山隼人皱起眉，想要伸手拦住那几个越说越起劲的同班男生。"大家冷静一点，现在不是吵架的时候……"

  但这句软绵绵的劝阻，立刻被淹没在越来越密集的讨伐声里。他刚才那套被揭穿的伪善调停，已经让他失去了平时那种不容置疑的号召力。

  拉芙希妮没有退缩半步。她站在沸腾的声浪里，翡翠色的眼睛冷冷地扫过那些涨红了脸、试图用声量来掩饰借题发挥的男生。这种躲在群体安全区里释放恶意的嘴脸，她简直再熟悉不过了。

  由比滨结衣的手指绞得更紧了，虽然肩膀因为恐惧而微微发颤，但她依然固执地站在拉芙希妮身侧，将八幡严严实实地挡在那个安全的死角里。

  就在讨伐声即将演变成推搡的边缘，一阵极具规律的、不急不缓的皮鞋敲击地砖的声音，从通廊靠近主席台的那一头传了过来。

  原本挤在外围看热闹的人群，在那阵脚步声逼近时，就像是被某种无形的寒气逼迫着一般，不自觉地向两边退开，让出了一条过道。

  雪之下雪乃停在了人群的豁口处。

  她的手里还拿着刚才接管过去的主席台流程文件夹，校服外套上甚至还沾着一点会场里落下的细微灰尘。她没有看满脸泪痕的相模南，也没有看表情狼狈的叶山，视线只是飞快地扫过并肩站立的拉芙希妮和结衣，最后落在了阴影里的比企谷八幡身上。

  仅仅不到三秒钟的时间，那些掉落在地上的借口、强撑的讨伐，以及交织在一起的对立，就在她那双深蓝色的眼睛里被清晰地解构分类。

  "如果执行委员会的各位和F班的同学，把在这里浪费口舌、对本职工作毫无建树的精力拿出一半，用来处理外面已经开始排队的游客引导……"

  雪乃开口了，声音不大，却带着一种没有任何商量余地的绝对零度，瞬间冻结了通廊里所有嗡嗡作响的杂音。

  "相模委员长也不至于在致辞结束后，还要靠坐在纸箱旁边流泪来逃避下半场的工作了。"她微微扬起下巴，目光冷彻地滑过那几个带头起哄的男生，"还是说，F班现在打算接管整个文化祭的秩序维护工作？"

  通廊里的空气在雪之下雪乃那句毫无温度的反问后迅速冷却。那些原本还气焰嚣张的F班男生，在接触到她不带任何情绪的视线时，纷纷避开了目光，像躲避某种有形的寒气一样，不自觉地向两侧退让出一条狭窄的通道。

  雪乃顺着这条被让出来的路，步伐平稳地穿过人群。她没有在那些涨红了脸的男生面前多做一秒的停留，径直来到了拉芙希妮面前。

  拉芙希妮单薄的肩膀还维持着挡在八幡身前的姿态，右手腕处的旧丝带随着她的呼吸微微起伏。

  雪乃停下脚步。她的目光从拉芙希妮绷紧的脊背上扫过，声音依旧清冷，但那股对外的压迫感却收敛了些许，变成了一种类似敲打的陈述。

  "都柏林同学，"雪乃平视着她那双翡翠色的眼睛，语气里没有任何褒贬，"你不要也变成他那样。"

  这句话就像是某种解散的休止符。

  瘫坐在纸箱旁的相模南终于找到了一个可以不用面对拉芙希妮和结衣指责的台阶。她用手背胡乱抹了一把脸，在优子和遥略显僵硬的搀扶下站了起来。她低着头，一言不发地朝着连接前台的另一侧通道快步走去，准备去确认闭幕式的发言稿——那是她现在唯一能用来证明自己"在做事"的东西。

  F班的男生们见状，也讪讪地散开，各自回到了原本被分配的岗位上。

  叶山隼人理了理西装外套的前襟。他那张温和的面具已经重新戴好，即便上面还有没完全愈合的裂痕。他没有再去和任何人搭话，识趣地顺着人流退出了这条让人窒息的通道。

  由比滨结衣看了看站在原地的拉芙希妮，又看了看阴影里的八幡。她咬了下嘴唇，像是在做某种艰难的切换，随后抓紧裙摆，小跑着朝叶山离开的方向追了上去。她的脚步声在空荡下来的走廊里显得有些急促，显然是试图去为自己刚才的当众决裂做一点最低限度的圆场。

  仅仅过了不到一分钟，刚才还喧闹拥挤的后台通廊，被彻底清空了。

  空气里只剩下不远处主会场传来的隐约音乐声，以及冷风穿过通道时的干瘪呼啸。

  在这个被重新切割出来的安静空间里，只剩下比企谷八幡、雪之下雪乃和拉芙希妮三人。八幡依旧站在那片柱子投下的阴影里，双手插在口袋里，视线低垂着，看着地砖上的某一条缝隙，没有发出任何擅长的叹息或干瘪的吐槽。

  雪乃站在那里，连眼角的余光都没有分给阴影里的那个男生。

  她利落地转过身，手里的文件夹在空气中划过一道短促的弧线。她朝着通往主席台的台阶走去，皮鞋的声音在空旷的走廊里重新响起，每一步都踩得极重。

  没有停留，也没有回头，她冷冰冰的话语顺着通道的风，精准地砸在了八幡脚边的影子上。

  "文化祭结束前，"她的声音硬得像没有化开的冰，"请不要再让我为你的方式收拾场面。"
