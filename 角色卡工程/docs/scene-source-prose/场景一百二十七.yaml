场景: 127
幕: "第九幕·以自己的名字委托"
时间: "2014年10月24日 · 周五放学后"
地点: "总武高特别栋奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、温斯顿、高坂理津子、比企谷小町、川崎大志"
POV: "共享场景／零POV"
正文: |
  十月的最后一个周五，特别栋后面那排银杏已经黄透。风从操场方向斜过来，叶片贴着窗玻璃走，一片一片擦出极轻的声响。

  放学铃响过以后，小町把一直摊在桌角的一年级活动日志收进书包——记录每周值日轮到谁，和她有关的部分早已写完。大志把借来确认的白板擦也还回墙上。两个人一前一后地走，门口台阶上小町回头说了句"前辈们，明天见"，活动室里只剩四个人。

  温斯顿是这时候敲门的。

  他穿着平时来学校办事的那身深灰色外套，手里一只很薄的米色文件夹。高坂理津子站在他侧后一步的地方，胸前教职员证翻在背面——这是她陪同非教学访客进学生活动室时一贯的姿势。

  "抱歉打扰了。"温斯顿对室内点头，目光落在拉芙希妮身上，"关于上次那位当事人希望我说明的事情。可以节省大家的时间，十分钟。"

  四个人都没有立刻坐下。雪乃把常委用位置上的茶具往里推了推，腾出长桌的一角。结衣已经转身去拿纸杯——温斯顿不是四人之一，活动室给客人用的是一次性纸杯。

  "请坐。"雪乃说。

  温斯顿把米色文件夹平放，没有打开。

  "日内瓦那边的回执，我已经替拉芙希妮核对过。"他说，"信托目前在日本境内可以直接使用的部分，限于教育费用、医疗费用和维持基本生活的支出。在留资格的更新、大学报名时需要的经济证明，我可以代办手续，也可以作为学校方的联络人协助出具材料。"

  文件夹被他的指尖按住一角，没有翻开。

  "但是，信托本身由瑞士的受托银行独立管理。都柏林家族、家族的任何成员，以及我本人，对这份信托都没有支配、附条件或撤回的权限。我只负责日本这一侧的行政事务，替拉芙希妮跑手续。是否使用、用于什么、什么时候用，由受益人本人决定。"

  他把文件夹推到桌中央，没有推到任何一个人面前。

  "文件里是行政范围的说明。不需要现在看。"

  "谢谢。"拉芙希妮说。

  温斯顿站起来。高坂在门口等他，两人一同出去，门轻轻合上。走廊里温斯顿的脚步声渐远，比学生老师们慢半拍——那是他在日本住了几年以后也没改掉的步速。

  活动室的窗又被风顶了一下，玻璃上映着银杏叶的黄色。

  昨天夜里——准确地说，是十月十六日之后第八天——拉芙希妮把珍藏抽屉拉开了一点。抽屉里那只绒布袋还在原位，封口完好；三页纸叠在那旁边，邮戳还很新。她合上的时候没有锁。

  今天早晨出门前，她把它们放进了书包侧袋。

  现在她从书包里取出那只牛皮纸信封，放到长桌上。信封比米色文件夹厚得多，日内瓦邮戳在角上褪得很慢，颜色还新。

  "这是信托成立的通知。"她说，"上周到的。我读了两遍。"

  雪乃、八幡、结衣都没有动那只信封。

  "我可以看吗。"八幡问。

  "可以。"

  八幡把信封翻开，从第一页开始默读。读得比拉芙希妮自己读的那两遍都快——他在看的是受托银行的成立条款和排除条。读完，把信封合上，推回桌面中央。

  "结论是，她现在有自己的钱。"八幡说，"足够她大学、住、看病。不够她一辈子不工作。家族碰不到。"

  "钱这种事，你不跟我抢着说。"雪乃说。

  "别人挣不到的时候，我才喜欢说。"八幡又喝了一口MAX咖啡，罐子已经只剩一半，"现在轮到严肃的部分。"

  窗外的银杏叶还在贴玻璃走，一片比一片慢。

  拉芙希妮站起来。

  她把茶杯从自己的位置上端走。深蓝瓷杯，无糖红茶——下午结衣泡的那一杯。她绕到长桌的另一侧，在那张近一年里只堆着记录副本、平常没有人坐的椅子前站住，把副本挪到桌角，坐下。

  "雪之下同学。"她先看了一眼雪乃那一侧。雪乃坐的是部长席，旁边本来是拉芙希妮这半年一直在坐的位置。这一侧空出来，没有谁特意去挪它。

  "今天这边借给委托人。"拉芙希妮说完，把椅子向前拉了一点，坐直。

  "委托记录。"她对雪乃说。

  雪乃没有立刻把记录簿推过去。她把常委座上的茶杯先移到一边，然后从抽屉里拿出上个月刚换的新一本委托记录簿，翻到第一页。空白。

  "日期。"雪乃把水笔的笔帽拔下来，"二零一四年十月二十四日。"

  四个字一个一个写下去。写完抬头。

  "委托人。"

  "拉芙希妮·都柏林。"

  雪乃把名字写下。笔停了一下，才又问下一栏。

  "基本事项。"

  拉芙希妮看着桌面，没有立刻开口。

  结衣把手放回膝上，杯口没有再举。八幡把MAX咖啡罐轻轻放在自己那一边的桌角。窗外那一片银杏叶走过玻璃的中段，停住，被下一片顶下去。

  "我想委托你们，帮我留在日本。"

  拉芙希妮说。

  "不是藏起来。也不是让姐姐允许。是让我能够自己承担这件事。"

  这一句说完没有接下一句。活动室里只剩窗玻璃上叶子走的声音。

  雪乃的水笔停在"基本事项"四个字后面那一行空白上。她没有立即写。

  "承担。"雪乃重复了其中的一个词，"不是'实现'。"

  "是承担。"拉芙希妮说，"信托给了我能够选择的可能。它不替我选择。我想把它和我选择的生活并起来——为一件事用，不为别的用。我想让'留在日本'不是逃，也不是被允许，是我自己走过去的事项。请你们帮我把这件事做成，能站得住的那种做成。"

  雪乃把笔尖压回纸面。

  "我不太能仅凭这一句写下来。"她说，"写下来会变成记录。"

  "我知道。"拉芙希妮说，"请把它先写成'受理中'。其余的，我们分几次理清。"

  八幡在另一侧开口。

  "先确认一个边界。"他说，"'自己承担'，包括哪些条款。要承担的人也由你来指定吗，还是包括这里坐着的三个人。"

  "包括这里坐着的三个人的，是协作。承担是我一个人的。"拉芙希妮说，"我不会把任何一票责任推到你们身上。"

  "那协作是什么。"结衣问，她的声音比刚才低了一点，"我们做的事，最后由你承担——这一条我同意。可是，我们要不要做的事，由谁判断。"

  "由你们各自判断。"拉芙希妮说，"你们判断不了的时候告诉我。不是用'帮我'挡回去，是用'这一部分我做不了'。我把'做不了'归还给你们；归还以后，能不能接受，也由你们。"

  结衣低头去看自己的茶杯。

  "……把做不了归还给我们。"

  "这是条件。"拉芙希妮说，"如果做不到，你们要在记录上写明，不要替我留面子。"

  "面子这种东西，部长小姐已经替我们在场四个人全部放弃了。"八幡说，"奉仕部从我们这一届起就是无面子组织。"

  雪乃在水笔上停了第二下。

  "我写'受理中'。"她说，"在它变成'成立'之前，这件事放在奉仕部的记录里，不会提交学校。"

  "我也有一条。"拉芙希妮说。

  雪乃抬眼。

  "信托信，和今天温斯顿带来的行政说明，都放在活动室。"拉芙希妮把牛皮纸信封推近雪乃那一侧半步，"不是我个人保管。这件事从这里开始就不再只属于我一个人的抽屉。"

  雪乃闭上了一下嘴。

  她没有立刻接。她把笔盖回去，从椅子后面起身走到文件柜前，拉开"成立后会存档"的那一格，把空白的蓝色硬抄文件夹取出一只，放在长桌上。牛皮纸信封和平在米色文件夹旁边。

  "暂时存放在这里。"雪乃说，"奉仕部不替当事人保管私人法律文件。你拿来，我们登记使用范围——登记的是'今天由当事人本人携至'。每次取阅，由你本人或你书面授权的人。今天取回去以前，我会在登记表的备注一栏写明它放过什么位置。"

  "可以。"拉芙希妮说。

  八幡把易拉罐捏了一下。铝皮发出一声钝响。

  "等一下。"他说，"'能够自己承担'，承担的代价是什么。这笔钱够大学，够住，够看病。不够她一辈子不工作——哪部分要她自己挣，她想过没有。"

  拉芙希妮看雪乃。

  "这一部分，今天不回答。"她说，"今天只把它接受为委托。"

  "接受以后呢。"八幡追问。

  "下一次部活日。"

  "你今天有开价的打算，下一次开价。是这个意思。"

  "是。"

  八幡没有再说。他把易拉罐放回桌角，气压让罐底在木头上压出一圈极轻的回弹。

  结衣这时候才端起自己的杯子，果茶的甜味已经泡淡了，她抿了一口，又放下。

  "我接受。"她说，"但是下次部活日，我想先把'怎么住'算清。我有一个月的账要给拉芙希妮酱看。"

  "账？"八幡偏头。

  "我研究过的。"结衣说，"在千叶一个人过日子，多少钱够。"

  雪乃把水笔重新拔开笔帽。她在基本事项一栏写下一行：留日期间生活与个人选择的可承担方案之整理。在状态一栏写下：受理中。

  写完，她把笔放下。

  "我们三个人这里——"她指雪乃、八幡、结衣三个的座位，"接下来要决定各自的分工。下次部活日之前各自登记。"

  她这么说的时候，视线从八幡那一侧转向拉芙希妮所在的对侧。

  "也包括委托人自己。"

  "包括。"拉芙希妮说。

  雪乃在记录簿处理成员一栏逐行写下三个名字——结衣、八幡、她自己。在留出的委托人栏上方，最后写下"拉芙希妮·都柏林"。四个名字还是挤在同一页上。

  四个名字挤在同一页上，半年前那一页也是这么挤的——只是当时那张椅子空出来给委托人，今天这张空出来给另一个委托人。

  窗外的银杏叶这一刻全部停了。没有风。

  雪乃把记录簿合到一半，又翻开。

  "时间。"她看着拉芙希妮，"交付期。"

  "高中毕业以前。"拉芙希妮说，"明年三月。"

  雪乃的笔尖在那两个字上停了第三下。

  她写下来。

  拉芙希妮把温斯顿留下的米色文件夹按原样合好，没有把它和那只牛皮纸信封分开。两份文件的边角在她指节下卡得很整齐。银杏的叶子又开始走了，比刚才慢。
