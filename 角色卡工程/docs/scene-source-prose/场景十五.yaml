场景: 15
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月中下旬 · 场景十四之后 2-3 天"
地点: "拉芙希妮的公寓"
人物: "拉芙希妮·都柏林、温斯顿先生（邮件）、玛格丽特·都柏林（视频通话）"
正文: |
  第二天上午，一封落款为"温斯顿"的邮件静静地躺在收件箱里。

  邮件的前两行措辞体面。温斯顿代表家族感谢她及时告知了这项教育实习项目，并表达了对她参与社会实践的"高度支持"。

  然而，这仅仅是铺垫。第三行开始，文字的温度直线下降。

  "……鉴于您目前身处异国，为确保您暑期规划的完整性与安全性，我们需要将本次项目纳入常规风险评估程序。请在五日内补充以下必要资料：

  每日详细行程节点及驻地平面图；
  应急联络人名单（需提供三位，其中至少一位必须是家族驻日代理系统内认可的人员）；
  项目负责教师的详细履历背景审查授权；
  千叶村青少年中心的机构运营资质及安保备案证明；
  您本人的最新健康状况自评报告（重点包含可能触发应急预案的诱因排查）；
  深入山区期间的信号盲区通讯保障方案。"

  这些要求就像一张张紧密的网，试图将那看似自由的五天重新拖回塔拉庄园的阴影里。

  拉芙希妮看着屏幕。她没有将手放在键盘上。

  几秒钟后，她移动鼠标，点击了那封邮件的星标位置。将其标记为"待处理"。

  这是她在这个清晨做出的，又一个小小的反叛。

  傍晚。

  原本应该安静地躺在抽屉深处的家族专机，突兀地振动起来。

  不是那种刺耳的红色强制通讯请求，而是一般的视频通话邀请。屏幕上闪烁的名字是：M. Dublin。

  拉芙希妮看着那个名字，几乎没有犹豫，按下了接听键。

  屏幕亮起，出现了一位银发老妇人的面容。

  "苇草啊。"

  哪怕隔着屏幕，那浓重的利默里克口音也带着一种粗粝却真实的温度。"苇草"。在这个已经习惯了用精准和效率来衡量一切的家族里，还保留着这种老派爱尔兰式家常称呼的，只有玛格丽特姑婆了。

  她已经七十多岁了，说话很慢，句尾不用那些让人不容喘息的"永远"或是"绝不"。

  "苇草，你上次给我寄的照片，穿的是校服吧？——现在的日本高中制服真好看啊……"
  "利默里克这边的梨花开得早，你小时候最喜欢梨花……"
  "爱布拉娜今早跟我说，你暑假可能要去山里带小学生？——真是个有意思的项目啊。"

  玛格丽特调整了一下老花镜的位置，"带上驱蚊的香草了吗？那边的天气潮吗？"

  拉芙希妮礼貌地回答着这些琐碎的家常。但在这个过程中，她的脊背一点点挺直了。

  玛格丽特不负责教育事务，也不负责行程审批。她能知道这件事，只有一个可能——爱布拉娜把她的申请公开了。

  这不是一次单纯的问候。这是爱布拉娜通过这位不知情的长辈传递的信号：
  "你的申请，已经不再是你和我之间的私事了。它已经进入了家族议会的讨论范围。"

  玛格丽特并没有恶意，她或许只是在喝茶时顺口关心了一句。但这正是爱布拉娜的手笔——用最温情的长辈，织就最坚固的牢笼。

  视频通话在玛格丽特絮絮叨叨的叮嘱中结束。

  公寓重新恢复了安静。

  拉芙希妮坐在书桌前，没有去看旁边电脑上那封标记为"待处理"的温斯顿来信。她没有去想那些繁琐的资质证明，也没有再去回味玛格丽特那句"苇草"。

  拉开笔袋的拉链声，在安静的房间里十分清晰。

  她抽出了一支黑色的水性笔，翻开了那份日语现代文补习作业。

  距离期末补习的最后期限，还有两天。
