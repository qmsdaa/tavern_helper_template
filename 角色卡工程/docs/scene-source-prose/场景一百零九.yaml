场景: 109
幕: "第七幕·重新为奉仕部命名"
时间: "2014年4月30日 · 周三放学后"
地点: "总武高特别栋奉仕部活动室"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林、比企谷小町、川崎大志、高坂理津子、一色彩羽、折本香织"
POV: "共享场景／零POV"
正文: |
  活动室里多了两把折叠椅。

  结衣从茶柜最深处翻出两只杯子，一只有黄色小花，另一只白得连校徽都没有。小町抱走了花杯，大志接过白杯，一再向她道谢。

  “都说不用谢啦。以后还要一起用很久的。”

  “不要替消耗品许下长期承诺。”八幡说，“杯子听见会有压力。”

  小町在折叠椅上晃了一下。椅脚立刻发出轻响，八幡低头看过去。

  “看吧，哥哥才是压力最大的那个。”

  “我在确认学校有没有拿报废品欢迎新部员。”

  “有在欢迎就好。”

  八幡拿起桌上的MAX咖啡，决定放弃这场对话。

  高坂理津子推门进来时，怀里只有一个薄文件夹。她把文件交给雪乃，顺手把靠墙的椅子拉到桌边。

  申请书右下角已经盖了章。后页列着六个人的名字，小町和大志的入部届夹在最末。

  “手续通过了。”高坂说，“从今天起按正式社团登记，我担任顾问。”

  大志坐直了一些。

  “这样就算成立了吗？”

  “你还想剪彩吗？”八幡问。

  “不是，我只是觉得……比想象中快。”

  “慢的部分都在前面。”高坂把文件夹合上，“PTA的复核还没结束，活动记录照旧保留。”

  结衣拍起手。掌声在活动室里零零落落地响了一会儿，很快只剩她自己。

  雪乃把名册收进记录簿，写好日期。

  “欢迎加入奉仕部。”

  “请多指教，部长。”大志说。

  “请多指教。还有，哥哥以后要注意资深部员的形象。”

  “刚成立就开始弹劾创始成员了吗？”

  “小町会先从口头警告开始。”

  拉芙希妮把没拆封的砂糖推给大志。

  “程序很完整。”

  “你不要鼓励她。”

  门外的敲门声截断了小町的反击。

  “打扰了。刚成立就开始内部斗争，奉仕部今年也很有精神呢。”

  一色彩羽抱着文件袋进来。跟在她身后的女生穿着海滨综合的制服，胸前别着访客证，透明文件夹压在臂弯里。

  八幡正伸手去拿记录簿旁的自动铅笔。

  “啊，小企。”

  他的手停在铅笔上。

  折本香织也顿了一下，随即朝高坂和雪乃依次欠身。

  “我是海滨综合的折本香织。老师叫我来听今天的流程说明，请多指教。”

  “请坐。”雪乃说。

  一色把海滨综合的派遣单交给高坂。高坂核过访客证，把公开材料推给折本，剩下的仍留在自己手边。

  “会场安排和学生说明可以看。个人健康情况由校方和受托机构保管，不交给观察人员，也不经过奉仕部。”

  “明白。”折本把自己的记录表抽出来，“我们老师也叫我别看见什么都往上抄。”

  她在高坂刚拉出的椅子上坐下，正好隔着长桌面对八幡。高坂站去了窗边。

  “好久不见。小企居然还在做这种活动啊。”

  八幡把铅笔拿起来。

  “过期称呼倒是比校际文件流通得稳定。”

  “一直这么叫，很顺口嘛。”

  “这就是习惯造成的公共危害。”

  折本笑了一声，低头整理自己的纸。结衣把记录簿推到八幡手边，又挪开挡路的茶壶。瓷器在桌上磕了一下。

  雪乃看向一色。

  “委托呢？”

  “差点被前辈的青春往事带跑了。”一色从文件袋里抽出委托单，“五月上旬，京王高中会来总武高参加联合健康检查。两校要共用几间检查室、候场区和移动路线。学生会负责总武高这边，所以我先来求救了。”

  “说得像学生会已经沉没了一样。”八幡说。

  “还浮着哦。会长本人正在努力舀水。”

  一色摊开折叠的会场图。图纸比桌面空出的地方宽，边角压住了小町的花杯。

  “等一下，我的杯子。”

  小町把杯子抽出来，整张图随之偏向结衣那边。大志赶紧按住另一角，白杯又挡住了图例。

  “我开始理解为什么需要外部援助了。”八幡说。

  “地图太大也不是我的错吧。”一色用手肘压住翘起的纸，“两校各做了一套流程，最后场地却排在一起。学生会想请奉仕部整理学生说明、候场动线和现场求助的位置。”

  一色用笔点了点入口。

  “共同登记原本放这里。”

  “原本？”结衣问。

  一色从文件袋里摸出两张表，第一张放反了。她转了一次，又把另一张也转错，最后干脆分别推给雪乃和八幡。

  “总武高想先登记到场，再发说明。京王那边要在到场表上一起确认告知和后续转介。双方都说自己的版本不容易出错。”

  “于是让填表的人负责证明双方都没错。”八幡按着自动铅笔，笔芯没有出来。

  小町还低头看着会场图。

  “这里的箭头怎么断了？”

  “后面是检查区。”雪乃说，“先把看不懂的地方圈出来。”

  小町应了一声，拿笔圈住断掉的箭头。大志凑过去看，手里的白杯正好挡住图例。

  “咨询台和登记台是同一个吗？”

  “图上是。”一色说。

  “那排错队的人去问路，不就又排回原来的队伍了吗？”

  一色低头看了一会儿，把笔递给他。

  “这个也圈起来。”

  “会长的威严正在以圆圈为单位减少。”八幡说。

  “前辈最好祈祷，最后别由你陪我把这些圆圈改掉。”

  “我相信学生会长有独立承担责任的优秀品格。”

  “只在这种时候相信我，真的很恶心。”

  结衣拿走压在图上的茶匙，把两张登记表并排摆好。总武高那张留着单独的告知确认栏，京王的几项确认则挤在姓名后面。

  雪乃翻开空白记录页，在顶端写下日期和委托名称。

  拉芙希妮拿起总武高的学生说明，读到开头便停了下来。

  “这里第一次写‘异常转介’，没有说要去哪里。”

  “京王那份呢？”结衣问。

  “背面。”

  “谁排队的时候会先翻背面啊……”

  几个人重新去找对应的说明页。图纸、表格和记录簿叠在一起，一张表从会场图下面滑到了折本手边。

  “欸？”

  折本把它抽出来，又伸手拿过结衣旁边那张。

  “这两个为什么不一样？”

  “刚才说过，两校登记方式不同。”一色说。

  “我知道啦。”折本把两张表摆正，“总武高的人填这个，京王的人填那个，对吧？可他们排的是同一条队啊。到时候到底听哪一个？总不能看校服发纸吧。”

  一色张了张嘴，去找会场图上的入口。

  折本又看了看自己面前的记录表。

  “海滨以后真参加，还要再来一张？那肯定会搞错吧。”

  她转向八幡。

  “小企，你怎么看？”

  自动铅笔的笔芯终于弹了出来，落在八幡的记录页上，断成两截。

  八幡把碎笔芯扫开，又按了一次。

  “先把共同登记和健康信息分开。”

  他把两张表拉到面前，在空白纸上写下“到场”和“健康信息”。

  “入口只确认谁来了。告知和转介交给校方指定的现场接收人。连谁有权看到什么都没写清楚，统一流程只是统一泄露方式。”

  “最后那句能写进学生说明吗？”一色问。

  “你想让体检当天一个人都不来，可以。”

  “前辈也知道自己说话吓人啊。”

  “现在知道已经太迟了。”折本笑着说。

  八幡的笔停了一下，又继续往下画。

  那条线从“到场”下面穿过两张登记表之间的空隙，最后停在“现场接收人”一栏。

  那一栏还空着。
