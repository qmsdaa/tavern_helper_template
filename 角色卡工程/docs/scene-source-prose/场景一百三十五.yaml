场景: 135
幕: "第十幕·冬去春来"
时间: "2015年2月3日 · 周二"
地点: "总武高特别栋奉仕部活动室"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林、比企谷小町、川崎大志"
POV: "共享场景／零POV"
正文: |
  二月以后，三年级的课表松了下来。出愿、模拟考、各处不同的入学考试日把日历切成一块一块，白天以自习和自由登校为主。八幡到活动室的时候已经过了下午三点。他推开门，第一眼看见的是黑板。

  靠门一侧那整面黑板的左半边，被四张A3横版的纸占满，四角用胶带贴得平整。每张纸的表头印着名字，名字后面跟着一行小字，再往下是从早到晚的时间格，一格十分钟，每一格都写了字。

  最左边那张：雪之下雪乃 · 法学方向。六点起床，六点十二分到六点四十分英语长文，六点四十到七点零五早餐和单词，七点十分出门。一路排到二十三点四十，就寝。

  "……这是课程表，还是电车时刻表。"

  "电车时刻表做不到这个精度。"雪乃坐在靠热水壶的位置，面前摊着习题册，头也没抬，"每张表最后一栏留了空行，执行不了的时段自己调整，调整完写回去。"

  "执行不了的时段。"八幡把书包放上椅子，走近黑板，"第二张是谁。"

  第二张的表头：比企谷八幡 · 社会科学方向。

  "为什么连我的志愿都替我写了。"

  "方向是你自己说的。"

  "我什么时候——"

  "去年十一月。你说，文科就行，最好是听起来不用怎么上课的那种。"雪乃翻过一页习题册，"社会科学最接近你的描述。"

  八幡盯着自己那张表。九点到九点五十数学，十点到十点五十数学，十一点到十一点二十休息。十五点三十那一格写着：MAX咖啡，一罐。

  "为什么连MAX咖啡都限量。"

  "两罐以上影响晚间复习。"

  "那是我的晚间复习。"

  八幡的目光移到第一张表的最下面几行。"二十二点五十到二十三点，次日计划复核。"他念了出来，"连复核计划的时间都要计划。"

  "不预留，会被别的科目吃掉。"雪乃说。

  "分表在你桌上。有异议填最后一栏，填完我评估。"

  桌上并排放着四张打印表，和黑板上是同一套，右上角别着回形针和便签。八幡拿起自己那张。便签上是雪乃的字：先执行三天，再谈修改。

  窗边，拉芙希妮已经拿到了她那一张。表头：拉芙希妮·都柏林 · 文学方向。

  "都柏林，你看过自己的了？"八幡问。

  "看了。很合理。"

  "哪里合理，连起床时间都写好了。"

  "反正我六点醒。"她说，"写了和没写一样。"

  她的目光在表格中段多留了一行。二十一点到二十一点四十那一栏写的不是科目，是四个字：自由读写。她什么都没说，把表对折，收进书包侧袋。

  八幡看她一眼，又看看黑板，最终没再说什么，把自己那张表夹进习题册，权当签收。

  门被手肘顶开。结衣抱着一个便当盒侧身挤进来，盒子外面包着碎花布，布角系了个结。

  "等、等一下再做卷子！考试季慰问品来了！"

  盒子放上长桌中央。解开布结，掀开盖子。

  盒子里是一块饼干。准确地说，是一块曾经是几十块饼干的什么东西：面糊在烤盘上摊开，彼此连成完整的一片，铺满整个盒底，边缘一圈焦黑，中间鼓起一个浅色的包，表面上浮着挤花袋留下的纹路，纹路和纹路化在一起，看不出原来的花样。

  "挤的时候明明是一朵一朵的。"结衣说。

  "烤完变成一片大陆了。"八幡说。

  "小企，不要给别人的失败起名字！"

  结衣从盒底抽出一次性手套戴上，把饼干掰开。边缘一掰就掉渣，中间的部分弯了一下才断开。她把碎块分到纸巾上。

  "边缘是脆的，中间是软的。理论上有两种口感。"

  "理论上。"八幡接过一块边缘，咬了一口，"苦。"

  "啊……"

  拉芙希妮把深蓝色的杯子往旁边挪了挪，拿了一块中间的。她咬了一小口，把剩下的半块放回纸巾上，才开口。

  "中间的甜度刚好。黄油的味道也很清楚。"

  "拉芙希妮酱真的觉得好吃？！"

  "嗯。所以中间的部分，建议先拿。"

  八幡看看自己指间那块焦黑的，又看看她纸巾上那半块。"下次分饼干之前，应该先把中间没收，统一分配。"

  "先到先得。"拉芙希妮说。

  雪乃没有拿。她看了一眼断口，说："黄油软化过度了。挤完花冷藏十分钟再进烤箱，花纹站得住。"

  "家政课讲义里写过这个吗？"结衣问。

  "第三章。"雪乃说，"你当时坐在第三排。"

  "……我回去再看一遍第三章。"

  放学铃响过，小町和大志到了。小町进门第一眼也看见了黑板。

  "哇，值日表出第二季了？"

  "是刑期表。"八幡说。

  "哥哥对雪乃姐的心血这种评价，小町分数扣十分。"小町凑到黑板前往下扫，扫到第三张的时候念出声，"社会科学方向。哥哥，社会科学是学什么的？"

  "研究人类为什么要发明出考试这种东西的学问。"

  "听起来好丧。"

  小町又从头到尾把四张表扫了一遍，确认表头里没有自己的名字，拍了拍胸口。

  "还好还好，一年级不在射程内。"

  "在学年末考的射程内。"大志说。

  大志跟在后面，先朝长桌点了点头，说了句打扰了，然后去茶柜拿杯子。新米色杯和碎花杯，两杯麦茶，一杯放到小町手边，一杯端去靠窗的空位。他坐下，从书包里拿出一年级的数学习题册。

  "大志，先别做题，看这个。"小町指着黑板，"前辈们的志愿都写在上面了。雪乃姐是法学，拉芙希妮姐是文学，结衣姐是儿童发展。"

  "嗯，和听说的差不多。"

  "你听谁说的？"

  "姐姐。她说前辈们目标都很明确。"大志翻开习题册，又补了一句，"尤其是比企谷前辈，连MAX咖啡都被管理了。"

  "你姐姐的情报网还真广。"八幡说。

  小町看完黑板，趴回桌角，双手抱头。

  "怎么办。看完这个，小町突然好紧张。学年末考还有三个星期，数学还在生死边缘徘徊。"

  "上次小测及格了。"大志说。

  "那是侥幸！"

  "及格两次就不叫侥幸。"

  "小町的及格线和小町的目标线是两回事！"小町抬起头，"话说回来，前辈们倒轻松，最难的共通テスト都考完了。"

  "轻松？"八幡说，"你看看那块黑板再说一次。"

  小町顺着他的下巴方向看过去，重新看了一遍那四张表，收回了这句话。

  "上个月考完那天，班主任也说，最难的一关已经过去了。"八幡拉开MAX咖啡的拉环，"第二天开始发准考证的打印通知。"

  "决定一生的说法本来也不准确。"雪乃说，"它决定的只是二月底的日程。"

  "这个更正也没有让人轻松多少……"

  小町从纸巾上挑了块中间的饼干。大志伸手拿了一块边缘的，就着麦茶咬了一口。

  "边缘的配麦茶，刚好。"

  "大志你好温柔……"结衣小声说。

  "是真的刚好。"大志说。

  小町把最后一口饼干咽下去，下巴朝黑板抬了抬。"那，法学是学什么？背法律吗？"

  "背，然后讨论怎么解释。"雪乃说。

  "文学呢？"大志从习题册上抬起头，"每天看小说？"

  拉芙希妮放下杯子。"看小说，然后写这本小说为什么值得看。"

  "那不就是读后感地狱吗。"小町说。

  "嗯。"拉芙希妮说，"是自愿跳下去的那种。"

  "那结衣姐的儿童发展——"

  "小孩子怎么吃，怎么睡，怎么教，怎么陪！"结衣掰起手指，"差不多这些！"

  "结衣姐很合适。"小町说。

  "对吧！"

  雪乃把习题册合上一半。"准考证都打印了吗。"

  "打了打了！"结衣说，"我的考场好近，骑车二十分钟。"

  "苇草，你呢。"

  "打了。总武线直达，出站走七分钟。"

  "比企谷同学。"

  "……为什么只有我的在埼玉。"

  "因为那是你自己选的考点。"雪乃说，"准考证号登记到复习表最后一栏，备用路线也写上。电车停运就按预案走。"

  "连停运都有预案。"

  "去年二月总武线停过一次。"

  "一次而已。"

  "一次就够写进预案了。"

  小町叹了口气，把下巴搁回桌面。"总之小町也要开始复习了。大志，你今天做几页？"

  "十二页到十五页。按计划。"

  "你也有计划？！"

  "写在笔记本上。"大志翻过一页，"到分钟的那种没有。到页的那种有。"

  "那种小町也有！……大概。"

  结衣忽然坐直了。"对了，小雪乃！这个饼干，明天我重做！这次一朵一朵分开烤，烤之前先冷藏！"

  雪乃看了一眼挂钟，起身走到黑板前。

  "点心时间已经超过十四分钟了。十六点四十到十六点五十，黑板上规定的是十分钟。"

  "欸，那个也规定了？！"

  雪乃拿起板擦，把自己那张表上"点心"那一格擦掉，用粉笔重写。粉笔灰落进槽里。

  "明天的点心时间，二十分钟。"

  "欸？"

  "掰成块需要时间。"雪乃说。

  结衣看着她，笑开了。"嗯！明天一定成功！"

  小町举起手。"雪乃姐，那小町的复习表也拜托了！要带点心时间的那种！"

  "一年级的，周四之前给你。"雪乃说，"不带点心时间。"

  "欸——为什么！"

  "因为你的点心时间，都在奉仕部过掉了。"

  "……无法反驳。"
