场景: 76
幕: "第四幕·冬假→三学期"
时间: "2014年2月1日 · 周六 · 晚"
地点: "千叶市美滨区 · 雪之下雪乃公寓"
人物: "拉芙希妮·都柏林、雪之下雪乃、由比滨结衣、比企谷八幡"
正文: |
  玄关处的感应灯亮起的时候，比企谷八幡的视线首先落在鞋柜下方那些排列得像是在接受阅兵一样的室内拖鞋上。

  这间位于美滨区高档公寓里的屋子，空气里带着微凉的、类似于高级酒店大堂的清洁剂气味。没有任何多余的杂物，没有任何属于"家"的散漫感。如果不是挂在衣帽架上的那件熟悉的蓝黑色大衣，他甚至怀疑自己走进了某个样板间。

  "打扰了。"由比滨结衣的声音里带着掩饰不住的兴奋，她小心翼翼地脱下短靴，把手里那个印着著名甜品店Logo的纸袋双手递了过去，"小雪乃，这个是伴手礼！我排了大概二十分钟才买到的限定草莓塔！"

  雪之下雪乃站在门垫的边缘，双手接过纸袋。她的脊背挺得很直，那种因为要接待多名客人而产生的、难以察觉的局促被她完美地包裹在礼仪的外壳里。

  "由比滨同学，其实没有必要特意排那么久的队。不过，谢谢你的心意。"她轻声说着，目光随之偏转，落在了八幡手里那个被塑料袋装着的东西上。

  八幡把那个塑料袋拎高了一点。里面是两盒便利店买的家庭装茶茶布丁，以及一罐未拆封的MAX咖啡。

  "事先声明，这是小町硬塞给我的。她说如果空手上门会被打断腿。"八幡用那种干瘪的语气撇清关系，"那个布丁……也算可以吃。"

  雪乃的视线在那个廉价的塑料袋上停留了两秒。她伸出手接过来，指尖避开了塑料袋提手的部分。

  "比企谷同学的妹妹似乎在社会化教育方面承担了本不该由她承担的重任。"雪乃转身走向厨房区，"考虑到保质期和添加剂的成分，我会尽快把它们处理掉的。如果你口中的'可以吃'没有构成虚假宣传的话。"

  这种熟悉的、带有消毒水味道的刻薄，反而让八幡那根紧绷的神经稍微松了一点。他换上拖鞋，跟着结衣走进客厅。

  而在他们身后，拉芙希妮·都柏林安静地脱下长靴。她没有递交任何被包装好的物理上的"伴手礼"，只是将大衣挂在衣帽架上，然后自然地走向了客厅角落的收纳柜。

  客厅中央的矮桌很宽敞。结衣一坐下就开始打量四周，脑袋转来转去，像一只被放进新笼子的仓鼠。

  雪乃端着一个木制茶盘从厨房走出来。盘子里放着四个白瓷茶杯，以及结衣带来的那个被切好的草莓塔。蒸汽从杯口直直地往上飘。

  "茶刚泡好。"雪乃走到桌边。

  然而，在她的视线落在矮桌上的那一刻，她的动作出现了不到半秒的停滞。

  平滑的玻璃桌面上，已经端端正正地摆好了四个软木杯垫。

  拉芙希妮正收回手，她刚才毫不迟疑地拉开了电视柜下方的第二格抽屉，在没有任何人指示的情况下，取出了这些备用品。

  结衣的目光在那四个软木杯垫和拉芙希妮的手腕之间停住了。她的手指在膝盖上绞紧了一下，随后又用招牌式的"欸嘿嘿"傻笑把这片刻的停顿压了下去。

  "哇，连杯垫都准备好了呢……"结衣小声说了一句。

  雪乃端着茶盘的手指微微发白。她没有看拉芙希妮，而是垂下视线，僵硬地将茶杯一一放在那些杯垫上。在放下最后一个杯子时，她抬起手，用一个很不自然的角度把垂在耳边的发丝别到了耳后。

  "……谢谢。"雪乃的声音很轻，听起来有些干涩。

  "不客气。"拉芙希妮端起自己面前的茶杯，翡翠色的眼睛看着杯子里的红茶，"毕竟，如果不垫着的话，玻璃桌面上会留下很难擦的水圈。"

  八幡在旁边默默地撕开布丁的包装膜。他能感觉到空气里那种密度极高的张力。那个坐在他对面的转学生拉开电视柜下方第二格抽屉、取出软木杯垫的动作，没有任何试探或询问——就像在做一件重复过许多次的事。

  伴随这种诡异气氛的，是茶匙触碰瓷杯的轻响。

  雪乃在矮桌的另一端坐下。她的坐姿依然挑不出任何毛病，但视线却始终落在自己的那杯茶上，没有看任何人。

  "其实……今天请你们过来，除了把文化祭遗留的一些发票账单做最后的清算之外。"雪乃开口了，声音平缓而克制，甚至带着拖沓。

  她停顿了一下，手指在茶杯的边缘摩擦着。

  八幡注意到，在茶几下方、距离雪乃膝盖不到五公分的地方，压着一张纸的边缘。纸张的厚度和那种表格特有的横线，那是总武高的进路调查表。上面的墨迹隐约透出纸背，但被一本厚厚的法律辞典死死地压住。

  "我只是在思考一个……缺乏效率的问题。"雪乃的视线依旧没有抬起，"如果一个方向，从一开始就被规划为了'最优解'，并且铺设好了所有必要的轨道。那么，在这个轨道上行驶的列车，是不是就不应该再对窗外的其他路线产生好奇？"

  结衣刚挖起一小勺草莓塔的手停住了。她看了看雪乃，又看了看八幡，平时那种总是能轻易填补空气空白的能力，此刻像是被冻结了一样。

  "因为如果产生好奇，最终也只是在浪费燃料而已。"雪乃的声音变得更低，带着要把自己剖开的残酷，"对吧？在扭转不了列车方向的前提下，连提及'我想去别的车站'这种想法，都是软弱。"

  客厅里安静得只剩下空调运作的微弱嗡嗡声。

  八幡发现自己在吃布丁。不是辩论，不是拆解，不是把雪乃的每一句话按逻辑链条逐一击碎。他只是在吃布丁。

  "我没坐过那种铺好轨道的列车。"八幡用死鱼眼看着天花板的吊灯，声音像布丁一样干瘪，"反正只要一出门，我大概就会在半路被各种意外或者别人的冷眼逼得原路返回。不过——"

  他把塑料勺子扔进空盒里，发出一声脆响。

  "如果你觉得那条轨道是别人铺的，那就不叫坐列车。"八幡的视线落回那本书压着的一角，"那叫被装在集装箱里发货。货物的确不需要好奇窗外有什么，但如果是活人的话，谁规定在火车上不能把脸贴在玻璃上往外看的？"

  雪乃的肩膀细微地颤动了一下。

  结衣的眼眶慢慢变红了。她把盘子推到一边，身体向前倾，越过矮桌的半个距离，伸出手轻轻盖在了雪乃那只一直摩擦着茶杯边缘的手上。

  "小雪乃。"结衣的声音有点发抖，但非常清楚，"如果小雪乃觉得那条路很冷的话，我们可以一起敲窗户的。就算打不开，至少……至少里面有我们陪着，就会暖和一点吧。"

  雪乃没有抽回手。她看着那只盖在自己手背上的、温暖的手，原本绷紧的唇角开始无法控制地往下滑。

  在这个安全的私人领地里，她那些用于抵抗母亲、抵抗整个世界的冷硬逻辑，正在被这种毫无章法的物理接触一点点融化。

  拉芙希妮坐在旁边，左手腕的红绸带垂在膝上。她静静地喝了一口红茶，右手腕袖口下，烧焦旧丝带的轮廓若隐若现。

  "英国的列车经常因为落叶和积雪晚点。"拉芙希妮的声音像往常一样温柔，没有任何起伏，"当停在半路的时候，很多乘客会选择下车，沿着轨道走到附近的镇上去喝一杯热汤。那确实违反了列车的运行时刻表。"

  她转过头，翡翠色的眼睛看着雪乃因为用力咬着嘴唇而有些发白的脸。

  "但只要腿还是你自己的，除了你自己，没有任何人能签发永远不能下车的判决书。"

  雪乃闭上眼睛，深深地吸了一口气。

  那张被法律辞典压住的进路调查表依然躺在原处，上面的墨迹没有消失。但在这个混合着草莓塔的甜腻和劣质布丁香精味的公寓里，雪乃慢慢抬起另一只手，覆在了结衣的手背上。

  那本厚重的法律辞典依旧压在进路调查表的一角，但房间里那种冷滞感，已经在刚才那几句毫无逻辑可言的对话中彻底破碎了。

  雪之下雪乃极快地抽回了那只覆在由比滨结衣手背上的手。她转过头，假装去看电视机柜旁边的盆栽，同时用食指的关节在眼角处用力地按了一下。那个动作因为做得太快，导致她把垂在脸颊旁的黑发都揉乱了几分。

  不到三秒钟，她重新转过脸，端起那杯几乎已经没有热气的红茶，试图恢复刚才那种无懈可击的完美姿态。

  但鼻尖那种细微的粉色，以及微微泛红的眼眶，让这份伪装看起来像是一层一戳就破的薄冰。

  "那个……"由比滨结衣突然打破了空气里的安静。

  她像是完全没有察觉到雪乃那层勉强维持的冰壳，或者说她敏锐地察觉到了，并决定用最简单粗暴的方式将它敲碎。结衣在裙子口袋里摸索了几下，掏出了那部挂着两个毛绒团子吊饰的旧款智能手机。

  "既然难得大家都来小雪乃家里了，"结衣举起手机，屏幕的光照亮了她有些傻气的笑容，"不留点什么纪念太可惜了。我们拍张合照吧！"

  这四个字就像是一颗扔进平静湖面的石子，瞬间激起了三个方向的强烈反弹。

  "我拒绝。"雪乃在几秒内做出了反应。她放下茶杯，眉头瞬间蹙了起来，"由比滨同学，如果你的常识还没有完全退化，就应该明白，在这间完全没有进行过专业布光的客厅里，用这种像素的手机镜头，只会拍出一堆带有严重噪点和曝光灾难的失败图像。"

  "我负责按快门。"比企谷八幡比雪乃的动作还要快。他已经借着拿纸巾的动作，成功将自己的身体平移到了沙发的边缘位置，完全脱离了结衣手机镜头的可能捕捉范围。"这种带有极强现充气息的仪式，本身就是对社会阴暗角落住民的霸凌。作为摄影师，我拥有合理的豁免权。"

  而坐在雪乃身旁的拉芙希妮·都柏林，动作显得更加细微。

  她没有像八幡那样往后缩，也没有像雪乃那样用连篇的理论进行轰炸。她只是静静地垂下眼帘，右手本能地搭在了左手腕那条红绸带上，指腹在上面轻轻摩挲。

  "如果需要的话，我可以帮比企谷同学打反光板。"拉芙希妮的声音很轻，带着一贯的干燥，"毕竟，我也不太习惯面对镜头。"

  "不行！"结衣的声音陡然拔高了一个八度。

  她完全无视了这三个人各自筑起的防御工事，直接从矮桌对面绕了过来。

  在雪乃还来不及做出任何防御动作之前，结衣已经一把扑了上去，双臂紧紧地搂住了雪乃的脖子。由于重力的作用，雪乃整个人被迫向后倒，后背重重地撞在了沙发的靠垫上，原本刚刚整理好的黑发瞬间散乱地贴在了结衣的毛衣上。

  "由、由比滨同学！你到底在干什么？立刻松开——这种毫无社交距离感的接触，简直——"雪乃的声音里带着慌乱和羞恼，她试图去掰结衣的手臂，但又不敢真的用力伤到对方。

  "小企！你坐过去一点！"结衣完全没有理会雪乃的抗议，她单手举着手机，在屏幕里比划着角度，"对，就是那个位置。如果小企打算躲在屏幕外面，那我明天就把你国语课上的作文贴在二年级的布告栏上！"

  八幡刚刚挪出半米的身体僵住了。他看着结衣那张在手机屏幕光下闪烁着"恶鬼"般执着的笑脸，最终发出一声干瘪的叹息，认命地将身体往前挪了挪，勉强把右边的半个肩膀挤进了画面的边缘。

  "拉芙希妮酱，你也过来啊！"结衣转头看向还在一旁摩挲丝带的转校生。

  拉芙希妮的指尖顿了一下。

  "我……还是算了。"她试图用那种礼貌的、带着距离感的笑容去终结这个话题，"我的加入，可能会破坏画面原本的平衡感。而且……"

  她没能把那个借口说完。

  因为在结衣的钳制下，那个原本正在极力挣扎的、因为羞恼而满脸通红的奉仕部部长，突然做出了一个完全不符合逻辑的物理动作。

  雪乃在狭小的空间里强行侧过身。她伸出那只刚才还微微发抖的手，越过了几个茶杯的距离，一把抓住了拉芙希妮刚才正准备往后退的左手手腕。

  拉芙希妮那双翡翠色的瞳孔在一瞬间放大了。

  因为用力过猛，雪乃的手指紧紧地扣在那条红绸带的边缘，力道大得甚至让拉芙希妮感受到了微微的痛感。

  "雪乃……同学？"

  "既然……既然我都已经被迫卷入这种无理取闹的惩罚游戏里了。"雪乃咬着嘴唇，因为用力拉扯，她的声音听起来有些发颤，但那种强势却没有任何打折，"你觉得……我会允许你一个人作为旁观者，在旁边看戏吗？"

  她没有等拉芙希妮给出任何回答，也没有给拉芙希妮分析这里面是否存在"家族风险"的时间。

  雪乃用力一拽。

  拉芙希妮的身体在完全失去平衡的情况下，向前栽倒。她的肩膀重重地撞在了雪乃的右侧肩膀上，那股混杂着高级洗发水和微微汗水的体温，瞬间穿透了毛衣的布料，贴在了她的皮肤上。

  "这就对了嘛！"

  结衣发出一声欢呼。她高高举起手机，将原本试图逃跑的八幡的半个肩膀、被自己死死搂住脖子满脸羞愤的雪乃、以及因为突如其来的拉扯而显得错愕且狼狈的拉芙希妮，全部框在了那块不到五英寸的廉价屏幕里。

  "三、二、一——茄子！"

  咔嚓。

  伴随着手机特有的、无法关闭的刺耳模拟快门声，一道刺目的白色闪光灯在没有开大灯的客厅里炸亮。

  雪乃在强光的刺激下本能地闭上了眼睛，发出一声极低的不满的抗议。拉芙希妮维持着那种半个身体倒在雪乃肩膀上的诡异姿势，眼睛微微睁大，甚至连那贯有的从容也彻底消失了。而画面的最边缘，是八幡那张写满了"好想回家"四个大字的死鱼脸。

  "拍好了拍好了！"结衣迅速松开了对雪乃的钳制，抱着手机退回了自己的座位，兴奋地点开相册。

  雪乃终于重获自由。她一边大口地喘着气，一边恼怒地整理着自己被揉得一团糟的头发和衣领。

  "这是我这辈子经历过的，最缺乏文明教养的三分钟。"雪乃冷着脸，语气冷厉，"把照片删掉。那种图像，如果流传出去，对我的名誉将是毁灭性的打击。"

  "哎？可是拍得很好看啊！"结衣把手机翻转过来，屏幕朝向桌面，"你看你看，小雪乃生气的样子也很可爱嘛。"

  八幡瞥了一眼那张屏幕。

  那是一张堪称灾难的照片。由于结衣手抖，画面有一点模糊。雪乃的眼睛因为闪光灯而半闭着，眉头皱成了一团，一看就在发火；拉芙希妮那张总是能维持完美礼仪的面具被彻底打碎，取而代之的是真实的、笨拙的惊讶；而他自己，半个虚焦的脑袋像是一个误入镜头的幽灵。

  只有结衣在这片灾难般的构图中，笑得没心没肺，两颗团子头在画面中央格外抢眼。

  拉芙希妮慢慢地坐直了身体。她感觉自己的肩膀上，还残留着雪乃刚才那种充满侵略性的体温。

  她看着手机屏幕里那个狼狈的自己。

  那里没有都柏林家族长女的影子。没有那条永远铺设着红毯、算计着利益的轨道。

  那里只有一堆因为便宜草莓塔和劣质布丁聚集在一起的、毫无逻辑的笨蛋。

  "确实。"拉芙希妮垂下眼帘，嘴角慢慢地勾起了一个微小的、却没有任何防备的弧度，"如果这种照片被传出去的话，可能需要花很大的力气去解释呢。"

  雪乃瞪了她一眼："那你就不要露出那种看起来完全不像是被惩罚的表情。"

  "但是……"结衣小心翼翼地把手机锁屏，像护着什么宝贝一样把它揣回了兜里，"这样的话，小雪乃下次觉得冷的时候，就可以拿出来看一看了吧？"

  客厅里又安静了下来。

  这一次，没有谁再试图去反驳。
