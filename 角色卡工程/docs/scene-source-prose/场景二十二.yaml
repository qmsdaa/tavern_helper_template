场景: 22
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月下旬 · 林间学校第五天上午 · 离开日"
地点: "千叶村青少年中心 → 返回千叶市的电车"
人物: "雪之下雪乃、拉芙希妮·都柏林、比企谷八幡、由比滨结衣、鹤见留美"
正文: |
  金属拉链咬合的细微声响在安静的和室里划过。

  雪之下雪乃半跪在榻榻米边缘，将一件原本就平整的浅色便装再次抚平折痕。她用一种近乎苛刻的几何标准，将最后几件衣物依次压入那个黑色的专业旅行袋中。整个过程没有任何多余的杂音，就像这五天里那阵平稳规律的呼吸声一样，充满了一种冷硬的秩序感。

  在距离她不到一米远的相邻铺位旁，拉芙希妮·都柏林正将那本英日对照的诗集放进随身的包里。

  拉芙希妮的动作比平时慢了半拍。右手腕那截烧焦的旧丝带随着她收拾的动作，时不时地擦过帆布包的边缘。

  这是合宿的第五天上午。

  只要离开这间没有监控的和室，坐上那趟返回千叶市的电车，随着海拔的降低，手机屏幕顶端丢失的信号格数就会重新跳动起来。那个位于英国的、由邮件、视频和日程表组成的严密视线，即将再次将她覆盖。

  拉芙希妮的手指停留在提包内侧那个最隐蔽的夹层边缘。那里放着那张写有雪乃私人号码的确认表，以及从美滨区公寓带来的几件微小的私人物品。

  雪乃提醒她仔细检查有没有遗漏什么东西，拉芙希妮把雪乃的联系方式确切地带在身上，轻声回答："我没有遗漏任何东西。"那是她在信号恢复后，唯一可以不用计算代价就选择的退路。

  拉开和室的拉门后，由比滨结衣欢快的声音从楼下大厅的边缘传来。四人很快完成了汇合，提着各自的行李，推开了青少年中心厚重的玻璃大门。

  夏日上午的阳光立刻倾泻下来。

  鹤见留美站在门外台阶的边缘。她依然是一个人站着，背着那个深色的双肩包。但她此刻的姿态与几天前坐在树下时完全不同——她的肩膀不再向内瑟缩，视线也不再像雷达一样防备地扫视四周。她只是安静地站在那里。

  她在等人。

  当四个人走下台阶时，留美转过头。那双灰色的眼睛径直锁定了走在边缘的比企谷八幡。

  她迈开穿着及膝棉袜的双腿，朝着八幡的方向走去。

  两人的距离很快缩短。留美停在八幡面前不到一米的地方，仰起头，看着这个在昨晚用最狼狈的方式瓦解了排挤的人。她没有开口说任何用来表达感谢的词汇，只是沉默地站了几秒钟。随后，她把手伸进口袋，拿出一张边缘有些不规整、似乎是刚从什么本子上撕下来的彩色贴纸或者卡片，递到了八幡面前。

  递完东西后，留美的视线越过了八幡的手臂，落在了站在一旁的雪之下雪乃身上。

  她对雪乃点了一下头。没有语言，没有任何多余的表情，那只是一个简单、却带着明确承认意味的动作。雪乃同样没有说话，只是以极微小的幅度颔首作为回应。

  旁边的结衣正因为眼前的场景而睁大了眼睛，还没来得及发出惯常的感叹音，留美的目光已经转了过去。

  看着那个从始至终都只是在用单纯的温度靠近自己、从未带着审视目光的粉色团子头女生，留美脸部的线条慢慢放松下来。她的嘴角向上牵起，对结衣露出一个毫无防备的、属于十二岁女生的真实笑容。

  最后，留美的视线微微偏转，落在了站在结衣身后的拉芙希妮·都柏林身上。

  只有一眼。

  拉芙希妮站在几步开外，翡翠色的眼睛安静地迎上了那道灰色的目光。右手腕边缘那截烧焦的旧丝带在阳光下显得有些暗淡。

  没有任何语言，也没有多余的动作。在那个短暂到只有零点几秒的瞬间，两道视线在夏日的空气中发生了碰撞。这是一种只有她们自己才懂的信号交换——那种长久以来习惯了坐在角落里、习惯了被阴影包裹，如今却都刚刚触碰到某个边界的共鸣感，在不需要任何解释的情况下完成了确认。

  留美收回了视线，转过身，走向了停在广场前方那辆属于小学生的白色大巴车。

  电车的门合上，将林间学校那个名叫"千叶村"的节点隔绝在了车厢门外。

  由比滨结衣趴在她那个巨大的双肩包上，脑袋埋进了胳膊里。高强度的体力消耗和情绪起伏，让她在这节终于不再需要随时读取气氛的车厢里迅速坠入了熟睡。她轻微而均匀的呼吸声，构成了当下这个空间里最稳定的背景音。

  比企谷八幡坐在她的侧前方。他把身体深深地嵌进座椅的角落，脑袋斜靠着车窗边沿，眼睛紧闭。这是一种极为彻底的、用来回避后续社交压力的装死姿态。

  但他的右手并没有像平时那样随意地插在外套口袋里，而是紧紧合拢。那张从鹤见留美手中接过的、边缘有些不规整的彩色卡片，此刻正被他严密地收拢在掌心。他没有去查看卡片上的内容，也没有将那份属于别人的沉甸甸的分量随手丢弃，只是维持着装死的姿势，任由电车摇晃。

  雪之下雪乃坐在另一侧的单排座位上。

  她双腿并拢，腰背挺直，那个黑色的专业旅行袋规矩地放在脚边。她的手里拿着一本文库本，视线垂落在白色的纸页上。车厢里冷气运作的轻微嗡鸣声与窗外的轨道摩擦声交织在一起。

  但是，从电车开动到现在，已经过去了将近二十分钟，她手里的书页却一次也没有翻动过。

  拉芙希妮·都柏林坐在雪乃斜前方的靠窗位置。

  她安静地看着窗外不断变换的景色。大片的绿色植被正在稀疏，属于千叶市区的灰色低矮建筑开始零星地进入视线。拉芙希妮的左手平放在深色的裙摆上，右手搭在左手手背上。

  一切都跟来的时候一样。

  一切又跟来的时候不一样。
