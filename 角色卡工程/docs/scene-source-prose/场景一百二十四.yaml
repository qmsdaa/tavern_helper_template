场景: 124
幕: "第八幕·归国与失语"
时间: "2014年8月12日 · 周二 · 夜"
地点: "伦敦·都柏林家族宅邸（保险会社档案中心→宅邸书房→三楼）"
人物: "拉芙希妮·都柏林、爱布拉娜·都柏林"
POV: "拉芙希妮"
正文: |
  认证謄本比原卷多了一层蜡封。

  八月十二日下午，拉芙希妮在档案中心的前台签了字，把那只厚实的牛皮纸信封收进包里。信封的棱角隔着帆布，抵在她的肋骨上。

  回到宅邸，管家说：爱布拉娜小姐今晚在书房。

  这两天，姐姐回来了。周日的晚餐，周一的早餐，餐桌上的对话精确地覆盖着天气、并购案和她开学后的课程。谁也没有提到书库，谁也没有提到保险会社。姐姐用餐巾的姿态和从前一样，问她"课程有没有跟上"的语气也和从前一样。

  拉芙希妮配合了两天。

  今晚，她不打算再配合了。

  ——

  书房在二楼尽头。她敲门的时候，爱布拉娜正在看一份文件，笔在指间转了一个很小的圈，停住。

  "进来。"

  书桌上的台灯只照亮桌面的一个角。爱布拉娜坐在那片光后面，风衣换成了深色的家居服，领口仍然一丝不苟。紫水晶的胸针别在原处。

  "坐。"爱布拉娜放下文件，"正好，我也有事要谈。你的返程是八月二十九日。回去之后就是第二学期，明年的安排，我们应该在开学前——"

  "是要谈一次。"

  拉芙希妮打断了她。还火以后，这从未有过。

  爱布拉娜抬起眼睛。

  拉芙希妮没有坐。她把包里的牛皮纸信封取出来，放在书桌上，推到那片台灯的光里。蜡封在光下泛着暗色。

  "不过在那之前，有一件事。"她说，"我知道安保为什么没有进去。"

  书房里静了下来。

  楼下的老宅钟敲了九下，声音从地板下面传上来，一下，一下，听得清清楚楚。

  爱布拉娜的视线落在那只信封上，没有动。她指间那支笔停在半空，停了有两三秒，然后被轻轻放在桌面上。

  "继续说。"她的声音很平。

  "视察日前十天，安保顾问公司提交了风险升级评估。罢工集会里有外部煽动者，现场发现了可以用于纵火的器材。建议是延期，或者变更路线。"拉芙希妮的语速不快，像在宣读一份与自己无关的记录，"评估书的签收记录上写着已读。批复栏里写着'行程维持。按原计划执行。'"

  "《视察警备配置命令》的第三条：安保力量在外围部署警戒，未获视察负责人明确授权，不得进入视察区域。"

  "三个签名，是同一个人。"

  爱布拉娜的手移到桌沿，指尖碰到紫水晶胸针的边缘。

  "我没有命令任何人纵火。"

  她说这句话的时候，声音反而稳了下来，像是终于踩到了一块坚实的地面。

  "我知道。"拉芙希妮点了点头，"报告用了整整一段来否认这一点。主办方和煽动者之间没有任何联络记录。火不是你放的。"

  "那么——"

  "可是它走近我的每一步，都是你签的字。"

  拉芙希妮的声音仍然没有抬高。

  "警告到了，你读了。建议来了，你批回了。安保在外面，你命令他们站着。起火之后约四分钟，只有一个人跑进去。你的安保获得授权的时候，已经超过可介入窗口约十一分钟。"

  "她叫达洛维。"

  爱布拉娜的手在胸针上停住了。

  "Outcast作出了她自己的选择。"她说，"在那种情况下，进入火场是她个人的判断。家族没有要求她——"

  "她叫达洛维。"

  拉芙希妮重复了一遍，不重，但是把姐姐的话截断了。

  "至少在今天晚上，叫她的名字。"

  台灯的光圈里，尘埃浮动。爱布拉娜看着她，很久，没有叫那个名字。

  "你想要什么。"

  最后开口的是爱布拉娜。她的背脊仍然挺直，声音里那种一切尽在掌握的平稳回来了大半。

  "这份报告，如果你打算交给长老会，你需要知道程序。审计口径、受理顺序、评估期限。这些都可以谈。"

  "我不会把它交给长老会。"

  爱布拉娜的眉梢动了一下。

  "那不是用来交换什么的东西。"拉芙希妮说，"也不是用来摧毁你的东西。如果我把它交出去，你就变成了它的受害者。你不是。达洛维小姐才是。"

  "那你要什么。"

  "我要你回答一个问题。"

  拉芙希妮向前走了半步。

  "那次视察，到底是为了什么。"

  "为你准备的履历。"爱布拉娜的回答很快，"产业视察是进入长老席位的必要资历。那一天的危险是存在的，我判断它在控制之内。你后来康复了，你去了日本，你比从前任何时候都——"

  "不对。"

  拉芙希妮这一次没有让她说完。

  "你早就知道集会里有煽动者。你留着行程，是因为一次'可控的危险'，能让你的妹妹在获救以后，重新需要你。"

  书房里彻底静了。

  "你缺的不是一个更强的妹妹，姐姐。"她说，"你缺的是一个需要你的妹妹。"

  爱布拉娜站了起来。

  椅子在地板上擦出很短的声响。她撑着桌沿，居高临下地看着拉芙希妮，胸口起伏了一次，又一次。

  "我所做的一切，"她的声音压得很低，每一个字都像从很深的地方取出来的，"是为了让你永远——"

  那句话没有说完。

  它停在那里，悬在台灯的光和桌角的阴影之间。爱布拉娜自己停住的。她保持着那个撑桌的姿势，像一台读到错误指令的机器。句子断在那里，没有接下去。

  "永远什么？"拉芙希妮轻声问，"永远保护我？永远锻造我？"

  "还是永远需要我？"

  爱布拉娜没有回答。

  紫水晶胸针在她的指下被摩挲了一下，两下。那只手今天没有往日的稳定。

  "八月二十九日，我回日本。"拉芙希妮说，"机票是我自己买的。去是我自己要去的，回来，也是我自己要回来的。"

  "这份謄本留在你这里。我那里还有副本。"

  她转过身，走向门口。手握住门把的时候，她在原地站了一秒。

  "我不会原谅你。"

  没有抬高，没有颤抖。说完，她拉开门，走了出去。

  ——

  走廊很长，灯光把她的影子投在身后的门板上。

  她走得不快。一级一级上楼梯的时候，手扶着栏杆，掌心有一点潮。到了三楼，她推开自己房间的门，关上，把背脊抵在门板上，站了几秒。

  手在抖。

  她把两只手抬起来，看了一眼，然后一根手指一根手指地收拢，握成拳，再松开。抖意退下去一些了。

  楼下没有任何声音。书房的那扇门，没有再开过。

  手机在桌角亮了一下，是群聊的消息提示。她拿起来，输入了一行字，看了看，又一个字一个字地删掉，把手机扣回桌面。

  今天的第一条，她没有发。

  书桌上，行程单还立在台灯旁边。返程那一行：八月二十九日，成田。

  她把它拿起来，夹进了手帐的最后一页，合上。

  房间里的灯亮着。老宅的钟敲了十下，声音顺着地板爬上来，又沉下去。
