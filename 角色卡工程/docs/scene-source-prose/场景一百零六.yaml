场景: 106
幕: "第七幕·重新为奉仕部命名"
时间: "2014年4月17日 · 周四放学后"
地点: "总武高特别栋奉仕部活动室"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林、高坂理津子"
POV: "共享场景／零POV"
正文: |
  “请接受我的委托。”

  雪乃把一张新的委托记录放到长桌中央。委托人一栏已经写好“雪之下雪乃”，日期是当天，基本事项那一栏仍然空着。

  八幡原本在读昨天留下的现况确认表。他抬起头，没有立刻去拿那张纸。结衣刚把茶叶放进壶里，手边只摆了三只杯子。拉芙希妮坐在靠书架的一侧，替桌边留出了一个空位。

  高坂理津子也在活动室里。她坐在门边的折叠椅上，黑色文件夹合在膝上，胸前的教职员证已经翻到了背面。

  “你把高坂老师也请来了？”八幡问。

  “我请她观察奉仕部如何处理一项新委托。”雪乃说，“现况确认需要实际记录，只整理过去的成果没有意义。”

  “昨天还打算关门，今天就开始争取新增业绩。部长的经营方针转向得真快。”

  “如果你想把撤回一项错误决定称作经营方针，我不反对。前提是你不要要求别人理解这种用词。”

  雪乃说完，没有坐回平常的位置。她拿起自己的茶杯，走到长桌另一侧，在拉芙希妮留出的椅子上坐下。

  结衣看了看空出来的部长席，又从茶柜里取出第四只杯子，放到八幡旁边。

  “这样的话，小雪乃今天是委托人吧。”她说，“那边应该留给接委托的人。”

  “为什么我的旁边自动变成接待窗口。”

  “因为小企坐得离文件最近。”

  “原来组织结构取决于谁懒得挪椅子。”

  八幡嘴上抱怨，还是把委托记录转了过来。

  “基本事项没有填。”

  “我不知道该怎样写。”

  “连问题都要接单的人负责整理，这已经不是委托了。是把空白试卷递给旁边同学。”

  “所以我先说明。”

  雪乃把深蓝色文件夹留在原来的座位上。昨天没有签名的撤回申请还夹在里面，露出写着奉仕部名称的页首。

  “我以为，奉仕部继续存在需要一个足够正确的理由。只要活动记录完整，责任范围清楚，学校就应该认可。”

  高坂没有打开文件夹，只问：“现在改变了吗？”

  “这些材料仍然需要。它们无法回答全部问题。”

  “哪一部分回答不了？”

  雪乃看着桌上的委托记录。

  “我想留下奉仕部的理由。”

  结衣把热水倒进茶壶。壶盖被水汽顶得动了一下，她用指尖按住，没有接话。

  “母亲认为我只是害怕他们离开。”雪乃继续说，“我想证明她错了，所以准备写一份不涉及私人关系的说明。后来我发现，那仍然是在用学校要求的答案回避问题。”

  八幡把委托记录往自己这边拉了一点。

  “然后你决定干脆撤回。只要房间先消失，就不用确认那种害怕到底存不存在。”

  “昨天你已经说过了。”

  “很遗憾，正确答案不会因为说过一次就自动从世界上消失。”

  “你对自己偶尔正确这件事，抱有超过实际价值的自信。”

  “偶尔中奖也算中奖。不能因为彩票站觉得不体面就拒绝兑奖。”

  结衣把第一杯茶放到雪乃面前。

  “小雪乃，你想留下吗？”

  雪乃没有碰杯子。

  “想。”

  这个字落下以后，结衣低头去倒下一杯。茶水碰到杯底，声音比平时响。

  “可是，我还无法确认这个愿望属于什么。”雪乃说，“我想保留奉仕部，也可能只是依赖平冢老师留下的安排。我想让你们继续来，也可能只是无法接受关系发生变化。我反对母亲的判断，其中也有不愿承认她看穿我的部分。”

  “愿望里混着这些东西，就会失效吗？”结衣问。

  “会让我无法判断，自己究竟在坚持什么。”

  “人类如果要等动机完全纯净以后才能行动，学校里大概只剩下负责打扫的机器人。”八幡说，“顺便一提，机器人也可能只是怕被返厂。”

  “比企谷同学的结论虽然粗糙，问题却成立。”拉芙希妮说，“你希望我们替你分开这些理由吗？”

  “我希望你们在我又用正确替自己作答时指出来。”

  拉芙希妮没有马上答应。

  “找到以后，由谁确认？”

  “由我。”雪乃说。

  “如果我们不同意呢？”

  “可以反对。最后的选择仍然由我承担。”

  “那我接受。”

  拉芙希妮把自己的茶杯往旁边移开，让委托记录能够平放在四个人之间。

  八幡拿起笔，在基本事项的空栏上方点了点。

  “说了这么多，还是缺一句能写进去的话。”

  雪乃坐直了一些。

  “请帮我找到真正的自己。”

  八幡的笔停在纸面上。

  结衣轻轻重复了一遍：“真正的小雪乃……”

  “请不要擅自加上听起来很幼稚的昵称。”

  “我没有那个意思啦！”

  “而且这项委托抽象得足够让哲学研究会拒绝受理。”八幡说，“完成期限、验收标准和交付成果全部没有。哪怕是我，也很难靠写一份检讨把它糊弄过去。”

  “我没有要求一次完成。”

  “那就更麻烦了。”

  “你可以拒绝。”

  八幡把笔帽拔下来。

  “昨天才说过，不希望自己的话被擅自删掉。今天拒绝的话，会显得我的主张只有一天保质期。”

  他在基本事项栏写下“个人选择与行动理由的整理”。写完以后，他把笔递给结衣。

  “公开记录写到这里。剩下的内容没必要交给学校。”

  结衣接过笔，在处理成员一栏写下自己的姓名。她写得比平常慢，最后一笔差点碰到表格边框。

  “我也接受。可是我有一个条件。”

  “什么？”雪乃问。

  “小雪乃如果觉得我们说错了，要告诉我们。不能因为是委托人，就把不高兴都藏起来。”

  “委托人通常没有配合接待方情绪管理的义务。”

  “那就当作朋友的条件。”

  雪乃拿起茶杯，杯口碰到嘴边以后又放了回去。

  “我会考虑。”

  “这句话听起来好像很会逃跑。”

  “由比滨同学，你最近对措辞的要求是不是突然提高了？”

  “因为昨天有人说，说出口的话应该算数。”

  八幡低头喝了一口已经不太凉的MAX咖啡。

  “请不要把我偶尔说出的丢人台词整理成部内教材。”

  拉芙希妮接过笔，也写下自己的姓名。

  “我没有附加条件。”她说，“如果我判断不清，会直接说明。”

  “这已经是条件了。”雪乃说。

  “那么，请把它写进去。”

  委托记录回到八幡面前。他在处理成员最后一格签了名，四个姓名挤在同一行，字迹互不相同。

  高坂这时才打开膝上的黑色文件夹。

  “委托成立了吗？”

  “成立。”雪乃说。

  “但是措辞需要更正。”八幡说，“目前只是受理。成立这种说法容易让人误以为我们已经知道怎么做。”

  “那么，已经受理。”高坂翻出现况确认表，“我需要确认几件事。”

  她把委托记录和现况确认表并排放好。

  “这项委托包含个人隐私，学校不会要求你们记录谈话细节。处理过程中如果涉及家庭、升学或心理健康问题，你们准备怎样区分自己能做的部分？”

  “涉及专业判断时转交教师、保健室或校外机构。”雪乃回答。

  “这句话由委托人回答不够。”

  雪乃停住了。

  八幡把那张记录拿过去。

  “我们不能诊断她，也不能替她决定升学和家庭关系。能做的只有提出异议、核对事实，还有在她准备把所有人一起删掉时拒绝签收。”

  “由比滨同学？”

  “我会听她说，也会告诉她我自己的想法。”结衣说，“如果真的需要老师帮忙，我不会为了保密硬撑。”

  “都柏林同学？”

  “我可以帮助她识别家族文件和谈话里的控制方式。”拉芙希妮说，“涉及她要怎样生活，我没有代替她回答的权限。”

  高坂在文件上记了几行。

  “最后一个问题。奉仕部受理了部长本人的长期委托。以后遇到与这项委托冲突的新请求，由谁决定优先顺序？”

  “由我……”雪乃说到一半，停了下来。

  三个人都没有替她补完。

  雪乃拿过委托记录，在处理成员一栏旁边补了一句：“由全体成员确认，不由委托人单独决定。”

  高坂读完，没有表示赞同，也没有划掉。

  “一句真诚的话不能直接证明学校应当保留一个学生组织。”她说，“不过，你们已经把委托人的决定权、成员边界和学校责任分开了。这比一份只罗列成果的说明更接近我需要评估的内容。”

  “所以，现况确认可以通过吗？”结衣问。

  “我还没有作出结论。”

  高坂合上黑色文件夹，把委托记录留在桌上。

  “继续活动，继续登记。让我看到你们怎样处理这份委托，也让我看到它会不会妨碍你们帮助其他学生。”

  她走到门口，又回过身。

  “如果你们仍然希望学校承认奉仕部，我会根据这段记录判断，是否有必要进入正式注册评估。”

  门关上以后，雪乃还坐在委托人的位置。她面前那杯茶已经泡开，杯底压着一小片从壶口漏出的茶叶。

  八幡把没有签名的撤回申请从深蓝色文件夹里抽出来，推到她面前。

  “这个怎么处理？”

  雪乃拿起那张纸，沿着原来的折痕对折。

  她没有撕掉，只把它收进了书包最里面。
