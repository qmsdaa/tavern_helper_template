场景: 143
幕: "第十幕·冬去春来"
时间: "2015年3月6日 · 周五"
地点: "总武高特别栋奉仕部活动室"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林"
POV: "共享场景／零POV"
正文: |
  三月六日。国公立大学前期合格发表日。

  活动室的暖气关了。窗开了一条缝，三月的风从那里进来，吹得记录簿的纸角一掀一掀。桌上放着一只马克杯，杯底压着一沓打印纸。是结衣带来的——SPI成绩单和私立大学合格通知。儿童发展学科，第一志愿。

  "短信是早上到的。"她说，声音不高，但手心在膝盖上蹭了好几次。"不是国立。不是和大家一样的。但是是第一志愿。"

  "不是'但是'。"雪乃说。"是第一志愿。前面的部分就够了。"

  "嗯——对！是第一志愿！"结衣把通知单拍在桌上。"妈说今晚加菜。"

  "什么菜。"

  "汉堡肉。自己那份上面加一颗温泉蛋。"

  八幡把文库本合上。他的手机搁在桌角，屏幕朝下，从进门到现在没有翻过面。

  "比企谷同学。"雪乃说。"手机。"

  "还没看。"

  "为什么。"

  "看过的人先说。"

  结衣举手。"我说完了！"

  拉芙希妮放下杯子。"早稻田。文学部。共通テスト利用入试。合格。"

  她的语气和报天气预报差不多。结衣从椅子上弹起来，张开手臂，又想起拉芙希妮不太习惯被抱住，在半空中换成一个拇指竖起来的动作。

  "拉芙希妮酱！作家！"

  "第一步。"拉芙希妮说。"后面还有很多步。"

  "第一步就是第一步！"

  雪乃拿起手机看了一眼。她看得很慢，像在读一份需要逐条确认的合同。然后她把屏幕按灭。

  "一桥大学法学部。合格。"

  活动室的安静只维持了半秒。

  "半秒。"八幡说,"我还以为你会先说'看来我的估分没有出错'。"

  "我的估分确实没有出错。"她说,"但这句话可以等一下再说。"

  结衣趴在桌边。"小雪乃，你高兴吗。"

  "高兴。"雪乃说，顿了一下。"这件事可以用高兴来概括。"

  "那就好！"

  三个人都看着八幡。

  他拿起手机，翻过来。屏幕亮着。拇指在密码锁屏上划了一下，停了几秒。然后他放下手机。

  "千叶大学法政经学部。合格。"

  结衣没说话。雪乃也没说话。拉芙希妮把深蓝色的杯子端起来，又放回去。杯子碰在碟子上，瓷片相触的声音。

  "小企。"

  "嗯。"

  "你刚才说'看过的人先说'——不是怕自己不合格。"

  "那是。"

  "你是怕先看了，万一不合格，会影响大家的气氛。"

  八幡拉开MAX咖啡的拉环。"两年多了。这个习惯还在。"

  "没关系。"雪乃说。"习惯了也会影响。不影响才奇怪。"

  "你这算是安慰吗。"

  "是事实陈述。"

  结衣从自己的合格通知底下抽出一张折好的千叶地图。她把地图摊开，四个角分别用杯子、习题册、记录簿和MAX咖啡罐压住。

  "四个人的学校——"她的手指在图上移动。"早稻田在新宿。一桥在国立。小企在千叶。我在——横滨往上一点。"

  "总武线。"八幡说。

  "嗯。总武线。千叶到东京，一条线。横滨是另一条但可以转。"

  "你在画通学路线。"雪乃说。

  "对。从千叶到国立大概两个小时。到新宿一个小时多一点。到横滨也差不多两个小时。如果想见的话——不是想不想，是想的话——都能到。"

  雪乃看着地图。结衣画的不是通学路线——至少不完全是。每个学校的位置旁边，她用铅笔写了很小的字：小雪乃·一桥。拉芙希妮酱·早稻田。小企·千叶。自己的名字旁边，画了一颗很小的花。

  "不是同校。"结衣说，手指还停在自己那颗花上。"之前有一段时间——可能是去年秋天——我不想承认这件事。因为一旦承认了，就要面对——以后没有共同教室了。没有'下课去活动室'这回事了。没有热水壶和茶柜的同一个下午了。"

  她把手从地图上拿开。

  "上个月和妈妈聊完——我承认了。没有一个人的升学路径和我完全重叠。这个是事实。"

  "然后呢。"八幡说。

  "然后发现——如果不想让关系结束，就得自己主动安排见面。不是靠课表。是靠——靠'我想见你所以我来见你'。这不就是奉仕部以后要做的？让别人去见面。先把自己当成委托人，受理一次试试。"

  拉芙希妮把地图上的MAX咖啡罐拿开，换了一个杯子垫。

  "总武线。"她说。

  "嗯？"

  "从千叶上车，坐到新宿。我去接你。"

  "谁接谁。"

  "我接你们。早稻田那一站出来就是明治通り。往前走三分钟有一家老式吃茶店。红茶不甜。咖啡是炭烧的。座位靠窗。"

  "你怎么知道。"

  "考完共通テスト那天，我自己去了一趟。考场在早稻田。考完了，在周围走了一圈。"

  八幡看着她。"还没合格就去踩点了。"

  "不是踩点。"她说。"是确认。确认那个地方真的存在。确认从车站到校门的路上，有一家吃茶店。"

  雪乃把地图折回去。她折得很整齐，沿着原来的折痕，一条一条压平。

  "交通费。"她说。

  "什么。"

  "总武线从千叶到新宿，单程大约一千三百円。千叶到国立——大约一千八百円。这不是可以每天往返的距离。需要计划。"

  "雪之下，你在算大家的交通费。"

  "费用是客观条件。"雪乃说。"如果忽略客观条件只谈感情，和以前的我有什么区别。客观条件必须算——算了才能知道怎么安排。"

  "算完之后呢。"

  "每周一次。或者两周一次。频率不固定，但约定固定——比如每月的第一和第三个周末。具体的日子，群聊里提前一周确认。"

  结衣听出了什么。"小雪乃，你是不是已经在心里排好表了。"

  "没有排好。"她说。"但方向是一样的——先算客观条件，再谈感情。这是这两年学到的。"

  八幡把MAX咖啡的空罐子放在桌上。罐子在千叶地图上投了一个短短的阴影。

  "千叶。"

  "什么。"

  "千叶到国立。千叶到新宿。千叶到横滨。不是只有一条路。"他说。"是从千叶出发，去哪里都可以。"

  "这是比喻。"

  "也是事实。总武线往东京方向，第一站就是千叶。"

  窗外的风变大了。记录簿的纸角从习题册底下挣脱出来，翻了一页，停在某一页的空白处。上一页写着昨天那个一年级的咨询——"怎么判断一个人是喜欢你，还是只是对你好。"

  结衣把一颗巧克力放在地图中间。还是心形的，锡纸包着。

  "庆祝。"她说。"庆祝不是同校。庆祝从千叶出发，去哪里都可以。庆祝我自己一个人跑去横滨学怎么对小孩子好。庆祝小雪乃——说'高兴'。"

  "庆贺标准很宽泛。"雪乃说。

  "对！宽泛才能一起吃巧克力！"

  拉芙希妮拆开锡纸，折成一小块正方形的箔，放在桌角。她把巧克力掰成两半，一半放进了杯子旁边的碟子里。

  八幡拿起另一半，嚼了。"甜的。"

  "今天是甜的。"拉芙希妮说。

  雪乃合上记录簿，在新一页写了今天的日期。基本事项空着。她想了想，写了四个字。

  "各自出发。"

  结衣凑过来看。"这是委托。"

  "是。"

  "谁的委托。"

  "我们。"雪乃说。"委托事项——带着这两年的所有东西，去往不同的方向。确认关系可以不依赖同一间教室。"

  "受理中。"八幡说。

  "受理。"结衣说。

  拉芙希妮把椅背上的围巾取下来。"受理。"

  窗外的风停了。三月六日。总武线往东京方向的电车，这个时间段，每七分钟一班。
