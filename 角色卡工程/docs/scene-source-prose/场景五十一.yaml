场景: 51
幕: "第三幕·二学期"
时间: "2013年12月上旬 · 一色选举日（推定 12月6日周五）"
地点: "总武高操场（后山方向） → 体育馆（选举演讲会场）"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、一色彩羽、城廻巡（+背景人群：全校学生）"
正文: |
  冷风顺着空旷的操场卷起一地微尘，打断了两人之间那阵几乎凝固的沉默。

  比企谷八幡没有再去欣赏一色彩羽咬着下唇的样子。他用沾满灰尘的右手撑了一下冰冷的水泥地，借着力道从那种狼狈的瘫坐姿态中站了起来。

  膝盖上的钝痛感还在一阵阵地往上涌，但他完全没有理会。他随意地拍打了几下裤腿上沾染的泥土，动作有些敷衍，那副死鱼眼里依然没有半点想要为刚才的扑街挽回体面的意思。

  或者说，在抛出那个让一色无路可退的方案后，那点微不足道的颜面早就失去了讨论的价值。

  八幡将手伸进西装外套的口袋里，摸索了两下，然后夹出了一张折叠过几次的便签纸。那是他在教员室外走廊的自动贩卖机前构思计划时，随手用圆珠笔在废纸上勾勒出的核心思路。

  他伸出手，将那张带着折痕的纸片直接递到了距离一色视线不到半米的位置。

  "这是框架草稿。"八幡用那种干得几乎挤不出水分的声音说道，"里面只列了几个最离谱、也最容易引起反感的方向。你不需要自己去填充细节。"

  一色彩羽的视线盯着那张递到面前的纸条。

  她原本还残留着一丝想要垂死挣扎的狡辩，比如用"我根本不会写这种东西"或者"我文笔很差"来逃避这份沉重的执行成本。但眼前这张凭空出现的草稿，就像是一记精准的闷棍，提前将她所有可能的借口都堵了回去。

  "你只需要装出一副'我有很好的想法但不知道怎么写'的苦恼样子，去找那些平时围着你转的男生抱怨两句。"八幡的语气平淡得像是在布置作业，"自然会有人为了表现自己，争先恐后地替你把这些不切实际的梦想润色成一篇华丽的雄文。你连笔都不用动。"

  他连她可能遇到的执行困难都算计在内，并且给出了最符合她日常行为逻辑的解决方案。

  一色彩羽咬紧了嘴唇，几乎能在下唇上看到泛白的齿印。

  她的胸口因为急促的呼吸而微微起伏。在过去十分钟里，她那引以为傲的、用来在各个圈子里游刃有余的伪装和心机，在这个死鱼眼学长面前被一层层地扒开、拆解，最后连皮带骨地塞回给她一份无法拒绝的毒药。

  可是，她真的无法拒绝。

  因为只要她还想保住那个"努力但不幸落选的乖巧后辈"的人设，只要她还不想真的去当那个麻烦的学生会长，这就是她唯一的、也是最完美的退路。

  操场上又一阵冷风扫过。

  最终，一色彩羽那只一直紧紧攥着运动包带子的手松开了。

  她以一种极为缓慢的、带着明显僵硬和不甘的动作，抬起手，用两根手指从八幡手里抽走了那张便签纸。指尖交错的瞬间，八幡能清楚地感觉到她用力时带来的绷紧的阻力。

  "……前辈。"

  一色彩羽捏着那张轻飘飘的草稿，微微低着头。当她重新抬起视线时，那双黄色的眼瞳里没有了无辜，也没有了刚才的慌乱，而是蒙上了一层清晰的、带着一丝愤恨的复杂情绪。

  "你这个人，性格真的很差劲呢。"

  ——

  室内的暖气将体育馆里积聚的几百人的体温烘托得有些燥热。

  站在主席台聚光灯下的一色彩羽，双手握着麦克风，那张被精心修饰过的可爱脸庞上，正绽放着毫无破绽的、充满干劲的乖巧笑容。

  "……所以，我希望总武高不仅仅是一个学习的地方，更应该是一个能让大家留下无悔青春的乐园！"

  她清脆软糯的声音通过劣质的扩音音箱传遍了整个场馆，甚至连尾音都带着某种计算好的激昂。

  "如果我能有幸成为学生会长，我将致力于推动全面增加各社团的活动预算！同时，我也会向学校理事会提案，争取在特别栋的顶楼天台上，为大家申请修建一个露天的休息咖啡吧，让大家在紧张的课业之余，拥有更自由的交流空间——！"

  台下瞬间爆发出了一阵雷鸣般的掌声，混杂着一二年级男生们甚至有些狂热的口哨声。

  那些由比企谷八幡在废纸上随手写下的、根本不可能实现的"华丽高墙"，被一色彩羽用一种近乎天真的热情包装后，变成了一颗颗包裹着糖衣的完美毒药，成功地在这个容易被气氛煽动的场馆里引爆了狂热。

  奉仕部的众人站在体育馆靠后的边缘区域，冷眼旁观着这场荒诞的狂欢。

  "哇……一色学妹真的好厉害啊。"由比滨结衣被周围的气氛感染，不自觉地压低了声音，语气里带着一丝惊叹，"但是，那些事情……真的能做到吗？天台上的咖啡吧什么的，理事会肯定会否决的吧？"

  "因为根本就没打算做到。"比企谷八幡靠在冰冷的墙壁上，死鱼眼百无聊赖地看着台上那个享受着追捧的学妹，"提出一个所有人都渴望、但又显然超出当前学生会权限的离谱目标。当这个目标太过耀眼时，大家只会赞赏她的抱负，而没有人会去追究可行性。等到最后因为'想法太过超前'而落选时，她依然是那个怀抱梦想却生不逢时的悲剧英雄。"

  他把目光从主席台上收了回来，声音干瘪。

  "她只是在把那份手稿的作用发挥到了极致而已。台下的这群家伙，全都是她为了保全体面而煽动起来的群演。"

  在这个距离，他们听不清一色接下来又说了什么细节上的煽情话语，只能感觉到周围空气里不断升温的狂热。那是一种让人感到呼吸不畅的、虚假的集体共鸣。

  拉芙希妮·都柏林安静地站在结衣的右侧，浅金色的长发在昏暗的后排光线下显得有些黯淡。她没有立刻接话，而是用那种像是在评估某件商品价值的冰冷目光，注视着台上那个正在鞠躬的背影。

  "很熟练的煽动手段。"

  两秒钟后，拉芙希妮那略带疏离感的声音才在喧闹中响起，像是切割过热空气的一把钝刀。

  "但她把所有的筹码都压在了'画出的饼足够大'这一点上。在这个封闭的环境里，人们会被情绪裹挟而给出掌声。但是——"她停顿了一下，右手习惯性地摩挲了一下左手腕上那条雪乃借给她的红绸带边缘，"但是，如果她被这样推到幕前……"

  那句话没有说完，拉芙希妮把后半段留在了体育馆过于喧闹的空气里。

  雪之下雪乃站在最边缘的位置。她今天穿着标准的制服，黑色长发柔顺地披散在肩后。她没有看向台上的狂热，也没有参与八幡和拉芙希妮的剖析。她只是静静地用指尖压着校服外套的边缘，那双深蓝色的眼瞳里没有流露出任何多余的情绪，像是一面拒绝映照出任何虚伪狂欢的镜子。

  随着一色彩羽结束了演讲，深深鞠躬走下主席台，场馆内的气氛被推向了最高潮。

  一色彩羽的身影彻底退入幕布后的阴影区，体育馆主席台上的麦克风立刻被移交给了现任学生会长城廻巡。

  这位三年级的学姐走到聚光灯下，比起刚才那场几乎要掀翻顶棚的狂热煽动，她的致辞显得温和、平缓，充斥着老套的场面话。她用那种特有的、能让人不自觉放松下来的语调，说着一些关于"青春"、"责任"和"传承"的空泛词句。

  那种被称为"巡巡能量"的奇特气场，就像是一块海绵，吸收了台下因为一色的空头支票而蒸腾出的多余热量，神奇地将场馆内的躁动安抚成了一种有序的平静。

  比企谷八幡的目光越过攒动的人头，盯着台上那个留着整齐刘海的学姐。

  城廻巡这种毫无信息量的发言，在以往只会让他产生想找个角落睡觉的冲动。但此刻，那些空洞的词句却像是一把钥匙，瞬间拧开了刚才那个被拉芙希妮完美闭环的逻辑锁。

  拉芙希妮剖析的"选票落空"确实无懈可击，但那必须建立在一个前提之上——这是一场存在有效竞争的真正选举。

  可是，把一色彩羽推上台的，正是这位擅长凝聚人心的现任会长，以及那个能在幕后影响流程的平冢老师。

  如果平冢老师和城廻学姐从一开始就铁了心要让一色接班，那么这场选举根本不需要什么高转化率。在没有出现任何具有碾压性优势的竞争对手时，那些被零星煽动起来的选票，加上城廻巡在暗中提供的隐性背书，足以稳稳地将一色推到那个位置上。

  八幡的视线从主席台移开，落在了身侧的拉芙希妮身上。

  这个有着浅金色长发的英国女生，依然保持着随意的站姿，目光平静地注视着台上的权力交接。

  他终于看清了"华丽高墙"计划最底层的冰冷建筑——如果一色最终被强行推上位，这个方案就等同于亲手在她的背后垒起了一道无法回头的铁壁。因为她刚才在所有人面前当众许下了无数耀眼的承诺，当她上位后，哪怕累到崩溃，也连一句"我不够优秀"的推脱借口都无法再说出口。

  这根本不是在帮委托人体面落选。这完全是在替城廻巡和平冢静，将那只习惯逃避的小狐狸彻底关进名为"责任"的笼子里。

  "你其实，早就知道会是这种结果了，对吧？"

  八幡的声音比刚才压得更低，那些原本散漫的语调此刻因为看透了真相而变得有些干涩。

  拉芙希妮没有转头，但那双看着前方的翡翠色眼瞳中，原本散漫的光影发生了细微的聚拢。

  "你刚才说那些人拿到选票时会变得理智。"八幡没有给对方掩饰的时间，直接把那条致命的逻辑链扯了出来，直视着她的侧脸，"但在这场根本没有其他像样竞争者的选举里，理智只会让他们勉强选一个看起来有靠山的人。城廻学姐和平冢老师，才是兜底的那个选票池。"

  他停下话音，将那个最核心的猜测扔了出来。

  "你给出的方案，不仅没有帮她落选，反而是在配合教员室里那两位的意图。你借着那个华丽的纲领，顺手替她们斩断了那家伙以后所有可以用来逃避的借口。我说错了吗？"

  拉芙希妮听完了他这番连珠炮似的推演，原本垂在身侧的手指轻轻收拢了一下。

  那个系在她右手腕上的烧焦丝带，随着手指收拢的动作，在冬季校服外套的布料边缘若隐若现。

  随后，拉芙希妮慢慢转过了头。

  她的视线不偏不倚地迎上了八幡的目光。那双翡翠色的眼瞳里，没有什么被看穿阴谋的阴郁，只有一种外科医生般的绝对冷静。

  接着，她的唇角微微向上牵动了一下。那甚至算不上一个笑容，更像是一种用来阻断追问的社交性动作。

  "比企谷同学，你把我想得太复杂了。"

  她的声音依然压得很轻，但在刻意拉开的距离感下，字字清晰。

  "我只是一名碰巧在活动室里的留学生而已。我提供的，不过是一张写着几个简单设想的白纸。"

  她没有承认八幡推导出的那层配合官方兜底的恶毒逻辑，但也没有否认，只是用最无懈可击的外交辞令，将所有的责任都切割了出去。

  "是她自己选择了接过那张纸，也是她自己选择了站上那个聚光灯下的主席台，更是她自己，用最完美的演技向全校许下了那些不可推卸的耀眼承诺。"拉芙希妮的视线越过八幡的肩膀，扫过台上依然在用"巡巡能量"控制节奏的城廻巡，"如果大人们的期待、群体的狂热，以及候选人本身的虚荣心，在这个方案下刚好达成了一种各取所需的平衡。那么，这一切就只是顺理成章的'选择'而已。"

  八幡看着她，感觉胃里像坠了块冰冷的硬物。

  这种模棱两可的态度，在现在的语境下，比直接承认还要让人感到棘手。她把自己摘得干干净净，仿佛那个精密计算了退路、垒起绝望高墙的人不是她，而她只是一个冷眼的观测者。

  但也就是这份滴水不漏的切割感，让八幡彻底确认了这个猜测的真实性。

  还没等八幡继续开口说些什么，主席台上的广播喇叭里传来了一阵轻微的麦克风摩擦声。

  "那么，"城廻巡的声音重新响起，那种温和的语调里带上了一丝流程进入下一个阶段的确定感，"本届学生会长选举的演讲环节到此结束。请各班班长开始分发选票。"

  这句话就像是一个解除静止状态的指令。

  原本在城廻巡安抚下保持安静的场馆瞬间喧闹了起来。周围一二年级的学生开始交头接耳，班长们拿着一沓沓白色的选票纸，开始在人群的缝隙中穿梭分发。

  那些刚刚被狂热包装、即将面临理智冷却和官方兜底的选票，正在一张张地发放下去。

  雪之下雪乃从台上收回了视线。

  她没有像结衣那样去看班长走近的方向，也没有像八幡那样去研究墙壁上悬挂的横幅。那双深蓝色的眼瞳先是极短地扫过拉芙希妮那只仍垂在身侧的右手，然后极短地、几乎难以察觉地在拉芙希妮的侧脸上停留了半秒。

  然后，雪乃才把视线转开，去接手里递过来的选票。
