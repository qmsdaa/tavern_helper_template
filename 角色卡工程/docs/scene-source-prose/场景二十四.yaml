场景: 24
幕: "第二幕·暑夏·林间学校"
时间: "2013年8月中旬 · 暑假中段"
地点: "千叶市 MARINPIA 商场 → 稻毛海岸站附近"
人物: "拉芙希妮·都柏林、由比滨结衣"
正文: |
  那条来自由比滨结衣的短信，是在上午十点准时跳出来的。
  "拉芙希妮酱！今天有空吗？我们去 MARINPIA 吧！我想买点东西，你陪我好不好？"
  拉芙希妮盯着那条充满了感叹号和波浪线的文字，停顿了将近半分钟。昨天下午，她刚刚才在行政酒廊里，用冰冷的语调向温斯顿将这些人定义为"观察样本"。而在二十四小时不到的时间内，这个"样本"就用一种毫无防备的热情，直接敲开了她极力维持边界的门。
  最终，她还是答应了。

  下午的 MARINPIA 商场内冷气开得很足。一路上，她们逛了饰品区、文具店以及几家卖轻薄夏装的店铺。拉芙希妮始终保持着一种得体但不至落后的步调，走在结衣的左侧。大部分时间里，她只是安静地听着结衣分享那些零碎的日常话题，偶尔给出简短的附和。
  直到她们走进一家光线明亮的帽子专卖店。

  由比滨结衣在货架前停下，拿起一顶带有浅色缎带的宽檐草帽戴在头上。她理了理两侧稍微有些卷曲的粉色鬓发，然后在试衣镜前转了半个圈，随即面朝拉芙希妮，双手背在身后。
  "好看吗？"结衣问，琥珀色的眼睛里带着轻松的期待。

  对于普通的高中女生来说，这只是一个用于维持交流气氛的常规提问，标准答案通常是一句轻快的赞美。
  但拉芙希妮并没有立刻回答。
  在长期的礼仪训练中，"发表评价"从来不是一件可以随意糊弄的事情。她站在两步之外，视线先是落在了草帽的编织纹理上，接着扫过那条用来点缀的浅色缎带，最后才将这顶帽子的整体线条与由比滨结衣本人的脸型、发色以及今天穿着的元气私服进行了综合比对。
  这个过程大概持续了三秒钟。
  在这三秒里，她翡翠色的眼眸里没有一丝敷衍，完全是在进行一项严肃的评估。

  "好看。"
  在确认了这顶帽子确实符合对方的气质后，拉芙希妮用一种十分稳定、清晰的声音给出了结论。

  由比滨结衣看着她那副近乎苛刻般认真的表情，突然扑哧一声笑了出来。那笑声清脆明朗，肩膀也跟着轻轻颤动。
  这显然并不是因为那句简单的"好看"而产生的虚荣或喜悦，而是因为她发现，面前这个平时总是显得有些难以接近的留学生，居然会为了这样一个随口抛出的问题，调动起犹如对待考试般的全副精神。这种将微小的日常无限放大的认真，在结衣眼里，呈现出了一种难以言喻的可爱。

  她看着结衣脸上那种毫无保留的、灿烂的笑容，试图解析对方突然发笑的原因。她的评价完全建立在客观事实之上，没有贬低，没有违规，语气也足够真诚。
  在拉芙希妮目前的认知系统里，她并不明白，刚才那三秒钟的认真，究竟触碰到了哪条会引发笑意的规则。

  经过近两个小时的步行，她们走出了 MARINPIA，在靠近稻毛海岸站的一处露天长椅上并排坐下。
  由比滨结衣跑去附近的甜品站，买了两杯底部带有气泡水的冰淇淋。她将其中一杯塞到拉芙希妮手里，自己咬着那根塑料小勺，看着远处逐渐染上橙黄黄昏的天际线。
  微凉的海风吹过，结衣转过头，琥珀色的眼睛直视着旁边的人。
  "拉芙希妮酱。"她叫了她的名字，语气很轻，"你今天开心吗？"

  拉芙希妮捧着那杯冰淇淋，手指悬停在杯壁上。
  这是一个她完全不知道该如何处理的词汇。
  在爱布拉娜构建的家族面谈体系里，"开心"是一个不被允许存在的虚假指标，那意味着软弱和精神涣散；在昨天行政酒廊的评估里，温斯顿问的是"她们对你好吗"，那是一个旨在测算生存环境安全系数的额外参考项，本质上依然是权力的衡量。
  但由比滨结衣问"开心吗"，仅仅是因为她想知道。这里没有陷阱，没有评估，没有隐藏的记分牌，这只是一种纯粹的、属于朋友之间为了确认情绪温度的简单问法。

  这才是最让拉芙希妮感到手足无措的地方。
  她张了张嘴，舌尖已经习惯性地抵住了牙齿。按照她的生存经验，最标准、最无可挑剔的答案应该是"还好"，或者是"并不讨厌"。那是一种可以随时撤退的安全距离。
  但她侧过脸，看到由比滨结衣手里还捏着那把塑料小勺，眼神没有躲闪，是真的在原地等待她的回答，不是等待敷衍，也不是等待顺从。
  "……开心。"
  拉芙希妮说。声音比平时低了半度，干涩，却没有任何修饰。

  十五分钟后，她们走向了返程的检票口。
  在进入车站前，由比滨结衣突然拉着她停在了一家杂货铺前，买下了一对普通的、边缘带着一点廉价塑料光泽的粉色夹子发卡。结衣把其中一个别在了自己头发上，将另一个强行塞进了拉芙希妮的手里，笑着说了一句"我们一对哦"，然后便挥手去赶相反方向的电车。

  拉芙希妮独自站在检票口前，手里攥着那个轻飘飘的小东西。
  她低头看着它，陷入了长达一分钟的茫然。她不知道这个东西应该被安放在哪里。
  在这个世界上，她拥有严格的情感物品收纳体系。那个随身携带的包的暗层，是用来放雪之下雪乃那张写有联络方式的表格的——那是名为"选项"与"退路"的保险柜；公寓里那个珍藏的抽屉，是用来放那包熊猫面巾纸和旧钢笔的——那是名为"被爱过的物证"的陈列室；而那本从不离手的英文诗集（圣经），夹着从雨后走道捡起的种子——那是用来存放"隐秘反叛"的容器。

  可手里这个东西，好像哪一层都不是。
  它不能保命，不能当做退路，也没有承载那种让人窒息的、沉重的恩赐。
  它只是一个粉色的、廉价的、结衣不由分说塞给她并且宣布"我们是一对"的无用之物。它轻得没有重量，却又烫得无法被随意丢弃。

  进站的广播声响起，拉芙希妮没有打开背包的拉链。
  她默默地收拢手指，将那个粉色的塑料发卡，放进了自己长裤侧面——那个最贴近皮肤、最靠近身体的口袋里。
