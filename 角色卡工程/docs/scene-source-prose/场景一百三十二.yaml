场景: 132
幕: "第九幕·以自己的名字委托"
时间: "2015年1月23日 · 周五"
地点: "伦敦·都柏林家族宅邸（议事厅→二楼小餐室）"
人物: "拉芙希妮·都柏林、爱布拉娜·都柏林、布丽吉特·都柏林（主持见证）、外部律师（记录）"
POV: "拉芙希妮"
正文: |
  一月二十三日，上午九点差五分，议事厅只摆了四副杯碟。

  主持位，布丽吉特姨婆。记录席，律师，速记本摊开。周二他说的是旁听席；这项议程的记录，长老会委托给了他。执行层席位，爱布拉娜，今天只有一只深色档案夹，没有文件摞。

  拉芙希妮的席牌换了。三天前是"申请人"，今天是"关系人"。布丽吉特事先跟她说明过：今天的议程，她可以听，可以不说话，可以中途离场。

  九点整，开始。

  "第二项议程。"布丽吉特说，"档案更正与责任认定。执行层主动提交，长老会委托本人主持见证，外部律师记录。先宣读旧档。"

  她翻开一册旧卷宗，纸页发黄。

  卷宗的书脊上贴着年份标签，一年一换色。这一册的颜色，属于两年前。

  "达洛维，原都柏林家家庭教师。家族内部定性——"她念，"Outcast，叛离者。"

  "更正。"

  爱布拉娜的声音不高，两个字钉得很稳。

  "达洛维小姐。"

  拉芙希妮的指尖在膝上收了一下。

  去年八月，二楼书房。她请姐姐叫这个名字，叫一次就好。姐姐看着她，很久，没有叫。

  今天它从同一张嘴里出来了，落在议事录的纸面上。

  "她的姓名，达洛维小姐。"爱布拉娜说，"家族内部'Outcast／叛离者'之定性，自今日起撤销。请记录。"

  律师的笔在走。布丽吉特点头："记录在案。"

  "责任认定。"爱布拉娜打开档案夹，"我的陈述，分四条。"

  "第一条。二〇一三年那场火，不是我放的。我没有制造罢工，没有指使煽动者，没有命令任何人纵火。事后的全部调查，包括保险会社的独立报告，都没有推翻这一点。今天，我也不请求任何人推翻它。"

  "第二条。视察日前十天，安保顾问公司提交风险升级评估：罢工集会混入外部煽动者，现场发现可用于纵火的器材，建议延期或变更路线。评估送到我的桌上，我读了。批复栏里那一句——'行程维持。按原计划执行。'是我签的。"

  "第三条。《视察警备配置命令》第三条：安保力量在外围部署警戒，未获视察负责人明确授权，不得进入视察区域。签发人，是我。这条命令把本该进去的人，留在了外面。"

  "第四条。起火后约四分钟，达洛维小姐进入现场。我的安保获得授权时，已经超过可介入窗口约十一分钟。她护住了拉芙希妮。她没能出来。"

  四条读完，档案夹合上。

  拉芙希妮坐在关系人席上，一条一条听完。

  去年八月，二楼书房，台灯只照亮桌面的一个角。这些条目，每一条都是她宣读的，姐姐坐在那片光后面听。同一些事实，从签过那些名字的人嘴里，一条一条出来。

  四条，和报告上的顺序一样。

  议事厅里只剩壁炉的声音。律师的笔停着，等下一段。

  "动机的认定。"爱布拉娜说。

  她把双手交叠，放在桌面上。

  "事后两年，我给自己的记录是：一次可控的锻炼，一份必要的资历，一次判断失误。今天，这段记录作废。"

  "真正的动机是，我需要她。"她说，"我需要一次危险，让她在获救之后重新依赖我。我判断自己能够结束它，所以我允许它走近她。那不是保护。是我需要她，继续需要我。"

  "判断失误四个字，从今天起从档案里拿掉。换上刚才那几句。"

  拉芙希妮望着桌面。

  玻璃柜。垫棉纸。一只缝过耳朵的熊。

  她把这个念头按住了，按回它原来的地方。

  "更正与补偿，四项。"爱布拉娜的声音回到议程的干燥。

  "一、内部档案修正。恢复达洛维小姐真实姓名。记录：她在二〇一三年产业区事故中，保护拉芙希妮·都柏林，并因此死亡。"

  "二、风险升级评估、《视察警备配置命令》、保险调查报告，三份文件永久保存。任何人不得以任何理由销毁或改写。本次责任认定记入议事录，同样永久保存。"

  "三、达洛维小姐遗产接收方的确认，已委托律师进行。确认存在，即向合法接收方补发正式赔偿。赔偿只修复制度欠账，不抵消死亡，也不构成赎罪的完成。"

  "四、政治责任，由本人承担。本认定抄送家主及全体长老，纳入年度述职。执行层权限的进一步检讨，另行提交长老会。"

  她说完，把档案夹推过桌面中线。

  "以上，请长老会验收。"

  布丽吉特逐项核对，在每一页下角签字。签完，她把认定书推给拉芙希妮。

  "关系人过目。"她说，"你可以不签。"

  拉芙希妮接过来，从头读到尾，读得很慢。每一条都是她已经知道的事实，去年八月那份报告上都印着。但油墨印着的，和这个人亲口说出来的，是两种东西。

  她把文件推回去。

  "我不签。"她说，"我确认，我读过了。"

  布丽吉特看了她一眼，没有追问。

  她把认定书装回卷宗，在封口签名，注明日期。这一册不进档案中心，进长老会的永久保存柜。

  "记录完毕。"她合上卷宗，"第二项议程结束。"

  律师收好速记本，先走了。布丽吉特走到门口，停了停，回头看了一眼还坐在原处的姐妹两个，什么也没说，带上了门。

  拉芙希妮没有回三楼。

  她沿二楼走廊走到小餐室。餐室的茶柜是旧式的，有人新添过水，壶还温着。她在靠窗的圆桌前坐下，没有开灯。

  门响了一下。

  爱布拉娜走进来，在门口站了站，走到圆桌的另一侧，坐下。

  茶壶在桌子正中间。

  壶是满的。两只杯子，一左一右。拉芙希妮看着壶口的热气，没有伸手。爱布拉娜也没有。

  窗外是伦敦一月的灰。餐室里没有钟，楼下老宅钟的整点隔着地板传上来。今天敲了几下，她没有数。

  走廊上有人经过，脚步声远了。壶嘴往外出着很细的热气。

  谁都没有提刚才的议程。

  最后伸手的是爱布拉娜。

  她提起壶，先注满拉芙希妮面前那杯，再注满自己的。水流很稳，没有溅出一滴。注完，壶放回原位。

  她把糖罐从桌角拿起来，放到桌子正中。

  "糖在这里。"

  拉芙希妮看着那只糖罐。从前在这张桌子上，糖是别人替她放好的，连数目都替她算过。

  她拿起茶匙，舀了两块，看着它们沉下去。茶匙搁回碟子上。

  爱布拉娜也舀了糖。那个分量，是她独处时的分量。今天她当着另一个人的面，舀了进去。

  拉芙希妮端起杯子。杯壁的温度透过指节。不烫，正好入口。

  甜的。

  海德公园的甜点店。肯辛顿的天鹅。一个不惜弄脏裙子也要替她偷藏甜点的人。那个人此刻坐在桌子对面，手里端着同样甜度的一杯。

  这两种甜，在她的味觉里是同一种。她分不清的那一种。今天也不打算分清。

  这杯茶不解决任何事。原谅在哪里，以后怎么办，她都不知道。

  这是姐姐给她倒的茶。从前那些杯，要么是她端给姐姐的，要么是姐姐连同安排一起放到她面前的。

  第二口比第一口甜。糖沉在杯底，化得慢的那一部分，都留在了后段。

  杯子放回碟子，很轻的一声。

  "周一我要收拾行李了。"拉芙希妮说。

  "嗯。"爱布拉娜说。

  "周二上午十点的飞机。"

  "路上——"爱布拉娜起了个头，又收住，"茶还温着。喝完再上去。"

  两个人都没有再说话，把各自那杯喝完了。

  壶里的茶还剩着半壶。谁也没有再续。

