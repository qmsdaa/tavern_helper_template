    regression: 迷你EJS渲染器断言五种形态（DLC双战役7条事实+苇草排除/主线POV场景50门槛不漂移/场景123非拉芙替代段保留/free模式静默）；build_scene_index --check与verify_v060_contracts全过
  save_table_migration:
    gap: 旧档迁移只提交stat_data；shujuku(ACU)表格存于chat_metadata.TavernDB_ACU_InternalSheetGuide/ScopedConfig，迁移后归零
    fix: 解析侧提取ACU两键（不携带__chatId旧绑定）→便携存档格式state.table_sheets可选字段（版本不升，缺失等价旧格式）→commit写入SillyTavern.chatMetadata并将__chatId改写为新聊天ID→saveMetadata落盘→存在性校验→失败时内存级回滚（落盘失败不升级为回滚失败）
    ui: 迁移预览新增“数据库表格”行；修复SaveImportScreen三级stretch链（.save-import补align-items:flex-start、.import-card补height:fit-content、footer补align-items:center），按钮恢复胶囊形、不再出现竖椭圆/正圆畸变
    tests: save.test.ts新增3例（jsonl提取不含绑定键/迁移写入+chatId改写+失败回滚/无metadata-deps降级兼容），连同存量14例全过；手机shujuku桥12例回归全过
  save_table_migration_metadata_hotfix:
    bug: 迁移旧档在部分酒馆环境报 `Cannot read properties of undefined (reading 'TavernDB_ACU_InternalSheetGuide')`，迁移完全失败
    root_cause: "SaveImportScreen 传 `getChatMetadata: () => st.chatMetadata`，而 `SillyTavern.chatMetadata` 在部分版本/时机下为 undefined；resumeCommit 的 `meta[key]`（快照/写入/校验/回滚四处）均未防空，直接抛 TypeError"
    fix:
      - resumeCommit 统一走 readMetadata() 空安全读取；getChatMetadata 返回 undefined/null 时与"未提供 deps"同等对待（canMigrateTables=false），stat_data 迁移不受影响，不崩溃，console.warn 说明表格未迁移
      - SaveImportScreen 元数据来源加固：优先 `st.chatMetadata`，缺失时回退 `st.getContext?.()?.chatMetadata`（酒馆扩展通用取值路径），两者皆空则省略表格 deps
    tests: save.test.ts 新增2例（getChatMetadata 返回 undefined+tableSheets 存在→优雅跳过表格且 stat_data 照常写入/不做任何 mutator 调用崩溃；getChatMetadata 返回 undefined 且表格迁移成功路径不变），连同存量全过
    deploy: 前端工程推送 tavern_helper_template 后更新开场白/状态栏 CDN pinned commit（开场白挂载.js/.template.js），重新 configure+pack 出包
  save_table_migration_checkpoint_hotfix:
    bug: 数据库表格仍无法迁移——旧档 sqlite/消息持久化模式下 chat_metadata 的 InternalSheetGuide 只有模板表头，真实数据行在楼层消息的 TavernDB_ACU_IsolatedData[''].storageFrame.checkpoint.data；且迁移写入 chat_metadata 后插件运行时不会自动重载，手机端看不到表
    root_cause: 解析侧只提取 chat_metadata（guide 无数据行）；提交侧只写 chat_metadata（sqlite 模式不读）；插件提交模型要求存在 AI 楼层，迁移期无 AI 消息无法直接持久化
    fix:
      - 解析侧新增 extractCheckpointSheetData：倒序扫消息取最新 storageFrame.checkpoint.data（插件格式 mate+sheet_*），并入 tableSheets 新键 TavernDB_ACU_SheetData（便携存档兼容，版本不升）
      - 提交侧新增 importTables 通道（best-effort 不阻断）：SaveImportScreen 解析 window.top.AutoCardUpdaterAPI，调 importTableAsJson 持久化导入，失败降级 {mode:'restore'} 保证运行时立即可见；chat_metadata 双写兜底 native 模式
      - 挂载器新增延迟持久化：commit-done 携带 tableSheets，首条 AI 回复落地后（/trigger 完成后轮询 AI 楼层）调 importTableAsJson(persist) 正式持久化，CHAT_CHANGED 取消暂存
    tests: save.test.ts 新增3例（checkpoint 提取/插件格式转换优先级/importTables 通道调用与失败容忍），连同存量全过；shujuku 回归全过
    deploy: 前端工程推送后更新 CDN pinned commit，重新嵌入+pack 出 hotfix10
    deployed: |
      hotfix10 已出包（Counterfeit-v0.6.0-hotfix10-20260817.png，11.98MB）。
      状态栏 src/config 已于 2026-08-17 由用户侧改为自包含构建（webpack.statusbar.config.ts externals=undefined），
      本次嵌入的状态栏为新构建（281KB）；clone 已暂存 5 个 dist 变更待推送，推完更新 .template.js 的 pinned commit。
    deployed_hotfix9: |
