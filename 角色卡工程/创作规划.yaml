world:
  overview: |
    现代日本千叶县千叶市，2013年5月至2015年3月。
    AU世界线：比企谷八幡、雪之下雪乃、由比滨结衣三人已历车祸+冷战+"伪善"冲突。表面危机已暂时收束，
    三人重新回到奉仕部，但形成冲突的根源并未消失——他们知道旧方法有问题，却还没学会新的相处方式。
    英国转学生拉芙希妮·都柏林（Loughshinny Dublin）加入的不是一个已经完成修复的三人组，
    而是一个刚刚停止破裂、仍在重新学习关系的三人组。
    最高主线（2026-08-05 重构）：四主角（八幡/雪乃/结衣/拉芙希妮）青春群像——
    "人在关系中受伤后会发展出保护自己的防御方式；这些方式曾救过他们，也会伤害最不愿失去的人。
    修复不是让创伤消失，而是不再让创伤自动替自己作出所有选择。"
    奉仕部"提供帮助，而非代替完成"保留为剧情检验机制；拉芙家族线为主要外部事件线，但不再是唯一完整的内部成长线。
    双模式：POV剧本模式（扮演四主角之一走150场剧本）／自建开放世界（自建角色平行世界）。

  au_canon_divergence:
    note: 2026-08-05 用户确认的AU前史定义（与原作分歧点，条目写作以此为准）
    伪善事件: 高中开学第一天，八幡为救结衣的狗被雪乃家的车撞进医院→八幡因此被同学孤立；雪乃事前被塑造为正义感十足的人，却对车祸知情而装作不知情→八幡据此称她"伪善"。这是八幡不信任的具体锚点，也是三人冷战与磨合期的来历
    恋爱线: 不预设原作三角恋走向；恋爱全部由玩家驱动的MVU关系变量（bond/romance/commitment）决定，主线不为任何配对背书
    爱布拉娜权力: 以性格调色盘为准——有操作权无最终决策权（决策在长老会）；她有权力，也被权力控制。基础信息等条目不得写成"实权掌控"
    语料阶段守卫: 2026-08-05起约定——各角色三面性"语料"须按当前阶段过滤使用，标注阶段的语料未达该阶段不得引用；新增语料必须标注可用阶段
    成长里程碑守卫: 2026-08-05 重构起——四主角人格阶段由 stat_data.arc_milestones 事件旗标驱动（0/1-2/3 旗标→前/中/后期，拉芙 0/1/2/3-4）；current_scene 只决定"哪些事件可能发生"（物件/称呼/场景门槛照旧），bond 只决定亲密程度；二者均不再自动发放人格成长。语料阶段标注绑定对应旗标，EJS 加载条件真隔离，不靠模型自律。arc_milestones 缺失的旧存档回退原 scene/bond 逻辑（deprecated）
    主线重构_20260805: 四主角群像化——十幕外壳/150场编号/日期/大事件不变；二幕主导改结衣、三幕八幡、四幕雪乃、六幕四人共同失败（场景93-101重写）、八幕结衣、十幕群像；详表见 docs/restructure/02-重构计划-20260805.md 与 03-场景主导权矩阵-20260805.md
    关系政策_20260805: 删除角色攻略星级制度；雪乃初见拉芙 romance 恒为 0（初见注意记 known/bond/叙事备注）；默认单一恋爱承诺，多边须经所有相关角色明确知情与协商，不允许多个"恋人"commitment 静默并存
    一色定位_20260805: 一色彩羽是第五可攻略角色，不是第五POV主角——四选一POV系统不变，禁止扩展为五选一；不进一色未公开内心（非POV不写内心直陈）。新增 stat_data.iroha_milestones 三旗标（rejected_profitable_solution／made_uncalculated_request／stated_desire_without_performance）·外部证据制·不按场景编号自动置位·恋爱互动不构成证据。一色焦点事件：场景52（拒绝有利但不属于自己的方案）／73（面具式求助被挡回·疲惫露出半拍）／114（放弃一种收益并承担后果）／149（与恋爱无关的结构性选择）
    角色提示词优化_20260812:
      目标: 降低基础信息、性格调色盘、三面性、二次解释之间的同义重复；拉芙希妮增加不服务创伤主线的日常人格；原作角色优先保留可辨识声线而非泛用恋爱台词
      基础信息边界: 只保留身份、可见特征、关键经历、关系起点、称呼与知情边界；心理机制归调色盘或二次解释
      调色盘边界: 描述跨阶段底色与当前阶段行为；不重复三面性台词，不用同一象征物承担所有情绪
      三面性边界: 语料只写纯台词；动作归身体行为；阶段台词继续受原有 EJS 旗标隔离；关键场景宣言不作为日常轮播语料
      二次解释边界: 只纠正模型高频误读；已经由调色盘和三面性表达清楚的内容不再总结一遍
      保持不变: 现有文件路径、entryManifest 注册、MVU 字段、EJS 门控、场景事实、角色成长旗标与恋爱变量语义
    日常反差细节_20260816:
      动机: 主线场景文件自带梗，但 free 模式/日常空白期 AI 可用的"普通生活素材"过少（如雪乃只剩红茶/潘先生/猫三样），枯竭后会重复或编造；参考百科式角色卡的萌点密度，以本卡心理模型的写法补一块日常反差素材
      位置: 各角色 基础信息.yaml·背景设定 下新增「反差细节」键（日常习惯之后）；九名角色各一块（角色一览为索引不添加）
      剂量: 每人 2~5 行，一行一事；只写日常与私人趣味，不写人际关系与剧情服务内容；春物角色优先原作梗，方舟角色将原作习性翻译为普通高中生/普通人的日常形态（拉芙希妮是普通人类·无尾巴无德拉克特征·禁写龙类意象）
      使用禁则: 标注"仅在对应情境触发时使用·不得逐条复述"——与扮演准则"意象只在触发时出现"一致，防止 AI 当 checklist 轮播
      雪乃事实修正_20260816: 用户确认——雪乃不会骑马与合气道，体力几乎为零，钢琴仅初中学过
    雪乃冷淡校准_20260816:
      背景: 用户反馈 AI 把雪乃演成"初见即侮辱"（含对拉芙希妮）且长期交往后毒舌内容不变质；前一轮代理代笔的"毒舌校准"方案（对象门槛/锋利变质四条/语料对象标注）已由用户回滚，改为用户亲自修订、代理审核
      用户修订: ①基础信息语言特征"逻辑先行"→"直白正义·指出错误时直接但留重做空间" ②二次解释「关于冷淡与毒舌」→「关于冷淡」：不热衷寒暄但非冷漠·语气按对象调整·对亲近者含糊表达在意 ③调色盘：戒备衍生一去"攻击性强"改"说话直白、拒绝不正确"·戒备衍生二"效率话术"→"别扭"·阳乃坐标系与嘴嫌衍生措辞微调 ④关系设定删"不能预载成互相理解"与"具体态度随当场交锋变化"（用户有意删减）
      原作台词处置: 三面性语料库中的原作讽刺台词（如"你的脑子是装饰品吗"）保留不动——用户确认其为原著台词且默认对象为八幡；降功率由调色盘去"攻击性强"与二次解释去"毒舌"命名承担
      残余风险备案: 若实测初见仍开嘲讽，最小干预为在语料使用规则注明"原作讽刺台词默认对象是八幡与熟人"，不删台词
      待办_20260816: check-agent 三处风格违规待用户修订——二次解释L4"并非对人冷漠"否定转折·基础信息L34"直白正义"评价词·基础信息L43"敬爱、竞争和戒备"标签罗列

