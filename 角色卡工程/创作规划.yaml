mvu:
  structure: |
    顶层结构（动态角色MVU＋phone容器）：
    ├── 模式与主角组：mode: pov | custom | free · current_pov: hachiman|hachiman_f|yukino|yui|laff|mrs_yukinoshita · custom_protagonist{name,gender,className,identity,past,personality,appearance,participation:{track:member|classmate|outsider,note}|null}
    ├── 剧本进度：current_scene 1-150 · mainline_completed(场景150完成后不可逆置true)
    ├── world: current_date(ISO) · current_location
    ├── player: cash(number|null) · carried_items(string[])
    ├── characters（规范全名动态Record·不预设追踪对象·不创建玩家本人）: display_name · present · known · relationship{bond 0-100, romance 0-100, commitment: 未确认|仅朋友|恋人} · latest_user_memory{memory, inner_thought} · outfit{outerwear/inner_layer/bottoms/socks/underwear/shoes}
    ├── Ω与锤子组（10·仅拉芙POV激活）: Ω_resonance 0-100 · hammer_* ×9(pending|triggered|missed)
    ├── 信息锁组（3）: laff_knows_fire_truth · laff_reed_authorized_yukino · dalloway_pen_used
    ├── 成长里程碑组（2026-08-05·四主角事件旗标·一旦true不可逆）: arc_milestones{hachiman: asked_before_self_sacrifice/accepted_shared_cost/stated_personal_desire, yukino: offered_resources_without_deciding/admitted_personal_wish/separated_self_from_family_standard, yui: voiced_disagreement_publicly/did_not_retract_after_conflict/admitted_selfish_wish, laff: expressed_preference/refused_without_explanation/chose_against_group_expectation/accepted_consequence_without_withdrawing_choice}
    ├── 一色成长旗标组（2026-08-05·第五可攻略角色·非第五POV·外部证据制·不可逆）: iroha_milestones{rejected_profitable_solution, made_uncalculated_request, stated_desire_without_performance}
    ├── 结局组（2）: mainline_completed · branch_choice(null|共同线|六组预设关系尾声|姐妹和解)
    └── phone（手机助手按存档隔离·主AI禁止直接更新）: contacts(规范全名→active/removed/blocked) · threads(thread_id→direct/group·成员·滚动摘要·事实·待办) · messages(thread_id→真实发送者/故事时间/知情范围/来源) · forum.posts(帖子与回复及元数据) · context(主线注入快照·幂等解析记录·手动队列)
  variables:
    初始值: mode=null · current_pov=null · current_scene=1 · mainline_completed=false · world.current_date=2013-05-20 · current_location=未确认 · player.cash=null · carried_items=[] · characters={} · Ω_resonance=0 · phone={version:2, contacts:{}, threads:{}, messages:{}, forum:{posts:[]}, context:{active_snapshot:null, manual_queue:[], ingest_records:{}, facts:[], appointments:[]}} · arc_milestones/iroha_milestones=旗标全false
    更新要点: current_scene 由主AI结合场景条目/已发生正文/玩家行动判断·默认不动·核心功能完成或原定事件被永久否定并替代收束后+1·不得按轮数推进·剧情自建仅 participation.track 非空时参与主线推进 · mainline_completed 仅场景150核心功能完成时不可逆置true · characters 主AI按实际登场动态创建 · phone/collection 主AI不得输出JSONPatch修改 · arc_milestones 仅由正文实际发生的可归属行为证据置true·scene/bond不再发放成长
  # 锤子9个·信息锁3个·结局1个 → 保持顶层；角色关系改由characters动态承载

ejs:
  generate_before: [campaign_id, mode, current_pov, custom_protagonist, current_scene, mainline_completed, world.current_date, world.current_location, player, characters, Ω_resonance]
  entries:
    - name: DLC_错位的日常_演绎规则/开局锚点
      condition: campaign_id==dlc_genderbend_hachiman（开局锚点另需紧邻可见开局标记）
    - name: DLC_君的名字？_演绎规则/双开局锚点
      condition: campaign_id==dlc_body_swap_mrs_yukinoshita（锚点按 current_pov 分流·不暴露未选择意识的离线动作）
    - name: 全部场景条目（场景一~场景一百五十）
      complexity: 条目显隐
      condition: "mode === 'pov' && current_scene === N（逐场对应）"
      purpose: POV剧本模式仅激活当前场·自建模式全关·strategy=constant+日期关键词仅作元数据（手机助手章节app日历读取用）
    - name: 家族暗线组（爱布拉娜/温斯顿/家政/科尔马克/多琳/达洛维相关/中庭肖像画等）
      condition: "mode === 'pov'（自建模式禁用剧透内容）"
    - name: 四主角_性格调色盘
      complexity: 段落控制
      stages: [拉芙希妮: 绷紧期/软化期/对抗期/自主期, 雪乃: 戒备期/接纳期/自主期, 八幡: 孤绝期/动摇期/确认期, 结衣: 迎合期/撕扯期/自主期]
    - name: 玩家身份路由
      condition: "mode === 'pov' || mode === 'custom'（将current_pov或custom_protagonist转换为<user>身份与叙事分工）"
    - name: 开局场景路由
      condition: 本局唯一user消息含开局可见句（我选择扮演/我将以自建角色）——2026-08-05起弃用<counterfeit_opening>尖括号标记（被酒馆消息清洗剥除，曾致首条回复中止）
      purpose: 只在第一轮生成时提供可参与的开局落点·不替玩家角色说话或下内心结论
    - name: POV分幕滤镜
      condition: "mode === 'pov'（按current_pov与current_scene选取单一观察滤镜·同一意象和招牌动作不得连续复读）"
    - name: 角色阶段事实
      condition: "mode === 'pov'（只发送截至current_scene已发生的未来物件/身份/称呼事实）"
    - name: 还火事件_封存真相
      condition: "mode === 'pov' && current_pov === 'laff' && (current_scene >= 123 || laff_knows_fire_truth)（防真相在自建/其他POV/未查证时进入上下文）"
    - name: 手机上下文注入
      condition: phone.context.active_snapshot.text 非空（D0隐藏system条目·只在下一次主线生成时发送已准备快照·重生成复用·私聊群聊严格按参与者限制知情）
    - name: 四主角_三面性（POV锁门控）
      condition: "mode !== 'pov' || current_pov === 对应角色（POV剧本模式只注入当前视点主角·其余三人声线由场景条目NPC动向承担·自建/开放世界全开）"
    - name: 爱布拉娜_三面性（拉芙POV限定门控）
      condition: "mode === 'pov' && current_pov === 'laff'（家族暗线内心条目·与还火封存真相同级保密·2026-08-05由mode==='pov'修正）"
    - name: 一色彩羽_三面性（开放世界专用门控）
      condition: "mode !== 'pov'（一色非四主角·POV剧本模式声线由场景条目NPC动向承担·2026-08-04注册并门控）"
    - name: 平冢静/雪之下阳乃_三面性（开放世界专用门控）
      condition: "mode !== 'pov'（与一色同规格·2026-08-05统一补装）"
    - name: MVU更新规则
      complexity: 段落控制
      condition: 常驻角色关系核心；主线剧本/current_scene、free日期时段、DLC identity_state、拉芙Ω/锤子、尾声 branch_choice 按 stat_data 条件渲染

