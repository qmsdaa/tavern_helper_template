  dlc_worldbook_architecture:
    question: DLC是否拆为独立世界书、开场白界面选择绑定
    decision: 不拆。酒馆没有按变量运行时切换绑定世界书的机制；单书+@@if campaign_id门控即“逻辑上的两本书”，为酒馆生态标准做法
    revisit_if: 条目总数超出管理承载时再评估”主线书内嵌+DLC书作附加书手动绑定”的纯管理收益方案


