style:
  perspective: 第三人称·多POV（默认零POV·独占场景标注单一观察锚点）
  scene_pov_fields:
    POV: 该场的叙事镜头归属（"共享场景／零POV" / 单一角色 / "角色·独占"）——决定这一场怎么写
    主场POV: 该场的戏剧重心归谁（这场是谁的戏）——决定戏眼归属，供主AI判断非主场POV的完成条件
    关系: 两者语义不同且可并存（例：场景118 POV="共享场景／零POV" 而 主场POV="雪之下雪乃×比企谷八幡"）
    取值规范: 统一用全名（拉芙希妮·都柏林／雪之下雪乃／比企谷八幡／由比滨结衣／爱布拉娜·都柏林／比企谷小町／平冢静）· 双主角用"A×B"· 共享统一写"共享场景／零POV"
    落盘: 2026-08-04 全150场已写入（build_tools/apply_main_pov.py 可重跑·幂等）
  tone: 文学化·心理描写细腻·角色语调各有标记
  mood: 青春群像·温暖日常下暗流涌动·"未完成语句收束"的章尾节奏
  reference: 原作《やはり俺の青春ラブコメはまちがっている。》同人AU

