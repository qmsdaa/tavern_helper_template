    release_blocking: false
  asset_commit: 打包前以包含本批WebP的GitHub固定提交回填

runtime_hotfix_v060:
  opening_self_contained:
    trigger: 实机出现“Counterfeit 开场白加载失败”，看门狗检测到8秒内 #app 未挂载
    root_cause: 卡内虽已内嵌开场HTML，但生产HTML仍从jsDelivr运行时加载Vue与Pinia；外部模块访问受限时入口模块无法求值
    requirement:
      - 开场生产构建必须内联Vue、Pinia、Zod等执行依赖，不得含远程module-import或远程script src
      - 字体、图标、CG与立绘属于非阻塞视觉资源，加载失败不得阻止 #app 挂载
      - 打包回归检查必须同时验证挂载器不下载HTML、内嵌HTML不下载执行模块
    release_action: 重建开场生产HTML与开场白挂载脚本，另发v0.6.0热修候选并完成解包回读
  scene_player_route_graceful_block:
    trigger: 实机场景149在current_pov为空或非法时执行玩家入口throw，导致整次提示词模板渲染中断
    root_cause: 150场玩家入口把“源码缺少某条合法视点分支”和“运行时聊天快照尚未初始化视点”混用同一个throw处理
    requirement:
      - 四条合法玩家入口仍须由构建器静态验证完整覆盖，禁止回退事件焦点
      - 运行时current_pov为空或非法时渲染唯一unavailable入口，不得抛出EJS异常、不得擅自选择玩家视点
      - unavailable入口只允许提示返回开场重新选择视点或读取含合法视点的存档，不得继续剧情
      - 150场源文件、生成索引、场景验证器与回归测试必须同步
    release_action: 批量迁移150场玩家入口守卫并另发v0.6.0 hotfix2，完成打包与解包回读


