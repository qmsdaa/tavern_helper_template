project:
  name: Counterfeit
  worldbookName: Counterfeit
  form: charactercard
  mvu: true

runtime_contract_v046:
  prompt_template_plugin:
    required_for: 剧情模式
    reason: 世界书场景依赖 @@if mode/current_scene 条件门控；插件缺失时酒馆不会解释条件语句
    user_warning: 剧情模式必须安装并启用“提示词模板”插件，未安装时不得开始生成
    scene_policy: 保持150个场景条目及其 enabled 状态不变，不用禁用场景来替代插件
    first_import_guard: 所有状态清单中的 @@if 条件必须先用 typeof mode !== "undefined" 短路保护整条原表达式；MVU尚未初始化时静默返回false，初始化后保持原门控语义
  opening:
    registered_first_message: 开场白/0.txt
    unregistered_source_backup: 开场白/1.txt
    commit_order: 等待MVU就绪 → await写入楼层0与chat → 校验初始关系 → 替换OpeningUI → 创建可见user楼层 → /trigger
  portraits:
    chip_asset: 512x512 WebP头像，lazy-load
    modal_asset: GitHub固定提交上的原分辨率立绘，仅弹窗打开后lazy-load，object-fit contain

release_assets_v060:
  mainline_cg:
    new_scenes: [1, 33, 36, 80, 83]
    manifest_total_after_import: 42
    source_directory: 图片素材/CG
