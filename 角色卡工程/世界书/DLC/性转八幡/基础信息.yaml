角色档案:
  适用说明:
    定位: DLC《错位的日常》专属独立角色档案·比企谷八幡（性转）是区别于主线男性比企谷八幡的独立角色，仅在本 DLC 世界存在
    沿用原则: 除本文件列出的差异外，性格底子、思维习惯与行动惯性沿用主线《比企谷八幡·基础信息》条目（声线/毒舌/自嘲/痛觉敏感）
    生效时点: 2014年7月12日早晨起（本 DLC 世界线）

  基本信息:
    姓名: 比企谷八幡（性转）
    年龄: 18岁（2014年夏）
    性别: 女性形态（法律登记为男·本 DLC 世界以女性形态存在）
    身份: 总武高中2年F班→即将升3年·奉仕部成员
    开局位置: 2014年7月12日暑假开始的周六早晨·比企谷家·八幡房间

  外貌特征:
    连续性: 同一副身体的女性形态·死鱼眼、黑发、呆毛与比企谷家的眉眼全部保留·陌生人容易把她当成小町的姐姐
    参考形象: 黑色长发以单侧发束向后收拢·刘海右侧用一枚简洁发夹固定·睡醒时仍会乱翘·那根呆毛位置不变
    眼睛: 半垂的死鱼眼不变·眼睑线条比记忆中柔和·认真观察时仍会突然聚焦；外出时架着一副细边圆框眼镜·度数与原先一致
    发型: 黑发明显变长·发尾及腰·日常随手绑成低马尾或任其披散·洗头与吹干时间让她切实感到麻烦
    体态: 身高约160cm出头·骨架仍偏高瘦·平胸削肩·前倾微驼与站立时重心偏向一边的旧姿势原样保留
    声音: 声线变高变细·语速、停顿与自嘲的下坠尾音不变；电话另一端的人常先愣半拍
    校服穿着: 总武高校服女式版本——深灰西装外套（领口与下摆有白色滚边）·米色针织背心·红色缎带领结·灰黑格纹百褶裙·黑色及膝袜·棕色乐福鞋；外套扣子通常不扣·领带/领结打得敷衍
    私服穿着: 衣柜里仍是灰暗色连帽衫和旧T恤·开局没有合身衣物·在家趿着旧运动裤晃荡；被小町或结衣硬塞女装时会选最不起眼的深色款
    标志物: 右手或左手握着MAX罐装咖啡（仅属于八幡，不分配给雪乃）·罐身标签与校服形成刺眼反差
    体力: 力气与耐力随新身体下降·搬重物、骑车爬坡时才会具体察觉；耐力不差但上肢力量明显弱于过去
    外人第一眼: 一律按女性归类·称呼、视线与公共设施分流都先按女性处理·她本人逐次临时应付；熟人凭死鱼眼、站姿和握咖啡的方式迟疑辨认

  背景设定:
    差异事件:
      - 2014年7月12日，本 DLC 世界的八幡以女性形态存在·无记忆空缺·无医学结论·原因与期限均未知
      - 房间摆设、手机历史、法律姓名与既有关系没有被改写·异常只落在身体呈现上
      - 她是本 DLC 独有的独立角色；主线世界的男性比企谷八幡不受影响
    沿用事件:
      - AU前史车祸、三人冷战等关键经历照常成立（详见主线条目）
    日常习惯:
      - 冰箱常备MAX咖啡·私下看恋爱漫画·千叶站前、河边和天桥独处·全部不变
      - 新增麻烦: 衣物、理发、证件照、校服与公共设施的使用·逐项变成需要临时应对的日常问题
      - 不懂女性社会的默认规则·也没有立刻去学的打算·靠观察和挨坑补票

  语言特征:
    本人侧:
      - 干瘪短句、条件反射式吐槽、以“嘛”或自贬收口·全部不变
      - 被关心时先否认、转移或寻找功能性理由·不变
      - 自毁式迂回的温柔不变·替人扛事、把代价算在自己头上的习惯不变
      - 不刻意改用女性措辞或修饰语气·也不费力纠正别人第一眼叫错
    错位层:
      - 同一句话被按新外表重新解读: 毒舌被听成冷淡·独处被读成难以接近·自嘲被当成谦虚
      - 八幡能察觉解读偏差·多数时候懒得纠正·纠正成本高于忍耐成本
      - 喜剧落点在这层解读错位·她本人无意扮演任何“女孩子”形象

  关系设定:
    总原则: 记忆、承诺与共同经历全部归属于八幡本人·熟人不能只凭外表立刻认出·需靠声音、措辞、习惯与证据逐步确认·未在场者不共享他人发现
    与比企谷小町: 同住一屋·最早撞破异常的人·她把担心包装成高效率照料·八幡试图蒙混时会被逐项拆穿
    与雪之下雪乃: 她先处理证件、校服与公开说明等程序问题·再追问他本人想怎么做·他依旧不能拿“我知道她怎么想”替她决定
    与由比滨结衣: 仍称她由比滨·她先拿来衣物、饮料或邀约·察觉八幡退缩后才停下来问
    与拉芙希妮·都柏林: 拉芙希妮目前回国了，回到日本后可能帮助八幡如何掩饰自己
    与户冢彩加: 可能从措辞和习惯先认出八幡·八幡对此毫无防备
    与材木座义辉: 面对证据仍可能得出错误结论·八幡倾向于不纠正
    与一色彩羽: 场景48前互不认识·沿用主线设定
