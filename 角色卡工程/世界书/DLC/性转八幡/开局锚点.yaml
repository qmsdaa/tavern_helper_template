开局:
  战役: 错位的日常
  通用:
    日期: "2014-07-12"
    星期: 周六
    时段: 早晨
    玩家视点唯一依据: current_pov

  比企谷八幡（性转）:
    玩家意识: 比企谷八幡（性转）
    地点: 比企谷家·八幡房间
    开局前事实:
      - 主线场景118已经结束，暑假前的普通日程仍在继续
      - 八幡记得前一天入睡前发生的事情，记忆没有空缺
      - 房间摆设、手机历史、法律姓名与既有关系没有被改写
      - 八幡尚未对任何人说明异常，也没有人为异常作出解释
      - 手机里躺着结衣发来的消息：喊几个人一起去迪斯尼乐园玩
    首条回复可呈现:
      起点:
        - 手机闹钟在床边响起
        - 伸手关闭闹钟时，手指与手腕的形状首先显出变化
      手机里的消息:
        - 通知栏里结衣的消息还亮着：喊几个人一起去迪斯尼乐园玩，结尾带着一连串感叹号
        - 消息里提到小雪乃也说要去，还问小企（八幡）要不要一起
        - 八幡盯着屏幕，一时不知该怎么回
      逐步确认:
        - 刚醒时的声音与记忆中的声音不同
        - 头发长度与睡衣贴合方式不同
        - 镜子只确认外表呈现已经改变，不说明原因、期限或医学结论
      门外动静:
        - 小町隔门叫“哥哥”，第一次没有得到回应
        - 她把沉默理解为赖床或身体不舒服，又靠近门问了一次
        - 门把手被从外侧握住，开始向下转动
    叙事要求:
      - 使用八幡熟悉的房间细节与干瘪观察维持本人感，不把镜前检查写成展示身体的长段落
      - 小町尚未看见房内情况，她只能根据沉默、闹钟与平日习惯判断
      - 异常事实分三四个可观察落点出现，不一次性用设定说明概括
      - 结衣的消息称呼按她的习惯写：小雪乃、小企、拉芙希妮酱，不写错
    结束位置:
      最后动作: 门把手刚开始转动
      必须留给玩家:
        - 回应或继续沉默
        - 挡门、开门或另寻办法
        - 是否继续检查、联络他人或改变当天安排
        - 是否回复结衣的迪斯尼邀约
      不得提前:
        - 替八幡说话、行动或确定自我称谓
        - 让小町已经看见并接受真相
        - 提出求医、调查、公开或恢复方案

  雪之下雪乃:
    玩家意识: 雪之下雪乃
    地点: 雪之下雪乃的公寓（稻毛区高层）
    开局前事实:
      - 暑假开始，雪乃按自己的节奏过周六：扫除、采购、阅读
      - 结衣发来消息，约她和八幡一起去迪斯尼乐园玩
      - 八幡（性转）的异常尚未被雪乃当面确认
    首条回复可呈现:
      - 手机上结衣发来消息「小雪乃！暑假一起去迪斯尼乐园玩吧！小企也说要去！拉芙希妮酱好像也快回来了，正好一起！」
      - 雪乃决定先泡红茶，再决定要不要答应
      - 结衣的消息带着一连串感叹号，雪乃把手机放下，开始洗茶具
    结束位置:
      必须留给玩家:
        - 回复结衣、答应、婉拒或约改天
        - 是否联系八幡确认他会不会去
        - 如何对待这条平常的邀约
      不得提前:
        - 替雪乃决定联系谁、是否出门或如何理解
        - 把传言写成已发生事实

  由比滨结衣:
    玩家意识: 由比滨结衣
    地点: 由比滨家
    开局前事实:
      - 暑假开始，结衣的周六上午通常是遛萨布雷和家务
      - 结衣想约雪乃和小企一起去迪斯尼乐园玩，正在发消息拉人
      - 八幡（性转）的异常尚未被结衣当面确认
    首条回复可呈现:
      - 遛完萨布雷回来，结衣抱着手机窝在沙发上，给雪乃和小企发消息
      - 「小雪乃！小企！暑假一起去迪斯尼乐园玩吧！难得放假嘛！」
      - 又补了一句「拉芙希妮酱好像快回来了，等她回来也约上！」
      - 结衣一边等回复，一边盘算集合时间和要带的东西
    结束位置:
      必须留给玩家:
        - 继续拉人、定日期、约集合地点或先等回复
        - 是否注意到小企这次回得特别慢
      不得提前:
        - 替结衣决定行动
        - 把传言写成已发生事实

  拉芙希妮·都柏林:
    玩家意识: 拉芙希妮·都柏林
    地点: 成田机场到达口（从英国返回）
    开局前事实:
      - 拉芙结束了在英国的一段行程，按计划返回日本（与主线时间线类似的返程安排）
      - 几人约好到成田机场接机：雪乃、结衣、小町，还有八幡
      - 八幡（性转）的异常尚未被拉芙当面确认
    首条回复可呈现:
      - 走出到达口，看见接机的几人，结衣第一个挥手上千：「拉芙希妮酱！欢迎回来！瘦了没有！」
      - 拉芙注意到人群里的八幡——外表似乎和记忆里不太一样
      - 她先回应了结衣的招呼，目光却在八幡身上多停了一瞬
      - 右腕的旧丝带被风吹动
    结束位置:
      必须留给玩家:
        - 回应接机的几人、确认八幡的状况
        - 是否当场询问“你还好吗”或先放下
      不得提前:
        - 替拉芙确认八幡的变化或当场点破
        - 把接机后的行程写成已发生事实

  自建角色:
    玩家意识: 自建角色（以 custom_protagonist 为准）
    地点: 千叶市（按自建身份合理选择）
    开局前事实:
      - 2014年7月12日，暑假中的千叶市
      - 群里结衣正张罗着去迪斯尼乐园玩，机场那边有人从英国接机回来
      - 街头的传言、群里的消息与熟人欲言又止的表情，都指向「比企谷八幡好像变得有点不一样了」（女性形态）
    首条回复可呈现:
      - 与学生身份相符的暑假位置，或与身份相符的公开地点
      - 一个自然的钩子：偶遇、消息、传闻或熟人提及
    结束位置:
      必须留给玩家:
        - 决定是否接近、询问或旁观八幡（性转）的状况
      不得提前:
        - 替自建角色自动认识核心角色或加入奉仕部
        - 把未经证实的传言写成已发生事实
