# 章节一句话概要（teaser）
# 用途：手机「章节」应用对未到达的场景显示概要，替代含设计注记的完整标题，防止隐藏剧情被列表剧透。
# 仅为构建期输入（build_scene_index.mjs 读取），不进入世界书打包清单，不占用 token。
# 写作约束：一句话、不出现未登场角色姓名、不揭示转折与隐藏真相、不带 ★/🔨/Ω 等设计标记。
schema_version: 1
campaigns:
  main:
    "1": "五月的一个早晨，J班教室迎来了一位来自远方的转学生。"
    "2": "课间的中庭，新同桌独自站在人群之外。"
    "3": "一纸强制委托，把陌生人带进了特别栋的活动室。"
    "4": "活动室迎来第一位委托人，和一份难以评价的小说原稿。"
    "5": "对同一份稿子，四个人给出了四种截然不同的读法。"
    "6": "改稿委托走向尾声，老师手里多出一封没有来历的信。"
    "7": "网球场上的一次委托，让活动室迎来了新的访客。"
    "8": "期末复习告一段落，一条来自远方的短信无人回复。"
    "9": "雷雨突至的午后，有人翻书的手指停了半秒。"
    "10": "雨停之后，彩虹下四个人用四种方式走过水洼。"
    "11": "走道上的风掀起蒲公英，有人第一次露出了不设防的笑。"
    "12": "回到公寓的夜晚，她进行着一些无人知晓的小小仪式。"
    "13": "一张暑期活动的宣传册，在活动室里传了一圈。"
    "14": "一封措辞反复删改的邮件，在深夜里终于点了发送。"
    "15": "来自大洋彼岸的回复，带着六条要求和一通视频通话。"
    "16": "出发前的确认表上，有一栏迟迟没有落笔。"
    "17": "开往山区的电车上，信号一格一格地弱了下去。"
    "18": "没有信号的夜晚，和室里只有另一个人的呼吸声。"
    "19": "营地里有一个总是独自行动的女孩。"
    "20": "试胆大会的终点，有人负责打勾，有人迟迟未到。"
    "21": "烟花升起的夜晚，一杯红茶甜得超出预期。"
    "22": "林间学校结束了，回程的电车上没有人说话。"
    "23": "商务酒店的行政酒廊里，进行着一场例行的问答。"
    "24": "商场里，有人被追问了一整天“好看吗”。"
    "25": "整理旧纸箱的午后，翻出一封来自伦敦的信。"
    "26": "新学期开始，红茶里没有放糖。"
    "27": "一份新的委托被送进活动室，附带着一个自荐的名字。"
    "28": "执行委员会的大本营里，文书堆积如山。"
    "29": "一场体面的推诿之后，整张长桌被文书占领。"
    "30": "两张盖了同一个章的申请表，把矛盾推到了台前。"
    "31": "有人替做不了决定的人做了决定，并收下了所有怨恨。"
    "32": "开幕前半小时，委员长不见了。"
    "33": "体育馆后台的走廊里，挤满了各执一词的人。"
    "34": "温和的调停者赶到，走廊的温度却降到了冰点。"
    "35": "人群散去后，通风口旁只剩下一个人和一部手机。"
    "36": "第一次走进那间公寓，撞见了一位不速之客。"
    "37": "文化祭后的第一次聚会，空气里还有没有说完的话。"
    "38": "一份关于告白的委托，目的地是京都。"
    "39": "告白委托的第一次正式讨论，没有得出任何结论。"
    "40": "新干线的车窗外面，海岸线一路后退。"
    "41": "信纸上读过许多次的城市，终于出现在眼前。"
    "42": "石板路上，一场告白正在被精密地阻挡。"
    "43": "洛东的夜街上，有人停下了脚步。"
    "44": "熄灯后的和室里，手腕上多了一根红色的缎带。"
    "45": "回程的新干线上，两只手腕都藏进了袖口。"
    "46": "星期一早晨，红绸带第一次出现在所有人的视野里。"
    "47": "委托人带着京都的伴手礼回来了，姿态比出发时轻松。"
    "48": "活动室里来了一位想“自然落选”的一年级生。"
    "49": "一份退选委托的背后，站着两位不肯松手的大人。"
    "50": "一份完美得离谱的竞选纲领，在活动室里成形。"
    "51": "体育馆的演讲台上，空头支票一张接一张地开出。"
    "52": "当选的新会长在走廊里拦住了推销员。"
    "53": "一块妈妈牌芝士蛋糕，和一份从天而降的联合企划。"
    "54": "第三会议室里，来了一位“天然到残酷”的客人。"
    "55": "同一个周末，公寓里在讲数学，咖啡厅里在上刑。"
    "56": "彩排现场的混乱中，两双过于相似的眼睛对上了。"
    "57": "后台的折叠桌上，有人尝到了一杯甜得超出常理的红茶。"
    "58": "笑声、挽臂和围攻——活动室里有人红了脸。"
    "59": "去往家庭餐厅的步道上，进行着一场问题额度的消耗战。"
    "60": "餐桌上的点菜权，和一句谁也没有预料到的坦白。"
    "61": "深夜的公寓里，有人对着玩偶数落另一个人的越界行为。"
    "62": "回到公寓，房间里的东西全都换了位置。"
    "63": "日历上被圈出的日期，正在一天一天逼近。"
    "64": "寒假补习的威胁，和一通通不肯挂断的电话。"
    "65": "成田机场的到达大厅，冬雨敲了一路的窗。"
    "66": "酒店会议厅里，次女坐在了她该坐的位置上。"
    "67": "元旦的神社里，正午十二点准时响起视频通话的铃声。"
    "68": "衣柜深处被翻出来的旧玩具，摆在了茶几正中央。"
    "69": "三个小时的单独行动，目的地是原宿的一家门店。"
    "70": "被拽进活动室的人，迎面撞上了礼花筒。"
    "71": "开学第一天，三件小物同时出现在袖口和耳畔。"
    "72": "一本拿错的笔记本，摊开在两人之间的桌面上。"
    "73": "一叠按时提交的报告，最后一页多了一张便利贴。"
    "74": "进路调查表上的同一行字，被擦掉了第三次。"
    "75": "商场里，两份礼物清单互相照出了对方的心思。"
    "76": "第一次全员到齐的公寓聚会，和一张灾难般的合照。"
    "77": "检票口外，一盒巧克力在早晨的人潮前递了出去。"
    "78": "一份被全盘否决的企划案，连同一个牛皮纸信封。"
    "79": "信封拆开，红字批注爬满了整份方案。"
    "80": "特别会议的质询席上，坐着一位敲笔杆的理事。"
    "81": "周末回家之前，有人抱着玩偶演练了三种败局。"
    "82": "本邸的起居室里，一张进路表被推过桌面。"
    "83": "从本邸出来的脚步，无意识停在了一栋公寓楼下。"
    "84": "活动室里宣布了一个周末的“私人时间占用”。"
    "85": "本邸的餐厅里，一场晚餐变成了所有人的战场。"
    "86": "舞会前夜的化妆镜前，一个消息被平静地说了出来。"
    "87": "大礼堂的灯光熄灭之后，道具室里坐着一个踢掉高跟鞋的人。"
    "88": "作废的航班纸被揉成一团，新的计划开始起草。"
    "89": "高二的最后一天，掌声稀稀落落地响了一会儿。"
    "90": "最后一次走进活动室的人，把钥匙弹到了桌子对面。"
    "91": "一封纸质信件的措辞，在两人之间反复推敲。"
    "92": "邮局的柜台前，退路被亲手剪断。"
    "93": "西口的咖啡馆里，一份方案在缺席者不知情时成形。"
    "94": "大洋彼岸的办公室里，有人逐字冷读着那封信。"
    "95": "同一天里，三种关心从不同方向同时抵达。"
    "96": "四月的第一场雷雨，和一通越洋电话同时落下。"
    "97": "一张精确到出口编号的接机草图，摊开在桌面上。"
    "98": "接机前夜，五件不值钱的东西在床上排成一列。"
    "99": "航班落地的午后，电车驶向总武高。"
    "100": "活动室的长桌上，第一次摆出了三件旧物。"
    "101": "教务会议室里，文件上的条款被一条一条划去。"
    "102": "以清空冰箱为名的火锅，吃到了搬家的前一夜。"
    "103": "新学期的分班名单上，一个名字安静地排在三年J班。"
    "104": "一纸追加意见，把活动室推到了复核席上。"
    "105": "那间活动室里，有人说出了“我想要真物”。"
    "106": "真物宣言的第二天，部长自己坐到了委托人的位置上。"
    "107": "一叠社团成立申请表，和“至少五个人”的门槛。"
    "108": "两个一年级的名字，签在了成立意向书上。"
    "109": "批准通知书到达的那天，活动室里多了两把椅子。"
    "110": "联合体检的会场，第一次检验了新社团的方案。"
    "111": "第一份闭环记录的背后，一句迟到的道歉终于说出口。"
    "112": "没有委托的下午，门背后的值日表翘起了一个角。"
    "113": "游戏部的两种结局争持不下，有人接过了改写的笔。"
    "114": "同一天里，两份委托撞进了活动室。"
    "115": "一张三十六个格子的完美表格，找不到签字的人。"
    "116": "体育祭当天，方案在操场上接受了实战检验。"
    "117": "河岸神社的夏祭里，浴衣是自己选的。"
    "118": "期末后的活动室，值日表上的一格被兑现了。"
    "119": "三箱旧材料的箱底，压着一串陌生的受理番号。"
    "120": "活动室的黑板前，有人宣布了自己买票自己去的决定。"
    "121": "八月的第一周，值日表上留出了一个空格。"
    "122": "伦敦的宅邸里，书库的档案被人为清理过。"
    "123": "档案中心的阅读室里，一份报告摊开在台灯下。"
    "124": "深夜的书房，一份謄本被放在了桌面正中。"
    "125": "成田机场的出口处，值日表的空格等回了它的名字。"
    "126": "十八岁生日的晚上，手机屏幕在六十五天后亮了一次。"
    "127": "委托人席位上，第一次坐下了自己的名字。"
    "128": "四栏白纸上，有一栏迟迟没有填写。"
    "129": "一封寄往大洋彼岸的挂号信，装着一份退出申请。"
    "130": "出发层的咖啡区里，进行着一场模拟问答。"
    "131": "议事厅的长桌对面，坐着回避了全部表决的人。"
    "132": "小餐室里，糖罐被放到了桌面的正中央。"
    "133": "烤炉房的火光前，一把钥匙完成了交接。"
    "134": "推开活动室的门，“我回来了”。"
    "135": "四张复习时间表贴上黑板，精确到了分钟。"
    "136": "一年级的新部员，第一次独立接待了委托人。"
    "137": "一把借出去的伞，由委托人自己还了回来。"
    "138": "毕业前的一场普通网球，没有任何危机发生。"
    "139": "一本毕业相册的制作，从“不让任何人被漏掉”开始。"
    "140": "晚饭后的客厅里，升学方向第一次说出了口。"
    "141": "六人份的巧克力，每一份的形状都不一样。"
    "142": "大学考试的前夜，餐桌上摆满了迷信的菜色。"
    "143": "四份合格发表，四个不同的方向。"
    "144": "中庭的长椅上，姐妹之间的谈话第一次没有变成攻防。"
    "145": "活动室里，有人用第一人称说出了自己的感情。"
    "146": "一份受理了将近一年的委托，在这一天正式结案。"
    "147": "毕业典礼前一天，活动室迎来了一批又一批的访客。"
    "148": "体育馆的毕业典礼上，有人流下了眼泪。"
    "149": "钥匙、记录簿和杯子，在长桌上换了主人。"
    "150": "樱花开了三成，群聊的消息提示音又响了。"
