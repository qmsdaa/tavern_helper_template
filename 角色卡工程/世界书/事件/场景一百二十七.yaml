场景功能:
  - Act 9开幕：拉芙以"委托人"身份正式向奉仕部提出委托——"帮我留在日本"
  - 信托由私人抽屉转入公共空间（纸张文件放在活动室，由奉仕部登记保管）
  - 温斯顿作为程序证人向全组说明信托的独立性与使用边界
  - 委托框架建立：受理中→待成立；拉芙保留"承担"的最终责任
  - "把自己的名字写进委托记录簿"——拉芙第一次坐在委托人的椅子上

进入状态:
  已发生:
    - 10/16 拉芙满十八岁，信托进入可启动状态
    - 拉芙将信托信放入珍藏抽屉，在10/24之前第八天将抽屉拉开确认
    - 今早出门前将信托信和行政说明放入书包侧袋
  当前局面:
    - 十月最后一个周五，银杏黄透
    - 小町和大志已完成值日交接→离开活动室
    - 温斯顿敲门——带着行政说明，由高坂理津子陪同进入
  未发生:
    - 委托方案的详细分工（那是下周）
    - 退出协议的具体内容撰写
    - 家族全体审查的申请提交

世界推动:
  - 温斯顿向全组说明：信托独立管理，家族无权限；日本侧行政由温斯顿代办手续
  - 拉芙将信托信从私人抽屉取出，放上奉仕部长桌
  - 委托记录簿新一页被翻开：受理中→成立前不提交学校
  - 信托文件由奉仕部登记保管——"这件事从这里开始就不再只属于我一个人的抽屉"
  - 分工框架建立：雪乃→制度/住所/边界；八幡→失败条件/反自我牺牲；结衣→生活/关系/愿望

NPC动机:
  温斯顿:
    - 目标：以最精确和最有限的方式完成行政说明——只说明信托的结构，不替拉芙做任何决定
    - 行为倾向：保持文件不翻开，不推到任何一个人面前——信息的中立放置
    - 表达意图："是否使用、用于什么、什么时候用，由受益人本人决定"——三次强调拉芙的自主权
    - 表达意图："都柏林家族、家族的任何成员，以及我本人，对这份信托都没有支配、附条件或撤回的权限"——划清所有人的边界
    - 知情边界：信托结构、受托银行规范、日本侧行政手续
    - 不得执行：建议拉芙如何使用信托；表示任何立场
  高坂理津子:
    - 目标：以教职员身份陪同非教学访客进入学生活动室
    - 行为倾向：教职员证翻在背面——标准的陪同姿势
    - 知情边界：不知道温斯顿要说什么
    - 不得执行：参与或评论会议内容
  八幡:
    - 目标：用问题框定委托的边界——确认"承担"的范围和"协作"的定义
    - 行为倾向：先确认边界再同意——在无面子的语境里行使质疑权
    - 表达意图："先确认一个边界。'自己承担'，包括哪些条款。要承担的人也由你来指定吗"——划分责任归属
    - 表达意图："等一下。'能够自己承担'，承担的代价是什么"——要求拉芙明确代价
    - 知情边界：读完信托文件的成立条款和排除条——得出"足够她大学、住、看病。不够她一辈子不工作。家族碰不到"
    - 不得执行：替拉芙决定是否接受委托
  雪乃:
    - 目标：作为奉仕部部长，按照正式流程接收委托
    - 行为倾向：逐栏登记（日期→委托人→基本事项→受理中）
    - 表达意图："承担。不是'实现'。"——抓住拉芙用词的关键差异
    - 表达意图："我不太能仅凭这一句写下来。写下来会变成记录。"——对文字记录的严肃性
    - 表达意图："在它变成'成立'之前，这件事放在奉仕部的记录里，不会提交学校"——保护委托人的隐私
    - 表达意图：提出信托文件保管规则（登记使用范围、本人或授权人取阅、备注存放位置）
    - 知情边界：信托文件内容（在登记框架内）
    - 不得执行：擅自向学校或第三方披露委托内容
  结衣:
    - 目标：确认自己不能做的部分可以被归还，确认拉芙不会独自扛
    - 行为倾向：用最直接的提问摸清关系的形状
    - 表达意图："我们做的事，最后由你承担——这一条我同意。可是，我们要不要做的事，由谁判断。"——行使判断权
    - 表达意图：听到拉芙说"把做不了归还给你们"后——"……把做不了归还给我们。"——重复一遍以确认理解
    - 表达意图："下次部活日，我想先把'怎么住'算清。我有一个月的账要给拉芙希妮酱看。"——最具体最实践的承诺
    - 知情边界：信托的结构性信息（通过八幡的总结）
    - 不得执行：替拉芙决定哪些是"做不了的"

信息边界:
  公开:
    - 信托的基本结构（教育+医疗+基本生活→覆盖面，家族无权限）
    - 委托被正式受理（状态：受理中）
    - 分工框架（四人各自负责的领域）
  局部:
    - 信托文件的完整条款（在活动室存档，仅经授权取阅）
    - 委托记录簿的具体内容（不提交学校）
  隐藏:
    - 拉芙对"代价"的具体回答（"下一次部活日"）
    - 伦敦8/12对峙的细节（委托讨论不涉及）
    - 爱布拉娜的利益回避声明（尚未发生）

