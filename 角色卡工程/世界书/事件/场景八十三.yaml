    - 拉芙希妮尚未出现

世界推动: 三月冷风；公寓自动门

NPC动机:
  雪之下雪乃:
    - 此刻目标: 想通知聚餐但又不想把拉芙希妮拖入母亲的审视——纠结
    - 行为倾向: 在对讲机前反复编排借口→全部否决→转身离开→被拉芙希妮撞见→被邀请进门→试图开口→被排班表打断→用工作模式逃避→说"明天在部室"→玄关看到画→不说画用日常锚定
  拉芙希妮·都柏林:
    - 此刻目标: 不追问雪乃为什么来——给她台阶
    - 行为倾向: 开门取信撞见雪乃→不说破→邀请喝热饮→抢先推排班表——阻止雪乃"自爆"→听懂"明天在部室"→玄关站在画前等待雪乃的宣判→雪乃不说画——拉芙希妮放松
    - 知情边界: 知道雪乃有事但不知道具体内容；知道画在玄关
    - 不得执行: 直接问"你怎么在这里"

信息边界:
  局部: 全部对话（仅两人）
  隐藏:
    - 雪乃的聚餐通知——尚未说出
    - 画的意义（拉芙希妮独知）

