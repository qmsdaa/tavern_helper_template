地点: "千叶市美滨区 · 拉芙希妮公寓（玄关→客厅）"
人物: "拉芙希妮·都柏林、雪之下雪乃（+ 提及：一色彩羽、比企谷八幡、由比滨结衣、平冢静、雪之下母）"
事件焦点:
  类型: 角色
  角色:
    - "雪之下雪乃"

场景功能:
  - 雪乃从本邸出来后无意识走到拉芙希妮公寓楼下——在对讲机前反复编排借口又全部否决
  - 不敢按门铃——认为"把家族毒性的消息丢进这里"和母亲/阳乃没有区别
  - ★转身离开时拉芙希妮恰好推门出来取信——两人在门外撞上——"被当场抓获"
  - 拉芙希妮没有问"你怎么在这里"——只是说"外面风很大。要进来喝杯热的东西吗？"
  - 进入公寓后雪乃试图开口说聚餐的事——拉芙希妮抢先推过一色错漏百出的排班表——"用'工作'给她搭了完美的台阶"
  - ★两人以工作模式讨论了排班表——雪乃说"明天在部室里再正式核对"——拉芙希妮听懂"明天在所有人都在场时才说聚餐的事"
  - ★雪乃在玄关换鞋时看到侧墙的画——少女被羽毛之手拖回灰黑漩涡——与拉芙希妮重叠
  - 雪乃没有问那幅画——只用"明天吃薄饼"的日常砸下锚点——"再见，都柏林同学"
  - ★雪乃自主期节点②：她没有把母亲的命令原样搬运进这间公寓——通知方式、时机、口径由她自己重新决定——"委托可以结束"的判断第一次延伸到"家族的指令也可以不打折扣地执行"

进入状态:
  已发生:
    - 场景82：母亲下达聚餐命令
    - 雪乃从本邸出来
  当前局面:
    - 雪乃站在拉芙希妮公寓楼下对讲机前
    - 冷风
  未发生:
