偏离处理:
  - 若雪乃POV当场说出聚餐通知（不留到明天）：允许——但拉芙希妮会用"那明天在部室再讲一遍给其他人听"把它压回公共场合；场景84的宣布不被跳过
  - 若雪乃按了门铃（不转身离开）：允许——撞见改为开门相迎，"被当场抓获"的窘迫减弱，其余节拍不变
  - 若雪乃POV追问那幅画：拉芙希妮会给出一个技术性回答（笔触、年代、谁画的），不给意义——画的解释权不在本场
  - 若拉芙希妮POV选择直接问"你怎么在这里"：违反不得执行——若玩家坚持，雪乃会立刻用"路过"结束对话并离开，热饮和排班表台阶全部作废
  - 若玩家跳过排班表：雪乃会自己把话咽回去，改用别的日常话题落锚，"明天在部室"的默契仍须达成

