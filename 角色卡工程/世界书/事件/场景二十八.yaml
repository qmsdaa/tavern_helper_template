索引日期: "2013-09-16"
地点: "总武高中第三会议室（文化祭执行委员会大本营）"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、相模南、优子、遥"
事件焦点:
  类型: 角色
  角色:
    - "雪之下雪乃"

场景功能:
  - 奉仕部首次进入第三会议室——暴露执行委员会的混乱现状
  - 相模南初登场——其行为模式展示：用热络笑容包装推卸，试图将文书直接塞给雪乃
  - 雪乃当场拒绝无分类的文书——确立奉仕部边界
  - 拉芙对相模南的初始评估：过度表演、瞳孔无笑意、劣质面具；左手指尖在裙侧收紧——本能的嫌恶

进入状态:
  已发生:
    - 场景27平冢静下达文化祭委托
    - 奉仕部四人已知分工：雪乃+拉芙→后方文书，结衣→外围协调，八幡→甄别
    - 相模南已被八幡定性为"虚荣且逃避责任"
  当前局面:
    - 第二天放学后，奉仕部四人来到第三会议室门口
    - U形会议桌占据房间主体，混乱文件堆满座位
    - 相模南在U形桌前端正被女生簇拥，正抱怨某个班级进度滞后
  未发生:
    - 奉仕部尚未进入会议室或被相模南注意到
    - 雪乃尚未拒绝相模南的文件移交
    - 拉芙尚未完成对相模南的评估

世界推动:
  - 奉仕部推门进入，第三会议室的闷热和混乱暴露
  - 相模南注意到雪乃，带着明亮笑容试图将未处理表格塞进雪乃手里
  - 雪乃拒绝接手——"在这堆垃圾被分类出优先级之前，我不会接手任何东西"
  - 相模南的笑容短暂僵硬，随后调整——用带刺委屈回击
  - 优子和遥在旁边附和支持相模南
  - 八幡发出干瘪嗤笑

NPC动机:
  相模南:
    - 此刻目标: 尽快将积压文书工作转移给奉仕部——无论以什么方式
    - 行为倾向: 听到开门声立刻迎上来——用过度明亮、带刺的亲昵笑容包装；自然地伸手试图直接将文件塞给雪乃；被拒绝后笑容僵一下→手指蜷缩→在校服裙摆蹭手→迅速调整表情用带刺委屈回应（"你不是最擅长这种事吗？"）
    - 维持"委员长在体面分配工作"的公开姿态——声音拔高确保会议室在场者听到
    - 知情边界: 不知道奉仕部的边界声明；不知道拉芙的背景和身份；不知道拉芙正在审视她的表演
    - 不得执行: 直接与拉芙互动（此时相模南尚未注意到拉芙这个"转学生"的存在）、直接露出发怒或失态
  雪之下雪乃:
    - 此刻目标: 当场确立奉仕部不可逾越的边界，拒绝被当成替代品
    - 行为倾向: 进门后冷酷扫视全场；拒绝接文件的时机精确——退后半步让相模南的手悬空；言辞冷淡而穿透力强
    - 余光注意到拉芙的状态——拉芙的视线不在相模南的嘴上而在眼睛上，左手指尖收紧——雪乃在读拉芙的反应
    - 知情边界: 不知道相模南的文件混乱到了什么程度（马上会知道）；不知道拉芙正在对相模南进行家族训练式的评估
    - 不得执行: 直接替拉芙说话或解释拉芙的反应、对相模南进行人格层面的攻击（边界声明足够）
  比企谷八幡:
    - 此刻目标: 观察在场人际关系，保持最低存在感
    - 行为倾向: 靠在墙边或站在后方，发出只有奉仕部成员能听见的干瘪嗤笑——对相模南的行为进行非语言确认
    - 知情边界: 对相模南已有预判——当前场景验证他的判断
    - 不得执行: 在此时介入雪乃与相模南的交锋——他的角色是观察和后续的恶意雷达
  由比滨结衣:
    - 此刻目标: 不被卷入冲突，观察局面
    - 行为倾向: 与雪乃和拉芙站在一起，保持沉默或轻微不安——她的空气读取能力让她不会在此时插话
    - 知情边界: 相模南是她的同班同学（2-F）但她没有帮相模南说话
    - 不得执行: 为相模南的行为辩护或解释

信息边界:
  公开:
    - 第三会议室极混乱——文件堆积、空气闷热、进度滞后
    - 相模南试图将未分类文书直接塞给雪乃，雪乃当场拒绝
    - 双方在会议室其他人的注视下进行了边界交锋
  局部:
    - 拉芙在相模南靠近时对相模南眼睛的透视式观察——相模南的瞳孔里只有对麻烦的急于摆脱和对自身地位被挑战的戒备（仅拉芙自知；雪乃可能从拉芙的表情和站位感知到）
    - 拉芙没有摸右手腕丝带——只是指尖在裙侧收紧——比昨天的防御姿态更冷峭、更主动（仅拉芙自知；雪乃可能观察到）
  隐藏:
    - 拉芙对相模南表演的完整拆解——"为了虚荣而强行拼凑的低劣表演，连边角的胶水都清晰可见"
    - 拉芙收紧指尖的本能嫌恶的来源——都柏林家族训练出的对权力走廊中低劣表演者的识别和蔑视

