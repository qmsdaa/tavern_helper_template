  - ★旗标域：选择作出后承担后果、不撤回——寄信即断退路（laff.accepted_consequence_without_withdrawing_choice 旗标域——2026-08-17 指定补登，矩阵03未指定）
  - 揭晓拉芙希妮对平冢静提出借住请求
  - 揭示平冢静与达洛维小姐的旧识关系
  - 平冢静转述达洛维遗言："如果有一天那个小女孩能学会自己说'不'，要为她撑起翅膀"

进入状态:
  已发生:
    - 昨夜雪乃协助写完邀请函（场景91）
    - 拉芙希妮需要安全住所，避开爱布拉娜对公寓的监控
    - 平冢静已调离总武高，正在办理交接
  当前局面:
    - 早晨，拉芙希妮独自到千叶中央邮局寄出国际加急件
    - 寄出后前往总武高生活指导准备室找平冢静
  未发生:
    - 平冢静尚未知道信件已寄出
    - 拉芙希妮尚未正式提出借住请求

世界推动:
  - 列车轰鸣声、雨后湿冷的风
  - 千叶早晨的街道，春假中冷清的总武高
  - 平冢静的生活指导准备室：旧电脑、烟味、银色Zippo打火机

NPC动机:
  平冢静:
    - 此刻目标: 处理调职交接，在春假中加班
    - 行为倾向: 以粗放外表包裹对学生的关心，不追问太多但会给出实际帮助
    - 知情边界: 知道达洛维，知道那场火灾，知道拉芙希妮的背景；不知邀请函的具体内容
    - 不得执行: 主动向拉芙希妮施压说出全部真相、替拉芙希妮做决定
  达洛维:
    - 不直接出场，仅通过回忆和平冢静的转述存在

信息边界:
  公开:
    - 拉芙希妮已将邀请函寄往伦敦
    - 平冢静曾是达洛维的朋友
  局部:
    - 平冢静知道达洛维曾寄给她类似遗嘱的邮件
    - 邮件内容："如果有一天那个小女孩能学会自己说'不'，要为她撑起翅膀"
  隐藏:
    - 达洛维邮件的全部内容
    - 还火事件的具体细节
    - 拉芙希妮右手腕烧焦丝带的来历（平冢静可能知道但不点破）

