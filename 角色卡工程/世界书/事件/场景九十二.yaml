POV平行动向:
  hachiman: "春假早晨——难得早起，被小町差去买牛奶和报纸，回来路上买了罐MAX咖啡；他不知道今天有人寄出了一封寄往伦敦的信。"
  yukino: "春假早晨——晨跑回来顺手买了明天的牛奶，在家把《罗生门》的批注整理成讲义；她不知道昨晚写完的那封信，今天一早已经被寄出去了。"
  yui: "春假早晨——跟妈妈去超市，路过花店时买了一小盆多肉摆在窗台上；下午拍照片发群问'可爱吗'，收到两条回复。"
  laff: "主场轨道，见可用节拍，不变。"

玩家控制边界:
  - 拉芙希妮POV：如何向平冢静开口借住、对达洛维遗言的情绪反应由玩家决定
  - 不得替拉芙希妮改变已寄出信件的事实
  - 不得替平冢静主动提供超出现有承诺的帮助

可用节拍:
  - 拉芙希妮走进邮局，寄出国际加急件
  - 工作人员确认地址，给出回执单
  - 拉芙希妮走出邮局，按右手腕丝带
  - 走向总武高的路上整理腹稿
  - 到达生活指导准备室，闻到烟味
  - 敲门，平冢静应"进"
  - 拉芙希妮在门口说"我把信寄出去了"
  - 平冢静让坐，提到达洛维喜欢用旧纸张信封
  - 拉芙希妮回忆达洛维在伦敦教她写下自己名字
  - 平冢静回忆与达洛维的交往细节
  - 平冢静转述邮件遗言
  - 拉芙希妮提出借住请求或平冢静主动安排

偏离处理:
  - 若玩家选择先不提借住：平冢静可能主动问"你现在住哪"
  - 若拉芙希妮对达洛维话题保持沉默：平冢静会用打火机的"叮"声破冰但不会强迫
  - 无论如何，借住的解决方案必须在此场景达成

推进边界:
  保持当前场景:
    - 拉芙希妮尚未说明来意
    - 达洛维的话题尚未触及
  可以推进:
    - 借住安排已达成
    - 拉芙希妮离开或帮平冢静整理办公室
  永久失效:
    - 不适用

完成后事实:
  - 邀请函已寄出，预计最快后天抵达伦敦
  - 拉芙希妮与平冢静就借住达成共识
  - 拉芙希妮得知达洛维小姐给平冢静的遗言内容
  - 平冢静得知拉芙希妮已寄出对爱布拉娜的邀请函

氛围锚点:
  - 雨后湿冷的千叶早晨，列车轰鸣声
  - 春假中冷清的总武高，运动社团远处训练声
  - 生活指导准备室的旧电脑运行声、极淡的烟叶苦味
  - 银色Zippo打火机"叮"的金属脆响
  - 右手腕烧焦丝带的粗糙触感隔着针织布料

禁止提前:
  - 爱布拉娜收到信后的任何反应
  - 平冢静与拉芙希妮同住的日常细节（在后续场景展开）
  - 八幡、结衣、雪乃的出场
