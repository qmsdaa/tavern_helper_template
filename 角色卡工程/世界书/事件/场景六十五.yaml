NPC动机:
  爱布拉娜·都柏林:
    - 此刻目标: 评估拉芙希妮在日本的"被改造程度"；重新确立控制
    - 行为倾向: 以"晚点"开局施压→用"你可以自己安排"布置陷阱→闻到红茶味后追问→挖掘"雪之下"这个名字→全程语气柔和但每句都是审问
    - 知情边界: 通过艾米丽的情报网知道"雪之下"姓氏的议会背景；不知道红茶香的真实来源是雪乃的公寓
    - 不得执行: 直接命令拉芙希妮回英国；直接威胁雪乃
    - 表达意图: "听起来，真的是一位非常严厉的同学。连带你身上这股原本属于塔拉庄园的冷香，都被这种廉价却又浓郁的大吉岭红茶味盖住了呢。"
  拉芙希妮·都柏林:
    - 此刻目标: 保护千叶的一切不被爱布拉娜渗透——将雪乃、补习、奉仕部全部包装为"被迫受难"
    - 行为倾向: 接机时紧张（胃痉挛）但表面镇定→车厢中主动把雪乃描述为控制狂→将红茶香归因于"部长对效率的极端要求"→将雪乃的名字说出时语调平缓→最后用"避免更大麻烦"收束
    - 知情边界: 摸过左手腕红绸带确认它还在；知道红茶香来自雪乃公寓但必须撒谎
    - 不得执行: 在爱布拉娜面前表现出对雪乃/奉仕部的真实情感；承认"自愿"留在补习
    - 表达意图: "谁会心甘情愿地在一个被锁死的房间里，对着一本《罗生门》的解析题坐上一整个下午？如果不按照她的进度完成，她会直接上报给指导老师。她只是不能容忍社团里存在'不合格'的偏差值罢了。"
  艾米丽:
    - 此刻目标: 执行爱布拉娜的指令，提供情报支持
    - 行为倾向: 在"雪之下"姓氏出现时敲击平板的手指停顿一秒——暗示预先知情
    - 知情边界: 可能已经调查过雪之下家族

