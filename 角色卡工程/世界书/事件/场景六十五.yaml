场景功能:
  - 拉芙希妮独自乘成田特快前往机场接爱布拉娜——窗外冬雨
  - 机场见面：爱布拉娜以"晚点十三分钟"开启施压
  - 车厢后座审讯：爱布拉娜宣布元旦"你自己安排"——实为陷阱——要求"体验拉芙希妮的日常生活"
  - ★拉芙希妮用"强制补习"作为拒绝理由——国語B级、部长命令、禁足——将雪乃描述为"控制狂"
  - ★爱布拉娜闻到拉芙希妮身上大吉岭红茶味——拉芙希妮将红茶香包装为"被强迫的牢笼"
  - 爱布拉娜问出"雪之下"姓氏——得知奉仕部——艾米丽微反应暗示她已知情
  - 拉芙希妮将雪乃描述为"极度偏执"——用阳乃式的压迫感投射——成功骗过爱布拉娜

