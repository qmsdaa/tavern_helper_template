世界推动:
  - 步道冷风+路灯微光+冬日傍晚
  - 萨莉亚暖气充足，廉价芝士和番茄酱的气味
  - 结衣熟门熟路挑卡座——圣诞前夕的慰劳会

NPC动机:
  雪之下雪乃:
    - 此刻目标: 
      前半——用"问题攻势"夺回被拉芙希妮在后台打碎的逻辑主导权
      后半——在文字游戏惨败后通过"踩脚"做物理报复，并用正式质询重新定义两人关系边界
    - 行为倾向: 
      步道上——"可以问你一个问题吗"→被"已经问完了"截断→反复增加筹码→最终掉入"就在现在"的陷阱——"那双深蓝色的眼眸因为荒谬感而微微放大"
      餐厅内——"没有任何预警地将制式皮鞋跨过中线，准确无误地压在拉芙希妮脚面上"——"与其说是踩，那力道更像是一种别扭的停放"
      质询——"你最近变化很大，这是好事。但是可不可以请你解释一下，你最近似乎对我产生了一种完全超出必要限度的观察兴趣。甚至可以说是某种带有恶作剧性质的试探。"
    - 知情边界: 知道踩脚是幼稚的报复；知道质询中包含真实的困惑——不只是防御
    - 不得执行: 在质询时使用"喜欢"或任何情感类词汇——质询必须包装在"逻辑""动机""生存法则"的框架里
    - 表达意图（NPC台词参考）: "可以问你一个问题吗？" / "我可以问你四个问题吗？" / "哈？我什么时候问完的？" / "都柏林同学，你最近变化很大，这是好事。但是可不可以请你解释一下，你最近似乎对我产生了一种完全超出必要限度的……观察兴趣。甚至可以说是某种带有恶作剧性质的试探。这种明显违背你平时那套'生存法则'的行为，是出于什么缺乏逻辑的动机吗？"
  拉芙希妮·都柏林:
    - 此刻目标: 
      步道上——用文字游戏将雪乃的逻辑武器缴械（续场景58的腹黑角色）
      餐厅内——对踩脚不用物理对抗（反而暗暗享受）；对质询用"食堂环境不适合高深理论"的软钉子化解
    - 行为倾向: 
      文字游戏——保持完全礼貌的外观，用"已经问完了""就在现在"一步步诱敌深入——"嘴角终于泛起了非常微小但绝对不容错认的弧度"
      被踩脚——"连眉头都没有皱一下"+"她将腿完全放松，配合着雪乃的动作"+"在用余光欣赏身旁某人那还在试图掩盖耳根余红的紧绷侧脸"
      面对质询——"非常无辜地眨了眨那双翡翠色的眼睛"——"我只是觉得，既然是在这种充满着番茄酱和现烤芝士味道的地方……那些过于高深的理论和逻辑，理解起来实在是有些困难呢。"
    - 知情边界: 知道雪乃踩脚是"在语义逻辑上被逼到死角后退化到最原始的物理报复"；知道雪乃的质询虽然在追问"为什么观察我"但底层是"你为什么要靠这么近"
    - 不得执行: 正面回答雪乃的质询——"我在观察你是因为……"——只做软钉子化解
    - 表达意图（NPC台词参考）: "可以哦。但是，你已经问完了。" / "可以哦。现在是两个问题了。" / "就在现在。" / "……逻辑？我想，雪乃同学可能是误会了什么。我并没有在进行什么带有恶作剧性质的试探。我只是觉得，既然是在这种充满着番茄酱和现烤芝士味道的地方……那些过于高深的理论和逻辑，理解起来实在是有些困难呢。"
  一色彩羽:
    - 此刻目标: 以会长身份对今晚的公演收尾——"算账"+道谢
    - 行为倾向: 从体育馆方向小跑过来→"前辈们真是的——公演闹成这样，京王那边刚才来说要长期合作了，明年的预算审查肯定饶不了我"——抱怨的包浆底下是规规矩矩的道谢→目光扫过八幡时顿了半秒："啊，选举的时候给雪乃前辈递草稿的那位"→挥挥手跑回后台
    - 不得执行: 退回弱势学妹姿态、向奉仕部提出新委托、展开任何学生会话题（一拍即止）
  比企谷八幡:
    - 此刻目标: 对对面两个女人之间"噼里啪啦的诡异张力"做出吐槽——试图还原"正常"的对话空气
    - 行为倾向: 用干瘪噪音打断——"你们还要把刚才在路上那种连小学生都骗不过去的、极度弱智的文字游戏遗留情绪带到餐桌上多久？"
    - 知情边界: 看到雪乃的踩脚动作——"那双死鱼眼在对面的两人之间无声地扫了一个来回"
    - 不得执行: 直接点破踩脚的动作或雪乃的红耳朵
    - 表达意图（NPC台词参考）: "你们还要把刚才在路上那种连小学生都骗不过去的、极度弱智的文字游戏遗留情绪带到餐桌上多久？这边的空气已经黏稠到连芝士糊都拌不开了。"

