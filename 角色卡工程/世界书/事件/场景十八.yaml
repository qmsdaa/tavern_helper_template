场景: 18
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月下旬 · 林间学校第一天傍晚至夜晚"
索引日期: "2013-07-24"
地点: "千叶村青少年中心 · 拉芙与雪乃的和室"
人物: "拉芙希妮·都柏林、雪之下雪乃"
场景呈现参考: "拉芙希妮·都柏林"
事件焦点:
  类型: 角色
  角色:
    - "拉芙希妮·都柏林"
    - "雪之下雪乃"

场景功能:
  - 拉芙希妮首次与雪乃共处一室过夜——从安全扫描到确认房间无害后的释然
  - 无信号的夜晚成为拉芙希妮的"豁免时间"——无需汇报、无需戒备、无需权衡后果
  - 雪乃的呼吸声作为人类体温的规律声响——对拉芙希妮而言替代了旧丝带的安抚功能
  - 拉芙希妮决定放弃思考、不再摸旧丝带——一个微小的但意义重大的自我许可
  - ★拉芙希妮到此刻才在独处里承认"我没有准备好"——结衣犯错节点①（场景13/16替她答应、替她解释）的后果第一次显形，但她还看不清这条因果；承认只是疲劳式的、只对自己成立（2026-08-17 矩阵03第18行收尾补录）

进入状态:
  已发生:
    - 场景十七：电车进入信号弱区，拉芙希妮脊背微松，抵达千叶村
    - 第一天林间学校活动（指导员与小学生互动）结束
  当前局面:
    - 傍晚，领到钥匙，拉芙希妮站在和室玄关处
    - 雪乃站在旁边，拎着黑色旅行袋
  未发生:
    - 拉芙希妮尚未完成安全扫描
    - 房间尚未布置完成

世界推动:
  - 熄灯时间到了，青少年中心统一熄灯

NPC动机:
  雪之下雪乃:
    - 此刻目标: 整理行李，安定下来，维护日常秩序
    - 行为倾向: 用公事公办的语调维持常态；动作有条不紊；呼吸平稳规律；不给拉芙希妮多余的压力
    - 知情边界: 不知道拉芙希妮在审视房间死角（拉芙希妮的扫描行为是微妙的，一般人不会注意）
    - 不得执行: 主动开启深入对话；询问拉芙希妮白天的状态；刻意照顾拉芙希妮

信息边界:
  公开:
    - 两人共享一间和室
    - 熄灯后房间黑暗，只有窗外的树影和轻微风声
  局部:
    - 只有拉芙希妮知道她在做安全扫描和释然
    - 只有拉芙希妮能听到雪乃的呼吸声
  隐藏:
    - 拉芙希妮过去的失眠经历
    - 拉芙希妮关于"钻进别人被窝"的模糊记忆（可能是爱布拉娜——"宴会上弄脏裙子偷藏甜点"的片段）
    - 雪乃对此场景的内心感受

