POV平行动向:
  hachiman: "林间学校第一夜——他在男生宿营区被蚊子和男指导员的鼾声双重夹击，翻来覆去；他完全不知道同一片山里，有人正听着另一人的呼吸声入睡。"
  yukino: "林间学校第一夜——她在和室有条不紊地整理行李，把牙刷毛巾按习惯摆好；熄灯后她闭着眼，呼吸平稳规律——她不知道旁边的人正以她的呼吸声为参照物。"
  yui: "林间学校第一夜——她和女生宿舍的同伴聊到很晚，交换了明天的零食计划；她睡得很香，不知道隔壁房间发生过什么。"
  laff: "主场轨道，见可用节拍，不变。"

玩家控制边界:
  - 拉芙希妮POV：安全扫描后的释然程度由玩家决定；对"毫无意义却让人安心的整理"的感受由玩家决定；回忆片段的内容和情感色彩由玩家决定；"放弃思考"和"不再摸旧丝带"的心理过程由玩家决定
  - 不得替雪乃说内心台词或做超越外部观察的解读

可用节拍:
  - 拉开纸门，木轨钝响
  - 拉芙希妮安全扫描房间→确认无害→长呼一口气
  - 两人整理行李——无对话的并置动作
  - 熄灯，黑暗降临，窗外树影摩挲
  - 拉芙希妮平躺，听到雪乃规律的呼吸声
  - 模糊记忆片段浮现（可由AI提供意象片段，具体内容由玩家反应决定）
  - 黑暗里，她对自己说出一句迟到的承认——对这次出门、对两天一夜、对人群：我没有准备好。说完她没有再补别的
  - 拉芙希妮闭上眼睛，不再摸旧丝带

偏离处理:
  - 若拉芙希妮POV玩家选择安全扫描后仍然紧张：场景功能弱化，后续白天活动中拉芙希妮的紧张可能更明显
  - 若玩家不触发回忆片段：场景以"听到呼吸声→感到安心→闭眼"收束
  - 若玩家仍抚摸旧丝带：场景的情感收束力度降低，但不影响后续

推进边界:
  保持当前场景:
    - 尚未进入房间
    - 尚未熄灯
  可以推进:
    - 拉芙希妮闭上眼睛，进入睡眠/半睡眠状态
    - 进入次日清晨（场景十九的自然衔接）
  永久失效:
    - 一旦天亮/起床，本场景的深夜私密氛围不可重来

完成后事实:
  - 拉芙希妮在无信号的夜晚经历了一次"豁免"——没有家族联系，没有角色要求，只有呼吸声
  - 拉芙希妮在雪乃的呼吸声中放弃抚摸旧丝带——将旧丝带的安抚功能部分转移给外部（雪乃的存在）
  - 关于童年"钻进别人被窝"和"宴会上偷藏甜点"的模糊记忆被触及——对爱布拉娜的复杂情感隐约浮现
  - 拉芙希妮在独处中首次承认"我没有准备好"——这条事实只对她本人成立，不产生任何新的信息泄漏（其他三人的信息边界不变）

氛围锚点:
  - 纸门木轨发出的干涩钝响
  - 榻榻米陈旧干燥的灯心草气味，老式吸顶灯
  - 在彻底断绝信号的深山里，黑暗比城市浓稠得多——树影被夜风吹动像在玻璃上摩挲的巨大笔触
  - 不到一米外，雪乃平稳绵长的呼吸声——精准规律如她整理资料，但在黑暗中带有属于人类体温的质感
  - 右手腕旧丝带触碰被单，然后——不再需要去碰

禁止提前:
