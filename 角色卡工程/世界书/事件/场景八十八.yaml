    - 行为倾向: 立刻分配签证+航班任务→被拉芙希妮打断→立刻切换任务分配→"邀请函的用词，由你自己决定"
  比企谷八幡:
    - 此刻目标: 把"全员去英国"里唯一说不通的前提拆掉——给出"把她喊来千叶"的可行性证明
    - 行为倾向: 先骂"真恶心"宣泄→转头开始拆前提："那个女人的控制欲——那种必须由我亲手在火焰最中心检阅她的扭曲执念——根本不允许她在这个时候拒绝"→只铺可行性，把决定留给她本人→听到求助后闭嘴站到旁边
