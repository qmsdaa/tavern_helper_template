  - ★八幡把"必须去英国"这个前提拆掉：如果见面地点反过来由拉芙希妮指定，爱布拉娜会不会拒绝？——以她"必须亲手检阅结果"的控制欲，答案大概是否定的；他只证明"把她引来"可行性
  - ★拉芙希妮在这个缺口上再次站起来："我不去英国"——"既然她想看我变成了什么样子……那就让她自己来看。我要把她喊来千叶"
  - "在她的地盘上，我连一个呼吸都要经过计算。如果真的要面对她，我至少要站在我选的地面上"
  - ★拉芙希妮的第一次求助："到时候……你们，能站在我旁边吗？"
  - 结衣直接撞过去抱住——"当然啊！不仅要站旁边，还要站在前面！"
  - 雪乃把航班纸揉成团扔掉——重新分配任务：查成田到千叶最快轨道路线、附近外宾酒店、高级餐厅预约——"邀请函的用词，由你自己决定"
  - ★旗标域：八幡闭嘴站到了旁边——允许他人共同承担而非独自包揽（hachiman.accepted_shared_cost 首次行为证据，2026-08-17 补登记；确认画面在场景138）

