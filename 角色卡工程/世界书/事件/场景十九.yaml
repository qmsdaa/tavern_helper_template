场景: 19
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月下旬 · 林间学校第二天上午"
索引日期: "2013-07-25"
地点: "千叶村青少年中心 · 户外空地"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、鹤见留美"
场景呈现参考: "拉芙希妮·都柏林"
事件焦点:
  类型: 角色
  角色:
    - "拉芙希妮·都柏林"

场景功能:
  - 引入鹤见留美——被排斥的孤立女孩，与拉芙希妮形成镜像对照
  - 拉芙希妮的核心洞察：排斥（有人确认你存在后试图抹杀你）vs忽略（从一开始就没有人相信你的存在）——这是她对自身处境的定义性陈述
  - 拉芙希妮对比自己与留美：她被爱布拉娜挡着（"影武者"），留美是赤裸的——但两者都孤立，方式不同
  - 雪乃以"正确"的方式接近留美失败——拉芙希妮认识到"走过去的人不能是正确的人，也不能是被保护过的人"
  - 拉芙希妮的视线越过其他人，最后停在比企谷八幡身上；她没有叫他，也没有再看别人

进入状态:
  已发生:
    - 场景十八：拉芙与雪乃在和室共度第一个夜晚，拉芙放弃摸旧丝带
    - 林间学校进入第二天，清晨山冷，户外活动即将开始
  当前局面:
    - 指导员四人在户外空地外围观察小学生分组活动
    - 留美单独坐在杉树下，用书本挡住下半张脸
  未发生:
    - 雪乃尚未走向留美
    - 拉芙希妮尚未看向比企谷

世界推动:
  - 户外分组活动按计划进行
  - 小学生们三两成群，留美被群体排斥——不是偶然，是既定的小团体动态

NPC动机:
  鹤见留美:
    - 此刻目标: 在无法融入的集体中自保——用书筑墙，减少被注视的面积
    - 行为倾向: 背靠树干、双膝蜷起贴胸、书页举得过高挡住脸；没有任何同伴靠近她；对雪乃的接触用单音节"嗯"敷衍
    - 知情边界: 不知道有高中生在观察她；不知道拉芙希妮在把她与自己对照
    - 不得执行: 主动与他人交流或求助；表现出脆弱
  雪之下雪乃:
    - 此刻目标: 帮助孤立儿童——以她认为正确的方式
    - 行为倾向: 放下签到板径直走过去；站立姿态笔直端正，带着正式感；开口必定逻辑严密、挑不出错误
    - 知情边界: 不知道自己的"正确"本身就是距离
    - 不得执行: 成功打开留美的心扉（她做不到——拉芙希妮的结论）
    - 表达意图: 本场雪乃对留美的具体关怀话语由AI根据"逻辑严密、挑不出语法错误"的框架生成；留美的单音节"嗯"回应不可绕过

信息边界:
  公开:
    - 留美独自坐在杉树下，与群体隔离
    - 雪乃走向留美并试图沟通，遭到单音节回应后返回
  局部:
    - 只有拉芙希妮将留美与自己进行镜像对照（排斥vs忽略的分析）
    - 只有拉芙希妮认识到雪乃失败的原因（"太正确了"）
  隐藏:
    - 留美的具体家庭背景和排斥原因
    - 八幡是否也会尝试接近留美（拉芙希妮只是直觉推测）
    - 拉芙希妮的"影武者"身份和还火事件详情

