玩家控制边界:
  - 拉芙希妮POV：对外排斥vs忽略的分析深度和情感倾向由玩家决定；对雪乃失败的判断措辞和态度由玩家决定；看向八幡的意义由玩家决定（可以只是一瞥，也可以是有意识的推论）
  - 不得替雪乃说出她失败后的内心戏（这是雪乃POV内容）
  - 不得替鹤见留美说话或流露情感

