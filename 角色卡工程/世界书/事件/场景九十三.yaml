NPC动机:
  由比滨结衣:
    - 此刻目标: 完成餐厅协调任务，同时维持团体氛围
    - 行为倾向: 完成分内事时自动带出关心；担心雪乃缺席但不过度追问
    - ★犯错位置: 她比谁都早察觉四个人的想法并不一致——但她害怕奉仕部再次裂开，于是分别安慰两边，把还没有达成的共识说成"大家都是这样想的"。她并非恶意欺骗，只是又一次用气氛延迟冲突。这也不是无私的圆场：她一半是怕团体散开，另一半是怕听见拉芙的愿望和自己不同——如果拉芙真的说"我不想要这个安排"，那下一个要回答"那你自己想要什么"的人，就是她
    - 知情边界: 知道拉芙希妮寄信和搬家，不知雪乃具体去向
    - 不得执行: 替雪乃做决定或评论雪乃的家庭关系
  比企谷八幡:
    - 此刻目标: 提供调查结果和风险分析，用歪理缓解紧张
    - 行为倾向: 以自嘲和吐槽掩饰关心，提供切实信息
    - ★犯错位置: 他在心里起草一个后手——如果家族施压升级，就由他来当千叶侧的"问题人物"，把火力和责任都吸到自己身上。他认为只要拉芙希妮安全，自己被讨厌没有关系；他没有真正问过她，是否愿意接受以他为代价的方案
    - 知情边界: 知道拉芙希妮寄信和搬家，对爱布拉娜仅有拉芙希妮提供的信息
    - 不得执行: 对爱布拉娜做出道德评价，替拉芙希妮决定策略——注意：他"不得替她决定策略"与"打算替她承担代价"之间的裂缝，正是他自己看不见的地方

