场景功能:
  - 拉芙希妮向八幡和结衣通报：已寄出邀请函、暂住平冢静处（雪乃缺席→去本邸）
  - 四人（缺雪乃）启动爱布拉娜来日的应对预案：酒店选址、餐厅安排、联络渠道
  - ★共同失败·起点：方案在拉芙希妮在场的情况下成形，但她的角色是情报来源和被执行者，不是决策参与者——三个人"为了她"完成了方案，善意开始复制控制
  - 八幡已经把自己算进备选方案：如果需要一个千叶侧的“问题人物”吸引家族火力，他准备自己来；但他还没有真正问拉芙是否愿意接受这个代价
  - 结衣最早察觉四人的想法并不一致，因害怕奉仕部分裂而分别安慰、把尚未达成的共识说成"大家都是这样想的"
  - ★结衣的动机不是无私圆场：一半是怕奉仕部再裂开，另一半是怕听见拉芙说出与自己愿望不同的答案——如果拉芙真的开口要别的东西，下一个被放到台面上的人就是她自己
  - 拉芙希妮能看出方案并不完全属于自己，但为了不让他们失望，回答"我没有异议"——再次用顺从换取关系稳定
  - 确立群聊信息同步机制，为后续多线作战提供通信基础

