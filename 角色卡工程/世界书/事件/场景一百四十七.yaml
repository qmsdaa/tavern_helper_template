NPC动机:
  户冢彩加:
    - 目标: 在毕业前的球场再打一次球——已经打了；来活动室站一会儿
    - 行为倾向: 穿着队服（背后印着三年生名字）、不是来帮忙、不是来道别、就是来站一会儿
    - 知情边界: 八幡上次网球后写了"天晴。无风。"——他把那写进了自己的训练手帐
    - 不得执行: 不能说太直白——他的方式是"旁边画了一颗很小的太阳"
  材木座义辉:
    - 目标: 给八幡看最终稿——"把两个结局都写完了"
    - 行为倾向: 招牌开场的"吾之半生大业"→被八幡吐槽→认真回答——比以前的材木座沉稳了
    - 知情边界: 把八幡说的"城墙外面有春天"写进去了
    - 不得执行: 不能要求八幡评价——他把稿子放下就走
    - 关键意图: "删了很多。删完之后发现——想说的东西，原来不需要那么多字。"——材木座的成长
    - "留下和被留下都是选项——不是选项，是同一个方向的不同走法。"——材木座的领悟
  三浦优美子:
    - 目标: 确认相册成品；看活动室一圈
    - 行为倾向: 一本一本看活动室书架——在观察这个地方
    - 知情边界: 记得拉芙一年级时值日表上名字写的是拼音
    - 不得执行: 不能用命令式——她今天不是来委托的
  海老名姬菜:
    - 目标: 交付相册成品；给奉仕部留下最后一页空白
    - 行为倾向: 精准陈述——"一个都没被裁出去"；有人只交了一句话，那句话也放进去了
    - 知情边界: 知道相册最后一页该留给谁写
    - 不得执行: 不能替奉仕部写那一页
  叶山隼人:
    - 目标: 来说"谢谢你们接住了我没接住的东西"——不是道歉，是感谢
    - 行为倾向: 站在门口没进来——保持边界；说完就走——"没有等回答"
    - 知情边界: 回顾一年级文化祭——三浦来委托时他说"不要想太多"——后来发现那只是替自己省事
    - 不得执行: 不能进活动室——他始终不是奉仕部的人
    - 关键意图: "不是道歉。是——谢谢。"——叶山的角色收束
  一色彩羽:
    - 目标: 完成奉仕部正式移交文件；交付新奉仕部第一份委托
    - 行为倾向: 穿正式会服、带着学生会印章——用最正式的程序做最私人的告别
    - 知情边界: 知道这是学生会最后一个有三年生盖章的受理件
    - 不得执行: 不能说"谢谢前辈照顾"——她的方式是"选了做最后一件"
    - 关键意图: "不是那根接力棒。接力棒是学生会长传给下一任的。我不是。我是——这份委托。"——一色找到自己的告别方式

信息边界:
