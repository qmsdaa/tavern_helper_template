玩家控制边界:
  - 八幡：由玩家决定是否对维护做出反应；决定在雪乃最后通牒后如何自处
  - 雪乃：由玩家决定用什么措辞清空走廊；决定对拉芙希妮说的那句警告如何措辞
  - 结衣：由玩家决定是否对叶山的求助做出回应、如何回应；决定是否追叶山
  - 拉芙希妮：由玩家决定用什么措辞拆穿叶山；决定在F班围攻时是否退缩

可用节拍:
  - 叶山拨开人群，用温和笑容开场
  - 相模南哭声变高，优子立刻凑上去告状
  - 叶山叹气：你也不该把女生逼成这样
  - 拉芙希妮轻而精准地切断叶山尾音，拆穿他的伪善调停
  - 叶山面具裂开，向结衣投去求助目光
  - 结衣在拉扯——害怕被孤立但无法开口支持叶山
  - F班男生炸锅围攻八幡，叶山的劝阻被淹没
  - 拉芙希妮和结衣并肩护在八幡身前
  - 雪乃的皮鞋声从主席台方向逼近，人群自动退开
  - 雪乃用绝对零度清空走廊，对拉芙希妮说"不要也变成他那样"
  - 散场：相模南被扶走，F班男生讪讪散开，叶山退场
  - 结衣小跑着追叶山的背影（试图做最低限度的圆场）
  - 雪乃转身离开，冷硬话语砸在八幡脚边的影子上

偏离处理:
  - 如果叶山到场后选择了站队八幡：偏离其人设核心——他不可能在公开场合放弃温和调停
  - 如果拉芙希妮未拆穿叶山：叶山成功调停，相模南脱身，八幡继续承受所有恶意，雪乃到来时局面已平
  - 如果结衣选择支持叶山：拉芙希妮孤军奋战，结衣与奉仕部关系出现新的裂痕
  - 如果雪乃未来或晚到：F班讨伐可能升级为推搡，场景失控

推进边界:
  保持当前场景:
    - 叶山的调停与拉芙希妮的拆穿
    - F班的讨伐与雪乃的清场
  可以推进:
    - 所有人散场后→走廊只剩三人（雪乃离开、八幡留下、拉芙希妮留下或离开）
    - 散场→场景35：拉芙希妮的书面评估
  永久失效:
    - 叶山在此场景中已失去了温和面具的不可质疑性
    - 结衣与叶山之间的表面默契已破裂——她再无法若无其事地回到那个圈子

完成后事实:
  - 拉芙希妮正面拆穿了叶山隼人的伪善调停，声明了自己不容模糊的立场
  - 结衣经历了从被拉扯到最终站定（追叶山是圆场而非站队）
  - 雪乃用绝对零度平息了整场闹剧，同时对拉芙希妮发出警告
  - 雪乃对八幡下了最后通牒：不要再让她收拾场面
  - 八幡经历了人生第一次被多人公开维护，心理防线受到冲击

氛围锚点:
  - 叶山那件从来都穿得整整齐齐的西装外套随着步伐轻晃
  - 拉芙希妮翡翠色的瞳孔像冰冷的玻璃珠，毫不避讳地迎上叶山的目光
  - F班男生涨红了脸、试图用声量掩饰借题发挥
  - 雪乃的皮鞋声在通廊上不急不缓地逼近，像某种无形的寒气

禁止提前:
  - 禁止让叶山在公开场合承认自己的伪善
  - 禁止让结衣在叶山面前说出完整的话——她必须在拉扯中保持沉默
  - 禁止让雪乃在众人面前对八幡说出任何缓和的话
  - 禁止让八幡在散场后主动与任何人交流
  - 禁止在此场景解决八幡与雪乃之间的裂痕
