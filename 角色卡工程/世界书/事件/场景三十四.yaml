场景: 34
幕: "第三幕·二学期"
时间: "2013年10月下旬 · 场景三十三的直接延续 · 文化祭开幕当天"
索引日期: "2013-10-27"
地点: "主体育馆后台通廊"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、叶山隼人、相模南、优子、遥、F班男生们"
事件焦点:
  类型: 角色
  角色:
    - "雪之下雪乃"

场景功能:
  - 叶山隼人介入，试图用温和调停站到相模南一边
  - 拉芙希妮正面拆穿叶山的伪善调停——"凭借眼泪的多少来判定过错方"
  - 结衣在叶山和八幡之间的拉扯中被迫选择
  - F班男生借机将积怨砸向八幡，形成暴力讨伐
  - 雪乃从主席台赶到，用绝对零度清空走廊
  - 雪乃对拉芙希妮发出警告："不要也变成他那样"
  - 雪乃对八幡下达最后通牒：文化祭结束前不要再让我收拾场面

进入状态:
  已发生:
    - 相模南在后台通廊哭泣并指控八幡
    - 拉芙希妮和结衣已为八幡辩护，暂时压制了优子和遥
    - 相模南的哭声被噎住但未停止
  当前局面:
    - 通廊里的死寂正在发酵成更浑浊的情绪
    - 围观学生越围越多
    - 叶山隼人正从通廊那头走来
  未发生:
    - 叶山尚未开口调停
    - F班男生尚未发起集体讨伐
    - 雪乃尚未从主席台赶来
    - 八幡尚未被拉芙希妮和结衣的维护彻底击中心理防线

世界推动:
  - 文化祭开幕式已结束，学生分散到各岗位，后台通廊是必经之路
  - F班因场景31的企划被驳回而积压了对八幡的敌意
  - 叶山隼人作为现充圈核心，习惯性地想要"维持和平"

NPC动机:
  叶山隼人:
    - 目标：平息事端、维持表面和谐、不让任何人的体面彻底崩塌
    - 行为倾向：先用温和关切开场，然后习惯性地以和稀泥方式各打五十大板
    - 知情边界：到达时只看到相模南在哭，不了解她临阵脱逃的前因
    - 不得执行：不得承认自己调停的伪善性质；不得在公开场合放弃温和面具超过合理限度
  相模南:
    - 目标：利用叶山的到场重新夺回受害者身份
    - 行为倾向：在叶山面前加倍委屈，哭声变高
    - 知情边界：知道叶山会无条件调停
    - 不得执行：不得说出真相；不得主动收场
  优子:
    - 目标：拉拢叶山作为推翻拉芙希妮和结衣立场的法官
    - 行为倾向：立刻向叶山告状
    - 知情边界：同上
    - 不得执行：不得承认相模南的问题
  F班男生们:
    - 目标：借相模南的眼泪发泄对八幡驳回F班企划的积怨
    - 行为倾向：从围观升级为集体口诛，可能升级为推搡
    - 知情边界：不关心相模南是否逃避，纯粹找出气筒
    - 不得执行：不得主动停火；不得承认自己的借题发挥

信息边界:
  公开:
    - 相模南在哭，指责八幡
    - 叶山试图调停
    - F班男生开始讨伐八幡
  局部:
    - 拉芙希妮对叶山的拆穿——"凭借眼泪的多少来判定谁是过错方"
    - 结衣被叶山点名求助时的内心挣扎（只有叶山和结衣本人清楚）
    - 雪乃在人群外只用三秒钟就解构了全部事实（只有雪乃本人知道她在想什么）
  隐藏:
    - 八幡被两人维护时的"气管被压住"的感受
    - 雪乃那句"不要也变成他那样"的深层含义——她看到了拉芙希妮身上与八幡相似的自我牺牲倾向
    - 结衣追赶叶山背影时的具体对话

