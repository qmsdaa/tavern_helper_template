场景功能:
  - 展现爱布拉娜收到邀请函后的反应——冷读拉芙希妮和千叶四人组的策略
  - 揭示爱布拉娜对邀请函的核心解读：拉芙希妮的强硬是"借来的"，有人在替她纠正句子
  - 爱布拉娜启动赴日行程——预留航路窗口、布置三步包围（温斯顿、家政太太、玛格丽特姑婆）
  - 明确爱布拉娜的回应策略：不给同意也不给拒绝，用等待让拉芙希妮反省

进入状态:
  已发生:
    - 拉芙希妮已在3月26日寄出邀请函（场景92）
    - 信件抵达伦敦，艾米丽将其送到爱布拉娜办公桌
  当前局面:
    - 伦敦雨夜，翡翠资本总部
    - 爱布拉娜刚读完邀请函三遍
    - 信中没有问候语，只有日期、地点、到场期限，落款全名
  未发生:
    - 爱布拉娜尚未向拉芙希妮或任何人回应
    - 包围三部曲尚未启动
    - 航班尚未最终确定

世界推动:
  - 伦敦的雨从下午下到入夜
  - 胡桃木办公桌、拆信刀、羊皮纸
  - 银色文件盘等待归档

NPC动机:
  爱布拉娜·都柏林:
    - 此刻目标: 控制局面，不让拉芙希妮的"说不"成为实际脱离的开端
    - 行为倾向: 以冷读和战略分析应对；用三步包围（温斯顿/家政/玛格丽特）收紧而不直接施压
    - 知情边界: 知道拉芙希妮在害怕（字迹平稳但内容激进）；推测雪乃、八幡或结衣参与；不考虑"拉芙希妮是自主做出拒绝"这种解释
    - 不得执行: 直接发怒或失控；直接拒绝或同意邀请
  艾米丽:
    - 此刻目标: 执行爱布拉娜的指令，不做额外判断
    - 行为倾向: 专业、高效、不质疑
    - 知情边界: 知道信件内容和爱布拉娜的所有指令安排
    - 不得执行: 主动提供对拉芙希妮有利/不利的建议

信息边界:
  公开:
    - 爱布拉娜收到了邀请函
    - 信件内容：日期、地点、到场期限，署名全名
    - 爱布拉娜将预留四月五日出发的航路窗口
  局部:
    - 仅在办公室内：爱布拉娜读信三遍，分析了拉芙希妮的恐惧和千叶四人组的作用
    - 仅艾米丽知道：全部指令的完整内容
  隐藏:
    - 爱布拉娜的真实情绪（表面只有冷静分析）
    - 爱布拉娜是否考虑过"拉芙希妮是真的在拒绝"这种可能
    - 爱布拉娜对达洛维的信/笔/丝带的任何想法（本场景未提及）

