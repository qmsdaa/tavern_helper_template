    - 知情边界: 对拉芙希妮的家庭背景有教师层面的一知半解（可能通过校方渠道），但不知具体监控程度
    - 不得执行: 替拉芙希妮做主或施压逼迫参加
  拉芙希妮·都柏林:
    - 此刻目标: 评估能否参加——在家族许可与个人意愿之间悬置
    - 行为倾向: 右手无意识摩挲口袋里的家族专机；沉默三秒后给出不置可否的回答；会后独自收下宣传册
    - 知情边界: 不知道家族会不会批准；不知道爱布拉娜对此事的态度
    - 不得执行: 当场说"我想去"（对家族而言这是僭越）；明确拒绝（她内心想去）
  雪之下雪乃:
