场景功能:
  - 引入林间学校项目——奉仕部暑假的集体任务，第二幕的主线锚点；项目引入由结衣的兴奋带动（★结衣主场：她替大家答应）
  - ★结衣犯错节点①：她替大家兴奋、替大家答应——"一定要去！"的邀请里包含了对所有人意愿的假设；她假设"大家都愿意"，包括没有说愿意的拉芙希妮
  - 拉芙希妮面对集体外出活动时的微妙反应——家族监控的阴影笼罩她对自由的渴望
  - 拉芙希妮无法当场答应，但没有拒绝——她收了宣传册，表达"想去"的意愿但没有说出口（结衣的过度维护让"我还没准备好"更难说出口）
  - 确立平冢静对拉芙希妮处境有某种程度的察觉（声音放轻、不追问）

