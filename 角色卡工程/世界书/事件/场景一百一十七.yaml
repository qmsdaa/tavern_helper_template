  yui: "夏祭——她绕拉芙希妮看两圈：'下午可是我亲自系的'；烟花结束后，她在渐暗的天光里第一个开口：'呐明年大家再一起来吧！'；回程前她突然停下来：'我想去买豆沙团子，谁陪我都行，没人陪我自己去'——结果真的只有她一个人去，她笑着说'啊哈哈，我以为你们也想去的'，买回来时团子已经咬了一口；烟火结束后她从包里掏出一次性相机，挨个把六个人往灯笼光最好的河堤栏边拽——大志、八幡、雪乃、拉芙希妮一个没落下，'三、二、一——'快门咔嚓一声，那一刻六个人是'我们'。"
  laff: "夏祭——她穿着自己选的水色浴衣转半圈，'这件是我自己选的'；烟火下她取下朝颜簪子握在掌心看了看，抬手重新插回去；结衣说'明年再来'时，她是第一个回应的：'……嗯'。"

