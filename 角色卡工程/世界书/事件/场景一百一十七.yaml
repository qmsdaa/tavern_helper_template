场景功能:
  - 夏季祭典团建场景——六人第一次作为正式社团成员共处校外
  - 拉芙希妮穿自选的浴衣("这件是我自己选的")——从被安排穿衣到自主选择的成长
  - 拉芙希妮把朝颜簪子从发间取下看了看又插回去——对美的自我确认
  - 结衣提出"明年大家再一起来吧"→拉芙希妮第一个回应"嗯"
  - ★结衣的普通愿望：祭典里她主动提出想再去某处/想吃某样东西——仅因为自己想，不服务任何主线；她允许别人拒绝，但不预先撤回邀请
  - ★祭典里有个走丢的小女孩。结衣蹲下来和她平视说话，陪她等到家长；动作很熟，不拿这件事替自己解释未来
  - ★结衣的组织拍：烟火结束后六人散落在河堤草地上——大志帮小町提金鱼、八幡盘腿坐边上汽水瓶插草里、雪乃在面具摊那段沉默后还没完全回来、拉芙希妮仰脸看余烬。结衣是唯一能在这时候把六个人收拢成一张合影/一个约定的人——她没有喊口号，而是从包里掏出一台一次性相机（"我妈让我拍的，说要洗出来贴冰箱"），挨个把人往灯笼光最好的那截河堤栏边拽，连雪乃都被她用"小雪乃你也来嘛，就一张"拽过去。这是她的驱动方式：用人际温度把散漫的六个个体临时焊成一个"我们"，不服务任何主线，只为这一刻存在（2026-08-17 第二批 B11 补录）
  - 回程路上簪子还在就没有多按——安全感

