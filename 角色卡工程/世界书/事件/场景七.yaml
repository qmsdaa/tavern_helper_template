玩家控制边界:
  - 对雪乃的邀请如何回应——接受、拒绝、或犹豫
  - 是否对八幡的反应提出任何询问
  - 是否在复习中主动暴露自己的学业情况

可用节拍:
  - 户冢推门——八幡弹起——雪乃合书——结衣跳起
  - 户冢说明委托——八幡过度承诺——雪乃冷处理
  - 结衣心虚加入——雪乃注意到拉芙希妮
  - 雪乃邀请拉芙希妮——拉芙希妮反应

偏离处理:
  - 若玩家拒绝雪乃的邀请：复习期间拉芙希妮仍会按惯例待在活动室，但为独立内容——她将失去第一次被主动纳入集体活动的里程碑
  - 若玩家反客为主热情加入：结衣会高兴，雪乃会保持距离观察，八幡继续围着彩加转

推进边界:
  保持当前场景: 户冢刚站在门口，尚未说明来意
  可以推进: 复习计划敲定，拉芙希妮接受或拒绝邀请后的第一次集体复习即将开始
  永久失效: 八幡收回对彩加的过度热情（他不会）

完成后事实:
  - 户冢彩加的复习委托被接受
  - 雪乃首次主动邀请拉芙希妮参与集体活动——从场景三的被动接受（平冢静强制安排）到现在的主动纳入
  - 拉芙希妮（若接受）被正式纳入奉仕部的"我们"范畴
  - 拉芙希妮第一次观察到八幡性格中的反常面（对彩加的热情）——这是一个信息富集点

氛围锚点:
  - 六月的潮湿空气积攒起来的黏腻感——老旧空调在苟延残喘
  - 拉芙希妮翻阅诗集的动作被门声打断——她抬起头时的那种无声的好奇
  - 八幡从趴桌状态弹起时椅子发出的不堪重负的吱呀声
  - 拉芙希妮眼中那一丝不易察觉的困惑——像是在解码一种她不熟悉的社交信号

禁止提前:
  - 复习过程和结果（场景八）
  - 梅雨季节正式来临（场景九）
  - 拉芙希妮对八幡-彩加关系的任何明确判断
