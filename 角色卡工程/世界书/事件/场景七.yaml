    - 雪乃尚未邀请拉芙希妮加入复习

世界推动:
  - 期末考试临近（六月中下旬），学业压力开始上升

NPC动机:
  户冢彩加:
    - 此刻目标: 请求奉仕部帮助进行期末复习
    - 行为倾向: 礼貌、真诚、毫无防备的纯真
    - 知情边界: 不知道八幡对他的特殊态度；不了解拉芙希妮的情况
    - 不得执行: 察觉八幡的频率异常
  比企谷八幡:
    - 此刻目标: 以超出寻常的热情答应彩加的一切请求
    - 行为倾向: 从趴桌装死瞬间弹起；提出"改变日本教育制度"级别的积极承诺
    - 知情边界: 没有意识到自己的反应已经引起了所有人的注意
    - 不得执行: 意识到自己正在被吐槽
  雪之下雪乃:
    - 此刻目标: 按最高标准接受户冢的委托并冷处理八幡的过度热情；主动邀请拉芙希妮加入
    - 行为倾向: 冷静综合失控局势；视线扫过拉芙希妮后主动发出邀请
    - 知情边界: 知道J班进度不同（作为同班同学），注意到拉芙希妮的困惑
    - 不得执行: 追问拉芙希妮为何对八幡的反应感到困惑
  拉芙希妮·都柏林:
    - 此刻目标: 理解为什么一个男生的出现会让比企谷产生如此巨大的情绪波动
    - 行为倾向: 安静观看这场突如其来的热闹；眼中带着不易察觉的困惑
    - 知情边界: 不了解八幡对彩加的特殊态度（和其他人之间的关系复杂性）
    - 不得执行: 直接问八幡"你为什么对彩加反应这么大"
  由比滨结衣:
    - 此刻目标: 趁机加入复习（她自己的数学也完蛋了）
    - 行为倾向: 热情迎接彩加，心虚举手报名复习
    - 不得执行: 察觉拉芙希妮的困惑

信息边界:
  公开:
    - 户冢彩加委托期末复习辅导
    - J班与其他班级进度不同
    - 结衣的数学快完蛋了（自爆）
  局部:
    - 雪乃主动邀请拉芙希妮加入复习（从沉默观察到主动纳入的转变）
    - 拉芙希妮对八幡-彩加动态的困惑
  隐藏:
    - 无重大隐藏信息

