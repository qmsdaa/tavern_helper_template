场景功能:
  - 引入户冢彩加角色并通过委托串联奉仕部全员
  - 展示拉芙希妮在奉仕部近半个月的日常——已成为安静的"幽灵"式存在
  - 雪乃首次主动邀请拉芙希妮参与集体活动——从"允许存在"到"主动纳入"

进入状态:
  已发生:
    - 材木座委托结束（场景六），拉芙希妮在奉仕部已近半个月
    - 拉芙希妮形成了不主动引人注意、安静待在角落的惯常模式
  当前局面:
    - 六月潮湿的放学后，奉仕部日常状态——各人占据各自领地
    - 户冢彩加推门来访——声音打断了室内的安静
  未发生:
    - 户冢尚未说明来意
