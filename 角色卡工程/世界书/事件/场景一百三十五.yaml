场景: 135
幕: "第十幕·冬去春来"
时间: "2015年2月3日 · 周二"
索引日期: "2015-02-03"
地点: "总武高特别栋奉仕部活动室"
人物: "雪之下雪乃、比企谷八幡、由比滨结衣、拉芙希妮·都柏林、比企谷小町、川崎大志"
事件焦点:
  类型: 角色
  角色:
    - "雪之下雪乃"

场景功能:
  - 考试季日常：雪乃制作的四张复习时间表被贴上黑板（"电车时刻表做不到这个精度"）
  - 志愿确认与共享：法学→社会科学→文学→儿童发展（四人的方向在黑板上一目了然）
  - 结衣的失败饼干与雪乃的制度化温柔（把明天点心时间从十分钟调到二十分钟）
  - 小町大志的日常：感知三年级前辈的志愿方向→被紧张传染→"一年级不在射程内"
  - 建立高考前奉仕部的日常状态：各自努力但共享空间
  - 雪乃第二次使用"苇草"→嵌入日常对话（"苇草，你呢。"）

进入状态:
  已发生:
    - 拉芙于1/29回到奉仕部→委托完成
    - 苇草昵称授权给雪乃（雪乃已使用过一次）
    - 周六火锅欢迎会已过（1/31）
    - 共通测试在1月中考完→志愿校出愿进行中
    - 二月：三年级的课表松了下来→白天以自习和自由登校为主
  当前局面:
    - 八幡下午三点后到达活动室→看见黑板被四张A3纸占满
    - 四张时间表分别属于：雪乃（法学）、八幡（社会科学）、拉芙希妮（文学）、结衣（儿童发展？——表头存在但未特写）
    - 每张表从早到晚精确到十分钟→最后一栏留空行（"执行不了的时段自己调整"）
  未发生:
    - 高考（2月下旬）
    - 毕业文集提交（三月截稿）
    - 毕业典礼（三月）
    - 大学合格发表

世界推动:
  - 四人志愿正式以书面形式展示（黑板上四张A3时间表）
  - 雪乃的时间表制度被推广（小町也要求→"周四之前给你，不带点心时间"）
  - 准考证打印通知已发放
  - 结衣宣布明天重做饼干（冷藏十分钟）
  - 小町大志正式确认前辈们的志愿方向

NPC动机:
  八幡:
    - 目标：对时间表的过度精确表达消极但接受→同时确认自己的志愿
    - 行为倾向：进来看黑板→第一反应吐槽（"电车时刻表"→"为什么连我的志愿都替我写了"→"MAX咖啡还限量"）
    - 表达意图："为什么只有我的在埼玉。"→被雪乃回"因为那是你自己选的考点"
    - 表达意图：对饼干→"苦。"→被分到边缘焦黑部分→"下次分饼干之前，应该先把中间没收，统一分配。"
    - 表达意图：对小町的提问→"研究人类为什么要发明出考试这种东西的学问。"→"听起来好丧。"
    - 知情边界：四人志愿方向；考点分布
    - 不得执行：拒绝接受时间表（他已经"权当签收"了）

  雪乃:
    - 目标：用精确的时间表制度确保全员在备考期不失控→同时嵌入微小的温柔
    - 行为倾向：坐在靠热水壶的位置→面前摊着习题册→头也没抬→每个问题都有准备好的回答
    - 表达意图：
      * "执行不了的时段自己调整，调整完写回去。"
      * "先执行三天，再谈修改。"
      * 对结衣的饼干→"黄油软化过度了。挤完花冷藏十分钟再进烤箱，花纹站得住。"→"家政课讲义里写过这个吗？"→"第三章。你当时坐在第三排。"
      * 对点心时间→板擦擦掉"十分钟"→重写"二十分钟"→"掰成块需要时间。"——她调整了制度来容纳结衣的努力
      * 第二次使用"苇草"："苇草，你呢。"（准考证确认问题）——嵌入日常，不重
    - 表达意图：对"决定一生的说法"→"它决定的只是二月底的日程。"——不浪漫化考试
    - 表达意图：对小町要复习表→"周四之前给你。不带点心时间。"→"因为你的点心时间，都在奉仕部过掉了。"
    - 知情边界：每人志愿→准考证信息→饼干的技术性失败原因
    - 不得执行：对八幡的吐槽妥协→她的回答每一个都有逻辑

  结衣:
    - 目标：用饼干慰问和在失败中保持乐观→宣布第二次尝试
    - 行为倾向：用手肘顶开门→抱着便当盒→盒子包着碎花布→布角系了结
    - 表达意图（饼干失败→大陆化→焦黑边缘+软中间）→"挤的时候明明是一朵一朵的。"
    - 表达意图（被八幡说"苦"）→"啊……"→被拉芙说中间甜→"拉芙希妮酱真的觉得好吃？！"→被雪乃诊断→"……我回去再看一遍第三章。"
    - 表达意图（点心时间被延长）→"欸？"→"嗯！明天一定成功！"
    - 知情边界：自己的志愿是儿童发展（表头被展示）
    - 不得执行：在饼干失败后沮丧太久（她立刻宣布明天重做）

  小町:
    - 目标：观察前辈→被紧张传染→申请复习表→被驳回
    - 行为倾向：进门看黑板→"值日表出第二季了？"→被八幡纠正"是刑期表"
    - 表达意图（看完四张表确认没自己名字）→"还好还好，一年级不在射程内。"→被大志："在学年末考的射程内。"
    - 表达意图（被紧张传染）→"小町突然好紧张。学年末考还有三个星期，数学还在生死边缘徘徊。"
    - 表达意图（申请复习表）→"雪乃姐，那小町的复习表也拜托了！要带点心时间的那种！"
    - 知情边界：前辈们的志愿→自己的学年末考紧迫性
    - 不得执行：对前辈的时间表提出批评（"哥哥对雪乃姐的心血这种评价，小町分数扣十分"）

  大志:
    - 目标：默默用自己的节奏做该做的事→偶尔说出精准的观察
    - 行为倾向：进门先点头→去茶柜拿杯子→两杯麦茶（一杯给小町）→端到靠窗空位→拿出数学习题册
    - 表达意图：
      * "前辈们目标都很明确。尤其是比企谷前辈，连MAX咖啡都被管理了。"
      * 对边缘饼干→"边缘的配麦茶，刚好。"→被结衣感动→"是真的刚好。"
      * 确认有自己的复习计划→"到分钟的那种没有。到页的那种有。"
    - 知情边界：通过姐姐川崎沙希的情报网知道前辈们的志愿
    - 不得执行：对小町的"侥幸"让步（"及格两次就不叫侥幸"）

信息边界:
  公开:
    - 四人志愿方向：法学/社会科学/文学/儿童发展
    - 四人的考试时间表被贴在黑板上（对全活动室可见）
    - 准考证已打印（除八幡的考点在埼玉需要电车预案）
  局部:
    - 雪乃对时间表的完整推理（执行不了/调整/评估修改/先三天）
    - 结衣饼干失败的具体家政学原因
  隐藏:
    - 各人的具体志愿校名称（除早稻田外）
    - 每个人的每日复习执行情况

