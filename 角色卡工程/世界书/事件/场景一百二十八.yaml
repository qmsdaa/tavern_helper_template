场景功能:
  - ★本场为四方承重场：三人的私愿承认（三枚旗标）+结衣×雪乃的委托方式分歧+拉芙写下愿望，焦点登记由拉芙转为群像（2026-08-17 第三批 C1b，登记口径变更，正文不动）
  - 分工会议：四人将委托方案拆分为四个栏目，各自填写负责领域
  - 结衣的关键提问："全都是替你想好的事，替你列好的事。没有一行是你真正想做的事。"→"那是条款。不是愿望。"
  - ★结衣与雪乃的真实分歧：四栏结构由雪乃先画——"结构先于内容"；结衣当面对她说"结构很好。但愿望那一栏，不该由结构规定能不能有"——雪乃以"执行前提"反驳，结衣没有退让、也没有把分歧升级成争执；分歧成立后两人照常工作（yui 与雪乃第一次在委托方式上正面分歧）
  - ★三人分别承认私人愿望（不包装成"为了拉芙"）：八幡承认"我希望她留下"——这是我想的，不是最优解；雪乃承认"我不想失去这名成员"——不是部长对部员，是我自己；结衣承认"我不想我们四个分开"——不是大家，是我。私人愿望被明说为私人愿望，不再是决策的伪装（hachiman.stated_personal_desire／yukino.admitted_personal_wish／yui.admitted_selfish_wish 旗标域）
  - ★结衣的私愿被明说为私愿：她不再用"大家一定都是这样想的"代替本人立场——"这句话是我的。别人怎么想，要问了才算。"
  - 拉芙写下"我想成为作家"——不是今天才想出来的，是今天才被写下来
  - 雪乃填入"早稻田大学文学方向"——将愿望转化为路径
  - 八幡的反自我牺牲条款写入第三款（提交高坂理津子作为制度化的最后防线）
  - 立冬——银杏只是少了，还没有全掉

进入状态:
  已发生:
    - 10/24 委托受理→分工框架建立
    - 两周内各人已各自准备分工内容
    - 拉芙准备了草稿——三栏让出，最右栏自己
  当前局面:
    - 立冬，千叶的风从早晨起变了温度
    - 放学后小町和大志完成值日→感知到"正事"的味道→自行离场
    - 白纸中线被雪乃用水笔提前画好，四列，顶端写有方案标题
  未发生:
    - 愿望被写下之前的沉默与博弈
    - 拉芙"成为作家"的后续路径展开
    - 委托方案的最终签名

世界推动:
  - 分工四栏填写完成——方案、失败条件、反自我牺牲、生活保留、综合签名各就其位
  - "成为作家"作为愿望被写进文书——从此它不再只是私人的念头
  - 早稻田大学文学方向作为升学目标被明确
  - 拉芙确认明天之前整理完成整体方案——最终签名在自己手上

NPC动机:
  小町:
    - 目标：感知到气氛不对，完成值日后快速撤退
    - 行为倾向：两次把一句话吞回去——吞回去的内容是"有什么我可以帮忙的"但选择不问
    - 表达意图："前辈们有正事要做了。我们今天先回去吧。"
    - 知情边界：不知道具体讨论内容
    - 不得执行：留在活动室旁听
  大志:
    - 目标：配合小町的撤退
    - 行为倾向：感知到空气"有味道"——"……有这么明显的味道吗"
    - 知情边界：同上
    - 不得执行：同上
  八幡:
    - 目标：用反自我牺牲条款构建委托的制度化安全网
    - 行为倾向：在失败条件和备用路径栏写入干瘪但精确的注释
    - 表达意图：写入反自我牺牲三款：
      ①本人不因长辈压力话改写退出申请内容
      ②未经本人书面同意任何人不得替本人签字放弃权益
      ③一旦出现自我牺牲性让步，记录立即由奉仕部提交高坂理津子
    - 表达意图："我没动你的栏。所以万一你下笔写的是'牺牲我可以'，那就是三年不见一个有效举报的志向。我把这一栏留给告发口用。"——这是他对拉芙的关怀方式：把保护变成制度
    - 知情边界：只读自己那栏；拉芙那栏是否公开由拉芙下次决定
    - 不得执行：未经拉芙同意阅读她的最右栏
  雪乃:
    - 目标：将委托方案制度化为可执行的四栏结构
    - 行为倾向：先在白纸中线画好四列→让结构先于内容
    - 表达意图：面对结衣"愿望栏不该由结构规定"的质疑时，以"执行前提"和"效率"回应——她不是被说服，而是把分歧当作可并行的技术问题处理；两人正面分歧但未升级为争执
    - 表达意图：在左栏写入留学、在留、住所的可承担方案，信托与家族权利的边界
    - 表达意图：听到"成为作家"后→"升学方向在这一行下面再写一行。早稻田大学文学方向相关专业。"——最快的制度化反应
    - 表达意图：建立"各自只读自己登记的那一栏"的保密规则
    - 知情边界：同上
    - 不得执行：替拉芙决定愿望是什么
  结衣:
    - 目标：确保拉芙的愿望不被"条款"掩埋
    - 行为倾向：在自己那栏写了出人意料的短——生日、节日、见面次数、回信不过夜
    - 表达意图：与雪乃的分歧当面成立——"四栏很好。但愿望那一栏，不该由结构规定能不能有"；雪乃以"执行前提"反驳时她没退让，但也没有把分歧升级成争吵
    - 表达意图："全都是替你想好的事，替你列好的事。没有一行是你真正想做的事。"——观察到了四栏的结构性空白
    - 表达意图："那是条款。不是愿望。"——最简洁的区分
    - 表达意图："我想填的是愿望。一年以后、五年以后——你买第一本书给我的时候，我希望上面写着的是你真正想要的那种句子。"——把"愿望"与"时间"挂钩
    - 表达意图：在自己栏留了一格——"留在千叶要保留的一件事（这一格留给拉芙希妮酱自己填）"——给自己和拉芙之间留一个未填的空间
    - 表达意图：写完后放下笔，明确声明——"先说好，这不是'大家'的意思。'不想我们四个分开'——这句话是我的。他们愿不愿意，我不知道，要问了才算。"
    - 知情边界：同上
    - 不得执行：替拉芙说出愿望是什么

信息边界:
  公开（在四人之间）:
    - 四栏各自的内容（每个填写人在自己权限内阅读自己的栏目）
    - 拉芙的愿望栏已被填入（是否公开由拉芙下次决定）
  局部:
    - 反自我牺牲条款第三款的完整表述（涉及制度化举报机制）
  隐藏（从外部）:
    - 委托的全部内容

