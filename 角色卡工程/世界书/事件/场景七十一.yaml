  - 拉芙希妮的外在形象变化：左手红绸带明晃晃缠在袖口外、右腕烧焦丝带露出一截、耳畔粉色发卡——三件"千叶印记"同时外露
  - 总武高玄关：四人碰头→各自换鞋→走向教室
  - 结衣在两圈之间切换角色的疲惫：寒假里她的语气在三浦圈子和奉仕部之间来回换挡，开学第一天还没完全切回来
  - 铺垫结衣不愿永远成为"最好相处的人"——寒假帮邻居家看小孩被三浦笑"保姆命"，她笑着记在小本本上
  - 早期铺垫儿童发展/照顾孩子兴趣——不宣布志愿，只留下兴趣的痕迹

