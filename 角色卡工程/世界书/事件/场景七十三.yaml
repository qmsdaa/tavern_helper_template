  角色:
    - "雪之下雪乃"

场景功能:
  - ★一色的会长身份消化过渡：52 她立过"我不接受被设计"，本场她的面具开始慢半拍——有人顺口叫她"会长"时她的回答变了味（从撒娇纠正"人家还只是副会长嘛"变成默认/只顿了半秒），或她对自己脱口而出的一句官方措辞愣了半秒。这是 52→59(A5b)→73 的一色线之间"身份已经落在她身上"的过渡拍（2026-08-17 第二批 B9 补录）
  - 一色彩羽首次出现在活动室——借"学生会烟雾报警器坏了"蹭茶点
  - ★一色焦点事件②·面具式求助：一色借蹭茶点带来一叠没写完的学生会文件（会费预算书），用完美后辈面具撒娇求助——"前辈们好过分～只有我一个人在写哦"
  - 对方没有利用她的漏洞（没有点破"你自己要当会长的"），也没有立刻替她完成——雪乃说"学生会的事务属于学生会"，八幡只吐槽不动手
  - 一色短暂暴露出没排练过的疲惫/恼怒——接完学生会电话回头时，笑容没有立刻挂上，慢了半拍才重新校准
  - 本场她的求助仍是面具式（不算 iroha.made_uncalculated_request 达成）；不得直接读取她的内心账本
  - 拉芙希妮提交餐饮业调查报告——雪乃紧张翻阅，前几页正常
  - ★最后一页——空白附录页上贴着一张便利贴：简笔画福尔摩斯潘先生+脖子上的蝴蝶结
  - 便利贴无声拆穿雪乃昨晚抱着潘先生内耗的事实——"这张小小的便利贴，远比任何长篇大论的'客观记录'都要致命"
  - 雪乃慌乱用手掌压住→一色问"报告有问题吗"→雪乃强装镇定

