    - 此刻目标: 用便利贴对雪乃进行一次安静的"反击"——提醒她笔记本事件的后续
    - 行为倾向: 提交正常报告→最后一页贴便利贴→简笔画潘先生+蝴蝶结→看雪乃慌乱→"或者，部长更希望我把那些实质性的问题以文字的形式补在上面？"
    - 知情边界: 知道雪乃昨晚抱着潘先生想了什么（场景72的延续）
  雪之下雪乃:
    - 此刻目标: 不被任何人发现便利贴的内容
    - 行为倾向: 紧张翻阅报告→前几页正常松口气→翻到最后便利贴→僵住→用手掌压住→强装镇定指责"排版随意"
  一色彩羽:
    - 此刻目标: 蹭茶点，感知气氛；顺带把学生会文件的疲惫放出来试探
    - 行为倾向: 察觉到异常但被雪乃糊弄过去；接学生会电话回来时笑容慢了半拍才挂回去；用撒娇包装求助（"只有我一个人在写哦"），被"学生会事务属于学生会"挡回后没有死缠
    - 知情边界: 知道奉仕部不会替她干活，但想知道谁会心软、谁负责否决
    - 不得执行: 在本场完成"不计算式求助"（面具还在）；把文件直接摊给奉仕部要求接手

