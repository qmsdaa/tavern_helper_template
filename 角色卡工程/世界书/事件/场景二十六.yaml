场景功能:
  - 二学期开学——奉仕部四人重新聚集，确认暑假后的人际动态
  - 结衣注意到拉芙的头发上没有别那枚粉色发卡——短暂失落但迅速用笑容盖过（拉芙收到但未公开展示）
  - 雪乃为拉芙泡的红茶没有放方糖——表明雪乃清楚林间学校的加糖是特殊安抚，当前的日常不需要过度甜味（这种精准克制比加糖更让拉芙感到踏实）
  - 拉芙对八幡的"低效率假设"做出冷淡回击——结衣评价"越来越像小雪乃了"
  - 雪乃因结衣的这句评价出现极短暂的动作凝滞

进入状态:
  已发生:
    - 暑假结束，二学期开始
    - 场景25达洛维信已被拉芙发现（或根据路径未发现）
    - 拉芙口袋中有结衣的粉色发卡（未公开展示）
    - 拉芙皮包夹层中有雪乃号码和温斯顿私人邮箱
  当前局面:
    - 开学第一天放学后，奉仕部四人陆续到达活动室
    - 结衣已到，拉芙推门进入，雪乃在泡茶，八幡在角落
  未发生:
    - 雪乃尚未完成泡茶和分发
    - 拉芙尚未对八幡做出回击
    - 平冢静尚未出现（场景27才出现）

世界推动:
  - 四人陆续到达活动室，恢复社团日常
  - 雪乃按惯例为四人泡茶分发
  - 暑假作业和开学话题自然展开
  - 平冢静尚未到来（场景27将到来并带来文化祭委托）

NPC动机:
  雪之下雪乃:
    - 此刻目标: 恢复奉仕部的日常秩序，为成员提供茶饮
    - 行为倾向: 按习惯分配茶（果茶→结衣，无糖红茶→八幡，无糖红茶→拉芙——没有方糖）；用冷淡的规则性语言回击结衣的作业丢三落四；听到结衣说拉芙"越来越像小雪乃"时，端茶杯的动作出现极短凝滞后垂下眼睑
    - 知情边界: 知道林间学校时给拉芙加了三块方糖是特殊安抚；不知道拉芙对方糖的具体内心反应和锤子记忆；不知道达洛维的信
    - 不得执行: 解释为何这次不加方糖、对结衣的"越来越像"评价做出任何口头回应或面部反应
  由比滨结衣:
    - 此刻目标: 与奉仕部成员重聚，恢复暑假后的亲密度
    - 行为倾向: 见到拉芙时分外雀跃；注意到拉芙头上没有粉色发卡后眼中闪过短暂失落——但用更耀眼的笑容盖过；感叹暑假过得快；听到拉芙回击八幡时发出"越来越像小雪乃"的感叹
    - 知情边界: 知道给了拉芙发卡但不知道拉芙放在了哪里；不知道拉芙不展示发卡的原因
    - 不得执行: 直接问拉芙为何不戴发卡、对拉芙的冷淡回应表现出受伤
  比企谷八幡:
    - 此刻目标: 维持最低限度的社团存在，避免多余的社交劳动
    - 行为倾向: 用干瘪语气吐槽结衣的受虐倾向和大家的作业；擅自将拉芙列入"作业放弃者"假设；被拉芙冷淡回击后僵住、咂嘴、移开视线
    - 知情边界: 不知道拉芙的变化来自一个暑假的经历
    - 不得执行: 对拉芙的回击做出长篇反驳或情绪化反应

信息边界:
  公开:
    - 奉仕部四人二学期首次聚集
    - 雪乃为每人泡茶：果茶→结衣，无糖红茶→八幡，无糖红茶→拉芙
    - 拉芙回击了八幡的低效率假设
    - 结衣评价拉芙"越来越像小雪乃"
  局部:
    - 结衣对拉芙未展示发卡的短暂失落（仅结衣自知）
    - 拉芙注意并理解了雪乃不加方糖的克制——"比什么都不做更让人感到踏实"（仅拉芙自知）
    - 拉芙的右手本能触压手腕丝带——达洛维关于"永远"的探讨在脑海浮现（仅拉芙自知）
    - 雪乃因结衣的评价而凝滞半秒（仅观察到的角色知情，雪乃不自言）
  隐藏:
    - 拉芙将发卡放在口袋而非展示的原因（家族评估视野下的自我保护）
    - 达洛维信件的内容
    - 拉芙对"越来越像小雪乃"这句话的内心反应

