  hachiman: "二学期第一天——他瘫在角落单手托下巴，吐槽大家的暑假作业，顺手把拉芙也算进'没写完'的假设里；被冷淡回击后僵住，咂嘴移开视线。"
  yukino: "二学期第一天——她在热水壶前背对大家泡茶，给结衣果茶、给八幡无糖红茶、给拉芙的红茶没有放方糖；听到结衣说拉芙'越来越像小雪乃'时，她端茶的动作凝滞了半秒。"
  yui: "二学期第一天——她几乎立刻转身招呼推门进来的拉芙，扫了一眼对方的头发——没有粉色发卡——眼中闪过短暂失落，但迅速用更亮的笑容盖过。"
  laff: "二学期第一天——她推门进入，看见结衣视线的落点，知道她在找什么——发卡还在口袋深处；雪乃递来的红茶没有方糖，她读懂了那种精准的克制；八幡把她划进'作业放弃者'时，她回击了一句，结衣感叹'越来越像小雪乃了'。"

玩家控制边界:
  - 所有POV：不得让拉芙在此时展示或解释发卡的存在
  - 雪乃POV：对"越来越像小雪乃"的反应方式由玩家决定——可以是沉默、转移话题或其他微小反应，但不得做出长篇解释
  - 各方对拉芙"越来越像雪乃"的判断由玩家自行形成——AI只提供NPC观察到的外部行为
  - 拉芙POV：对八幡的回击措辞由玩家决定；对雪乃不加方糖的内心解读由玩家决定

可用节拍:
  - 拉芙推门进入活动室，结衣热情招呼
  - 结衣扫过拉芙头发，短暂失落→笑容
  - 四人各自就座
  - 雪乃泡茶分发：果茶→结衣，无糖→八幡，无糖→拉芙（无方糖）
  - 日常对话展开：暑假过得快、作业、林间学校的回忆
  - 八幡的消极吐槽波及所有人
  - 拉芙冷淡回击八幡
  - 结衣感叹拉芙越来越像小雪乃
  - 雪乃端茶动作凝滞半秒→垂下眼睑

偏离处理:
  - 若拉芙POV玩家不对八幡做出回击：结衣不会说出"越来越像小雪乃"的评价——该节拍可能移至后续场景，或由其他行为触发
  - 若雪乃POV玩家在泡茶时主动为拉芙加方糖：这与原文不符，但如果是玩家选择（雪乃选择了不同的行为），则会改变拉芙对"不加方糖=日常克制"的解读——需要AI相应调整拉芙的反应
  - 若结衣POV玩家对拉芙未展示发卡表现出明显的失落追问：拉芙可能会给出回避性回答

