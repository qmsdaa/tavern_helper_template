  - 结衣确认拉芙收到了发卡但未展示（情绪短暂失落后恢复）
  - 拉芙确认雪乃对"特殊安抚"和"日常"有明确的区分——不加方糖不是忽视，是克制
  - 拉芙的语言风格开始吸收雪乃的影响（被结衣指出）
  - 雪乃收到了"拉芙在变"的反馈信号

