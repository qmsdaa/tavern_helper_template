事件焦点:
  类型: 角色
  角色:
    - "拉芙希妮·都柏林"

场景功能:
  - ★阳乃作为远处观察者出现一次：85 之后她已从看戏转为警惕——舞会入场段（拉芙为雪乃抚平翻领的门厅区域附近），她没有进场，在门厅立柱后看完了入场全程，然后给某个不揭晓的联系人发了一条信息/把"奉仕部"三个字写进了自己的某个名册——去向不给答案。这是她从"一次性挑衅工具人"转为"持续观测者"的第一次落地；四人全程不知她在场（2026-08-17 第二批 B8 补录）
  - 舞会开始前——四人入场——雪乃穿中性西装，拉芙希妮穿香槟色露肩礼服
  - 检票口——拉芙希妮帮雪乃抚平西装翻领褶皱——蕾丝手套擦过精纺羊毛
  - ★舞会结束后拉芙希妮消失——三人在特别栋道具室找到她——坐在体操垫上，高跟鞋踢到旁边
  - ★拉芙希妮用"交代后事"的语气分别对每个人说话——进路表、小町成绩、结衣的感情——"这确实是最后需要确认的事了"
  - 雪乃拿出平冢老师签字的担保文件——拉芙希妮不接——"我已经决定了。春假的时候……我要回英国"
  - ★拉芙希妮揭露真相："她说过。只要我回去，这里的'日常'就不会被打扰"——这是以自己为筹码保护奉仕部的投降
  - 八幡爆发："真恶心——那种连问都不问当事人一句，就擅自把别人的'安全'揽在自己身上，然后自顾自跑去牺牲的做法——比直接被伤害还要让人火大一百倍"
  - 拉芙希妮用奉仕部原则反击："奉仕部的原则是提供帮助，而不是替别人做决定"
  - ★雪乃拆穿："如果是真正准备好去'面对'的人——在说出'自己决定'这几个字的时候，大拇指是不会拼命去抠那条烧焦的丝带的"
  - 雪乃宣布：奉仕部全体陪拉芙希妮去英国——"这是跨国社会实践"
  - 结衣破涕为笑——拉芙希妮"你们都疯了吗"
  - 雪乃用废纸揉成团扔进跳箱——"汇报你机票的具体航班号。这是社团任务的起点"

