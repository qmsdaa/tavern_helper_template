    - 此刻目标: 在离开前完成"最后的交代"——然后宣布去英国的决定
    - 行为倾向: 入场时帮雪乃整理西装→舞会后躲进道具室→用交代后事的语气→宣布回英国→被八幡骂→用奉仕部原则反击→被雪乃拆穿大拇指在抠丝带→被"全员去英国"击溃→"你们都疯了吗"
  雪之下雪乃:
    - 此刻目标: 不接受拉芙希妮的"投降"——把她拉回来
    - 行为倾向: 拿出担保文件→被拒绝→拆穿"大拇指在抠丝带"→宣布奉仕部全员陪同去英国
  比企谷八幡:
    - 此刻目标: 用最尖刻的话击穿拉芙希妮的自我牺牲叙事
    - 行为倾向: 在门边沉默良久→"真恶心"→"比直接被伤害还要让人火大一百倍"
  由比滨结衣:
    - 此刻目标: 不让拉芙希妮走
    - 行为倾向: 第一个哭→拉芙希妮说"别用这种好像以后都见不到面的语气"→抓住拉芙希妮的袖口

