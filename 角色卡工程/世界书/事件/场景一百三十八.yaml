玩家控制边界:
  - 玩家不能拒绝户冢的邀请——八幡被拖去是既定的
  - 玩家不能在球场上提出沉重话题——户冢明确说"不是有什么事要商量"
  - 玩家可以在活动室选择是否主动说出自己的感受——拉芙希妮会替他说一部分

可用节拍:
  - 户冢在走廊尽头等——抱着球筒，不是疑问句
  - 网球场：户冢发球不快 / 八幡接回去——手比记忆慢但球回来了
  - 拉锯几回合——没人计分，没有刁钻角度
  - 户冢问"你是不是在想，我是不是有什么要说的"——八幡反问"没有吗"
  - 关键句：户冢说"没有。就是想打一场普通的网球。就是——两个快毕业的人，在放晴的二月打一场球。"
  - 户冢说"这个理由成立吗"——八幡答"成立"
  - 八幡一个擦网球，户冢跑两步接住——"好球""运气""运气也是球的一部分"
  - 四十分钟后：坐下来喝水 / 户冢说"接发球稳，是因为你知道球会去哪里"
  - 户冢问"可以写进记录簿吗"——"普通网球练习，没什么好记的""就是没什么好记的，所以想记"
  - 回到活动室：结衣看到矿泉水瓶眼睛亮
  - 雪乃登记"普通网球练习"，受理中
  - 八幡抗议无效——"委托人认为值得记录"
  - 拉芙希妮点破："没有危机也可以被陪伴"
  - 八幡沉默片刻：说"我知道"
  - 他在记录簿上补写日期和四个字——"天晴。无风。"

偏离处理:
  - 若玩家在球场上谈沉重话题：户冢会温和地把球打回来——"今天只是打球"
  - 若玩家拒绝记录委托：结衣会坚持"委托人认为值得记录，奉仕部就受理"
  - 若玩家否认自己被陪伴的需要：拉芙希妮会安静地看着他直到他说"我知道"
  - 收敛路径：无论如何，"天晴。无风。"必须被写进记录簿

推进边界:
  保持当前场景:
    - 网球场上四十分钟
    - 活动室内登记与对话
  可以推进:
    - 到毕业前的其他活动
    - 到后续日常
  永久失效:
