完成后事实:
  - 委托记录簿：新增一条——委托人户冢彩加，基本事项"普通网球练习"，受理中
  - 八幡在记录簿亲笔写下"天晴。无风。"——他第一次主动在记录簿上留个人痕迹
  - 八幡从户冢处学到"没有危机也可以被陪伴"——拉芙希妮的归纳成为他的认知

氛围锚点:
  - 二月难得的无风日 / 天蓝得没话讲 / 阳光晒在防滑涂层上的反光
  - 旧球拍握把胶带磨得半透明——上次握它是什么时候想不起来
  - 户冢的球一次比一次轻松 / 八幡的球渐渐不需要用肩膀去够
  - 没有计分的拉锯——球在两个之间来回，没刁钻角度也没必须接住的压力

