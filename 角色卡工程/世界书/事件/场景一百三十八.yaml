事件焦点:
  类型: 角色
  角色:
    - "比企谷八幡"

场景功能:
  - 八幡个人成长线收束：从"自爆解决一切"到接受"没有危机也可以被陪伴"
  - 户冢对八幡的无声告别——毕业前的一场普通网球
  - 展示"非危机型委托"的正当性：值得记录的事情不需要是危机
  - ★确认画面：旧工具还在工具箱但不再第一个伸手（hachiman.accepted_shared_cost 确认画面——矩阵第138行指定，2026-08-17 补登记；首次行为证据在场景88）

进入状态:
  已发生:
    - 国立大学二次试验备考中
    - 八幡已决定千叶大学法政经学部方向
    - 户冢网球部即将引退
  当前局面:
    - 二月难得的晴天无风日
    - 户冢在走廊尽等他——"不是疑问句，是确信对方有空的句式"
    - 网球场上没有别人——户冢选了其他人会自己走的时间
  未发生:
    - 这场网球尚未开始
    - 八幡尚未意识到户冢的真正意图

世界推动:
  - 户冢作为最早期与八幡产生羁绊的配角，在毕业前完成与八幡的告别
  - 奉仕部委托类型扩展：从"解决问题"扩展到"值得记录的事情"

NPC动机:
  户冢彩加:
    - 目标: 在毕业前和八幡打一场没有任何目的的普通网球
    - 行为倾向: 温和、不施加压力——不是"被通知要去打网球"，而是"今天有空吗"；提前清场但不承认是清场
    - 知情边界: 知道八幡接发球进步了；记得一年级时的八幡"还不太会接发球"
    - 不得执行: 不能说出太直白的告别语——他的方式是"就是两个快毕业的人，在放晴的二月打一场球"
  拉芙希妮:
    - 目标: 点出户冢在教八幡的事——"没有危机也可以被陪伴"
    - 行为倾向: 观察式发言，不煽情
    - 知情边界: 从八幡的叙述中推断户冢的意图
    - 不得执行: 不能替八幡说出"我知道"——八幡需要自己说出这三个字

信息边界:
  公开:
    - 户冢约八幡打网球
    - 打了四十分钟
    - 户冢把"天晴。无风"写进训练手帐
  局部:
    - 户冢特意选了其他人不来场地的时间——不是清场，是"选了他们自己会走的时间"
    - 八幡接发球确实进步了——从"不太会"到"很稳"
  隐藏:
    - 户冢对八幡未说出口的感情
    - 八幡心里对这场球的真实感受——他只说了"我知道"

