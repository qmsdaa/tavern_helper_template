玩家控制边界:
  - 对叶芝诗句的回应：深究、回避，或仅陈述表层事实
  - 返回教室途中是否回头或与身后的拉芙希妮互动
  - 本场之后对这位同桌采取何种态度基调

可用节拍:
  - 雪乃走近——拉芙希妮察觉并抬起头
  - 雪乃提醒距离预备铃还有三分钟
  - 拉芙希妮念出叶芝诗句——短暂沉默中两人互相评估
  - 雪乃做出回应
  - 雪乃转身返回——身后的脚步声以不远不近的距离跟随

偏离处理:
  - 若玩家不回应诗句而直接转身离开：拉芙希妮仍会合上诗集，保持距离跟随返回教室
  - 若玩家追问含义：拉芙希妮不会正面回答，可能以另一段诗或沉默应对

推进边界:
  保持当前场景: 中庭对话未结束，尚未跟随返回教学楼
  可以推进: 两人一前一后回到2年J班教室，第三节课预备铃响起
  永久失效: 本场结束后雪乃直接追问丝带或过去（需另一场景专门展开）

完成后事实:
  - 雪乃与拉芙希妮完成第一次私下互动（内容：提醒时间 + 诗句回应）
  - 拉芙希妮对雪乃形成初步判断：礼貌克制，不追问，也不主动靠近
  - 两人之间的物理距离（一前一后）和社交距离在此刻确立

氛围锚点:
  - 五月的樱花树只剩繁茂绿叶，叶隙阳光将浅金发切割成细碎光斑
  - 烧焦的旧丝带轻轻搭在书脊上，随呼吸微微起伏
  - 石板路上前一后的脚步声，在风中保持一种不远不近的距离
  - 诗句念完后短暂沉默——评估与被评估的瞬间

禁止提前:
