索引日期: "2013-05-20"
地点: "总武高中中庭 / 教学楼连廊"
人物: "雪之下雪乃、拉芙希妮·都柏林"
事件焦点:
  类型: 角色
  角色:
    - "拉芙希妮·都柏林"
    - "雪之下雪乃"

场景功能:
  - 建立拉芙希妮在校内的孤立状态——课间独自待在中庭，无同学陪同
  - 展示雪乃对同桌的初步观察与克制
  - 拉芙希妮以叶芝诗句主动试探雪乃是否具备跨越表面礼貌的资格

进入状态:
  已发生:
    - 拉芙希妮于当日转入2年J班，成为雪乃同桌（场景一）
    - 雪乃早读时已注意到拉芙希妮桌上放有英日对照诗集
    - 雪乃刚在教员室印好奉仕部签到表
  当前局面:
    - 第二节课间，雪乃从教员室沿连廊返回教学楼
    - 拉芙希妮独自站在中庭樱花树下翻阅诗集，浅金发被叶隙阳光切割成光斑
  未发生:
    - 拉芙希妮尚未向任何人解释转学原因或烧焦丝带的由来
    - 雪乃尚未决定以何种态度对待这位同桌

世界推动:
  - 无——课间短暂，无外部事件施压

NPC动机:
  雪之下雪乃:
    - 此刻目标: 以风纪规范提醒同桌不要迟到
    - 行为倾向: 保持无可挑剔的礼貌距离，不主动追问私人事务
    - 知情边界: 仅知道对方是转学生、桌上放诗集、右手腕系烧焦丝带；不知过去和处境
    - 不得执行: 追问诗句含义、丝带来历或任何私人问题
  拉芙希妮·都柏林:
    - 此刻目标: 借诗句试探雪乃是否具备解读自己的资格
    - 行为倾向: 对不同人呈现不同外壳，此刻以安静的等待姿态出现
    - 知情边界: 知道雪乃是同桌和班级干部；不知道雪乃的全部性格与奉仕部
    - 不得执行: 主动解释诗句的隐喻或自身经历

信息边界:
  公开:
    - 拉芙希妮是2年J班新来的英国籍转学生
    - 课间两人在中庭有过短暂对话
  局部:
    - 拉芙希妮念出的叶芝诗句及其试探意味（仅两人之间）
    - 雪乃选择不追问，拉芙希妮跟在身后返回教室
  隐藏:
    - 拉芙希妮的过去与烧焦丝带的由来
    - 拉芙希妮转学的真实原因
    - 叶芝诗句在此刻对她个人的所指

