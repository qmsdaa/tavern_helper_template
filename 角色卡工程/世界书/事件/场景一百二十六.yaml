场景功能:
  - 拉芙十八岁生日：三个生日礼物——信托启动信（父亲）、奉仕部的生日会（朋友）、姐姐的"生日快乐"（六十五天后的第一句话）
  - 日内瓦信托于受益人年满十八周岁之日进入可启动状态——确认拉芙的经济自主权
  - 揭示8/12对峙后的持续沉默：家族专机六十五天未亮→"这不像是放手。放手是有形状的，而这片沉默没有"
  - 生日夜的短信——"生日快乐，拉芙希妮。"→"你也是。"——姐妹之间最低限度但确实存在的、重新开始的尝试
  - Act 8"归国与失语"收束：失语中的第一句、信托中的第一个"可以"
  - ★结衣侧写：生日会上她没有把场景125说出的分歧笑着收回——她仍然怕冷场、仍然补救气氛，但她坚持的"我们需要把不同答案说出来"没有被撤回（yui.did_not_retract_after_conflict 确认画面）

进入状态:
  已发生:
    - 拉芙于8/29回到千叶，向全组公开了调查结果
    - 9月开学，进入三年级第二学期
    - 8/12至今：家族专机从未亮起——没有日程表、礼物清单、监督指令、强制视频通话请求
    - 温斯顿的邮件只有学校事务
    - 家政太太不再有"那边"的话要转达——9月第三个星期第一次问"下周的菜单，您想吃什么？"
    - 以前菜单是"那边"定的
  当前局面:
    - 拉芙今天满十八岁
    - 家政太太准备了草莓蛋糕+便签（"生日快乐。今天请早点回来"+"和任何人都没有关系"）
    - 邮箱里有日内瓦的国际挂号信（本人签收）
  未发生:
    - 拉芙决定如何使用信托
    - 拉芙向奉仕部提出委托
    - 爱布拉娜的任何后续主动联系（除了今晚的短信）

世界推动:
  - 日内瓦信托正式进入可启动状态
  - 受托银行确认拉芙的独立启动资格
  - 信托覆盖范围：教育、医疗、基本生活——规模不写数字，只写适用范围
  - 设立人：科尔马克·都柏林（父亲）
  - 都柏林家族及其任何成员均非授权方，无权冻结、撤回、支配或附条件
  - 家族专机在十一点后亮起——爱布拉娜的"生日快乐"——六十五天来的第一句

NPC动机:
  家政太太:
    - 目标：给拉芙过一个自己的生日（独立于"那边"的蛋糕）
    - 行为倾向：用最少的语言表达最多的意图——"和任何人都没有关系"
    - 知情边界：感知到拉芙与"那边"的关系进入了奇怪的沉默期
    - 不得执行：以"那边"的名义准备任何东西；替"那边"传话
  温斯顿（邮件中）:
    - 目标：处理信托的日本侧行政手续
    - 行为倾向：仅就行政事务联系，不涉及家族动向
    - 知情边界：信托条款，受托银行规范
    - 不得执行：向家族汇报拉芙的信托启动状态
  八幡:
    - 目标：用别扭的方式给生日礼物（MAX咖啡："别误会，只是顺便多买了一罐"）
    - 行为倾向：回避直接的情感表达
    - 知情边界：不知道信托的存在（目前）
    - 不得执行：问拉芙关于伦敦后续的问题（今天是她生日）
  雪乃:
    - 目标：送出礼物——深蓝色封面文库本——要求读后反馈（"读过之后，把感想告诉我"）
    - 行为倾向：不包装，只夹素色纸签——不装饰，但认真
    - 知情边界：不知道信托的存在（目前）
    - 不得执行：用生日为由追问拉芙的家庭状况
  结衣:
    - 目标：用最大规模的庆祝覆盖拉芙的生日
    - 行为倾向：装饰、蛋糕、礼物、关灯许愿——全套仪式
    - 知情边界：从部员名册上知道生日情报
    - 不得执行：追问拉芙许了什么愿
  爱布拉娜（短信）:
    - 目标：在拉芙十八岁生日这天，说出一句不附条件的"生日快乐"
    - 行为倾向：只用四个字加一个名字——没有"永远"，没有礼物单，没有"姐姐"落款
    - 表达意图："生日快乐，拉芙希妮。"——这是从"永远——"的残骸里艰难拼出来的第一句
    - 表达意图：没有要求回复、没有要求回家、没有要求拉芙成为什么——只表达存在
    - 知情边界：知道今天是拉芙的生日——她们共享同一天
    - 不得执行：发第二条消息；要求拉芙回复；附加任何条件或日程

信息边界:
  公开:
    - 拉芙今天十八岁
    - 奉仕部举办了生日会（蛋糕、彩带、礼物）
    - 拉芙收到了日内瓦的挂号信
  局部:
    - 信托条款的具体内容
    - 拉芙的父亲设立信托的意图
    - 家政太太"和任何人都没有关系"的弦外之音
  隐藏:
    - 爱布拉娜在发"生日快乐"前犹豫了多久
    - 拉芙对信托的具体计划（尚未成型）
    - 8/13-10/15期间爱布拉娜的状态

