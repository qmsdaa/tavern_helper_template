场景功能:
  - ★平冢静带来PTA舞会委托——原方案被雪之下夫人全盘否决——"形式过于老旧，缺乏体现总武高精英气质的创新性"
  - 一色彩羽夸下海口"学生会有备用方案"——实则把烂摊子甩给奉仕部
  - 雪乃听到"PTA"瞬间防御——"奉仕部没有介入这种层级博弈的立场"
  - 平冢静注意到拉芙希妮左腕的红绸带——克制而意味深长的目光
  - ★平冢静说出"都柏林同学"——在拉芙希妮面前描述"被权威用宏大叙事施压"的模式——暗示她知道拉芙希妮的家庭处境
  - 雪乃拒绝——"我们拒绝。奉仕部的原则是提供帮助，而不是代替完成"
  - 平冢静放下牛皮纸信封——"看不看，接不接，那是你们的自由"

