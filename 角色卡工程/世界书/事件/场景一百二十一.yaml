场景功能:
  - 拉芙出发回伦敦，确立"去查明一件事，然后回来"的双向承诺
  - 钢笔（来自L-Fly的礼物）与返程票并置：可见证"可以走"与"会回来"
  - B线日本侧锚定文化祭企划启动，为Act 8日本侧日常线提供骨架
  - 值日表第五个名字空格被留出，建立"等待归来"的群体默契
  - ★送行的三个独立动作：雪乃纠正返程航站楼并留下白板位置（制度性记忆）、八幡塞出一罐MAX咖啡（别扭的赠礼）、结衣把"到了就发"立成约定（"哪怕只发一个句号"）——三人的道别不是合唱，各自成立（2026-08-17 第三批 C1a；结衣的立约拍为焦点级，故登记结衣）

进入状态:
  已发生:
    - 拉芙收到伦敦来信，决定利用暑假回英国调查火灾真相
    - 自行订购往返机票（去程8/2，返程8/29），温斯顿未追问原因
    - 送行：全员在成田机场告别，六人看过拉芙的行程单
    - 日本侧文化祭企划需提前提交，雪乃主导方向讨论
  当前局面:
    - 拉芙清晨整理珍藏抽屉：钢笔与返程票并置，确认"回去是为了回来"
    - 家政太太送行，未追问伦敦事宜
