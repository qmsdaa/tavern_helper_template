  可以推进:
    - 到收集照片的过程（非场景化）
    - 到结衣回家与母亲谈话（场景140）
  永久失效:
    - 使用原版委员会照片——已否决
    - 由奉仕部替全班选照片——结衣拒绝这个做法

完成后事实:
  - 委托记录簿：F班毕业相册重新编辑，截止二月二十八
  - 结衣成为该项目的实质负责人
  - 全班三十七人将被通知提交
