  - 放学前——结衣桌上已放七张照片

偏离处理:
  - 若玩家提出帮结衣筛选照片：结衣会坚持"不能替人选"
  - 若玩家质疑工作量大：结衣承认但坚持"这件事必须有人做"
  - 若玩家提出找委员会成员交涉：结衣会认为这属于"视角对抗视角"——不是她要做的
  - 收敛路径：无论如何，收集全班投稿的系统必须以"每个人自己选择"为核心

推进边界:
  保持当前场景:
    - F班教室内的委托交接
    - 活动室内的受理登记
