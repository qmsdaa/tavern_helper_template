    在场: true
    演绎入口:
      - 在活动室听到结衣的说明
      - 评估工作量大但不说"别接"——他知道结衣接了就一定会做完
      - 注意到雪乃的基本事项写得比以往都长——因为委托人自己把规则说清楚了
  # <%_ } _%>
  # <%_ if (getvar('stat_data.current_pov', { defaults: null }) === "yukino") { _%>
  yukino:
    在场: true
    演绎入口:
      - 登记委托日期和截止日期
      - 基本事项写得特别详细——"不以任何人的视角代替另一个人的视角"——这是她认可的原则
      - 写下"受理中"
  # <%_ } _%>
  # <%_ if (getvar('stat_data.current_pov', { defaults: null }) === "yui") { _%>
  yui:
    在场: true
    演绎入口:
      - 翻到被裁的照片时手指停了——认出原图是四个人
      - 下判断："这本相册不是记录。是某个视角的人替全班决定，谁值得被记住。"
      - 决定受理但强调——"不是我一个人。奉仕部接。"
      - 在活动室用手指从一页画到下一页——在分配什么看不见的东西
  # <%_ } _%>
  # <%_ if (getvar('stat_data.current_pov', { defaults: null }) === "laff") { _%>
  laff:
    在场: true
    演绎入口:
      - 提醒结衣"你自己的照片，也要自己选"
      - 肯定结衣的决定："那就已经够了。"

  # <%_ } _%>
  # <%_ if (getvar('stat_data.mode', { defaults: null }) === "custom" && getvar('stat_data.custom_protagonist.participation.track', { defaults: null }) !== null) { _%>
  custom:
    在场: <%= ["member","classmate"].includes(getvar('stat_data.custom_protagonist.participation.track', { defaults: null })) ? 'true' : 'false' %>
    演绎入口:
      - "玩家是自建角色「<%= getvar('stat_data.custom_protagonist.name', { defaults: '自建角色' }) %>」，参与方式轨道：<%= getvar('stat_data.custom_protagonist.participation.track', { defaults: '' }) %>（member=奉仕部第五名部员·classmate=同班旁观者·outsider=场外自由人），玩家补充：<%= getvar('stat_data.custom_protagonist.participation.note', { defaults: '' }) || '无' %>"
      - member：开局已被安排进奉仕部，与四人同处事件核心，可接委托、可发言、可被卷入冲突
      - classmate：在公共场合在场边目击事件，不自动进入核心互动；是否被卷入由玩家已声明的行动决定；场景位于私人空间时不代入在场
      - outsider：不在现场，本场只能事后通过传闻、委托或转述得知
      - 事件焦点与NPC动机不因玩家改变；玩家未声明行动时不得替其补写言行
  # <%_ } _%>
POV平行动向:
  hachiman: "相册委托日——他在活动室听结衣说明，评估工作量大但不说'别接'——他知道结衣接了就一定会做完；他注意到雪乃的基本事项写得比以往都长。"
  yukino: "相册委托日——她登记委托日期和截止日期，基本事项写得特别详细：'不以任何人的视角代替另一个人的视角'——这是她认可的原则，然后写下'受理中'。"
  yui: "主场轨道，见可用节拍，不变。"
  laff: "相册委托日——她提醒结衣：'你自己的照片，也要自己选'；听到结衣的决定后她说：'那就已经够了。'"

玩家控制边界:
  - 玩家不能拒绝受理（结衣已经答应了）
  - 玩家可以帮助设计收集方案
  - 玩家不能替结衣决定照片排列方式——这是她的项目

