场景: 139
幕: "第十幕·冬去春来"
时间: "2015年2月12日 · 周四"
索引日期: "2015-02-12"
地点: "总武高三年F班教室 → 特别栋奉仕部活动室"
人物: "由比滨结衣、三浦优美子、海老名姬菜、比企谷八幡、雪之下雪乃、拉芙希妮·都柏林"
事件焦点:
  类型: 角色
  角色:
    - "由比滨结衣"

场景功能:
  - 结衣个人成长线关键节点：从"维持气氛的人"升级为"不让任何人被漏掉"的主动行动者
  - 毕业相册委托启动——将成为结衣的"奉仕部毕业作品"
  - 三浦和海老名的角色弧：从"站在中间的人"到意识到必须让每个人被看见

进入状态:
  已发生:
    - F班毕业相册初版已由委员会选出
    - 委员会由"班上存在感最强的人"组成
    - 照片大量裁剪——边缘人物被裁出画框
  当前局面:
    - 三浦和海老名拿着相册样本来找结衣
    - 相册后半段照片越缩越小，多人合照被裁到只剩中间
    - 她们发现"选照片的人选了太多自己"
  未发生:
    - 尚未确定由谁负责重新编辑
    - 尚未收集全班三十七人的投稿
    - 奉仕部尚未受理

世界推动:
  - F班毕业相册成为奉仕部最后的大型委托之一
  - 三浦从"替人决定"的群体中站出来，主动要求改变——角色成长

NPC动机:
  三浦优美子:
    - 目标: 让毕业相册不成为某些人视角的独裁
    - 行为倾向: 直接坦率——不是命令，不是请托，是"这件事必须做，而你能做"
    - 知情边界: 知道委员会选照片的过程有问题；知道结衣有"不替人决定"的能力
    - 不得执行: 不能自己重新选照片——"我们自己也是某个视角的人"
  海老名姬菜:
    - 目标: 设计一套让全班都能参与的系统
    - 行为倾向: 精准分析——指出问题（选照片的人选了太多自己）、提出方案（每个人提交自己想留下的东西）、评估可行性（还有一个月来得及）
    - 知情边界: 了解照片裁剪的具体痕迹，能从原图推断被裁掉的人
    - 不得执行: 不能代替结衣受理——她来找结衣本身就是"不替人决定"
  结衣（本场景玩家不可控——结衣是被委托方，其决定是情节驱动力）:
    - 目标: 接手相册编辑，但以"每个人自己选"为前提
    - 行为倾向: 翻到被裁掉的人时手指停了；联想到文化祭那晚相模南的事
    - 知情边界: 认出被裁照片的原图是四个人
    - 不得执行: 不能拒绝受理——她的性格和成长线决定她会接

信息边界:
  公开:
    - F班毕业相册初版已将多人裁出照片
    - 委员会由"存在感最强"的几个人组成
  局部:
    - 结衣认出某张照片原图是四个人——三人被裁掉
    - 海老名找到第二处裁剪：九人合照印成五人
  隐藏:
    - 委员会具体是谁
    - 被裁掉的人是否知道自己被裁掉了
    - 三浦本人是否也在"站在中间的人"之列的内疚

玩家入口:
  # <%_ if (!["hachiman","yukino","yui","laff"].includes(getvar('stat_data.current_pov', { defaults: null })) && !(getvar('stat_data.mode', { defaults: null }) === "custom" && getvar('stat_data.custom_protagonist.participation.track', { defaults: null }) !== null)) { _%>
  unavailable:
    在场: false
    演绎入口:
      - "当前玩家视点尚未初始化。禁止借用事件焦点或其他角色入口继续剧情；只提醒玩家返回开场重新选择视点，或读取包含合法玩家视点的存档。"
  # <%_ } _%>
  # <%_ if (getvar('stat_data.current_pov', { defaults: null }) === "hachiman") { _%>
