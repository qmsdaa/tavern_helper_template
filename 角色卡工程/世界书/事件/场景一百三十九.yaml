  - 三浦把相册样书放在结衣桌上——封面空着班级名
  - 海老名解释：委员会选了太多自己
  - 三浦翻开相册——前半大合照，后半变成小合影
  - 结衣翻到第十一页——手指停在一个被裁掉一半的侧脸上
  - 结衣认出原图是四个人——裁过痕迹明显
  - 海老名翻到第十五页确认——九人合照印五人
  - 关键句：结衣说"这本相册不是记录。是某个视角的人替全班决定，谁值得被记住。"
  - 三浦说"离毕业还有一个月，来得及——但我们不想自己做"
