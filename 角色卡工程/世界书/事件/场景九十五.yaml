  局部:
    - 仅拉芙希妮识破：三条信息是爱布拉娜的三重包围
    - 仅拉芙希妮注意到：温斯顿邮件中"I have been asked"的措辞偏移
    - 仅拉芙希妮和玛格丽特之间：姑婆问"手腕还疼不疼"
  隐藏:
