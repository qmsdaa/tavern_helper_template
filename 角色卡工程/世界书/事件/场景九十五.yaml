NPC动机:
  平冢静:
    - 此刻目标: 提供安全空间，不追问但随时准备接住
    - 行为倾向: 用粗线条的关心（倒啤酒、开玩笑）维持日常感，敏锐察觉异常但不出声
    - 知情边界: 看到家族专机亮起，知道邮件是"法定协调人"发来，不知完整内容和包围机制
    - 不得执行: 主动看邮件、替拉芙希妮拒绝或接受、打破拉芙希妮的应对节奏
  玛格丽特姑婆:
    - 此刻目标: 关心侄孙女的身体和休学情况（纯粹真实的关心）
    - 行为倾向: 用利默里克口音和宠爱语气表达担心，完全不知自己是被部署的武器
    - 知情边界: 被爱布拉娜告知"苇草在日本病得厉害"，不知真相
    - 不得执行: 意识到自己被利用、突破拉芙希妮的心理防线以外的行为
  家政太太（非直接出场）:
    - 功能: 通过菜单中的"爱尔兰炖羊肉"暗示家族知道拉芙希妮不在公寓、且知道她在哪
  温斯顿（非直接出场）:
    - 功能: 通过邮件中措辞偏移（"I have been asked"而非主动）暗示仍有缝隙

信息边界:
  公开:
    - 温斯顿邀请拉芙希妮和平冢静明天午餐（新大谷顶楼中餐厅）
