NPC动机:
  折本香织:
    - 此刻目标: 作为海滨综合的观察员，完成任务
    - 行为倾向: 开朗、直接、叫八幡"小企"（初中时期的称呼延续）
    - 知情边界: 不知道八幡过去两年如何消化她当年的拒绝
    - 不得执行: 在本次活动室中触及初中告白话题（在场景111才道歉）
