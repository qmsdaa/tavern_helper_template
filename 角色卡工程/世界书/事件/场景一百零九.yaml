  一色彩羽:
    - 此刻目标: 提交委托，同时保持学生会长的正式面具
    - 行为倾向: 倒放表格、翻两次都翻错——处理事务时没有平时撒娇时那么游刃有余
  比企谷八幡:
    - 此刻目标: 处理委托+应对折本突然出现的尴尬
    - 行为倾向: 听到"小企"后手停在铅笔上；继续工作但不看折本；在折本问他意见时铅笔芯断

