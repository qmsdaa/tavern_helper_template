POV平行动向:
  hachiman: "成立日——他听到那声'啊小企'时手停在铅笔上；折本问'小企你怎么看'时笔芯弹出来断成两截；他扫开笔芯，在空白纸上写下'到场'和'健康信息'两栏：'连谁有权看到什么都没写清楚，统一流程只是统一泄露方式'。"
  yukino: "成立日——她写日期，说'欢迎加入奉仕部'；折本指出两校表格问题时，她转向一色：'委托呢'。"
  yui: "成立日——她从茶柜最深处翻出两只新杯子，碎花的摆给小町，白杯留给大志；折本进门叫那声'啊小企'时，她正把记录簿推到八幡手边，腾手去挪挡路的茶壶，瓷器在桌上磕了一下，她弯腰捡起盖子重新盖好；给折本倒茶时多看了对方一眼；散会前她凑到拉芙希妮耳边小声说'新杯子配新部室，绝配吧'，拉芙希妮回她'嗯，配'。"
  laff: "成立日——她把流程表上多写的个人信息涂掉；看到折本和八幡之间那种空气时，她的指尖在右腕焦黑丝带上停了一停。"

