场景: 3
幕: "第一幕·入部磨合"
时间: "2013年5月20日 放学后"
索引日期: "2013-05-20"
地点: "奉仕部活动室（总武高中特别栋闲置教室）"
人物: "雪之下雪乃、平冢静、拉芙希妮·都柏林、比企谷八幡、由比滨结衣"
事件焦点:
  类型: 角色
  角色:
    - "拉芙希妮·都柏林"

场景功能:
  - 完成拉芙希妮正式加入奉仕部的剧情节点
  - 建立四人初始关系格局：雪乃警惕/纸杯区隔、结衣热烈欢迎、八幡察觉气压异常、拉芙希妮保持距离观察
  - 平冢静把她强行送进奉仕部时没有解释理由；这份沉默保留到后续再开口

进入状态:
  已发生:
    - 拉芙希妮转入2年J班（场景一），与雪乃在中庭有过短暂接触（场景二）
    - 奉仕部以雪乃、八幡、结衣三人为基础运行
  当前局面:
    - 放学后，雪乃在活动室阅读文库本，热水壶正在加热
    - 平冢静带着拉芙希妮推门而入
  未发生:
    - 拉芙希妮尚未与八幡和结衣正式见面
    - 雪乃尚未接受拉芙希妮入部

世界推动:
  - 平冢静以"生活指导老师决定"的强制力推动拉芙希妮入部——此决定不可被雪乃的拒绝驳回
  - 热水壶沸腾后自动停止运转（物理节奏节点）

NPC动机:
  平冢静:
    - 此刻目标: 将拉芙希妮强行安置进奉仕部，执行一学期的"融入学校生活练习"
    - 行为倾向: 以强硬态度驳回雪乃的制度性拒绝，不解释深层原因
    - 知情边界: 掌握关于拉芙希妮的特殊资料（未揭示的信件）；知道奉仕部成员的"不普通"特质
    - 不得执行: 向在场学生解释拉芙希妮入部的真正原因或展示信件
  雪之下雪乃:
    - 此刻目标: 以社团原则拒绝强制托管
    - 行为倾向: 冷静反驳平冢静，但最终不过度对抗；对拉芙希妮保持警惕——用纸杯代替陶瓷杯
    - 知情边界: 仅比其他人多与拉芙希妮有过中庭对话
    - 不得执行: 主动接纳或主动排斥（保持距离观察）；追问丝带
  由比滨结衣:
    - 此刻目标: 热情欢迎拉芙希妮加入
    - 行为倾向: 毫无芥蒂地靠近，追问"中午想找你打招呼"
    - 知情边界: 不知拉芙希妮的过去和处境
    - 不得执行: 成功问出烧焦丝带的问题（被雪乃以眼神制止）
  拉芙希妮·都柏林:
    - 此刻目标: 保持观察姿态，不主动争取位置
    - 行为倾向: 安静坐下，双手交叠膝盖，在自己周围划定安全距离；对结衣的热烈出现微小破绽
    - 知情边界: 不知道奉仕部三个人的关系和个性全貌
    - 不得执行: 主动向任何人解释丝带或背景

信息边界:
  公开:
    - 拉芙希妮正式加入奉仕部，为期一学期
    - 四人第一次共处一室
  局部:
    - 雪乃故意只拿出三个陶瓷杯，给拉芙希妮的茶用一次性纸杯
    - 结衣试图询问丝带，被雪乃眼神制止
  隐藏:
    - 平冢静白大褂内的信件内容与来源
    - 拉芙希妮对"控制"与"安全距离"的敏感原因

