POV平行动向:
  hachiman: "放学的特别栋——他推门进活动室，看见平冢静和一个浅金发少女坐在长桌两端，空气比平时重了两公斤；他挑了最远的椅子坐下，决定先观察。"
  yukino: "放学的特别栋——她刚关掉沸腾的热水壶，平冢静就把转学生塞了进来；她用'社团原则'拒绝，被生活指导老师的权限驳回，于是从柜子里只拿出三个陶瓷杯。"
  yui: "放学的特别栋——她追着小企跑上楼梯，推开门看见中午没找到的拉芙希妮坐在接待区，直接冲过去打招呼；她没注意到活动室里刚发生过一场拉锯。"
  laff: "主场轨道，见可用节拍，不变。"

玩家控制边界:
  - 对平冢静强制安排的态度：沉默接受还是继续质疑
  - 如何回应结衣的热情招呼
  - 注意到纸杯与陶瓷杯的差别后，如何反应
  - 是否在结衣提到丝带时主动或被动回应

可用节拍:
  - 平冢静宣布强制委托——雪乃拒绝——被驳回
  - 拉芙希妮安静落座，划出安全距离
  - 八幡推门——察觉气压异常——干瘪吐槽
  - 结衣冲入——热烈欢迎——拉芙希妮外壳出现微小裂纹
  - 雪乃取出茶杯（三个陶瓷，无第四个）

偏离处理:
  - 拉芙希妮入部已是平冢静不可更改的决定，无论玩家如何回应
  - 若玩家主动打破距离靠近他人：被视为角色选择，其他NPC按各自性格回应
  - 若玩家始终沉默不参与：场景仍会推进至奉仕部常规气氛，拉芙希妮作为安静的观察者存在

推进边界:
  保持当前场景: 初始介绍的混乱尚未平息
  可以推进: 茶水分配完成，活动室恢复奉仕部惯常的低气压安静
  永久失效: 平冢静收回委托（不会发生）

完成后事实:
  - 拉芙希妮正式成为奉仕部成员
  - 四人的初始关系确立：雪乃（有距离的观察者）、结衣（热情接近者）、八幡（敏锐的旁观者）、拉芙希妮（安静的外来者）
  - 雪乃对拉芙希妮的警惕以"纸杯"的形式物化存在
  - 平冢静已完成委托交付，退出本场

氛围锚点:
  - 老旧的滑轨被平冢静扯开时发出刺耳的金属摩擦声
  - 热水壶嗡鸣后在雪乃关掉时骤停——像是争论的句号
  - 拉芙希妮双手交叠在校服裙膝盖上，划定一道无形的安全距离
  - 一次性纸杯与三个陶瓷杯在长桌上构成的物证

禁止提前:
  - 平冢静的信件内容（场景六揭示存在，后续揭示内容）
  - 材木座义辉的委托（场景四）
  - 拉芙希妮的任何过去信息
  - 四人之间任何超越"初次见面"的关系认定
