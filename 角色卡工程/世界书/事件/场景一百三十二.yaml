    - 表达意图："判断失误四个字，从今天起从档案里拿掉。换上刚才那几句。"——自我清理
    - 表达意图：在小餐室主动注茶→糖罐放正中→"糖在这里。"——没有道歉，没有要求原谅，没有说"永远"→只用动作
    - 表达意图："路上——茶还温着。喝完再上去。"——想说的话收住了，换了另一句
    - 知情边界：她知道的比她说的多（玩具熊等）——但议程上只认责
    - 不得执行：说"对不起"；说"请原谅我"；说出完整的"永远——"句子；在小餐室讨论议程内容

