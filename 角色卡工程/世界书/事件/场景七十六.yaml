场景: 76
幕: "第四幕·冬假→三学期"
时间: "2014年2月1日 · 周六 · 晚"
索引日期: "2014-02-01"
地点: "千叶市美滨区 · 雪之下雪乃公寓"
人物: "拉芙希妮·都柏林、雪之下雪乃、由比滨结衣、比企谷八幡"
事件焦点:
  类型: 角色
  角色:
    - "雪之下雪乃"

场景功能:
  - ★首次奉仕部全员在雪乃公寓聚会——八幡和结衣来访
  - 拉芙希妮无声展示对公寓的熟悉度——自然地从电视柜第二格抽屉取出软木杯垫——结衣注意到异常
  - 雪乃借列车轨道开口谈进路：“如果一个方向从一开始就被规划为了'最优解'……连提及'我想去别的车站'这种想法，都是软弱”
  - 三人接力回应——八幡"被装在集装箱里发货"、结衣"一起敲窗户"、拉芙希妮"英国列车因为落叶晚点，乘客下车去喝热汤——只要腿还是你自己的，没有任何人能签发永远不能下车的判决书"
  - ★四人合照——结衣强行拍照：雪乃被搂、拉芙希妮被雪乃拽入画面、八幡勉强入镜
  - 灾难照片——"只有结衣在这片灾难般的构图中，笑得没心没肺"

进入状态:
  已发生:
    - 场景75：巧克力制作
    - 结衣提议去雪乃公寓
  当前局面:
    - 四人到达雪乃公寓
    - 八幡带便利店布丁（小町强迫）、结衣带草莓塔
  未发生:
    - 雪乃尚未开启进路话题
    - 合照尚未发生

世界推动: 公寓内暖气和茶香

NPC动机:
  雪之下雪乃:
    - 此刻目标: 向三人坦白进路焦虑——试探能否被理解
    - 行为倾向: 借“列车轨道”开场→被三人接力回应→被结衣抓手→抽回手假装整理→被结衣强行拍照→拽拉芙希妮入镜
    - 知情边界: 进路表还在公寓，被法律辞典压住
  拉芙希妮·都柏林:
    - 此刻目标: 在雪乃坦白时提供来自另一个"被困者"的共鸣
    - 行为倾向: 无声展示对公寓的熟悉→在雪乃说完列车轨道后用“英国列车”回应→拍照时试图躲开→被雪乃拽入
    - 表达意图: "英国的列车经常因为落叶和积雪晚点。当停在半路的时候，很多乘客会选择下车……但只要腿还是你自己的，除了你自己，没有任何人能签发永远不能下车的判决书。"
  由比滨结衣:
    - 此刻目标: 用温度和行动打破雪乃的防御
    - 行为倾向: 注意到杯垫细节→抓雪乃的手→强行拍照→"这样的话，小雪乃下次觉得冷的时候，就可以拿出来看一看了吧"
  比企谷八幡:
    - 此刻目标: 用扭曲的逻辑给雪乃台阶
    - 行为倾向: "被装在集装箱里发货"→拍照时想逃→被结衣威胁

信息边界:
  局部: 拉芙希妮知道杯垫在哪（暗示来过多次）
  公开: 对话内容

