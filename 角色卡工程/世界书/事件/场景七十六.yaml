  - 雪乃用"列车轨道"坦白进路焦虑
  - 八幡"集装箱"→结衣"敲窗户"→拉芙希妮"腿是自己的"
  - 雪乃眼红→结衣抓手→雪乃反握
  - ★结衣提议合照→三人抗拒→结衣强拍
