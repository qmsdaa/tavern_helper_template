偏离处理:
  - 若雪乃POV不主动开启进路话题：允许——结衣会用"小雪乃最近是不是有心事"把半句话逼出来；坦白的深度由玩家把控，可浅可深
  - 若玩家点破拉芙希妮对公寓的熟悉（"你怎么知道杯垫放哪"）：拉芙希妮用"家具磨损痕迹"一类的解释轻轻带过，雪乃不接话——暗示保持为暗示，本场不落实为"来过很多次"的明说
  - 若三人的接力回应被打乱或有人不接话：允许——只要雪乃的坦白至少得到一个人的正面回应
  - 若合照被抗拒到底：结衣退让为"那至少拍杯子"，但当晚仍须产出一张四人同框的失败照片——完成后事实依赖它

推进边界:
  保持当前场景: 合照尚未拍成
  可以推进: 照片拍完、茶凉，三人各自回家
  永久失效: 不适用

完成后事实:
  - 雪乃首次在全员面前坦白进路焦虑——得到三人不同方式的回应
  - 拉芙希妮的"熟悉杯垫位置"暗示来过多次——未被明说
  - 四人合照成为重要纪念——"下次觉得冷的时候可以拿出来看"

氛围锚点:
  - 拉芙希妮自然取出杯垫——"没有任何试探或询问——就像在做一件重复过许多次的事"
  - 拉芙希妮的回应——"英国的列车经常因为落叶和积雪晚点"
  - 合照——"雪乃因为闪光灯而半闭着眼睛……拉芙希妮那张总是能维持完美礼仪的面具被彻底打碎……只有结衣笑得没心没肺"

