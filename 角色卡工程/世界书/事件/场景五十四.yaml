    - 只有拉芙希妮将阳乃与爱布拉娜进行同构比较
    - 只有雪乃注意到拉芙希妮听到"家族企业"时手指蜷缩的厌恶反应
  隐藏:
    - 八幡初中时期的完整黑历史和后续影响
    - 阳乃对雪乃的控制欲根源
    - 折本至今不知道自己的行为构成伤害

