场景: 54
幕: "第三幕·二学期"
时间: "2013年12月16日 · 周一放学后 · 京王联合圣诞企划第一次筹备会议"
索引日期: "2013-12-16"
地点: "总武高第三会议室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣、一色彩羽、平冢静、雪之下阳乃、折本香织（首次出场）"
事件焦点:
  类型: 角色
  角色:
    - "比企谷八幡"

场景功能:
  - ★折本香织首次登场——八幡初中告白被拒并被当笑料传播的加害者，以"天然到残酷"的方式重现
  - 阳乃利用折本的"钝感善良"精准攻击八幡——"四人约会"提议把伤口展览最大化
  - 拉芙希妮以外交礼仪压制折本的无限闲聊——将折本定性为"无礼"，同时把管教责任扣在阳乃头上
  - 雪乃用议程控制力压制阳乃——拒绝家族企业赞助，判定为"变相收购和控制"
  - 阳乃被驳后转向社会性攻击——当众提议周末"四人聚会"（八幡+阳乃+折本+叶山）
  - 雪乃以"杂务记录工作"为由强行将八幡锁定在会议室——不让他逃
  - 拉芙希妮全程观察阳乃的操纵模式——与姐姐爱布拉娜做同构类比

进入状态:
  已发生:
    - 场景53：京王联合企划宣布，阳乃为对接人，折本被提名为"海滨综合的朋友"
    - 八幡已有一周时间预知折本会出现——但心理准备完全不足
  当前局面:
    - 周一放学后，第三会议室暖气充足到粘稠
    - U形桌：京王方（阳乃+折本）vs 总武高方（一色主位+奉仕部+平冢静旁观）
    - 阳乃落座即开始用视线扫射奉仕部
  未发生:
    - 折本尚未认出八幡
    - 各项议程尚未开始
    - 阳乃的"四人聚会"邀请尚未提出

世界推动:
  - 平冢静摆出"只旁观不干涉"姿态——给了阳乃最大施压空间
  - 一色主位但气场被阳乃完全压制
  - 会议议程（场地、预算、分工）等待宣读

NPC动机:
  折本香织:
    - 此刻目标: 在老同学叙旧中找到"可以有"的共同话题——完全不知道自己的行为在施加伤害
    - 行为倾向: 天然直率近乎钝感——看见八幡立刻大声叫出；毫无障碍地分享初中黑历史（"被拒绝后第二天我就讲给全班女生听了"；当笑话讲——"真的超搞笑的"）
    - 知情边界: 知道八幡初中向她告白被拒；不知道这件事对八幡的长期影响；完全读不懂室内任何一个非口语信号
    - 不得执行: 表现出任何恶意或故意伤害的意图——她的"残酷"正是源于她的"无恶意"
    - 表达意图（NPC台词参考）: "这不是小企吗？欸，我们居然在这里碰到了，这个可以有！" / "那个时候，小企不知道抽了什么风，突然把我叫出去说要跟我交往" / "第二天我就当笑话讲给班里的女生听了" / "小企你读了总武高之后好像都没怎么变啊？"
  雪之下阳乃:
    - 此刻目标: 以"大姐姐"姿态主导会议，同时获取最大施压效果——对雪乃、对八幡、对拉芙希妮
    - 行为倾向: 用温和笑容包裹恶意——"把小八幡三个字咬得很重"；在折本挖出黑历史后不阻止反而催化——"然后呢？"；被拉芙希妮压制后眼中闪过危险光芒
    - 知情边界: 知道折本和八幡的初中关系——是刻意带折本来；不知道拉芙希妮的背景细节但开始对她产生兴趣
    - 不得执行: 在会议中与雪乃发生直接肢体冲突；在第一次会议就让步
    - 表达意图（NPC台词参考）: "原来你们初中就认识吗？这可真是太巧了。" / "听起来很有趣呢。然后呢？雪乃酱的同伴当时被拒绝之后是怎么做的？" / "整天面对这些死板的工作，确实挺没意思的。小八幡，你说是吧？"
  雪之下雪乃:
    - 此刻目标: 保护会议流程不受阳乃的"恶趣味"破坏；对八幡提供最低限度的结构性保护
    - 行为倾向: 用议程切割叙旧——"这里是筹备会议，不是茶话会"；对折本的钝感不做道理辩论——"她根本听不懂"；将注意力转向拉芙希妮——寻求同盟；拒绝阳乃赞助时逻辑严密层层推进；用"杂务记录"强行将八幡钉在会议室
    - 知情边界: 通过八幡的反应确认折本对他的伤害深度；知道这就是阳乃"恶趣味"的具象化
    - 不得执行: 直接在会议上攻击折本（"伪物"判断在心里但不说出口）；对八幡表现出明显的同情或保护姿态
    - 表达意图（NPC台词参考）: "这里是讨论联合跨校企划的筹备会议，不是用来交流陈年旧事的茶话会。" / "那种需要'完全配合'的赞助，不过是变相的收购和控制。" / "在会议结束，并且整理完所有书面记录之前，我不允许你离开这个会议室半步。"
  拉芙希妮·都柏林:
    - 此刻目标: 在折本无限闲扯威胁会议进程时，用最高效的方式将其压制——同时试探阳乃
    - 行为倾向: 用英国礼仪做武器——"在英国的社交礼仪中……"将折本直接定性为"无礼"；一句话同时压制折本和阳乃（"您一定不希望京王高中被留下'毫无时间观念'的粗劣印象吧"）
    - 知情边界: 不知道折本和八幡的初中细节——但已推断出折本是八幡的"天敌"；阳乃的操纵模式让她联想到爱布拉娜
    - 不得执行: 在会议上讨论自己的家庭或描述爱布拉娜；主动为八幡的情感创伤做更多解读
    - 表达意图（NPC台词参考）: "在英国的社交礼仪中，当会议的主导方已经两次明确提出推进议程……如果继续坚持私人话题的延展，通常会被视为一种对合作缺乏诚意、甚至是对在场所有人时间的不尊重。" / "不过，既然作为对接人的阳乃学姐坐在这里，我想，您一定不希望京王高中的代表团，在合作的第一次碰头里，就被留下'毫无时间观念'的粗劣印象吧？"

信息边界:
  公开:
    - 折本香织——海滨综合高中学生，八幡初中同学
    - 折本在会议上讲述了八幡初中告白被拒并被当笑料传播的事件（在场所有人听到）
    - 阳乃提议用"家族企业朋友"赞助替换社区中心场地→被雪乃当场驳回
    - 雪乃将场地和预算议题搁置，推进非资金流程
    - 阳乃邀请八幡参加周末"四人聚会"（阳乃+叶山+折本+八幡）
  局部:
