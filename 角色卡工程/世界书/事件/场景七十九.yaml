世界推动: 雨声从走廊传来

NPC动机:
  雪之下雪乃:
    - 此刻目标: 用PTA自己的规则反击PTA——对母亲的变相宣战
    - 行为倾向: 撕开信封→阅读红字批注→分析权力结构→决定反击→打电话召唤一色→制定方案→分工→触碰到书包里的巧克力——紧绷感融化了一点点
  拉芙希妮·都柏林:
    - 此刻目标: 将庞杂的恐惧拆解为可执行的工作项
    - 行为倾向: 解释"大人们的目的就是制造恐惧"→拆解：场地坪效数据、防火通道、审计流程→"用安全套他们"
