场景功能:
  - 雪乃撕开平冢静留下的信封——阅读PTA红字批注——"儿戏""缺乏精英气质""不成体统"
  - ★雪乃决定接手——"如果他们要求'精英气质'和'严谨'，那我们就用无懈可击的数据和法规把他们的嘴堵上"
  - 雪乃打电话给一色——冷硬召唤——"你现在有两个选择……第二，立刻滚回特别栋闲置教室"
  - ★拉芙希妮拆解恐惧："将庞大的恐惧瞬间拆解为具体工作项目"——场地防火、人流疏散、审计标准
  - 一色跑回部室——看到红字批注后崩溃大哭——"他们凭什么只看一眼就全给毙了"
  - ★雪乃制定反击策略："以'安全'为核心，逼迫PTA面对高昂报价——让他们陷入二选一泥沼"
  - 全员分工开始工作——雪乃在书包里触碰到未拆的巧克力盒

进入状态:
  已发生:
    - 场景78：平冢静放下信封
