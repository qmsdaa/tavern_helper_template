偏离处理:
  - 若雪乃POV选择不接手（把信封推回去）：结衣会先拿起红字批注读出声，一色的电话照样打进来——本场的落点是"接手"，绕路可以，结果不变
  - 若玩家把反击策略换成别的路数（走人情、走妥协、走舆论）：允许——但必须给出能让 PTA 无法一眼否决的硬支点；"以安全为核心"是范例不是唯一解
  - 若一色被安抚得太快（没哭出来）：允许——她会在签字时手抖，把名字写歪，效果等价
  - 若拉芙希妮POV选择不出手拆解：雪乃会自己完成拆解但耗时更久，全员分工推迟到雨停后

