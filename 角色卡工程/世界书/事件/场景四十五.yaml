    - 八幡的自毁逻辑第一次被不是训斥而是直接的"空气污染"式批评卡住——且他接受了（下颌线松弛）

完成后事实:
  - 修学旅行返程——拉芙希妮左手腕红缎带的秘密仍在保护中（八幡已观测异常但选择不追问）
  - 拉芙希妮公开回答了雪乃的问题——"为了我自己"
  - 拉芙希妮用"空气污染/洁癖"比喻直接戳中八幡——八幡的防守被瓦解
  - 雪乃选择沉默——让拉芙希妮对八幡的"处理"完全不被打扰地落地
  - 雪乃的笔记本上多了一道克制的黑线——修学旅行的复盘可以在后续继续

氛围锚点:
  - 新干线平稳的低频震动取代了京都石板路上的脚步声
  - 拉芙希妮两只手交叉扣住袖口——左手拽右袖往下压半寸右手扣住左袖边缘——两条丝带都被稳稳藏在布料底下
  - 八幡把下巴缩进制服衣领里——果断将视线重新投向窗外——把不闻不问贯彻到底
  - 雪乃今天没有用红缎带扎垂发——长发随意披散在肩头
  - 结衣拆抹茶生巧包装的动作比平时慢了半拍——指腹在塑料封口上来回蹭了两次才找准撕开位置
  - 八幡侧脸垂下的下颌线松弛下来——虽然语气全是嫌弃和吐槽
  - 雪乃垂下眼帘——让披散长发遮挡大半侧脸——水笔在横格纸上划下一道克制的黑线

