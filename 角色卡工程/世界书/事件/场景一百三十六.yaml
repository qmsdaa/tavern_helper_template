玩家控制边界:
  - 玩家不能替铃木决定要不要见面
  - 玩家不能追问两人闹翻的具体原因
  - 玩家不能越过小町直接处理委托
  - 玩家可以选择对小町的处理方式表示认可或保留意见

可用节拍:
  - 铃木推门——缝只开十厘米，不敢进来 / 小町应答 / 铃木说出"伞"这个关键字
  - 小町问"闹翻了？多久？"——平稳的语气，不追问原因
  - 雪乃提供"放鞋箱"选项——被否定
  - 结衣问"怕被看见？"——铃木解释怕被看见偷偷放回去，也怕被本人看见
  - 大志判断"不是误会，是两件同时存在的事"——一年级说出这句话让铃木抬头
  - 小町决定"伞先放这里，明天下午再来；不要带东西，不要准备话"
  - 八幡问"现编的还是事先想好的"——确认妹妹在独立思考
  - 大志说"明天下午我去鞋箱那边看看"
  - 小町夸"大志你适合做奉仕部的人"——大志回应"已经是了"

偏离处理:
  - 若玩家追问铃木闹翻原因：铃木会回避——她连朋友的面都不敢见，不可能对陌生人说
  - 若玩家提出亲自去还伞：小町会拒绝——"这是她自己的伞"
  - 若玩家对小町的处理方式质疑：八幡会为妹妹辩护
  - 收敛路径：无论如何，伞必须由铃木自己归还；小町只提供缓冲而非代替

推进边界:
  保持当前场景:
    - 铃木在活动室内的对话
    - 四人对委托的非干预观察
  可以推进:
    - 到第二天下午，铃木再来
    - 到鞋箱区的会面
  永久失效:
    - 铃木今天之内与朋友和解——需要时间
    - 前辈替铃木去还伞——违背奉仕部原则

完成后事实:
  - 委托记录簿新页：委托人铃木，基本事项空，受理中
  - 水蓝色折叠伞留在活动室，靠在小町椅子旁边
  - 小町和大志获得前辈的默许信任
  - 八幡确认妹妹"编得不错"

氛围锚点:
  - 活动室暖气咔嗒声 / 四个人同时不插嘴的那种安静
  - 水蓝色折叠伞——系带是仔细重系过的蝴蝶结，不是原配系法
  - 伞骨有一根微弯 / 伞柄标签已磨掉
  - 铃木的声音卡在喉咙口，退半步又停住

