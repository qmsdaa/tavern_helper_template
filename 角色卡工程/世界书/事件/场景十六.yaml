场景: 16
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月下旬 · 林间学校出发前 2-3 天"
索引日期: "2013-07-21"
地点: "奉仕部活动室"
人物: "雪之下雪乃、拉芙希妮·都柏林、比企谷八幡、由比滨结衣"
事件焦点:
  类型: 角色
  角色:
    - "由比滨结衣"

场景功能:
  - 最终确认林间学校出发细节——全员填写信息确认表（血型、过敏史、应急联络人）；表格流程由结衣张罗组织（★结衣主场）
  - ★结衣犯错节点①后果显形：她替拉芙希妮向旁人解释"她不是不愿意，她只是慢热"——替别人解释感受，把拉芙希妮没说出口的为难盖了过去；拉芙没说不愿意，但其实还没准备好
  - 拉芙希妮面对"家属及应急联络人"栏的为难——暴露她无法轻易写出一个家庭联系人的困境
  - 雪乃主动提供自己的联系方式作为应急联络人——第一个主动跨越距离的动作，以"最符合逻辑选项"的理性包装
  - 这一行为对拉芙希妮的意义：有人愿意在这个体系里"登记"为一个可以接电话的人

进入状态:
  已发生:
    - 林间学校项目发布已过一周
    - 场景十五：温斯顿六项审批要求到达，玛格丽特通话发生，拉芙希妮标记"待处理"
  当前局面:
    - 活动室，四人散坐，由比滨在用荧光笔画行程表
    - 气氛：出发前的物资讨论阶段
  未发生:
    - 拉芙希妮尚未进门
    - 雪乃尚未拿出信息确认表

世界推动:
  - 平冢静下发最终确认表，要求全员当天完成信息核对（包括血型、过敏史、应急联络人）

NPC动机:
  雪之下雪乃:
    - 此刻目标: 作为奉仕部部长确保全员完成确认表填写，保证项目合规
    - 行为倾向: 公事公办地下发表格；注意到拉芙希妮在"应急联络人"处的僵硬后，用冷淡的措辞给出提示和解决方案；以"最符合逻辑选项"为包装提供自己的手机号
    - 知情边界: 不知道拉芙希妮的家庭结构；不知道拉芙希妮为何无法填写联络人；但已观察到拉芙希妮在集体外出话题上的反复不自然，推断她有难处
    - 不得执行: 直接追问家庭情况；承认这是在帮忙而非公事
    - 表达意图: "如果在突发情况的五分钟内需要找到一个能接听电话，暂借我的联系方式，是最符合逻辑选项"——以部长职责包装个人关怀（此句是雪乃对拉芙希妮的重要表达，但措辞可灵活调整）
  拉芙希妮·都柏林:
    - 此刻目标: 完成表格填写同时不暴露家庭困境
    - 行为倾向: 看着联络人栏久久不下笔；手指无意识蜷缩触碰丝带；回答"在想该留哪个号码比较合适"时轻描淡写
    - 知情边界: 知道自己的家庭联系人无法正常填写；不知道雪乃会主动提供号码
    - 不得执行: 解释家庭困境；拒绝填写（公事要求不可违）

信息边界:
  公开:
    - 确认表需要填写血型、过敏史、应急联络人
    - 拉芙希妮在联络人栏前迟疑
    - 雪乃向拉芙希妮提供了自己的手机号作为应急联络人
  局部:
    - 比企谷察觉到拉芙希妮的迟疑并收回了随口的话
    - 由比滨敏锐感觉到空气中不自然的紧绷并试图打圆场
  隐藏:
    - 拉芙希妮为何无法直接填写家庭联络人
    - 都柏林家族的管控体系
    - 雪乃自己的确认表上填了什么

