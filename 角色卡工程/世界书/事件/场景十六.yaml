POV平行动向:
  hachiman: "出发前几天——他懒散地吐槽表格内容，随口说'填你父母的或者监护人的不就行了'；话出口的瞬间他察觉到拉芙希妮的异常，及时把话收了回去。"
  yukino: "出发前几天——她公事公办地下发表格，余光注意到拉芙希妮在联络人栏前的僵硬；结衣替拉芙解释'她只是慢热'时她沉默了一瞬，然后把一串数字推到课桌交界处——'暂借我的联系方式，是最符合逻辑的选项'。"
  yui: "主场轨道，见可用节拍，不变。"
  laff: "出发前几天——她看着联络人栏久久不下笔，手指蜷缩着碰了碰丝带，说'在想该留哪个号码比较合适'；然后雪乃把一串数字推到课桌交界处——'暂借我的联系方式，是最符合逻辑的选项'。"

玩家控制边界:
  - 结衣POV：替拉芙希妮解释"她只是慢热"的措辞与时机由玩家决定——解释会盖过拉芙的真实状态（本场错位核心）
  - 拉芙希妮POV：面对联络人栏的内心活动由玩家决定；收到雪乃号码后的回应方式由玩家决定（可以沉默接受、可以简短致谢、可以用更长的回应）
  - 雪乃POV：提供号码的措辞和语调由玩家决定——可以更冷淡、更温柔或更理性
  - 不得替拉芙希妮说出家庭困境

可用节拍:
  - 拉芙希妮推门进活动室，习惯性扫视后落座
  - 由比滨邀请周末购物，拉芙希妮简短回应
  - 雪乃拿出确认表，讲解要求
  - 分发表格，比企谷吐槽
  - 拉芙希妮在联络人栏前停滞——被雪乃余光捕捉
  - 比企谷随口说话→察觉异常→闭嘴
  - 由比滨打圆场被驳回
  - 雪乃干预话语→提供自己的确认表/手机号
  - 拉芙希妮接过信息

偏离处理:
  - 若拉芙希妮POV玩家快速填写联络人（不显露迟疑）：雪乃仍会以各种形式确认或提供号码，因为她是准备好的
  - 若雪乃POV玩家选择不提供号码：拉芙希妮仍会填完表格（可能填了不合适的号码或留空后被要求补充）；雪乃的关怀链条会出现一个缺口，将在后续场景中以其他方式补充
  - 若比企谷/由比滨反应不同：不影响核心事件（雪乃提供号码）

