场景: 42
幕: "第三幕·二学期"
时间: "2013年11月15日 · 修学旅行第2天 · 白天到傍晚"
索引日期: "2013-11-15"
地点: "清水寺 → 二年宁坂 → 洛东旅馆"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣（+ 叶山组：叶山隼人、户部翔、海老名姬菜、三浦优美子、大和、大冈）"
事件焦点:
  类型: 角色
  角色:
    - "拉芙希妮·都柏林"

场景功能:
  - 奉仕部在二年宁坂观察叶山组——结衣当场确认海老名对户部没有好感
  - 户部的告白尝试被叶山组用精密结构阻挡——叶山试图用"中暑"借口掩盖户部的崩溃
  - 雪乃冰冷拆穿叶山的粉饰太平——叶山的面具裂开
  - 八幡准备用假告白自毁——被拉芙希妮用"京都人排外隐喻测试/街道戏剧节"的借口截断
  - 海老名配合拉芙希妮的荒谬台阶——用腐女笑话收场
  - 回去路上雪乃问拉芙希妮：你所做的是为了他还是为了你自己？

进入状态:
  已发生:
    - 修学旅行第二天，奉仕部四人从清水寺顺着石阶下行至二年宁坂
    - 前方叶山组（叶山、户部、海老名、三浦、大和、大冈）在同一条路上
    - 奉仕部对户部委托的方针是"先观察"——这个时机已到来
  当前局面:
    - 二年宁坂游人如织，奉仕部四人走在人群边缘
    - 户部正试图接近海老名——但大和、三浦用精密的物理阻挡把他推回原位
    - 叶山在旁边微笑看着一切发生
    - 拉芙希妮停下脚步，安静观察叶山组的每一个人的位置
  未发生:
    - 户部尚未崩溃
    - 叶山尚未动手按住户部
    - 八幡尚未准备假告白
    - 拉芙希妮尚未介入

世界推动:
  - 二年宁坂高密度狭窄路段——任何骚乱都会阻碍大量游客
  - 叶山组的精密结构和默认规则正在阻止户部告白
  - 修学旅行的自由活动意味着所有人都能看到这一幕

NPC动机:
  叶山隼人:
    - 目标：维持团体平衡，防止户部的告白引发不可逆的圈子破裂
    - 行为倾向：先用被动的旁观纵容大和和三浦阻挡户部；当户部崩溃时试图用"中暑"借口强行压住他
    - 知情边界：知道海老名对户部无感但从未告知户部
    - 不得执行：不得直接告诉户部"海老名不喜欢你"；不得承认自己的做法是踩着八幡的自尊粉饰太平
  户部翔:
    - 目标：向海老名告白
    - 行为倾向：在买小礼物的过程中不断尝试挤到海老名身边——每次都被精密的团体结构挡回
    - 知情边界：不知道海老名对他无感；不知道团体在集体阻挡他
    - 不得执行：不得在崩溃前意识到海老名对他无感
  海老名姬菜:
    - 目标：维持现状——既不想和户部交往，也不想当戳破气球的人
    - 行为倾向：用腐女笑声和配合三浦的转移话题来回避户部的靠近
    - 知情边界：完全知道户部想告白；完全知道团体在拦截户部；完全知道自己对户部无感
    - 不得执行：不得主动说出"我不喜欢你"；不得在有人给出荒谬台阶时不接
  三浦优美子:
    - 目标：维护海老名的"安全"——阻止户部打破平衡
    - 行为倾向：在关键时刻拉着海老名的手腕指向某家店铺以此转移注意力
    - 知情边界：知道海老名对户部无感
    - 不得执行：不得直接对户部说"别告白"
  大和/大冈:
    - 目标：配合三浦完成物理阻挡
    - 行为倾向：用"自然递水"等动作卡位
    - 知情边界：同上
    - 不得执行：同上

信息边界:
  公开:
    - 叶山组在二年宁坂的互动——所有游客和奉仕部四人可见
    - 户部的告白尝试失败被掩埋为"中暑"
    - 拉芙希妮用"文化体验"借口给所有人搭了台阶
  局部:
    - 结衣对海老名笑声背后本质的当场领悟（只有结衣本人清楚）
    - 八幡对结衣的低声警告——"没有把烂摊子扛到底的觉悟就别去捡那种黑锅"（只有结衣和八幡自己清楚）
    - 雪乃对叶山的那句质问——"这就是对所有人都好的做派吗？"（叶山、雪乃和周围人听到）
    - 拉芙希妮截断八幡自毁时的眼神和动作（八幡的视线扫过她的背影）
  隐藏:
    - 海老名姬菜对这一切的真实感受——她是否也为这个无法说出口的真相感到疲惫
    - 雪乃在问拉芙希妮"为了他还是你"时自己在思考什么

