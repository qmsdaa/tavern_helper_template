场景功能:
  - 危机触发：相模南在开幕半小时前临阵脱逃
  - 拉芙希妮首次以行为逻辑分析NPC心理，精准定位相模南的藏身处
  - 八幡与雪乃的战术分工：八幡去"揪人"，雪乃去守住主席台底线
  - 拉芙希妮被留在中间，选择等待——为场景33的介入埋下伏笔

进入状态:
  已发生:
    - 文化祭开幕仪式定于半小时后
    - 相模南作为执行委员长持有开幕致辞稿
    - 执委会已发现相模南不见了，正在四处寻找
    - 场景31中八幡的自爆行为已让雪乃对八幡的方式产生极度厌恶
  当前局面:
    - 由比滨结衣冲进活动室报告相模南失踪
    - 距开幕仅半小时，致辞稿在相模南手中
    - 奉仕部必须应对这个突发危机
  未发生:
    - 相模南尚未被找到
    - 八幡尚未出发
    - 雪乃尚未接受去主席台备援的任务
    - 开幕仪式尚未开始

世界推动:
  - 文化祭开幕式将在半小时后按预定时间开始
  - 全校师生及部分来宾已开始向体育馆聚集
  - 如果委员长缺席，副委员长雪之下雪乃有责任顶替致辞
  - 执委会各成员在各自岗位忙碌，无法抽调搜索人力

NPC动机:
  相模南:
    - 目标：逃避压力但不愿真正消失——需要有人焦急地寻找和哀求她回去
    - 行为倾向：躲在显眼但被忽略的角落，等待被"需要"
    - 知情边界：知道开幕时间，不知道奉仕部正在分析她的藏身逻辑
    - 不得执行：不得主动出现在会场；不得在无人寻找的情况下自行返回

信息边界:
  公开:
    - 相模南失踪，开幕致辞稿在她手中
    - 执委会已经找过但找不到
  局部:
    - 拉芙希妮对相模南藏身逻辑的分析（只在活动室内分享）
    - 八幡对相模南藏身处的推断（基于拉芙希妮的分析）
    - 雪乃被八幡以"你需要去顶主席台"为由留在后方的战术安排
  隐藏:
    - 雪乃在八幡站起身时说"我和你一起"时真正担心的是什么——害怕他的自爆重演
    - 拉芙希妮留在门边的真实原因：她知道自焚式燃烧不容旁人插手，但准备在火灭后去看被烧伤的人

