场景: 11
幕: "第二幕·暑夏·林间学校"
时间: "2013年7月上旬 · 场景十的直接延续（雨停 · 蒲公英之后）"
索引日期: "2013-07-05"
地点: "总武高特别栋与主楼之间的开放式走道"
人物: "雪之下雪乃、拉芙希妮·都柏林（结衣与八幡在场景边缘）"
事件焦点:
  类型: 角色
  角色:
    - "雪之下雪乃"
    - "拉芙希妮·都柏林"

场景功能:
  - 雪乃看到拉芙希妮第一个真正的笑容——不设防的、属于拉芙希妮本人的笑，而非社交面具
  - 确立④CP（雪乃→拉芙）情感起点：雪乃被这个笑容击中，触发强烈内心动摇与防御机制
  - 拉芙希妮在雪乃面前首次允许自己"不设防"——这是她从未对任何人展示过的松弛

进入状态:
  已发生:
    - 场景十：踩水洼、接蒲公英种子、不打伞淋雨、雪乃递面巾纸
  当前局面:
    - 雪乃停在拉芙希妮身旁，手指捏着那包面巾纸尚未递出
    - 拉芙希妮正看着水洼的倒影；结衣和八幡在稍远处
  未发生:
    - 拉芙希妮尚未转头、尚未笑
    - 面巾纸尚未交接

世界推动:
  - 无外部强制事件——全场由角色间互动驱动

NPC动机:
  拉芙希妮·都柏林:
    - 此刻目标: 无明确目的——她只是自然转向看向雪乃
    - 行为倾向: 不回应雪乃的慌乱和反话，只是安静注视；不追问、不纠正
    - 知情边界: 不知道自己的笑对雪乃造成的冲击程度；不知道雪乃的防御机制
    - 不得执行: 主动解释笑容原因；刻意安慰雪乃；追问雪乃的动摇

信息边界:
  公开:
    - 拉芙希妮对雪乃露出了一个极淡的、真实的笑容
    - 雪乃的语速、动作出现异常（抓发辫加速、声音僵硬）
    - 雪乃把面巾纸塞给拉芙希妮后走开，在中段停下来
  局部:
    - 只有雪乃知道自己内心的混乱与防御机制的运作
    - 只有拉芙希妮知道自己的笑不是刻意为之
  隐藏:
    - 拉芙希妮的家庭背景、还火事件、达洛维小姐
    - 雪乃对"没人去看你"这句话的真实意图（不是不在乎，而是怕自己太在乎）
    - 两人过去的情感经历

