POV平行动向:
  hachiman: "雨后的走道——他在稍远处和结衣站在一起，看见雪之下停下、说话、抓发辫的动作越来越快，走开后停在中段不动；结衣喊了一声'小雪乃？'，雪之下没有回应，他多看了一眼。"
  yukino: "主场轨道，见可用节拍，不变。"
  yui: "雨后的走道——她看见雪乃和拉芙希妮停在走道上说话，雪乃走开后停在中段不动，她喊了一声'小雪乃？'，没人回应；气氛有点异样，但她说不清哪里不对。"
  laff: "主场轨道，见可用节拍，不变。"

玩家控制边界:
  - 雪乃POV：对笑容的反应方式（慌乱/沉默/冷静/直接走开）由玩家决定，不受原文束缚
  - 拉芙希妮POV：笑或不笑、笑的幅度由玩家决定
  - 所有POV：不得替对方角色决定内心反应或情感结论

可用节拍:
  - 拉芙希妮转过头来看向雪乃
  - 拉芙希妮笑了（AI触发视觉信息；幅度由拉芙POV玩家决定）
  - 雪乃的外在反应触发（AI可描述外部可见细节如手停在空中、呼吸微变、抓发辫；内心留给玩家）
  - 雪乃开口说话——AI推进节奏但不预设具体话语
  - 面巾纸交接——AI可推动拉芙希妮伸手接或雪乃塞入手中
  - 雪乃转身走开，在中段停下，背对所有人
  - 结衣在远处喊"小雪乃？"

偏离处理:
  - 若雪乃POV玩家选择不慌乱、不说反话：拉芙希妮仍会笑，场景氛围会不同；雪乃的回避可以表现为沉默、低头、直接走开
  - 若拉芙希妮POV玩家不笑：核心剧情点（④CP起点）将延后至后续场景；但拉芙希妮仍可安静看着雪乃，场景以面巾纸交接收束
  - 无论玩家如何偏离，最终物理收束：面巾纸交接完成，两人物理上分开（放学/离开走道）

推进边界:
  保持当前场景:
    - 拉芙希妮尚未转头
    - 两人仍在走道上面对面
    - 面巾纸尚未交接
  可以推进:
    - 雪乃已离开走道中段（走远或回到结衣/八幡处）
    - 放学结束，各自离开学校
    - 场景的情绪高潮已过
  永久失效:
    - 本场景不可能永久失效——场景以"走道上站一会儿后各自离开"自然结束

完成后事实:
  - 拉芙希妮在雪乃面前露出了第一个真正的笑容（雪乃眼中所见，④CP里程碑）
  - 雪乃因笑容产生强烈内心动摇，触发防御机制（抓发辫加速、语速异常、仓促离开）
  - 拉芙希妮收到第二件来自雪乃的物品：熊猫面巾纸（第一件是场景十的折叠伞）
  - 两人之间出现可感知的情感张力，但未明说

氛围锚点:
  - 雨后潮湿的走道，屋檐残水滴落在积水上发出间歇滴答声
  - 褪色的彩虹只剩红色一端挂在天边
  - 拉芙希妮翡翠色眼睛中倒映着彩虹残余光和雪乃的身影
  - 包装袋细碎的塑料摩擦声，雪乃指尖在发辫上快速滑动的节奏

禁止提前:
  - 雪乃对自己情感的正面承认或命名
  - 拉芙希妮对"没人去看你"背后含义的理解或追问
  - 任何人讨论或点破这个笑容的意义
  - "苇草"称呼（场景134后才授权给雪乃使用）
