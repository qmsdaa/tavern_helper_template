  hachiman: "拉面馆——他听着户部的告白委托，死鱼眼却越过桌面落在叶山身上——他不是来帮忙的，他是来确保告白不会破坏团体现状的；结衣提议吃拉面时，他发现自己不知道怎么回击一碗热气腾腾的拉面邀请。"
  yukino: "拉面馆——她听出叶山漂亮话里的算计；结衣提出吃拉面时她的逻辑拒绝滑到舌尖，但看到那双带着近乎恳求固执的眼睛，她没有接话，把瓷杯往内侧推远半寸。"
  yui: "拉面馆——她扣下手机避开叶山的视线；叶山和户部起身要走时，她叫住叶山，落后半步说了一句只属于他们那个圈子的话——'今天的事，你不来反而更干净。你来了，户部心里反而更乱'——叶山沉默两秒，只说'……谢谢你的提醒，由比滨'。她没有点破，只是用圈内人的温度软化了半分；两人离开后，她把那个提议说出口：去吃拉面庆祝文化祭结束。在拉面馆里，她看着拉芙希妮以学术报告般的严肃态度点了一碗三倍味增。"
