NPC动机:
  雪之下雪乃:
    - 此刻目标: 掩盖"罪证归档"的存在——用逻辑包装为"风险评估"
    - 行为倾向: 发现拿错后猛合笔记本→责备"窥探私人物品"→用"向平冢老师提交行为矫正报告"强行合理化
    - 知情边界: 知道笔记本上写了什么——非常清楚
    - 不得执行: 承认那是"私人情感记录"
  拉芙希妮·都柏林:
    - 此刻目标: 不戳破雪乃的防御——但用干燥的调侃让雪乃知道她看到了
    - 行为倾向: 看清内容后眼底闪过笑意→不追问→最后用气声说"下次如果需要补充素材，随时可以叫我"

