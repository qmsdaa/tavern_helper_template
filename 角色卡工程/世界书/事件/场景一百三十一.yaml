场景功能:
  - 第一次全体审查：拉芙以"申请人"身份做自我代表陈述
  - 爱布拉娜在宣读退出协议后主动提交"利益回避与权限放弃声明"——签下名字、回避全部表决、放弃所有知悉与介入权限
  - 拉芙陈述完整方案：升学（已考完共通测试）→住所（续租）→生计（信托+自己挣）→失败条件（备用路径）→朋友与节日（不出让）→"我要成为作家"
  - 托马斯追问"代价"和"三年后不后悔"→拉芙确认没有保证→"后悔的可能写在失败条件里，由我本人承担"
  - 托马斯追问保险调查报告→拉芙："它不在今天的议程里。不用任何人的错误，给自己换东西。"
  - 表决结果：赞成两票，弃权一票，回避一员，无反对→退出协议通过
  - 爱布拉娜从头到尾没有朝申请人席看一眼

