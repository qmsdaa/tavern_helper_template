    - 表达意图："账目上看，你出的多。"→"你用什么保证，三年以后不后悔。"
    - 表达意图：追问保险调查报告→"你今天没有提交它。"→拉芙回答后→"问完了。"
    - 知情边界：知道保险调查报告的存在（不知道完整内容）
    - 不得执行：否决退出协议（他的投票是"赞成"）
  凯瑟琳（列席）:
    - 目标：以程序视角确保协议条款没有漏洞
    - 行为倾向：翻开列席用薄本子→问程序性问题
    - 表达意图："协议生效后，申请人的姓氏与私人亲属关系如何处置。协议有没有解除条款。"
    - 知情边界：协议条款
    - 不得执行：参与表决（列席，无表决）
  玛格丽特·都柏林:
    - 目标：在表决中以最安静的方式投出赞成票
    - 行为倾向：在投票时把乌木表决牌推过中线→目光在拉芙右袖口停了一瞬
    - 表达意图：不发言，只用表决牌表达立场
    - 知情边界：全部
    - 不得执行：在议事中公开表达对拉芙的偏袒
  埃德蒙·都柏林（缺席，委托弃权）:
    - 目标：弃权——书面委托布丽吉特代为声明
    - 行为倾向：不参与，不阻挡
    - 不得执行：投票

