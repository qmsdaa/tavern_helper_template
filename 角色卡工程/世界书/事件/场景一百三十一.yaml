    - 目标：按程序规则主持第一项议程
    - 行为倾向：宣布议事录开始→宣读两项议程→逐项推进
    - 表达意图："第一项议程开始。执行层先作风险说明。"
    - 表达意图：在表决中宣布"依例不投票"→确认结果
