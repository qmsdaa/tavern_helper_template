    - 表达意图：在风险说明第三节："协议通过后，执行层不再保留对申请人的任何知悉与介入权限。相关汇报线、观察安排、在日联络，全部关闭。关闭会产生一段信息真空，家族需要适应。"——她在描述自己即将失去的东西
    - 表达意图：在退出协议最后一条主动注明"申请人放弃之全部权益，不得以任何形式，转入执行层任何成员名下。包括本人。"——堵住所有怀疑
    - 表达意图：签字时"笔尖落进签名栏，没有停。姓名，日期，一笔到底。"
    - 表达意图：从始至终没有朝申请人席看一眼——不看，是她唯一能做的
    - 知情边界：退出协议全部内容→利益冲突→拉芙的方案细节（仅通过文件了解）
    - 不得执行：在表决中投票（已回避）；在离场前与拉芙对话；在声明生效后保留任何对拉芙的知悉权限
  托马斯（长老）:
    - 目标：测试拉芙的"代价"意识与决断深度
