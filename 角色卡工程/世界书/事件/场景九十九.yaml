事件焦点:
  类型: 角色
  角色:
    - "拉芙希妮·都柏林"

场景功能:
  - 接机场景：爱布拉娜降落千叶，首次与奉仕部全员见面
  - ★拉芙希妮开始偏离三人剧本：从第一句话起，她的措辞不属于任何人事先替她准备的版本——今天回答问题的是她本人
  - 拉芙希妮主动介绍三人为"我的朋友"——不是请求许可，是陈述事实
  - 拉芙希妮首次对爱布拉娜行使自主权：拒绝坐她的车，要求"我们乘电车去学校"
  - 确立总武高奉仕部活动室作为会谈地点——拉芙希妮的主场选择
  - 爱布拉娜以不变应万变：不追问也不反驳，保持得体

进入状态:
  已发生:
    - BA005已降落，爱布拉娜在入境检查
    - 拉芙希妮带着雪乃画的接机草图（场景97）
    - 全员已在接机区等候
  当前局面:
    - 成田T2国际到达大厅，接机人群
    - 拉芙希妮左手腕无任何丝带（已收进锡盒），右腕只剩浅色勒痕
    - 结衣买了四瓶饮料，其中一瓶是给爱布拉娜的（拉芙希妮说姐姐不会喝）
  未发生:
    - 爱布拉娜尚未从海关通道出来
    - 本次会谈的具体内容尚未展开

世界推动:
  - 电子屏：BA005从"已降落"切到"到达手续办理中"
  - 清洁车沿隔离栏经过
  - 自动门反复打开（旅行团、短袖旅客）
  - 广播播报另一航班行李转盘变更
  - 成田机场暖气、人群流动

NPC动机:
  爱布拉娜·都柏林:
    - 此刻目标: 控制场面但不失体面，观察拉芙希妮和她身边的人
    - 行为倾向: 以最少的言辞维持优雅主宰感；被拒绝坐车和换地点时不反驳不追问
    - 知情边界: 知道三人姓名（提前调查），未知他们在拉芙希妮生活中的具体位置
    - 不得执行: 在机场当众发怒或失态；直接命令拉芙希妮上车
  艾米丽:
    - 此刻目标: 协助爱布拉娜的行程，执行被指定的安排
    - 行为倾向: 专业高效，观察但不评论
    - 知情边界: 有车辆和访客登记安排；不知被拉芙希妮拒绝后的备用方案
    - 不得执行: 替爱布拉娜施压
  雪之下雪乃:
    - 此刻目标: 以静默的方式作为拉芙希妮的后盾在场
    - 行为倾向: 收起草图，用最简洁的敬语应对爱布拉娜
    - 知情边界: 知道爱布拉娜是拉芙希妮的姐姐、翡翠资本执行董事
    - 不得执行: 在接机时主动出击或挑衅
  由比滨结衣:
    - 此刻目标: 友好得体地完成初次见面
    - 行为倾向: 主动递水给艾米丽、鞠躬问候、紧张但不退缩
    - 知情边界: 对爱布拉娜的认识仅限于拉芙希妮的描述
    - 不得执行: 过度热情或追问私人问题
  比企谷八幡:
    - 此刻目标: 作为在场者提供沉默的支撑
    - 行为倾向: 用最低限度的礼貌完成自我介绍，不讨好也不对抗
    - 知情边界: 对爱布拉娜的认识仅限于拉芙希妮的描述和调查
    - 不得执行: 发表刻薄评论（即使他可能在腹诽）；主动与爱布拉娜交谈

信息边界:
  公开:
    - 爱布拉娜已到达，艾米丽同机
    - 拉芙希妮主动介绍三人为"我的朋友"
    - 拉芙希妮拒绝坐爱布拉娜的车，提出乘电车去学校
  局部:
    - 仅拉芙希妮：接机草图昨夜的精度、右腕勒痕背后的烧伤故事
    - 仅在四人之间：他们提前到达、交通卡是拉芙希妮的日常用品
  隐藏:
    - 爱布拉娜对奉仕部三人的真实评价（她会在场景100展现）
    - 拉芙希妮的锡盒在风衣内袋

