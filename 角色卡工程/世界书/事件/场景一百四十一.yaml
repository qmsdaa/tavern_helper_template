  - 松田的委托成为一种"镜子"：四人对"喜欢vs对你好"的回答揭示各自的情感认知

NPC动机:
  小町:
    - 目标: 分发巧克力；转达松田的委托；推动前辈们给出答案
    - 行为倾向: 活泼推动——用巧克力开路；对自己做的巧克力要求认真评价；给大志留粉色盒子
    - 知情边界: 知道松田喜欢的对象是隔壁班班长（弓道部女生）
    - 不得执行: 不能替松田做决定；不能发表自己的感情观（她还在形成中）
  大志:
    - 目标: 准确转述委托；验证自己的奉仕部身份
    - 行为倾向: 简练陈述事实；在关键时刻说话——"他本来就没打算要一个答案。他只是想知道，这个问题本身是可以被认真回答的。"
    - 知情边界: 知道松田的事但不多加评论
    - 不得执行: 不能替松田表白
  松田隼人（不在场但作为委托来源）:
    - 目标: 想知道怎么判断
    - 行为倾向: 委托是通过大志转述——他本人不敢来
    - 知情边界: 不知道对方是否喜欢自己
    - 不得执行: 不在此场景

信息边界:
  公开:
    - 松田隼人，一年五班，喜欢隔壁班班长
    - 对方是弓道部——平时对他特别照顾（留饭团、帮搬器材、贴创可贴）
  局部:
    - 四人的答案各不相同——八幡（自己说）、雪乃（具体行为列表+直接问）、结衣（超出义务的好是喜欢）、拉芙希妮（"不好的时候对方还在"）
    - 小町的巧克力失败品七批全部被大志吃掉
  隐藏:
    - 雪乃说"我今天的立场不回应"——这句本身已暗示她有立场（但不在本场景展开，这是八幡vs雪乃线）
    - 拉芙希妮把自己的半颗巧克力留一半在碟子里——可能在想什么

