场景: 134
幕: "第十幕·冬去春来"
时间: "2015年1月29日 · 周四"
索引日期: "2015-01-29"
地点: "拉芙希妮公寓→总武高特别栋奉仕部活动室"
人物: "拉芙希妮·都柏林、雪之下雪乃、比企谷八幡、由比滨结衣"
事件焦点:
  类型: 角色
  角色:
    - "拉芙希妮·都柏林"

场景功能:
  - 归国与汇报：拉芙从伦敦返日后回到奉仕部→"我回来了"
  - 委托状态更新→"表决通过了。退出协议生效。"
  - 日常复建：值日从今天开始还（"不是利息。是复位。"）→红茶给活动室（"用信托的生活费买的。所以是大家的东西。"）
  - **苇草昵称授权**（核心）：拉芙分享玛格丽特姑婆起的昵称"苇草"→只授权雪乃使用
  - 这是一个关系令牌（RELATIONSHIP TOKEN），不是浪漫行为：信任与"被看见"→"你会把它叫得很省"
  - 昵称分配确认：雪乃="苇草"，八幡="都柏林"不变，结衣="拉芙希妮酱"不变
  - 回归日常结尾：明天肉包→周六结衣家火锅欢迎会

进入状态:
  已发生:
    - 拉芙于1/20退出协议通过→1/23第二项议程→1/26告别伦敦→1/27起飞→1/28抵达成田
    - London的一切已经结束：信托启动、退出协议、档案更正、怀表不上弦、父亲烤炉房
    - 返程希思罗到成田已完成→票根夹在护照里
  当前局面:
    - 一月二十九日早晨→拉芙在卧室收好退出协议正本和返程票票根
    - 文件匣合上→书包出门
    - 放学后→特别栋三年级楼层空了大半（共通测试结束，出勤管理松了）
  未发生:
    - 苇草昵称在日常中的实际使用频率
    - 高考（二月）→毕业（三月）
    - 爱布拉娜与拉芙的下一次接触

世界推动:
  - 拉芙回到奉仕部活动室→"我回来了"
  - 委托记录簿状态更新：受理中→通过→"表决通过了。退出协议生效。"
  - 雪乃在记录簿写下日期：二〇一五年一月二十日
  - 反自我牺牲条款确认："原方案，一条没改。"
  - 拉芙为期十天的值日欠账从今天开始还→红茶（伦敦买的）放入活动室茶柜
  - 苇草昵称被授权→"部内增加一个称呼"（雪乃的部长式反应）
  - 三年J班毕业文集（每人一篇，三月截稿）→拉芙答应写

NPC动机:
  八幡:
    - 目标：用最少的话表达最多的欢迎；确认反自我牺牲条款没有被触发
    - 行为倾向：书托管了椅子（"你的位置被我的书临时托管了十天。现在办理移交。"）→用袖子抹了一把椅面
    - 表达意图："哦。你的位置被我的书临时托管了十天。现在办理移交。"→用最别扭的方式说欢迎
    - 表达意图："反自我牺牲条款。用上没有。"→"没有。原方案，一条没改。"→"哦。那我那一栏白紧张了。"
    - 表达意图：对苇草昵称→"我免了。都柏林叫顺了。现在改口，前面的全白叫了。"
    - 知情边界：委托结果（通过，原方案未改）；昵称（不叫）
    - 不得执行：在昵称问题上表达情感→"都柏林叫顺了"是事实陈述

  雪乃:
    - 目标：以部长身份更新委托记录→接收昵称授权→确认毕业文集事项
    - 行为倾向：合上委托记录簿→站起→"欢迎回来。"
    - 表达意图：把委托记录簿翻到最新一页→推到桌子中间→"结果怎么样？"→用笔一行行记→写下日期
    - 表达意图：听到"苇草"后→"为什么是我？"→"从管理上说，部内增加一个称呼，只会造成混乱。"→"但是，委托人指定的事项，我没有拒绝受理的条款。"→"苇草。"
    - 表达意图：提醒毕业文集→"三年J班的毕业文集，每人一篇，三月截稿。你不在的这十天，我把你的页数保留下来了。"
    - 知情边界：委托全部流程→苇草昵称的含义
    - 不得执行：在"苇草"之后说任何多余的话→她只说了一个字

  结衣:
    - 目标：用最大的音量欢迎拉芙回来→确认第一顿肉包→接受昵称分配→宣布欢迎会
    - 行为倾向：第一个从椅子上弹起来→绕过半张长桌→一把攥住胳膊
    - 表达意图："回来啦！欢迎回来！"→"比走的时候胖了一点！很好！"
    - 表达意图：在尼克公示后→"诶？！只有小雪乃吗？！"→举起手又自己放下→"啊，不过，算了！拉芙希妮酱就是拉芙希妮酱，叫顺口了，我才不想改呢！"
    - 表达意图："拉芙希妮酱回来了，真好。"→宣布周六火锅欢迎会→"肉包，明天就有。车站那家，从明天起每天都有！"
    - 知情边界：委托结果；昵称（不叫）
    - 不得执行：为不能叫"苇草"而坚持→她接受+放弃的速度很快

信息边界:
  公开:
    - 拉芙已返回日本→退出协议通过→委托完成
    - 苇草昵称被授权给雪乃→只在部内，由雪乃一人使用
  局部:
    - 拉芙从伦敦带回的红茶（在活动室茶柜）
    - 昵称的真实来源（玛格丽特姑婆→帕斯卡→"人是一根会思想的苇草"）
  隐藏:
    - 伦敦之行的全部情感细节（怀表不上弦、烤炉房对话等——拉芙今天没有提）
    - 昵称在"家里"的完整使用历史

