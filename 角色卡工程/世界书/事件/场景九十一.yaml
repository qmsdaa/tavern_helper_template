POV平行动向:
  hachiman: "春假的雨夜——窗外的雨声和游戏BGM混在一起，他打了一整个晚上；他不知道今晚有两个人正在一张茶几上写一封会改变很多事的信。"
  yukino: "春假的雨夜——她带伞出门，在拉芙希妮的公寓里用英语纠错一整晚，坚持'纸质信比电子邮件更有重量'；她压纸、推杯、指明落款的位置，看着对方签下全名。"
  yui: "春假的雨夜——白天跟妈妈看了一下午电视，晚上早早就困了；睡前给群里发了句'明天天气不错'，没人回，她也没在意。"
  laff: "主场轨道，见可用节拍，不变。"

玩家控制边界:
  - 拉芙希妮POV：邀请函的具体措辞、对雪乃手覆上来的反应、署名时的内心活动由玩家决定
  - 雪乃POV：与拉芙希妮互动时的严厉程度、是否有更多肢体接触由玩家决定
  - 不得替拉芙希妮决定是否向雪乃透露烧焦丝带的内容

可用节拍:
  - 雪乃指出"Dear Eblana"不妥，强调必须第一行建立不容拒绝的强硬
  - 雪乃解释纸质信件比电子邮件更具有不可逃避的重量
  - 拉芙希妮故意拼错单词拖延时间，被雪乃发现
  - 雪乃的手覆上拉芙希妮握笔的手，短暂停留
  - 雪乃发现又一次拼写错误，羞恼地训斥
  - 拉芙希妮坦白"如果写太快，雪乃同学的手可能就会收回去了"
  - 雪乃耳尖泛红，团掉废纸，重新铺好信纸
  - 拉芙希妮认真书写，雪乃在旁边无声协助（压纸、推杯）
  - 署名处停顿，雪乃用手指指定落款位置
  - 拉芙希妮签下全名"Loughshinny Dublin"
  - 墨迹吹干，装入信封

偏离处理:
  - 若拉芙希妮POV玩家选择不故意拖延：雪乃仍会指出拼写错误，但亲密互动减少
  - 若雪乃POV玩家选择更冷淡：拉芙希妮仍会完成信件，但氛围更紧张
  - 若任何一方选择讨论口袋中的信封：雪乃会理性分析但对丝带无情绪波动（她不知道那是烧焦的）
  - 署名困难的处理方式可不同，但最终必须签下全名

推进边界:
  保持当前场景:
    - 信件正文尚未完成
    - 署名尚未落笔
    - 信封尚未装入
  可以推进:
    - 信件已完成、装入信封、准备寄出
    - 雨声减弱，场景自然收束
  永久失效:
    - 不适用

完成后事实:
  - 给爱布拉娜的邀请函已完成，收在拉芙希妮处待寄
  - 雪乃已用自己的方式完成了对拉芙希妮的实质性支撑
  - 拉芙希妮口袋中的旧信封仍未被雪乃知晓

氛围锚点:
  - 雨夜窗外的细密雨声，将公寓与千叶街道隔绝
  - 钢笔笔尖在羊皮纸上发出的沙沙声
  - 室内空调微弱的嗡嗡声，茶几上方吊灯冷白的光
  - 雪乃指侧微微薄茧的触感，洗发水极淡的香气
  - 最后签名落笔时深蓝色墨迹在羊皮纸纹理上微微分叉

禁止提前:
  - 信件寄出后的任何结果
  - 雪乃得知烧焦丝带的内容
  - 爱布拉娜的任何反应
  - 八幡和结衣的出场
