事件焦点:
  类型: 角色
  角色:
    - "拉芙希妮·都柏林"

场景功能:
  - 雪乃协助拉芙希妮起草给爱布拉娜的邀请函，确立纸质信件的战略意义
  - 揭示拉芙希妮口袋中藏着平冢静转交的旧信封（烧焦丝带）
  - 展现雪乃以逻辑推导撑起对拉芙希妮的实质性支撑，两人关系深化
  - 拉芙希妮最终签下全名落款，完成从逃避到正面邀请的关键一步

进入状态:
  已发生:
    - 平冢静在修業式后将旧信封交给拉芙希妮（场景90）
    - 拉芙希妮已开始办理休学手续
    - 雪乃已知拉芙希妮需邀请爱布拉娜来日
  当前局面:
    - 雨夜，两人在拉芙希妮公寓茶几前起草邀请函
    - 雪乃坚持用纸质国际加急信件，拒绝电子邮件
    - 拉芙希妮口袋中藏着烧焦丝带，她尚未告知雪乃
  未发生:
    - 邀请函尚未完成
    - 雪乃不知道拉芙希妮口袋里信封的内容
    - 信件尚未寄出

世界推动:
  - 窗外持续下雨，将公寓与外界隔绝
  - 羊皮纸和钢笔的书写过程
  - 信件完成后需要晾干、装入信封

NPC动机:
  雪之下雪乃:
    - 此刻目标: 确保邀请函措辞强硬、格式完美，能逼使爱布拉娜正视
    - 行为倾向: 以逻辑分析和纠错代替直接安慰，用行动而非言语表达支持
    - 知情边界: 不知拉芙希妮口袋中的烧焦丝带和平冢静的交托
    - 不得执行: 追问拉芙希妮口袋里的东西、主动进行肢体安慰（除非拉芙希妮先表露脆弱）
  平冢静:
    - 不直接出场，仅通过拉芙希妮口袋中的旧信封存在

信息边界:
  公开:
    - 雪乃和拉芙希妮正在写邀请爱布拉娜来千叶的信
    - 改用纸质国际加急件而非电子邮件
  局部:
    - 仅拉芙希妮知道：口袋中旧信封里是烧焦丝带，来自达洛维小姐，由平冢静转交
    - 仅拉芙希妮知道：右腕丝带 = 还火事件，该事件与爱布拉娜的关系
    - 信的具体措辞内容仅两人知晓
  隐藏:
    - 烧焦丝带的完整来历
    - 还火事件的真相
    - 爱布拉娜对邀请函的真实反应

