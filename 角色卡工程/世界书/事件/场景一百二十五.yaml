POV平行动向:
  hachiman: "归国日——他站在接机人群稍远处抱着手臂，被分到明显小一圈的蛋糕，看了一眼什么都没说；听完整个讲述，他最后只说了句'四分钟啊……跑得真快'。"
  yukino: "归国日——她最后一个走上前，说'欢迎回来'；听完讲述后她问的第一个问题是'你打算怎么办'，得到回答后沉默了很久，最后说'现在，答案在你这里了'。"
  yui: "归国日——她第一个冲上去抱胳膊，打量有没有瘦；听到'有些部分请允许我不说'时立刻点头：'不说也可以！什么时候想说了再说，不想说就永远不说！'"
