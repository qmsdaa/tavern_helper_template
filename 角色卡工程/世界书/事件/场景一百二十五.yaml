场景功能:
  - 归国场景：拉芙回到千叶，奉仕部全员在成田机场接机
  - 拉芙向全组公开调查结果——从保险报告编号到书房对峙（共享真相时刻）
  - 保留一部分不说（"有些部分，请允许我不说"）——拉芙划定分享边界
  - 八幡的"四分钟啊……跑得真快"——用最小的话语承载对达洛维最重的敬意
  - 值日表空格被拉芙亲手填上自己的名字——"就是六个人了"
  - ★结衣的主导时刻：真相共享之后，四个人想要的下一步并不相同——雪乃问"你打算怎么办"、八幡只想拉芙安全回来、拉芙说"什么都不打算"、而她自己想让所有人都好好的。她没有像往常一样把分歧抹平，而是第一个公开说出来："我们……是不是其实没有共同的答案？"
  - ★结衣的私心显形：她想留住所有人，不想让四个人分开——这个愿望不体面、不温柔，但她没有收回（yui.voiced_disagreement_publicly 旗标域；说完后她仍观察反应、仍补救，但不撤回立场）
  - 连接Act 8与Act 9：真相已被共享，为后续"以自己的名字委托"奠定信任基础

进入状态:
  已发生:
    - 拉芙在伦敦完成调查：书库档案清理→玩具熊发现→保险报告调取→认证謄本获取
    - 8/12深夜书房对峙：爱布拉娜的"永远"断裂→"我不会原谅你"
    - 从8/12到8/29期间拉芙在伦敦如何处理与爱布拉娜的关系（场景125跨越这段时间）
    - 8/29 拉芙乘返程航班从希思罗回到成田
  当前局面:
    - 全员在成田机场到达口举牌接机（硬纸板"欢迎回来"牌子，小町举，大志托）
    - 拉芙走出闸口——脚步停了半拍
  未发生:
    - 拉芙后续对爱布拉娜的态度演变
    - 委托奉仕部"帮自己留在日本"
    - 退出协议的提出与通过

世界推动:
  - 拉芙结束了近一个月的伦敦之行，回到日本
  - 值日表第六张便签被填上"拉芙希妮·都柏林"——空格被消去
  - 开学前最后一个周五，欢迎会持续到傍晚
  - 文化祭企划在暑假期间已有进展（小町和大志整理完毕值日交接）

NPC动机:
  小町:
    - 目标：用最大声量和最显眼的欢迎牌子表达高兴
    - 行为倾向：举牌、蹦跳、抢话——情感最外显
    - 知情边界：不知道拉芙在伦敦查了什么（知道之后在活动室被告知）
    - 不得执行：追问伦敦详情（她先被大志拉走了，错过了后续的真相公开）
  大志:
    - 目标：协助小町，同时保持对前辈的适当距离
    - 行为倾向：默默托牌、拉走小町（"顺路"可能是借口）
    - 知情边界：同上
    - 不得执行：同上
  八幡:
    - 目标：观察拉芙的状态变化
    - 行为倾向：不直接问，用间接方式表达关心（"落地记得报平安"改消息）
    - 表达意图"……刚才那句，是原话吧。连说法都跟你平时不一样"——注意到拉芙转述爱布拉娜的语句异常
    - 表达意图"四分钟啊……跑得真快"——对达洛维最简短也最重的评价
    - 知情边界：听完拉芙的完整讲述，知道三个签名和达洛维的真相
    - 不得执行：在拉芙讲述时插科打诨或转移话题
  雪乃:
    - 目标：在拉芙讲述过程中保持专注聆听，最后问关键问题
    - 行为倾向：不打断，不追问让拉芙为难
    - 表达意图"你说过，可能什么都查不到。现在，答案在你这里了"——确认拉芙得到了答案
    - 表达意图"你打算怎么办？"——今天问出的第一个问题
    - 知情边界：听完拉芙的完整讲述
    - 不得执行：质疑拉芙的分享边界（"有些部分，请允许我不说"——被尊重）
  结衣:
    - 目标：用拥抱和蛋糕覆盖拉芙的归来仪式
    - 行为倾向：肢体接触（抱胳膊、打量有没有瘦）、准备蛋糕、最多情绪表达
    - 表达意图"不说也可以！什么时候想说了再说，不想说就永远不说！"——第一个确认拉芙的保留权
    - 知情边界：听完拉芙的完整讲述
    - 不得执行：追问拉芙说不出口的部分

信息边界:
  公开:
    - 拉芙于8/29抵达成田，全员接机
    - 拉芙在活动室向全组讲述了伦敦调查的全部经过（以下为公开部分）：
      - 保险报告编号
      - 风险升级评估
      - "已读"签收
      - "行程维持。按原计划执行"批复
      - "不得进入"命令
      - 三个签名同一个人
      - 火不是爱布拉娜放的
      - 达洛维是唯一及时进入的人
      - 8/12晚上把謄本放在爱布拉娜面前
      - 爱布拉娜说"我没有命令任何人纵火"
      - 謄本留在了爱布拉娜处
      - 不会交给长老会
      - "我不会原谅她"
  局部:
    - 爱布拉娜的"永远"断裂（拉芙选择不说——"有些部分，请允许我不说"）
    - 玩具熊的发现（拉芙同样选择不说）
    - 姐妹之间具体的情感交流细节
  隐藏:
    - 拉芙在伦敦8/12之后的日常细节（未被询问也没有被主动提及）
    - 爱布拉娜在拉芙离开后的状态
    - 达洛维小姐遗产接收方信息（尚未提及）

