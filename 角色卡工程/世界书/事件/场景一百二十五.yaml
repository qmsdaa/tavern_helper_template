玩家控制边界:
  - 讲述的详细程度与节奏——拉芙可以选择哪些部分展开讲、哪些部分略讲
  - "有些部分，请允许我不说"的划定——哪些部分归入这一范畴由玩家决定
  - 对八幡"四分钟"评价的反应——可沉默/可回应/可不说

可用节拍:
  - 接机：出闸口→牌子→"我回来了"
  - 电车：左右夹问→平稳回答
  - 活动室：欢迎蛋糕→茶
  - 小町大志离场→门合上→安静
  - 拉芙站起→取出档案→"约好了要告诉你们的"
  - 从头到尾讲述
  - 转述爱布拉娜原话（语序变化被八幡捕捉）
  - 结衣的拥抱式确认（"不想说就永远不说"）
  - 雪乃的关键问题（"你打算怎么办？"）
  - 拉芙的回答（"什么都不打算"→不原谅→达洛维才是受害者）
  - 八幡的"四分钟"——安静
  - 值日表填名→"就是六个人了"
  - ★散场前的安静里，四个人对"接下来"的期待摊在桌面上：雪乃的问法、八幡的沉默、拉芙的"什么都不打算"——没有一个答案同时属于四个人
  - ★结衣没有打圆场。她看着自己的杯子，说出那句以前绝不可能说的话："我说……我们，是不是其实没有共同的答案？"（措辞由玩家决定，含义保留）
  - ★她没有用"不过没关系啦"收回去——她补的是："我不想我们就这样散开。这是我想的，不是大家想的。"说完她仍看着三个人的反应，手指攥紧杯壁——但她没有撤回

偏离处理:
  - 若小町和大志没有在拉芙讲述前离开：可让他们在场听到部分，但原作路径是他们先走了——可由管家/校外事件引导他们离开
  - 若拉芙讲述时情绪崩溃：可以的，但注意她讲述的风格是"很慢，也很平"——这是经过思考的叙述，不是宣泄
  - 若有人追问"永远"或玩具熊：拉芙可以重申"有些部分，请允许我不说"

