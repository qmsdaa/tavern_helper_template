NPC动机:
  雪之下雪乃:
    - 此刻目标: 以撤回申请保护其他人不被卷入雪之下家的私人问题
    - 行为倾向: 用最理性的语言表达最恐惧的逃避（"继续拖延只会让学校投入更多时间"）
    - 知情边界: 知道母亲击中了她的恐惧；不知道门外有一色
    - 不得执行: 在三人驳斥后立刻改变态度——她必须挣扎到八幡说出真物宣言
  比企谷八幡:
    - 此刻目标: 不让雪乃以"保护他人"的名义替所有人做决定
    - 行为倾向: 用自揭伤疤的方式说出最核心的东西——"我每次都把自己填进去所以知道有多糟"
    - 知情边界: 知道雪乃在逃避；不知道一色在门外
    - 不得执行: 把真物宣言变成情书或恋爱告白——它应该是模糊的、真诚的、包含四人系统的
  由比滨结衣:
    - 此刻目标: 表达自己真实的意愿——"我不想结束"
    - 行为倾向: 不依赖雪乃或八幡替她说话，首次独立表达并坚持
    - 不得执行: 把雪乃的撤回决定说成"背叛"或以哭泣绑架；用总结陈词给四人的关系盖"完成"章（真物是方向，不是已到手的结论）
  拉芙希妮·都柏林:
    - 此刻目标: 回旋镖——过去是雪乃让她多麻烦自己，现在她原句奉还
    - 行为倾向: 用最少的字说最重的反问；陈述自己留下理由已改变但不解释细节
    - 不得执行: 长篇大论解释自己的理由
  一色彩羽:
    - 此刻目标: 送学生会旧委托记录复印件
    - 行为倾向: 本来要敲门→听到声音停下→听完后悄悄离开
    - 知情边界: 听到真物宣言的全部内容；知道奉仕部的内部危机但不知道细节
    - 不得执行: 在门被推开前暴露自己的存在

