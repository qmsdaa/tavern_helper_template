场景功能:
  - ★真物宣言 HAMMER SCENE——八幡说出"我想要真物"，将四人关系提升至宣言层面
  - 雪乃宣布准备撤回奉仕部继续设置申请——被三人逐一驳斥
  - 八幡与雪乃的对峙核心："你每次都先算出谁承担代价最合适再把自己填进去"→现在她换了位置把整个奉仕部填进去
  - 拉芙希妮的反问："你为什么不多麻烦我们一点？"——是对雪乃之前问她"为什么不多麻烦我一点"的回旋镖
  - 结衣的自主表达："我不想结束。这是我自己的想法"——不依赖他人
  - 真物宣言包含拉芙希妮：四人的真物——即使表达笨拙、互相误解、必须反复确认，双方仍不再靠含糊和自我牺牲逃走
  - ★结衣拒绝用漂亮的"真物定义"提前宣布修复完成：她可以说"说清楚不等于已经做到了"，但不发表完整心理分析、不替四人盖章
  - 一色彩羽在门外偷听——第一次听到真物宣言，抱文件袋离开

进入状态:
  已发生:
    - 昨天母亲在接待室击中了雪乃的恐惧（场景104）
