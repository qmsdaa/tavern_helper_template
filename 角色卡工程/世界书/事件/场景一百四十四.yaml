事件焦点:
  类型: 角色
  角色:
    - "雪之下雪乃"

场景功能:
  - 雪乃与阳乃关系的成熟收束——阳乃从"用不理解当武器"到"不理解是我的问题"
  - 雪乃的个人选择被阳乃真正看见——"这句话比你过去的任何一句话都更像你自己的"
  - 阳乃承认自己的错误判断方式——从"我不理解所以它是伪物"到"用不理解来判定太懒了"
  - 毕业典礼前——阳乃承诺会来

进入状态:
  已发生:
    - 雪乃合格一桥大学法学部（场景143）
    - 奉仕部活动仍在继续
    - 阳乃开车来千叶——非"经过"，是专程
  当前局面:
    - 雪乃从活动室出来，抱住两本习题册，最上贴着结衣的便签
    - 阳乃在走廊等——"访客登记"
    - 姐妹坐到中庭长椅
  未发生:
    - 毕业典礼（场景148）
    - 阳乃的毕业典礼出席

世界推动:
  - 这是雪乃-阳乃线的最终和解场景（非完全和解，而是达成相互理解的方式）
  - 阳乃的角色转变完成：从否定者到观察者

NPC动机:
  阳乃:
    - 目标: 在雪乃毕业前确认"你真的在选自己的路"——不是来评判的
    - 行为倾向: 比以往收敛——不说"伪物"，不在话里埋钩子；说"经过千叶"但被雪乃拆穿后不否认
    - 知情边界: 知道雪乃考上一桥、知道奉仕部这两年多的事、知道拉芙希妮的昵称是"苇草"
    - 不得执行: 不能再用"我不理解所以是伪物"的逻辑；不能否定雪乃的选择
    - 关键台词意图:
      - "以前你说'自己选的'——我会觉得你在证明什么。现在觉得——你可能真的只是在选。"
      - "用'不理解'来判定，太懒了。不理解是我的问题，不一定是对方的问题。"
      - "'我看着这三个人做了两年多的委托'——这句话比你过去的任何一句话，都更像你自己的。"
      - "找不完，但还在找。这个就是不伪。"

信息边界:
  公开:
    - 雪乃考上一桥法学部
    - 法学部是雪乃自己选的——不是建筑，不是政治，不是妈妈
    - 阳乃开车来的——不是经过千叶
  局部:
    - 阳乃注意到拉芙希妮"在用看另一个人的方式看我"——她知道是拉芙希妮的姐姐
    - 阳乃问"她自己知道吗"——雪乃说"知道。但知道和改变是两件事。"
  隐藏:
    - 阳乃自己对"伪物"判断的起源——她只说"用过很多次。对八幡。对很多人。"
    - 母亲对雪乃选法学的反应——不在此场景

