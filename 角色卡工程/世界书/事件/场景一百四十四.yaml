玩家控制边界:
  - 玩家不能替雪乃决定如何回应阳乃——这是姐妹关系的高阶场景
  - 玩家不能回避阳乃的直视——阳乃此行的目的就是确认
  - 玩家可以选择用多少防御和保护来应对，但核心台词不应被跳过

可用节拍:
  - 阳乃出现在走廊——灰色大衣，没拿包 / 雪乃隔三排鞋箱看见她
  - 雪乃问"你怎么进来的"→"访客登记。你学校的门卫记得我。"
  - "什么事"→"没有事。经过千叶。"
  - 雪乃抱住两本习题册——最上贴着结衣的便签（拉芙希妮让结衣帮忙写的）
  - 两人到中庭长椅——木条钉的，过冬后有几道裂纹 / 隔一个人的距离——比以前近了
  - 阳乃说"听说你考上一桥了"——"法学院"→"法学部"
  - "不是建筑。也不是政治。"→"不是。是我自己选的。"
  - 阳乃说"以前你说'自己选的'——我会觉得你在证明什么。现在觉得——你可能真的只是在选。"
  - 阳乃说奉仕部——"一群高中生要免费做这些。为什么不用这个时间准备考试、经营人脉——"
  - 雪乃说"你不理解。这是事实。我不需要你理解。"
  - 阳乃承认——"以前我用'不理解'当武器。我判断不了的东西，就判定为伪物。……现在不用了。"
  - 关键句：阳乃说"用'不理解'来判定，太懒了。不理解是我的问题，不一定是对方的问题。"
  - 雪乃拆穿"不是经过千叶"——阳乃不否认
  - 雪乃说"以前以为那是体面。后来发现有比体面更需要留住的东西。"
  - "比如。"——"他们三个不需要我体面。"
  - 阳乃问苇草——"她允许你这么叫"→"她主动给我的"
  - 阳乃说拉芙希妮"在用看另一个人的方式看我"——"她姐姐"
  - "那个人的轮廓比那个人本身更不好处理"——"她自己知道吗"
  - 雪乃说"知道。但知道和改变是两件事。"
  - 雪乃完整叙述为什么选法学——不是对抗，是看着三个人做了两年多委托后发现世界上有人需要被认真对待
  - 阳乃说"这句话比你过去的任何一句话，都更像你自己的。"
  - 雪乃说"我还在找"——"找什么"——真正的自己
  - "找到多少了"——雪乃列清单：法学部、不听妈妈的、不听你的、说高兴、说不、说需要时间、接住担心、允许选错
  - "但还没找完。可能永远不会找完。"
  - 阳乃说"找不完，但还在找。这个就是不伪。"——这是阳乃全剧对雪乃最肯定的一句话
  - 阳乃起身——"毕业典礼。我会来。"——"你想来"→"不是'想来'。是你毕业这件事。我不想从别人嘴里听到。"
  - 雪乃说"好。"——简洁但有力
  - 阳乃走——灰色大衣在走廊尽头缩成很小的点
  - 雪乃在中庭站一会儿——樱花树还没花苞但树枝末端比冬天粗了

偏离处理:
  - 若玩家对阳乃保持高度戒备：阳乃会接受这个距离——"以前隔得更宽。现在这个距离，是两年多缩成这样的。"
  - 若玩家拒绝说出选法学的真实理由：阳乃不会追问——她这次不是来审讯的
  - 若玩家否认"还在找"：阳乃会说"找不完但还在找就是不伪"——但不会强迫
  - 收敛路径：无论如何，姐妹这次对话必须在毕业前完成，且阳乃必须确认雪乃的状态

