场景功能:
  - ★午休前后，结衣自发把两校志愿者和记分席的轮换吃饭安排掉——没有人命令她，她自己发现空缺并补上，让记分席和检录处不断人。她举着自己画的简陋轮换表挨个帐篷跑，嗓子哑着还在喊。这是结衣的执行位从"咨询台"往"让机器不停转的人"的延伸——与场景110的执行位呼应（2026-08-17 第二批 B3b 补录）
  - 体育祭当日——场地分配方案(正案+施行案)在实际操作中受检验
  - 四起现场变故被逐一应对——每一起考验方案的可操作性:
    ①跑道积水→雪乃动用早上预走时画下的备用路线
    ②足球部赛前集合与撤收冲撞→雪乃当场改时段并让户部补义务
    ③器材归还漏记→雪乃让责任委员当场补记录
    ④一年级不会按新号码排队→大志提出"按原号码集合再由检录处重新分"被采纳
  - 雪之下夫人全天站在来宾席边缘——折起赛程表用银色笔记录,目光追随雪乃
  - PTA审查会议闭幕:追加意见撤回,奉仕部本年度活动由学校负责
  - 母亲离开前的收束:"复印件我保留了"

