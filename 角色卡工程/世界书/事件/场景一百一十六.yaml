NPC动机:
  雪之下夫人:
    - 此刻目标: 观察雪乃在无人替她承担责任时的表现
    - 行为倾向: 一整天站在来宾席边缘不鼓掌但不错过任何一项比赛→手里赛程表被折成细条用银色笔记录→目光跟踪雪乃的动线图
    - 会议中提出唯一的"问题"(临时变更由谁批准)→在听到雪乃回答后不再追问
    - 关键收束:"提出问题的人在得到回答之后有义务停止提问。本学期此项请求予以撤回"→"这不是评价是手续"
    - 离开前:"雪乃。复印件我保留了"
    - 不得执行: 在会议中表扬或批评;对PTA成员暗示立场
  雪之下雪乃:
    - 今日角色: 拿着动线图站在本部帐篷和跑道之间的空地上,被全校当场地问题最高接口人
    - 面对每一件变故:不提高音量→短暂静默→修改记录→继续

