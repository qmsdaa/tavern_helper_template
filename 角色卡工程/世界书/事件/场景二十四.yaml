玩家控制边界:
  - 拉芙POV：是否答应结衣的邀约由玩家决定——但场景以答应为前提构建；对"好看吗？"的评估过程由玩家决定（可以更简短或更审慎）；对"开心吗？"的回答是核心决策点——标准答案"还好"到真实"开心"之间的区间由玩家决定；对发卡的放置方式由玩家决定——原文放口袋是最贴近皮肤的位置
  - 结衣POV：发笑的解释由玩家决定；对拉芙各项反应的回应态度由玩家决定
  - 所有POV：不得让非拉芙POV的角色获知拉芙的内心活动和物品分类逻辑

可用节拍:
  - 拉芙收到结衣短信，停顿半分钟后答应
  - 两人在MARINPIA会合，开始逛街
  - 帽子店：结衣试帽提问，拉芙三秒评估后给出"好看"，结衣笑
  - 拉芙不解结衣笑的原因
  - 离开MARINPIA，在海岸站附近长椅休息
  - 结衣买冰淇淋，两人并排坐着看黄昏天际线
  - 结衣问"今天开心吗？"——拉芙停顿后给出回答
  - 返程检票口前，结衣买发卡并塞给拉芙——"我们一对哦"
  - 结衣挥手上相反方向电车
  - 拉芙独自面对发卡，放入口袋

偏离处理:
  - 若拉芙POV玩家对"开心吗？"给出标准答案（"还好""并不讨厌"）：结衣不会追问，但她的情绪温度可能会轻微降低——场景的情感分量减轻，但两人关系不会退步
  - 若拉芙POV玩家拒收发卡：结衣会收回但表现出明显的失落——可能影响后续她主动靠近的勇气
  - 若拉芙POV玩家不答应赴约：整个场景不成立——需要跳至其他暑假场景

推进边界:
  保持当前场景:
    - 拉芙尚未收到或尚未答应短信
    - 两人尚未进入帽子店
    - 结衣尚未问"开心吗？"
    - 发卡尚未赠送
  可以推进:
    - 两人已完成购物，各自乘上返程电车
    - 发卡已交付，两人已分开
  永久失效:
    - 帽子店中的三秒评估笑点——拉芙此后可能学会更快回应类似提问，那三秒的"过度认真"是当前阶段的独特表现
    - 结衣问"开心吗？"的那个黄昏长椅——特定时间特定温度下提出的没有陷阱的问题

完成后事实:
  - 拉芙在二十四小时内经历：昨天定义对方为"样本"→今天被对方毫无防备地当成朋友
  - 拉芙学会了另一类问题的存在——不是评估、不是测试，只是想知道
  - 拉芙拥有了一枚粉色发卡——放在最贴皮肤的口袋里，不属于任何现有分类体系
  - 结衣对拉芙的认知更新：这个人"认真得可爱"

