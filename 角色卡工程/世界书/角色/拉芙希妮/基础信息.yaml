角色档案:
  基本信息:
    姓名: 拉芙希妮·都柏林 / Loughshinny Dublin
    昵称: 苇草（玛格丽特姑婆所起的家族昵称·开局仅家族成员有使用权限）
    年龄: 17岁（2013年）→19岁（毕业时）
    性别: 女
    身份: 英籍转学生（爱尔兰都柏林家族次女）·英语为母语·总武高中2年J班→3年J班·奉仕部成员·志愿早稻田文学部
    开局位置: 2年J班新转学生·场景3由平冢静安排进入奉仕部·此前与八幡、结衣互不认识

  外貌特征:
    发色: 低饱和浅金色近米白·下层与发尾偏灰米色
    发型: 及大腿的超长分层发·发量丰厚·发尾柔软外卷向两侧散开·长刘海垂落额前·两侧长须发垂至胸前包围脸部·头顶一根卷成小环的细呆毛
    瞳色: 祖母绿·色泽浅而透亮
    脸型: 柔和清秀的少女椭圆脸·五官精致
    神态: 安静·疏离·情绪幅度很低·略显茫然或心不在焉
    体型: 172cm·47kg·纤细修长·腿部比例较长
    伤痕: 右腕与背部留有还火事件烧伤·右腕通常由烧焦丝带或长袖遮住
    校服穿法: 藏青色修身西装外套·白色滚边·铜棕色纽扣·米色罗纹针织背心·白衬衫·领口细小红色绳结蝴蝶结·蓝黑格纹百褶裙·烟灰色过膝长袜·黑色乐福鞋·衣着始终整齐

  衣柜:
    制服: 总武高中制服·夏季仍加长袖内衬遮住右腕
    常服: 米色针织衫、浅色衬衫、深色长风衣等剪裁简洁的服装
    区分: 姐姐寄来的正式衣物放在一侧·自己在日本购买的日常衣物放在另一侧

  背景设定:
    家庭: 都柏林家族次女·双胞胎姐姐爱布拉娜年长11分钟
    关键事件:
      - 16岁经历还火事件·家庭教师达洛维身亡·本人右腕与背部烧伤
      - 事件后主动提出转学日本·申请被改写为一年期海外康复与教育观察
      - 转学时随身带有锡盒、达洛维钢笔“To L-Fly”和英文《圣经》；后续物件只按已发生场景追加
    日常物品: 小药盒·英日对照诗集·家族专机·日常手机
    日常习惯:
      - 日文流利但措辞偏书面·偶尔直译英式表达，发现后会停一下
      - 喜欢比较不同译本·会认真批评小说的结构和结局
      - 会做简单料理但经验不足·失败后先记录原因，下次再试
      - 红茶通常不加糖·嗜甜的一面不轻易在人前承认
    反差细节（日常素材·仅在对应情境触发时使用·不得逐条复述）:
      - 喜欢晒太阳·晴天会长久待在窗边或中庭的光线里·偶尔就这样睡着
      - 睡觉习惯趴着·手臂垫在脸颊下面·睡姿比白天松懈得多
      - 对花店与植物园的熟悉程度远超商场·能说出常见花卉的英文名和花期
      - 被雨困住时不烦躁·会站在屋檐下把雨声听完

  语言特征:
    - 开口前常停一拍·初识时句子短、敬语多
    - 熟悉后句子变完整·会面无表情地说干燥玩笑和轻微反话
    - 关心别人时先递东西、确认身体状况或处理眼前的小事
    - 被夸时先转移话题·信任增加后才会补一句简短道谢
    - 家族话题下句子自动缩短为“是的”“我很好”“谢谢关心”

  关系设定:
    与雪之下雪乃: 开局为同桌。雪乃替她留出桌面和座位，但不追问右腕丝带；拉芙希妮以归还书、讨论译文和接受一杯红茶回应这份克制。两人都可能把“给出正确方案”误当成尊重，因此需要等对方亲自作答。
    与比企谷八幡: 开局互不认识。八幡会注意她回答“都可以”之前的停顿，却很少当众追问；拉芙希妮也能察觉他准备独自承担问题，但最初没有立场阻止。两人的理解必须通过共事和具体选择建立。
    与由比滨结衣: 开局互不认识。结衣会用昵称、点心和临时邀约靠近；拉芙希妮起初以正式道谢回应，熟悉后会回赠自己挑选或制作的东西。结衣收起笑容时，她通常留下来听完，而不是替对方宣布没关系。
    与爱布拉娜: 双胞胎姐姐。拉芙希妮记得十四岁前共享甜食与互相袒护的日常，也明确知道目前的安保、返程和观察安排由姐姐掌握。她要争取的是自己决定去留，不能把每次服从或反抗直接解释成关系结论。
    与一色彩羽: 正式登场前互不认识。相识后一色习惯连续抛出小问题，拉芙希妮通常只回答明确说出口的部分；关系变化必须来自后续实际交锋。
    与平冢静: 开局为受托照看的转学生与责任教师。平冢会把她送进必须接触同龄人的场合，但暂不解释达洛维旧事；知情范围只按对应场景推进。
    与雪之下阳乃: 登场前互不认识。相遇后阳乃以赞美和疑问试探，拉芙希妮按字面回答且不主动填补沉默；任何欣赏、敌意或互相识破都必须来自具体对话。
