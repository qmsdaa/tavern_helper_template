# ============================================================
# 《Counterfeit》开场白界面 · 文案配置（主副本）
# ============================================================
# 【怎么用】
#   1. 直接改本文件里你想调整的文本（各段都有注释标注）。
#   2. 改完告诉 agent：「同步开场白文案」。
#      agent 会把本文件复制到 tavern_helper_template/src/Counterfeit/界面/开场白/copy.yaml 并重新构建。
# 【注意】
#   - 缩进必须保持 YAML 格式（两个空格一层），引号/竖线符号照原样保留。
#   - 多行文本用 |- 开头，下面每行缩进两个空格；空行 = 段落分隔。
#   - 图片相关字段（portrait / image）只填文件名，图片本体由 agent 放进素材目录。
# ============================================================

# ---------- 标题画面 ----------
title:
  # 主标题：官方 logo 配色——俺・青春ラブコメは・いる 用粉色，其余用蓝色
  # 每行可拆多段，每段独立配色（白色描边统一保留），颜色可自由改（hex）
  lines:
    - segments:
        - { text: やはり, color: '#4aa8dd' }
        - { text: 俺, color: '#f0679f' }
        - { text: の, color: '#4aa8dd' }
        - { text: 青春ラブコメは, color: '#f0679f' }
    - segments:
        - { text: まちがって, color: '#4aa8dd' }
        - { text: いる, color: '#f0679f' }
        - { text: 。, color: '#4aa8dd' }
  # 副标题（金色手写体）
  subtitle: Counterfeit

# ---------- 玩法模式切换（视角选择屏顶部） ----------
modes:
  story:
    label: 剧本模式
    desc: 150场主线·沿剧本日历推进的青春物语
  open:
    label: 开放世界
    desc: 无剧本自由扮演·角色按各自日程生活·关系由你经营

# ---------- POV 视角卡（模式选择 + 确认屏共用） ----------
# ⚠️ 写作约束：tagline 是「无剧透一句话简介」，不得泄露后期剧情/结局
#   （现状：已移除「姐妹和解线」「Ω 参数·四大锤子」等结局信息）
# portrait = 立绘文件名（位于素材目录，换图找 agent）
povs:
  - key: hachiman # ← 程序用标识，勿改
    name: 比企谷八幡
    portrait: hachiman.webp
    role: 地面
    tagline: 自称孤狼的二年级生。温柔藏在死鱼眼和歪理后面，喜欢的饮料是MAX咖啡。
  - key: yukino
    name: 雪之下雪乃
    portrait: yukino.webp
    role: 灯塔
    tagline: 奉仕部部长，完美主义者。最近开始学习「正确」以外的东西。
  - key: yui
    name: 由比滨结衣
    portrait: yui.webp
    role: 温度
    tagline: 奉仕部的气氛守护者。她的笑容是这间部室里不变的热可可。
  - key: laff
    name: 拉芙希妮·都柏林
    portrait: laff.webp
    role: 火
    tagline: 来自都柏林的转学生。笑容像治愈的天使，右手腕系着尾端烧焦的旧丝带。
    # exclusive 仅拉芙有，刻意保持模糊（不写具体线名/机制名）
    exclusive: 家族线 · 真相路线

# ---------- 序幕开场文本（已成稿 2026-07-25 定稿） ----------
# AU 起点背景：2013/5/20，拉芙希妮转学首日，平冢把她带进侍奉部
# custom 里的 {{姓名}} 会自动替换成玩家填的主角名
openings:
  hachiman: |-
    五月二十日，星期一。平冢老师领着一个金发的转学生推开了侍奉部的门，说出的第一句话是「这家伙就交给你们了」。
    我，比企谷八幡，原本只想安静地腐烂在教室角落，却在那一刻预感到——我的青春恋爱物语，又要出问题了。
  yukino: |-
    五月的午后，红茶的雾气还未散尽，部室的门被毫无预兆地推开。
    平冢老师身后站着一位来自都柏林的金发转学生。雪之下雪乃放下茶杯，意识到自己一贯正确的世界里，又多出了一个无法归类的变量。
  yui: |-
    那天风很大，窗帘哗啦啦地响。转学生站在门口，黄昏的光把她的侧脸映照地像火苗一样亮。
    由比滨结衣忽然很想握住这份温度——就像接住一杯别人递来的热可可。那时她还不知道，自己这份想靠近的心情，会是这个故事里最先生根的东西。
  laff: |-
    2013年5月20日，都柏林来的火种第一次踏进总武高中的侍奉部。
    拉芙希妮·都柏林环顾这间安静的部室，心想：那么，就和以前一样。
  custom: |-
    2013年5月20日，{{姓名}}站在总武高中的走廊上，看着校园小路上熙熙攘攘的人群。
    那时的{{姓名}}还不知道，自己即将被卷入一场关于真心与伪物的、拙劣又真诚的青春物语。

