  简单:
    label: 简单
    desc: 事件羁绊+10 · 判定宽松 · 轻松体验剧情
  普通:
    label: 普通
    desc: 事件羁绊+3 · 标准判定 · 推荐
  困难:
    label: 困难
    desc: 事件羁绊+1 · 判定严格 · 慢热深水

