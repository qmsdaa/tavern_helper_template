:'yui',name:'由比滨结衣',portrait:'yui.webp',role:'温度',tagline:'奉仕部的气氛守护者。她的笑容是这间部室里不变的热可可。'},{key:'laff',name:'拉芙希妮·都柏林',portrait:'laff.webp',role:'火',tagline:'来自都柏林的转学生。笑容像治愈的天使，右手腕系着尾端烧焦的旧丝带。',exclusive:'家族线 · 真相路线'}],dlc_povs:[{key:'hachiman_f',name:'比企谷八幡（性转）',portrait:'genderbend_hachiman.webp',role:'DLC 专属',dlcExclusive:!0,tagline:'七月的清晨醒来，镜子里的死鱼眼还是自己的，身体却已经不是记忆中的样子。'},{key:'yukino',name:'雪之下雪乃',portrait:'yukino.webp',role:'灯塔',tagline:'奉仕部部长。这个世界的她正常如故，在家过周末时收到结衣发来的邀约。'},{key:'yui',name:'由比滨结衣',portrait:'yui.webp',role:'温度',tagline:'奉仕部的气氛守护者。暑假刚开始，她正忙着约小雪乃和小企去迪斯尼乐园玩。'},{key:'laff',name:'拉芙希妮·都柏林',portrait:'laff.webp',role:'火',tagline:'从英国返回日本的拉芙希妮，在成田机场被几人接机，却发现人群里的八幡有些不一样。'}],openings:{hachiman:'五月二十日，星期一。课间，户部他们挤在走廊上议论，说J班转来了一个金发的英国美女。\n我，比企谷八幡，原本只想安静地腐烂在教室角落，却在那一刻预感到——我的青春恋爱物语，又要出问题了。',yukino:'五月的早晨，第一节课前的教室还有些松散。班主任领着一位金发的转学生站上讲台，说她来自英国。\n雪之下雪乃坐在靠窗的座位上，看着那个整洁得过分的新生走向自己身旁的空位——右手腕上，一条尾端烧焦的旧丝带。她隐约觉得，自己一贯正确的世界里，多了一个无法归类的存在。',yui:'那天风特别大，窗帘被吹得哗啦啦作响。班里不知谁先提起——隔壁J班来了个英国转学生。「听说是金发的。」「长得超漂亮。」「但是感觉很难接近诶。」\n由比滨结衣趴在桌上听着，忍不住偷偷往窗外看了一眼。「下课要不要去看看？」她刚这么说，就被旁边的优美子笑着拉住：「那种类型的人，搭话了也会被冷淡回应吧？」「诶……有那么夸张吗？」她嘴上这么说，手指却轻轻敲着桌面，没有真的放弃这个念头。\n不好接近，到底是什么意思呢？是讨厌别人靠近，还是只是……不知道该怎么和别人相处？那时候的由比滨结衣还不知道——有些相遇并不是因为一开始就特别重要，只是因为某个人先伸出了手，后来的一切才慢慢有了意义。',laff:'2013年5月20日，都柏林来的火种第一次站进总武高中的教室。黑板前，全班的视线落在她身上。\n拉芙希妮·都柏林理了理袖口的旧丝带，心想：那么，就和以前一样。',custom:'2013年5月20日，{{姓名}}站在总武高中的走廊上，看着校园小路上熙熙攘攘的人群。\n那时的{{姓名}}还不知道，自己即将被卷入一场关于真心与伪物的、拙劣又真诚的青春物语。',dlc_genderbend_hachiman:'七月十二日，星期六。闹铃按昨天设好的时间响起，手机记录、房间和记忆都没有变化。\n变化的是握住手机的手、落到肩边的头发、出口的声音，以及镜子里那个仍然摆着死鱼眼的人。手机通知栏里，结衣发来的消息还亮着——约几个人一起去迪斯尼乐园玩，结尾连着一串感叹号。\n门外，小町已经把手搭上门把，问她哥哥是不是还活着。',dlc_genderbend_yukino:'七月十二日，星期六。雪之下雪乃在公寓醒来，潘先生还占着枕头一角。\n手机里躺着结衣发来的消息：「小雪乃！暑假一起去迪斯尼乐园玩吧！小企也说要去！拉芙希妮酱好像也快回来了，正好一起！」\n她盯着屏幕看了两秒，决定先泡红茶，再决定要不要答应。',dlc_genderbend_yui:'七月十二日，星期六。由比滨结衣被萨布雷的爪子踩醒，遛完狗回来就窝进沙发开始拉人。\n「小雪乃！小企！暑假一起去迪斯尼乐园玩吧！难得放假嘛！」她一边发消息，一边盘算集合时间和要带的东西，等着有人回复。',dlc_genderbend_laff:'七月十二日，星期六。拉芙希妮·都柏林结束了在英国的一段行程，按计划返回日本。\n走出成田机场的到达口，接机的几人已经等在那里——雪乃、结衣、小町，还有一个看起来和记忆里不太一样的八幡。结衣第一个挥手上千：「拉芙希妮酱！欢迎回来！瘦了没有！」',dlc_genderbend_custom:'七月十二日，星期六。{{姓名}}正在千叶市度暑假。\n群里的结衣正张罗着去迪斯尼乐园玩，机场那边有人从英国接机回来；与此同时，街头的传言、群里的消息与熟人欲言又止的表情，都指向同一件事——比企谷八幡好像变得有点不一样了。',dlc_body_swap_hachiman:'七月十二日，星期六。陌生卧室的床头放着精确到分钟的日程，镜子里是雪之下夫人的脸。\n门外有人提醒七点四十分出发，阳乃正在楼下等母亲。陌生手机同时响起，来电显示“比企谷宅”。',dlc_body_swap_mrs_yukinoshita:'七月十二日，星期六。雪之下夫人在一间男高中生的房间里醒来，镜中与手机都写着比企谷八幡的生活。\n门外的少女正以妹妹的口吻催促哥哥；房间里没有任何说明互换原因的东西。'},gallery:{title:'画廊',hint:'悬停可暂停放映 · 点击胶片帧放大',items:[{title:'场景 CG 01',caption:'',image:null},{title:'场景 CG 02',caption:'',image:null},{title:'场景 CG 03',caption:'',image:null},{title:'场景 CG 04',caption:'',image:null},{title:'场景 CG 05',caption:'',image:null},{title:'场景 CG 06',caption:'',image:null}]}}])},7828(e,t,n){n.d(t,{ZZ:()=>Be});var o,r,i,a=n(2816),s=n(8435),l=n(9149),c=Object.create,u=Object.defineProperty,d=Object.getOwnPropertyDescriptor,p=Object.getOwnPropertyNames,f=Object.getPrototypeOf,h=Object.prototype.hasOwnProperty,m=(e,t)=>function(){return t||(0,e[p(e)[0]])((t={exports:{}}).exports,t),t.exports},g=(o={'../../node_modules/.pnpm/tsup@8.4.0_@microsoft+api-extractor@7.51.1_@types+node@22.13.14__jiti@2.4.2_postcss@8.5_96eb05a9d65343021e53791dd83f3773/node_modules/tsup/assets/esm_shims.js'(){}},function(){return o&&(r=(0,o[p(o)[0]])(o=0)),r}),v=m({'../../node_modules/.pnpm/speakingurl@14.0.1/node_modules/speakingurl/lib/speakingurl.js'(e,t){g(),function(e){var n={À:'A',Á:'A',Â:'A',Ã:'A',Ä:'Ae',Å:'A',Æ:'AE',Ç:'C',È:'E',É:'E',Ê:'E',Ë:'E',Ì:'I',Í:'I',Î:'I',Ï:'I',Ð:'D',Ñ:'N',Ò:'O',Ó:'O',Ô:'O',Õ:'O',Ö:'Oe',Ő:'O',Ø:'O',Ù:'U',Ú:'U',Û:'U',Ü:'Ue',Ű:'U',Ý:'Y',Þ:'TH',ß:'ss',à:'a',á:'a',â:'a',ã:'a',ä:'ae',å:'a',æ:'ae',ç:'c',è:'e',é:'e',ê:'e',ë:'e',ì:'i',í:'i',î:'i',ï:'i',ð:'d',ñ:'n',ò:'o',ó:'o',ô:'o',õ:'o',ö:'oe',ő:'o',ø:'o',ù:'u',ú:'u',û:'u',ü:'ue',ű:'u',ý:'y',þ:'th',ÿ:'y',ẞ:'SS',ا:'a',أ:'a',إ:'i',آ:'aa',ؤ:'u',ئ:'e',ء:'a',ب:'b',ت:'t',ث:'th',ج:'j',ح:'h',خ:'kh',د:'d',ذ:'th',ر:'r',ز:'z',س:'s',ش:'sh',ص:'s',ض:'dh',ط:'t',ظ:'z',ع:'a',غ:'gh',ف:'f',ق:'q',ك:'k',ل:'l',م:'m',ن:'n',ه:'h',و:'w',ي:'y',ى:'a',ة:'h'
