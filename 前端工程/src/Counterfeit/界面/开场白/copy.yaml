# ============================================================
# 《Counterfeit》开场白界面 · 文案配置（主副本）
# ============================================================
# 【怎么用】
#   1. 直接改本文件里你想调整的文本（各段都有注释标注）。
#   2. 改完告诉 agent：「同步开场白文案」。
#      agent 会把本文件复制到 tavern_helper_template/src/Counterfeit/界面/开场白/copy.yaml 并重新构建。
# 【注意】
#   - 缩进必须保持 YAML 格式（两个空格一层），引号/竖线符号照原样保留。
#   - 多行文本用 |- 开头，下面每行缩进两个空格；空行 = 段落分隔。
#   - 图片相关字段（portrait / image）只填文件名，图片本体由 agent 放进素材目录。
# ============================================================

# ---------- 标题画面 ----------
title:
  # 主标题：官方 logo 配色——俺・青春ラブコメは・いる 用粉色，其余用蓝色
  # 每行可拆多段，每段独立配色（白色描边统一保留），颜色可自由改（hex）
  lines:
    - segments:
        - { text: やはり, color: '#4aa8dd' }
        - { text: 俺, color: '#f0679f' }
        - { text: の, color: '#4aa8dd' }
        - { text: 青春ラブコメは, color: '#f0679f' }
    - segments:
        - { text: まちがって, color: '#4aa8dd' }
        - { text: いる, color: '#f0679f' }
        - { text: 。, color: '#4aa8dd' }
  # 副标题（金色手写体）
  subtitle: Counterfeit

# ---------- 玩法模式切换（视角选择屏顶部） ----------
